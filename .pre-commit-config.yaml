# Pre-commit hooks for homelab GitOps validation
# See https://pre-commit.com for more information
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Level-0 static verification (render + lint + kubeconform + pluto + gitops graph +
  # snapshots + conftest policy). Replaces the former helm-lint/helm-template/kubeconform
  # hooks; no -skip lists — CRD schemas are vendored under tests/schemas.
  - repo: local
    hooks:
      - id: verify-level-0
        name: Verify (level 0)
        entry: task verify:text
        language: system
        pass_filenames: false
        files: ^(charts/|configuration/|tests/(schemas|policy|gitops|snapshots|health|e2e)/|localdev/|internal/verify/|cmd/homelab/commands/verify)

      # This is the same scan scope as DefaultGuardPathspecs and
      # guardScanExtensions in internal/config/guard.go, expressed a second
      # time for the hook. It is one scope written twice: change both in the
      # same commit or the hook and CI drift, and a tree guarded in CI stops
      # being guarded before you push. The extension list is spelled out here
      # rather than left to `types_or:` so the two can be diffed by eye:
      # yaml/yml/json/md/ts/svg/hcl/tf, and terragrunt/ talos/ packer/ joined
      # the directory list with the .hcl/.tf admission that makes them
      # readable. The trailing (example|template|sample|dist) group mirrors
      # hasScannableExtension looking through a template suffix: without it the
      # hook silently dropped homelab.yaml.example and homelab.yml.example,
      # the two files the guard most wants to read, while CI still scanned
      # them.

      - id: config-guard
        name: PII Guard
        entry: go run ./cmd/homelab config guard --set homelab --
        language: system
        pass_filenames: true
        types: [text]
        files: ^(Taskfile\.yml|charts/.*/values-homelab\.yaml|(configuration|scripts|docs|\.github|ansible|terragrunt|talos|packer)/.*\.(yaml|yml|json|md|ts|svg|hcl|tf)(\.(example|template|sample|dist))?)$
        exclude: |
          (?x)(
            ^configuration/environments/homelab\.yaml$|
            \.generated\.
          )

      - id: cmp-version-bump
        name: Auto-bump CMP version
        entry: bun scripts/cmp-version-bump.ts
        language: system
        pass_filenames: false
        files: ^(cmd/|internal/|cmp/|Dockerfile\.cmp)
        stages: [pre-commit]

      - id: config-export
        name: Auto-export config on changes
        entry: bun scripts/config-export-hook.ts
        language: system
        pass_filenames: false
        files: ^configuration/(schema/|environments/|versions\.yaml$|templates/)
        stages: [pre-commit]

  # YAML validation (non-template files)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        exclude: ^charts/.*/templates/

  # Terraform/Terragrunt formatting
  # v1.105.0+ supports terragrunt 0.78+ which replaced `hclfmt` with `hcl format`
  # (mise.toml pins terragrunt 1.x, which only supports the new CLI).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terragrunt_fmt

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(charts/.*/templates/|tests/snapshots/)
      - id: end-of-file-fixer
        exclude: ^(charts/.*/templates/|tests/snapshots/)
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/
      - id: check-added-large-files
        args: [--maxkb=1000]
        # tests/schemas is generated by scripts/crd-schemas-vendor.ts from the chart pins in
        # configuration/versions.yaml; CRD schemas such as cronworkflow (2.4 MB) and
        # applicationset (1.8 MB) are legitimately large text, not accidental binaries.
        exclude: ^tests/schemas/
      - id: check-merge-conflict
      - id: detect-private-key

# Note: Secret detection (gitleaks) runs in CI via .github/workflows/security-scan.yml
# Local gitleaks hook removed due to Go version compatibility issues

# CI configuration
ci:
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
