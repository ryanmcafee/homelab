# Source: openclaw-operator/templates/rbac.yaml
# OpenClawClusterDefaults is cluster-scoped (#457). Even when watching specific
# namespaces, the operator must be granted access via a ClusterRole -- a
# namespaced Role cannot grant access to a cluster-scoped resource, so without
# this the manager cache fails to sync and the operator shuts down (#529).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-operator-manager-role-cluster
  labels:
    helm.sh/chart: openclaw-operator-0.40.0
    app.kubernetes.io/name: openclaw-operator
    app.kubernetes.io/instance: openclaw-operator
    app.kubernetes.io/version: "0.40.0"
    app.kubernetes.io/managed-by: Helm
rules:
  # OpenClawClusterDefaults singleton (#457)
  - apiGroups: ["openclaw.rocks"]
    resources: ["openclawclusterdefaults"]
    verbs: ["get", "list", "watch"]

---

# Source: openclaw-operator/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-operator-manager-rolebinding-cluster
  labels:
    helm.sh/chart: openclaw-operator-0.40.0
    app.kubernetes.io/name: openclaw-operator
    app.kubernetes.io/instance: openclaw-operator
    app.kubernetes.io/version: "0.40.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-operator-manager-role-cluster
subjects:
  - kind: ServiceAccount
    name: openclaw-operator
    namespace: openclaw-system

---

