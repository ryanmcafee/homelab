# Child chart owned by the cert-manager-cluster-issuer Application
# (addons, wave 1), one wave after the cert-manager CRD provider.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: admin@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
