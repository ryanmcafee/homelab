# A child chart the renderer produced but no Application in this environment
# deploys (the usual localdev case: the chart exists, its parent toggle is
# off). It has no position in the sync order, so crd-order must skip it rather
# than report it.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
