# Owned by the demo-dependencies Application. The CronWorkflow verifies a host
# that no Ingress, IngressRoute or Application value in this environment
# serves — the shape of listing an Application that is disabled (rule
# verified-hosts). Nothing renders the argo-workflows provider either, so it
# is a second crd-order violation next to the ClusterIssuer.
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: ingress-verification
  namespace: kube-system
spec:
  schedule: "0 6 * * *"
  workflowSpec:
    entrypoint: verify-all-ingresses
    templates:
      - name: verify-all-ingresses
        dag:
          tasks:
            - name: verify-homeassistant
              template: verify-ingress
              arguments:
                parameters:
                  - name: name
                    value: "homeassistant"
                  - name: url
                    value: "https://homeassistant.example.com"
      - name: verify-ingress
        inputs:
          parameters:
            - name: name
            - name: url
        container:
          image: curlimages/curl:8.5.0
          env:
            - name: URL
              value: "{{inputs.parameters.url}}"
