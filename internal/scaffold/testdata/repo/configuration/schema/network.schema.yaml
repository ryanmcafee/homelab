# Fixture network keys.
keys:
  DOMAIN:
    description: Base domain
    required: true

  GATEWAY_NAMESPACE:
    description: Namespace of the Envoy Gateways
    default: "envoy-gateway-system"

  GATEWAY_INTERNAL:
    description: Internal Gateway (LAN-only routes)
    default: "envoy-internal"

  # Computed hostnames — derived from DOMAIN
  GRAFANA_HOSTNAME:
    description: Grafana dashboard hostname
    const: "grafana.{{.DOMAIN}}"
