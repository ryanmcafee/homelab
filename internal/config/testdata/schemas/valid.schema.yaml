keys:
  DOMAIN:
    description: Base domain
    required: true
  IP_ADDR:
    description: An IP address
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"
  OPTIONAL_KEY:
    description: Optional with default
    required: false
    default: "fallback"
  COMPUTED:
    description: Computed from DOMAIN
    const: "app.{{.DOMAIN}}"
  COLOR:
    description: Color choice
    required: true
    enum:
      - red
      - green
      - blue
