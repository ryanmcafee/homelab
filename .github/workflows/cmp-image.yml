name: Build CMP Image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read CMP version
        id: version
        run: |
          VERSION=$(yq '.images.homelab-cmp' configuration/versions.yaml)
          echo "cmp_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version bumped
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base branch for comparison
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:configuration/versions.yaml | yq '.images.homelab-cmp')
          HEAD_VERSION=${{ steps.version.outputs.cmp_version }}

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning::CMP image version ($HEAD_VERSION) was not bumped. If CMP code changed, bump images.homelab-cmp in configuration/versions.yaml."
          else
            echo "CMP version bumped: $BASE_VERSION -> $HEAD_VERSION"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.cmp
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:latest
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:${{ steps.version.outputs.cmp_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.19'

      - name: Run config tests
        run: go test ./internal/config/... -v
