name: Build CMP Image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read CMP version
        id: version
        run: |
          VERSION=$(yq '.images.homelab-cmp' configuration/versions.yaml)
          echo "cmp_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version bumped
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base branch for comparison
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:configuration/versions.yaml | yq '.images.homelab-cmp')
          HEAD_VERSION=${{ steps.version.outputs.cmp_version }}

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning::CMP image version ($HEAD_VERSION) was not bumped. If CMP code changed, bump images.homelab-cmp in configuration/versions.yaml."
          else
            echo "CMP version bumped: $BASE_VERSION -> $HEAD_VERSION"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.cmp
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:latest
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:${{ steps.version.outputs.cmp_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'

      - name: Run config tests
        run: go test ./internal/config/... -v
