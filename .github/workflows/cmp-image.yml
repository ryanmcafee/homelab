name: Build CMP Image

# Publishes a multi-platform image (linux/amd64 + linux/arm64). amd64 is what
# the Talos cluster runs; arm64 is what an Apple Silicon workstation needs to
# run `task test:cmp-parity` without --platform emulation.
#
# The Go build cross-compiles (Dockerfile.cmp pins its builder stage to
# $BUILDPLATFORM and honours $TARGETARCH), so only the small runtime stage
# (`apk add helm`) is emulated per non-native architecture.

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - 'cmp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read CMP version
        id: version
        run: |
          VERSION=$(yq '.images.homelab-cmp' configuration/versions.yaml)
          echo "cmp_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version bumped
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base branch for comparison
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:configuration/versions.yaml | yq '.images.homelab-cmp')
          HEAD_VERSION=${{ steps.version.outputs.cmp_version }}

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning::CMP image version ($HEAD_VERSION) was not bumped. If CMP code changed, bump images.homelab-cmp in configuration/versions.yaml."
          else
            echo "CMP version bumped: $BASE_VERSION -> $HEAD_VERSION"
          fi

      # Needed for the runtime stage only: `apk add` runs as the target
      # architecture, so a non-native platform needs binfmt emulation. The Go
      # build itself never touches QEMU (see Dockerfile.cmp).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms are built on a pull request too (push: false discards
      # the result), so an arm64-only breakage is caught before merge rather
      # than on the push that publishes.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.cmp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:latest
            ghcr.io/${{ github.repository_owner }}/homelab-cmp:${{ steps.version.outputs.cmp_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'

      - name: Run config tests
        run: go test ./internal/config/... -v
