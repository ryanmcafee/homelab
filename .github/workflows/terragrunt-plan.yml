name: Terragrunt Plan

on:
  pull_request:
    paths:
      - 'terragrunt/**'
      - '.github/workflows/terragrunt-plan.yml'

env:
  TERRAGRUNT_VERSION: '0.55.1'
  TERRAFORM_VERSION: '1.7.5'

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [localdev, homelab]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Terragrunt Format Check
        run: |
          cd terragrunt
          terragrunt hclfmt --terragrunt-check

      - name: Terragrunt Plan (dry-run)
        run: |
          cd terragrunt/environments/${{ matrix.environment }}
          terragrunt run --all plan --non-interactive
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        continue-on-error: true  # Allow plan to fail for now (secrets may not be set)
