name: Terragrunt Plan

# Static verification of the Terragrunt tree on every pull request that
# touches it: HCL formatting plus `terraform validate` for every unit of both
# environments (provider schemas are downloaded; no state, no API calls;
# dependency outputs come from the units' mock_outputs).
#
# A real `plan` cannot run on GitHub-hosted runners: Proxmox, TrueNAS and the
# UniFi gateway live on the homelab LAN, the credentials come from 1Password
# (`op run --env-file .env.op`), and the talos-cluster unit reads rendered
# manifests that are gitignored (`task render:pull`). Plans stay a human step
# (`task tf:plan`, ADR-009); this workflow makes sure what gets planned parses
# and type-checks. Until this rewrite the plan step ran a terragrunt 0.55 CLI
# with 1.x syntax and hid the resulting "no command named run" error behind
# continue-on-error, so the job was green without checking anything.
#
# Tool pins mirror configuration/versions.yaml (terraform) and mise.toml
# (terragrunt); every pin carries a Renovate marker so a bump lands here too.

on:
  pull_request:
    paths:
      - 'terragrunt/**'
      - '.github/workflows/terragrunt-plan.yml'
  workflow_dispatch:

concurrency:
  group: terragrunt-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: '1.16.2'
  # renovate: datasource=github-releases depName=gruntwork-io/terragrunt
  TERRAGRUNT_VERSION: 'v1.0.8'

jobs:
  validate:
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [localdev, homelab]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # terraform_wrapper: false gives terragrunt the real binary; the wrapper
      # script breaks its output handling.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          export PATH="$HOME/bin:$PATH"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/terragrunt" "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x "$HOME/bin/terragrunt"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          terraform version
          terragrunt --version

      - name: Terragrunt HCL format check
        working-directory: terragrunt
        run: terragrunt hcl fmt --check

      # Inputs that only exist on a workstation. `terraform validate` never
      # reads their contents, but Terragrunt evaluates file() while parsing
      # the unit configuration, so the paths have to exist.
      - name: Stub workstation-only inputs
        run: |
          set -euo pipefail
          mkdir -p terragrunt/files "$HOME/.ssh"
          for f in cilium kubelet-csr-approver spegel; do
            [ -f "terragrunt/files/$f-rendered.yaml" ] || echo "# stub for terraform validate in CI (task render:pull produces the real file)" > "terragrunt/files/$f-rendered.yaml"
          done
          [ -f "$HOME/.ssh/id_ed25519" ] || ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"

      - name: Terragrunt validate (${{ matrix.environment }})
        working-directory: terragrunt/environments/${{ matrix.environment }}
        run: terragrunt run --all validate --non-interactive
