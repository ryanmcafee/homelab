name: Terragrunt Plan

# Static verification of the Terragrunt tree on every pull request that
# touches it: HCL formatting plus `terraform validate` for every unit of both
# environments (provider schemas are downloaded; no state, no API calls;
# dependency outputs come from the units' mock_outputs).
#
# A real `plan` cannot run on GitHub-hosted runners: Proxmox, TrueNAS and the
# UniFi gateway live on the homelab LAN, the credentials come from 1Password
# (`op run --env-file .env.op`), and the talos-cluster unit reads rendered
# manifests that are gitignored (`task render:pull`). Plans stay a human step
# (`task tf:plan`, ADR-009); this workflow makes sure what gets planned parses
# and type-checks. Until this rewrite the plan step ran a terragrunt 0.55 CLI
# with 1.x syntax and hid the resulting "no command named run" error behind
# continue-on-error, so the job was green without checking anything.
#
# Tools come from mise.toml through jdx/mise-action, so CI runs the same
# terraform, terragrunt and op versions as a workstation (only those three are
# installed). No 1Password login is configured: the job holds no secrets.

on:
  pull_request:
    paths:
      - 'terragrunt/**'
      # env.hcl resolves from the ConfigSet, so a schema or environment change
      # can break `terragrunt validate` without touching terragrunt/.
      - 'configuration/**'
      - 'mise.toml'
      - '.github/workflows/terragrunt-plan.yml'
  workflow_dispatch:

concurrency:
  group: terragrunt-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [localdev, homelab]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install terraform, terragrunt, op and go from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: terraform terragrunt op go

      - name: Tool versions
        run: |
          terraform version
          terragrunt --version
          op --version
          go version

      - name: Terragrunt HCL format check
        working-directory: terragrunt
        run: terragrunt hcl fmt --check

      # Inputs that only exist on a workstation. `terraform validate` never
      # reads their contents, but Terragrunt evaluates file() while parsing
      # the unit configuration, so the paths have to exist.
      - name: Stub workstation-only inputs
        run: |
          set -euo pipefail
          mkdir -p terragrunt/files "$HOME/.ssh"
          for f in cilium kubelet-csr-approver spegel; do
            [ -f "terragrunt/files/$f-rendered.yaml" ] || echo "# stub for terraform validate in CI (task render:pull produces the real file)" > "terragrunt/files/$f-rendered.yaml"
          done
          [ -f "$HOME/.ssh/id_ed25519" ] || ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"

      # env.hcl resolves every address, the domain and the LAN CIDR from the
      # ConfigSet, so the export has to run before terragrunt parses anything.
      # This is not a stub: it is the same `homelab config export` a workstation
      # runs, which is what makes CI catch a key that env.hcl reads and no
      # schema declares. homelab.yaml is gitignored, so the committed
      # homelab.yaml.example stands in for it — CI therefore validates against
      # the file a fork actually starts from.
      - name: Export the ConfigSet env.hcl reads
        run: |
          set -euo pipefail
          go run ./cmd/homelab config export --set localdev --format json
          go run ./cmd/homelab config export --set homelab --format json \
            --env-file configuration/environments/homelab.yaml.example

      # mise.toml exports TF_PLUGIN_CACHE_DIR for workstations; a shared cache
      # races across the parallel unit inits here, and an empty value disables it.
      - name: Terragrunt validate (${{ matrix.environment }})
        working-directory: terragrunt/environments/${{ matrix.environment }}
        env:
          TF_PLUGIN_CACHE_DIR: ''
        run: terragrunt run --all validate --non-interactive
