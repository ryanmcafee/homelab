---
name: Sync Tailscale ACLs

# Test-on-PR / apply-on-merge sync of the Tailscale ACL to the tailnet via
# tailscale/gitops-acl-action.
#
# The policy is committed ENCRYPTED as policy.sops.hujson (SOPS + age, whole-file
# binary store) so the LAN CIDR PII never appears in cleartext in the repo. CI
# decrypts it to ./policy.hujson at runtime using the SOPS_AGE_KEY secret; the
# decrypted policy.hujson is gitignored and never committed.
#
# The CI OAuth client is scoped to policy_file (plus the device scopes Tailscale
# now force-bundles with it — see ADR-009) and is referenced from GitHub Actions
# secrets — no credentials are inline.
#
# ORDERING (Pitfall 1): the apply on push to main must run (policy live) BEFORE
# Plan 03 deploys the Connector, or the advertised route stays unapproved.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'policy.sops.hujson'
      - '.github/workflows/tailscale-acl.yml'
  push:
    branches:
      - main
    paths:
      - 'policy.sops.hujson'
      - '.github/workflows/tailscale-acl.yml'

permissions:
  contents: read
  # NOTE: using the oauth-secret auth method (Assumption A1, simpler than
  # federated OIDC). Switching to federated audience/OIDC auth would require
  # adding `id-token: write` here.

jobs:
  test:
    # Test runs only on pull_request — validates that the policy compiles
    # before merge (gitops-acl-action `test` mode).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout IS SHA-pinned (general third-party action, stricter
      # supply-chain posture) — matches the form used across this repo.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Install a pinned sops and verify its checksum, then decrypt the policy.
      # sops has built-in age support, so no separate age binary is needed.
      - name: Decrypt ACL policy (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          ver=v3.11.0
          base="https://github.com/getsops/sops/releases/download/${ver}"
          curl -fsSL -o "sops-${ver}.linux.amd64" "${base}/sops-${ver}.linux.amd64"
          curl -fsSL -o sops.checksums.txt "${base}/sops-${ver}.checksums.txt"
          grep " sops-${ver}.linux.amd64$" sops.checksums.txt | sha256sum -c -
          sudo install -m 0755 "sops-${ver}.linux.amd64" /usr/local/bin/sops
          sops -d policy.sops.hujson > policy.hujson
          rm -f "sops-${ver}.linux.amd64" sops.checksums.txt

      # gitops-acl-action stays at the floating @v1 major tag on BOTH the test
      # and apply jobs by design (threat T-01-SC, disposition "accept"):
      # first-party Tailscale action with no transitive package installs. The
      # asymmetry vs the SHA-pinned checkout above is intentional, not an
      # oversight. Do not partially SHA-pin one job and not the other.
      - name: Test ACL (pull request)
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test
          # policy-file defaults to ./policy.hujson (decrypted above).

  apply:
    # Apply runs only on push to main, gated behind the production environment
    # for a manual-approval gate on the destructive apply (matches
    # terragrunt-apply.yml).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Decrypt ACL policy (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          ver=v3.11.0
          base="https://github.com/getsops/sops/releases/download/${ver}"
          curl -fsSL -o "sops-${ver}.linux.amd64" "${base}/sops-${ver}.linux.amd64"
          curl -fsSL -o sops.checksums.txt "${base}/sops-${ver}.checksums.txt"
          grep " sops-${ver}.linux.amd64$" sops.checksums.txt | sha256sum -c -
          sudo install -m 0755 "sops-${ver}.linux.amd64" /usr/local/bin/sops
          sops -d policy.sops.hujson > policy.hujson
          rm -f "sops-${ver}.linux.amd64" sops.checksums.txt

      - name: Apply ACL (merge to main)
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
          # policy-file defaults to ./policy.hujson (decrypted above).
