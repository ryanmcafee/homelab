name: Verify (Kind, levels 1-2)

# Cluster-backed verification of the GitOps repository on a Kind cluster
# (issue #261, Section B). Nothing here touches the homelab cluster.
#
#   kind-argocd  task localdev:ci        Kind (Cilium, registry caches, fakes) -> ArgoCD ->
#                                        every Application synced from the working tree
#                                        (argocd app sync --local) -> wait Healthy -> chainsaw e2e
#                task verify LEVEL=2     level 0 + server-side dry run (dryrun/localdev/<chart>)
#                                        + Application state (argocd/<app>) + e2e (e2e/<test>)
#   kind-direct  tilt ci                 Tilt direct mode (a few charts installed straight
#                                        into Kind, no ArgoCD); asserts Envoy Gateway + cert-manager
#   yaml-lint    yamllint                charts/, localdev/, tests/e2e, tests/health
#
# kind-argocd is advisory today but can become required once its reliability
# is proven: every PR publishes its check run. It has no continue-on-error, and
# a failing Application, e2e test or dry run fails the job. Its Job Summary lists
# every non-passing check and the verify-level2 artifact carries the full JSON.
#
# kind-argocd checks out the PR head commit (not the merge ref, which ArgoCD
# cannot fetch) and installs the root Application at that SHA
# (LOCALDEV_REVISION), so every Application in Kind tracks the PR head while
# the working tree is synced into it with --local. Fork PRs keep the default
# checkout and the loop falls back to main.
#
# On pull requests kind-argocd also runs `task localdev:report` (issue #261
# item 17): the Application table, the failing level-2 checks and `argocd app
# diff --revision <base>` of every git-path Application, so each diff is this
# PR vs its base branch. The report goes to the Job Summary, the
# verify-level2 artifact (kind-report.md) and, for same-repository PRs (fork
# tokens cannot comment), a separate checkout-free job posts the sticky comment
# `kind-preview`. The report step is continue-on-error: it never decides the check.
#
# Tool versions mirror configuration/versions.yaml (the single source of truth)
# and mise.toml; every pin below carries a Renovate marker so a bump lands here
# too. Docker ships with ubuntu-latest, as do jq and yq (scripts/localdev-kind.ts
# reads versions.yaml with yq); kind needs no further setup.

on:
  # Every PR must publish the level-2 context. The job condition below skips
  # irrelevant PRs while still publishing a skipped check run (ADR-039).
  pull_request:
  # Merge-group candidates always run level 2: once a change reaches the final
  # merge path, level 2 is the authoritative integration verdict.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'localdev/**'
      - 'Tiltfile'
      - 'scripts/**'
      - 'configuration/**'
      - 'tests/e2e/**'
      - 'tests/health/**'
      - 'Taskfile.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/tilt-ci.yml'
  workflow_dispatch:

# Superseded pushes to a PR cancel each other; pushes to main do not, so every
# merged commit keeps its own level-2 verdict.
concurrency:
  group: tilt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The fail-fast step cancels this PR's other CI runs once a job fails.
  actions: write

# Tools come from mise.toml through jdx/mise-action (same pins as verify.yml
# and a workstation).
env:
  # Every kubectl/argocd call in the scripts pins this context (ADR-009).
  KIND_CONTEXT: kind-homelab-localdev

jobs:
  changed-paths:
    name: Classify level-2 paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      # No checkout: untrusted PR code must not control this gate. The workflow
      # itself is a protected review surface. Query the base repository API so
      # fork PRs need only the base repository's read-only token.
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          total="$(gh api "$pr" --jq '.changed_files')"
          [[ "$total" =~ ^[0-9]+$ ]] || { echo '::error::Missing changed_files count'; exit 1; }
          gh api --paginate "$pr/files?per_page=100" > "$RUNNER_TEMP/level2-files.json"
          # GitHub caps the files endpoint at 3,000 entries. A capped or
          # incomplete response runs Kind; it must never produce a green skip.
          relevant="$(jq -rs --argjson total "$total" '
            [ .[][] ] as $files
            | if ($files | length) == 0 then error("PR files API returned no paths")
              elif $total >= 3000 or ($files | length) != $total then true
              else any($files[];
                (.filename, (.previous_filename // ""))
                | test("^(charts/|localdev/|scripts/|configuration/|tests/(e2e|health)/|cmd/|internal/|Tiltfile$|Taskfile\\.yml$|go\\.mod$|go\\.sum$|mise\\.toml$|package\\.json$|bun\\.lock$|tsconfig\\.json$|biome\\.json$|\\.github/workflows/tilt-ci\\.yml$)")
              ) end
          ' "$RUNNER_TEMP/level2-files.json")"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Kind + ArgoCD loop: advisory today, eligible for a future required context
  # ============================================================================
  kind-argocd:
    name: Kind + ArgoCD loop (level 2)
    needs: changed-paths
    # A failed path lookup must never turn into a green skipped cluster check.
    # Push and merge-group runs execute; an irrelevant PR publishes skipped.
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
        || needs.changed-paths.result != 'success'
        || needs.changed-paths.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    # Measured p95 41m (n=23, 2026-11-15..21); a p95 past 50m is a regression to cut (MCAA-1232).
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      # The fail-fast step cancels this PR's other CI runs once a job fails.
      actions: write
    env:
      # The revision scripts/localdev-argocd.ts install gives the root
      # Application: the PR head for same-repository PRs, the pushed commit on
      # main. Empty (fork PRs) falls back to the upstream branch, then main.
      LOCALDEV_REVISION: >-
        ${{ (github.event_name == 'pull_request'
             && github.event.pull_request.head.repo.full_name == github.repository
             && github.event.pull_request.head.sha)
          || (github.event_name == 'merge_group' && github.event.merge_group.head_sha)
          || (github.event_name == 'push' && github.sha)
          || '' }}
    steps:
      # Same-repository PRs test the head commit itself: it is the commit ArgoCD
      # is told to track (LOCALDEV_REVISION), and GitHub's merge ref is not
      # fetchable by ArgoCD. Fork PRs keep the default (merge) checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: >-
            ${{ (github.event_name == 'pull_request'
                 && github.event.pull_request.head.repo.full_name == github.repository
                 && github.event.pull_request.head.sha)
              || (github.event_name == 'merge_group' && github.event.merge_group.head_sha)
              || '' }}

      # level 2 includes level 0, so the level-0 tools come along.
      - name: Install go, helm, bun, kind, kubectl, argocd, chainsaw, tilt, task, kubeconform, conftest, pluto from mise.toml
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go helm bun kind kubectl argocd aqua:kyverno/chainsaw tilt task kubeconform conftest pluto

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          argocd version --client
          chainsaw version
          tilt version
          task --version

      - name: Cache kubeconform core schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/homelab-kubeconform
          key: kubeconform-${{ hashFiles('configuration/versions.yaml') }}

      # The registry pull-through caches (scripts/localdev-kind.ts registry)
      # persist their blobs under ~/.cache/homelab-kind-registry; a warm cache
      # turns most image pulls into local reads. Restore and save are separate
      # steps (MCAA-660, guarded by scripts/tilt-ci-cache_test.ts):
      #   - actions/cache declares post-if: success(), so a combined step never
      #     saves on the timed-out runs a cold cache causes.
      #   - Only main pushes save. GitHub scopes a cache to the ref that wrote
      #     it; main's entries are restorable from every PR and merge group,
      #     while a PR-ref entry (~5 GiB) only evicted main's from the 10 GiB
      #     budget and was readable by nobody else.
      #   - The save key carries a fingerprint of the blob set, so an unchanged
      #     set is not re-uploaded and a grown one becomes a new generation.
      # Best effort: every hosts.toml lists the upstream as a fallback, so an
      # empty or evicted cache only costs pull time.
      - name: Restore registry pull-through cache (best effort)
        id: registry-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/homelab-kind-registry
          key: kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml', 'localdev/values/argocd-values.yaml') }}
          restore-keys: |
            kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml') }}-
            kind-registry-

      - name: Registry cache restore result
        env:
          MATCHED_KEY: ${{ steps.registry-cache.outputs.cache-matched-key }}
        run: |
          echo "matched key: ${MATCHED_KEY:-none (cold start)}"
          du -sh ~/.cache/homelab-kind-registry 2>/dev/null || echo "no registry cache on disk"

      # kind -> argocd -> sync every Application from the working tree ->
      # wait until Healthy/Succeeded; the verify step runs chainsaw e2e. Non-interactive; on a
      # timeout `localdev:wait` prints the diagnostics before exiting 1.
      - name: task localdev:ci
        run: task localdev:ci

      - name: task verify LEVEL=2
        id: verify
        run: |
          set -o pipefail
          task verify LEVEL=2 | tee verify-level2.json

      - name: Fingerprint registry blobs
        id: registry-blobs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MATCHED_KEY: ${{ steps.registry-cache.outputs.cache-matched-key }}
          KEY_PREFIX: kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml') }}
        run: |
          dir=~/.cache/homelab-kind-registry
          if [ ! -d "$dir" ]; then echo "no registry cache on disk; nothing to save"; exit 0; fi
          blobs=$(find "$dir" -path '*/blobs/*' -name data | wc -l)
          fingerprint=$(find "$dir" -path '*/blobs/*' -name data -printf '%P\n' | sort | sha256sum | cut -c1-16)
          key="$KEY_PREFIX-$fingerprint"
          echo "blobs=$blobs size=$(du -sh "$dir" | cut -f1) key=$key"
          if [ "$blobs" -eq 0 ] || [ "$key" = "$MATCHED_KEY" ]; then
            echo "blob set empty or unchanged since restore; skipping save"
            exit 0
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Save registry pull-through cache (main, even on failure)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.registry-blobs.outputs.fingerprint != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/homelab-kind-registry
          key: kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml') }}-${{ steps.registry-blobs.outputs.fingerprint }}

      - name: Summary
        if: always()
        run: |
          # task prints its own failure line after the JSON; keep only the object.
          if [ -f verify-level2.json ] && sed -n '/^{/,/^}/p' verify-level2.json > verify-level2.clean.json && jq -e . verify-level2.clean.json >/dev/null 2>&1; then
            mv verify-level2.clean.json verify-level2.json
            {
              echo "## Level 2 verification (Kind)"
              echo
              jq -r '"**Result:** \(if .pass then "PASS ✅" else "FAIL ❌" end) in \(.duration_ms) ms"' verify-level2.json
              echo
              echo "| Check | Status | ms | Findings |"
              echo "|---|---|---:|---:|"
              jq -r '.checks[] | select(.status != "pass") | "| \(.name) | \(.status) | \(.duration_ms) | \(.findings // [] | length) |"' verify-level2.json
              echo
              jq -r '.checks[] | select(.status == "fail") | "### \(.name)\n\(.detail // "")\n" + ((.findings // []) | map("- " + .) | join("\n"))' verify-level2.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Level 2 verification (Kind)"
              echo
              echo "verify-level2.json was not written: task localdev:ci failed before the verify step (see its log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR head vs its base branch as ArgoCD sees it (argocd app diff
      # --revision <base>). Tolerates a missing or partial
      # verify-level2.json and an unreachable ArgoCD (it says so in the
      # report). !cancelled() rather than always(): a run superseded by a newer
      # push must not spend its grace period posting a stale comment.
      - name: Kind report (task localdev:report)
        id: report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          task localdev:report -- --out kind-report.md --verify-json verify-level2.json --base "${{ github.base_ref || 'main' }}"
          tee -a "$GITHUB_STEP_SUMMARY" < kind-report.md > /dev/null
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Diagnostics
        if: always()
        run: |
          {
            task localdev:diagnose || true
            echo "=== Applications ==="
            kubectl --context "$KIND_CONTEXT" -n argocd get applications.argoproj.io -o wide || true
            echo "=== Pods ==="
            kubectl --context "$KIND_CONTEXT" get pods -A || true
            echo "=== ArgoCD pod descriptions (including image pull events) ==="
            kubectl --context "$KIND_CONTEXT" -n argocd get pods -o name 2>/dev/null |
              while IFS= read -r pod; do
                echo "--- $pod ---"
                kubectl --context "$KIND_CONTEXT" -n argocd describe "$pod" || true
              done
            echo "=== ArgoCD events ==="
            kubectl --context "$KIND_CONTEXT" -n argocd get events --sort-by=.lastTimestamp || true
            echo "=== ECR Public registry cache logs ==="
            docker logs kind-registry-ecr 2>&1 || true
            echo "=== Docker Hub registry cache logs ==="
            docker logs kind-registry-docker 2>&1 || true
            echo "=== Host kernel, AppArmor and LSM denials ==="
            uname -a || true
            sudo aa-status 2>&1 | head -n 40 || true
            sudo dmesg 2>&1 | grep -iE 'apparmor="DENIED"|avc:|denied' | tail -n 50 || true
            echo "=== local-path volume directories on each node ==="
            for node in $(kind get nodes --name "${KIND_CONTEXT#kind-}" 2>/dev/null); do
              echo "--- $node ---"
              docker exec "$node" sh -c 'ls -la /opt/local-path-provisioner/ /opt/local-path-provisioner/*/' 2>&1 | head -n 80 || true
            done
          } | tee kind-bootstrap-diagnostics.txt

      # The registry containers write their blobs as root. actions/cache tars
      # the directory as the runner user in its post step, so hand it back.
      - name: Make the registry cache readable for actions/cache
        if: always()
        run: |
          if [ -d "$HOME/.cache/homelab-kind-registry" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/homelab-kind-registry"
            du -sh "$HOME/.cache/homelab-kind-registry" || true
          fi

      - name: Upload level-2 JSON and Kind report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-level2
          path: |
            verify-level2.json
            kind-report.md
            kind-bootstrap-diagnostics.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
        with:
          keep-own-run: ${{ !startsWith(github.head_ref, 'renovate/') }}

  # The optional sticky comment needs write access, so it runs separately
  # after the cluster job. This job never checks out or executes PR code.
  kind-report-comment:
    name: Publish Kind report comment
    needs: kind-argocd
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.kind-argocd.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download Kind report if available
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh run download "$GITHUB_RUN_ID" --name verify-level2 --dir "$RUNNER_TEMP/level2"; then
            if [ -s "$RUNNER_TEMP/level2/kind-report.md" ]; then
              echo 'available=true' >> "$GITHUB_OUTPUT"
            else
              echo '::notice::Level-2 artifact has no Kind report to comment.'
            fi
          else
            echo '::notice::No level-2 artifact to comment; see the Kind job.'
          fi
      - name: Sticky comment with the Kind report
        if: steps.report.outputs.available == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: kind-preview
          path: ${{ runner.temp }}/level2/kind-report.md

  # ============================================================================
  # Tilt direct mode: a few charts installed straight into Kind, no ArgoCD
  # ============================================================================
  kind-direct:
    name: Kind direct mode (tilt ci)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go, helm, bun, kind, kubectl, tilt, task from mise.toml
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go helm bun kind kubectl tilt task

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          kind version
          tilt version

      # Same cluster as the loop (Cilium CNI, fakes), without the registry
      # caches: this job pulls three charts' worth of images and does not
      # restore the cache, so the proxies would only add containers.
      - name: Create the Kind cluster
        run: task localdev:kind -- --no-registry

      - name: tilt ci (direct mode)
        working-directory: localdev
        run: tilt ci --timeout 15m

      - name: Pods and failed-pod logs
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl --context "$KIND_CONTEXT" get pods -A || { echo "no cluster (an earlier step failed)"; exit 0; }
          echo
          echo "=== Logs of pods not Running/Succeeded ==="
          kubectl --context "$KIND_CONTEXT" get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded -o json \
            | jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "--- $ns/$pod ---"
                kubectl --context "$KIND_CONTEXT" logs -n "$ns" "$pod" --all-containers --tail=50 || true
              done

      # Direct mode installs only the controller; Gateways Programmed is asserted by the kind-argocd e2e suite.
      - name: Envoy Gateway is available
        run: |
          kubectl --context "$KIND_CONTEXT" wait --for=condition=available --timeout=120s deployment/envoy-gateway -n envoy-gateway-system
          kubectl --context "$KIND_CONTEXT" wait --for=condition=established --timeout=60s crd/gatewayclasses.gateway.networking.k8s.io crd/gateways.gateway.networking.k8s.io crd/httproutes.gateway.networking.k8s.io
          kubectl --context "$KIND_CONTEXT" get svc -n envoy-gateway-system

      - name: cert-manager is available
        run: |
          kubectl --context "$KIND_CONTEXT" wait --for=condition=available --timeout=120s deployment/cert-manager -n cert-manager
          kubectl --context "$KIND_CONTEXT" get pods -n cert-manager

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
        with:
          keep-own-run: ${{ !startsWith(github.head_ref, 'renovate/') }}

  # ============================================================================
  # YAML lint (non-template files; .yamllint ignores charts/*/templates)
  # ============================================================================
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint from mise.toml
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: pipx:yamllint

      - name: yamllint
        run: yamllint -c .yamllint charts/ localdev/ tests/e2e tests/health

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
        with:
          keep-own-run: ${{ !startsWith(github.head_ref, 'renovate/') }}
