name: Verify (Kind, levels 1-2)

# Cluster-backed verification of the GitOps repository on a Kind cluster
# (issue #261, Section B). Nothing here touches the homelab cluster.
#
#   kind-argocd  task localdev:ci        Kind (Cilium, registry caches, fakes) -> ArgoCD ->
#                                        every Application synced from the working tree
#                                        (argocd app sync --local) -> wait Healthy -> chainsaw e2e
#                task verify LEVEL=2     level 0 + server-side dry run (dryrun/localdev/<chart>)
#                                        + Application state (argocd/<app>) + e2e (e2e/<test>)
#   kind-direct  tilt ci                 Tilt direct mode (a few charts installed straight
#                                        into Kind, no ArgoCD); asserts Traefik + cert-manager
#   yaml-lint    yamllint                charts/, localdev/, tests/e2e, tests/health
#
# kind-argocd is the required check: it has no continue-on-error, and a failing
# Application, e2e test or dry run fails the pull request. Its Job Summary lists
# every non-passing check and the verify-level2 artifact carries the full JSON.
#
# kind-argocd checks out the PR head commit (not the merge ref, which ArgoCD
# cannot fetch) and installs the root Application at that SHA
# (LOCALDEV_REVISION), so every Application in Kind tracks the PR head while
# the working tree is synced into it with --local. Fork PRs keep the default
# checkout and the loop falls back to main.
#
# On pull requests kind-argocd also runs `task localdev:report` (issue #261
# item 17): the Application table, the failing level-2 checks and `argocd app
# diff --revision <base>` of every git-path Application, so each diff is this
# PR vs its base branch. The report goes to the Job Summary, the
# verify-level2 artifact (kind-report.md) and, for same-repository PRs (fork
# tokens cannot comment), the sticky comment `kind-preview`. The report step is
# continue-on-error: it never decides the check.
#
# Tool versions mirror configuration/versions.yaml (the single source of truth)
# and mise.toml; every pin below carries a Renovate marker so a bump lands here
# too. Docker ships with ubuntu-latest, as do jq and yq (scripts/localdev-kind.ts
# reads versions.yaml with yq); kind needs no further setup.

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'localdev/**'
      - 'Tiltfile'
      - 'scripts/**'
      - 'configuration/**'
      - 'tests/e2e/**'
      - 'tests/health/**'
      - 'Taskfile.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.github/workflows/tilt-ci.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'localdev/**'
      - 'Tiltfile'
      - 'scripts/**'
      - 'configuration/**'
      - 'tests/e2e/**'
      - 'tests/health/**'
      - 'Taskfile.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.github/workflows/tilt-ci.yml'
  workflow_dispatch:

concurrency:
  group: tilt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: '1.25'
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: 'v0.33.0'
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: 'v1.37.0'
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 'v4.3.0'
  # renovate: datasource=github-releases depName=argoproj/argo-cd
  ARGOCD_VERSION: 'v3.5.2'
  # renovate: datasource=github-releases depName=kyverno/chainsaw
  CHAINSAW_VERSION: 'v0.2.15'
  # renovate: datasource=github-releases depName=tilt-dev/tilt
  TILT_VERSION: '0.37.3'
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: 'v3.46.4'
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: 'v0.7.0'
  # renovate: datasource=github-releases depName=open-policy-agent/conftest
  CONFTEST_VERSION: '0.70.0'
  # renovate: datasource=github-releases depName=FairwindsOps/pluto
  PLUTO_VERSION: '5.24.3'
  # Every kubectl/argocd call in the scripts pins this context (ADR-009).
  KIND_CONTEXT: kind-homelab-localdev

jobs:
  # ============================================================================
  # Kind + ArgoCD loop: the required check
  # ============================================================================
  kind-argocd:
    name: Kind + ArgoCD loop (level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read-only on contents: nothing is committed. pull-requests: write is
      # for the kind-preview sticky comment only.
      contents: read
      pull-requests: write
    env:
      # The revision scripts/localdev-argocd.ts install gives the root
      # Application: the PR head for same-repository PRs, the pushed commit on
      # main. Empty (fork PRs) falls back to the upstream branch, then main.
      LOCALDEV_REVISION: >-
        ${{ (github.event_name == 'pull_request'
             && github.event.pull_request.head.repo.full_name == github.repository
             && github.event.pull_request.head.sha)
          || (github.event_name == 'push' && github.sha)
          || '' }}
    steps:
      # Same-repository PRs test the head commit itself: it is the commit ArgoCD
      # is told to track (LOCALDEV_REVISION), and GitHub's merge ref is not
      # fetchable by ArgoCD. Fork PRs keep the default (merge) checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: >-
            ${{ (github.event_name == 'pull_request'
                 && github.event.pull_request.head.repo.full_name == github.repository
                 && github.event.pull_request.head.sha)
              || '' }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # kubectl is published on dl.k8s.io, not on the kubernetes/kubernetes
      # release page; the Renovate marker still tracks that repository's tags.
      - name: Install kind, kubectl, argocd, chainsaw, tilt, task, kubeconform, conftest, pluto
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          export PATH="$HOME/bin:$PATH"
          # level 2 includes level 0, which needs kubeconform, conftest and pluto (same pins as verify.yml)
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/bin" kubeconform
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/bin" conftest
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/FairwindsOps/pluto/releases/download/v${PLUTO_VERSION}/pluto_${PLUTO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" pluto
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/argocd" "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" chainsaw
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz" | tar -xz -C "$HOME/bin" tilt
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" task
          chmod +x "$HOME/bin"/*
          echo "$HOME/bin" >> "$GITHUB_PATH"
          kind version
          kubectl version --client
          argocd version --client
          chainsaw version
          tilt version
          task --version

      # The registry pull-through caches (scripts/localdev-kind.ts registry)
      # persist their blobs under ~/.cache/homelab-kind-registry. Restoring a
      # previous run's cache turns most image pulls into local reads. Best
      # effort: the cache may grow to several GB and GitHub evicts entries past
      # the 10 GB per-repository budget; every hosts.toml lists the upstream as
      # a fallback, so an empty or evicted cache only costs pull time.
      - name: Cache kubeconform core schemas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kubeconform
          key: kubeconform-${{ hashFiles('configuration/versions.yaml') }}

      - name: Registry pull-through cache (best effort)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kind-registry
          key: kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml') }}
          restore-keys: |
            kind-registry-

      # kind -> argocd -> sync every Application from the working tree ->
      # wait until Healthy/Succeeded -> chainsaw e2e. Non-interactive; on a
      # timeout `localdev:wait` prints the diagnostics before exiting 1.
      - name: task localdev:ci
        run: task localdev:ci

      - name: task verify LEVEL=2
        id: verify
        run: |
          set -o pipefail
          task verify LEVEL=2 | tee verify-level2.json

      - name: Summary
        if: always()
        run: |
          # task prints its own failure line after the JSON; keep only the object.
          if [ -f verify-level2.json ] && sed -n '/^{/,/^}/p' verify-level2.json > verify-level2.clean.json && jq -e . verify-level2.clean.json >/dev/null 2>&1; then
            mv verify-level2.clean.json verify-level2.json
            {
              echo "## Level 2 verification (Kind)"
              echo
              jq -r '"**Result:** \(if .pass then "PASS ✅" else "FAIL ❌" end) in \(.duration_ms) ms"' verify-level2.json
              echo
              echo "| Check | Status | ms | Findings |"
              echo "|---|---|---:|---:|"
              jq -r '.checks[] | select(.status != "pass") | "| \(.name) | \(.status) | \(.duration_ms) | \(.findings // [] | length) |"' verify-level2.json
              echo
              jq -r '.checks[] | select(.status == "fail") | "### \(.name)\n\(.detail // "")\n" + ((.findings // []) | map("- " + .) | join("\n"))' verify-level2.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Level 2 verification (Kind)"
              echo
              echo "verify-level2.json was not written: task localdev:ci failed before the verify step (see its log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # PR head vs its base branch as ArgoCD sees it (argocd app diff
      # --revision <base>). Tolerates a missing or partial
      # verify-level2.json and an unreachable ArgoCD (it says so in the
      # report). !cancelled() rather than always(): a run superseded by a newer
      # push must not spend its grace period posting a stale comment.
      - name: Kind report (task localdev:report)
        id: report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          task localdev:report -- --out kind-report.md --verify-json verify-level2.json --base "${{ github.base_ref || 'main' }}"
          tee -a "$GITHUB_STEP_SUMMARY" < kind-report.md > /dev/null
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Sticky comment with the Kind report
        if: >-
          ${{ !cancelled() && steps.report.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: kind-preview
          path: kind-report.md

      - name: Diagnostics
        if: always()
        run: |
          task localdev:diagnose || true
          echo "=== Applications ==="
          kubectl --context "$KIND_CONTEXT" -n argocd get applications.argoproj.io -o wide || true
          echo "=== Pods ==="
          kubectl --context "$KIND_CONTEXT" get pods -A || true

      # The registry containers write their blobs as root. actions/cache tars
      # the directory as the runner user in its post step, so hand it back.
      - name: Make the registry cache readable for actions/cache
        if: always()
        run: |
          if [ -d "$HOME/.cache/homelab-kind-registry" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/homelab-kind-registry"
            du -sh "$HOME/.cache/homelab-kind-registry" || true
          fi

      - name: Upload level-2 JSON and Kind report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-level2
          path: |
            verify-level2.json
            kind-report.md
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # Tilt direct mode: a few charts installed straight into Kind, no ArgoCD
  # ============================================================================
  kind-direct:
    name: Kind direct mode (tilt ci)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install kind, kubectl, tilt, task
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          export PATH="$HOME/bin:$PATH"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz" | tar -xz -C "$HOME/bin" tilt
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" task
          chmod +x "$HOME/bin"/*
          echo "$HOME/bin" >> "$GITHUB_PATH"
          kind version
          tilt version

      # Same cluster as the loop (Cilium CNI, fakes), without the registry
      # caches: this job pulls three charts' worth of images and does not
      # restore the cache, so the proxies would only add containers.
      - name: Create the Kind cluster
        run: task localdev:kind -- --no-registry

      - name: tilt ci (direct mode)
        working-directory: localdev
        run: tilt ci --timeout 15m

      - name: Pods and failed-pod logs
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl --context "$KIND_CONTEXT" get pods -A || { echo "no cluster (an earlier step failed)"; exit 0; }
          echo
          echo "=== Logs of pods not Running/Succeeded ==="
          kubectl --context "$KIND_CONTEXT" get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded -o json \
            | jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "--- $ns/$pod ---"
                kubectl --context "$KIND_CONTEXT" logs -n "$ns" "$pod" --all-containers --tail=50 || true
              done

      - name: Traefik is available
        run: |
          kubectl --context "$KIND_CONTEXT" wait --for=condition=available --timeout=120s deployment/traefik -n traefik
          kubectl --context "$KIND_CONTEXT" get svc -n traefik

      - name: cert-manager is available
        run: |
          kubectl --context "$KIND_CONTEXT" wait --for=condition=available --timeout=120s deployment/cert-manager -n cert-manager
          kubectl --context "$KIND_CONTEXT" get pods -n cert-manager

  # ============================================================================
  # YAML lint (non-template files; .yamllint ignores charts/*/templates)
  # ============================================================================
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint -c .yamllint charts/ localdev/ tests/e2e tests/health
