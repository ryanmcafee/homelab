name: Talos Image Rebuild

on:
  push:
    branches:
      - main
    paths:
      - 'talos/image/schematic.yaml'
      - 'terragrunt/environments/homelab/talos-image/**'
      - 'terragrunt/modules/talos-image/**'
  workflow_dispatch:
    inputs:
      notify_only:
        description: 'Only notify about changes (do not apply)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

env:
  # mise.toml points TF_PLUGIN_CACHE_DIR at a repo-local directory that does
  # not exist on a runner; an empty value disables the cache.
  TF_PLUGIN_CACHE_DIR: ''

jobs:
  rebuild-image:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same terraform/terragrunt every other IaC workflow uses, pinned in
      # mise.toml (terragrunt 0.55 cannot parse this repository's 1.x HCL).
      - name: Install terraform and terragrunt from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: terraform terragrunt

      - name: Show schematic changes
        run: |
          echo "=== Current Talos Image Schematic ==="
          cat talos/image/schematic.yaml

          echo ""
          echo "=== Terragrunt Extensions Config ==="
          grep -A20 "system_extensions" terragrunt/environments/homelab/talos-image/terragrunt.hcl || true

      - name: Terragrunt Plan
        id: plan
        run: |
          cd terragrunt/environments/homelab/talos-image
          terragrunt plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          head -100 plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}

      - name: Terragrunt Apply
        if: ${{ github.event.inputs.notify_only != 'true' }}
        run: |
          cd terragrunt/environments/homelab/talos-image
          terragrunt apply tfplan
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}

      - name: Create notification issue
        if: ${{ success() && github.event.inputs.notify_only != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '🔄 Talos Image Rebuilt - Node Recreation Required';
            const body = `
            ## Talos Image Rebuilt

            A new Talos image has been generated with updated system extensions.

            ### Next Steps

            To apply the new image to cluster nodes, run the following commands:

            **For GPU node (worker-1):**
            \`\`\`bash
            task talos:recreate:gpu-node
            \`\`\`

            **For other nodes:**
            \`\`\`bash
            task talos:recreate:node NODE=<node-name>
            \`\`\`

            ### Changed Files

            - \`talos/image/schematic.yaml\`
            - \`terragrunt/environments/homelab/talos-image/terragrunt.hcl\`

            ### Verification

            After recreating nodes, verify GPU support:
            \`\`\`bash
            task gpu:verify
            \`\`\`

            ---
            *This issue was automatically created by the Talos Image Rebuild workflow.*
            `;

            // Check if a similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'talos-image-rebuild'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['talos-image-rebuild', 'infrastructure']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `New image rebuild triggered at ${new Date().toISOString()}. Please recreate affected nodes.`
              });
            }
