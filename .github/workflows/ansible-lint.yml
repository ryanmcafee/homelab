name: Ansible Lint

on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ansible-core and ansible-lint from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python pipx pipx:ansible-core pipx:ansible-lint

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      # The inventory is rendered from configuration/ and gitignored; lint
      # against the same template rendered with the placeholder example so the
      # playbooks resolve their group vars.
      - name: Install go from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Render the example inventory
        run: |
          go run ./cmd/homelab config export --set homelab \
            --env-file configuration/environments/homelab.yaml.example \
            --format ansible-inventory --stdout > ansible/inventory/homelab.yml

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint
