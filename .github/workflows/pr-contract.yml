name: PR contract

# Level 0 on the PR head (docs/runbooks/verification.md "Agent contract"): runs
# `task verify` on the head commit and fails when level 0 fails, with the
# failing checks in the job summary. verify.yml runs level 0 on the merge
# result. The job name is the required status check on main; keep it stable.
#
# Skipped for Renovate (renovate/* heads; upgrade.yml gates bumps) and for
# drafts (runs again on ready_for_review). No paths filter: every pull request
# gets the required check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Tools come from mise.toml through jdx/mise-action (same pins as verify.yml's
# level-0 job); mise.toml `helm` must match configuration/versions.yaml
# `tools.helm` because the snapshot checks are byte-exact.

jobs:
  claim:
    name: Verification claim matches level 0
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install go, helm, kubeconform, conftest, pluto, task from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go helm kubeconform conftest pluto task

      - name: Cache kubeconform core schemas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kubeconform
          key: kubeconform-${{ hashFiles('configuration/versions.yaml') }}

      - name: task verify (level 0 on the PR head)
        run: |
          set -o pipefail
          task verify | tee verify-level0.json

      - name: Summary
        if: always()
        run: |
          # task prints its own failure line after the JSON; keep only the object.
          if [ -f verify-level0.json ] && sed -n '/^{/,/^}/p' verify-level0.json > verify-level0.clean.json && jq -e . verify-level0.clean.json >/dev/null 2>&1; then
            mv verify-level0.clean.json verify-level0.json
            {
              echo "## Level 0 on the PR head"
              echo
              jq -r '"**Result:** \(if .pass then "PASS" else "FAIL" end) in \(.duration_ms) ms"' verify-level0.json
              echo
              echo "| Check | Status | ms | Findings |"
              echo "|---|---|---:|---:|"
              jq -r '.checks[] | select(.status != "pass") | "| \(.name) | \(.status) | \(.duration_ms) | \(.findings // [] | length) |"' verify-level0.json
              echo
              jq -r '.checks[] | select(.status == "fail") | "### \(.name)\n\(.detail // "")\n" + ((.findings // []) | map("- " + .) | join("\n"))' verify-level0.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::level 0 produced no JSON result; see the task verify step log."
          fi

      - name: Upload level-0 JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-contract-level0
          path: verify-level0.json
          retention-days: 14
          if-no-files-found: ignore
