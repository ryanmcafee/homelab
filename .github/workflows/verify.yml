name: Verify (level 0)

# Cluster-free static verification of the GitOps repository (issue #261, Section A).
# Every job here runs without a cluster and without PII: charts are rendered with
# configuration/environments/{localdev.yaml,homelab.yaml.example} only.
#
#   level-0     task verify        render + lint + kubeconform + pluto + gitops graph + snapshots + policy
#   policy      task test:policy   Rego unit tests + negative fixtures
#               task test:health   ArgoCD health Lua (charts/bootstrap/files/health) against tests/health
#   schemas     task schemas:check vendored CRD schemas match configuration/versions.yaml
#   cmp-parity  task test:cmp-parity  pinned homelab-cmp image == source `config export`
#   scaffold    task test:scaffold one scaffolded app per pattern passes level 0 in a temp copy
#
# Snapshot drift fails the `snapshot` job for every author. On a pull request the job
# also regenerates the snapshots into the runner's working tree, uploads them as the
# `snapshots-regenerated` artifact and posts a sticky comment with the manifest diff, so
# the reviewer sees exactly what a bump changes. Nothing is committed or pushed: an
# auto-commit made with GITHUB_TOKEN triggers no workflows, so the PR would sit with a
# stale, green-looking status, and Renovate abandons a branch that carries foreign
# commits (issue #261 item 19).

on:
  # No paths filter on pull_request, deliberately: the level-0 job below is the
  # merge-result gate ADR-039 puts in main's required contexts (MCAA-164), and GitHub
  # leaves a required context that never runs *pending forever* instead of treating it
  # as satisfied. The distinction
  # that matters: a job skipped by a job-level `if:` still publishes a `skipped` check
  # run, which does satisfy the requirement (that is how pr-contract.yml's Renovate and
  # draft exemptions stay mergeable); a workflow filtered out by `paths:` publishes no
  # check run at all. Measured on PR #345, a workflow-only Renovate bump: `Verification
  # claim matches level 0` reported `skipped` and the PR merged, while verify.yml
  # produced no check run whatsoever. 26 of the last 180 commits on main (14%) touched
  # no path in the filter this replaces. Level 0 costs ~35s and the whole workflow ~3.4
  # job-minutes, so running it on every pull request is cheaper than any shim that would
  # keep the filter. Do not reintroduce a paths filter here while the job is required.
  pull_request:
  # push keeps its filter: post-merge runs on main gate nothing, so skipping the ones
  # that cannot be affected is free.
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'configuration/**'
      - 'tests/**'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'readme.md'
      - 'docs/**'
      - '.github/homelab.svg'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - 'mise.toml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

# Superseded pushes to a PR cancel each other; pushes to main do not, so every
# merged commit keeps its own verdict.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every pinned tool carries a Renovate marker so the bump lands here too. The renderer
# in particular must match configuration/versions.yaml `tools.helm` (the single source of
# truth for the helm version) and mise.toml, because the golden snapshots are byte-exact
# and a different helm writes different bytes.
# Every tool comes from mise.toml through jdx/mise-action (Renovate's mise
# manager bumps the pins there), so CI and a workstation run the same versions.

jobs:
  level-0:
    name: Level 0 (render, schema, gitops, snapshot, policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go, helm, kubeconform, conftest, pluto, task from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go helm kubeconform conftest pluto task

      - name: Cache kubeconform core schemas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kubeconform
          key: kubeconform-${{ hashFiles('configuration/versions.yaml') }}

      - name: Go unit tests
        run: go test ./...

      - name: task verify (level 0)
        id: verify
        run: |
          set -o pipefail
          task verify | tee verify-level0.json
        continue-on-error: false

      - name: Summary
        if: always()
        run: |
          # task prints its own failure line after the JSON; keep only the object.
          if [ -f verify-level0.json ] && sed -n '/^{/,/^}/p' verify-level0.json > verify-level0.clean.json && jq -e . verify-level0.clean.json >/dev/null 2>&1; then
            mv verify-level0.clean.json verify-level0.json
            {
              echo "## Level 0 verification"
              echo
              jq -r '"**Result:** \(if .pass then "PASS ✅" else "FAIL ❌" end) in \(.duration_ms) ms"' verify-level0.json
              echo
              echo "| Check | Status | ms | Findings |"
              echo "|---|---|---:|---:|"
              jq -r '.checks[] | select(.status != "pass") | "| \(.name) | \(.status) | \(.duration_ms) | \(.findings // [] | length) |"' verify-level0.json
              echo
              jq -r '.checks[] | select(.status == "fail") | "### \(.name)\n\(.detail // "")\n" + ((.findings // []) | map("- " + .) | join("\n"))' verify-level0.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload level-0 JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-level0
          path: verify-level0.json
          retention-days: 14

  policy:
    name: Policy unit tests and negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # argocd is the mise.toml pin (= configuration/versions.yaml tools.argocd):
      # the health fixtures are evaluated with `argocd admin settings
      # resource-overrides health`, the same code path the controller runs.
      - name: Install go, bun, conftest, argocd, task from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go bun conftest argocd task

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: argocd version --client

      - name: conftest verify
        run: conftest verify -p tests/policy

      - name: Negative and positive fixtures
        run: bun scripts/policy-test.ts

      - name: ArgoCD health Lua fixtures
        run: task test:health

      # Every script in scripts/ is TypeScript run by Bun and is the automation
      # this repo runs; a formatting or type error there breaks a task, not a
      # chart, so it is checked here rather than nowhere.
      - name: TypeScript format, lint, types and unit tests
        run: |
          set -euo pipefail
          task scripts:lint
          task test:scripts

      # The README badge row, the tables in docs/ and the counts drawn into
      # .github/homelab.svg are computed from versions.yaml, the chart
      # templates, the homelab snapshots and tests/e2e; stale numbers fail
      # here instead of rotting. `task docs:check -- --fix` regenerates them.
      - name: task docs:check
        run: task docs:check

  schemas:
    name: Vendored CRD schemas are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install helm and bun from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm bun

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: schemas --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/crd-schemas-vendor.ts --check \
            || { echo "::error::tests/schemas is stale. Run 'task schemas:vendor' and commit the result."; exit 1; }

  snapshot:
    name: Golden snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read-only on contents: this job never commits. pull-requests: write is
      # for the sticky comment only.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go and helm from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go helm

      - name: Compare snapshots
        id: compare
        run: |
          set +e
          go run ./cmd/homelab verify snapshot --json > snapshot.json
          echo "pass=$(jq -r .pass snapshot.json)" >> "$GITHUB_OUTPUT"

      # On drift, regenerate into the working tree only, to produce the diff and
      # the artifact. Nothing is committed: see the header comment.
      - name: Regenerate snapshots for the diff report
        if: steps.compare.outputs.pass != 'true'
        id: regen
        continue-on-error: true
        run: |
          set -uo pipefail
          go run ./cmd/homelab verify snapshot --update
          git diff --stat -- tests/snapshots > snapshot-diff.txt
          {
            echo '## Rendered manifests differ from `tests/snapshots`'
            echo
            echo '```'
            cat snapshot-diff.txt
            echo '```'
            echo
            echo '<details><summary>Manifest diff</summary>'
            echo
            echo '```diff'
            git diff -- tests/snapshots | head -c 60000
            echo '```'
            echo '</details>'
            echo
            echo "To accept these changes, run \`task test:snapshot -- --update\` locally and"
            echo "commit the result, or download the \`snapshots-regenerated\` artifact from"
            echo "this run and commit it. This job fails until \`tests/snapshots\` matches."
          } > snapshot-comment.md

      - name: Upload regenerated snapshots
        if: steps.compare.outputs.pass != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snapshots-regenerated
          path: tests/snapshots
          retention-days: 14

      - name: Sticky comment with manifest diff
        if: steps.compare.outputs.pass != 'true' && github.event_name == 'pull_request' && steps.regen.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: snapshot-diff
          path: snapshot-comment.md

      # Drift fails the job for every author, Renovate included. renovate.json5
      # automerges patch bumps, so a green snapshot job on a bump that changed
      # the render would merge an unreviewed manifest change.
      - name: Fail on snapshot drift
        if: steps.compare.outputs.pass != 'true'
        run: |
          jq -r '.checks[] | select(.status=="fail") | "\(.name): \(.detail)\n" + ((.findings // []) | join("\n"))' snapshot.json
          echo "::error::Rendered manifests differ from tests/snapshots. Run 'task test:snapshot -- --update' and commit, or download the snapshots-regenerated artifact."
          exit 1

  cmp-parity:
    name: CMP image parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on push: cmp-image.yml builds and pushes the image from the same
    # commit, so running here would race it and fail on a tag that is seconds
    # away from existing. Parity on main is covered by the next pull request,
    # or on demand with workflow_dispatch.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go and bun from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go bun

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      # The parity check needs the base tag to tell "this PR bumped the tag,
      # so the image does not exist yet" from "the image was never built".
      # The explicit refspec is what guarantees the base ref exists in the
      # shallow checkout. The base is the PR target branch (main on
      # workflow_dispatch), not a hard-coded main.
      - name: Fetch base ref for the tag comparison
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "$BASE:refs/remotes/origin/$BASE"

      - name: Compare pinned image against source
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          bun \
            scripts/cmp-parity-test.ts --base-ref "origin/$BASE"

  # Scaffolder self-test (issue #261 item 21): `homelab scaffold app` for every
  # pattern (operator, helm, deps-main-config, and all of them together) in a
  # temporary copy of the repository must pass level 0 there, plus the PII
  # guard on what it generated. Checks that already fail in the unmodified copy
  # are reported as pre-existing, not blamed on the scaffolder.
  scaffold:
    name: Scaffolder self-test (one app per pattern passes level 0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go, helm, bun, kubeconform, conftest, pluto, task from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go helm bun kubeconform conftest pluto task

      - name: Install script dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Cache kubeconform core schemas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kubeconform
          key: kubeconform-${{ hashFiles('configuration/versions.yaml') }}

      # chainsaw and argocd are not installed here, so their extra checks
      # report skip; the policy job runs the health Lua fixtures, and yamllint
      # (preinstalled on the runner) still checks the generated YAML.
      - name: task test:scaffold
        run: task test:scaffold
