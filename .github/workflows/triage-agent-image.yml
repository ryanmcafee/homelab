name: Build Triage Agent Image

# Publishes ghcr.io/<owner>/homelab-triage-agent (linux/amd64 + linux/arm64) on
# main, tagged with configuration/versions.yaml images.triage-agent; a pull
# request builds both platforms without pushing. The unit tests run in
# verify.yml (task test:triage-agent).

on:
  push:
    branches: [main]
    paths:
      - 'triage-agent/**'
      - 'Dockerfile.triage-agent'
      - '.github/workflows/triage-agent-image.yml'
      # the image tag is images.triage-agent; a bump alone must publish
      - 'configuration/versions.yaml'
  pull_request:
    paths:
      - 'triage-agent/**'
      - 'Dockerfile.triage-agent'
      - '.github/workflows/triage-agent-image.yml'
      - 'configuration/versions.yaml'

concurrency:
  group: triage-agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read image version
        id: version
        run: |
          VERSION=$(yq '.images.triage-agent' configuration/versions.yaml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:configuration/versions.yaml | yq '.images.triage-agent')
          HEAD_VERSION=${{ steps.version.outputs.version }}
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning::Triage agent image version ($HEAD_VERSION) was not bumped. If triage-agent/ changed, bump images.triage-agent in configuration/versions.yaml."
          else
            echo "Triage agent version: $BASE_VERSION -> $HEAD_VERSION"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.triage-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-triage-agent:latest
            ghcr.io/${{ github.repository_owner }}/homelab-triage-agent:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=triage-agent
          cache-to: type=gha,mode=max,scope=triage-agent
