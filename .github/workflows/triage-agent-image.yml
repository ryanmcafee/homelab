name: Build Triage Agent Image

# Publishes ghcr.io/<owner>/homelab-triage-agent (linux/amd64 + linux/arm64) on
# main, tagged with configuration/versions.yaml images.triage-agent; a pull
# request builds both platforms without pushing. The unit tests run in
# verify.yml (task test:triage-agent).
#
# smoke: the amd64 image runs the triage, plan and notify stages with canned
# model answers (TRIAGE_AGENT_FAKE_LLM) on a read-only root filesystem.
# workflow-lint: `argo lint --offline` of the rendered triage-fix
# WorkflowTemplate and a Workflow the intake would submit.

on:
  push:
    branches: [main]
    paths:
      - 'triage-agent/**'
      - 'Dockerfile.triage-agent'
      - '.github/workflows/triage-agent-image.yml'
      # the image tag is images.triage-agent; a bump alone must publish
      - 'configuration/versions.yaml'
  pull_request:
    paths:
      - 'triage-agent/**'
      - 'Dockerfile.triage-agent'
      - '.github/workflows/triage-agent-image.yml'
      - 'configuration/versions.yaml'
      - 'charts/triage-agent/**'
      - 'tests/snapshots/homelab/triage-agent.yaml'

concurrency:
  group: triage-agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read image version
        id: version
        run: |
          VERSION=$(yq '.images.triage-agent' configuration/versions.yaml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:configuration/versions.yaml | yq '.images.triage-agent')
          HEAD_VERSION=${{ steps.version.outputs.version }}
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning::Triage agent image version ($HEAD_VERSION) was not bumped. If triage-agent/ changed, bump images.triage-agent in configuration/versions.yaml."
          else
            echo "Triage agent version: $BASE_VERSION -> $HEAD_VERSION"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.triage-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-triage-agent:latest
            ghcr.io/${{ github.repository_owner }}/homelab-triage-agent:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=triage-agent
          cache-to: type=gha,mode=max,scope=triage-agent

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.triage-agent
          platforms: linux/amd64
          load: true
          tags: homelab-triage-agent:smoke
          cache-from: type=gha,scope=triage-agent

      - name: Run triage, plan and notify with canned model answers
        run: |
          set -euo pipefail
          etc="$(mktemp -d)"
          for f in settings.json agent.json mcp-servers.json; do
            yq "select(.kind == \"ConfigMap\" and .metadata.name == \"triage-agent\") | .data[\"$f\"]" \
              tests/snapshots/homelab/triage-agent.yaml > "$etc/$f"
          done
          work="$(mktemp -d)"
          chmod 0777 "$work"
          group='{"key":"SmokeAlert/_cluster","alertname":"SmokeAlert","alerts":[{"fingerprint":"f1","name":"SmokeAlert","labels":{"alertname":"SmokeAlert"},"annotations":{},"startsAt":"2026-09-25T00:00:00Z"}]}'
          run_stage() {
            docker run --rm --read-only --user 1000:1000 \
              --tmpfs /home/agent:uid=1000,gid=1000 --tmpfs /tmp:uid=1000,gid=1000 \
              -v "$work:/work" -v "$etc:/etc/triage-agent:ro" \
              -e WORK_DIR=/work -e REPO_URL="https://github.com/${{ github.repository }}.git" \
              -e REPO_SLUG="${{ github.repository }}" -e BRANCH=triage/smokealert-00000000 \
              -e ALERT_GROUP="$group" -e WORKFLOW_NAME=smoke -e WORKFLOW_STATUS=Succeeded \
              -e TRIAGE_AGENT_FAKE_LLM=true -e MEMORY_DIR=/tmp \
              homelab-triage-agent:smoke run "$1"
          }
          run_stage triage
          test "$(jq -r .actionable "$work/triage.json")" = false
          run_stage plan
          test -s "$work/plan.md"
          run_stage notify | tee "$work/notify.log"
          grep -q "Triage report: SmokeAlert" "$work/notify.log"

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install argo and bun from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: argo bun yq

      - name: Install the triage agent dependencies
        working-directory: triage-agent
        run: bun install --frozen-lockfile

      - name: argo lint the WorkflowTemplate and a submitted Workflow
        run: |
          set -euo pipefail
          yq 'select(.kind == "WorkflowTemplate")' tests/snapshots/homelab/triage-agent.yaml > /tmp/triage-fix.yaml
          bun triage-agent/scripts/sample-workflow.ts > /tmp/workflow.json
          argo lint --offline /tmp/triage-fix.yaml /tmp/workflow.json
