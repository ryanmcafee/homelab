name: Security Scan

on:
  pull_request:
    paths:
      - 'terragrunt/**'
      - 'ansible/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.cmp'
      - '.github/workflows/security-scan.yml'
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

permissions:
  contents: read
  security-events: write
  # The fail-fast step cancels this PR's other CI runs once a job fails.
  actions: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure

  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install checkov from mise.toml
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: python pipx pipx:checkov

      - name: Run Checkov
        run: |
          checkov -d terragrunt/ --framework terraform --quiet --compact
        continue-on-error: true  # Don't fail build on Checkov findings

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
