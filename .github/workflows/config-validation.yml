name: Config Validation

on:
  pull_request:
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'terragrunt/**'
      - 'scripts/**'
      - 'docs/**'
      - 'ansible/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'Taskfile.yml'
  push:
    branches:
      - main
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'terragrunt/**'
      - 'scripts/**'
      - 'docs/**'
      - 'ansible/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'Taskfile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go and Python from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go python

      - name: Install hook test engine
        run: python -m pip install pre-commit==4.3.0

      - name: Run config tests
        env:
          CONFIG_GUARD_PRECOMMIT_TEST: "1"
        run: |
          go test ./internal/config/... -v
          go test ./cmd/homelab/commands -run 'Test.*(Guard|Pool|AddressRole|ConfigValidate)' -v

      - name: Validate config (localdev)
        run: go run ./cmd/homelab config validate --set localdev

      - name: PII guard (CI mode)
        run: go run ./cmd/homelab config guard --set localdev --ci
