name: Config Validation

on:
  pull_request:
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - main
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go

      - name: Validate config (localdev)
        run: go run ./cmd/homelab config validate --set localdev

      - name: PII guard (CI mode)
        run: go run ./cmd/homelab config guard --set localdev --ci

      - name: Run config tests
        run: go test ./internal/config/... -v
