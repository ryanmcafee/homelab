name: Config Validation

# The paths must cover every entry in config.DefaultGuardPathspecs, or the PII
# guard never runs on a change to a surface it scans.
# TestGuardWorkflowCoversGuardedPaths pins the two together.
on:
  pull_request:
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/**'
      - 'ansible/**'
      - 'Taskfile.yml'
      - 'go.mod'
      - 'go.sum'
      - 'terragrunt/**'
      - 'talos/**'
      - 'packer/**'
      - '.pre-commit-config.yaml'
  push:
    branches:
      - main
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/**'
      - 'ansible/**'
      - 'Taskfile.yml'
      - 'go.mod'
      - 'go.sum'
      - 'terragrunt/**'
      - 'talos/**'
      - 'packer/**'
      - '.pre-commit-config.yaml'

permissions:
  contents: read
  # The fail-fast step cancels this PR's other CI runs once a job fails.
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go and Python from mise.toml
        uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          install_args: go python

      - name: Install hook test engine
        run: python -m pip install pre-commit==4.3.0

      - name: Run config tests
        env:
          CONFIG_GUARD_PRECOMMIT_TEST: "1"
        run: |
          go test ./internal/config/... -v
          go test ./cmd/homelab/commands -run 'Test.*(Guard|Pool|AddressRole|ConfigValidate)' -v

      - name: Validate config (localdev)
        run: go run ./cmd/homelab config validate --set localdev

      - name: PII guard (CI mode)
        run: go run ./cmd/homelab config guard --set localdev --ci

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
        with:
          keep-own-run: ${{ !startsWith(github.head_ref, 'renovate/') }}
