name: Config Validation

on:
  pull_request:
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'terragrunt/**'
  push:
    branches:
      - main
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'terragrunt/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.19'

      - name: Validate config (localdev)
        run: go run ./cmd/homelab config validate --set localdev

      - name: PII guard (CI mode)
        run: go run ./cmd/homelab config guard --set localdev --ci

      - name: Run config tests
        run: go test ./internal/config/... -v
