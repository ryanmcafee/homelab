name: Config Validation

on:
  pull_request:
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'terragrunt/**'
  push:
    branches:
      - main
    paths:
      - 'configuration/**'
      - 'charts/**'
      - 'terragrunt/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'

      - name: Validate config (localdev)
        run: go run ./cmd/homelab config validate --set localdev

      - name: PII guard (CI mode)
        run: go run ./cmd/homelab config guard --set localdev --ci

      - name: Run config tests
        run: go test ./internal/config/... -v
