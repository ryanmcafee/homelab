name: Restore drill (weekly)

# Weekly CloudNativePG restore drill (issue #261 item 20). Nothing here touches
# the homelab cluster: it builds the localdev Kind cluster, syncs the operators
# through ArgoCD (bootstrap + addons, `sync --warm`) and runs tests/drills:
# a Cluster archives WAL and takes a base backup through the Barman Cloud
# Plugin into a throwaway S3 endpoint, a second Cluster is restored from it and
# must return the same data (tests/drills/README.md).
#
# A failure opens an issue labelled `restore-drill` (or comments on the open
# one); the next passing run closes it. That keeps the "Verified weekly"
# claims in docs/disaster-recovery.md honest.
#
# Tool versions mirror configuration/versions.yaml and mise.toml, with the same
# pins and Renovate markers as .github/workflows/tilt-ci.yml (kind-argocd).

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: restore-drill
  cancel-in-progress: false

permissions:
  contents: read

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: '1.25'
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: 'v0.33.0'
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: 'v1.37.0'
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 'v4.3.0'
  # renovate: datasource=github-releases depName=argoproj/argo-cd
  ARGOCD_VERSION: 'v3.5.3'
  # renovate: datasource=github-releases depName=kyverno/chainsaw
  CHAINSAW_VERSION: 'v0.2.15'
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: 'v3.46.4'
  # Every kubectl/argocd/chainsaw call in the scripts pins this context (ADR-009).
  KIND_CONTEXT: kind-homelab-localdev

jobs:
  drill:
    name: CloudNativePG restore drill (Kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # kubectl is published on dl.k8s.io, not on the kubernetes/kubernetes
      # release page; the Renovate marker still tracks that repository's tags.
      # jq and yq (test:drill reads versions.yaml with yq) ship with ubuntu-latest.
      - name: Install kind, kubectl, argocd, chainsaw, task
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          export PATH="$HOME/bin:$PATH"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/argocd" "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" chainsaw
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz" | tar -xz -C "$HOME/bin" task
          chmod +x "$HOME/bin"/*
          echo "$HOME/bin" >> "$GITHUB_PATH"
          kind version
          kubectl version --client
          argocd version --client
          chainsaw version
          task --version

      # Same pull-through cache as tilt-ci.yml (same key prefix, so a drill
      # restores what the PR loop saved and vice versa). Best effort: every
      # hosts.toml lists the upstream as a fallback.
      - name: Registry pull-through cache (best effort)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homelab-kind-registry
          key: kind-registry-${{ hashFiles('configuration/versions.yaml', 'charts/addons/values-localdev.yaml', 'charts/applications/values-localdev.yaml') }}
          restore-keys: |
            kind-registry-

      # kind -> argocd -> sync --warm (bootstrap + addons: cert-manager,
      # cloudnative-pg, cnpg-barman-cloud, ...) -> chainsaw tests/drills.
      - name: task drill:restore
        id: drill
        run: |
          set -o pipefail
          task drill:restore 2>&1 | tee drill.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Restore drill (Kind)"
            echo
            if [ "${{ steps.drill.outcome }}" = "success" ]; then
              echo "**Result:** PASS"
            else
              echo "**Result:** FAIL (${{ steps.drill.outcome }})"
            fi
            echo
            echo '```'
            if [ -f drill.log ]; then
              sed -n '/Tests Summary/,$p' drill.log
              sed -n '/restored primary/p' drill.log
            else
              echo "drill.log was not written"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        run: |
          task localdev:diagnose || true
          echo "=== Applications ==="
          kubectl --context "$KIND_CONTEXT" -n argocd get applications.argoproj.io -o wide || true
          echo "=== Pods ==="
          kubectl --context "$KIND_CONTEXT" get pods -A || true
          echo "=== CloudNativePG / plugin ==="
          kubectl --context "$KIND_CONTEXT" get clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,objectstores.barmancloud.cnpg.io -A || true
          kubectl --context "$KIND_CONTEXT" -n cnpg-system logs -l app.kubernetes.io/name=plugin-barman-cloud --tail=100 || true

      # The registry containers write their blobs as root. actions/cache tars
      # the directory as the runner user in its post step, so hand it back.
      - name: Make the registry cache readable for actions/cache
        if: always()
        run: |
          if [ -d "$HOME/.cache/homelab-kind-registry" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/homelab-kind-registry"
            du -sh "$HOME/.cache/homelab-kind-registry" || true
          fi

      - name: Upload drill log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-drill-log
          path: drill.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Open or update the restore-drill issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create restore-drill --color B60205 \
            --description "Weekly CloudNativePG restore drill failed (restore-drill.yml)" --force
          body="The weekly restore drill failed: $RUN_URL

          Reproduce locally with \`task drill:restore\` (tests/drills/README.md). Until it passes,
          the *Verified weekly* rows in docs/disaster-recovery.md are not verified."
          open=$(gh issue list --label restore-drill --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Restore drill failed" --label restore-drill --body "$body"
          fi

      - name: Close the restore-drill issue after a passing run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label restore-drill --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The restore drill passed again: $RUN_URL"
          done
