name: YAML Lint
# Uses .yamllint configuration - ignores Helm template directories

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - '.github/workflows/yaml-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'

permissions:
  contents: read
  # The fail-fast step cancels this PR's other CI runs once a job fails.
  actions: write

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint from mise.toml
        uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          install_args: python pipx pipx:yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Cancel the other CI runs for this PR head
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/cancel-pr-ci-on-failure
        with:
          keep-own-run: ${{ !startsWith(github.head_ref, 'renovate/') }}
