name: YAML Lint
# Uses .yamllint configuration - ignores Helm template directories

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/yaml-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
