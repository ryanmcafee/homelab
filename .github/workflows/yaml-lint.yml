name: YAML Lint
# Uses .yamllint configuration - ignores Helm template directories

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/yaml-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
