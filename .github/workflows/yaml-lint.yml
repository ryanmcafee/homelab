name: YAML Lint
# Uses .yamllint configuration - ignores Helm template directories

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'
      - '.github/workflows/yaml-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'
      - '.yamllint'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: pipx:yamllint

      - name: Run yamllint
        run: yamllint .
