name: YAML Lint

on:
  pull_request:
    paths:
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/yaml-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
