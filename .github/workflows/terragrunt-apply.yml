name: Terragrunt Apply

on:
  push:
    branches:
      - main
    paths:
      - 'terragrunt/**'

# Apply runs only after the `production` environment approval and needs the
# PROXMOX_* secrets plus network access to the homelab LAN, which GitHub-hosted
# runners do not have; `task tf:apply` from a workstation is the working path
# (ADR-009). The pins mirror configuration/versions.yaml and mise.toml.
env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: '1.16.2'
  # renovate: datasource=github-releases depName=gruntwork-io/terragrunt
  TERRAGRUNT_VERSION: 'v1.0.8'

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production  # Require manual approval for production deployments
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 -o terragrunt_linux_amd64 "https://github.com/gruntwork-io/terragrunt/releases/download/${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64"
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Apply
        run: |
          cd terragrunt/environments/homelab
          terragrunt run --all apply --non-interactive
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
