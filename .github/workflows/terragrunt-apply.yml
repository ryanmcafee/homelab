name: Terragrunt Apply

# Manual only. GitHub-hosted runners cannot reach the homelab LAN and the
# repository has no PROXMOX_* secrets, so an automatic apply on every push to
# main could never succeed (it failed on the plugin-cache directory before it
# even reached the API). `task tf:apply` from a workstation is the working path
# (ADR-009); this workflow exists for a self-hosted runner or a future secrets
# setup and must be dispatched by hand. Tools come from mise.toml through
# jdx/mise-action.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to run terragrunt run --all apply against homelab'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: ${{ inputs.confirm == 'apply' }}
    runs-on: ubuntu-latest
    environment: production  # manual approval gate for production deployments
    env:
      # mise.toml points TF_PLUGIN_CACHE_DIR at a repo-local directory that
      # does not exist on a runner; an empty value disables the cache.
      TF_PLUGIN_CACHE_DIR: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install terraform, terragrunt and op from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: terraform terragrunt op

      - name: Tool versions
        run: |
          terraform version
          terragrunt --version

      - name: Terragrunt Apply
        run: |
          cd terragrunt/environments/homelab
          terragrunt run --all apply --non-interactive
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
