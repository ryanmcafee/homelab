apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: homelab-config-helm
spec:
  version: v1.0
  allowConcurrency: true
  lockRepo: false
  generate:
    command: [sh, -c]
    args:
      - |
        CONFIG_ROOT="../../configuration"
        if [ ! -d "$CONFIG_ROOT" ]; then
          echo "ERROR: Config root not found at $CONFIG_ROOT (CWD: $(pwd))" >&2
          exit 1
        fi

        homelab config export \
          --set "$ARGOCD_ENV_ENVIRONMENT" \
          --format "$ARGOCD_ENV_FORMAT" \
          --env-file /config/homelab.yaml \
          --config-root "$CONFIG_ROOT" \
          --stdout > /tmp/generated-values.yaml

        helm template "$ARGOCD_APP_NAME" . \
          --namespace "$ARGOCD_APP_NAMESPACE" \
          --include-crds \
          -f values.yaml \
          -f /tmp/generated-values.yaml
