# Control-plane topology and the etcd quorum rule, v1.
#
# Normative. Reasoning and decision: ADR-035 in docs/project_notes/decisions.md.
#
# This file exists because the same safety rule has two consumers in two languages:
#
#   - Go:         `homelab talos recreate` (cmd/homelab/commands/talos_etcd.go), the
#                 distributable CLI path — ADR-031.
#   - TypeScript: scripts/cp-storage-migrate.ts, repository scripting — ADR-005.
#
# Neither is slated to move. Under ADR-031 a second implementation of shared logic is a
# review failure, and this is the rule that decides whether it is safe to destroy a
# control-plane node. So the rule lives here as data and both sides read it. A constant
# in either language that restates a value from this file is rejected at review.
#
# What is deliberately NOT here: parsing `talosctl etcd status` output. That is an
# adapter to one release of one CLI's human-readable table, it is private to whichever
# binary shells out, and two of them are acceptable. See ADR-035.

version: 1

# ---------------------------------------------------------------------------
# Topology. The count is operator configuration, not a repository constant:
# a fork is not required to have this cluster's shape (ADR-029, ADR-037).
# ---------------------------------------------------------------------------
controlPlane:
  # The expected member count is DERIVED from the ConfigSet's control-plane address
  # keys. There is deliberately no CONTROL_PLANE_COUNT key: the address list already
  # states the control plane, and a second key stating the same fact can disagree with
  # the first. An operator who adds a node and forgets to bump a count would get a
  # guard refusing to proceed on a healthy cluster — the failure this contract exists
  # to prevent. One fact, one source.
  countSource: config-set-key-pattern
  countKeyPattern: "^CP([0-9]+)_IP$"
  # Resolution is a count of DISTINCT matching keys carrying a non-empty value. A key
  # present with an empty value is indeterminate, not zero, and fails closed below.
  # Ordinals need not be contiguous: CP1/CP2/CP5 is three members, not five.
  countRequired: true
  # The MERGE CONDITION on #39 tracked in ADR-035 is SATISFIED (MCAA-118).
  # configuration/schema/network.schema.yaml declares the pattern above as a
  # `keyPatterns` entry with `role: control-plane-address`: CP1_IP is required on its
  # own and higher ordinals are optional, so a fork states one member or seven by
  # listing that many addresses. The resolver derives the list ONCE into
  # ResolvedConfig.ControlPlane and consumers read that field instead of re-applying
  # this pattern.
  #
  # Two tests hold the claim honest, and neither is satisfiable by narration:
  # scripts/topology-contract_test.ts fails if this flag disagrees with the schema in
  # either direction, and internal/config's TestControlPlaneKeyPatternMatchesContract
  # fails if the schema's pattern string stops being character-identical to the one
  # above. While the schema still had three required scalars, setting this true would
  # have meant "resolves to 3 for every fork on earth" — parameterised in form,
  # constant in effect, which is worse than an honest constant because it looks solved.
  countSourceSchemaReady: true
  # Odd only. An even member count adds a failure to tolerate without adding a
  # failure it can survive, and it is nearly always a mistake rather than a choice.
  permittedCounts: [1, 3, 5, 7]
  # Single-member control planes have no fault tolerance at all. Permitted, because a
  # one-node homelab is a real and supported fork, but the guard must say so out loud
  # rather than report a healthy cluster.
  degradedCounts: [1]

# ---------------------------------------------------------------------------
# The quorum rule. `quorum` is the minimum number of members that must be present
# for the cluster to accept writes; `maxUnavailable` is how many a destructive
# operation may take away and still leave quorum.
# ---------------------------------------------------------------------------
quorum:
  formula: floor(count / 2) + 1
  maxUnavailableFormula: count - quorum
  # Worked values, asserted by each consumer's conformance test against this file.
  # A consumer that computes a different number for any row here fails its test.
  table:
    - { count: 1, quorum: 1, maxUnavailable: 0 }
    - { count: 3, quorum: 2, maxUnavailable: 1 }
    - { count: 5, quorum: 3, maxUnavailable: 2 }
    - { count: 7, quorum: 4, maxUnavailable: 3 }
  # A count of 1 has maxUnavailable 0, so no removal is ever survivable on it. That is
  # not a quorum error to report and retry: recreating the only etcd member is a
  # snapshot-restore operation, not a member removal, and it has its own procedure. The
  # guard must refuse and say which procedure applies, rather than emit bare arithmetic.
  removalOfLastMember: refuse
  removalOfLastMemberGuidance: >-
    Recreating a single-member control plane is a restore, not a removal: take a
    snapshot, recreate the node, restore. See docs/runbooks/talos-upgrade.md.

# ---------------------------------------------------------------------------
# The health conditions. These are atoms: each is true or false of an observed member
# set. They are composed into the named predicates below, and a consumer evaluates a
# predicate, never a loose condition. The atoms were previously encoded only in
# scripts/cp-storage-migrate.ts `etcdHealth` (L476).
#
# Scope: a predicate declares whether its conditions are evaluated over every expected
# member or only over the members that answered. A condition says nothing about scope
# on its own. "Expected member" means a member of etcd's own membership — see
# health.memberSetSource — never an address the consumer happened to dial.
#
# A MISSING MEMBER HAS TWO SENSES AND THEY ARE NOT INTERCHANGEABLE. `vocabulary` below
# names each one, and every rule and worked row in this file uses those words and no
# synonym. The senses have different conditions, different messages and different
# causes, so a consumer that collapses them reports the wrong fault to the operator —
# and a reader who collapses them will think one condition covers both when none does.
# ---------------------------------------------------------------------------
health:
  # WHERE THE MEMBER SET COMES FROM. This is the first thing a consumer implements and
  # the easiest thing to get wrong, so it is stated before any condition that reads it.
  #
  # The observed member set is *etcd's own membership*: the member list etcd itself
  # reports, from `EtcdStatus`/`MemberList` obtained from at least one reachable
  # endpoint. It is NOT the set of addresses the consumer dialled, and it is not the
  # set of addresses derived from the ConfigSet.
  #
  # The derived count (controlPlane.countKeyPattern) is the *expectation compared
  # against* that set. It must never be the enumeration used to build it. If a consumer
  # derives 3 addresses, dials those 3, and then asserts that 3 answered, `member-count`
  # is a tautology that validates its own derivation and can never fail.
  #
  # The failure this forbids, worked: a real 5-member control plane whose CP4_IP and
  # CP5_IP are not listed in the ConfigSet and whose nodes are already down. A consumer
  # that enumerates from the ConfigSet derives 3, dials 3, finds 3 healthy, computes
  # quorum 2 and consents to a removal. Destroying one leaves 2 members of a real quorum
  # of 3: quorum lost, guard said yes. Reading membership from etcd surfaces 5 expected
  # and 2 unreachable, `member-count` fails, and the guard refuses.
  memberSetSource:
    observed: etcd-membership
    api: EtcdStatus/MemberList
    minimumReachableEndpoints: 1
    # If no endpoint answers, the member set is unknown, not empty. Unknown is
    # indeterminate, and `evaluation.onIndeterminate` makes that unsafe. A consumer that
    # treats "nobody answered" as "zero members" turns a total outage into a count
    # mismatch, or worse, into a vacuous truth.
    onNoReachableEndpoint: indeterminate
    derivedCountRole: expectation-compared-against-observed

  # THE TWO SENSES, DEFINED ONCE. Every rule below and every worked row in `evaluation`
  # uses exactly these two words. "Missing" is not a term of this contract.
  vocabulary:
    absent: >-
      A member OF etcd's own membership that did not answer. It is still in the member
      list, so it is an expected member, it counts toward quorum arithmetic, and
      `absences-are-declared` can see it.
    unrepresented: >-
      A configured control-plane address with NO member in etcd's membership at all. It
      is NOT an expected member, so it is invisible to every condition scoped to the
      member list, including `absences-are-declared`. Only a condition that compares
      membership size against the derived count can see it:
      `membership-accounts-for-expected` at the resume entry, `member-count` at
      preflight and completion.
    whyItMatters: >-
      A removal makes its target unrepresented, which is why the resumed shape cannot
      require `member-count`. Under the earlier sequential reading `whole` ran first and
      caught a second unrepresented address by accident; exclusive entry removed that
      backstop from the resumed shape, so the resumed shape names its own condition
      rather than relying on a gate it no longer passes through (MCAA-407).

  conditions:
    - id: member-count
      rule: >-
        The number of members in etcd's own membership (health.memberSetSource) equals
        the count derived from the control-plane address keys
        (controlPlane.countKeyPattern), and every one of those members answered. The
        derived count is the expectation; etcd's membership is the observation. A
        consumer that counts only the endpoints it chose to dial has not evaluated this
        condition, it has restated its own input.
    - id: quorum-present
      rule: >-
        The number of members that answered is at least quorum(count), and the number
        of members in etcd's membership that did not answer is at most
        maxUnavailable(count), both taken from the quorum table for the derived count.
        This is the condition that consumes the quorum rule; without it the table is
        data no predicate reads.
    - id: absences-are-declared
      rule: >-
        Every expected member that is absent (vocabulary.absent — in the member list and
        did not answer) is a declared target of the operation in progress. An unexplained
        absence is a second failure the operator did not ask for, and is never tolerated
        by any predicate — one target absent is a procedure in flight, one target plus
        one stranger is a degraded cluster. This condition is scoped to the member list,
        so it says nothing about an unrepresented address; that is
        `membership-accounts-for-expected`.
    - id: membership-accounts-for-expected
      rule: >-
        The number of members in etcd's own membership, plus the number of control-plane
        addresses that are unrepresented -- every unrepresented address, not only the
        ones this operation declared -- equals the count derived from the control-plane
        address keys, and every unrepresented address is a declared target of this
        operation. Two clauses, because the condition refuses on two different
        observations and owes a different message for each. Stated as one clause over
        the declared targets alone it fails open: a stranger member, one etcd reports at
        an address the ConfigSet does not list, cancels an undeclared unrepresented
        address in the arithmetic and the sum comes out right on a cluster carrying both
        faults at once -- reproduced at counts 5 and 7 (MCAA-483). The first clause is
        what sees the stranger; the second is what bounds the relaxation to the target.
        This is the only condition that can see an unrepresented address on a run that
        does not evaluate `member-count`: "expected member" means a member of the
        membership, so an address already removed from it is not an absence
        `absences-are-declared` can detect. On the fresh shape both clauses are implied
        by `member-count`, which demands the membership be complete; the resumed shape
        cannot demand that and needs this instead.
    - id: no-errors
      rule: No member reports a non-empty ERRORS field.
    - id: no-learners
      rule: No member is a learner. A learner does not vote and does not count toward quorum.
    - id: single-leader
      rule: Exactly one member reports itself leader.
    - id: raft-index-converged
      rule: >-
        Every member's RAFT INDEX is within `raftIndexTolerance` of the highest observed
        index. Members are queried at slightly different moments on a cluster that keeps
        writing, so exact equality is not a usable gate; a member many indices behind is
        still catching up and must not be counted as caught up.

  # How far behind the highest RAFT INDEX a member may be and still count as matching.
  # Changing this number is a contract change (ADR-030), not an edit to a constant.
  raftIndexTolerance: 10

  # -------------------------------------------------------------------------
  # The named predicates. A destructive procedure passes through states where the
  # cluster is deliberately not whole, so one predicate cannot serve every gate: a
  # guard that demands `whole` immediately before the removal, or on resume after a
  # crash, is unsatisfiable by construction and aborts mid-procedure — producing the
  # degraded control plane it exists to prevent. Two predicates, and each evaluation
  # point names the one it uses.
  # -------------------------------------------------------------------------
  predicates:
    - id: whole
      summary: Every expected member is present and converged.
      evaluatedOver: expected-members
      conditions:
        - member-count
        - no-errors
        - no-learners
        - single-leader
        - raft-index-converged
      rule: >-
        The gate for entering and for leaving a destructive procedure. Nothing is
        destroyed unless the cluster was whole beforehand, and the procedure is not
        reported successful until it is whole again.

    - id: survivable
      summary: >-
        Quorum holds, every member that answered is converged, and the only members
        absent or unrepresented are the ones this operation declared it would take away.
      evaluatedOver: answering-members
      conditions:
        - quorum-present
        - absences-are-declared
        - membership-accounts-for-expected
        - no-errors
        - no-learners
        - single-leader
        - raft-index-converged
      rule: >-
        The gate at the revalidation point and on resume, where the target is already
        gone or about to be. It is weaker than `whole` in exactly one way — it tolerates
        the declared target being absent or unrepresented — and no weaker in any other:
        an absent member that is not a declared target, more absences than
        maxUnavailable, or a control-plane address unrepresented that nobody declared, is
        unsafe, and every member that did answer must satisfy every other condition.
        `membership-accounts-for-expected` is what bounds the relaxation to the declared
        target rather than to any address the membership happens not to list.
      resumeSemantics: >-
        This is what makes the idempotent re-run decidable. After a crash between
        "member removed" and "node rejoined", the target is unrepresented and declared,
        so `survivable` holds and the run resumes at the next step. If some other member
        is absent, or some other configured address is unrepresented, `survivable` fails
        and the run refuses — which is correct, because that cluster has a failure the
        operator has not seen yet. A guard an operator must bypass to finish a legitimate
        recovery is not a guard; a guard that consents because the second fault happens
        to be in the sense it cannot see is not one either.

# ---------------------------------------------------------------------------
# Failure semantics. Stated explicitly because the caller is destructive and the
# cost of the two error directions is not symmetric.
# ---------------------------------------------------------------------------
evaluation:
  # Unparseable output, a member that does not answer, an empty or unresolvable
  # control-plane address set,
  # or any condition that cannot be evaluated all mean "not safe to proceed".
  # Silence is never consent on a path that destroys a node.
  onIndeterminate: unsafe
  # The check is a point-in-time observation of a cluster that keeps changing. It is
  # advisory against a race with an unrelated concurrent failure, and authoritative
  # against the failure it exists to prevent: acting on a control plane that was
  # already degraded before anyone touched it.
  guarantee: point-in-time, fail-closed
  # A consumer must re-evaluate immediately before the destructive step, not once at
  # the start of a multi-step procedure.
  revalidateBeforeDestructiveStep: true

  # THE OBSERVATION BOUND. `revalidateBeforeDestructiveStep: true` is meaningless
  # without one: an observation that took four minutes to gather is not "immediately
  # before" anything, and a consumer with no deadline can block indefinitely on a
  # wedged endpoint and then act on a reading older than the fault it was meant to
  # catch. So the contract bounds the window rather than leaving it to the caller.
  #
  # maxObservationAgeSeconds  — the evaluation is stale once this much wall clock has
  #                             passed since the member set was read. A stale result is
  #                             indeterminate, therefore unsafe; it is never reused.
  # observationDeadlineSeconds — the consumer MUST set a context deadline no longer
  #                             than this on the whole member-set read, including every
  #                             endpoint dial and retry. Exceeding it is a failure to
  #                             observe, which is indeterminate, not "no members".
  #
  # The two are separate on purpose: the first bounds how old an answer may be when it
  # is acted on, the second bounds how long the consumer may wait for one.
  maxObservationAgeSeconds: 30
  observationDeadlineSeconds: 10

  # A KNOWN MISATTRIBUTION, stated so a consumer reports it honestly. The Go consumer
  # reaches etcd through Talos `apid` (pkg/machinery), so "did not answer" conflates two
  # different faults: etcd is down, and etcd is healthy behind a wedged or unreachable
  # apid. Both are indeterminate and both refuse — fail-closed is correct either way —
  # but the operator must not be told the control plane is degraded when the transport
  # is. A consumer reports the transport error it actually got, and never flattens a
  # dial or deadline failure into "N member(s) answered".
  transportFailureIsNotMemberFailure: true

  # Where each predicate applies. This mapping is the contract, not a suggestion: a
  # consumer that evaluates `whole` at `before-destructive-step` aborts every
  # procedure, and one that evaluates `survivable` at `preflight` consents to starting
  # on a cluster that was already one member short before anybody touched it.
  #
  # `points` IS NOT A PIPELINE. A run does not pass through all four in order. It
  # enters at exactly one of `preflight` / `resume` and proceeds from there; the shapes
  # are enumerated in `runShapes` below. Read as a sequence, this contract refuses its
  # own resume path — a crashed recreate leaves the cluster one member short by
  # construction, so `whole` at `preflight` refuses before `resume` is ever reached and
  # `health.predicates[survivable].resumeSemantics` describes a state no run can be in.
  # That was found by implementing it sequentially first (#364, MCAA-404), not argued.
  points:
    - id: preflight
      predicate: whole
      kind: entry
      rule: >-
        Before anything is drained, tainted, removed or destroyed, on a run whose
        declared target is still a member. Entered INSTEAD OF `resume`, never before it.
    - id: before-destructive-step
      predicate: survivable
      kind: in-run
      rule: >-
        Immediately before the member removal, with the outgoing member declared as the
        target. Re-evaluated here even if preflight passed seconds ago.
    - id: resume
      predicate: survivable
      kind: entry
      rule: >-
        On a re-run that finds the declared target already unrepresented — no member for
        it in etcd's membership at all (health.vocabulary.unrepresented).
        Entered INSTEAD OF `preflight`: the cluster is short a member at this point by
        construction, so `whole` is unsatisfiable and evaluating it here would refuse
        every legitimate recovery. The run skips the removal and continues; it never
        removes a second member.
    - id: completion
      predicate: whole
      kind: in-run
      rule: >-
        After the replacement rejoins. Success means the cluster is whole again, not
        that a kubelet reported Ready. Reached by both run shapes.

  # ENTRY IS EXCLUSIVE, AND THE OBSERVATION PICKS IT.
  #
  # `entrySelector` is the part that carries the safety. The entry point is decided by
  # whether the declared target is present in etcd's own membership
  # (health.memberSetSource) — never by a flag, an argument or a state file. ADR-035
  # rejected a `--resume` flag for the reason that applies here unchanged: it moves
  # "is this absence the one I asked for" out of a tested predicate and into an
  # operator typing a flag at 3am on a degraded control plane. A consumer that lets
  # the caller assert the entry point has reintroduced that rejected design, because
  # asserting `resume` is exactly how you get `survivable` at the door.
  #
  # The selection is total, and refusing is a normal outcome of it. Worked, with a row
  # per SENSE of a second fault rather than one row per "absent" — the two senses have
  # different conditions and an earlier revision of this table doubled them into one
  # word, which read as total while covering one sense (MCAA-407). See
  # health.vocabulary; `absent` means in the membership and not answering,
  # `unrepresented` means not in the membership at all.
  #
  #   observed                                    | entry     | predicate  | outcome
  #   --------------------------------------------|-----------|------------|---------
  #   target a member, no other fault             | preflight | whole      | proceeds
  #   target a member, the target itself absent   | preflight | whole      | refuses (member-count)
  #   target a member, another member absent      | preflight | whole      | refuses (member-count)
  #   target a member, another addr unrepresented | preflight | whole      | refuses (member-count)
  #   target unrepresented, no other fault        | resume    | survivable | resumes
  #   target unrepresented, another mbr absent    | resume    | survivable | refuses (absences-are-declared)
  #   target unrepresented, another unrepresented | resume    | survivable | refuses (membership-accounts-for-expected)
  #   membership unknown (no endpoint answered)   | n/a       | n/a        | refuses (onIndeterminate)
  #
  # Rows 3, 4, 6 and 7 are why exclusive entry weakens nothing. The objection to
  # `survivable` at the door — that it consents to starting on an already-degraded
  # cluster — is answered in both senses, not waived: a stranger fails a condition
  # whichever point you entered at, and whichever way it is missing.
  #
  # Row 2 is the ordinary reason anyone runs a recreate -- the node is dead -- and it
  # refuses. That is a decision, not an omission, and it was missing from this table
  # until MCAA-483: a declared target that is still a member and not answering fails
  # `member-count`, so the fresh shape refuses and the operator is sent to the runbook
  # rather than into an automated replacement on a control plane that is already short.
  # The route to the resumed shape is removing the dead member by hand, which makes the
  # target unrepresented. Refusing with bare arithmetic on the ordinary case is not
  # good enough, so the contract carries the procedure the way
  # quorum.removalOfLastMemberGuidance does. It rides with the refusal itself rather
  # than being logged separately: a warning emitted by whichever caller remembers to is
  # a step no test reaches without a cluster.
  #
  # Row 6 is the one exclusive entry had to pay for. The sequential reading evaluated
  # `whole` first, so `member-count` caught a second unrepresented address by accident
  # on every run. The resumed shape does not pass through `whole` before the destructive
  # work, and `absences-are-declared` is scoped to the member list, so nothing saw it:
  # on a 5-member control plane with one undeclared address already out of the
  # membership, quorum arithmetic passes (3 answered >= quorum 3, 0 non-answering
  # members <= maxUnavailable 2) and the run proceeded to wipe a node, learning at
  # `completion` that the cluster was never whole. `membership-accounts-for-expected`
  # restores that backstop at the door of the resumed shape without restoring
  # `member-count`, which the resumed shape cannot satisfy by construction. Reachable at
  # counts 5 and 7 only; at 3 the quorum arithmetic closes it.
  #
  # `resume` is defined by the OBSERVED state, not by history. A target that died on
  # its own and was never removed by an earlier run presents identically and is
  # treated identically, which is correct — the cluster is in the same state and the
  # same procedure finishes it. A consumer must not try to distinguish the two.
  entry: exclusive
  entryPoints: [preflight, resume]
  entrySelector: declared-target-present-in-observed-membership
  entrySelectorIsObserved: true
  # Row 2 of the table above, as data the consumer prints rather than prose a reader
  # has to find. `refuse` is not a discretion: the target is still a member, so the
  # membership is complete and only the answering clause of `member-count` fails.
  deadDeclaredTarget: refuse
  deadDeclaredTargetGuidance: >-
    The node to be recreated is still an etcd member but is not answering, so the
    cluster is not whole and this fresh run refuses. Remove the dead member first
    (`talosctl -n <surviving-cp> etcd remove-member <id>`), which leaves the target
    unrepresented, then re-run: the guard enters at `resume` and finishes the recreate
    without removing a second member. See docs/runbooks/talos-upgrade.md.
  runShapes:
    - id: fresh
      when: The declared target is still a member of etcd's own membership.
      sequence: [preflight, before-destructive-step, completion]
    - id: resumed
      when: The declared target is already unrepresented in etcd's own membership.
      sequence: [resume, completion]

# ---------------------------------------------------------------------------
# Consumers. Each carries a conformance test asserting its behaviour against the
# `quorum.table` rows, the `health.predicates` and the `evaluation.points` mapping
# above (ADR-030's shape: the checker is tested, not trusted). A consumer that
# implements only one predicate is not conformant, however careful that predicate is.
# Neither is one that implements all four points as a pipeline: conformance includes
# entering at `preflight` or `resume` exclusively, chosen from the observed membership,
# a test that an unrepresented target resumes rather than refuses, and a test that a
# SECOND unrepresented address refuses there — that last one is the case exclusive entry
# took out of `member-count`'s reach (health.vocabulary.whyItMatters).
#
# The entry clause binds a consumer that runs the destructive removal procedure. The
# quorum table and the predicates bind every consumer. `conformant` states where each
# one actually is rather than what this file would like to be true of it, and `full`
# means conformant on every clause that binds that consumer — each entry below says
# which those are. `runShapes` lists the evaluation.runShapes a consumer runs; the
# entry clause binds it iff `resumed` is listed, and an omitted list means every shape.
# ---------------------------------------------------------------------------
consumers:
  - id: homelab-cli
    language: go
    path: cmd/homelab/commands/talos_etcd.go
    role: Control-plane node recreate guard (#39).
    runShapes: [fresh, resumed]
    # Computes the quorum numbers from this file, selects the entry point from the
    # observed membership, and its loader refuses a contract naming a condition it does
    # not implement. internal/etcd carries the entry and resume conformance tests.
    conformant: full
  - id: cp-storage-migrate
    language: typescript
    path: scripts/cp-storage-migrate.ts
    role: Control-plane storage migration pre/post-flight.
    runShapes: [fresh]
    # Reads the quorum formula, the raft tolerance, the observation bounds and the
    # predicate for each of its gates from this file; observes etcd's own membership
    # through `talosctl etcd members` rather than the addresses it dialled; and refuses
    # to load a contract naming a condition it does not implement, as the Go loader
    # does. scripts/lib/topology-contract.ts is the loader and evaluator;
    # scripts/cp-storage-migrate-conformance_test.ts is the conformance test (MCAA-482).
    #
    # It runs the `fresh` run shape and only that one. It stops a control-plane VM and
    # starts it again, and never removes an etcd member, so a node it is working on is
    # absent (health.vocabulary.absent) and never unrepresented: no observation can
    # select `resume`, and the entry clause does not bind it. A run that finds a node
    # already stopped refuses at `preflight`, which is what the runbook asks for —
    # recover that node before touching the next.
    conformant: full
