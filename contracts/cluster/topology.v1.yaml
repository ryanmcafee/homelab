# Control-plane topology and the etcd quorum rule, v1.
#
# Normative. Reasoning and decision: ADR-031 in docs/project_notes/decisions.md.
#
# This file exists because the same safety rule has two consumers in two languages:
#
#   - Go:         `homelab talos recreate` (cmd/homelab/commands/talos.go), the
#                 distributable CLI path — ADR-030.
#   - TypeScript: scripts/cp-storage-migrate.ts, repository scripting — ADR-005.
#
# Neither is slated to move. Under ADR-030 a second implementation of shared logic is a
# review failure, and this is the rule that decides whether it is safe to destroy a
# control-plane node. So the rule lives here as data and both sides read it. A constant
# in either language that restates a value from this file is rejected at review.
#
# What is deliberately NOT here: parsing `talosctl etcd status` output. That is an
# adapter to one release of one CLI's human-readable table, it is private to whichever
# binary shells out, and two of them are acceptable. See ADR-031.

version: 1

# ---------------------------------------------------------------------------
# Topology. The count is operator configuration, not a repository constant:
# a fork is not required to have this cluster's shape (ADR-028, ADR-032).
# ---------------------------------------------------------------------------
controlPlane:
  # ConfigSet key supplying the expected control-plane member count.
  # Required, and deliberately absent from configuration/environments/defaults.yaml:
  # failing at resolve beats coming up wrong with somebody else's topology.
  countKey: CONTROL_PLANE_COUNT
  countRequired: true
  # Odd only. An even member count adds a failure to tolerate without adding a
  # failure it can survive, and it is nearly always a mistake rather than a choice.
  permittedCounts: [1, 3, 5, 7]
  # Single-member control planes have no fault tolerance at all. Permitted, because a
  # one-node homelab is a real and supported fork, but the guard must say so out loud
  # rather than report a healthy cluster.
  degradedCounts: [1]

# ---------------------------------------------------------------------------
# The quorum rule. `quorum` is the minimum number of members that must be present
# for the cluster to accept writes; `maxUnavailable` is how many a destructive
# operation may take away and still leave quorum.
# ---------------------------------------------------------------------------
quorum:
  formula: floor(count / 2) + 1
  maxUnavailableFormula: count - quorum
  # Worked values, asserted by each consumer's conformance test against this file.
  # A consumer that computes a different number for any row here fails its test.
  table:
    - { count: 1, quorum: 1, maxUnavailable: 0 }
    - { count: 3, quorum: 2, maxUnavailable: 1 }
    - { count: 5, quorum: 3, maxUnavailable: 2 }
    - { count: 7, quorum: 4, maxUnavailable: 3 }

# ---------------------------------------------------------------------------
# The health predicate. Every condition must hold for the cluster to be considered
# whole. This is the runbook's gate, previously encoded only in
# scripts/cp-storage-migrate.ts `etcdHealth` (L476).
# ---------------------------------------------------------------------------
health:
  conditions:
    - id: member-count
      rule: The number of members that answered equals CONTROL_PLANE_COUNT.
    - id: no-errors
      rule: No member reports a non-empty ERRORS field.
    - id: no-learners
      rule: No member is a learner. A learner does not vote and does not count toward quorum.
    - id: single-leader
      rule: Exactly one member reports itself leader.
    - id: raft-index-converged
      rule: >-
        Every member's RAFT INDEX is within `raftIndexTolerance` of the highest observed
        index. Members are queried at slightly different moments on a cluster that keeps
        writing, so exact equality is not a usable gate; a member many indices behind is
        still catching up and must not be counted as caught up.

  # How far behind the highest RAFT INDEX a member may be and still count as matching.
  # Changing this number is a contract change (ADR-029), not an edit to a constant.
  raftIndexTolerance: 10

# ---------------------------------------------------------------------------
# Failure semantics. Stated explicitly because the caller is destructive and the
# cost of the two error directions is not symmetric.
# ---------------------------------------------------------------------------
evaluation:
  # Unparseable output, a member that does not answer, a missing CONTROL_PLANE_COUNT,
  # or any condition that cannot be evaluated all mean "not safe to proceed".
  # Silence is never consent on a path that destroys a node.
  onIndeterminate: unsafe
  # The check is a point-in-time observation of a cluster that keeps changing. It is
  # advisory against a race with an unrelated concurrent failure, and authoritative
  # against the failure it exists to prevent: acting on a control plane that was
  # already degraded before anyone touched it.
  guarantee: point-in-time, fail-closed
  # A consumer must re-evaluate immediately before the destructive step, not once at
  # the start of a multi-step procedure.
  revalidateBeforeDestructiveStep: true

# ---------------------------------------------------------------------------
# Consumers. Each carries a conformance test asserting its behaviour against the
# `quorum.table` rows and the `health.conditions` above (ADR-029's shape: the
# checker is tested, not trusted).
# ---------------------------------------------------------------------------
consumers:
  - id: homelab-cli
    language: go
    path: cmd/homelab/commands/talos.go
    role: Control-plane node recreate guard (#39).
  - id: cp-storage-migrate
    language: typescript
    path: scripts/cp-storage-migrate.ts
    role: Control-plane storage migration pre/post-flight.
