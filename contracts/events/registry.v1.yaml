# The registered event types, v1.
#
# Normative. Checked by `bun scripts/contract-check.ts` (task contracts:check).
# An event type that is not in here is not published. A type in here may not change
# shape within its major version except additively.
#
# Fields per type:
#   type            CloudEvents `type`. Its last four tokens mirror the subject:
#                   <domain>.<entity>.<action>.<major>. The checker enforces that.
#   subject         The NATS subject template it is published on.
#   pattern         pubsub | request_reply
#   delivery        at_least_once | at_most_once. Never "exactly_once".
#   ordering        per_subject | none
#   dataschema      Schema for `data`, relative to contracts/events/. Must resolve to a
#                   file that exists; the checker opens it.
#   dataless        true when the type carries no body. Mutually exclusive with
#                   `dataschema`.
#   requires        Envelope attributes required beyond the envelope schema's own list.
#                   Both a promise to consumers and an obligation on the producer, so
#                   ADDING one and REMOVING one are each breaking.
#   completion      `wq` types only, and required on them: the registered `.ev` type that
#                   reports the outcome, correlated by `correlationid`. A durable request
#                   has no synchronous reply, so without this a requester has no way to
#                   learn the work finished.
#   producer        The component that owns the type. One owner, always. This is a TRUST
#                   BOUNDARY — publish permission is granted per subject prefix to this
#                   component's NATS credential — so reassigning it is breaking and needs
#                   an ADR, not a passing gate.
#   status          stable | experimental. `experimental` types are exempt from the
#                   compatibility gate and MUST NOT be consumed across a trust boundary.
#                   Demoting stable -> experimental is breaking.
#
# There is NO `durable_request` field. Durability is derived from the subject suffix
# (`wq` = PF_WORK and durable, `rq` = core NATS and not), which is the one place a reader
# already sees it. A second source of truth for the same fact only creates drift (ADR-038).

version: 1

types:
  - type: com.mcafeeconsulting.platform.workload.deployment.deployed.v1
    subject: pf.<tenant>.workload.deployment.deployed.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/workload.deployed.v1.schema.json
    requires: [subject]
    producer: workload-operator
    status: stable

  - type: com.mcafeeconsulting.platform.workload.deployment.degraded.v1
    subject: pf.<tenant>.workload.deployment.degraded.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/workload.degraded.v1.schema.json
    requires: [subject]
    producer: workload-operator
    status: stable

  - type: com.mcafeeconsulting.platform.gitops.application.synced.v1
    subject: pf.<tenant>.gitops.application.synced.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/gitops.application.synced.v1.schema.json
    requires: [subject]
    producer: gitops-bridge
    status: stable

  - type: com.mcafeeconsulting.platform.gitops.application.drifted.v1
    subject: pf.<tenant>.gitops.application.drifted.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/gitops.application.drifted.v1.schema.json
    requires: [subject]
    producer: gitops-bridge
    status: stable

  - type: com.mcafeeconsulting.platform.infra.node.replaced.v1
    subject: pf.<tenant>.infra.node.replaced.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/infra.node.replaced.v1.schema.json
    requires: [subject]
    producer: infra-operator
    status: stable

  - type: com.mcafeeconsulting.platform.control.bootstrap.progressed.v1
    subject: pf.<tenant>.control.bootstrap.progressed.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/platform.bootstrap.progressed.v1.schema.json
    requires: [correlationid]
    producer: homelab-cli
    status: stable

  - type: com.mcafeeconsulting.platform.identity.principal.issued.v1
    subject: pf.<tenant>.identity.principal.issued.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/identity.principal.issued.v1.schema.json
    requires: [subject, correlationid]
    producer: identity-broker
    status: stable

  - type: com.mcafeeconsulting.platform.identity.principal.revoked.v1
    subject: pf.<tenant>.identity.principal.revoked.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/identity.principal.revoked.v1.schema.json
    requires: [subject, correlationid]
    producer: identity-broker
    status: stable

  - type: com.mcafeeconsulting.platform.observability.slo.burned.v1
    subject: pf.<tenant>.observability.slo.burned.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/observability.slo.burned.v1.schema.json
    requires: [subject]
    producer: slo-bridge
    status: stable

  - type: com.mcafeeconsulting.platform.workload.deployment.describe.v1
    subject: pf.<tenant>.workload.deployment.describe.v1.rq
    pattern: request_reply
    delivery: at_most_once
    ordering: none
    dataschema: data/workload.describe.v1.schema.json
    requires: [replyto, correlationid, subject]
    producer: platform-api
    status: stable

  - type: com.mcafeeconsulting.platform.workload.deployment.promote.v1
    subject: pf.<tenant>.workload.deployment.promote.v1.wq
    pattern: request_reply
    delivery: at_least_once
    ordering: none
    dataschema: data/workload.promote.v1.schema.json
    requires: [correlationid, subject]
    completion: com.mcafeeconsulting.platform.workload.deployment.promoted.v1
    producer: platform-api
    status: stable

  # The completion half of the durable request above. A `wq` request cannot be answered
  # on a `_INBOX` reply subject — the inbox will not survive the wait that made the
  # request durable in the first place — so the outcome comes back as a normal persisted
  # event carrying the request's `correlationid`. That reuses the pub/sub path and its
  # durability instead of inventing a fourth delivery path (ADR-038).
  - type: com.mcafeeconsulting.platform.workload.deployment.promoted.v1
    subject: pf.<tenant>.workload.deployment.promoted.v1.ev
    pattern: pubsub
    delivery: at_least_once
    ordering: per_subject
    dataschema: data/workload.promoted.v1.schema.json
    requires: [subject, correlationid]
    producer: workload-operator
    status: stable
