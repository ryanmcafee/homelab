version: '3'

env:
  TF_PLUGIN_CACHE_DIR: "{{.HOME}}/.terraform.d/plugin-cache"

tasks:
  # ==========================================================================
  # Setup and Prerequisites
  # ==========================================================================

  setup:
    desc: Full homelab setup (validates prereqs, then runs setup script)
    cmds:
      - task: validate
      - ./scripts/setup.sh

  validate:
    desc: Validate prerequisites are installed
    cmds:
      - ./scripts/validate-prerequisites.sh

  install-tools:
    desc: Install required CLI tools via mise
    cmds:
      - mise install -y

  mise:doctor:
    desc: Run mise diagnostics
    cmds:
      - mise doctor

  mise:upgrade:
    desc: Upgrade all mise-managed tools to latest versions
    cmds:
      - mise upgrade

  mise:outdated:
    desc: Check for outdated tools
    cmds:
      - mise ls --outdated

  mise:list:
    desc: List installed tools and their versions
    cmds:
      - mise ls --current

  # ==========================================================================
  # Local Development (Kind + Tilt)
  # ==========================================================================

  localdev:up:
    desc: Start local development environment
    cmds:
      - task: localdev:kind
      - task: localdev:tilt

  localdev:kind:
    desc: Create Kind cluster for local development
    dir: localdev
    cmds:
      - |
        if ! kind get clusters | grep -q homelab-localdev; then
          kind create cluster --config kind-config.yaml
        else
          echo "Cluster already exists"
        fi
      - kubectl cluster-info --context kind-homelab-localdev

  localdev:tilt:
    desc: Start Tilt for hot-reload development (direct mode)
    dir: localdev
    cmds:
      - tilt up

  localdev:tilt:argocd:
    desc: Start Tilt in ArgoCD mode (realistic GitOps)
    dir: localdev
    cmds:
      - tilt up -- --mode=argocd

  localdev:down:
    desc: Tear down local development environment
    cmds:
      - tilt down --file localdev/Tiltfile || true
      - kind delete cluster --name homelab-localdev

  localdev:reset:
    desc: Reset local environment (full teardown + recreate)
    cmds:
      - task: localdev:down
      - task: localdev:up

  localdev:logs:
    desc: Stream logs from all pods
    cmds:
      - stern --all-namespaces '.*'

  localdev:shell:
    desc: Open shell in a debug pod
    cmds:
      - kubectl run -it --rm debug --image=busybox --restart=Never -- sh

  # ==========================================================================
  # Helm Charts
  # ==========================================================================

  chart:lint:
    desc: Lint all Helm charts
    cmds:
      - helm lint charts/gitops
      - helm lint charts/addons
      - helm lint charts/applications

  chart:template:
    desc: Template gitops chart for debugging
    cmds:
      - helm template gitops charts/gitops -f charts/gitops/values-localdev.yaml

  chart:template:addons:
    desc: Template addons chart
    cmds:
      - helm template addons charts/addons -f charts/addons/values-localdev.yaml

  chart:template:apps:
    desc: Template applications chart
    cmds:
      - >
        helm template applications charts/applications
        -f charts/applications/values-localdev.yaml

  chart:diff:
    desc: Show diff of what would change in Kind cluster
    cmds:
      - >
        helm diff upgrade gitops charts/gitops
        -f charts/gitops/values-localdev.yaml -n argocd

  # ==========================================================================
  # Ansible
  # ==========================================================================

  ansible:lint:
    desc: Lint Ansible playbooks
    dir: ansible
    cmds:
      - ansible-lint

  ansible:syntax:
    desc: Check Ansible playbook syntax
    dir: ansible
    cmds:
      - ansible-playbook --syntax-check playbooks/site.yml

  ansible:dry-run:
    desc: Run Ansible playbooks in check mode
    dir: ansible
    cmds:
      - ansible-playbook playbooks/site.yml --check --diff

  ansible:apply:
    desc: Apply Ansible playbooks to Proxmox
    dir: ansible
    cmds:
      - ansible-playbook playbooks/site.yml

  # ==========================================================================
  # TrueNAS Configuration
  # ==========================================================================

  truenas:setup:
    desc: Configure TrueNAS after VM installation
    dir: ansible
    cmds:
      - ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml

  truenas:status:
    desc: Check TrueNAS configuration status
    dir: ansible
    cmds:
      - ansible-playbook -i inventory/homelab.yml playbooks/truenas-status.yml

  truenas:dry-run:
    desc: Run TrueNAS setup in check mode
    dir: ansible
    cmds:
      - ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml --check --diff

  # ==========================================================================
  # Terragrunt / Terraform
  # ==========================================================================
  # All tf:* commands use `op run` to inject secrets from 1Password at runtime.
  # Secrets are only available for the duration of the command.
  # Requires: OP_SERVICE_ACCOUNT_TOKEN set in environment (from ~/.op/op_service_account_token)

  tf:fmt:
    desc: Format all Terraform/Terragrunt files
    dir: terragrunt
    cmds:
      - terragrunt hclfmt

  tf:validate:
    desc: Validate Terraform configurations
    dir: terragrunt
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run-all validate

  tf:init:
    desc: Run Terragrunt init for environment
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run-all init
    vars:
      ENV: '{{.ENV | default "homelab"}}'

  tf:init:component:
    desc: Run Terragrunt init for a specific component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt init
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  tf:plan:
    desc: Run Terragrunt plan for environment
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run-all plan {{.TF_ARGS}}
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      TF_ARGS: '{{.TF_ARGS | default ""}}'

  tf:plan:component:
    desc: Run Terragrunt plan for a specific component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt plan
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  tf:apply:
    desc: Run Terragrunt apply for environment
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run-all apply --terragrunt-non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'

  tf:apply:component:
    desc: Run Terragrunt apply for a specific component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt apply --terragrunt-non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  tf:destroy:
    desc: Destroy infrastructure (use with caution)
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run-all destroy --terragrunt-non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'
    prompt: Are you sure you want to destroy the {{.ENV}} environment?

  tf:destroy:component:
    desc: Destroy a specific component (use with caution)
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt destroy --terragrunt-non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'
    prompt: Are you sure you want to destroy {{.COMPONENT}} in {{.ENV}}?

  tf:output:
    desc: Show Terragrunt outputs for a component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt output
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  # ==========================================================================
  # Cilium CNI
  # ==========================================================================

  cilium:render:
    desc: Render Cilium Helm chart to YAML for inline installation
    cmds:
      - helm repo add cilium https://helm.cilium.io/ || true
      - helm repo update cilium
      - |
        helm template cilium cilium/cilium --version 1.18.0 \
          --namespace kube-system \
          --set ipam.mode=kubernetes \
          --set kubeProxyReplacement=true \
          --set k8sServiceHost=localhost \
          --set k8sServicePort=7445 \
          --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
          --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
          --set cgroup.autoMount.enabled=false \
          --set cgroup.hostRoot=/sys/fs/cgroup \
          --set l2announcements.enabled=true \
          --set externalIPs.enabled=true \
          --set hubble.relay.enabled=true \
          --set hubble.ui.enabled=true \
          > terragrunt/files/cilium-rendered.yaml
      - echo "Cilium manifests rendered to terragrunt/files/cilium-rendered.yaml"

  # ==========================================================================
  # Talos
  # ==========================================================================

  talos:gen-config:
    desc: Generate Talos machine configurations
    dir: talos
    cmds:
      - talosctl gen config homelab https://172.16.100.11:6443

  talos:apply:
    desc: Apply Talos configuration to nodes
    cmds:
      - echo "Apply Talos configs (implement based on cluster state)"

  talos:bootstrap:
    desc: Bootstrap Talos cluster
    cmds:
      - talosctl bootstrap -n 172.16.100.11

  talos:kubeconfig:
    desc: Retrieve kubeconfig from Talos
    cmds:
      - talosctl kubeconfig -n 172.16.100.11

  # ==========================================================================
  # Kubernetes Operations
  # ==========================================================================

  k8s:status:
    desc: Show cluster status
    cmds:
      - kubectl get nodes
      - kubectl get pods -A

  k8s:argocd-password:
    desc: Retrieve ArgoCD admin password
    cmds:
      - >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath='{.data.password}' | base64 -d

  # ==========================================================================
  # CI/CD Testing
  # ==========================================================================

  ci:lint:
    desc: Run all linting tasks (for CI)
    cmds:
      - task: ansible:lint
      - task: chart:lint
      - yamllint .

  ci:test:
    desc: Run all tests
    cmds:
      - task: ci:lint
      - task: tf:validate
      - task: localdev:up
      - task: localdev:down

  # ==========================================================================
  # Utilities
  # ==========================================================================

  clean:
    desc: Clean temporary files
    cmds:
      - rm -rf .terraform .terragrunt-cache .tilt-cache .task
      - find . -name "*.retry" -delete

  docs:
    desc: Generate/update documentation
    cmds:
      - echo "Documentation tasks (implement as needed)"

  default:
    desc: Show available tasks
    cmds:
      - task --list
