version: '3'

env:
  TF_PLUGIN_CACHE_DIR: "{{.HOME}}/.terraform.d/plugin-cache"

# Addresses and the domain come from the gitignored
# configuration/environments/homelab.yaml so that no real value is committed
# here (the PII guard scans this file). Empty when the file is absent (forks,
# CI), which only matters for the production-facing tasks that use them.
vars:
  PROXMOX_IP:
    sh: yq -r '.PROXMOX_IP // ""' configuration/environments/homelab.yaml 2>/dev/null || true
  CP1_IP:
    sh: yq -r '.CP1_IP // ""' configuration/environments/homelab.yaml 2>/dev/null || true
  DOMAIN:
    sh: yq -r '.DOMAIN // ""' configuration/environments/homelab.yaml 2>/dev/null || true
  LAN_CIDR:
    sh: yq -r '.NFS_SHARE_ALLOW // ""' configuration/environments/homelab.yaml 2>/dev/null || true

tasks:
  # ==========================================================================
  # Setup and Prerequisites
  # ==========================================================================

  setup:
    desc: "Tier-aware setup: Kind loop by default, production only with -- --environment homelab (runs the prerequisite table first)"
    cmds:
      - go run ./cmd/homelab bootstrap {{.CLI_ARGS}}

  validate:
    desc: "Prerequisite table for a tier with a fix hint per missing row (-- --environment homelab for production)"
    cmds:
      - go run ./cmd/homelab validate {{.CLI_ARGS}}

  install-tools:
    desc: Install required CLI tools via mise (also creates the terraform plugin cache dir mise.toml points at)
    cmds:
      - mise install -y
      - mkdir -p .terraform.d/plugin-cache

  mise:doctor:
    desc: Run mise diagnostics
    cmds:
      - mise doctor

  mise:upgrade:
    desc: Upgrade all mise-managed tools to latest versions
    cmds:
      - mise upgrade

  mise:outdated:
    desc: Check for outdated tools
    cmds:
      - mise ls --outdated

  mise:list:
    desc: List installed tools and their versions
    cmds:
      - mise ls --current

  # ==========================================================================
  # Local Development (Kind + Tilt)
  # ==========================================================================

  localdev:up:
    desc: "Kind + ArgoCD loop: cluster (Cilium, fakes) -> ArgoCD -> sync every Application from the working tree"
    cmds:
      - task: localdev:kind
      - task: localdev:argocd
      - task: localdev:sync

  localdev:kind:
    desc: Create the Kind cluster (Cilium CNI, registry pull-through cache, localdev fakes); idempotent
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-kind.ts up {{.CLI_ARGS}}

  localdev:fakes:
    desc: (Re)apply the localdev fakes in localdev/fakes (StorageClass aliases, seeded Secrets, OnePasswordItem CRD)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-kind.ts fakes {{.CLI_ARGS}}

  localdev:registry:
    desc: Start the registry pull-through caches used by Kind (task localdev:registry -- down|status)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-kind.ts registry {{.CLI_ARGS | default "up"}}

  localdev:argocd:
    desc: "Install ArgoCD into Kind (chart version from configuration/versions.yaml, health Lua from charts/bootstrap/files/health) and apply the root Application at the PR head (-- --revision <ref> or LOCALDEV_REVISION; default: the upstream branch of HEAD, else main)"
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts install {{.CLI_ARGS}}

  localdev:sync:
    desc: Sync every Application from the working tree (argocd app sync --local), wave by wave (task localdev:sync -- --warm for bootstrap+addons only)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts sync {{.CLI_ARGS}}

  localdev:wait:
    desc: Block until every Application is Healthy with a succeeded sync; dumps conditions, events and pod logs on failure
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts wait {{.CLI_ARGS}}

  localdev:diagnose:
    desc: Print Application conditions, unhealthy resources, events and failing pod logs
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts diagnose {{.CLI_ARGS}}

  localdev:report:
    desc: "Markdown report of the Kind loop (Application table, level-2 summary, argocd app diff --revision <base> of every git-path app; -- --base <ref> or LOCALDEV_BASE, default main); tilt-ci.yml posts it on PRs"
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts report {{.CLI_ARGS}}

  localdev:ui:
    desc: "ArgoCD UI at http://localhost:8080 via kubectl port-forward (Docker Desktop cannot deliver the NodePort through Cilium; admin password: task k8s:argocd-password)"
    cmds:
      - kubectl --context kind-homelab-localdev -n argocd port-forward svc/argocd-server 8080:80 --address 127.0.0.1

  localdev:traefik:
    desc: "Traefik internal ingress at http://localhost:9080 and https://localhost:9443 via kubectl port-forward (use a Host header or /etc/hosts entries for *.homelab.local)"
    cmds:
      - kubectl --context kind-homelab-localdev -n traefik port-forward svc/traefik-internal 9080:80 9443:443 --address 127.0.0.1

  localdev:warm:
    desc: "Warm cluster: Kind + registry cache + ArgoCD + bootstrap/addons synced (operators and CRDs), applications left for localdev:sync"
    cmds:
      - task: localdev:kind
      - task: localdev:argocd
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts sync --warm

  localdev:ci:
    desc: "Non-interactive full loop (what tilt-ci.yml runs): kind -> argocd -> sync -> wait -> e2e"
    cmds:
      - task: localdev:kind
      - task: localdev:argocd
      - task: localdev:sync
      - task: localdev:wait
      - task: test:e2e

  localdev:tilt:
    desc: Start Tilt for hot-reload development (direct mode, no ArgoCD)
    dir: localdev
    cmds:
      - tilt up

  localdev:tilt:argocd:
    desc: Start Tilt in ArgoCD mode (wraps localdev:argocd / localdev:sync and re-syncs on chart changes)
    dir: localdev
    cmds:
      - tilt up -- --mode=argocd

  localdev:down:
    desc: Tear down the Kind cluster (registry caches are kept; task localdev:registry -- down removes them)
    cmds:
      - tilt down --file localdev/Tiltfile || true
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-kind.ts down {{.CLI_ARGS}}

  localdev:reset:
    desc: Reset local environment (full teardown + recreate)
    cmds:
      - task: localdev:down
      - task: localdev:up

  localdev:logs:
    desc: Stream logs from all pods
    cmds:
      - stern --all-namespaces '.*'

  localdev:shell:
    desc: Open shell in a debug pod
    cmds:
      - kubectl run -it --rm debug --image=busybox --restart=Never -- sh

  # ==========================================================================
  # Helm Charts
  # ==========================================================================

  chart:lint:
    desc: Lint all Helm charts
    cmds:
      - helm lint charts/gitops
      - helm lint charts/addons
      - helm lint charts/applications

  chart:template:
    desc: Template gitops chart for debugging
    cmds:
      - helm template gitops charts/gitops -f charts/gitops/values-localdev.yaml

  chart:template:addons:
    desc: Template addons chart
    cmds:
      - helm template addons charts/addons -f charts/addons/values-localdev.yaml

  chart:template:apps:
    desc: Template applications chart
    cmds:
      - >
        helm template applications charts/applications
        -f charts/applications/values-localdev.yaml

  chart:diff:
    desc: Show diff of what would change in Kind cluster
    cmds:
      - >
        helm diff upgrade gitops charts/gitops
        -f charts/gitops/values-localdev.yaml -n argocd

  # ==========================================================================
  # Ansible
  # ==========================================================================

  ansible:inventory:
    desc: "Render ansible/inventory/homelab.yml (gitignored) from configuration/ — every address Ansible needs comes from there"
    cmds:
      - go run ./cmd/homelab config export --set homelab --format ansible-inventory

  ansible:lint:
    desc: Lint Ansible playbooks
    dir: ansible
    cmds:
      - ansible-lint

  ansible:syntax:
    desc: Check Ansible playbook syntax
    dir: ansible
    deps: [ansible:inventory]
    cmds:
      - ansible-playbook --syntax-check playbooks/site.yml

  ansible:init:
    desc: Install Ansible Galaxy collections
    dir: ansible
    cmds:
      - ansible-galaxy collection install -r requirements.yml --force
    status:
      - test -d ~/.ansible/collections/ansible_collections/community/crypto
      - test -d ~/.ansible/collections/ansible_collections/community/general
      - test -d ~/.ansible/collections/ansible_collections/ansible/posix

  ansible:dry-run:
    desc: Run Ansible playbooks in check mode
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - ansible-playbook playbooks/site.yml --check --diff

  ansible:apply:
    desc: Apply Ansible playbooks to Proxmox
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - ansible-playbook playbooks/site.yml

  # ==========================================================================
  # TrueNAS Configuration
  # ==========================================================================

  truenas:configure:
    desc: Configure TrueNAS after VM installation (legacy playbook)
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml

  truenas:status:
    desc: Check TrueNAS configuration status
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - ansible-playbook -i inventory/homelab.yml playbooks/truenas-status.yml

  truenas:dry-run:
    desc: Run TrueNAS setup in check mode
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml --check --diff

  truenas:configure-lan:
    desc: Configure TrueNAS LAN network interface (VLAN 10)
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml --tags lan-network

  # ==========================================================================
  # TrueNAS Automation (Packer + Full Setup)
  # ==========================================================================

  truenas:setup:
    desc: Full TrueNAS setup (deploy from template + configure + verify)
    cmds:
      - echo "=== Starting TrueNAS Automated Provisioning ==="
      - task: truenas:check-template
      - task: truenas:full-setup
      - echo "=== Verifying TrueNAS Deployment ==="
      - echo "Checking TrueNAS API accessibility..."
      - op run --env-file={{.ROOT_DIR}}/.env.op -- sh -c 'curl -k -s --connect-timeout 10 -u "truenas_admin:$TRUENAS_ADMIN_PASSWORD" https://truenas.{{.DOMAIN}}/api/v2.0/system/info | jq -r ".version // \"API not accessible\""'

  truenas:check-template:
    desc: Verify TrueNAS template exists in Proxmox
    cmds:
      - |
        if ! op run --env-file={{.ROOT_DIR}}/.env.op -- ssh root@{{.PROXMOX_IP}} "qm config 9000 | grep -q 'template: 1'" 2>/dev/null; then
          echo "ERROR: TrueNAS template (VM 9000) not found!"
          echo "Run 'task truenas:build-template' to create it manually."
          exit 1
        fi
        echo "Template VM 9000 found."

  truenas:build-template:
    desc: Build TrueNAS Packer template (requires manual installation via VNC)
    dir: packer/truenas
    cmds:
      - echo "=== Creating TrueNAS Template VM ==="
      - echo "NOTE{{":"}} TrueNAS requires manual installation via Proxmox VNC console."
      - mise exec -- op run --env-file={{.ROOT_DIR}}/.env.op -- packer init .
      - mise exec -- op run --env-file={{.ROOT_DIR}}/.env.op -- sh -c 'PKR_VAR_proxmox_username="$TF_VAR_proxmox_api_token_id" PKR_VAR_proxmox_token="$TF_VAR_proxmox_api_token_secret" PKR_VAR_truenas_admin_password="$TRUENAS_ADMIN_PASSWORD" packer build .'
      - echo ""
      - echo "=== MANUAL STEP REQUIRED ==="
      - echo "1. Open Proxmox console{{":"}} https://{{.PROXMOX_IP}}:8006"
      - echo "2. Select VM 9000 and open Console (VNC)"
      - echo "3. Complete TrueNAS installation manually"
      - echo "4. After installation, run{{":"}} task truenas:finalize-template"

  truenas:finalize-template:
    desc: Finalize TrueNAS template after manual installation
    cmds:
      - echo "Shutting down VM 9000..."
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ssh root@{{.PROXMOX_IP}} "qm shutdown 9000 --timeout 60 || true"
      - sleep 10
      - echo "Removing installation ISO..."
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ssh root@{{.PROXMOX_IP}} "qm set 9000 --delete ide2 2>/dev/null || true"
      - echo "Setting boot order..."
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ssh root@{{.PROXMOX_IP}} "qm set 9000 --boot 'order=virtio0;net0'"
      - echo "Converting to template..."
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ssh root@{{.PROXMOX_IP}} "qm template 9000"
      - echo "Template finalized successfully!"

  truenas:validate-template:
    desc: Validate Packer template configuration
    dir: packer/truenas
    cmds:
      - packer validate .

  truenas:deploy:
    desc: Deploy TrueNAS from template and configure via Ansible
    cmds:
      - task: tf:apply:component
        vars:
          COMPONENT: truenas

  truenas:destroy:
    desc: Destroy TrueNAS VM (use with caution)
    cmds:
      - task: tf:destroy:component
        vars:
          COMPONENT: truenas
    prompt: Are you sure you want to destroy the TrueNAS VM?

  truenas:full-setup:
    desc: Complete TrueNAS workflow (deploy + configure)
    cmds:
      - echo "Starting TrueNAS full setup workflow..."
      - task: truenas:deploy
      - echo "TrueNAS deployment complete!"
      - echo "Access TrueNAS at https://truenas.{{.DOMAIN}}"

  truenas:ansible-only:
    desc: Run Ansible setup only (for existing VM)
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ansible-playbook -i inventory/homelab.yml playbooks/truenas-full-setup.yml

  truenas:image-cache:
    desc: Deploy Talos image cache on TrueNAS (local registry mirror)
    dir: ansible
    deps:
      - ansible:init
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- ansible-playbook -i inventory/homelab.yml playbooks/truenas-setup.yml --tags image-cache

  truenas:fix-nfs-shares:
    desc: Update existing NFS shares to use mapall (fixes PVC permissions)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read scripts/truenas-nfs-mapall.ts --all

  truenas:fix-nfs-shares:dry-run:
    desc: Preview NFS share mapall updates (dry run)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read scripts/truenas-nfs-mapall.ts --all --dry-run

  truenas:fix-k8s-volumes:
    desc: Fix existing k8s volume permissions and NFS shares to apps:users (568:100)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read scripts/truenas-nfs-mapall.ts --fix-permissions

  truenas:fix-k8s-volumes:dry-run:
    desc: Preview k8s volume permission and NFS share fixes (dry run)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read scripts/truenas-nfs-mapall.ts --fix-permissions --dry-run

  truenas:pvc-cleanup:
    desc: Clean up orphaned TrueNAS datasets not in use by Kubernetes PVCs
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read --allow-run scripts/truenas-pvc-cleanup.ts --delete

  truenas:pvc-cleanup:dry-run:
    desc: Preview orphaned TrueNAS dataset cleanup (no changes)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read --allow-run scripts/truenas-pvc-cleanup.ts

  truenas:iscsi-migrate:
    desc: Migrate iSCSI volumes to deterministic PV naming
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read --allow-run scripts/truenas-iscsi-migrate.ts --execute

  truenas:iscsi-migrate:dry-run:
    desc: Preview iSCSI volume migration (no changes)
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- deno run --allow-net --allow-env --allow-read --allow-run scripts/truenas-iscsi-migrate.ts

  # ==========================================================================
  # Terragrunt / Terraform
  # ==========================================================================
  # All tf:* commands use `op run` to inject secrets from 1Password at runtime.
  # Secrets are only available for the duration of the command.
  # Requires: OP_SERVICE_ACCOUNT_TOKEN set in environment (from ~/.op/op_service_account_token)

  tf:fmt:
    desc: Format all Terraform/Terragrunt files
    dir: terragrunt
    cmds:
      - terragrunt hclfmt

  tf:validate:
    desc: Validate Terraform configurations
    dir: terragrunt
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run --all validate

  tf:init:
    desc: Run Terragrunt init for environment
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run --all init
    vars:
      ENV: '{{.ENV | default "homelab"}}'

  tf:init:component:
    desc: Run Terragrunt init for a specific component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt init
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  tf:plan:
    desc: Run Terragrunt plan for environment (auto-syncs rendered files from 1Password)
    dir: terragrunt/environments/{{.ENV}}
    deps:
      - render:sync:silent
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run --all plan {{.TF_ARGS}}
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      TF_ARGS: '{{.TF_ARGS | default ""}}'

  tf:plan:component:
    desc: Run Terragrunt plan for a specific component (TF_ARGS='-target=...' to narrow it)
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt plan {{.TF_ARGS}}
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'
      TF_ARGS: '{{.TF_ARGS | default ""}}'

  tf:apply:
    desc: Run Terragrunt apply for environment (auto-syncs rendered files from 1Password)
    dir: terragrunt/environments/{{.ENV}}
    deps:
      - render:sync:silent
      - ansible:inventory
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run --all apply --non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'

  tf:apply:component:
    desc: Run Terragrunt apply for a specific component (TF_ARGS='-target=...' to apply one resource at a time)
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    deps: [ansible:inventory]
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt apply --non-interactive --auto-approve {{.TF_ARGS}}
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'
      TF_ARGS: '{{.TF_ARGS | default ""}}'

  tf:destroy:
    desc: Destroy infrastructure (use with caution)
    dir: terragrunt/environments/{{.ENV}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt run --all destroy --non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'
    prompt: Are you sure you want to destroy the {{.ENV}} environment?

  tf:destroy:component:
    desc: Destroy a specific component (use with caution)
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt destroy --non-interactive --auto-approve
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'
    prompt: Are you sure you want to destroy {{.COMPONENT}} in {{.ENV}}?

  tf:output:
    desc: Show Terragrunt outputs for a component
    dir: terragrunt/environments/{{.ENV}}/{{.COMPONENT}}
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt output
    vars:
      ENV: '{{.ENV | default "homelab"}}'
      COMPONENT: '{{.COMPONENT}}'

  # ==========================================================================
  # Cilium CNI
  # ==========================================================================

  render:
    desc: Render all Helm charts to YAML for inline installation
    cmds:
      - task: cilium:render
      - task: kubelet-csr-approver:render
      - task: spegel:render

  cilium:render:
    desc: Render Cilium Helm chart to YAML for inline installation
    cmds:
      - helm repo add cilium https://helm.cilium.io/ || true
      - |
        helm template cilium cilium/cilium --version "$(yq -r .charts.cilium configuration/versions.yaml)" \
          --namespace kube-system \
          --set ipam.mode=kubernetes \
          --set kubeProxyReplacement=true \
          --set k8sServiceHost=localhost \
          --set k8sServicePort=7445 \
          --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
          --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
          --set cgroup.autoMount.enabled=false \
          --set cgroup.hostRoot=/sys/fs/cgroup \
          --set l2announcements.enabled=true \
          --set externalIPs.enabled=true \
          --set bgpControlPlane.enabled=true \
          --set hubble.relay.enabled=true \
          --set hubble.ui.enabled=true \
          --set bandwidthManager.enabled=true \
          --set bandwidthManager.bbr=true \
          > terragrunt/files/cilium-rendered.yaml
      - echo "Cilium manifests rendered to terragrunt/files/cilium-rendered.yaml"

  kubelet-csr-approver:render:
    desc: Render kubelet-csr-approver Helm chart to YAML for inline installation
    cmds:
      - helm repo add kubelet-csr-approver https://postfinance.github.io/kubelet-csr-approver || true
      - helm repo update kubelet-csr-approver
      - |
        helm template kubelet-csr-approver kubelet-csr-approver/kubelet-csr-approver --version "$(yq -r .charts.kubelet-csr-approver configuration/versions.yaml)" \
          --namespace kube-system \
          --skip-tests \
          --set providerIpPrefixes="{{"{"}}{{.LAN_CIDR}}{{"}"}}" \
          --set bypassDnsResolution=true \
          > terragrunt/files/kubelet-csr-approver-rendered.yaml
      - echo "kubelet-csr-approver manifests rendered to terragrunt/files/kubelet-csr-approver-rendered.yaml"

  spegel:render:
    desc: Render Spegel Helm chart to YAML for inline installation (P2P image distribution)
    cmds:
      - helm template spegel oci://ghcr.io/spegel-org/helm-charts/spegel --version "$(yq -r .charts.spegel configuration/versions.yaml)" --namespace spegel --set spegel.containerdRegistryConfigPath=/etc/cri/conf.d/hosts --set spegel.containerdContentPath=/var/lib/containerd/io.containerd.content.v1.content --set spegel.resolveTags=true --set service.registry.hostPort=30020 --set service.registry.nodePort=30021 > terragrunt/files/spegel-rendered.yaml
      - echo "Spegel manifests rendered to terragrunt/files/spegel-rendered.yaml"

  render:push:
    desc: Push rendered YAML files to 1Password (for sharing across machines)
    cmds:
      - ./bin/homelab render push --force

  render:pull:
    desc: Pull rendered YAML files from 1Password
    cmds:
      - ./bin/homelab render pull --force

  render:status:
    desc: Check status of rendered files (local vs 1Password)
    cmds:
      - ./bin/homelab render status

  render:sync:
    desc: Sync rendered files (pull from 1Password if missing, push if local-only)
    cmds:
      - ./bin/homelab render sync

  render:sync:silent:
    internal: true
    cmds:
      - ./bin/homelab render sync --quiet
    status:
      - test -f terragrunt/files/cilium-rendered.yaml
      - test -f terragrunt/files/kubelet-csr-approver-rendered.yaml
      - test -f terragrunt/files/spegel-rendered.yaml

  # ==========================================================================
  # Talos
  # ==========================================================================

  talos:gen-config:
    desc: Generate Talos machine configurations
    dir: talos
    cmds:
      - talosctl gen config homelab https://{{.CP1_IP}}:6443

  talos:apply:
    desc: Apply Talos configuration to nodes
    cmds:
      - echo "Apply Talos configs (implement based on cluster state)"

  talos:bootstrap:
    desc: Bootstrap Talos cluster
    cmds:
      - talosctl bootstrap -n {{.CP1_IP}}

  talos:kubeconfig:
    desc: Retrieve kubeconfig from Talos
    cmds:
      - talosctl kubeconfig -n {{.CP1_IP}}

  talos:upgrade:image:
    desc: Regenerate Talos image with updated extensions
    dir: terragrunt/environments/homelab/talos-image
    cmds:
      - op run --env-file={{.ROOT_DIR}}/.env.op -- terragrunt apply --non-interactive --auto-approve

  talos:recreate:node:
    desc: Recreate a Talos node via terragrunt taint + apply
    prompt: This will destroy and recreate the Talos VM for node {{.NODE}}. Continue?
    vars:
      NODE: '{{.NODE | default "worker-1"}}'
    cmds:
      - ./bin/homelab -y talos recreate --node={{.NODE}} --skip-drain

  talos:recreate:gpu-node:
    desc: Recreate GPU node (worker-1) with new image and verify GPU support
    prompt: This will destroy and recreate worker-1 and then verify GPU support. Continue?
    cmds:
      - ./bin/homelab -y talos recreate --node=worker-1 --skip-drain
      - ./bin/homelab verify gpu

  gpu:verify:
    desc: Verify GPU support is working (vendor resolved from GPU_VENDOR config)
    cmds:
      - ./bin/homelab verify gpu

  gpu:status:
    desc: Show GPU node status and resources (vendor resolved from GPU_VENDOR config)
    cmds:
      - ./bin/homelab verify gpu --status-only

  gpu:toggle-test:
    desc: Render charts for GPU_VENDOR=none|nvidia|intel and assert TGL-01..TGL-04 (nvidia compares against tests/snapshots/homelab)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/toggle-test.ts {{.CLI_ARGS}}

  # ==========================================================================
  # Verification (level 0: static, cluster-free, PII-free) — see docs/runbooks/verification.md
  # ==========================================================================

  verify:
    desc: "Verification with JSON summary (task verify = level 0 static; LEVEL=1 Kind dry-run; LEVEL=2 Kind live + e2e; task verify -- --env homelab)"
    silent: true
    cmds:
      - go run ./cmd/homelab verify all --level {{.LEVEL | default "0"}} --json {{.CLI_ARGS}}

  verify:text:
    desc: Verification with human-readable output (LEVEL=0|1|2, see docs/runbooks/verification.md)
    cmds:
      - go run ./cmd/homelab verify all --level {{.LEVEL | default "0"}} {{.CLI_ARGS}}

  verify:render:
    desc: Render, lint and schema-validate every chart (task verify:render -- --env homelab --chart addons)
    cmds:
      - go run ./cmd/homelab verify render {{.CLI_ARGS}}

  verify:gitops:
    desc: Lint the rendered ArgoCD Application graph
    cmds:
      - go run ./cmd/homelab verify gitops {{.CLI_ARGS}}

  test:snapshot:
    desc: Diff rendered charts against tests/snapshots (task test:snapshot -- --update to regenerate)
    cmds:
      - go run ./cmd/homelab verify snapshot {{.CLI_ARGS}}

  test:policy:
    desc: Run conftest unit tests and assert every negative fixture fails as intended
    cmds:
      - conftest verify -p tests/policy
      - deno run --allow-read --allow-run --allow-env scripts/policy-test.ts {{.CLI_ARGS}}

  test:e2e:
    desc: Declarative Kind e2e tests (chainsaw) against the running localdev cluster (task test:e2e -- --test-dir tests/e2e/plex)
    cmds:
      - chainsaw test --kube-context kind-homelab-localdev --config tests/e2e/.chainsaw.yaml tests/e2e {{.CLI_ARGS}}

  test:health:
    desc: Exercise every ArgoCD health Lua in charts/bootstrap/files/health against the fixtures in tests/health
    cmds:
      - deno run --allow-read --allow-run --allow-env --allow-write scripts/health-test.ts {{.CLI_ARGS}}

  test:cmp-parity:
    desc: Prove the pinned homelab-cmp image matches `homelab config export` from source (needs Docker)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/cmp-parity-test.ts {{.CLI_ARGS}}

  test:config:
    desc: Config-system contract tests (templates <-> schema <-> versions.yaml)
    cmds:
      - go test ./internal/config/...

  test:go:
    desc: All Go unit tests
    cmds:
      - go test ./...

  schemas:vendor:
    desc: Regenerate tests/schemas from the chart versions pinned in configuration/versions.yaml
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/crd-schemas-vendor.ts {{.CLI_ARGS}}

  schemas:check:
    desc: Fail if tests/schemas is stale relative to configuration/versions.yaml
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/crd-schemas-vendor.ts --check

  verify:upgrade:
    desc: Render every upstream chart at a base ref and at the working tree and diff the manifests (task verify:upgrade -- --base origin/main)
    cmds:
      - go run ./cmd/homelab verify upgrade {{.CLI_ARGS}}

  verify:prod:
    desc: Read-only Application health of the homelab cluster through the homelab-readonly context (docs/runbooks/readonly-access.md)
    cmds:
      - go run ./cmd/homelab verify prod {{.CLI_ARGS}}

  verify:claim:
    desc: Print the level-0 verification claim block for a PR body (CI re-runs level 0 and compares it)
    silent: true
    cmds:
      - go run ./cmd/homelab verify all --level 0 --json {{.CLI_ARGS}} | deno run --allow-read scripts/verify-claim.ts render

  test:drill:
    desc: CloudNativePG backup/restore drill (chainsaw, tests/drills) against the running Kind loop
    cmds:
      - yq -n '.versitygwImage = "docker.io/versity/versitygw:" + (load("configuration/versions.yaml") | .images.versitygw)' > "${TMPDIR:-/tmp}/homelab-drill-values.yaml"
      - chainsaw test --kube-context kind-homelab-localdev --config tests/drills/.chainsaw.yaml tests/drills --values "${TMPDIR:-/tmp}/homelab-drill-values.yaml" {{.CLI_ARGS}}

  drill:restore:
    desc: "Restore drill end to end (what restore-drill.yml runs weekly): Kind -> ArgoCD -> operators (sync --warm) -> tests/drills"
    cmds:
      - task: localdev:kind
      - task: localdev:argocd
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/localdev-argocd.ts sync --warm
      - task: test:drill

  scaffold:
    desc: Scaffold a new app (task scaffold -- app <name> --pattern operator|helm|deps-main-config [--dry-run])
    cmds:
      - go run ./cmd/homelab scaffold {{.CLI_ARGS}}

  test:scaffold:
    desc: Scaffold one app per pattern into a temporary copy of the repo and prove level 0 passes there
    cmds:
      - deno run --allow-read --allow-write --allow-run --allow-env scripts/scaffold-selftest.ts {{.CLI_ARGS}}

  # ==========================================================================
  # Kubernetes Operations
  # ==========================================================================

  k8s:status:
    desc: Show cluster status
    cmds:
      - kubectl get nodes
      - kubectl get pods -A

  k8s:argocd-password:
    desc: Retrieve ArgoCD admin password
    cmds:
      - >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath='{.data.password}' | base64 -d

  prod:kubeconfig:
    desc: Write ~/.kube/homelab-readonly.yaml (read-only ServiceAccount token from 1Password via the Tailscale API server proxy)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/prod-readonly.ts kubeconfig {{.CLI_ARGS}}

  prod:status:
    desc: Read-only ArgoCD Application table of the homelab cluster (context homelab-readonly)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/prod-readonly.ts status {{.CLI_ARGS}}

  prod:diff:
    desc: Read-only argocd app diff against the homelab ArgoCD (read-only agent account; task prod:diff -- <app>)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/prod-readonly.ts diff {{.CLI_ARGS}}

  apiserver:probe:
    desc: Read-only availability probe of the Kubernetes API (VIP and each control plane side by side; docs/runbooks/control-plane-storage.md)
    cmds:
      - deno run --allow-net --allow-env --allow-read --allow-write scripts/apiserver-stress.ts probe {{.CLI_ARGS}}

  apiserver:stress:
    desc: Read-only GET load ramp against the Kubernetes API with a 1/s probe alongside (task apiserver:stress -- --concurrency 8,32,64)
    cmds:
      - deno run --allow-net --allow-env --allow-read --allow-write scripts/apiserver-stress.ts stress {{.CLI_ARGS}}

  cp:migrate:status:
    desc: Read-only state of the control-plane disk migration (which nodes are still on vm-storage; docs/runbooks/control-plane-storage.md)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/cp-storage-migrate.ts status {{.CLI_ARGS}}

  cp:migrate:
    desc: Move the control-plane system disks to cp-storage one node at a time (task cp:migrate -- --dry-run, then -- --yes; docs/runbooks/control-plane-storage.md)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read --allow-write scripts/cp-storage-migrate.ts migrate {{.CLI_ARGS}}

  tailscale:dns:status:
    desc: Tailnet DNS settings (MagicDNS, global nameservers, split DNS) through the Tailscale API (docs/runbooks/tailscale-dns.md)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read scripts/tailscale-dns.ts status {{.CLI_ARGS}}

  tailscale:dns:apply:
    desc: Split DNS for DOMAIN -> GATEWAY_IP on the tailnet so private hostnames resolve off-LAN (task tailscale:dns:apply -- --dry-run)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read scripts/tailscale-dns.ts apply {{.CLI_ARGS}}

  tailscale:dns:remove:
    desc: Clear the tailnet split DNS entry for DOMAIN (task tailscale:dns:remove -- --dry-run)
    cmds:
      - deno run --allow-net --allow-run --allow-env --allow-read scripts/tailscale-dns.ts remove {{.CLI_ARGS}}

  # ==========================================================================
  # CI/CD Testing
  # ==========================================================================

  ci:lint:
    desc: Run all linting tasks (for CI)
    cmds:
      - task: ansible:lint
      - task: chart:lint
      - yamllint .

  ci:test:
    desc: Run all non-interactive tests (no cluster required)
    cmds:
      - task: ci:lint
      - task: tf:validate
      - task: test:go
      - task: verify
      - task: test:policy

  # ==========================================================================
  # SOPS - Secret Management
  # ==========================================================================

  sops:bootstrap:
    desc: Bootstrap SOPS encryption (generate age keys, store in 1Password)
    cmds:
      - ./bin/homelab sops bootstrap

  sops:bootstrap:force:
    desc: Bootstrap SOPS with new keys (overwrites existing)
    cmds:
      - ./bin/homelab sops bootstrap --force

  sops:setup:
    desc: Full automated SOPS setup - pulls credentials from 1Password, encrypts, and commits
    cmds:
      - ./bin/homelab sops setup --commit

  sops:setup:dry-run:
    desc: Preview SOPS setup without making changes
    cmds:
      - ./bin/homelab sops setup --dry-run

  sops:encrypt:
    desc: Encrypt the 1Password credentials template
    cmds:
      - |
        TEMPLATE="charts/secrets/onepassword/onepassword-credentials.template.yaml"
        OUTPUT="charts/secrets/onepassword/onepassword-credentials.sops.yaml"
        if [ ! -f "$TEMPLATE" ]; then
          echo "ERROR: Template not found: $TEMPLATE"
          echo "Run 'task sops:bootstrap' first to create the template"
          exit 1
        fi
        sops --encrypt "$TEMPLATE" > "$OUTPUT"
        rm "$TEMPLATE"
        echo "Encrypted: $OUTPUT"
        echo "Unencrypted template removed"

  sops:decrypt:
    desc: Decrypt and view 1Password credentials (to stdout)
    cmds:
      - sops --decrypt charts/secrets/onepassword/onepassword-credentials.sops.yaml

  sops:edit:
    desc: Edit encrypted 1Password credentials
    cmds:
      - sops charts/secrets/onepassword/onepassword-credentials.sops.yaml

  sops:rotate:
    desc: Rotate SOPS keys (regenerate and re-encrypt all secrets)
    cmds:
      - task: sops:bootstrap:force
      - |
        echo "Re-encrypting secrets with new key..."
        for file in $(find charts/secrets -name "*.sops.yaml"); do
          echo "Re-encrypting: $file"
          sops updatekeys --yes "$file"
        done
        echo "Key rotation complete"

  sops:verify:
    desc: Verify SOPS can decrypt secrets
    cmds:
      - |
        echo "Verifying SOPS decryption..."
        if sops --decrypt charts/secrets/onepassword/onepassword-credentials.sops.yaml > /dev/null 2>&1; then
          echo "OK: SOPS decryption successful"
        else
          echo "ERROR: SOPS decryption failed"
          echo "Make sure SOPS_AGE_KEY environment variable is set"
          echo "Get it from 1Password: op read 'op://homelab/sops-age-key/private_key'"
          exit 1
        fi

  # ==========================================================================
  # Configuration Management
  # ==========================================================================

  config:validate:
    desc: Validate configuration schemas and environment values
    cmds:
      - go run ./cmd/homelab config validate --set {{.ENV | default "homelab"}}

  config:eval:
    desc: Resolve and print all configuration as JSON
    cmds:
      - go run ./cmd/homelab config eval --set {{.ENV | default "homelab"}}

  config:export:
    desc: Export all configuration formats
    cmds:
      - go run ./cmd/homelab config export --set {{.ENV | default "homelab"}} --all

  config:export:format:
    desc: Export a specific configuration format
    cmds:
      - go run ./cmd/homelab config export --set {{.ENV | default "homelab"}} --format {{.FORMAT}}

  config:export:localdev:
    desc: Regenerate charts/{addons,applications}/values-localdev.yaml from configuration/ (committed; level 0 fails when stale)
    cmds:
      - go run ./cmd/homelab config export --set localdev --format helm-addons
      - go run ./cmd/homelab config export --set localdev --format helm-apps

  config:guard:
    desc: "Scan every tracked file in the guard scope for PII: configuration/, charts/**/values-homelab.yaml, scripts/, docs/, .github/, Taskfile.yml"
    # --ci is not optional here: without it (and without file arguments) the
    # guard resolves an empty scan scope, checks nothing and exits 0.
    cmds:
      - go run ./cmd/homelab config guard --set {{.ENV | default "homelab"}} --ci

  config:export:hook:
    desc: Re-export localdev values and the gitignored homelab outputs (used by pre-commit)
    cmds:
      - deno run --allow-read --allow-write --allow-run --allow-env scripts/config-export-hook.ts

  cmp:bump:
    desc: Manually bump the CMP image patch version
    cmds:
      - deno run --allow-read --allow-write --allow-run scripts/cmp-version-bump.ts --force

  # ==========================================================================
  # Utilities
  # ==========================================================================

  renovate:validate:
    desc: Validate Renovate configuration locally
    cmds:
      - npx --package renovate -- renovate-config-validator .github/renovate.json5

  clean:
    desc: Clean temporary files
    cmds:
      - rm -rf .terraform .terragrunt-cache .tilt-cache .task
      - find . -name "*.retry" -delete

  docs:
    desc: Generate/update documentation
    cmds:
      - task: docs:embedme

  docs:embedme:
    desc: Update embedded code snippets in markdown files
    cmds:
      - embedme CLAUDE.md AGENTS.md

  docs:embedme:verify:
    desc: Verify embedded snippets are up-to-date (CI)
    cmds:
      - embedme --verify CLAUDE.md AGENTS.md

  docs:check:
    desc: "Numbers in readme.md, docs/ and .github/homelab.svg match the repo (versions, counts, ingress inventory); -- --fix rewrites the generated regions"
    cmds:
      - deno run --allow-read --allow-write --allow-env scripts/docs-check.ts {{.CLI_ARGS}}

  # ==========================================================================
  # Phase 1 Hardware Spike (SPK-02..SPK-05 Proxmox evidence capture)
  # ==========================================================================

  spk:capture:
    desc: "Phase 1 hardware spike — capture all Proxmox-side evidence in one SSH session (SPK-02, SPK-03, SPK-04, SPK-05)"
    vars:
      PROXMOX_HOST: '{{.PROXMOX_HOST | default (print "root@" .PROXMOX_IP)}}'
      OUT: ".planning/phases/01-hardware-spike-discovery/findings/proxmox-ssh-session.log"
    cmds:
      - mkdir -p $(dirname {{.OUT}})
      - |
        ssh {{.PROXMOX_HOST}} 'bash -s' <<'EOF' | tee {{.OUT}}
        set -euo pipefail
        echo "=== SPK-05: kernel cmdline ==="
        cat /proc/cmdline
        echo
        echo "=== SPK-02: B50 PCI ID ==="
        lspci -nnk | grep -A 3 -iE 'intel.*(arc|e212)'
        echo
        BUS=$(lspci -nn | grep -iE 'intel.*(arc|e212)' | awk '{print $1}' | head -1)
        echo "=== Captured bus: $BUS ==="
        echo
        echo "=== SPK-04: subsystem ID + driver binding ==="
        lspci -vmmnn -s "$BUS"
        lspci -nnk -s "$BUS"
        echo
        echo "=== SPK-03: IOMMU group + isolation ==="
        GROUP=$(basename "$(readlink /sys/bus/pci/devices/0000:${BUS}/iommu_group)")
        echo "IOMMU group: $GROUP"
        echo "Devices in group $GROUP:"
        for dev in /sys/kernel/iommu_groups/$GROUP/devices/*; do
          lspci -nns "$(basename "$dev")"
        done
        echo
        echo "=== SPK-05 (bonus): dmesg IOMMU ==="
        dmesg | grep -iE 'DMAR.*IOMMU enabled|AMD-Vi.*IOMMU|AMD-Vi.*Using global' | head -5 || true
        EOF
      - echo "Wave B captured to {{.OUT}}. Next — author per-SPK findings files from this transcript (see Plan 04)."

  spk:verify:
    desc: "Phase 1 hardware spike — verify all 8 SPK findings files exist with required extracted-value fields (from 01-VALIDATION.md)"
    vars:
      F: ".planning/phases/01-hardware-spike-discovery/findings"
    cmds:
      - |
        set -e
        pass=0
        fail=0
        check() {
          local id="$1"; shift
          if "$@" >/dev/null 2>&1; then
            echo "PASS  $id"
            pass=$((pass+1))
          else
            echo "FAIL  $id"
            fail=$((fail+1))
          fi
        }
        # --- Wave A (desk research) ---
        check 1-A-02 test -f {{.F}}/spk-01-talos-kernel.md
        check 1-A-01 grep -E 'Linux 6\.(1[2-9]|[2-9][0-9])' {{.F}}/spk-01-talos-kernel.md
        check 1-A-03 grep -E '^- digest:.*sha256' {{.F}}/spk-06-plex-libva.md
        check 1-A-04 grep -E '(iHD_drv_video\.so|FALLBACK)' {{.F}}/spk-06-plex-libva.md
        check 1-A-05 grep -E '(pms_version: 1\.[4-9][3-9]|FALLBACK)' {{.F}}/spk-06-plex-libva.md
        # Row 1-A-06 — NFD default PCI label (CORRECTED from 01-VALIDATION.md).
        # Original row specified 'pci-8086.present' (vendor-only). Plan 01-02
        # proved the actual NFD default is 'pci-0300_8086.present' (class+vendor).
        # spk-07-nfd-labels.md contains the corrected long form on line 113 under
        # `default_label:` as the authoritative value. See 01-02-SUMMARY.md
        # Rule 1 deviation and the findings file Interpretation block.
        check 1-A-06 grep -E 'pci-0300_8086\.present' {{.F}}/spk-07-nfd-labels.md
        check 1-A-07 grep -F 'compute-runtime/issues/872' {{.F}}/spk-08-compute-runtime.md
        # --- Wave B (Proxmox shell — populated by Plan 04) ---
        check 1-B-01 grep -E '^- pci_bus_address:' {{.F}}/spk-02-pci-id.md
        check 1-B-02 grep -F '8086:e212' {{.F}}/spk-02-pci-id.md
        check 1-B-03 grep -E '^- iommu_group:' {{.F}}/spk-03-iommu-group.md
        check 1-B-04 grep -E '^\*\*Status:\*\* (VERIFIED|VERIFIED-WITH-FALLBACK|BLOCKED)$' {{.F}}/spk-03-iommu-group.md
        check 1-B-05 grep -E '^- subsystem_id:' {{.F}}/spk-04-subsystem-id.md
        check 1-B-06 grep -iE 'vfio-pci|kernel driver' {{.F}}/spk-04-subsystem-id.md
        check 1-B-07 grep -iE 'intel_iommu=on|AMD-Vi.*enabled|AMD-Vi.*Using global' {{.F}}/spk-05-iommu-cmdline.md
        echo
        echo "Passed: $pass  Failed: $fail"
        exit $fail

  default:
    desc: Show available tasks
    cmds:
      - task --list
