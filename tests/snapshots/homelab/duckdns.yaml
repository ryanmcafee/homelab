---
# Source: duckdns/templates/cronjob.yaml
# DuckDNS Updater CronJob
# Updates the DuckDNS record with the cluster's public IP
apiVersion: batch/v1
kind: CronJob
metadata:
  name: duckdns-updater
  namespace: duckdns
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # KubeJobFailed fires for as long as a failed Job exists, and
      # failedJobsHistoryLimit only trims one when a newer failure replaces it.
      # The TTL lets a transient failure clear; a lasting one keeps producing
      # failed Jobs, so the alert keeps firing.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: duckdns-updater
              image: "curlimages/curl:8.19.0"
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  response=$(curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_SUBDOMAIN}&token=${DUCKDNS_TOKEN}&ip=")
                  echo "DuckDNS update response: $response"
                  if [ "$response" = "OK" ]; then
                    echo "Successfully updated DuckDNS record for ${DUCKDNS_SUBDOMAIN}.duckdns.org"
                    exit 0
                  else
                    echo "Failed to update DuckDNS record"
                    exit 1
                  fi
              env:
                - name: DUCKDNS_SUBDOMAIN
                  value: "REPLACEME-subdomain"
                - name: DUCKDNS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: duckdns-token
                      key: token
              resources:
                limits:
                  cpu: 50m
                  memory: 32Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
