---
# Source: istio-gateways/templates/echo.yaml
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: istio-ingress
spec:
  selector:
    app.kubernetes.io/name: echo
  ports:
    - name: http
      port: 80
      targetPort: http

---
# Source: istio-gateways/templates/echo.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: istio-ingress
  labels:
    app.kubernetes.io/name: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-internal
  namespace: istio-ingress
  annotations:
    # Deployment and Service keep the Gateway's name instead of <name>-<class>.
    gateway.istio.io/name-override: istio-internal
    networking.istio.io/service-type: LoadBalancer
spec:
  gatewayClassName: istio-internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.replaceme-domain.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-wildcard-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-external
  namespace: istio-ingress
  annotations:
    # Deployment and Service keep the Gateway's name instead of <name>-<class>.
    gateway.istio.io/name-override: istio-external
    networking.istio.io/service-type: LoadBalancer
spec:
  gatewayClassName: istio-external
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.replaceme-domain.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-wildcard-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-internal
spec:
  controllerName: istio.io/gateway-controller
  description: Istio internal gateway, for comparison with Envoy Gateway

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-external
spec:
  controllerName: istio.io/gateway-controller
  description: Istio external gateway, for comparison with Envoy Gateway

---
# Source: istio-gateways/templates/echo.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: istio-ingress
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy-gateway-system
      sectionName: https
    - name: istio-internal
      sectionName: https
  hostnames:
    - "echo.replaceme-domain.com"
  rules:
    - backendRefs:
        - name: echo
          port: 80

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-internal-https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: istio-internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-external-https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: istio-external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Source: istio-gateways/templates/gateways.yaml
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: istio-gateways-certificate
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-ingress
  to:
    - group: ""
      kind: Secret
      name: gateway-wildcard-tls
