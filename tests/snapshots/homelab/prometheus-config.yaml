# Source: prometheus-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-db-pv
  labels:
    app.kubernetes.io/part-of: prometheus
    app.kubernetes.io/component: config-storage
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: democratic-csi-iscsi-hdd
  volumeMode: Filesystem
  csi:
    driver: org.democratic-csi.iscsi-hdd
    fsType: ext4
    volumeHandle: prometheus-db
    volumeAttributes:
      interface: ""
      iqn: iqn.2005-10.org.freenas.ctl:csi-prometheus-db-homelab
      lun: "0"
      node_attach_driver: iscsi
      portal: 192.168.1.50:3260
      portals: ""

