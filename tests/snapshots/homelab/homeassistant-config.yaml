---
# Source: homeassistant-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeassistant-config-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: democratic-csi-iscsi-hdd
  volumeMode: Filesystem
  csi:
    driver: org.democratic-csi.iscsi-hdd
    fsType: ext4
    volumeHandle: homeassistant-config
    volumeAttributes:
      interface: ""
      iqn: iqn.2005-10.org.freenas.ctl:csi-homeassistant-config-homelab
      lun: "0"
      node_attach_driver: iscsi
      portal: ""
      portals: ""

---
# Source: homeassistant-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: home-automation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: democratic-csi-iscsi-hdd
  volumeName: homeassistant-config-pv
  resources:
    requests:
      storage: 10Gi
