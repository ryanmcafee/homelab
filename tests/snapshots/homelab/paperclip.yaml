# Source: paperclip/templates/instance.yaml
# Paperclip Instance. paperclip-operator turns it into a StatefulSet, Service
# (port 3100), ConfigMap, PVC, ServiceAccount, NetworkPolicy, Ingress and a
# one-time admin bootstrap Job. Health for ArgoCD comes from
# charts/bootstrap/files/health/paperclip.inc_Instance.lua.
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: "2026.916.1"
  # Optional keys of the credentials Secret (the enabled per-provider API keys,
  # then extraSecretEnv) followed by extraEnv; both containers receive spec.env.
  env:
    - name: CLAUDE_CODE_OAUTH_TOKEN
      valueFrom:
        secretKeyRef:
          key: CLAUDE_CODE_OAUTH_TOKEN
          name: paperclip-api-keys
          optional: true
  deployment:
    mode: authenticated
    exposure: private
    publicURL: https://paperclip.REPLACEME-domain.com
    allowedHostnames:
      - paperclip.REPLACEME-domain.com
  database:
    mode: external
    externalURLSecretRef:
      name: paperclip-postgres-app
      key: uri
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
    disableSignUp: false
    adminUser:
      email: admin@REPLACEME-domain.com
      name: "Admin"
      passwordSecretRef:
        name: paperclip-auth
