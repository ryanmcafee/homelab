# Source: paperclip/templates/networkpolicy-ambient.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip-ambient-hbone
  namespace: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
  egress:
    - ports:
        - protocol: TCP
          port: 15008

