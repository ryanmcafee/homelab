              "format": 1,
              "rawSql": "SELECT Timestamp, JSONExtractString(Body, 'flow', 'verdict') AS verdict, JSONExtractString(Body, 'flow', 'drop_reason_desc') AS drop_reason, JSONExtractString(Body, 'flow', 'IP', 'source') AS src, JSONExtractString(Body, 'flow', 'source', 'pod_name') AS src_pod, JSONExtractString(Body, 'flow', 'IP', 'destination') AS dst, JSONExtractString(Body, 'flow', 'destination', 'pod_name') AS dst_pod, JSONExtractUInt(Body, 'flow', 'l4', 'TCP', 'destination_port') AS dport, JSONExtractString(Body, 'flow', 'Summary') AS summary FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ServiceName = 'hubble' AND ('${client_ip}' = '' OR JSONExtractString(Body, 'flow', 'IP', 'source') = '${client_ip}' OR JSONExtractString(Body, 'flow', 'IP', 'destination') = '${client_ip}') AND (JSONExtractString(Body, 'flow', 'verdict') IN ('DROPPED', 'ERROR') OR JSONExtractString(Body, 'flow', 'source', 'namespace') IN ('paperclip', 'traefik') OR JSONExtractString(Body, 'flow', 'destination', 'namespace') IN ('paperclip', 'traefik')) ORDER BY verdict = 'FORWARDED', Timestamp DESC LIMIT 500"
            }
