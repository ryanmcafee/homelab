apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip-exporter
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip-exporter
      annotations:
        checksum/script: 4d7f6809fd40324135eb36b31b6e0902a2e29f734c03a51558e4f84759de2e32
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: oven/bun:1.4.2-alpine
          command: ["bun", "/app/paperclip-exporter.ts"]
          env:
            - name: PAPERCLIP_API_URL
              value: "http://paperclip.paperclip.svc.cluster.local:3100/api"
            - name: PAPERCLIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperclip-exporter
                  key: PAPERCLIP_API_KEY
                  optional: true
            - name: RUN_WINDOW_SECONDS
              value: "3600"
            - name: PORT
              value: "9464"
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
