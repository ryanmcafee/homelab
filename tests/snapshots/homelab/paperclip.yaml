# Source: paperclip/templates/instance.yaml
# Paperclip Instance. paperclip-operator turns it into a StatefulSet, Service
# (port 3100), ConfigMap, PVC, ServiceAccount, NetworkPolicy, Ingress and a
# one-time admin bootstrap Job. Health for ArgoCD comes from
# charts/bootstrap/files/health/paperclip.inc_Instance.lua.
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  image:
    repository: ghcr.io/paperclipai/paperclip
    tag: "2026.916.1"
  # Optional keys of the credentials Secret (the enabled per-provider API keys,
  # then extraSecretEnv) followed by extraEnv; both containers receive spec.env.
  env:
    - name: CLAUDE_CODE_OAUTH_TOKEN
      valueFrom:
        secretKeyRef:
          key: CLAUDE_CODE_OAUTH_TOKEN
          name: paperclip-api-keys
          optional: true
  deployment:
    mode: authenticated
    exposure: private
    publicURL: https://paperclip.REPLACEME-domain.com
    allowedHostnames:
      - paperclip.REPLACEME-domain.com
  database:
    mode: external
    externalURLSecretRef:
      name: paperclip-postgres-app
      key: uri
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
    disableSignUp: false
    adminUser:
      email: admin@REPLACEME-domain.com
      name: "Admin"
      passwordSecretRef:
        name: paperclip-auth
        key: ADMIN_PASSWORD
  availability:
    nodeSelector:
      paperclip.homelab/pin: "true"
  storage:
    persistence:
      enabled: true
      size: 200Gi
      storageClass: democratic-csi-iscsi
  networking:
    service:
      type: ClusterIP
      port: 3100
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: paperclip.REPLACEME-domain.com
      hosts:
        - paperclip.REPLACEME-domain.com
      tls:
        - hosts:
            - paperclip.REPLACEME-domain.com
          secretName: paperclip-tls
  security:
    networkPolicy:
      enabled: true
    seLinuxRelabel: false
  observability:
    metrics:
      enabled: false
    logging:
      level: info
  resources:
    limits:
      cpu: "2"
      memory: 16Gi
    requests:
      cpu: 500m
      memory: 16Gi
  probes:
    startup:
      failureThreshold: 120
      periodSeconds: 5

