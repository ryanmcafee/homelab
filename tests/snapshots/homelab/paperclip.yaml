# Source: paperclip/templates/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-request-path-dashboard
  namespace: paperclip
  labels:
    grafana_dashboard: "1"
data:
  paperclip-request-path.json: |-
    {
      "uid": "paperclip-request-path",
      "title": "Paperclip request path",
      "tags": [
        "paperclip",
        "tracing",
        "network"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "description": "client -> UniFi -> traefik-internal LB -> Traefik -> waypoint/ztunnel -> paperclip :3100 -> paperclip-postgres-rw (docs/runbooks/paperclip-request-path.md)",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "trace_id",
            "label": "Trace ID",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          },
          {
            "name": "client_ip",
            "label": "Client IP",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          },
          {
            "name": "lb_ip",
            "label": "traefik-internal LB IP",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 1,
            "query": {
              "query": "label_values(kube_service_status_load_balancer_ingress{namespace=\"traefik\",service=\"traefik-internal\"}, ip)",
              "refId": "lb"
            },
            "definition": "label_values(kube_service_status_load_balancer_ingress{namespace=\"traefik\",service=\"traefik-internal\"}, ip)"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "1. Synthetic probes (ingress path vs pod)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Probe success",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "probe_success{target=~\"paperclip-.*\"}",
              "legendFormat": "{{target}}"
            }
          ],
          "description": "paperclip-ingress goes through DNS and traefik-internal, paperclip-direct straight to the Service. Only -ingress failing = DNS/Traefik; both failing = the pod.",
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Probe duration",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "probe_duration_seconds{target=~\"paperclip-.*\"}",
              "legendFormat": "{{target}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "row",
          "title": "2. Traefik (paperclip router)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests by status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (code) (rate(traefik_service_requests_total{exported_service=~\".*paperclip.*\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\".*paperclip.*\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\".*paperclip.*\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\".*paperclip.*\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Access log (click TraceId for the trace, ClientHost to filter every panel)",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
