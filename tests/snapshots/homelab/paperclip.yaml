              "editorType": "sql",
              "queryType": "sql",
              "format": 1,
              "rawSql": "SELECT Timestamp, JSONExtractString(Body, 'ClientHost') AS ClientHost, JSONExtractString(Body, 'RequestMethod') AS RequestMethod, JSONExtractString(Body, 'RequestPath') AS RequestPath, JSONExtractInt(Body, 'DownstreamStatus') AS DownstreamStatus, JSONExtractInt(Body, 'OriginStatus') AS OriginStatus, round(JSONExtractFloat(Body, 'Duration') / 1e6, 1) AS Duration_ms, round(JSONExtractFloat(Body, 'OriginDuration') / 1e6, 1) AS OriginDuration_ms, JSONExtractInt(Body, 'RetryAttempts') AS RetryAttempts, JSONExtractString(Body, 'RouterName') AS RouterName, JSONExtractString(Body, 'ServiceURL') AS ServiceURL, JSONExtractString(Body, 'request_User-Agent') AS UserAgent, JSONExtractString(Body, 'TraceId') AS TraceId FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ResourceAttributes['k8s.namespace.name'] = 'traefik' AND JSONHas(Body, 'DownstreamStatus') AND JSONExtractString(Body, 'RequestHost') LIKE 'paperclip%' AND ('${client_ip}' = '' OR JSONExtractString(Body, 'ClientHost') = '${client_ip}') ORDER BY Timestamp DESC LIMIT 500"
            }
