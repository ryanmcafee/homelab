---
# Source: nzbget-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nzbget-config-pv
  labels:
    app.kubernetes.io/part-of: nzbget
    app.kubernetes.io/component: config-storage
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: democratic-csi-iscsi-hdd
  volumeMode: Filesystem
  csi:
    driver: org.democratic-csi.iscsi-hdd
    fsType: ext4
    volumeHandle: nzbget-config
    volumeAttributes:
      interface: ""
      iqn: iqn.2005-10.org.freenas.ctl:csi-nzbget-config-homelab
      lun: "0"
      node_attach_driver: iscsi
      portal: 192.168.1.50:3260
      portals: ""

---
# Source: nzbget-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-config
  namespace: media
  labels:
    app.kubernetes.io/part-of: nzbget
    app.kubernetes.io/component: config-storage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: democratic-csi-iscsi-hdd
  volumeName: nzbget-config-pv
  resources:
    requests:
      storage: 5Gi
