---
# Source: litellm-config/templates/httproute.yaml
# The only route carrying the external-dns hostname annotation: all three share
# one hostname, and external-dns selects on that annotation
# (--annotation-filter), so one record is published instead of three claims on
# the same name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-ui
  namespace: litellm
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.replaceme-domain.com
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - litellm.replaceme-domain.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /favicon.ico
        - path:
            type: PathPrefix
            value: /litellm-asset-prefix
        - path:
            type: PathPrefix
            value: /_next
        - path:
            type: PathPrefix
            value: /ui
        - path:
            type: RegularExpression
            value: ^/[^/]+\.txt$
      backendRefs:
        - name: litellm-ui
          port: 3000

