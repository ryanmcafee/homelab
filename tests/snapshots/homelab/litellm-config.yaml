# Source: litellm-config/templates/httproute.yaml
# Catch-all: the management API (/key/*, /user/*, /team/*, /v1/mcp/*, ...) and
# every path the two routes above do not claim.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-backend
  namespace: litellm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - litellm.replaceme-domain.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm-backend
          port: 4001
