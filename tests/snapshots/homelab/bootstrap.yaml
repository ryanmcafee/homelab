---
# Source: bootstrap/templates/sops-secrets.yaml
# Namespace for 1Password operator (must exist before secrets)
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: onepassword-operator
    app.kubernetes.io/managed-by: argocd

---
# Source: bootstrap/templates/sops-secrets.yaml
# ServiceAccount for secret transformer job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-transformer
  namespace: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

---
# Source: bootstrap/templates/sops-secrets.yaml
# Role to allow patching the credentials secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-transformer
  namespace: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]

---
# Source: bootstrap/templates/sops-secrets.yaml
# RoleBinding for secret transformer
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-transformer
  namespace: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: secret-transformer
    namespace: onepassword-operator
roleRef:
  kind: Role
  name: secret-transformer
  apiGroup: rbac.authorization.k8s.io

---
# Source: bootstrap/templates/sops-secrets.yaml
# Job to transform the 1Password credentials secret
# Adds base64-encoded credentials key required by OP_SESSION
apiVersion: batch/v1
kind: Job
metadata:
  name: onepassword-credentials-transformer
  namespace: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: secret-transformer
      restartPolicy: OnFailure
      # The Job only reads and patches one Secret through the API server, so it
      # needs no filesystem writes outside /tmp, no extra capabilities and no
      # root. 65534 (nobody) owns nothing in the image, which is the point.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transform
          # This script needs a shell + coreutils (grep, base64, tr) — the
          # distroless registry.k8s.io/kubectl image only ships bin/kubectl
          # and bin/kube-log-runner, so /bin/sh -c below would fail with
          # "exec /bin/sh: no such file or directory" at this wave -1 hook.
          # alpine/kubectl (~22MB) ships busybox sh/grep/base64/tr plus
          # kubectl on top of plain Alpine — enough for this script without
          # alpine/k8s's much larger bundle (helm/kustomize/kubeseal/krew/
          # vals/kubeconform), none of which a Job that only patches a
          # Secret needs. Keep the kubectl minor within ±1 of the cluster
          # version in configuration/versions.yaml (tools.kubernetes);
          # bitnami/kubectl no longer publishes versioned tags (only
          # :latest) and is not an option here.
          # Pinned by digest as well as by tag: a tag is mutable, and this Job
          # runs at wave -1 before anything else can observe a swap. The digest
          # is the multi-arch OCI image index for 1.36.4 (arm64, amd64, arm,
          # ppc64le, s390x), so it still resolves per node architecture.
          image: alpine/kubectl:1.36.4@sha256:a2cd8ee034cbe04d651e565b3373299b31921de5c2af86490559e21b3e197808
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # kubectl writes a discovery/HTTP cache under $HOME; as 65534 it has
            # no home directory, so point it somewhere writable.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Checking if base64 key already exists..."
              if kubectl get secret onepassword-credentials -n onepassword-operator -o jsonpath='{.data.1password-credentials\.json\.b64}' 2>/dev/null | grep -q .; then
                echo "Base64 key already exists, skipping transformation"
                exit 0
              fi
              echo "Adding base64-encoded credentials key..."
              # Get the raw credentials JSON (base64-decoded from secret)
              RAW_CREDS=$(kubectl get secret onepassword-credentials -n onepassword-operator -o jsonpath='{.data.1password-credentials\.json}' | base64 -d)
              # Base64 encode the JSON for OP_SESSION
              B64_CREDS=$(echo -n "$RAW_CREDS" | base64 | tr -d '\n')
              # Base64 encode again for storage in secret data field
              B64_B64_CREDS=$(echo -n "$B64_CREDS" | base64 | tr -d '\n')
              # Patch the secret
              kubectl patch secret onepassword-credentials -n onepassword-operator \
                --type='json' \
                -p="[{\"op\":\"add\",\"path\":\"/data/1password-credentials.json.b64\",\"value\":\"$B64_B64_CREDS\"}]"
              echo "Secret transformed successfully"

---
# Source: bootstrap/templates/1password-operator.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://1password.github.io/connect-helm-charts
    chart: connect
    targetRevision: 1.16.0
    helm:
      releaseName: onepassword-connect
      values: |
        operator:
          create: true
          autoRestart: true
          # Use token from the SOPS-encrypted credentials secret
          token:
            name: onepassword-credentials
            key: token
          resources:
            limits:
              cpu: 200m
              memory: 48Mi
            requests:
              cpu: 50m
              memory: 32Mi

        connect:
          create: true
          # Use base64-encoded credentials key - OP_SESSION expects base64-encoded JSON
          credentialsName: onepassword-credentials
          credentialsKey: 1password-credentials.json.b64
          api:
            resources:
              limits:
                memory: 48Mi
              requests:
                memory: 32Mi
          sync:
            resources:
              limits:
                memory: 48Mi
              requests:
                memory: 32Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: onepassword-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: bootstrap/templates/argocd.yaml
# ArgoCD Self-Management Application
# This allows ArgoCD to manage itself after initial bootstrap by Terraform
# Sync Wave: 1 (after env-config at wave 0, before addons: sync-wave 2 by
# default, 1 in homelab)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.7.1
    helm:
      releaseName: argocd
      values: |
        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          replicas: 2
          resources:
            limits:
              cpu: 200m
              memory: 80Mi
            requests:
              cpu: 50m
              memory: 48Mi
        configs:
          cm:
            accounts.agent: apiKey
            kustomize.buildOptions: --enable-alpha-plugins --enable-exec
            resource.customizations.health.argoproj.io_Application: |
              -- ArgoCD Application: propagate the child Application's own health so the
              -- App-of-Apps parents progress only once every child is Healthy.
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
              end
              return hs
            resource.customizations.health.clickhouse.altinity.com_ClickHouseInstallation: |
              -- clickhouse.altinity.com ClickHouseInstallation: the Altinity operator reports
              -- its reconcile state in status.status. Completed is Healthy, Aborted is
              -- Degraded, and InProgress, Terminating or no status yet are Progressing.
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for the operator to reconcile the installation"
              if obj.status ~= nil and obj.status.status ~= nil then
                local state = obj.status.status
                if state == "Completed" then
                  hs.status = "Healthy"
                  hs.message = "Installation reconciled"
                elseif state == "Aborted" then
                  hs.status = "Degraded"
                  hs.message = "Reconcile aborted"
                else
                  hs.message = "Installation is " .. state
                end
                if obj.status.errors ~= nil and #obj.status.errors > 0 then
                  hs.message = hs.message .. ": " .. obj.status.errors[#obj.status.errors]
                end
              end
              return hs
            resource.customizations.health.externaldns.k8s.io_DNSEndpoint: |
              -- external-dns DNSEndpoint: the CRD source records the generation it last
              -- reconciled in status.observedGeneration. Healthy once that has caught up
              -- with metadata.generation (or when either side is missing, since older
              -- external-dns releases never write status); Progressing while it lags.
              hs = {}
              hs.status = "Healthy"
              hs.message = "DNSEndpoint observed by external-dns"
              local generation = nil
              if obj.metadata ~= nil then
                generation = obj.metadata.generation
              end
              local observed = nil
              if obj.status ~= nil then
                observed = obj.status.observedGeneration
              end
              if generation == nil or observed == nil then
                hs.message = "No generation information; assuming reconciled"
              elseif observed < generation then
                hs.status = "Progressing"
                hs.message = "Waiting for external-dns to observe generation " .. tostring(generation) .. " (observed " .. tostring(observed) .. ")"
              end
              return hs
            resource.customizations.health.networking.k8s.io_Ingress: |
              -- Ingress: treat as Healthy even without a loadBalancer address.
              -- This prevents a circular dependency during the initial sync when Traefik
              -- (which would populate status.loadBalancer) is not deployed yet.
              hs = {}
              hs.status = "Healthy"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.loadBalancer ~= nil then
                  if obj.status.loadBalancer.ingress ~= nil then
                    hs.message = "Load balancer ingress configured"
                  else
                    hs.message = "Waiting for load balancer (non-blocking)"
                  end
                end
              end
              return hs
            resource.customizations.health.onepassword.com_OnePasswordItem: |
              -- 1Password Connect operator OnePasswordItem: Healthy once the operator has
              -- materialised the Secret (condition Ready=True), Degraded when the item could
              -- not be fetched (Ready=False), Progressing until the operator reports either.
              -- The operator often leaves condition.message empty, and "" is truthy in Lua,
              -- so fall back explicitly instead of relying on `or`.
              local function messageOr(condition, fallback)
                if condition.message ~= nil and condition.message ~= "" then
                  return condition.message
                end
                return fallback
              end
        
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for the 1Password operator to report a Ready condition"
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for _, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" then
                    if condition.status == "True" then
                      hs.status = "Healthy"
                      hs.message = messageOr(condition, "Secret synced from 1Password")
                    elseif condition.status == "False" then
                      hs.status = "Degraded"
                      hs.message = messageOr(condition, "1Password item could not be synced")
                    else
                      hs.message = messageOr(condition, "Ready condition is Unknown")
                    end
                  end
                end
              end
              return hs
            resource.customizations.health.paperclip.inc_Instance: |
              -- paperclip.inc Instance: the operator publishes a coarse lifecycle phase in
              -- status.phase. Running is Healthy, Failed/Error are Degraded, and anything
              -- else (Pending, Provisioning, no status yet) is still Progressing.
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for the Instance to report a phase"
              if obj.status ~= nil and obj.status.phase ~= nil then
                local phase = obj.status.phase
                if phase == "Running" then
                  hs.status = "Healthy"
                  hs.message = "Instance is running"
                elseif phase == "Failed" or phase == "Error" then
                  hs.status = "Degraded"
                  hs.message = "Instance is in phase " .. phase
                else
                  hs.message = "Instance is in phase " .. phase
                end
                if obj.status.message ~= nil and obj.status.message ~= "" then
                  hs.message = hs.message .. ": " .. obj.status.message
                end
              end
              return hs
            resource.customizations.health.tailscale.com_Connector: |
              -- Tailscale operator Connector: the operator sets a single ConnectorReady
              -- condition (the only known type on the v1alpha1 CRD). Healthy on True,
              -- Degraded on False, Progressing until the operator has reconciled it.
              -- The operator sets condition.message to "" on success, and "" is truthy in
              -- Lua, so fall back explicitly instead of relying on `or`.
              local function messageOr(condition, fallback)
                if condition.message ~= nil and condition.message ~= "" then
                  return condition.message
                end
                return fallback
              end
        
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for the Tailscale operator to report ConnectorReady"
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for _, condition in ipairs(obj.status.conditions) do
                  if condition.type == "ConnectorReady" then
                    if condition.status == "True" then
                      hs.status = "Healthy"
                      hs.message = messageOr(condition, "Connector is ready")
                      if obj.status.hostname ~= nil and obj.status.hostname ~= "" then
                        hs.message = hs.message .. " (" .. obj.status.hostname .. ")"
                      end
                    elseif condition.status == "False" then
                      hs.status = "Degraded"
                      hs.message = messageOr(condition, "Connector is not ready")
                    else
                      hs.message = messageOr(condition, "ConnectorReady condition is Unknown")
                    end
                  end
                end
              end
              return hs
          params:
            application.namespaces: preview-*
            server.insecure: true
          rbac:
            policy.csv: |
              g, agent, role:readonly
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          resources:
            limits:
              cpu: 1000m
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 1280Mi
        dex:
          resources:
            limits:
              memory: 80Mi
            requests:
              memory: 48Mi
        notifications:
          argocdUrl: https://argocd.REPLACEME-domain.com
          enabled: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          resources:
            limits:
              cpu: 100m
              memory: 80Mi
            requests:
              cpu: 50m
              memory: 48Mi
        redis:
          resources:
            limits:
              memory: 48Mi
            requests:
              memory: 32Mi
        repoServer:
          env:
          - name: XDG_CONFIG_HOME
            value: /.config
          - name: SOPS_AGE_KEY_FILE
            value: /.config/sops/age/keys.txt
          extraContainers:
          - command:
            - /var/run/argocd/argocd-cmp-server
            env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "90"
            image: ghcr.io/ryanmcafee/homelab-cmp:0.1.49
            name: homelab-cmp
            resources:
              limits:
                memory: 96Mi
              requests:
                memory: 64Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins
            - mountPath: /tmp
              name: cmp-tmp
            - mountPath: /config/homelab.yaml
              name: homelab-config
              readOnly: true
              subPath: homelab.yaml
          initContainers:
          - args:
            - /usr/local/bin/ksops
            - /usr/local/bin/kustomize
            - /custom-tools/
            command:
            - /bin/cp
            image: ghcr.io/ryanmcafee/homelab-cmp:0.1.49
            name: install-ksops
            volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          replicas: 2
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 96Mi
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-repo-server
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
          volumeMounts:
          - mountPath: /usr/local/bin/ksops
            name: custom-tools
            subPath: ksops
          - mountPath: /usr/local/bin/kustomize
            name: custom-tools
            subPath: kustomize
          - mountPath: /.config/sops/age
            name: sops-age
          volumes:
          - emptyDir: {}
            name: custom-tools
          - name: sops-age
            secret:
              secretName: sops-age-key
          - emptyDir: {}
            name: cmp-tmp
          - name: homelab-config
            secret:
              optional: true
              secretName: homelab-environment-config
        server:
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: argocd.REPLACEME-domain.com
            enabled: true
            extraTls:
            - hosts:
              - argocd.REPLACEME-domain.com
              secretName: argocd-server-tls
            hostname: argocd.REPLACEME-domain.com
            ingressClassName: internal
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          replicas: 3
          resources:
            limits:
              cpu: 500m
              memory: 112Mi
            requests:
              cpu: 100m
              memory: 64Mi
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-server
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in fields that change frequently
  ignoreDifferences:
    # Initial admin secret is generated and should not be overwritten. Core
    # kinds carry no `group: ""`: the API server drops it and the bootstrap
    # parent would report this Application OutOfSync forever.
    - kind: Secret
      name: argocd-initial-admin-secret
      jsonPointers:
        - /data
    # Webhook secret is generated
    - kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data/webhook.github.secret
        - /data/webhook.gitlab.secret
        - /data/webhook.bitbucket.uuid
    # Server deployment has auto-generated fields
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations

---
# Source: bootstrap/templates/prometheus-operator-crds.yaml
# Prometheus operator CRDs (ServiceMonitor, PodMonitor, PrometheusRule,
# AlertmanagerConfig, ...) installed before anything that renders them.
# kube-prometheus-stack itself syncs at addons wave 9, far after ArgoCD (wave 1)
# and cert-manager (wave 4); with the CRDs here at wave -1 those charts can
# ship their ServiceMonitors and Prometheus picks them up once it exists.
# kube-prometheus-stack runs with crds.enabled=false so only this Application
# owns the CRDs; the chart version must carry the operator version the
# kube-prometheus-stack chart bundles (configuration/versions.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 30.0.0
    helm:
      releaseName: prometheus-operator-crds

  destination:
    server: https://kubernetes.default.svc
    # CRDs are cluster-scoped; the namespace only anchors the Application.
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The Prometheus CRD alone is far past the 256 KiB client-side-apply
      # annotation limit (tests/gitops/huge-crd-charts.yaml).
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: bootstrap/templates/sops-secrets.yaml
# SOPS-encrypted secrets deployment
# Deploys before 1Password operator to ensure credentials are available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: HEAD
    path: charts/secrets/onepassword
  destination:
    server: https://kubernetes.default.svc
    namespace: onepassword-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# Source: bootstrap/templates/homelab-environment-config.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homelab-environment-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/homelab/items/homelab-environment-config"
