---
# Source: argo-workflows-dependencies/templates/log-store.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argo-workflows-logs
  namespace: argo-workflows
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: democratic-csi-iscsi
  resources:
    requests:
      storage: 20Gi

---
# Source: argo-workflows-dependencies/templates/log-store.yaml
apiVersion: v1
kind: Service
metadata:
  name: argo-workflows-logs
  namespace: argo-workflows
  labels:
    app.kubernetes.io/instance: argo-workflows-logs
    app.kubernetes.io/name: versitygw
spec:
  selector:
    app.kubernetes.io/instance: argo-workflows-logs
    app.kubernetes.io/name: versitygw
  ports:
    - name: s3
      port: 7070
      targetPort: s3

---
# Source: argo-workflows-dependencies/templates/log-store.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-workflows-logs
  namespace: argo-workflows
  labels:
    app.kubernetes.io/instance: argo-workflows-logs
    app.kubernetes.io/name: versitygw
spec:
  replicas: 1
  # ReadWriteOnce volume: the old pod must release it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: argo-workflows-logs
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: argo-workflows-logs
        app.kubernetes.io/name: versitygw
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # POSIX backend: every top-level directory is a bucket.
        - name: bucket
          image: versity/versitygw:v1.8.0
          command: ["/bin/sh", "-c", "mkdir -p /data/argo-workflows-logs /data/codesearch-backups"]
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: versitygw
          image: versity/versitygw:v1.8.0
          args: ["--port", ":7070", "--health", "/health", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: argo-workflows-artifacts
                  key: accessKey
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: argo-workflows-artifacts
                  key: secretKey
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        # Hourly: delete log objects older than retentionDays, then empty
        # directories; of each backup bucket keep only the newest `keep` tarballs.
        - name: retention
          image: versity/versitygw:v1.8.0
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                find /data/argo-workflows-logs -mindepth 1 -type f -mmin +43200 -delete
                find /data/argo-workflows-logs -mindepth 1 -type d -empty -delete
                find /data/codesearch-backups -mindepth 1 -type f -name '*.tar.gz' ! -path '*/.*' | sort -r | tail -n +15 | xargs -r rm -f
                sleep 3600
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argo-workflows-logs
        - name: tmp
          emptyDir: {}

---
# Source: argo-workflows-dependencies/templates/database.yaml
# Workflow archive. The controller creates its tables on first connect and
# deletes archived workflows older than persistence.archiveTTL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: argo-workflows-postgres
  namespace: argo-workflows
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.11"
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: democratic-csi-iscsi
    size: 5Gi
  bootstrap:
    initdb:
      database: argo
      owner: argo
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 64MB

---
# Source: argo-workflows-dependencies/templates/log-store.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: argo-workflows-artifacts
  namespace: argo-workflows
spec:
  itemPath: "vaults/homelab/items/argo-workflows-artifacts"
