---
# Source: sonarr-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-config-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: democratic-csi-iscsi-hdd
  volumeMode: Filesystem
  csi:
    driver: org.democratic-csi.iscsi-hdd
    fsType: ext4
    volumeHandle: sonarr-config
    volumeAttributes:
      interface: ""
      iqn: iqn.2005-10.org.freenas.ctl:csi-sonarr-config-homelab
      lun: "0"
      node_attach_driver: iscsi
      portal: 172.16.100.150:3260
      portals: ""
---
# Source: sonarr-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: democratic-csi-iscsi-hdd
  volumeName: sonarr-config-pv
  resources:
    requests:
      storage: 10Gi
