apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonarr-import-sweep
  namespace: media
  labels:
    app.kubernetes.io/part-of: sonarr
    app.kubernetes.io/component: import-sweep
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: sonarr
            app.kubernetes.io/component: import-sweep
          annotations:
            checksum/script: 1ef72ad3f21f12c60e2501fa3129aa548d0baef5a45e6c677f5d408f307bc1a8
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # The app's config claim is ReadWriteOnce: share the node the app runs on.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: sonarr
                      app.kubernetes.io/name: sonarr
          containers:
            - name: sweep
              image: "oven/bun:1.4.2-alpine"
              imagePullPolicy: IfNotPresent
              command: ["bun", "/scripts/arr-import-sweep.ts"]
              env:
                - name: ARR_APP
                  value: "sonarr"
                - name: ARR_URL
                  value: "http://sonarr.media.svc.cluster.local:8989"
                - name: IMPORT_PATH
                  value: "/downloads/completed/tv"
                - name: CONFIG_XML
                  value: /app-config/config.xml
                - name: TMDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: "plex"
                      key: "tmdb-api-key"
                      optional: true
                - name: DRY_RUN
                  value: "false"
                - name: TIMEOUT_SECONDS
                  value: "3000"
                - name: POLL_SECONDS
                  value: "2"
                - name: MIN_SCORE
                  value: "60"
                - name: MIN_MARGIN
                  value: "20"
                - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
                  value: "0"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: app-config
                  mountPath: /app-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 20m
                  memory: 96Mi
          volumes:
            - name: script
              configMap:
                name: sonarr-import-sweep
            - name: app-config
              persistentVolumeClaim:
                claimName: "sonarr-config"
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
