# Source: radarr-config/templates/corruption-scan-cronjob.yaml
# Daily scan for movie files that cannot play. Each corrupt file's release is
# blocklisted, the file is deleted through the Radarr API and Radarr's
# automatic search (MoviesSearch) grabs a new release. See files/corruption-scan.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radarr-corruption-scan
  namespace: media
  labels:
    app.kubernetes.io/part-of: radarr
    app.kubernetes.io/component: corruption-scan
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Never retry: a rerun of a run that failed mid-way could act on a
      # half-applied state, and the next daily run picks up anything left.
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      # KubeJobFailed fires for as long as a failed Job exists; the TTL lets a
      # transient failure clear while a lasting one keeps failing daily.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: radarr
            app.kubernetes.io/component: corruption-scan
          annotations:
            checksum/script: db0ea5666aa657ccde028b95c8a56fec04fde9c59a0d6a3e41c72f92af70c595
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
          # Radarr's config claim is ReadWriteOnce: share the node Radarr runs on.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: radarr
                      app.kubernetes.io/name: radarr
          containers:
            - name: scan
              image: "linuxserver/ffmpeg:9.0-cli-ls84"
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/corruption-scan.sh"]
              env:
                - name: RADARR_URL
                  value: "http://radarr.media.svc.cluster.local:7878"
                - name: CONFIG_XML
                  value: /radarr-config/config.xml
                - name: DRY_RUN
                  value: "false"
                - name: DEEP_CHECK
                  value: "true"
                - name: BLOCKLIST_RELEASE
                  value: "true"
                - name: MAX_DELETIONS
                  value: "5"
                - name: MIN_AGE_MINUTES
                  value: "360"
                - name: PROBE_TIMEOUT
                  value: "120"
                - name: SAMPLE_SECONDS
                  value: "10"
                - name: SAMPLE_POINTS
                  value: "5 50 95"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: movies
                  mountPath: /movies
                  readOnly: true
                - name: radarr-config
                  mountPath: /radarr-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  cpu: 2000m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: radarr-corruption-scan
            - name: movies
              nfs:
                server: "truenas.replaceme-domain.com"
                path: "/mnt/storage/movies"
                readOnly: true
            - name: radarr-config
              persistentVolumeClaim:
                claimName: "radarr-config"
                readOnly: true
            - name: tmp
              emptyDir: {}

