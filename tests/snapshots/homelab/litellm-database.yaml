---
# Source: litellm-database/templates/cluster.yaml
# CloudNativePG Cluster for LiteLLM. The operator (cloudnative-pg addon,
# cnpg-system) creates the pods, the -rw/-ro/-r Services and the Secret
# <name>-app whose username/password keys feed the chart's
# database.writer.passwordSecret, so no database credential is ever templated
# here or stored in 1Password.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: litellm
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.11"
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: democratic-csi-iscsi
    size: 10Gi
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
