# Source: triage-agent/templates/intake.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  namespace: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: intake
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-agent
      app.kubernetes.io/component: intake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-agent
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: intake
    spec:
      serviceAccountName: triage-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intake
          image: ghcr.io/ryanmcafee/homelab-triage-agent:0.1.0
          args: ["serve"]
          env:
            - name: ALERTMANAGER_URL
              value: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
            - name: WORKFLOW_NAMESPACE
              value: "triage-agent"
            - name: WORKFLOW_TEMPLATE
              value: "triage-fix"
            - name: SWEEP_INTERVAL_SECONDS
              value: "300"
            - name: COOLDOWN_SECONDS
              value: "86400"
            - name: IGNORED_ALERTS
              value: "Watchdog,InfoInhibitor,GitHubPullRequestNeedsReview,TriageAgentWorkspaceFillingUp,TriageAgentCacheFillingUp,TriageAgentJanitorFailing,TriageAgentIntakeDown"
            - name: MAX_RECORDS
              value: "50"
            - name: DRY_RUN
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
            - name: WORKSPACE_ROOT
              value: /workspaces
            - name: CACHE_ROOT
              value: /cache
            - name: CACHE_PRUNE_DIRS
              value: "go/build,mise-cache,npm,uv,bun"
            - name: JANITOR_INTERVAL_SECONDS
              value: "600"
            - name: FAILED_RETENTION_SECONDS
              value: "86400"
            - name: ORPHAN_GRACE_SECONDS
              value: "3600"
            - name: HIGH_WATERMARK
              value: "0.8"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              cpu: 200m
              memory: 192Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspaces
            - name: cache
              mountPath: /cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: workspace
          persistentVolumeClaim:
            claimName: triage-agent-workspace
        - name: cache
          persistentVolumeClaim:
            claimName: triage-agent-cache

