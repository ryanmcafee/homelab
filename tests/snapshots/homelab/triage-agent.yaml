---
# Source: triage-agent/templates/networkpolicy.yaml
# The webhook takes unauthenticated alerts, so only the listed namespaces
# (Alertmanager, Prometheus) may reach the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triage-agent-ingress
  namespace: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/part-of: homelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: triage-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

