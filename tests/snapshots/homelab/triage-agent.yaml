# Source: triage-agent/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-agent
  namespace: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/part-of: homelab
data:
  settings.json: |
    {
      "enableAllProjectMcpServers": true,
      "env": {
        "CLAUDE_CODE_ENABLE_TELEMETRY": "0",
        "DISABLE_AUTOUPDATER": "1",
        "ENABLE_TOOL_SEARCH": "1"
      },
      "includeCoAuthoredBy": false,
      "model": "opus[1m]",
      "permissions": {
        "allow": [
          "Read",
          "Grep",
          "Glob",
          "WebFetch",
          "WebSearch",
          "ToolSearch",
          "TodoWrite",
          "Bash(kubectl get:*)",
          "Bash(kubectl describe:*)",
          "Bash(kubectl logs:*)",
          "Bash(kubectl top:*)",
          "Bash(kubectl events:*)",
          "Bash(kubectl explain:*)",
          "Bash(kubectl api-resources:*)",
          "Bash(kubectl auth can-i:*)",
          "Bash(kubectl version:*)",
          "Bash(kubectl exec:*)",
          "Bash(kubectl port-forward:*)",
          "Bash(curl:*)",
          "Bash(git log:*)",
          "Bash(git show:*)",
          "Bash(git diff:*)",
          "Bash(git grep:*)",
          "Bash(git blame:*)",
          "Bash(rg:*)",
          "Bash(grep:*)",
          "Bash(jq:*)",
          "Bash(head:*)",
          "Bash(tail:*)",
          "Bash(sort:*)",
          "Bash(uniq:*)",
          "Bash(wc:*)",
          "Bash(date:*)",
          "mcp__sequential-thinking",
          "mcp__context7",
          "mcp__memory",
          "mcp__serena__initial_instructions",
          "mcp__serena__list_memories",
          "mcp__serena__read_memory",
          "mcp__serena__list_dir",
          "mcp__serena__find_file",
          "mcp__serena__search_for_pattern",
          "mcp__serena__get_symbols_overview",
          "mcp__serena__find_symbol",
          "mcp__serena__find_referencing_symbols",
          "mcp__serena__think_about_collected_information",
          "mcp__serena__think_about_task_adherence",
          "mcp__serena__think_about_whether_you_are_done",
          "mcp__paperclip__whoami",
          "mcp__paperclip__get_health",
          "mcp__paperclip__get_dashboard",
          "mcp__paperclip__list_agents",
          "mcp__paperclip__get_agent",
          "mcp__paperclip__list_issues",
          "mcp__paperclip__get_issue",
          "mcp__paperclip__list_live_runs",
          "mcp__paperclip__list_agent_runs",
          "mcp__paperclip__get_run",
          "mcp__paperclip__list_activity",
          "mcp__puppeteer__puppeteer_navigate",
          "mcp__puppeteer__puppeteer_screenshot"
        ],
        "defaultMode": "dontAsk",
        "deny": [
          "Edit",
          "Write",
          "NotebookEdit",
          "Bash(git push:*)",
          "Bash(git commit:*)",
          "Bash(kubectl get secret:*)",
          "Bash(kubectl get secrets:*)",
          "Bash(kubectl describe secret:*)",
          "Bash(kubectl describe secrets:*)"
        ]
      }
    }
  agent.json: |
    {
      "maxTurns": 60,
      "model": "opus[1m]",
      "timeoutSeconds": 1200
    }
  mcp-servers.json: |
    {
      "context7": {
        "args": [
          "-y",
          "@upstash/context7-mcp@4.1.1"
        ],
        "command": "npx",
        "enabled": true
      },
      "memory": {
        "args": [
          "-y",
          "@modelcontextprotocol/server-memory@2026.8.31"
        ],
        "command": "npx",
        "enabled": true,
        "env": {
          "MEMORY_FILE_PATH": "${MEMORY_DIR}/memory.json"
        }
      },
      "paperclip": {
        "args": [
          "--from",
          "git+https://github.com/wizarck/paperclip-mcp@v0.2.0",
          "paperclip-mcp",
          "--transport",
          "stdio"
        ],
        "command": "uvx",
        "enabled": true,
        "env": {
          "PAPERCLIP_API_KEY": "${PAPERCLIP_API_KEY}",
          "PAPERCLIP_API_URL": "http://paperclip.paperclip.svc.cluster.local:3100",
          "PAPERCLIP_COMPANY_ID": "${PAPERCLIP_COMPANY_ID}"
        }
      },
      "puppeteer": {
        "args": [
          "-y",
          "@modelcontextprotocol/server-puppeteer@2025.5.12"
        ],
        "command": "npx",
        "enabled": false
      },
      "sequential-thinking": {
        "args": [
          "-y",
          "@modelcontextprotocol/server-sequential-thinking@2026.8.31"
        ],
        "command": "npx",
        "enabled": true
      },
      "serena": {
        "args": [
          "--from",
          "git+https://github.com/oraios/serena",
          "serena",
          "start-mcp-server",
          "--context=claude-code",
          "--project-from-cwd"
        ],
        "command": "uvx",
        "enabled": true
      }
    }

