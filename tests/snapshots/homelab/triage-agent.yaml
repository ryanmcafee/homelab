# Source: triage-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  namespace: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  # One writer for the memory volume and one triage queue.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-agent
        app.kubernetes.io/part-of: homelab
      annotations:
        checksum/config: 18a69098eb12faecc3743af06b328d124636cda318c9e9dec93a7b75f9a7be71
    spec:
      serviceAccountName: triage-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage-agent
          image: ghcr.io/ryanmcafee/homelab-triage-agent:0.1.0
          env:
            - name: ALERTMANAGER_URL
              value: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
            - name: REPO_URL
              value: "https://github.com/ryanmcafee/homelab.git"
            - name: REPO_BRANCH
              value: "main"
            - name: SWEEP_INTERVAL_SECONDS
              value: "300"
            - name: COOLDOWN_SECONDS
              value: "86400"
            - name: IGNORED_ALERTS
              value: "Watchdog,InfoInhibitor,GitHubPullRequestNeedsReview"
            - name: MAX_REPORTS
              value: "50"
            - name: DRY_RUN
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: HOME
              value: /home/agent
            - name: CLAUDE_CONFIG_DIR
              value: /home/agent/.claude
            - name: WORKSPACE_DIR
              value: /workspace/homelab
            - name: DOTFILES_DIR
              value: /workspace/dotfiles
            - name: MEMORY_DIR
              value: /data
            - name: TMPDIR
              value: /tmp
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: false
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: GITHUB_TOKEN
                  optional: true
            - name: DOTFILES_REPO
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: DOTFILES_REPO
                  optional: true
            - name: PAPERCLIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: PAPERCLIP_API_KEY
                  optional: true
            - name: PAPERCLIP_COMPANY_ID
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: PAPERCLIP_COMPANY_ID
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: triage-agent
                  key: SLACK_WEBHOOK_URL
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 5
          # The dotfiles sync runs before the server listens.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 3Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/triage-agent
              readOnly: true
            - name: home
              mountPath: /home/agent
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: triage-agent
        # npm, uv and Claude caches plus the config dir; rebuilt on start.
        - name: home
          emptyDir:
            sizeLimit: 4Gi
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: data
          persistentVolumeClaim:
            claimName: triage-agent-memory

