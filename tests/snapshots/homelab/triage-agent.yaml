# Source: triage-agent/templates/workflowtemplate.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: triage-fix
  namespace: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/part-of: homelab
spec:
  entrypoint: main
  onExit: exit-handler
  serviceAccountName: triage-agent-workflow
  activeDeadlineSeconds: 18000
  arguments:
    parameters:
      - name: alertname
      - name: branch
      - name: alert-group
  # One workflow per alertname at a time, and at most maxConcurrent overall.
  synchronization:
    semaphores:
      - configMapKeyRef:
          name: triage-agent-sync
          key: workflows
    mutexes:
      - name: triage-{{workflow.parameters.alertname}}
  podGC:
    strategy: OnPodSuccess
  ttlStrategy:
    secondsAfterFailure: 259200
    secondsAfterSuccess: 86400
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: triage-agent-workspace
    - name: cache
      persistentVolumeClaim:
        claimName: triage-agent-cache
    - name: config
      configMap:
        name: triage-agent
  templates:
    - name: main
      dag:
        tasks:
          - name: triage
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: triage
                - name: deadline
                  value: "1500"
          - name: plan
            depends: triage.Succeeded
            when: "{{tasks.triage.outputs.parameters.actionable}} == true"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: plan
                - name: deadline
                  value: "900"
          # `depends: x` alone also fires when x was skipped; .Succeeded does not.
          - name: fix
            depends: plan.Succeeded
            template: fix-loop
            arguments:
              parameters:
                - name: attempt
                  value: "1"
                - name: feedback
                  value: none
          - name: commit
            depends: fix.Succeeded
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: commit
          - name: pr
            depends: commit.Succeeded
            when: "{{tasks.commit.outputs.parameters.changed}} == true"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: pr
          - name: ci
            depends: pr.Succeeded
            when: "{{tasks.pr.outputs.parameters.draft}} == false"
            template: ci-loop
            arguments:
              parameters:
                - name: attempt
                  value: "1"

    # Bounded fix loop: implement, then deterministic verify; verify's `next`
    # (loopDecision in triage-agent/src/stages/loop.ts) decides another round.
    - name: fix-loop
      inputs:
        parameters:
          - name: attempt
          - name: feedback
      steps:
        - - name: implement
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: implement
                - name: attempt
                  value: "{{inputs.parameters.attempt}}"
                - name: max-attempts
                  value: "3"
                - name: feedback
                  value: "{{inputs.parameters.feedback}}"
                - name: deadline
                  value: "3600"
        - - name: verify
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: verify
                - name: attempt
                  value: "{{inputs.parameters.attempt}}"
                - name: max-attempts
                  value: "3"
                - name: deadline
                  value: "2400"
        - - name: again
            when: "{{steps.verify.outputs.parameters.next}} == retry"
            template: fix-loop
            arguments:
              parameters:
                - name: attempt
                  value: "{{=asInt(inputs.parameters.attempt) + 1}}"
                - name: feedback
                  value: verify

    # Bounded CI loop: watch the PR's checks; on red feed the failing logs back
    # through implement, verify, commit and push; when exhausted hand it to a human.
    - name: ci-loop
      inputs:
        parameters:
          - name: attempt
      steps:
        - - name: watch
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: ci-watch
                - name: attempt
                  value: "{{inputs.parameters.attempt}}"
                - name: max-attempts
                  value: "2"
                - name: deadline
                  value: "4200"
        - - name: implement
            when: "{{steps.watch.outputs.parameters.next}} == retry"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: implement
                - name: attempt
                  value: "{{inputs.parameters.attempt}}"
                - name: max-attempts
                  value: "2"
                - name: feedback
                  value: ci
                - name: deadline
                  value: "3600"
          - name: needs-human
            when: "{{steps.watch.outputs.parameters.next}} == exhausted"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: needs-human
        - - name: verify
            when: "{{steps.watch.outputs.parameters.next}} == retry"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: verify
                - name: deadline
                  value: "2400"
        - - name: commit
            when: "{{steps.watch.outputs.parameters.next}} == retry"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: commit
                - name: feedback
                  value: ci
        - - name: push
            when: "{{steps.watch.outputs.parameters.next}} == retry"
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: pr
        - - name: again
            when: "{{steps.watch.outputs.parameters.next}} == retry"
            template: ci-loop
            arguments:
              parameters:
                - name: attempt
                  value: "{{=asInt(inputs.parameters.attempt) + 1}}"

    # Always runs, success or failure: Pushover with the PR link or the report.
    - name: exit-handler
      steps:
        - - name: notify
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: notify
                - name: workflow-status
                  value: "{{workflow.status}}"
                - name: workflow-failures
                  value: "{{workflow.failures}}"
        - - name: cleanup
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: cleanup
                - name: workflow-status
                  value: "{{workflow.status}}"

    # Not in the default path: `argo submit --from workflowtemplate/triage-fix
    # --entrypoint argocd-sync -p app=<name>` syncs one Application.
    - name: argocd-sync
      inputs:
        parameters:
          - name: app
      steps:
        - - name: sync
            template: stage
            arguments:
              parameters:
                - name: stage
                  value: argocd-sync
                - name: argocd-app
                  value: "{{inputs.parameters.app}}"

    - name: stage
      inputs:
        parameters:
          - name: stage
          - name: attempt
            value: "1"
          - name: max-attempts
            value: "1"
          - name: feedback
            value: none
          - name: deadline
            value: "600"
          - name: argocd-app
            value: ""
          - name: workflow-status
            value: ""
          - name: workflow-failures
            value: ""
      activeDeadlineSeconds: "{{inputs.parameters.deadline}}"
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 10m
      outputs:
        parameters:
          - name: actionable
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/actionable
              default: ""
          - name: passed
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/passed
              default: ""
          - name: next
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/next
              default: ""
          - name: changed
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/changed
              default: ""
          - name: pr-number
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/pr-number
              default: ""
          - name: pr-url
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/pr-url
              default: ""
          - name: draft
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/draft
              default: ""
          - name: ci-state
            valueFrom:
              path: /workspaces/{{workflow.name}}/out/ci-state
              default: ""
      container:
        image: ghcr.io/ryanmcafee/homelab-triage-agent:0.1.0
        args: ["run", "{{inputs.parameters.stage}}"]
        env:
          - name: WORK_DIR
            value: /workspaces/{{workflow.name}}
          - name: REPO_URL
            value: "https://github.com/ryanmcafee/homelab.git"
          - name: REPO_SLUG
            value: "ryanmcafee/homelab"
          - name: BASE_BRANCH
            value: "main"
          - name: BRANCH
            value: "{{workflow.parameters.branch}}"
          - name: ALERT_GROUP
            value: "{{workflow.parameters.alert-group}}"
          - name: ALERTMANAGER_URL
            value: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
          - name: ATTEMPT
            value: "{{inputs.parameters.attempt}}"
          - name: MAX_ATTEMPTS
            value: "{{inputs.parameters.max-attempts}}"
          - name: FEEDBACK
            value: "{{inputs.parameters.feedback}}"
          - name: CI_TIMEOUT_SECONDS
            value: "3600"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_STATUS
            value: "{{inputs.parameters.workflow-status}}"
          - name: WORKFLOW_FAILURES
            value: "{{inputs.parameters.workflow-failures}}"
          - name: WORKFLOW_UI_URL
            value: "https://workflows.REPLACEME-domain.com"
          - name: ARGOCD_APP
            value: "{{inputs.parameters.argocd-app}}"
          - name: ARGOCD_SERVER
            value: "argocd-server.argocd.svc:80"
          - name: ARGOCD_OPTS
            value: "--plaintext --grpc-web"
          - name: TRIAGE_AGENT_FAKE_LLM
            value: "false"
          - name: GIT_USER_NAME
            value: "homelab-triage-agent"
          - name: GIT_USER_EMAIL
            value: "homelab-triage-agent@users.noreply.github.com"
          - name: MISE_TOOLS
            value: "go helm bun kubeconform conftest pluto task yq"
          - name: HOME
            value: /home/agent
          - name: CLAUDE_CONFIG_DIR
            value: /home/agent/.claude
          - name: DOTFILES_DIR
            value: /home/agent/dotfiles
          - name: MEMORY_DIR
            value: /cache/memory
          - name: TMPDIR
            value: /tmp
          - name: PATH
            value: /cache/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          - name: MISE_DATA_DIR
            value: /cache/mise
          - name: MISE_CACHE_DIR
            value: /cache/mise-cache
          - name: MISE_YES
            value: "1"
          - name: GOPATH
            value: /cache/go
          - name: GOMODCACHE
            value: /cache/go/mod
          - name: GOCACHE
            value: /cache/go/build
          - name: npm_config_cache
            value: /cache/npm
          - name: UV_CACHE_DIR
            value: /cache/uv
          - name: BUN_INSTALL_CACHE_DIR
            value: /cache/bun
          - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
            value: "0"
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: CLAUDE_CODE_OAUTH_TOKEN
                optional: false
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: GITHUB_TOKEN
                optional: true
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: GITHUB_TOKEN
                optional: true
          - name: DOTFILES_REPO
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: DOTFILES_REPO
                optional: true
          - name: PAPERCLIP_API_KEY
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: PAPERCLIP_API_KEY
                optional: true
          - name: PAPERCLIP_COMPANY_ID
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: PAPERCLIP_COMPANY_ID
                optional: true
          - name: ARGOCD_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: triage-agent
                key: ARGOCD_AUTH_TOKEN
                optional: true
          - name: PUSHOVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: triage-agent-pushover
                key: pushover_token
                optional: true
          - name: PUSHOVER_USER_KEY
            valueFrom:
              secretKeyRef:
                name: triage-agent-pushover
                key: pushover_user_key
                optional: true
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: workspace
            mountPath: /workspaces
          - name: cache
            mountPath: /cache
          - name: config
            mountPath: /etc/triage-agent
            readOnly: true
          - name: home
            mountPath: /home/agent
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
