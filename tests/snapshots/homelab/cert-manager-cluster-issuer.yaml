---
# Source: cert-manager-cluster-issuer/templates/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@REPLACEME-domain.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          email: admin@REPLACEME-domain.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api_token
        cnameStrategy: Follow
      selector:
        dnsZones:
          - replaceme-domain.com
