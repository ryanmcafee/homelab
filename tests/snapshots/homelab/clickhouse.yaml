          "id": 1,
          "type": "timeseries",
          "title": "Flow records per minute",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 0,
              "rawSql": "SELECT $__timeInterval(Timestamp) AS time, count() AS flows FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ScopeName LIKE '%netflow%' GROUP BY time ORDER BY time"
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Top talkers (bytes)",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
