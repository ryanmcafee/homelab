              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 1,
              "rawSql": "SELECT LogAttributes['source.address'] AS src, formatReadableSize(sum(toUInt64OrZero(LogAttributes['flow.io.bytes']))) AS bytes, count() AS flows FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ScopeName LIKE '%netflow%' GROUP BY src ORDER BY sum(toUInt64OrZero(LogAttributes['flow.io.bytes'])) DESC LIMIT 20"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Top destination ports",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
          },
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 1,
              "rawSql": "SELECT LogAttributes['destination.port'] AS dport, LogAttributes['network.transport'] AS proto, count() AS flows, formatReadableSize(sum(toUInt64OrZero(LogAttributes['flow.io.bytes']))) AS bytes FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ScopeName LIKE '%netflow%' GROUP BY dport, proto ORDER BY flows DESC LIMIT 20"
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Firewall denies and threats (UniFi syslog, CEF)",
