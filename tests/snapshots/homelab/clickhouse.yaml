              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 1,
              "rawSql": "SELECT Timestamp, LogAttributes['cef_name'] AS event, LogAttributes['cef_severity'] AS severity, LogAttributes['cef_extension'] AS details FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ServiceName = 'unifi-syslog' AND (positionCaseInsensitive(Body, 'block') > 0 OR positionCaseInsensitive(Body, 'drop') > 0 OR positionCaseInsensitive(Body, 'deny') > 0 OR positionCaseInsensitive(Body, 'threat') > 0) ORDER BY Timestamp DESC LIMIT 500"
