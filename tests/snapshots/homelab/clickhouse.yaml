              "format": 2,
              "rawSql": "SELECT Timestamp AS timestamp, Body AS body, SeverityText AS level FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ServiceName = 'unifi-syslog' ORDER BY Timestamp DESC LIMIT 1000"
            }
          ]
        }
      ]
