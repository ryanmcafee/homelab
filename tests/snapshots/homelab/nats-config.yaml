# Source: nats-config/templates/streams.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: pf-events
  labels:
    app.kubernetes.io/part-of: nats
    app.kubernetes.io/component: jetstream-stream
spec:
  name: PF_EVENTS
  description: "The only ingestion point for .ev; general fan-out of every v1 platform event"
  servers:
    - nats://nats.nats.svc.cluster.local:4222
  subjects:
    - pf.*.*.*.*.*.ev
  storage: file
  replicas: 1
  retention: limits
  maxAge: 168h
  maxBytes: 2147483648
  maxMsgSize: 983040
  discard: old
  duplicateWindow: 2m
  # Without this, deleting the resource deletes the stream and its replay history.
  preventDelete: true

