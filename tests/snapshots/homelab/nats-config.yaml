---
# Source: nats-config/templates/consumers.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: dlq-reporter-observability-v1
  labels:
    app.kubernetes.io/part-of: nats
    app.kubernetes.io/component: jetstream-consumer
spec:
  durableName: dlq-reporter-observability-v1
  streamName: PF_DLQ
  description: "Durable reader of the dead-letter record"
  servers:
    - nats://nats.nats.svc.cluster.local:4222
  # Consumers filter by subject, never by decoding the body and discarding.
  filterSubject: pf.*.*.*.*.*.dl
  deliverPolicy: all
  replayPolicy: instant
  ackPolicy: explicit
  ackWait: 30s
  maxDeliver: 5
  maxAckPending: 256
  preventDelete: true

