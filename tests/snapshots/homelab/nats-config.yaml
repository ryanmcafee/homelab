# Source: nats-config/templates/streams.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: pf-audit
  labels:
    app.kubernetes.io/part-of: nats
    app.kubernetes.io/component: jetstream-stream
spec:
  name: PF_AUDIT
  description: "A retention policy over the identity and control subset of PF_EVENTS"
  servers:
    - nats://nats.nats.svc.cluster.local:4222
  sources:
    - name: PF_EVENTS
      subjectTransforms:
      - source: pf.*.identity.*.*.*.ev
      - source: pf.*.control.*.*.*.ev
  storage: file
  replicas: 1
  retention: limits
  maxAge: 8760h
  maxBytes: 3221225472
  discard: new
  duplicateWindow: 2m
  # Without this, deleting the resource deletes the stream and its replay history.
  preventDelete: true

