---
# Source: plex-config/templates/kometa.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kometa
  namespace: media
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/part-of: plex
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kometa
            app.kubernetes.io/part-of: plex
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Kometa writes its cache and logs next to config.yml, so the config is copied out of the read-only ConfigMap.
            - name: copy-config
              image: "kometateam/kometa:v2.5.5"
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "cp /config-src/*.yml /config/"]
              volumeMounts:
                - name: config-src
                  mountPath: /config-src
                  readOnly: true
                - name: config
                  mountPath: /config
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: kometa
              image: "kometateam/kometa:v2.5.5"
              imagePullPolicy: IfNotPresent
              args:
                - --run
                - --collections-only
                - --config
                - /config/config.yml
              env:
                - name: TZ
                  value: "UTC"
                - name: HOME
                  value: /config
                - name: KOMETA_PLEXTOKEN
                  valueFrom:
                    secretKeyRef:
                      name: plex
                      key: plex-token
                - name: KOMETA_TMDBKEY
                  valueFrom:
                    secretKeyRef:
                      name: plex
                      key: tmdb-api-key
              volumeMounts:
                - name: config
                  mountPath: /config
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: config-src
              configMap:
                name: kometa-config
            - name: config
              emptyDir: {}

