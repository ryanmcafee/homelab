---
# Source: plex-config/templates/kometa.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kometa-config
  namespace: media
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/part-of: plex
data:
  # <<plextoken>> and <<tmdbkey>> are filled by Kometa from KOMETA_PLEXTOKEN and KOMETA_TMDBKEY.
  config.yml: |
    libraries:
      "Movies":
        collection_files:
          - file: /config/christmas.yml
    plex:
      url: "http://plex-plex-media-server.media.svc.cluster.local:32400"
      token: <<plextoken>>
      timeout: 60
    tmdb:
      apikey: <<tmdbkey>>
      language: en
    settings:
      cache: true
      cache_expiration: 60
      run_order:
        - collections
  christmas.yml: |
    collections:
      Christmas:
        # TMDb keyword "christmas"
        tmdb_keyword: 207317
        plex_search:
          any:
            title:
              - Christmas
              - Santa Claus
              - Grinch
        # append keeps movies added to the collection by hand
        sync_mode: append
        collection_order: release
        sort_title: "!Christmas"
        summary: Christmas movies, matched by TMDb keyword and title.
    

