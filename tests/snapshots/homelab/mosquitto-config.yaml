---
# Source: mosquitto-config/templates/persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mosquitto-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: democratic-csi-iscsi-hdd
  volumeMode: Filesystem
  csi:
    driver: org.democratic-csi.iscsi-hdd
    fsType: ext4
    volumeHandle: mosquitto-config
    volumeAttributes:
      interface: ""
      iqn: iqn.2005-10.org.freenas.ctl:csi-mosquitto-config-homelab
      lun: "0"
      node_attach_driver: iscsi
      portal: 192.168.1.100:3260
      portals: ""

