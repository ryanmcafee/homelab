# Source: addons/templates/argo-workflows.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  labels:
    helm.sh/chart: addons-1.0.0
    app.kubernetes.io/name: addons
    app.kubernetes.io/instance: addons
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Wave 9: After traefik-config (wave 8) so OIDC middleware is available
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.18
    helm:
      releaseName: argo-workflows
      values: |
        server:
          authMode: server
          ingress:
            enabled: true
            ingressClassName: internal
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: workflows.REPLACEME-domain.com
            hosts:
              - workflows.REPLACEME-domain.com
            paths:
              - /
            pathType: Prefix
            tls:
              - hosts:
                - workflows.REPLACEME-domain.com
                secretName: argo-workflows-tls
          resources:
            limits:
              cpu: 200m
              memory: 48Mi
            requests:
              cpu: 50m
              memory: 32Mi
        controller:
          resources:
            limits:
              cpu: 500m
              memory: 48Mi
            requests:
              cpu: 100m
              memory: 32Mi
          workflowDefaults:
            spec:
              ttlStrategy:
                secondsAfterCompletion: 86400
                secondsAfterFailure: 172800
                secondsAfterSuccess: 43200

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

---
# Source: addons/templates/blackbox-exporter.yaml
# Synthetic HTTP probes (docs/runbooks/paperclip-request-path.md): one
# ServiceMonitor per target, metrics probe_success / probe_duration_seconds
# labelled target=<name>; alerts in the homelab-probes group.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: "11.18.0"
    helm:
      releaseName: blackbox-exporter
      values: |
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
            # The ingress probe checks reachability, not the certificate
            # (HomelabCertificateExpiringSoon covers that; Kind's is self-signed).
            http_2xx_ingress:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                tls_config:
                  insecure_skip_verify: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        serviceMonitor:
          enabled: true
          defaults:
            interval: 15s
            scrapeTimeout: 12s
          targets:
            - module: http_2xx_ingress
              name: paperclip-ingress
              url: https://paperclip.REPLACEME-domain.com/api/health
            - module: http_2xx
              name: paperclip-direct
              url: http://paperclip.paperclip.svc.cluster.local:3100/api/health
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

