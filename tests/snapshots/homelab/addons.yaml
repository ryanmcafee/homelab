---
# Source: addons/templates/traefik-external.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-external
  namespace: argocd
  annotations:
    # Sync wave 6: After traefik-external-dependencies (wave 5) creates secrets
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.9
    helm:
      releaseName: traefik-external
      # CRDs come from the traefik-crds Application (templates/traefik-crds.yaml).
      skipCrds: true
      values: |
        # IngressClass configuration
        ingressClass:
          name: external
          isDefaultClass: false

        deployment:
          replicas: 2

        service:
          type: LoadBalancer
          annotations:
            io.cilium/lb-ipam-ips: 192.168.1.200
            port-forwarding.REPLACEME-domain.com/enable: "true"
          spec:
            externalTrafficPolicy: Cluster

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: external
          # Enable cross-namespace references for middlewares
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: external

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false
        experimental:
          plugins:
            traefikoidc:
              moduleName: github.com/lukaszraczylo/traefikoidc
              version: v1.0.32

        logs:
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultmode: drop
                names:
                  Traceparent: keep
                  User-Agent: keep
        tracing:
          sampleRate: 0.1
          otlp:
            enabled: true
            grpc:
              enabled: true
              endpoint: otel-collector-gateway.observability.svc.cluster.local:4317
              insecure: true

        # The ServiceMonitor selects a dedicated metrics Service; the main
        # Service does not expose :9100. The API check would fail an offline render.
        metrics:
          prometheus:
            disableAPICheck: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true

        env:
          []
        volumes:
          - mountPath: /etc/traefik/oidc/google
            name: google-oauth-credentials
            type: secret
          - mountPath: /etc/traefik/oidc/session
            name: oidc-session-key
            type: secret

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.REPLACEME-domain.com`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-dashboard-tls

        resources:
          limits:
            cpu: 1000m
            memory: 320Mi
          requests:
            cpu: 100m
            memory: 192Mi
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-external
                app.kubernetes.io/name: traefik
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 3
          metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 80
                  type: Utilization
              type: Resource

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

---
# Source: addons/templates/traefik-external.yaml
# Config Application: deploys CRD-dependent resources (IngressRoute, Middleware, DNSEndpoint)
# Wave 8: After traefik-external (wave 6) installs CRDs and oidc-redis (wave 7) is available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-external-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/traefik-external-config
    helm:
