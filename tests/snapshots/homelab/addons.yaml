# Source: addons/templates/argo-workflows.yaml
# Argo Workflows - Workflow Orchestration Engine
# Sync Wave: 9 (after traefik-config for OIDC middleware)

---
# Source: addons/templates/agent-readonly.yaml
# Read-only identity for agents (issue #261 item 18): ServiceAccount + token
# Secret bound to `view` and homelab-agent-readonly. No Secrets, no write verbs.
# Enabled in Kind too, where tests/e2e/agent-readonly proves the RBAC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-readonly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/agent-readonly
    helm:
      valueFiles:
        - values.yaml
        - values-homelab.yaml
      # One source of truth for the namespace: the Namespace above.
      valuesObject:
        namespace: "agent-access"
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  # The token controller writes the token into the Secret; that is not drift.
  # Core kinds carry no `group: ""` (the API server drops it, which made the
  # addons parent report this Application OutOfSync forever).
  ignoreDifferences:
    - kind: Secret
      name: agent-readonly-token
      namespace: agent-access
      jsonPointers:
        - /data

