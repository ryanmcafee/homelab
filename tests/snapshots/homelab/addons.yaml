# Source: addons/templates/logging.yaml
# Dependencies Application: the ClickHouse user passwords. Only where a secret
# store exists (SECRETS_PROVIDER); localdev seeds the same Secrets in
# localdev/fakes/secrets.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/clickhouse-dependencies
    helm:
      valueFiles:
        - values.yaml
        - values-homelab.yaml
      # 1Password paths come from configuration/ (secrets.schema.yaml) through
      # this parent, so the child's committed values stay environment-free.
      valuesObject:
        namespace: observability
        grafanaNamespace: monitoring
        onePassword:
          enabled: true
          grafanaItemPath: vaults/homelab/items/clickhouse-grafana
          otelItemPath: vaults/homelab/items/clickhouse-otel
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

