# Source: addons/templates/istio.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-kiali
  namespace: istio-system
  labels:
    app.kubernetes.io/name: smoke-kiali
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-kiali
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.22.0
          env:
            - name: URL
              value: "http://kiali.istio-system.svc.cluster.local:20001/healthz"
          command: ["sh", "-c"]
          args:
            - |
              code=$(curl -sL --max-redirs 5 -o /dev/null -w '%{http_code}' --retry 30 --retry-delay 10 --retry-all-errors --max-time 20 "$URL")
              echo "smoke kiali: $URL -> HTTP $code"
              case "$code" in 200) exit 0;; *) exit 1;; esac
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

