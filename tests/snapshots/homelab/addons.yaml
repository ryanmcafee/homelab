# Source: addons/templates/cert-manager.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Sync wave 0: cert-manager must deploy before ClusterIssuer (wave 1) and other resources needing TLS
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.3
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: true
        global:
          leaderElection:
            namespace: cert-manager
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53,8.8.4.4:53
        resources:
          limits:
            cpu: 200m
            memory: 80Mi
          requests:
            cpu: 50m
            memory: 48Mi
        # ServiceMonitor for the controller metrics; the CRD comes from the
        # bootstrap chart's prometheus-operator-crds (wave -1), so it applies
        # here at wave 4 and kube-prometheus-stack (wave 9) discovers it. The
        # HomelabCertificateExpiringSoon rule reads
        # certmanager_certificate_expiration_timestamp_seconds.
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
        webhook:
          resources:
            limits:
              cpu: 100m
              memory: 48Mi
            requests:
              cpu: 20m
              memory: 32Mi
        cainjector:
          resources:
            limits:
              cpu: 200m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

---
# Source: addons/templates/cert-manager.yaml
# Config Application: deploys the OnePasswordItem for the Cloudflare API token.
# The OnePasswordItem CRD comes from 1password-operator in the bootstrap
# parent, which syncs in an earlier parent wave.
#
# Wave -1 puts this first inside addons. Wave ordering only sequences the
# apply, not the result: the 1Password operator creates the Secret
# asynchronously afterwards, so the ClusterIssuer at wave 1 can still be
# briefly unready. What -1 does guarantee is that the OnePasswordItem is never
# applied after its consumer, and that it does not share a wave with
# cert-manager, which would leave the ordering of the two up to ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
