# Source: addons/templates/argo-workflows.yaml
# Argo Workflows Config - CronWorkflows and custom resources
# Wave 10: After argo-workflows (wave 9) installs CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows-config
  namespace: argocd
  labels:
    helm.sh/chart: addons-1.0.0
    app.kubernetes.io/name: addons
    app.kubernetes.io/instance: addons
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/argo-workflows-config
    helm:
      valueFiles:
        - values.yaml
        - values-homelab.yaml
      # The ingress list (hostnames) comes from this parent's argo-workflows
      # values (configuration/ via the CMP in homelab) so the child's committed
      # values files stay PII-free. valuesObject overrides valueFiles in ArgoCD.
      valuesObject:
        ingressVerification:
          enabled: true
          ingresses:
          - expectAuth: true
            name: traefik
            url: https://traefik.REPLACEME-domain.com/dashboard/
          - expectAuth: true
            name: argocd
            url: https://argocd.REPLACEME-domain.com
          - expectAuth: true
            name: grafana
            url: https://grafana.REPLACEME-domain.com
          - expectAuth: true
            name: plex
            url: https://plex.REPLACEME-domain.com
          - expectAuth: true
            name: sonarr
            url: https://sonarr.REPLACEME-domain.com
          - expectAuth: true
            name: radarr
            url: https://radarr.REPLACEME-domain.com
          - expectAuth: true
            name: prowlarr
            url: https://prowlarr.REPLACEME-domain.com
          - expectAuth: true
            name: homeassistant
            url: https://homeassistant.REPLACEME-domain.com
          - expectAuth: true
            name: auth
            url: https://auth.REPLACEME-domain.com
          schedule: 0 0 * * *
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

