# Source: addons/templates/cilium-lb-ipam.yaml
# CiliumBGPClusterConfig - BGP speakers on the workers only (control planes stay off the ingress path)
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
