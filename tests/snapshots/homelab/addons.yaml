# Source: addons/templates/cilium-lb-ipam.yaml
# CiliumBGPPeerConfig - Shared peer configuration
# Defines connection parameters for BGP peers
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: unifi-gateway-peer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
    connectRetryTimeSeconds: 120
  gracefulRestart:
