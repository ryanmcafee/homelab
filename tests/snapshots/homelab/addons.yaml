# Source: addons/templates/cilium-lb-ipam.yaml
# CiliumL2AnnouncementPolicy - L2 (ARP) announcements for LoadBalancer IPs
# Provides connectivity without requiring BGP on the gateway
# nodeSelector excludes control-plane nodes: Proxmox VMs for control-plane nodes
# block gratuitous ARP for VIPs, causing L2 announcements to be unreachable externally.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  serviceSelector:
    matchLabels: {}
  interfaces:
    - ^ens.*
  externalIPs: true
  loadBalancerIPs: true

