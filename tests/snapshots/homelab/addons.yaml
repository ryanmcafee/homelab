# Source: addons/templates/argo-workflows.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  labels:
    helm.sh/chart: addons-1.0.0
    app.kubernetes.io/name: addons
    app.kubernetes.io/instance: addons
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Wave 9: After traefik-config (wave 8) so OIDC middleware is available
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.18
    helm:
      releaseName: argo-workflows
      values: |
        server:
          authMode: server
          ingress:
            enabled: true
            ingressClassName: internal
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: workflows.REPLACEME-domain.com
            hosts:
              - workflows.REPLACEME-domain.com
            paths:
              - /
            pathType: Prefix
            tls:
              - hosts:
                - workflows.REPLACEME-domain.com
                secretName: argo-workflows-tls
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
        controller:
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          workflowDefaults:
            spec:
              ttlStrategy:
                secondsAfterCompletion: 86400
                secondsAfterFailure: 172800
                secondsAfterSuccess: 43200

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true

