# Source: addons/templates/traefik-internal.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.9
    helm:
      releaseName: traefik-internal
      # CRDs come from the traefik-crds Application (templates/traefik-crds.yaml).
      skipCrds: true
      values: |
        # IngressClass configuration
        ingressClass:
          name: internal
          isDefaultClass: false

        deployment:
          replicas: 2

        service:
          type: LoadBalancer
          spec:
            externalTrafficPolicy: Cluster

        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: internal
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: internal

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false

        logs:
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultmode: drop
                names:
                  Traceparent: keep
                  User-Agent: keep
        tracing:
          sampleRate: 0.1
          otlp:
            enabled: true
            grpc:
              enabled: true
              endpoint: otel-collector-gateway.observability.svc.cluster.local:4317
              insecure: true

        # The ServiceMonitor selects a dedicated metrics Service; the main
        # Service does not expose :9100. The API check would fail an offline render.
        metrics:
          prometheus:
            disableAPICheck: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true

        env:
          []

        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik-internal.REPLACEME-domain.com`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-internal-dashboard-tls

        resources:
          limits:
            cpu: 1000m
            memory: 96Mi
          requests:
            cpu: 100m
            memory: 48Mi
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-internal
                app.kubernetes.io/name: traefik
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 3
          metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 80
                  type: Utilization
              type: Resource

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

