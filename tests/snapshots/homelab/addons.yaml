# Democratic-CSI iSCSI HDD - ArgoCD Application
# Deploys a democratic-CSI instance for iSCSI block storage (HDD-backed)
# Reuses the same namespace and truenas-api-key secret as the NFS instances
#
# DEPENDENCY: Requires democratic-csi (NFS) to be enabled. The democratic-csi-config
# app (sync wave 1) creates the truenas-api-key secret in the democratic-csi namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-iscsi-hdd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://democratic-csi.github.io/charts/
    chart: democratic-csi
    targetRevision: 0.15.1
    helm:
      releaseName: democratic-csi-iscsi-hdd
      values: |
        csiDriver:
          name: "org.democratic-csi.iscsi-hdd"

        driver:
          config:
            driver: freenas-api-iscsi

            httpConnection:
              protocol: https
              host: 192.168.1.100
              port: 443
              allowInsecure: true
              apiKey: "${TRUENAS_API_KEY}"

            zfs:
              datasetParentName: storage/k8s
              detachedSnapshotsDatasetParentName: storage/k8s-iscsi-snapshots
              zvolCompression: lz4
              zvolEnableReservation: false
              zvolBlocksize: 16K

            iscsi:
              targetPortal: "192.168.1.100:3260"
              namePrefix: csi-
              nameSuffix: "-homelab"
              targetGroups:
                - targetGroupPortalGroup: 1
                  targetGroupInitiatorGroup: 1
                  targetGroupAuthType: None
              extentInsecureTpc: true
              extentXenCompat: false
              extentDisablePhysicalBlocksize: true
              extentBlocksize: 512
              extentRpm: "7200"
              extentAvailThreshold: 0

        storageClasses:
          - name: democratic-csi-iscsi-hdd
            defaultClass: false
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4

        controller:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

        node:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

