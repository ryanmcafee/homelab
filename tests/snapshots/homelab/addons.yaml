# Source: addons/templates/traefik-external.yaml
# Redis for OIDC session storage (required for multi-replica Traefik)
# Wave 7: After traefik-external (wave 6) but before traefik-external-config (wave 8)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-redis
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 1
  selector:
