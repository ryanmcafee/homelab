    targetRevision: 1.21.1
    helm:
      releaseName: external-dns-cloudflare
      values: |
        fullnameOverride: external-dns-cloudflare

        provider:
          name: cloudflare
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api_token

        cloudflare:
          proxied: true

        # Only watch ingress resources (CRD source has its own deployment)
        sources:
          - ingress

        domainFilters:
          - REPLACEME-domain.com

        annotationFilter: external-dns.alpha.kubernetes.io/hostname

        policy: sync
        registry: txt
        txtOwnerId: homelab-cloudflare

        # Only process ingresses with ingressClassName=external (e.g., Plex)
