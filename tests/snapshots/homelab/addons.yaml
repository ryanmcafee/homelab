        # (allowImpersonation stays "false"). Reaching it needs a tailnet policy
        # grant to tag:k8s-operator:443 (docs/runbooks/readonly-access.md).
        apiServerProxyConfig:
          mode: "noauth"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

