# Source: addons/templates/tailscale-operator.yaml
# Operator Application (wave 2). oauth.clientId/clientSecret are EMPTY so the chart
# creates no Secret and instead consumes the externally-provisioned operator-oauth
# Secret (from the tailscale-config OnePasswordItem at wave 1) — no creds in git (TS-02).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.98.4
    helm:
      releaseName: tailscale-operator
      values: |
        oauth:
          clientId: ""
          clientSecret: ""
        operatorConfig:
          hostname: tailscale-operator-homelab
          defaultTags:
            - "tag:k8s-operator"
          resources:
            limits:
              memory: 192Mi
            requests:
              memory: 112Mi
        proxyConfig:
          defaultTags: "tag:k8s"
        # "noauth": the operator runs an in-process Kubernetes API server proxy
        # at https://<operatorConfig.hostname>.<tailnet>.ts.net that forwards
        # requests without adding authentication, so the caller's bearer token
        # reaches the kube-apiserver unchanged: agents authenticate as
        # system:serviceaccount:agent-access:agent-readonly and RBAC
        # (charts/agent-readonly) decides what they may read. No impersonation
        # (allowImpersonation stays "false"). Reaching it needs a tailnet policy
        # grant to tag:k8s-operator:443 (docs/runbooks/readonly-access.md).
        apiServerProxyConfig:
          mode: "noauth"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

