# Source: addons/templates/democratic-csi-ssd.yaml
# Democratic-CSI SSD - ArgoCD Application
# Deploys a separate democratic-CSI instance for SSD-backed NFS storage
# Reuses the same namespace and truenas-api-key secret as the HDD instance
#
# DEPENDENCY: Requires democratic-csi (HDD) to be enabled. The democratic-csi-config
# app (sync wave 1) creates the truenas-api-key secret in the democratic-csi namespace.
# If the HDD instance is disabled, the secret won't exist and this app will fail.
#
# NOTE: Snapshots dataset is derived by appending "-snapshots" to the nfs.parent value.
# e.g. parent "ssd/k8s" -> snapshots "ssd/k8s-snapshots". Keep Ansible dataset names in sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-ssd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://democratic-csi.github.io/charts/
    chart: democratic-csi
    targetRevision: 0.15.1
    helm:
      releaseName: democratic-csi-ssd
      values: |
        csiDriver:
          name: "org.democratic-csi.nfs-ssd"

        driver:
          config:
            driver: freenas-api-nfs

            httpConnection:
              protocol: https
              host: 192.168.1.100
              port: 443
              allowInsecure: true
              apiKey: "${TRUENAS_API_KEY}"

            zfs:
              datasetParentName: ssd/k8s
              detachedSnapshotsDatasetParentName: ssd/k8s-snapshots
              datasetEnableQuotas: true
              datasetEnableReservation: false
              datasetPermissionsMode: "0770"
              datasetPermissionsUser: 568
              datasetPermissionsGroup: 100

            nfs:
              shareHost: 192.168.1.100
              shareAlldirs: false
              shareAllowedHosts: []
              shareAllowedNetworks:
                - 192.168.1.0/24
              shareMapallUser: rmcafee
              shareMapallGroup: users

        storageClasses:
          - name: democratic-csi-ssd
            defaultClass: false
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - nfsvers=4
              - noatime

        controller:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

        node:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

