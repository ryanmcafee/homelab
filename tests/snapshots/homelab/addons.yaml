# Source: addons/templates/external-dns-cloudflare.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-cloudflare
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
