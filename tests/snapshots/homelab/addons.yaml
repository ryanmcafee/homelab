# Source: addons/templates/cloudnative-pg.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    # Sync wave 10 - after kube-prometheus-stack (wave 9), whose PodMonitor CRD the
    # operator's podMonitorEnabled needs; cnpg-barman-cloud follows at 11
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.28.3
    helm:
      releaseName: cloudnative-pg
      values: |
        resources:
          limits:
            cpu: 500m
            memory: 96Mi
          requests:
            cpu: 100m
            memory: 64Mi
        monitoring:
          grafanaDashboard:
            create: false
          podMonitorEnabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

