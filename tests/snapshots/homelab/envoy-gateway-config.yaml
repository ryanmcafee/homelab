---
# Source: envoy-gateway-config/templates/envoyproxy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-external
  namespace: envoy-gateway-system
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: proxy
                  app.kubernetes.io/managed-by: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: envoy-external
                  gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
        container:
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      envoyService:
        name: envoy-external
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.1.200"
          port-forwarding.replaceme-domain.com/enable: "true"
      envoyHpa:
        minReplicas: 2
        maxReplicas: 3
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
      envoyPDB:
        minAvailable: 1
  telemetry:
    # JSON on stdout: the OpenTelemetry agents ship it to ClickHouse (docs/logging.md).
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              gateway: "envoy-external"
              client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              method: "%REQ(:METHOD)%"
              authority: "%REQ(:AUTHORITY)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              route_name: "%ROUTE_NAME%"
              duration_ms: "%DURATION%"
              upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              traceparent: "%REQ(TRACEPARENT)%"
              trace_id: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    metrics:
      enableVirtualHostStats: true
      enableRequestResponseSizesStats: true
    # W3C traceparent is started or continued here; spans go to the OTel gateway collector (docs/tracing.md).
    tracing:
      samplingRate: 10
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector-gateway
            namespace: observability
            port: 4317
      customTags:
        gateway:
          type: Literal
          literal:
            value: "envoy-external"

