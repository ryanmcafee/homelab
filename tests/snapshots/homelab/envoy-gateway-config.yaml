    - name: envoy-internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Source: envoy-gateway-config/templates/monitoring.yaml
# Envoy serves Prometheus stats on the admin port of every proxy pod.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-external-proxy
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-name: envoy-external
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: gateway
          replacement: envoy-external

