kind: ClientTrafficPolicy
metadata:
  name: envoy-external
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  timeout:
    http:
      idleTimeout: 600s
  http1:
    enableTrailers: true

