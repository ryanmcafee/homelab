---
# Source: envoy-gateway-config/templates/gateway.yaml
# Plain HTTP only redirects; routes attach to the https listener (sectionName: https).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-external-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy-external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# Source: envoy-gateway-config/templates/gateway.yaml
# Plain HTTP only redirects; routes attach to the https listener (sectionName: https).
