---
# Source: envoy-gateway-config/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-wildcard-tls
  namespace: envoy-gateway-system
spec:
  secretName: gateway-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "replaceme-domain.com"
    - "*.replaceme-domain.com"

---
# Source: envoy-gateway-config/templates/policies.yaml
