    {
      "uid": "homelab-cluster-logs",
      "title": "Cluster logs",
      "tags": [
        "logs",
        "clickhouse",
        "opentelemetry"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "grafana-clickhouse-datasource",
              "uid": "clickhouse-logs"
            },
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "refresh": 2,
            "sort": 1,
            "query": "SELECT DISTINCT ResourceAttributes['k8s.namespace.name'] FROM otel.otel_logs WHERE $__timeFilter(Timestamp)"
          },
          {
            "name": "search",
            "label": "Contains",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Log lines per namespace",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 0,
              "rawSql": "SELECT $__timeInterval(Timestamp) AS time, ResourceAttributes['k8s.namespace.name'] AS namespace, count() AS lines FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ResourceAttributes['k8s.namespace.name'] IN (${namespace:singlequote}) GROUP BY time, namespace ORDER BY time",
              "pluginVersion": ""
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Traefik requests: 5xx or slower than 1 s",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
          },
          "description": "JSON access logs of traefik-internal and traefik-external (Duration is in nanoseconds).",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 1,
              "rawSql": "SELECT Timestamp, ResourceAttributes['k8s.pod.name'] AS pod, JSONExtractString(Body, 'RequestHost') AS host, JSONExtractString(Body, 'RequestMethod') AS method, JSONExtractString(Body, 'RequestPath') AS path, JSONExtractInt(Body, 'DownstreamStatus') AS status, round(JSONExtractFloat(Body, 'Duration') / 1e6) AS duration_ms, JSONExtractString(Body, 'ServiceName') AS backend FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ResourceAttributes['k8s.namespace.name'] = 'traefik' AND JSONHas(Body, 'DownstreamStatus') AND (JSONExtractInt(Body, 'DownstreamStatus') >= 500 OR JSONExtractFloat(Body, 'Duration') > 1e9) ORDER BY Timestamp DESC LIMIT 500",
              "pluginVersion": ""
            }
          ]
        },
        {
          "id": 3,
          "type": "logs",
          "title": "Logs",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-logs"
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-logs"
              },
              "editorType": "sql",
              "queryType": "sql",
              "format": 2,
              "rawSql": "SELECT Timestamp AS timestamp, Body AS body, SeverityText AS level, ResourceAttributes['k8s.namespace.name'] AS namespace, ResourceAttributes['k8s.pod.name'] AS pod, ResourceAttributes['k8s.container.name'] AS container FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ResourceAttributes['k8s.namespace.name'] IN (${namespace:singlequote}) AND positionCaseInsensitive(Body, '${search}') > 0 ORDER BY Timestamp DESC LIMIT 1000",
              "pluginVersion": ""
            }
          ]
        }
      ]
    }
    
