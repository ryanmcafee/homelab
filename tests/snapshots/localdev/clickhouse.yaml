# Source: clickhouse/templates/clickhouseinstallation.yaml
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: logs
  namespace: observability
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  configuration:
    users:
      otel/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-otel
            key: password
      otel/networks/ip:
        - "::/0"
      otel/profile: default
      otel/grants/query:
        - GRANT ALL ON otel.*
      grafana/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-grafana
            key: password
      grafana/networks/ip:
        - "::/0"
      grafana/profile: default
      grafana/grants/query:
        - GRANT SELECT ON otel.*
    clusters:
      - name: logs
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.8.10.6
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
    volumeClaimTemplates:
      - name: data
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
