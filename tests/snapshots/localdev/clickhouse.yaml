tes, toUInt64OrZero(LogAttributes['flow.io.packets']) AS packets, multiIf(src_net != 'internet' AND dst_net != 'internet', 'internal', src_net != 'internet', 'egress', dst_net != 'internet', 'ingress', 'transit') AS direction FROM otel.otel_logs WHERE $__timeFilter(Timestamp) AND ScopeName = 'otelcol/netflowreceiver' SETTINGS optimize_functions_to_subcolumns = 0) WHERE $__conditionalAll((src_net IN (${network:singlequote}) OR dst_net IN (${network:singlequote})), $network) AND $__conditionalAll(proto IN (${protocol:singlequote}), $protocol) AND $__conditionalAll(src = ${src_ip:singlequote}, $src_ip) AND $__conditionalAll(dst = ${dst_ip:singlequote}, $dst_ip)",
