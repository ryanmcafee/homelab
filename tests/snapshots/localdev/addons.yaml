# Source: addons/templates/logging.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.173.1"
    helm:
      releaseName: otel-collector-agent
      values: |
        fullnameOverride: otel-collector-agent
        mode: daemonset
        presets:
          # filelog on /var/log/pods (hostPath, read-only) with the CRI parser;
          # checkpoints in /var/lib/otelcol so a restart neither re-sends nor skips.
          logsCollection:
            enabled: true
            includeCollectorLogs: false
            storeCheckpoints: true
          kubernetesAttributes:
            enabled: true
        # Container logs under /var/log/pods are root-owned 0640.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        tolerations:
          - operator: Exists
        image:
          repository: otel/opentelemetry-collector-contrib
        command:
          name: otelcol-contrib
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        ports:
          otlp:
            enabled: false
          otlp-http:
            enabled: false
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
          metrics:
            enabled: true
        podMonitor:
          enabled: true
        extraEnvs:
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-otel
                key: password
        config:
          receivers:
            jaeger: null
            zipkin: null
            prometheus: null
            otlp: null
          processors:
            batch:
              send_batch_size: 5000
              timeout: 5s
            # Grafana's OpenTelemetry logs view groups by ServiceName; pods
            # carry no service.name, so the container name stands in.
            transform/service-name:
              log_statements:
                - context: resource
                  statements:
                    - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil
          exporters:
            debug: null
            clickhouse:
              endpoint: tcp://clickhouse-logs.observability.svc.cluster.local:9000?dial_timeout=10s
              database: otel
              username: otel
              password: ${env:CLICKHOUSE_PASSWORD}
              create_schema: true
              logs_table_name: otel_logs
              traces_table_name: otel_traces
              ttl: 2160h
              timeout: 10s
              sending_queue:
                queue_size: 1000
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s
          service:
            pipelines:
              logs:
                receivers: []
                processors:
                  - memory_limiter
                  - transform/service-name
                  - batch
                exporters:
                  - clickhouse
              traces: null
              metrics: null
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

