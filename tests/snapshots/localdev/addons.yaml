# Source: addons/templates/istio.yaml
# Config Application: Prometheus operator monitors for istiod, istio-cni,
# ztunnel and waypoints, and the mesh-wide tracing Telemetry (charts/istio-config).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/istio-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      valuesObject:
        namespace: istio-system
        tracing:
          port: 4317
          provider: otel-tracing
          samplingPercentage: 100
          service: otel-collector-gateway.observability.svc.cluster.local
        kiali:
          host: servicemesh.homelab.local
          ingressClassName: internal
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

