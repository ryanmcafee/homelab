---
# Source: addons/templates/logging.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.173.1"
    helm:
      releaseName: otel-collector-gateway
      values: |
        fullnameOverride: otel-collector-gateway
        # OTLP for traces and application logs, plus the UniFi gateway's syslog
        # and flow export (docs/logging.md, docs/tracing.md).
        mode: deployment
        replicaCount: 1
        presets:
          kubernetesAttributes:
            enabled: true
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: otlp.homelab.local
          enabled: true
          hosts:
          - host: otlp.homelab.local
            paths:
            - path: /
              pathType: Prefix
              port: 4318
          ingressClassName: internal
          tls:
          - hosts:
            - otlp.homelab.local
            secretName: otlp-tls
        image:
          repository: otel/opentelemetry-collector-contrib
        command:
          name: otelcol-contrib
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        ports:
          otlp:
            enabled: true
            hostPort: 0
          otlp-http:
            enabled: true
            hostPort: 0
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
          metrics:
            enabled: true
          syslog-udp:
            enabled: true
            containerPort: 5514
            servicePort: 514
            protocol: UDP
          syslog-tcp:
            enabled: true
            containerPort: 5514
            servicePort: 514
            protocol: TCP
          netflow:
            enabled: true
            containerPort: 2055
            servicePort: 2055
            protocol: UDP
          unifi-metrics:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        podMonitor:
          enabled: true
          metricsEndpoints:
            - port: metrics
            - port: unifi-metrics
        extraEnvs:
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-otel
                key: password
        config:
          receivers:
            jaeger: null
            zipkin: null
            prometheus: null
            # UniFi SIEM export: CEF lines inside RFC 3164 syslog.
            syslog/udp:
              udp:
                listen_address: 0.0.0.0:5514
                add_attributes: true
              protocol: rfc3164
              location: UTC
              operators:
                - type: regex_parser
                  if: 'attributes.message matches "CEF:"'
                  parse_from: attributes.message
                  regex: 'CEF:(?P<cef_version>\d+)\|(?P<cef_vendor>[^|]*)\|(?P<cef_product>[^|]*)\|(?P<cef_device_version>[^|]*)\|(?P<cef_signature>[^|]*)\|(?P<cef_name>[^|]*)\|(?P<cef_severity>[^|]*)\|(?P<cef_extension>.*)'
                  on_error: send_quiet
                - type: add
                  field: resource["service.name"]
                  value: unifi-syslog
            syslog/tcp:
              tcp:
                listen_address: 0.0.0.0:5514
                add_attributes: true
              protocol: rfc3164
              location: UTC
              operators:
                - type: add
                  field: resource["service.name"]
                  value: unifi-syslog
            # NetFlow v5/v9/IPFIX from the gateway, one log record per flow.
            netflow:
              scheme: netflow
              port: 2055
              sockets: 1
              workers: 2
          processors:
            batch:
              send_batch_size: 5000
              timeout: 5s
            # Grafana's OpenTelemetry logs view groups by ServiceName; pods
            # carry no service.name, so the container name stands in.
            transform/service-name:
              log_statements:
                - context: scope
                  statements:
                    - set(resource.attributes["service.name"], "unifi-netflow") where scope.name == "otelcol/netflowreceiver"
                - context: resource
                  statements:
                    - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil
            # One series per source, no job/instance labels; fresh timestamps keep the deltas in order for delta_to_cumulative.
            transform/unifi-telemetry:
              metric_statements:
                - context: resource
                  statements:
                    - keep_keys(resource.attributes, [])
                - context: datapoint
                  statements:
                    - set(datapoint.attributes["source"], "netflow") where datapoint.attributes["service.name"] == "unifi-netflow"
                    - set(datapoint.attributes["source"], "syslog") where datapoint.attributes["service.name"] == "unifi-syslog"
                    - delete_key(datapoint.attributes, "service.name")
                    - set(datapoint.start_time, Now())
                    - set(datapoint.time, Now())
            delta_to_cumulative:
              max_stale: 1h
          connectors:
            count/unifi:
              logs:
                homelab.unifi.telemetry.records:
                  description: UniFi gateway syslog lines and flow records received by the gateway collector.
                  conditions:
                    - instrumentation_scope.name == "otelcol/netflowreceiver"
                    - resource.attributes["service.name"] == "unifi-syslog"
                  attributes:
                    - key: service.name
          exporters:
            debug: null
            clickhouse:
              endpoint: tcp://clickhouse-logs.observability.svc.cluster.local:9000?dial_timeout=10s
              database: otel
              username: otel
              password: ${env:CLICKHOUSE_PASSWORD}
              create_schema: true
              logs_table_name: otel_logs
              traces_table_name: otel_traces
              ttl: 2160h
              timeout: 10s
              sending_queue:
                queue_size: 1000
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s
            # A silent source keeps its last count for an hour before the series expires.
            prometheus/unifi:
              endpoint: ${env:MY_POD_IP}:8889
              metric_expiration: 1h
              without_scope_info: true
          service:
            pipelines:
              logs:
                receivers:
                  - otlp
                  - syslog/udp
                  - syslog/tcp
                  - netflow
                processors:
                  - memory_limiter
                  - transform/service-name
                  - batch
                exporters:
                  - clickhouse
                  - count/unifi
              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - clickhouse
              metrics: null
              metrics/unifi:
                receivers:
                  - count/unifi
                processors:
                  - transform/unifi-telemetry
                  - delta_to_cumulative
                exporters:
                  - prometheus/unifi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: addons/templates/metrics-server.yaml
# metrics-server serves metrics.k8s.io: `kubectl top` and every
# HorizontalPodAutoscaler on a Resource metric (both Traefik HPAs) read it.
# Without it an HPA reports `cpu: <unknown>` and never scales.
# Wave 2: after kubelet-csr-approver (wave 1), which approves the kubelet
# serving certificates metrics-server verifies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      values: |
        replicas: 1

        # Talos signs kubelet serving certificates with the cluster CA
        # (rotate-server-certificates + kubelet-csr-approver), which
        # metrics-server verifies by default. Kind's kubelets self-sign, so
        # verification is off only where KUBELET_SERVING_CERT says so.
        args:
          - --kubelet-insecure-tls

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: addons/templates/node-feature-discovery.yaml
# NodeFeatureDiscovery — hardware feature labeling via a cluster-admin-scoped
# DaemonSet. Required prerequisite for intel-gpu-device-plugin (sync wave 10)
# which consumes NFD's NodeFeature/NodeFeatureRule CRs to decide where to
# schedule its device DaemonSet. Also general-purpose: any chart that wants
# PCI-driven nodeSelectors (e.g. feature.node.kubernetes.io/pci-8086.present)
# depends on this being present.
#
# NFD runs with its own ServiceAccount and RBAC, so it is not subject to the
# kubelet allowlist that NodeRestriction imposes on Talos' worker-side label
# apply path. This is the canonical fix for hardware labels on Talos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-feature-discovery
  namespace: argocd
  annotations:
    # Wave 9: one wave earlier than intel-gpu-device-plugin / nvidia-gpu-operator
    # so the PCI labels exist before any device plugin looks for them.
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    chart: node-feature-discovery
    targetRevision: 0.18.3
    helm:
      releaseName: node-feature-discovery
      values: |
        master:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: 300m
              memory: 128Mi

        worker:
          enabled: true
          # Run on every node — including control planes — so every node gets
          # feature.node.kubernetes.io/* labels from the built-in PCI, CPU, and
          # kernel sources.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 96Mi

        # Garbage collector cleans up stale NodeFeature CRs when nodes disappear
        gc:
          enabled: true
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 48Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: node-feature-discovery

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

