# Source: addons/templates/traefik-external.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-external
  namespace: argocd
  annotations:
    # Sync wave 6: After traefik-external-dependencies (wave 5) creates secrets
    argocd.argoproj.io/sync-wave: "6"
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #263: localdev renders addons/applications without the CMP domain-substitution stage (CLAUDE.md's CMP Architecture: localdev uses native Helm with values-localdev.yaml, no CMP), so the dashboard IngressRoute matchRule stays the checked-in values.yaml placeholder here; it is never resolved or used in localdev (services are reached via NodePort). Fix is to generate values-localdev.yaml from config; remove this exemption then. In homelab this hostname is correctly domain-derived by the two-stage config-export flow, so the exemption is scoped to localdev only."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.0
    helm:
      releaseName: traefik-external
      values: |
        # IngressClass configuration
        ingressClass:
          name: external
          isDefaultClass: false

        deployment:
          replicas: 2

        service:
          type: NodePort
          spec:
            externalTrafficPolicy: Cluster

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: external
          # Enable cross-namespace references for middlewares
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: external

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false

        env:
          []

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.example.com`)
            entryPoints:
              - websecure

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-external
                app.kubernetes.io/name: traefik
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 3
          metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 80
                  type: Utilization
              type: Resource

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
---
