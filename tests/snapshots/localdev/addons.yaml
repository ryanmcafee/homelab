# Source: addons/templates/logging.yaml
# The ClickHouseInstallation and the logs dashboard (charts/clickhouse). Health
# comes from charts/bootstrap/files/health/clickhouse.altinity.com_ClickHouseInstallation.lua.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/clickhouse
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # Storage class, sizing and image pin are environment facts
      # (configuration/) and reach the child through this parent (ADR-010).
      valuesObject:
        namespace: observability
        database: otel
        image: clickhouse/clickhouse-server:26.8.10.6
        networkNames: ""
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        storageClass: local-path
        storageSize: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # The ClickHouseInstallation CRD comes from clickhouse-operator (wave 10).
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

