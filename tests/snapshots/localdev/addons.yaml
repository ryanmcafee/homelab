# Source: addons/templates/traefik-external.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-external
  namespace: argocd
  annotations:
    # Sync wave 6: After traefik-external-dependencies (wave 5) creates secrets
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.9
    helm:
      releaseName: traefik-external
      values: |
        # IngressClass configuration
        ingressClass:
          name: external
          isDefaultClass: false

        deployment:
          replicas: 1

        service:
          type: NodePort
          spec:
            externalTrafficPolicy: Cluster

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: external
          # Enable cross-namespace references for middlewares
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: external

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false
        experimental:
          plugins:
            traefikoidc:
              moduleName: github.com/lukaszraczylo/traefikoidc
              version: v1.0.32

        logs:
          access:
            enabled: true
            format: json

        # The ServiceMonitor selects a dedicated metrics Service; the main
        # Service does not expose :9100. The API check would fail an offline render.
        metrics:
          prometheus:
            disableAPICheck: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true

        env:
          []

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.homelab.local`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-dashboard-tls

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

