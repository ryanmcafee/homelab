---
# Source: addons/templates/agent-readonly.yaml
# Namespace for the agent-readonly ServiceAccount and its token Secret (wave 1,
# before the Application at wave 2). Nothing runs here, so PodSecurity is the
# strictest level. docs/runbooks/readonly-access.md
apiVersion: v1
kind: Namespace
metadata:
  name: agent-access
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
# Source: addons/templates/istio.yaml
# istio-cni and ztunnel mount host paths and need NET_ADMIN/SYS_ADMIN, which
# Talos' default baseline PodSecurity rejects.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# Source: addons/templates/kube-prometheus-stack.yaml
# Namespace with privileged PodSecurity labels for node-exporter
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# Source: addons/templates/logging.yaml
# The agent DaemonSet reads /var/log/pods through hostPath volumes, which the
# baseline PodSecurity level forbids.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# Source: addons/templates/node-feature-discovery.yaml
# Namespace for NodeFeatureDiscovery components.
#
# Requires privileged PodSecurity because the nfd-worker DaemonSet mounts
# host paths for hardware discovery: /boot, /etc/os-release, /sys, /usr/lib,
# /lib, /proc/swaps, and /etc/kubernetes/node-feature-discovery/features.d.
# Without these labels the baseline PodSecurity cluster default rejects the
# DaemonSet pods with:
#   violates PodSecurity "baseline:latest": hostPath volumes
apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "9"

