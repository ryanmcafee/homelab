# Source: addons/templates/istio.yaml
# Kiali on the internal ingress at the SERVICEMESH_HOSTNAME of configuration/.
# Token login: a user signs in with a ServiceAccount token and sees what that
# token's RBAC allows (docs/service-mesh.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: "2.32.0"
    helm:
      releaseName: kiali
      values: |
        auth:
          strategy: token
        deployment:
          image_pull_policy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 128Mi
          # The Ingress is rendered by charts/istio-config: the chart's own
          # picks its apiVersion from cluster capabilities, which a local
          # render does not have, and then never matches the live object.
          ingress:
            enabled: false
        server:
          web_root: /
          web_fqdn: servicemesh.homelab.local
          web_schema: https
          web_port: "443"
        external_services:
          istio:
            root_namespace: istio-system
          prometheus:
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          grafana:
            enabled: true
            internal_url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
            external_url: https://grafana.homelab.local
          tracing:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: addons/templates/kube-prometheus-stack.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.1.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # The monitoring CRDs come from the bootstrap chart's
        # prometheus-operator-crds Application (wave -1) so ArgoCD and
        # cert-manager can render ServiceMonitors long before this chart syncs;
        # a second owner here would make every CRD a shared resource.
        crds:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 1d
            retentionSize: 4GB

            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 256Mi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: NotIn
                      values:
                      - "true"

        grafana:
          enabled: true

          adminPassword: "admin"

          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi
          ingress:
            enabled: true
            ingressClassName: internal
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: grafana.homelab.local
            hosts:
              - grafana.homelab.local
            tls:
              - hosts:
                - grafana.homelab.local
                secretName: grafana-tls

          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

          securityContext:
            fsGroup: 100
            runAsGroup: 100
            runAsUser: 568

          # ClickHouse datasource for cluster logs and traces (docs/logging.md,
          # docs/tracing.md); OpenTelemetry mode links a log's TraceId to its trace. The
          # provisioning file keeps the $-reference; Grafana expands it from
          # the environment, so the password never enters a ConfigMap.
          plugins:
            - grafana-clickhouse-datasource@4.21.3
          envValueFrom:
            CLICKHOUSE_PASSWORD:
              secretKeyRef:
                name: clickhouse-grafana
                key: password
          additionalDataSources:
            - name: ClickHouse
              uid: clickhouse-logs
              type: grafana-clickhouse-datasource
              jsonData:
                host: clickhouse-logs.observability.svc.cluster.local
                port: 9000
                protocol: native
                username: grafana
                defaultDatabase: otel
                logs:
                  defaultDatabase: otel
                  defaultTable: otel_logs
                  otelEnabled: true
                  otelVersion: "1.3.0"
                traces:
                  defaultDatabase: otel
                  defaultTable: otel_traces
                  otelEnabled: true
                  otelVersion: "1.3.0"
                  durationUnit: nanoseconds
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: homelab
                  folder: Homelab
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/homelab
          dashboards:
            homelab:
              cilium-agent:
                gnetId: 16611
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              cilium-operator:
                gnetId: 16612
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              hubble:
                gnetId: 16613
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              hubble-dns-overview:
                gnetId: 19425
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              hubble-network-overview:
                gnetId: 19424
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              istio-control-plane:
                gnetId: 7645
                revision: 332
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              istio-mesh:
                gnetId: 7639
                revision: 333
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              istio-service:
                gnetId: 7636
                revision: 332
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              istio-workload:
                gnetId: 7630
                revision: 333
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              istio-ztunnel:
                gnetId: 21306
                revision: 100
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              opentelemetry-collector:
                gnetId: 15983
                revision: 30
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              traefik:
                gnetId: 17347
                revision: 9
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus

          # Use Recreate strategy to avoid Multi-Attach errors with RWO PVC
          deploymentStrategy:
            type: Recreate

        alertmanager:
          enabled: false

        nodeExporter:
          enabled: false

        kubeStateMetrics:
          enabled: true

        kube-state-metrics:
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi

        # The chart's own CPUThrottlingHigh divides throttled CFS periods by the
        # periods the container ran in at all, with no floor under the
        # denominator, so a container that is 99 % idle reads as badly throttled
        # off a handful of samples. Turned off here; the tuned copy with that
        # floor is in additionalPrometheusRulesMap below.
        defaultRules:
          disabled:
            CPUThrottlingHigh: true

        # No kube-proxy where Cilium replaces it: the chart's scrape Service would
        # select nothing and KubeProxyDown would fire forever. Disabling the
        # component also drops that rule.
        kubeProxy:
          enabled: true

        # etcd scrape (Talos exposes etcd metrics on <control-plane IP>:2381 once
        # cluster.etcd.extraArgs.listen-metrics-urls is set). Kind has no reachable
        # etcd metrics endpoint, so the scrape is disabled there instead of leaving
        # a permanently down target behind.
        #
        # The chart's own kubeEtcd path cannot reach an external etcd here. It
        # points a selector-less Service at an Endpoints object built from
        # kubeEtcd.endpoints, and ArgoCD's resource.exclusions drop Endpoints and
        # EndpointSlice cluster-wide, so that object is rendered and then never
        # applied: the Service stays empty and nothing is scraped. Talos also runs
        # etcd as a host service with no Kubernetes pod, so the selector form
        # cannot work either. The addresses therefore go into a static scrape
        # config, which needs no Endpoints object at all.
        #
        # kubeEtcd.enabled stays true because the chart gates its etcd alert rules
        # (etcdHighFsyncDurations, etcdHighNumberOfLeaderChanges, ...) on it; only
        # the unusable Service and ServiceMonitor are turned off. The job name must
        # contain "etcd" because those rules match job=~".*etcd.*".
        kubeEtcd:
          enabled: true
          service:
            enabled: false
          serviceMonitor:
            enabled: false

        # Control-plane alerts. The chart's own defaultRules cover etcd once it is
        # scraped; these three cover the symptom (apiserver 5xx), the cause (slow
        # control-plane disk) and the blind spot (etcd metrics missing again).
        # Prometheus $labels templating is escaped so Helm leaves it untouched.
        additionalPrometheusRulesMap:
          homelab-control-plane:
            groups:
              - name: homelab-control-plane
                rules:
                  - alert: KubeAPIServerErrorsHigh
                    expr: 'sum(rate(apiserver_request_total{code=~"5.."}[5m])) > 0.5'
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'kube-apiserver is returning 5xx (etcd/lease trouble)'
                      description: 'kube-apiserver has been serving more than 0.5 5xx responses per second for 2m. Usually etcd fsync stalls on the control-plane disk; see docs/runbooks/control-plane-storage.md.'
                  - alert: NodeDiskWriteLatencyHigh
                    expr: 'rate(node_disk_write_time_seconds_total{device="sda"}[5m]) / rate(node_disk_writes_completed_total{device="sda"}[5m]) > 0.05'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Average sda write latency on {{ $labels.instance }} is above 50ms'
                      description: 'The system disk of {{ $labels.instance }} has averaged more than 50ms per write for 10m. On the control planes this starves etcd fsync; see docs/runbooks/control-plane-storage.md.'
          # Critical infrastructure alerts routed by severity (docs/runbooks/alerting.md).
          # The chart's defaultRules already cover full disks and volumes
          # (NodeFilesystemAlmostOutOfSpace, KubePersistentVolumeFillingUp), pods
          # and targets; these name the homelab failures those miss or only warn
          # about. Metrics: kube-state-metrics, the kube-etcd scrape and the
          # CloudNativePG PodMonitor, all of which Prometheus discovers today.
          homelab-infrastructure:
            groups:
              - name: homelab-infrastructure
                rules:
                  - alert: HomelabNodeNotReady
                    expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Node {{ $labels.node }} is NotReady'
                      description: 'The kubelet on {{ $labels.node }} has reported NotReady for 5m. Workloads on it are being rescheduled; check the VM in Proxmox and `talosctl -n <node> health`.'
                  - alert: HomelabNodeUnderPressure
                    expr: 'kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Node {{ $labels.node }} reports {{ $labels.condition }}'
                      description: '{{ $labels.node }} has been under {{ $labels.condition }} for 10m; the kubelet is evicting pods. Check `kubectl describe node` and the workload limits.'
                  - alert: HomelabPostgresClusterDown
                    expr: 'max by (namespace, cluster) (cnpg_collector_up) == 0'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CloudNativePG cluster {{ $labels.namespace }}/{{ $labels.cluster }} is down'
                      description: 'No instance of {{ $labels.cluster }} has reported PostgreSQL up for 5m. `kubectl -n {{ $labels.namespace }} get cluster {{ $labels.cluster }}` shows the phase; docs/disaster-recovery.md covers the restore path.'
                  # ArgoCD and cert-manager expose these through the ServiceMonitors
                  # their charts render (bootstrap and cert-manager values); the CRDs
                  # they need come from prometheus-operator-crds at bootstrap wave -1.
                  - alert: HomelabArgoCDApplicationDegraded
                    expr: 'argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ArgoCD Application {{ $labels.name }} is {{ $labels.health_status }}'
                      description: '{{ $labels.name }} has been {{ $labels.health_status }} for 15m. `task prod:status` lists the Applications; `task prod:diff -- {{ $labels.name }}` shows what differs from Git.'
                  - alert: HomelabCertificateExpiringSoon
                    expr: 'certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600'
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days'
                      description: 'cert-manager has not renewed {{ $labels.namespace }}/{{ $labels.name }} although it should renew 30 days before expiry. `kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}` shows the last ACME attempt.'
                  # Cluster DNS. CoreDNS forwards to the node resolver, which has a
                  # single upstream (the gateway). On 2026-09-03 that upstream was
                  # unhealthy for 8.5 h: CoreDNS had nowhere to forward, answered
                  # SERVFAIL to one query in four (66k answers), crash-looped
                  # external-dns and failed Renovate — and nothing alerted, because
                  # CoreDNS itself was up, so TargetDown never fired. The ratio held
                  # 25 % through the outage against a 3 % peak in a normal week; the
                  # rate guard keeps an idle cluster from alerting on a thin sample.
                  - alert: HomelabClusterDNSFailing
                    expr: 'sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[10m])) / sum(rate(coredns_dns_responses_total[10m])) > 0.1 and sum(rate(coredns_dns_responses_total[10m])) > 1'
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CoreDNS is answering SERVFAIL for {{ $value | humanizePercentage }} of queries'
                      description: 'More than 10 % of cluster DNS answers have been SERVFAIL for 15m, so name resolution is failing cluster-wide. Usually the upstream resolver: see HomelabClusterDNSUpstreamDown and docs/runbooks/cluster-dns.md.'
                  - alert: HomelabClusterDNSUpstreamDown
                    expr: 'sum(rate(coredns_forward_healthcheck_broken_total[5m])) > 0'
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CoreDNS has no healthy upstream resolver'
                      description: 'CoreDNS has marked every upstream in the node resolver unhealthy for 10m, so it can only answer from cache and then SERVFAIL. The nodes resolve through one upstream, so this usually means the gateway is not answering DNS; docs/runbooks/cluster-dns.md.'
                  # CPUThrottlingHigh, re-stated with a floor under the denominator
                  # (defaultRules.disabled turns the chart's own copy off). Same
                  # ratio and the same 25 % threshold; the container must also have
                  # run in more than 300 of the 3000 CFS periods in the window, a
                  # 10 % duty cycle. Below that the ratio is a handful of samples
                  # and means nothing: the democratic-csi drivers sit at ~35
                  # periods. Every container that does real work is far above the
                  # floor (Prometheus 2250, Grafana 1934, Spegel ~1180/pod), so
                  # nothing that could actually be CPU-starved stops alerting.
                  - alert: CPUThrottlingHigh
                    expr: 'sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_throttled_periods_total{container!="",job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) / on (cluster, namespace, pod, container, instance) group_left () sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) > (25 / 100) and on (cluster, namespace, pod, container, instance) sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) > 300'
                    for: 15m
                    labels:
                      severity: info
                    annotations:
                      summary: 'Processes experience elevated CPU throttling.'
                      description: '{{ $value | humanizePercentage }} throttling of CPU in namespace {{ $labels.namespace }} for container {{ $labels.container }} in pod {{ $labels.pod }}, which is busy enough for the figure to mean something. Raise the CPU limit; requests govern scheduling, a limit only caps a burst.'
                      runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh'
          # Ingress (docs/runbooks/alerting.md). Metrics: the ServiceMonitors of
          # both Traefik releases (job = metrics Service, <release>-metrics). Traefik labels the
          # backend `service`; the scrape renames it to exported_service.
          homelab-ingress:
            groups:
              - name: homelab-ingress
                rules:
                  - alert: HomelabTraefikDown
                    expr: 'sum by (job) (up{job=~"traefik-internal-metrics|traefik-external-metrics"}) == 0 or absent(up{job="traefik-internal-metrics"}) or absent(up{job="traefik-external-metrics"})'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Traefik {{ $labels.job }} has no reachable instance'
                      description: 'No {{ $labels.job }} pod has answered the metrics scrape for 5m, so every route on that ingress class is down. `kubectl -n traefik get pods` and the Traefik logs in Grafana (docs/logging.md).'
                  - alert: HomelabTraefikBackendErrors
                    expr: 'sum by (job, exported_service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum by (job, exported_service) (rate(traefik_service_requests_total[5m])) > 0.05 and sum by (job, exported_service) (rate(traefik_service_requests_total[5m])) > 0.1'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{ $labels.exported_service }} answers 5xx to {{ $value | humanizePercentage }} of requests'
                      description: 'More than 5 % of the requests {{ $labels.job }} routed to {{ $labels.exported_service }} have failed with 5xx for 10m. The access logs (ServiceName traefik, docs/logging.md) show the failing paths and upstream durations.'
                  - alert: HomelabTraefikBackendSlow
                    expr: 'histogram_quantile(0.95, sum by (job, exported_service, le) (rate(traefik_service_request_duration_seconds_bucket[5m]))) > 5 and sum by (job, exported_service) (rate(traefik_service_requests_total[5m])) > 0.05'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'p95 latency of {{ $labels.exported_service }} is {{ $value | humanizeDuration }}'
                      description: 'The 95th percentile response time {{ $labels.job }} measured for {{ $labels.exported_service }} has been above 5 s for 10m. Streaming endpoints hold requests open by design; check the access logs before tuning.'
          # Log pipeline, adapted from the opentelemetry-collector chart rules and
          # the Altinity clickhouse-operator alert rules (docs/runbooks/alerting.md).
          homelab-logging:
            groups:
              - name: homelab-logging
                rules:
                  - alert: HomelabLogExportFailing
                    expr: 'sum by (namespace, pod) (rate(otelcol_exporter_send_failed_log_records[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{ $labels.pod }} cannot write logs to ClickHouse'
                      description: '{{ $labels.pod }} has failed to export log records for 15m; they are dropped once the retry window (5m) and the send queue run out. Check the ClickHouse pod and `kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }}`.'
                  - alert: HomelabLogExportQueueFull
                    expr: 'max by (namespace, pod) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{ $labels.pod }} send queue is {{ $value | humanizePercentage }} full'
                      description: 'The ClickHouse exporter queue of {{ $labels.pod }} has been above 80 % for 10m; new batches are refused when it fills. ClickHouse is slow or unreachable.'
                  - alert: HomelabLogsNotArriving
                    expr: 'sum(rate(otelcol_receiver_accepted_log_records{receiver=~"file_?log.*"}[15m])) == 0 or absent(otelcol_receiver_accepted_log_records{receiver=~"file_?log.*"})'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'No container logs are being collected'
                      description: 'The OpenTelemetry agents have read no container log line for 30m. Check the otel-collector-agent DaemonSet in observability and its hostPath mounts of /var/log/pods.'
                  - alert: HomelabTraceExportFailing
                    expr: 'sum by (namespace, pod) (rate(otelcol_exporter_send_failed_spans[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{ $labels.pod }} cannot write spans to ClickHouse'
                      description: '{{ $labels.pod }} has failed to export spans for 15m; they are dropped once retries and the send queue run out (docs/tracing.md).'
                  - alert: HomelabTelemetryRefused
                    expr: 'sum by (namespace, pod, receiver) (rate(otelcol_receiver_refused_spans[5m]) or rate(otelcol_receiver_refused_log_records[5m])) > 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Receiver {{ $labels.receiver }} on {{ $labels.pod }} refuses data'
                      description: 'The collector has refused spans or log records on {{ $labels.receiver }} for 10m, usually because memory_limiter is holding it back. Raise the collector memory limit or find the sender flooding it.'
                  - alert: HomelabUniFiTelemetrySilent
                    expr: 'sum by (source) (rate(homelab_unifi_telemetry_records_total[30m])) == 0 or absent(homelab_unifi_telemetry_records_total{source="netflow"}) or absent(homelab_unifi_telemetry_records_total{source="syslog"})'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'No UniFi {{ $labels.source }} telemetry for 30m'
                      description: 'The gateway collector has counted no UniFi {{ $labels.source }} records for an hour, or none since it started (count connector count/unifi). Check the UniFi export settings (docs/logging.md, "UniFi gateway") and that otel.<DOMAIN> resolves to OTEL_LB_IP.'
                  - alert: HomelabClickHouseDown
                    expr: 'max by (chi, hostname) (chi_clickhouse_metric_fetch_errors{fetch_type="system.metrics"}) > 0 or absent(chi_clickhouse_metric_Uptime)'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{ $labels.chi }} is not answering the metrics exporter'
                      description: 'The clickhouse-operator metrics exporter has not read system.metrics from ClickHouse for 10m, so the log store is down or unreachable. `kubectl -n observability get chi` and the ClickHouse pod events.'
                  - alert: HomelabClickHouseRejectedInserts
                    expr: 'sum by (chi, hostname) (increase(chi_clickhouse_event_RejectedInserts[5m])) > 0'
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{ $labels.hostname }} rejects inserts (too many parts)'
                      description: 'ClickHouse refused inserts because a partition has too many active parts; merges are not keeping up with the batch rate. Raise the collector batch size or ClickHouse CPU.'
                  - alert: HomelabClickHouseTooManyParts
                    expr: 'max by (chi, hostname) (chi_clickhouse_metric_MaxPartCountForPartition) > 150'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{ $labels.hostname }} has {{ $value }} parts in one partition'
                      description: 'Inserts are throttled from 150 parts per partition and rejected from 300. Merges are behind; see HomelabClickHouseRejectedInserts.'
          # Synthetic probes (docs/runbooks/paperclip-request-path.md); target
          # is the probe name, e.g. paperclip-ingress vs paperclip-direct.
          homelab-probes:
            groups:
              - name: homelab-probes
                rules:
                  - alert: HomelabProbeFailing
                    expr: 'max by (target, instance) (probe_success) == 0'
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Probe {{ $labels.target }} fails ({{ $labels.instance }})'
                      description: '{{ $labels.instance }} has not answered 2xx for 2m. If only the -ingress probe fails the break is in DNS or Traefik, if -direct fails too it is the pod; docs/runbooks/paperclip-request-path.md.'
                  - alert: HomelabProbeSlow
                    expr: 'max by (target, instance) (probe_duration_seconds) > 2'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Probe {{ $labels.target }} takes {{ $value | humanizeDuration }}'
                      description: '{{ $labels.instance }} has taken more than 2 s for 10m; compare the -ingress and -direct probes to find the slow hop.'
          # Paperclip agents (docs/runbooks/paperclip-agents.md). Memory from
          # cAdvisor and kube-state-metrics; the rest from charts/paperclip's exporter.
          homelab-paperclip:
            groups:
              - name: homelab-paperclip
                rules:
                  - alert: PaperclipMemoryNearLimit
                    expr: 'max by (namespace, pod) (container_memory_working_set_bytes{namespace="paperclip", container="paperclip"}) / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="paperclip", container="paperclip", resource="memory"}) > 0.85'
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit'
                      description: 'Above 85 % for 5m. Agent runs are child processes of the pod, so reaching the limit kills runs or the whole server; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipMemoryNearLimit
                    expr: 'max by (namespace, pod) (container_memory_working_set_bytes{namespace="paperclip", container="paperclip"}) / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="paperclip", container="paperclip", resource="memory"}) > 0.95'
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Paperclip {{ $labels.pod }} is at its memory limit ({{ $value | humanizePercentage }})'
                      description: 'Above 95 % for 2m: the next allocation is OOM-killed. Pause agents now; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipOOMKilled
                    expr: 'increase(kube_pod_container_status_restarts_total{namespace="paperclip", container="paperclip"}[15m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{namespace="paperclip", container="paperclip", reason="OOMKilled"} == 1'
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip {{ $labels.pod }} was OOM-killed and restarted'
                      description: 'Every agent run in flight was lost with the process. docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipMetricsUnavailable
                    expr: 'min by (namespace) (paperclip_up) == 0 or min by (namespace) (up{job="paperclip-exporter"}) == 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'The Paperclip exporter cannot read the Paperclip API'
                      description: 'The agent alerts of this group are blind. The exporter log names the endpoint and HTTP status; 401/403 means the paperclip-exporter 1Password item is missing or its key was revoked.'
                  - alert: PaperclipAgentFailureRateHigh
                    expr: 'sum by (company_id, company) (paperclip_agent_runs_finished{status=~"failed|interrupted|timed_out"}) / sum by (company_id, company) (paperclip_agent_runs_finished) > 0.2 and sum by (company_id, company) (paperclip_agent_runs_finished) >= 5'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{ $value | humanizePercentage }} of agent runs in {{ $labels.company }} failed in the last hour'
                      description: 'More than 20 % of at least 5 runs finished in the last hour failed, were interrupted or timed out. paperclip_agent_runs_errors names the error codes; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipRecoveryRateBreached
                    expr: 'max by (company_id, company) (paperclip_recovery_rate_percent) and on (company_id, company) max by (company_id, company) (paperclip_recovery_breached) == 1'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip recovery rate in {{ $labels.company }} is {{ $value }} % this week'
                      description: 'Paperclip reports its recovery-observability threshold (paperclip_recovery_threshold_percent) breached for the current week. docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipPhantomAgentStuck
                    expr: 'max by (company_id, company) (paperclip_agents_phantom_running) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{ $value }} agents in {{ $labels.company }} report running without a live run'
                      description: 'Agents stuck in status running with no queued or running heartbeat run for 15m. docs/runbooks/paperclip-agents.md.'
          # Service mesh (docs/service-mesh.md). Metrics: charts/istio-config
          # monitors and kube-state-metrics. ztunnel and istio-cni must run on
          # every node or enrolled pods there lose their traffic.
          homelab-service-mesh:
            groups:
              - name: homelab-service-mesh
                rules:
                  - alert: HomelabIstiodDown
                    expr: 'absent(up{app="istiod"} == 1)'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'istiod is not running'
                      description: 'No istiod instance has answered the metrics scrape for 10m. Running workloads keep their last configuration, but new pods, certificates and policy changes wait for it. `kubectl -n istio-system get pods -l app=istiod`.'
                  - alert: HomelabMeshNodeAgentNotReady
                    expr: 'kube_daemonset_status_number_ready{namespace="istio-system",daemonset=~"ztunnel|istio-cni-node"} < kube_daemonset_status_desired_number_scheduled{namespace="istio-system",daemonset=~"ztunnel|istio-cni-node"}'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{ $labels.daemonset }} is not ready on every node'
                      description: '{{ $labels.daemonset }} has fewer ready pods than nodes for 15m. Pods of enrolled namespaces on the affected node cannot send or receive traffic. `kubectl -n istio-system get pods -o wide`.'
                  - alert: HomelabIstioXdsRejects
                    expr: 'sum(rate(pilot_total_xds_rejects[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Proxies reject the configuration istiod sends'
                      description: 'ztunnel or a waypoint has rejected xDS configuration for 15m, so it keeps running on stale config. `istioctl proxy-status` and the istiod logs name the resource.'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    # Use jqPathExpressions to handle multiple webhooks (more robust than jsonPointers)
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

