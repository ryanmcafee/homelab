# Source: addons/templates/istio.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: cni
    targetRevision: "1.31.1"
    helm:
      releaseName: istio-cni
      values: |
        profile: ambient
        cni:
          # Istio platform prerequisites: Talos keeps CNI binaries and
          # config at these host paths, and Cilium is the primary plugin.
          cniBinDir: /opt/cni/bin
          cniConfDir: /etc/cni/net.d
          chained: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

