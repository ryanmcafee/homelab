apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.9
    helm:
      releaseName: traefik-internal
      values: |
        # IngressClass configuration
        ingressClass:
          name: internal
          isDefaultClass: false

        deployment:
          replicas: 1

        service:
          type: NodePort
          spec:
            externalTrafficPolicy: Cluster

        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: internal
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: internal

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false

        logs:
          access:
            enabled: true
            format: json

        # The ServiceMonitor selects a dedicated metrics Service; the main
        # Service does not expose :9100. The API check would fail an offline render.
        metrics:
          prometheus:
            disableAPICheck: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true

        env:
          []

        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik-internal.homelab.local`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-internal-dashboard-tls

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

---
# Source: addons/templates/traefik-internal.yaml
# Config Application: deploys CRD-dependent resources (dashboard)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/traefik-internal-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # The dashboard hostname comes from this parent's values (configuration/
      # via the CMP in homelab) so the child's committed values files stay
      # PII-free. valuesObject overrides valueFiles in ArgoCD.
      valuesObject:
        dashboard:
          host: traefik-internal.homelab.local
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
