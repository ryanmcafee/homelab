            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false

        logs:
          access:
            enabled: true
            format: json
            fields:
              headers:
                defaultmode: drop
                names:
                  Traceparent: keep
                  User-Agent: keep
        tracing:
          sampleRate: 1
          otlp:
            enabled: true
            grpc:
              enabled: true
              endpoint: otel-collector-gateway.observability.svc.cluster.local:4317
              insecure: true

        # The ServiceMonitor selects a dedicated metrics Service; the main
        # Service does not expose :9100. The API check would fail an offline render.
        metrics:
          prometheus:
            disableAPICheck: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true

        env:
          []

        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik-internal.homelab.local`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-internal-dashboard-tls

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

---
# Source: addons/templates/traefik-internal.yaml
# Config Application: deploys CRD-dependent resources (dashboard)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/traefik-internal-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # The dashboard hostname comes from this parent's values (configuration/
      # via the CMP in homelab) so the child's committed values files stay
      # PII-free. valuesObject overrides valueFiles in ArgoCD.
      valuesObject:
        dashboard:
          host: traefik-internal.homelab.local
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
