# Source: addons/templates/grafana-config.yaml
# Grafana Config: deploys static PV+PVC for Grafana persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/grafana-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # The iSCSI portal comes from this parent's global values (configuration/
      # via the CMP in homelab) so the child's committed values stay PII-free.
      valuesObject:
        iscsi:
          portal: "127.0.0.1:3260"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

