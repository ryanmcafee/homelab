# Source: addons/templates/logging.yaml
# The chart's crdHook (a bitnami/kubectl:latest Job) is off: ArgoCD applies
# the CRDs from the chart's crds/ directory itself, server-side because the
# ClickHouseInstallation CRD is past the client-side-apply size limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.altinity.com
    chart: altinity-clickhouse-operator
    targetRevision: "0.27.3"
    helm:
      releaseName: clickhouse-operator
      values: |
        crdHook:
          enabled: false
        watchNamespaces:
          - observability
        operator:
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
        metrics:
          enabled: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          additionalLabels:
            grafana_dashboard: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

