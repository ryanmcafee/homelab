---
# Source: addons/templates/agent-readonly.yaml
# Read-only identity for agents (issue #261 item 18): ServiceAccount + token
# Secret bound to `view` and homelab-agent-readonly. No Secrets, no write verbs.
# Enabled in Kind too, where tests/e2e/agent-readonly proves the RBAC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-readonly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/agent-readonly
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # One source of truth for the namespace: the Namespace above.
      valuesObject:
        namespace: "agent-access"
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-access
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  # The token controller writes the token into the Secret; that is not drift.
  # Core kinds carry no `group: ""` (the API server drops it, which made the
  # addons parent report this Application OutOfSync forever).
  ignoreDifferences:
    - kind: Secret
      name: agent-readonly-token
      namespace: agent-access
      jsonPointers:
        - /data

---
# Source: addons/templates/blackbox-exporter.yaml
# Synthetic HTTP probes (docs/runbooks/paperclip-request-path.md): one
# ServiceMonitor per target, metrics probe_success / probe_duration_seconds
# labelled target=<name>; alerts in the homelab-probes group.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: "11.18.0"
    helm:
      releaseName: blackbox-exporter
      values: |
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
            # The ingress probe checks reachability, not the certificate
            # (HomelabCertificateExpiringSoon covers that; Kind's is self-signed).
            http_2xx_ingress:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                tls_config:
                  insecure_skip_verify: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        serviceMonitor:
          enabled: true
          defaults:
            interval: 15s
            scrapeTimeout: 12s
          targets:
            - module: http_2xx_ingress
              name: paperclip-ingress
              url: https://paperclip.homelab.local/api/health
            - module: http_2xx
              name: paperclip-direct
              url: http://paperclip.paperclip.svc.cluster.local:3100/api/health
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

---
# Source: addons/templates/cert-manager.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Sync wave 0: cert-manager must deploy before ClusterIssuer (wave 1) and other resources needing TLS
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.3
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: true
        global:
          leaderElection:
            namespace: cert-manager
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53,8.8.4.4:53
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        # ServiceMonitor for the controller metrics; the CRD comes from the
        # bootstrap chart's prometheus-operator-crds (wave -1), so it applies
        # here at wave 4 and kube-prometheus-stack (wave 9) discovers it. The
        # HomelabCertificateExpiringSoon rule reads
        # certmanager_certificate_expiration_timestamp_seconds.
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
        webhook:
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
        cainjector:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

---
# Source: addons/templates/cert-manager.yaml
# Config Application: deploys the OnePasswordItem for the Cloudflare API token.
# The OnePasswordItem CRD comes from 1password-operator in the bootstrap
# parent, which syncs in an earlier parent wave.
#
# Wave -1 puts this first inside addons. Wave ordering only sequences the
# apply, not the result: the 1Password operator creates the Secret
# asynchronously afterwards, so the ClusterIssuer at wave 1 can still be
# briefly unready. What -1 does guarantee is that the OnePasswordItem is never
# applied after its consumer, and that it does not share a wave with
# cert-manager, which would leave the ordering of the two up to ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/cert-manager-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# Source: addons/templates/cert-manager.yaml
# ClusterIssuer Application: deploys after cert-manager installs CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-cluster-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/cert-manager-cluster-issuer
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # Derived values (domain, ACME e-mail, DNS zones) come from this parent's
      # cert-manager values (configuration/ via the CMP in homelab) so the
      # child's committed values files stay PII-free. valuesObject overrides
      # valueFiles in ArgoCD.
      valuesObject:
        global:
          domain: homelab.local
        # Self-signed issuer under the same name where there is no public
        # domain (CERT_ISSUER=selfsigned).
        selfSigned:
          enabled: true
        letsencrypt:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: test@homelab.local
          dnsZones:
            - homelab.local
        cloudflare:
          email: test@homelab.local
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# Source: addons/templates/cilium.yaml
# Cilium CNI - Adopted, never installed, by ArgoCD
#
# homelab: Talos installs Cilium from inline manifests rendered with the same
# values (task render). Kind: scripts/localdev-kind.ts installs it with
# `helm upgrade --install` from charts/addons/values-localdev.yaml
# cilium.values before ArgoCD exists. In both cases this Application adopts
# the release: the values below are the ones the installer used (identical
# values → no diff), automated.prune is false and the Application carries no
# resources-finalizer (see the app-automated / app-finalizer exemption).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    homelab.local/policy-exempt: "app-automated,app-finalizer"
    homelab.local/policy-exempt-reason: "Cilium CNI is installed outside ArgoCD (Talos inline manifests in homelab, scripts/localdev-kind.ts in Kind). This Application only adopts it: it must not prune/self-heal resources the installer manages directly (app-automated), and it must NOT carry resources-finalizer.argocd.argoproj.io (app-finalizer) — deleting this Application must never cascade-delete the running CNI."
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.5
    helm:
      releaseName: cilium
      # Values must match what installed the release for an accurate diff
      # (cilium.values in the environment values file).
      values: |
        cni:
          exclusive: false
        hubble:
          enabled: false
        image:
          pullPolicy: IfNotPresent
        ipam:
          mode: kubernetes
        kubeProxyReplacement: false
        operator:
          replicas: 1
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        socketLB:
          hostNamespaceOnly: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Validate=false
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

  # Ignore all differences since we're just tracking, not managing
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    # Ignore auto-generated TLS secrets managed by Cilium (cilium-ca, hubble-*-certs).
    # No `group: ""` for core kinds: the API server drops the empty string, so
    # the live Application never matched the rendered one and the addons parent
    # stayed OutOfSync (bugs.md 2026-09-14).
    - kind: Secret
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels

---
