    argocd.argoproj.io/sync-wave: "6"
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #263: localdev renders addons/applications without the CMP domain-substitution stage (CLAUDE.md's CMP Architecture: localdev uses native Helm with values-localdev.yaml, no CMP), so the dashboard IngressRoute matchRule stays the checked-in values.yaml placeholder here; it is never resolved or used in localdev (services are reached via NodePort). Fix is to generate values-localdev.yaml from config; remove this exemption then. In homelab this hostname is correctly domain-derived by the two-stage config-export flow, so the exemption is scoped to localdev only."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.0
    helm:
      releaseName: traefik-internal
      values: |
        # IngressClass configuration
        ingressClass:
          name: internal
          isDefaultClass: false

        deployment:
          replicas: 2

        service:
          type: NodePort
          spec:
            externalTrafficPolicy: Cluster

        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: internal
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: internal

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false

        env:
          []

        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik-internal.example.com`)
            entryPoints:
              - websecure

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-internal
                app.kubernetes.io/name: traefik
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 3
          metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 80
                  type: Utilization
              type: Resource

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
---
# Source: addons/templates/traefik-internal.yaml
# Config Application: deploys CRD-dependent resources (dashboard)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/traefik-internal-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
