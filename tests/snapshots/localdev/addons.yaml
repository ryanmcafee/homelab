            clickhouse:
              endpoint: tcp://clickhouse-logs.observability.svc.cluster.local:9000?dial_timeout=10s
              database: otel
              username: otel
              password: ${env:CLICKHOUSE_PASSWORD}
              create_schema: true
              logs_table_name: otel_logs
              traces_table_name: otel_traces
              ttl: 2160h
              timeout: 10s
              sending_queue:
                queue_size: 1000
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s
          service:
            pipelines:
              logs:
                receivers: []
                processors:
                  - memory_limiter
                  - transform/service-name
