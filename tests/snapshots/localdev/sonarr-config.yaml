          containers:
            - name: policy
              image: "oven/bun:1.4.5-alpine"
              imagePullPolicy: IfNotPresent
              command: ["bun", "/scripts/arr-size-policy.ts"]
              env:
                - name: ARR_URL
                  value: "http://sonarr.media.svc.cluster.local:8989"
                - name: CONFIG_XML
                  value: /app-config/config.xml
                - name: DRY_RUN
                  value: "false"
                - name: MAX_EPISODE_GB
                  value: "10"
                - name: MAX_MB_PER_MINUTE
                  value: "170"
                - name: OVERSIZE_FORMAT_NAME
                  value: "Oversize"
                - name: OVERSIZE_FORMAT_SCORE
                  value: "-10000"
                - name: REPLACE_LIMIT
                  value: "5"
                - name: SEARCH_TIMEOUT_SECONDS
                  value: "300"
                - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
                  value: "0"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: app-config
                  mountPath: /app-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  cpu: 200m
                  memory: 192Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: sonarr-size-policy
            - name: app-config
              persistentVolumeClaim:
                claimName: "sonarr-config"
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
