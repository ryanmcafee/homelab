# Bans the configured release type in every quality profile (files/arr-release-policy.ts).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonarr-release-policy
  namespace: media
  labels:
    app.kubernetes.io/part-of: sonarr
    app.kubernetes.io/component: release-policy
spec:
  schedule: "41 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: sonarr
            app.kubernetes.io/component: release-policy
          annotations:
            checksum/script: 56ec33654014f7a6f45c7ed12f47c655ec56d64700fd0f8f671765c8e28f9c38
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # The app's config claim is ReadWriteOnce: share the node the app runs on.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: sonarr
                      app.kubernetes.io/name: sonarr
          containers:
            - name: policy
              image: "oven/bun:1.4.5-alpine"
              imagePullPolicy: IfNotPresent
              command: ["bun", "/scripts/arr-release-policy.ts"]
              env:
                - name: ARR_URL
                  value: "http://sonarr.media.svc.cluster.local:8989"
                - name: CONFIG_XML
                  value: /app-config/config.xml
                - name: DRY_RUN
                  value: "false"
                - name: BANNED_FORMAT_NAME
                  value: "Remux"
                - name: BANNED_TITLE_REGEX
                  value: "remux"
                - name: BANNED_QUALITY_REGEX
                  value: "remux"
                - name: BANNED_FORMAT_SCORE
                  value: "-10000"
                - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
                  value: "0"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: app-config
                  mountPath: /app-config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: sonarr-release-policy
            - name: app-config
              persistentVolumeClaim:
                claimName: "sonarr-config"
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi

