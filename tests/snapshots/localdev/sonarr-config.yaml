# Source: sonarr-config/templates/size-policy-cronjob.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-size-policy
  namespace: media
  labels:
    app.kubernetes.io/part-of: sonarr
    app.kubernetes.io/component: size-policy
data:
  arr-size-policy.ts: |-
    #!/usr/bin/env bun
    /**
     * arr-size-policy.ts
     *
     * Caps the size of every Sonarr episode (docs/runbooks/arr-size-policy.md).
     * Runs from a ConfigMap in the stock oven/bun image next to
     * arr-import-sweep.ts, whose API client it reuses.
     *
     * 1. Caps every quality definition at MAX_MB_PER_MINUTE (Sonarr multiplies it
     *    by the runtime of every episode in a release, so season packs are capped
     *    per episode too).
     * 2. Ensures a custom format OVERSIZE_FORMAT_NAME matching single-episode
     *    releases larger than MAX_EPISODE_GB and scores it OVERSIZE_FORMAT_SCORE
     *    in every quality profile, a hard cap whatever the episode runtime.
     * 3. Removes and blocklists queued downloads larger than the cap per episode;
     *    Sonarr then searches for another release.
     * 4. Replaces up to REPLACE_LIMIT episode files larger than the cap per run:
     *    an interactive search must return a release within the cap that only the
     *    existing file blocks, then the file is deleted and the episode searched.
     *
     * Idempotent: a compliant app gets no write. --dry-run reports and writes nothing.
     *
     * Environment (flags override):
     *   ARR_URL                 e.g. http://sonarr.media.svc.cluster.local:8989 (--url)
     *   ARR_API_KEY             API key; else read from CONFIG_XML (<ApiKey>)
     *   CONFIG_XML              default /app-config/config.xml
     *   DRY_RUN                 true: report, change nothing (--dry-run)
     *   MAX_EPISODE_GB          default 10 (Sonarr's GB: 1024^3 bytes)
     *   MAX_MB_PER_MINUTE       default 170 (10 GB for a 60-minute episode)
     *   OVERSIZE_FORMAT_NAME    default Oversize
     *   OVERSIZE_FORMAT_SCORE   default -10000; must be negative
     *   REPLACE_LIMIT           default 5 files per run; 0 replaces nothing
     *   SEARCH_TIMEOUT_SECONDS  default 300, per interactive search
     */
    
    import { readFileSync } from "node:fs";
    import { Client, log } from "./arr-import-sweep.ts";
    
    export interface SizePolicy {
      maxEpisodeGB: number;
      maxMbPerMinute: number;
      formatName: string;
      score: number;
      replaceLimit: number;
      searchTimeoutMs: number;
    }
    
    export interface SizeConfig {
      url: string;
      apiKey: string;
      dryRun: boolean;
      policy: SizePolicy;
    }
    
    export interface QualityDefinition {
      id: number;
      title: string;
      minSize: number | null;
      maxSize: number | null;
      preferredSize: number | null;
    }
    
    export interface QueueRecord {
      id: number;
      downloadId: string;
      episodeId: number;
      title: string;
      size: number;
    }
    
    export interface EpisodeFile {
      id: number;
      seriesId: number;
      relativePath: string;
      size: number;
    }
    
    export interface Release {
      guid: string;
      title: string;
      size: number;
      fullSeason: boolean;
      rejections: string[];
    }
    
    const GIB = 1024 ** 3;
    const SIZE_SPEC = "SizeSpecification";
    const RELEASE_TYPE_SPEC = "ReleaseTypeSpecification";
    const SINGLE_EPISODE = 1;
    const SIZE_SPEC_MAX_GB = 1000;
    
    const HELP = `Usage: bun arr-size-policy.ts [--url URL] [--dry-run]
    
    Caps Sonarr episodes at MAX_EPISODE_GB: caps every quality definition per
    minute, rejects larger single-episode releases with a custom format, blocklists
    larger queued downloads and replaces up to REPLACE_LIMIT larger episode files
    for which a release within the cap exists. --dry-run reports the changes and
    writes nothing. Environment: see the header of this file.`;
    
    function positive(
      env: Record<string, string | undefined>,
      name: string,
      fallback: string,
      integer: boolean,
      allowZero = false,
    ): number {
      const raw = env[name] || fallback;
      const value = Number(raw);
      const valid =
        Number.isFinite(value) &&
        (allowZero ? value >= 0 : value > 0) &&
        (!integer || Number.isInteger(value));
      if (!valid) {
        throw new Error(
          `${name} must be a ${allowZero ? "non-negative" : "positive"} ${integer ? "integer" : "number"}, got "${raw}"`,
        );
      }
      return value;
    }
    
    export function readSizeConfig(
      argv: string[],
      env: Record<string, string | undefined>,
      readFile: (path: string) => string,
    ): SizeConfig | "help" {
      let dryRun = env.DRY_RUN === "true";
      let url = env.ARR_URL ?? "";
      for (let i = 0; i < argv.length; i++) {
        const arg = argv[i];
        if (arg === "--help" || arg === "-h") return "help";
        if (arg === "--dry-run") {
          dryRun = true;
        } else if (arg === "--url" && argv[i + 1] !== undefined) {
          url = argv[++i] ?? "";
        } else {
          throw new Error(`unknown or incomplete argument ${arg} (see --help)`);
        }
      }
      if (!url) throw new Error("ARR_URL/--url is required");
      let apiKey = env.ARR_API_KEY ?? "";
      if (!apiKey) {
        const configXml = env.CONFIG_XML || "/app-config/config.xml";
        apiKey = /<ApiKey>([^<]+)<\/ApiKey>/.exec(readFile(configXml))?.[1] ?? "";
        if (!apiKey)
          throw new Error(`no ARR_API_KEY and no <ApiKey> in ${configXml}`);
      }
      const rawScore = env.OVERSIZE_FORMAT_SCORE || "-10000";
      const score = Number(rawScore);
      if (!Number.isInteger(score) || score >= 0) {
        throw new Error(
          `OVERSIZE_FORMAT_SCORE must be a negative integer, got "${rawScore}"`,
        );
      }
      const maxEpisodeGB = positive(env, "MAX_EPISODE_GB", "10", false);
      if (maxEpisodeGB >= SIZE_SPEC_MAX_GB) {
        throw new Error(`MAX_EPISODE_GB must be below ${SIZE_SPEC_MAX_GB}`);
      }
      return {
        url: url.replace(/\/+$/, ""),
        apiKey,
        dryRun,
        policy: {
          maxEpisodeGB,
          maxMbPerMinute: positive(env, "MAX_MB_PER_MINUTE", "170", false),
          formatName: env.OVERSIZE_FORMAT_NAME || "Oversize",
          score,
          replaceLimit: positive(env, "REPLACE_LIMIT", "5", true, true),
          searchTimeoutMs:
            positive(env, "SEARCH_TIMEOUT_SECONDS", "300", true) * 1000,
        },
      };
    }
    
    function isRecord(value: unknown): value is Record<string, unknown> {
      return typeof value === "object" && value !== null && !Array.isArray(value);
    }
    
    function records(value: unknown): Record<string, unknown>[] {
      return Array.isArray(value) ? value.filter(isRecord) : [];
    }
    
    function num(value: unknown, what: string): number {
      if (typeof value !== "number") throw new Error(`${what} is not a number`);
      return value;
    }
    
    const optionalNum = (value: unknown): number | null =>
      typeof value === "number" ? value : null;
    
    export function parseDefinition(
      raw: Record<string, unknown>,
    ): QualityDefinition & Record<string, unknown> {
      return {
        ...raw,
        id: num(raw.id, "qualitydefinition.id"),
        title: String(raw.title ?? ""),
        minSize: optionalNum(raw.minSize),
        maxSize: optionalNum(raw.maxSize),
        preferredSize: optionalNum(raw.preferredSize),
      };
    }
    
    /** The definition with maxSize capped and a line per change; throws when minSize exceeds the cap. */
    export function capDefinition<T extends QualityDefinition>(
      raw: T,
      cap: number,
    ): { definition: T; changes: string[] } {
      const definition = structuredClone(raw);
      const changes: string[] = [];
      if (definition.minSize !== null && definition.minSize > cap) {
        throw new Error(
          `quality ${definition.title} minimum ${definition.minSize} MB/min exceeds the cap ${cap}`,
        );
      }
      if (definition.maxSize === null || definition.maxSize > cap) {
        changes.push(`max ${definition.maxSize ?? "unlimited"} -> ${cap} MB/min`);
        definition.maxSize = cap;
      }
      if (definition.preferredSize !== null && definition.preferredSize > cap) {
        changes.push(`preferred ${definition.preferredSize} -> ${cap} MB/min`);
        definition.preferredSize = cap;
      }
      return { definition, changes };
    }
    
    function fieldValue(spec: Record<string, unknown>, name: string): unknown {
      return records(spec.fields).find((field) => field.name === name)?.value;
    }
    
    /** True when the format is exactly the size and single-episode specifications of the policy. */
    export function formatMatches(
      format: Record<string, unknown>,
      policy: SizePolicy,
    ): boolean {
      const specs = records(format.specifications);
      const size = specs.find((spec) => spec.implementation === SIZE_SPEC);
      const type = specs.find((spec) => spec.implementation === RELEASE_TYPE_SPEC);
      const strict = (spec: Record<string, unknown> | undefined) =>
        spec?.negate === false && spec.required === true;
      return (
        specs.length === 2 &&
        strict(size) &&
        strict(type) &&
        size !== undefined &&
        type !== undefined &&
        fieldValue(size, "min") === policy.maxEpisodeGB &&
        fieldValue(size, "max") === SIZE_SPEC_MAX_GB &&
        fieldValue(type, "value") === SINGLE_EPISODE
      );
    }
    
    export function desiredSpecifications(
      policy: SizePolicy,
    ): Record<string, unknown>[] {
      return [
        {
          name: `Larger than ${policy.maxEpisodeGB} GB`,
          implementation: SIZE_SPEC,
          negate: false,
          required: true,
          fields: [
            { name: "min", value: policy.maxEpisodeGB },
            { name: "max", value: SIZE_SPEC_MAX_GB },
          ],
        },
        {
          name: "Single episode",
          implementation: RELEASE_TYPE_SPEC,
          negate: false,
          required: true,
          fields: [{ name: "value", value: SINGLE_EPISODE }],
        },
      ];
    }
    
    /** The profile with the format scored and a line per change. */
    export function scoreProfile<T extends Record<string, unknown>>(
      raw: T,
      formatId: number,
      policy: SizePolicy,
    ): { profile: T; changes: string[] } {
      const profile = structuredClone(raw);
      const formatItems = records(profile.formatItems);
      const existing = formatItems.find((item) => item.format === formatId);
      if (existing?.score === policy.score) return { profile, changes: [] };
      const was = existing ? String(existing.score) : "unset";
      const next = existing
        ? formatItems.map((item) =>
            item === existing ? { ...item, score: policy.score } : item,
          )
        : [
            ...formatItems,
            { format: formatId, name: policy.formatName, score: policy.score },
          ];
      return {
        profile: { ...profile, formatItems: next },
        changes: [`score format ${policy.formatName} ${policy.score} (was ${was})`],
      };
    }
    
    export const capBytes = (policy: SizePolicy, episodes = 1): number =>
      policy.maxEpisodeGB * GIB * Math.max(1, episodes);
    
    export function parseQueue(raw: unknown): QueueRecord[] {
      const list = isRecord(raw) ? records(raw.records) : [];
      return list.map((record) => ({
        id: num(record.id, "queue.id"),
        downloadId: String(record.downloadId ?? record.id),
        episodeId: typeof record.episodeId === "number" ? record.episodeId : -1,
        title: String(record.title ?? ""),
        size: typeof record.size === "number" ? record.size : 0,
      }));
    }
    
    /** One queue record per download whose size per episode exceeds the cap. */
    export function oversizedDownloads(
      queue: QueueRecord[],
      policy: SizePolicy,
    ): QueueRecord[] {
      const byDownload = Map.groupBy(queue, (record) => record.downloadId);
      return [...byDownload.values()].flatMap((group) => {
        const first = group[0];
        return first && first.size > capBytes(policy, group.length) ? [first] : [];
      });
    }
    
    export function parseEpisodeFile(raw: Record<string, unknown>): EpisodeFile {
      return {
        id: num(raw.id, "episodefile.id"),
        seriesId: num(raw.seriesId, "episodefile.seriesId"),
        relativePath: String(raw.relativePath ?? ""),
        size: num(raw.size, "episodefile.size"),
      };
    }
    
    export function parseRelease(raw: Record<string, unknown>): Release {
      return {
        guid: String(raw.guid ?? ""),
        title: String(raw.title ?? ""),
        size: typeof raw.size === "number" ? raw.size : 0,
        fullSeason: raw.fullSeason === true,
        rejections: Array.isArray(raw.rejections) ? raw.rejections.map(String) : [],
      };
    }
    
    const EXISTING_FILE = /^Existing file/i;
    
    /**
     * The largest release within the cap that only the existing file rejects:
     * once that file is deleted, Sonarr's own search can grab it.
     */
    export function replacementFor(
      releases: Release[],
      policy: SizePolicy,
      episodes: number,
    ): Release | undefined {
      const cap = capBytes(policy, episodes);
      return releases
        .filter(
          (release) =>
            !release.fullSeason &&
            release.size > 0 &&
            release.size <= cap &&
            release.rejections.every((reason) => EXISTING_FILE.test(reason)),
        )
        .sort((a, b) => b.size - a.size)[0];
    }
    
    const gb = (bytes: number): string => `${(bytes / GIB).toFixed(1)} GB`;
    
    const message = (error: unknown): string =>
      error instanceof Error ? error.message : String(error);
    
    interface Tally {
      updated: number;
      failed: number;
    }
    
    async function enforceDefinitions(
      client: Client,
      config: SizeConfig,
      tally: Tally,
    ): Promise<void> {
      const definitions = records(
        await client.request("GET", "/qualitydefinition"),
      ).map(parseDefinition);
      for (const raw of definitions) {
        try {
          const { definition, changes } = capDefinition(
            raw,
            config.policy.maxMbPerMinute,
          );
          if (changes.length === 0) continue;
          const summary = `quality ${definition.title}: ${changes.join("; ")}`;
          if (config.dryRun) {
            log("INFO", `would update ${summary}`);
            continue;
          }
          await client.request(
            "PUT",
            `/qualitydefinition/${definition.id}`,
            definition,
          );
          tally.updated++;
          log("OK", `updated ${summary}`);
        } catch (error) {
          tally.failed++;
          log("ERROR", message(error));
        }
      }
    }
    
    async function ensureFormat(
      client: Client,
      config: SizeConfig,
    ): Promise<number | null> {
      const { policy, dryRun } = config;
      const formats = records(await client.request("GET", "/customformat"));
      const current = formats.find((format) => format.name === policy.formatName);
      if (current && formatMatches(current, policy)) {
        return num(current.id, "customformat.id");
      }
      const verb = current ? "update" : "create";
      const what = `custom format ${policy.formatName} (single episode > ${policy.maxEpisodeGB} GB)`;
      if (dryRun) {
        log("INFO", `would ${verb} ${what}`);
        return current ? num(current.id, "customformat.id") : null;
      }
      const body = {
        ...(current ?? { includeCustomFormatWhenRenaming: false }),
        name: policy.formatName,
        specifications: desiredSpecifications(policy),
      };
      const saved = current
        ? await client.request(
            "PUT",
            `/customformat/${num(current.id, "customformat.id")}`,
            body,
          )
        : await client.request("POST", "/customformat", body);
      if (!isRecord(saved))
        throw new Error(`${verb} custom format returned no object`);
      log("OK", `${verb}d ${what}`);
      return num(saved.id, "customformat.id");
    }
    
    async function enforceProfiles(
      client: Client,
      config: SizeConfig,
      formatId: number,
      tally: Tally,
    ): Promise<void> {
      const profiles = records(await client.request("GET", "/qualityprofile"));
      for (const raw of profiles) {
        const { profile, changes } = scoreProfile(raw, formatId, config.policy);
        if (changes.length === 0) continue;
        const summary = `profile ${String(profile.name)}: ${changes.join("; ")}`;
        if (config.dryRun) {
          log("INFO", `would update ${summary}`);
          continue;
        }
        try {
          await client.request(
            "PUT",
            `/qualityprofile/${num(profile.id, "profile.id")}`,
            profile,
          );
          tally.updated++;
          log("OK", `updated ${summary}`);
        } catch (error) {
          tally.failed++;
          log("ERROR", `profile ${String(raw.name)}: ${message(error)}`);
        }
      }
    }
    
    async function enforceQueue(
      client: Client,
      config: SizeConfig,
      queue: QueueRecord[],
      tally: Tally,
    ): Promise<void> {
      for (const record of oversizedDownloads(queue, config.policy)) {
        const summary = `queued ${record.title} (${gb(record.size)})`;
        if (config.dryRun) {
          log("INFO", `would remove and blocklist ${summary}`);
          continue;
        }
        try {
          await client.request(
            "DELETE",
            `/queue/${record.id}?removeFromClient=true&blocklist=true&skipRedownload=false`,
            undefined,
            { once: true },
          );
          tally.updated++;
          log("OK", `removed and blocklisted ${summary}`);
        } catch (error) {
          tally.failed++;
          log("ERROR", `${summary}: ${message(error)}`);
        }
      }
    }
    
    async function searchReleases(
      config: SizeConfig,
      fetcher: typeof fetch,
      episodeId: number,
    ): Promise<Release[]> {
      const response = await fetcher(
        `${config.url}/api/v3/release?episodeId=${episodeId}`,
        {
          headers: { "X-Api-Key": config.apiKey },
          signal: AbortSignal.timeout(config.policy.searchTimeoutMs),
        },
      );
      if (!response.ok) {
        throw new Error(
          `GET /release?episodeId=${episodeId} failed: HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`,
        );
      }
      return records(await response.json()).map(parseRelease);
    }
    
    async function oversizedFiles(
      client: Client,
      policy: SizePolicy,
    ): Promise<EpisodeFile[]> {
      const series = records(await client.request("GET", "/series")).filter(
        (entry) =>
          isRecord(entry.statistics) &&
          typeof entry.statistics.episodeFileCount === "number" &&
          entry.statistics.episodeFileCount > 0,
      );
      const files: EpisodeFile[] = [];
      for (const entry of series) {
        const id = num(entry.id, "series.id");
        const list = records(
          await client.request("GET", `/episodefile?seriesId=${id}`),
        ).map(parseEpisodeFile);
        files.push(...list.filter((file) => file.size > capBytes(policy)));
      }
      return files.sort((a, b) => b.size - a.size);
    }
    
    async function replaceFiles(
      client: Client,
      config: SizeConfig,
      fetcher: typeof fetch,
      queuedEpisodes: Set<number>,
      tally: Tally,
    ): Promise<void> {
      const { policy, dryRun } = config;
      const files = await oversizedFiles(client, policy);
      log(
        "INFO",
        `${files.length} episode files larger than ${policy.maxEpisodeGB} GB`,
      );
      const episodesBySeries = new Map<number, Record<string, unknown>[]>();
      let searched = 0;
      for (const file of files) {
        if (searched >= policy.replaceLimit) break;
        const name = `${file.relativePath} (${gb(file.size)})`;
        try {
          let episodes = episodesBySeries.get(file.seriesId);
          if (!episodes) {
            episodes = records(
              await client.request("GET", `/episode?seriesId=${file.seriesId}`),
            );
            episodesBySeries.set(file.seriesId, episodes);
          }
          const episodeIds = episodes
            .filter((episode) => episode.episodeFileId === file.id)
            .map((episode) => num(episode.id, "episode.id"));
          const first = episodeIds[0];
          if (first === undefined) {
            log("WARN", `${name}: no episode references this file, skipped`);
            continue;
          }
          if (file.size <= capBytes(policy, episodeIds.length)) continue;
          if (episodeIds.some((id) => queuedEpisodes.has(id))) {
            log("INFO", `${name}: a download is queued, skipped`);
            continue;
          }
          searched++;
          const release = replacementFor(
            await searchReleases(config, fetcher, first),
            policy,
            episodeIds.length,
          );
          if (!release) {
            log("WARN", `${name}: no release within the cap, file kept`);
            continue;
          }
          const plan = `${name} with a search (e.g. ${release.title}, ${gb(release.size)})`;
          if (dryRun) {
            log("INFO", `would replace ${plan}`);
            continue;
          }
          await client.request("DELETE", `/episodefile/${file.id}`, undefined, {
            once: true,
          });
          await client.request(
            "POST",
            "/command",
            { name: "EpisodeSearch", episodeIds },
            { once: true },
          );
          tally.updated++;
          log("OK", `replacing ${plan}`);
        } catch (error) {
          tally.failed++;
          log("ERROR", `${name}: ${message(error)}`);
        }
      }
    }
    
    export async function enforce(
      config: SizeConfig,
      fetcher: typeof fetch = fetch,
    ): Promise<number> {
      const client = new Client(
        `${config.url}/api/v3`,
        { "X-Api-Key": config.apiKey },
        fetcher,
      );
      const tally: Tally = { updated: 0, failed: 0 };
      await enforceDefinitions(client, config, tally);
      const formatId = await ensureFormat(client, config);
      await enforceProfiles(client, config, formatId ?? -1, tally);
      const queue = parseQueue(
        await client.request(
          "GET",
          "/queue?page=1&pageSize=1000&includeUnknownSeriesItems=false",
        ),
      );
      await enforceQueue(client, config, queue, tally);
      if (config.policy.replaceLimit > 0) {
        await replaceFiles(
          client,
          config,
          fetcher,
          new Set(queue.map((record) => record.episodeId)),
          tally,
        );
      }
      log(
        tally.failed ? "ERROR" : "OK",
        `done: ${tally.updated} changes, ${tally.failed} failed${config.dryRun ? " (dry run)" : ""}`,
      );
      return tally.failed > 0 ? 1 : 0;
    }
    
    export async function main(
      argv: string[],
      env: Record<string, string | undefined>,
      fetcher: typeof fetch = fetch,
    ): Promise<number> {
      try {
        const config = readSizeConfig(argv, env, (path) =>
          readFileSync(path, "utf8"),
        );
        if (config === "help") {
          process.stdout.write(`${HELP}\n`);
          return 0;
        }
        return await enforce(config, fetcher);
      } catch (error) {
        log("ERROR", message(error));
        return 1;
      }
    }
    
    if (import.meta.main) {
      process.exit(await main(Bun.argv.slice(2), process.env));
    }
    
  arr-import-sweep.ts: |-
    #!/usr/bin/env bun
    /**
     * arr-import-sweep.ts
     *
     * Imports the releases Sonarr or Radarr left in a completed downloads folder
     * (docs/runbooks/arr-import-sweep.md). Runs from a ConfigMap in the stock
     * oven/bun image (charts/sonarr-config, charts/radarr-config), so it has no
     * dependencies beyond Bun itself; the two chart copies are identical.
     *
     * 1. Automatic pass: one DownloadedEpisodesScan / DownloadedMoviesScan per entry
     *    (importMode Move). The app treats a scan path as a single release.
     * 2. Match pass, for every entry still there: parse the release name with the
     *    app's /api/v3/parse, score each library series/movie on title similarity,
     *    year, TMDb search results, grab history and episode existence, and accept
     *    only a single candidate above MIN_SCORE that leads the next by MIN_MARGIN.
     * 3. ManualImport (move) of each file the app lists for the folder, only into
     *    monitored episodes/movies that have no file, with a quality the profile
     *    allows and a custom format score at or above the profile minimum. Upgrades
     *    and every other rejection stay the app's decision: the folder is left.
     * 4. REMOVE_NON_ENGLISH: a matched release whose languages (the app's parse of
     *    the name rewritten to the matched title) are known and exclude English is
     *    blocklisted (queue removal, else its grab marked failed) and its folder
     *    deleted from IMPORT_PATH. Unknown languages are never removed.
     *
     * API calls retry connection errors, 429 and 5xx with backoff; a command whose
     * POST or poll was lost is looked up (or its effect checked) before resending.
     * --dry-run sends no POST and deletes nothing.
     *
     * Environment (flags override):
     *   ARR_APP            sonarr | radarr                      (--app)
     *   ARR_URL            e.g. http://sonarr.media.svc.cluster.local:8989 (--url)
     *   IMPORT_PATH        e.g. /downloads/completed/tv          (--path)
     *   ARR_API_KEY        API key; else read from CONFIG_XML (<ApiKey>)
     *   CONFIG_XML         default /app-config/config.xml
     *   TMDB_API_KEY       TMDb v3 key or v4 read token; optional, the TMDb signal is skipped without it
     *   DRY_RUN            true: report decisions, change nothing (--dry-run)
     *   TIMEOUT_SECONDS    whole run (default 3000)
     *   POLL_SECONDS       command polling interval (default 2)
     *   MIN_SCORE          default 60
     *   MIN_MARGIN         default 20
     *   HISTORY_RECORDS    newest grab history records read (default 2000)
     *   REMOVE_NON_ENGLISH true: blocklist and delete non-English releases (--remove-non-english)
     *   RETRY_ATTEMPTS     attempts per API call (default 5)
     *   RETRY_DELAY_SECONDS first backoff, doubled per attempt (default 8: 8+16+32+64 s)
     */
    
    import { lstatSync, readFileSync, realpathSync, rmSync } from "node:fs";
    import { basename, dirname } from "node:path";
    
    export type App = "sonarr" | "radarr";
    
    export interface Config {
      app: App;
      url: string;
      importPath: string;
      apiKey: string;
      tmdbKey: string;
      dryRun: boolean;
      timeoutSeconds: number;
      pollSeconds: number;
      minScore: number;
      minMargin: number;
      historyRecords: number;
      only: string;
      removeNonEnglish: boolean;
      retryAttempts: number;
      retryDelaySeconds: number;
    }
    
    export interface ParsedRelease {
      title: string;
      year: number;
      season: number | null;
      episodes: number[];
      fullSeason: boolean;
      appMatchId: number | null;
    }
    
    export interface LibraryItem {
      id: number;
      title: string;
      year: number;
      titles: string[];
      tmdbId: number;
      tvdbId: number;
      monitored: boolean;
      hasFile: boolean;
      qualityProfileId: number;
    }
    
    export interface Episode {
      id: number;
      seasonNumber: number;
      episodeNumber: number;
      hasFile: boolean;
      monitored: boolean;
      airYear: number;
    }
    
    export interface Signals {
      tmdbIds: number[];
      tvdbIds: number[];
      historyIds: Set<number>;
      episodes?: Map<number, Episode[]>;
      movies?: boolean;
    }
    
    export interface Scored {
      item: LibraryItem;
      score: number;
      reasons: string[];
    }
    
    export type Decision =
      | { kind: "match"; best: Scored; candidates: Scored[] }
      | { kind: "ambiguous"; candidates: Scored[]; why: string };
    
    const COLORS = {
      INFO: "\x1b[36m",
      OK: "\x1b[32m",
      WARN: "\x1b[33m",
      ERROR: "\x1b[31m",
    };
    const RESET = "\x1b[0m";
    
    export function log(level: keyof typeof COLORS, message: string): void {
      const line = `${new Date().toISOString()} ${COLORS[level]}${level}${RESET} ${message}\n`;
      (level === "ERROR" ? process.stderr : process.stdout).write(line);
    }
    
    const HELP = `Usage: bun arr-import-sweep.ts [--app sonarr|radarr] [--url URL] [--path DIR] [--only TEXT] [--remove-non-english] [--dry-run]
    
    Imports what Sonarr/Radarr left in a completed downloads folder: an automatic
    scan per entry, then a scored library match and a ManualImport (move) for what
    the scan rejected as unknown. --remove-non-english blocklists and deletes
    matched releases whose known languages exclude English. --dry-run reports every
    decision, sends no POST and deletes nothing. --only limits the run to entries
    whose name contains TEXT. Environment: see the header of this file.`;
    
    export function readConfig(
      argv: string[],
      env: Record<string, string | undefined>,
      readFile: (path: string) => string,
    ): Config | "help" {
      const flags = new Map<string, string>();
      let dryRun = env.DRY_RUN === "true";
      let removeNonEnglish = env.REMOVE_NON_ENGLISH === "true";
      for (let i = 0; i < argv.length; i++) {
        const arg = argv[i]!;
        if (arg === "--help" || arg === "-h") return "help";
        if (arg === "--dry-run") {
          dryRun = true;
          continue;
        }
        if (arg === "--remove-non-english") {
          removeNonEnglish = true;
          continue;
        }
        const name = arg.replace(/^--/, "");
        if (!["app", "url", "path", "only"].includes(name) || arg === name) {
          throw new Error(`unknown argument ${arg} (see --help)`);
        }
        const value = argv[++i];
        if (value === undefined) throw new Error(`${arg} needs a value`);
        flags.set(name, value);
      }
      const app = flags.get("app") ?? env.ARR_APP ?? "";
      if (app !== "sonarr" && app !== "radarr") {
        throw new Error(`ARR_APP/--app must be sonarr or radarr, got "${app}"`);
      }
      const url = flags.get("url") ?? env.ARR_URL ?? "";
      const importPath = flags.get("path") ?? env.IMPORT_PATH ?? "";
      if (!url) throw new Error("ARR_URL/--url is required");
      if (!importPath) throw new Error("IMPORT_PATH/--path is required");
      let apiKey = env.ARR_API_KEY ?? "";
      if (!apiKey) {
        const configXml = env.CONFIG_XML || "/app-config/config.xml";
        apiKey = /<ApiKey>([^<]+)<\/ApiKey>/.exec(readFile(configXml))?.[1] ?? "";
        if (!apiKey)
          throw new Error(`no ARR_API_KEY and no <ApiKey> in ${configXml}`);
      }
      const num = (name: string, fallback: number): number => {
        const raw = env[name];
        if (raw === undefined || raw === "") return fallback;
        const value = Number(raw);
        if (!Number.isFinite(value) || value < 0) {
          throw new Error(`${name} must be a non-negative number, got "${raw}"`);
        }
        return value;
      };
      return {
        app,
        url: url.replace(/\/+$/, ""),
        importPath: importPath.replace(/\/+$/, ""),
        apiKey,
        tmdbKey: env.TMDB_API_KEY ?? "",
        dryRun,
        timeoutSeconds: num("TIMEOUT_SECONDS", 3000),
        pollSeconds: num("POLL_SECONDS", 2),
        minScore: num("MIN_SCORE", 60),
        minMargin: num("MIN_MARGIN", 20),
        historyRecords: num("HISTORY_RECORDS", 2000),
        only: flags.get("only") ?? "",
        removeNonEnglish,
        retryAttempts: Math.max(1, num("RETRY_ATTEMPTS", 5)),
        retryDelaySeconds: num("RETRY_DELAY_SECONDS", 8),
      };
    }
    
    /** Lowercase, ASCII, words only, without a trailing "(year)" or a leading "the". */
    export function normalizeTitle(title: string): string {
      return title
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\(\d{4}\)\s*$/, "")
        .replace(/&/g, " and ")
        .replace(/['\u2019]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/^the /, "");
    }
    
    function bigrams(text: string): Map<string, number> {
      const grams = new Map<string, number>();
      const compact = text.replace(/ /g, "");
      for (let i = 0; i < compact.length - 1; i++) {
        const gram = compact.slice(i, i + 2);
        grams.set(gram, (grams.get(gram) ?? 0) + 1);
      }
      return grams;
    }
    
    /** Dice coefficient on character bigrams of the normalized titles, 1 when equal. */
    export function titleSimilarity(a: string, b: string): number {
      const left = normalizeTitle(a);
      const right = normalizeTitle(b);
      if (!left || !right) return 0;
      if (left === right) return 1;
      const leftGrams = bigrams(left);
      const rightGrams = bigrams(right);
      let overlap = 0;
      let total = 0;
      for (const count of leftGrams.values()) total += count;
      for (const count of rightGrams.values()) total += count;
      for (const [gram, count] of leftGrams) {
        overlap += Math.min(count, rightGrams.get(gram) ?? 0);
      }
      return total === 0 ? 0 : (2 * overlap) / total;
    }
    
    /** Scores every candidate; reasons explain each score in the log. */
    /** The library episodes a release names, or [] when any of them does not exist. */
    export function targetEpisodes(
      release: ParsedRelease,
      episodes: Episode[],
    ): Episode[] {
      if (release.season === null) return [];
      if (release.fullSeason) {
        return episodes.filter((e) => e.seasonNumber === release.season);
      }
      const found = release.episodes.map((n) =>
        episodes.find(
          (e) => e.seasonNumber === release.season && e.episodeNumber === n,
        ),
      );
      return found.length > 0 && found.every((e) => e !== undefined)
        ? found.filter((e): e is Episode => e !== undefined)
        : [];
    }
    
    /**
     * A movie year must match within one year. A series release year is either the
     * series' first year or the year its episodes aired, so it only disqualifies
     * when it matches neither (targets null: episodes not loaded yet).
     */
    export function yearScore(
      year: number,
      item: LibraryItem,
      movie: boolean,
      targets: Episode[] | null,
    ): { score: number; reason: string } {
      const gap = Math.abs(year - item.year);
      if (gap === 0) return { score: 20, reason: "year" };
      if (movie) {
        return gap === 1
          ? { score: 5, reason: "year+-1" }
          : { score: -100, reason: `year ${item.year} != ${year}` };
      }
      if (targets === null) {
        return year > item.year
          ? { score: 0, reason: "year after first air" }
          : { score: -100, reason: `year ${year} before ${item.year}` };
      }
      const aired = targets.some(
        (e) => e.airYear > 0 && Math.abs(e.airYear - year) <= 1,
      );
      return aired
        ? { score: 10, reason: "year matches airing" }
        : {
            score: -100,
            reason: `year ${year} matches neither ${item.year} nor the airing`,
          };
    }
    
    export function scoreCandidates(
      release: ParsedRelease,
      library: LibraryItem[],
      signals: Signals,
    ): Scored[] {
      const scored: Scored[] = [];
      for (const item of library) {
        const similarity = Math.max(
          ...item.titles.map((title) => titleSimilarity(release.title, title)),
        );
        const inTmdb =
          (item.tmdbId > 0 && signals.tmdbIds.includes(item.tmdbId)) ||
          (item.tvdbId > 0 && signals.tvdbIds.includes(item.tvdbId));
        const inHistory = signals.historyIds.has(item.id);
        const appMatch = release.appMatchId === item.id;
        if (similarity < 0.5 && !inTmdb && !inHistory && !appMatch) continue;
    
        const reasons = [`title ${similarity.toFixed(2)}`];
        let score = 40 * similarity;
        const episodes = signals.episodes?.get(item.id);
        const targets = episodes ? targetEpisodes(release, episodes) : null;
        if (release.year > 0) {
          const year = yearScore(
            release.year,
            item,
            signals.movies === true,
            targets,
          );
          score += year.score;
          reasons.push(year.reason);
        }
        if (inTmdb) {
          const first =
            signals.tmdbIds[0] === item.tmdbId ||
            (item.tvdbId > 0 && signals.tvdbIds[0] === item.tvdbId);
          score += first ? 25 : 15;
          reasons.push(first ? "tmdb first" : "tmdb");
        }
        if (inHistory) {
          score += 30;
          reasons.push("grab history");
        }
        if (appMatch) {
          score += 30;
          reasons.push("app parse");
        }
        if (targets !== null) {
          if (targets.length > 0) {
            score += 10;
            reasons.push("episodes exist");
            if (targets.some((e) => e.monitored && !e.hasFile)) {
              score += 10;
              reasons.push("episode wanted");
            }
          } else {
            score -= 100;
            reasons.push("episodes missing");
          }
        } else if (signals.movies && item.monitored && !item.hasFile) {
          score += 10;
          reasons.push("movie wanted");
        }
        scored.push({ item, score: Math.round(score), reasons });
      }
      return scored.sort((a, b) => b.score - a.score);
    }
    
    export function decide(
      candidates: Scored[],
      minScore: number,
      minMargin: number,
    ): Decision {
      const [best, second] = candidates;
      if (!best) return { kind: "ambiguous", candidates, why: "no candidate" };
      if (best.score < minScore) {
        return {
          kind: "ambiguous",
          candidates,
          why: `best score ${best.score} < ${minScore}`,
        };
      }
      if (second && best.score - second.score < minMargin) {
        return {
          kind: "ambiguous",
          candidates,
          why: `best leads the next by ${best.score - second.score} < ${minMargin}`,
        };
      }
      return { kind: "match", best, candidates };
    }
    
    /** Rejections the match pass overrides: the app could not tell which series/movie it was. */
    export function isIdentityRejection(reason: string): boolean {
      return /^Unknown (Series|Movie)|matched to (series|movie) by ID|Unable to (identify|parse)/i.test(
        reason,
      );
    }
    
    export interface ManualImportItem {
      path: string;
      name: string;
      folderName?: string;
      quality: unknown;
      languages: unknown[];
      releaseGroup?: string;
      indexerFlags?: number;
      downloadId?: string | null;
      size: number;
      rejections: { reason: string }[];
    }
    
    export interface Profile {
      id: number;
      minFormatScore: number;
      allowedQualities: Set<string>;
      /** Position in the profile, later is preferred; a group shares one rank. */
      qualityRank: Map<string, number>;
    }
    
    export interface FileCheck {
      file: ManualImportItem;
      episodeIds: number[];
      qualityName: string;
      formatScore: number | null;
      languages: unknown[];
    }
    
    /** Null when the file may be imported, else why it stays. */
    export function fileBlocker(
      check: FileCheck,
      targets: { hasFile: boolean; monitored: boolean }[],
      profile: Profile | undefined,
    ): string | null {
      const other = check.file.rejections.filter(
        (r) => !isIdentityRejection(r.reason),
      );
      if (other.length > 0) return other.map((r) => r.reason).join("; ");
      if (targets.length === 0) return "no matching episode";
      if (targets.some((t) => t.hasFile)) {
        return "already has a file (upgrades are the app's decision)";
      }
      if (targets.some((t) => !t.monitored)) return "not monitored";
      if (!profile) return "unknown quality profile";
      if (!profile.allowedQualities.has(check.qualityName)) {
        return `quality ${check.qualityName} not allowed by the profile`;
      }
      if (check.formatScore === null) {
        return "the app cannot score custom formats for this name";
      }
      if (check.formatScore < profile.minFormatScore) {
        return `custom format score ${check.formatScore} < profile minimum ${profile.minFormatScore}`;
      }
      return null;
    }
    
    export interface ImportCandidate {
      entry: string;
      check: FileCheck;
      /** Episode ids (Sonarr) or the movie id (Radarr) the file fills. */
      keys: number[];
      rank: number;
      payload: Record<string, unknown>;
    }
    
    /**
     * Several releases often fill the same episode or movie. Keep the one the
     * profile prefers (quality rank, then custom format score, then size); the
     * others are superseded so a later import never replaces an earlier one.
     */
    export function pickBest(candidates: ImportCandidate[]): {
      selected: ImportCandidate[];
      superseded: { candidate: ImportCandidate; by: ImportCandidate }[];
    } {
      const order = [...candidates].sort(
        (a, b) =>
          b.rank - a.rank ||
          (b.check.formatScore ?? 0) - (a.check.formatScore ?? 0) ||
          b.check.file.size - a.check.file.size ||
          a.check.file.path.localeCompare(b.check.file.path),
      );
      const owner = new Map<number, ImportCandidate>();
      const selected: ImportCandidate[] = [];
      const superseded: { candidate: ImportCandidate; by: ImportCandidate }[] = [];
      for (const candidate of order) {
        const taken = candidate.keys.map((key) => owner.get(key)).find(Boolean);
        if (taken) {
          superseded.push({ candidate, by: taken });
          continue;
        }
        for (const key of candidate.keys) owner.set(key, candidate);
        selected.push(candidate);
      }
      return { selected, superseded };
    }
    
    /**
     * The release name with its title part replaced by the library title and year,
     * so the app resolves it to that series/movie and scores custom formats (and an
     * untagged language) the way its own import would. Null without a season or year token.
     */
    export function canonicalName(
      app: App,
      name: string,
      item: Pick<LibraryItem, "title" | "year">,
    ): string | null {
      const title = item.title
        .replace(/\s*\(\d{4}\)\s*$/, "")
        .replace(/[^A-Za-z0-9]+/g, ".")
        .replace(/^\.|\.$/g, "");
      const token =
        app === "sonarr"
          ? /[ ._-](S\d{1,3}E\d{1,4}|S\d{1,3}(?=[ ._-]|$)|\d{1,2}x\d{2,3})/i
          : /[ ._([-]((?:19|20)\d{2})(?=[ ._)\]-]|$)/;
      const found = token.exec(name);
      if (!found) return null;
      const rest = name.slice(found.index + 1);
      return app === "sonarr"
        ? `${title}.${item.year}.${rest.replace(/^(?:19|20)\d{2}[ ._-]/, "")}`
        : `${title}.${rest}`;
    }
    
    export function manualImportFile(
      app: App,
      check: FileCheck,
      itemId: number,
    ): Record<string, unknown> {
      const common = {
        path: check.file.path,
        folderName: check.file.folderName,
        quality: check.file.quality,
        languages: check.languages,
        releaseGroup: check.file.releaseGroup,
        indexerFlags: check.file.indexerFlags ?? 0,
        downloadId: check.file.downloadId ?? undefined,
      };
      return app === "sonarr"
        ? {
            ...common,
            seriesId: itemId,
            episodeIds: check.episodeIds,
            releaseType:
              check.episodeIds.length > 1 ? "multiEpisode" : "singleEpisode",
          }
        : { ...common, movieId: itemId };
    }
    
    // ---------------------------------------------------------------------------
    // API side
    // ---------------------------------------------------------------------------
    
    type Json = Record<string, unknown>;
    const asRecord = (value: unknown): Json =>
      value !== null && typeof value === "object"
        ? Object.fromEntries(Object.entries(value))
        : {};
    const asArray = (value: unknown): unknown[] =>
      Array.isArray(value) ? value : [];
    const str = (value: unknown): string =>
      typeof value === "string" ? value : "";
    const int = (value: unknown): number => (typeof value === "number" ? value : 0);
    
    export interface RetryPolicy {
      attempts: number;
      delayMs: number;
      sleep: (ms: number) => Promise<void>;
    }
    
    export const DEFAULT_RETRY: RetryPolicy = {
      attempts: 5,
      delayMs: 8000,
      sleep: (ms) => Bun.sleep(ms),
    };
    
    /** An HTTP answer that retrying cannot change (4xx other than 429). */
    export class HttpError extends Error {
      constructor(
        message: string,
        readonly status: number,
      ) {
        super(message);
      }
    }
    
    export class Client {
      constructor(
        private readonly baseUrl: string,
        private readonly headers: Record<string, string>,
        private readonly fetcher: typeof fetch = fetch,
        private readonly retry: RetryPolicy = DEFAULT_RETRY,
      ) {}
    
      /**
       * Retries connection errors, 429 and 5xx with doubling backoff. once: a
       * single attempt, for requests that must not be repeated blindly.
       */
      async request(
        method: string,
        path: string,
        body?: unknown,
        options: { once?: boolean } = {},
      ): Promise<unknown> {
        const attempts = options.once ? 1 : this.retry.attempts;
        let lastError = "";
        for (let attempt = 1; attempt <= attempts; attempt++) {
          try {
            const response = await this.fetcher(`${this.baseUrl}${path}`, {
              method,
              headers: { ...this.headers, "Content-Type": "application/json" },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(60_000),
            });
            if (response.ok) {
              const text = await response.text();
              return text ? JSON.parse(text) : {};
            }
            lastError = `HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`;
            if (response.status < 500 && response.status !== 429) {
              throw new HttpError(
                `${method} ${path} failed: ${lastError}`,
                response.status,
              );
            }
          } catch (error) {
            if (error instanceof HttpError) throw error;
            lastError = String(error);
          }
          if (attempt < attempts) {
            await this.retry.sleep(this.retry.delayMs * 2 ** (attempt - 1));
          }
        }
        throw new Error(
          `${method} ${path} failed after ${attempts} attempt(s): ${lastError}`,
        );
      }
    }
    
    export type LanguageVerdict = "english" | "non-english" | "unknown";
    
    /** English when any language is English; unknown when none is known. */
    export function languageVerdict(languages: string[]): LanguageVerdict {
      if (languages.some((name) => /^english$/i.test(name))) return "english";
      const known = languages.filter(
        (name) => name && !/^(unknown|original)$/i.test(name),
      );
      return known.length > 0 ? "non-english" : "unknown";
    }
    
    export interface HistoryRecord {
      id: number;
      itemId: number;
      sourceTitle: string;
      downloadId: string;
    }
    
    export interface QueueItem {
      id: number;
      title: string;
      downloadId: string;
      outputPath: string;
    }
    
    /** The queue item, else the newest grab, that a downloads folder came from. */
    export function blocklistTarget(
      entry: { name: string; path: string },
      downloadIds: string[],
      queue: QueueItem[],
      history: HistoryRecord[],
    ):
      | { kind: "queue"; item: QueueItem }
      | { kind: "history"; record: HistoryRecord }
      | null {
      const name = normalizeTitle(entry.name);
      const ids = new Set(
        downloadIds.filter(Boolean).map((id) => id.toLowerCase()),
      );
      const byId = (downloadId: string) =>
        downloadId !== "" && ids.has(downloadId.toLowerCase());
      const queued =
        queue.find((item) => byId(item.downloadId)) ??
        queue.find(
          (item) =>
            item.outputPath.replace(/\/+$/, "") === entry.path ||
            normalizeTitle(item.title) === name,
        );
      if (queued) return { kind: "queue", item: queued };
      const grabbed =
        history.find((record) => byId(record.downloadId)) ??
        history.find((record) => normalizeTitle(record.sourceTitle) === name);
      return grabbed ? { kind: "history", record: grabbed } : null;
    }
    
    /**
     * Deletes entryPath only when it is a real (not symlinked) direct child of
     * categoryDir, which itself must be at least two levels below the root.
     */
    export function safeRemove(categoryDir: string, entryPath: string): void {
      const category = realpathSync(categoryDir);
      if (category.split("/").filter(Boolean).length < 2) {
        throw new Error(`refusing to delete under ${category}: too close to /`);
      }
      const name = basename(entryPath);
      if (!name || name === "." || name === "..") {
        throw new Error(`refusing to delete ${entryPath}: not a named entry`);
      }
      if (lstatSync(entryPath).isSymbolicLink()) {
        throw new Error(`refusing to delete ${entryPath}: it is a symlink`);
      }
      const resolved = realpathSync(entryPath);
      if (dirname(resolved) !== category) {
        throw new Error(
          `refusing to delete ${resolved}: not a direct child of ${category}`,
        );
      }
      rmSync(resolved, { recursive: true });
    }
    
    export function parseRelease(app: App, raw: unknown): ParsedRelease | null {
      const data = asRecord(raw);
      if (app === "sonarr") {
        const info = asRecord(data.parsedEpisodeInfo);
        const titleInfo = asRecord(info.seriesTitleInfo);
        const title = str(titleInfo.titleWithoutYear) || str(info.seriesTitle);
        if (!title) return null;
        return {
          title,
          year: int(titleInfo.year),
          season: typeof info.seasonNumber === "number" ? info.seasonNumber : null,
          episodes: asArray(info.episodeNumbers).filter(
            (n) => typeof n === "number",
          ),
          fullSeason: info.fullSeason === true,
          appMatchId: int(asRecord(data.series).id) || null,
        };
      }
      const info = asRecord(data.parsedMovieInfo);
      const title =
        str(info.primaryMovieTitle) || str(asArray(info.movieTitles)[0]);
      if (!title) return null;
      return {
        title,
        year: int(info.year),
        season: null,
        episodes: [],
        fullSeason: false,
        appMatchId: int(asRecord(data.movie).id) || null,
      };
    }
    
    export function parseLibrary(raw: unknown): LibraryItem[] {
      return asArray(raw).map((entry) => {
        const item = asRecord(entry);
        const titles = [
          str(item.title),
          str(item.originalTitle),
          ...asArray(item.alternateTitles).map((alt) => str(asRecord(alt).title)),
        ].filter(Boolean);
        return {
          id: int(item.id),
          title: str(item.title),
          year: int(item.year),
          titles,
          tmdbId: int(item.tmdbId),
          tvdbId: int(item.tvdbId),
          monitored: item.monitored === true,
          hasFile: item.hasFile === true,
          qualityProfileId: int(item.qualityProfileId),
        };
      });
    }
    
    export function parseProfiles(raw: unknown): Map<number, Profile> {
      const profiles = new Map<number, Profile>();
      for (const entry of asArray(raw)) {
        const profile = asRecord(entry);
        const allowed = new Set<string>();
        const qualityRank = new Map<string, number>();
        const visit = (node: unknown, inherited: boolean, rank: number): void => {
          const item = asRecord(node);
          const isAllowed = inherited || item.allowed === true;
          const quality = str(asRecord(item.quality).name);
          if (quality && isAllowed) allowed.add(quality);
          if (quality) qualityRank.set(quality, rank);
          for (const child of asArray(item.items)) visit(child, isAllowed, rank);
        };
        for (const [rank, item] of asArray(profile.items).entries()) {
          visit(item, false, rank);
        }
        profiles.set(int(profile.id), {
          id: int(profile.id),
          minFormatScore: int(profile.minFormatScore),
          allowedQualities: allowed,
          qualityRank,
        });
      }
      return profiles;
    }
    
    export function parseEpisodes(raw: unknown): Episode[] {
      return asArray(raw).map((entry) => {
        const episode = asRecord(entry);
        return {
          id: int(episode.id),
          seasonNumber: int(episode.seasonNumber),
          episodeNumber: int(episode.episodeNumber),
          hasFile: episode.hasFile === true,
          monitored: episode.monitored === true,
          airYear: Number(str(episode.airDate).slice(0, 4)) || 0,
        };
      });
    }
    
    export function parseManualImport(raw: unknown): ManualImportItem[] {
      return asArray(raw).map((entry) => {
        const item = asRecord(entry);
        return {
          path: str(item.path),
          name: str(item.name),
          folderName: str(item.folderName) || undefined,
          quality: item.quality,
          languages: asArray(item.languages),
          releaseGroup: str(item.releaseGroup) || undefined,
          indexerFlags: int(item.indexerFlags),
          downloadId: str(item.downloadId) || null,
          size: int(item.size),
          rejections: asArray(item.rejections).map((r) => ({
            reason: str(asRecord(r).reason),
          })),
        };
      });
    }
    
    /** Grab history: normalized release title -> library ids it was grabbed for. */
    export function parseHistory(app: App, raw: unknown): Map<string, Set<number>> {
      const byTitle = new Map<string, Set<number>>();
      for (const record of parseHistoryRecords(app, raw)) {
        const key = normalizeTitle(record.sourceTitle);
        if (!key || !record.itemId) continue;
        const ids = byTitle.get(key) ?? new Set<number>();
        ids.add(record.itemId);
        byTitle.set(key, ids);
      }
      return byTitle;
    }
    
    export function parseHistoryRecords(app: App, raw: unknown): HistoryRecord[] {
      const idField = app === "sonarr" ? "seriesId" : "movieId";
      return asArray(asRecord(raw).records).map((entry) => {
        const record = asRecord(entry);
        return {
          id: int(record.id),
          itemId: int(record[idField]),
          sourceTitle: str(record.sourceTitle),
          downloadId: str(record.downloadId),
        };
      });
    }
    
    export function parseQueue(raw: unknown): QueueItem[] {
      return asArray(asRecord(raw).records).map((entry) => {
        const item = asRecord(entry);
        return {
          id: int(item.id),
          title: str(item.title),
          downloadId: str(item.downloadId),
          outputPath: str(item.outputPath),
        };
      });
    }
    
    /** A recent command with the same name acting on the same path or files. */
    export function findSameCommand(
      commands: unknown,
      body: Json,
    ): Json | undefined {
      const paths = (value: Json): string[] =>
        [
          str(value.path),
          ...asArray(value.files).map((file) => str(asRecord(file).path)),
        ].filter(Boolean);
      const wanted = paths(body);
      return asArray(commands)
        .map((command) => asRecord(command))
        .filter((command) => str(command.name) === str(body.name))
        .filter((command) => {
          const have = paths(asRecord(command.body));
          return wanted.length > 0 && wanted.every((path) => have.includes(path));
        })
        .sort((a, b) => int(b.id) - int(a.id))[0];
    }
    
    const q = encodeURIComponent;
    const errorText = (error: unknown): string =>
      error instanceof Error ? error.message : String(error);
    
    interface Plan {
      entry: { name: string; path: string };
      head: string;
      targetTitle: string;
      files: number;
      importable: ImportCandidate[];
      blocked: string[];
      /** Set when the release is non-English and REMOVE_NON_ENGLISH is on. */
      removal?: { evidence: string; downloadIds: string[] };
    }
    
    class Sweep {
      private readonly arr: Client;
      private readonly tmdb: Client | null;
      private readonly deadline: number;
      private readonly tmdbCache = new Map<
        string,
        { tmdbIds: number[]; tvdbIds: number[] }
      >();
      private readonly episodeCache = new Map<number, Episode[]>();
      private library: LibraryItem[] = [];
      private profiles = new Map<number, Profile>();
      private history = new Map<string, Set<number>>();
      private historyRecords: HistoryRecord[] = [];
      private queue: QueueItem[] = [];
      readonly tally = {
        moved: 0,
        imported: 0,
        removed: 0,
        ambiguous: 0,
        blocked: 0,
        empty: 0,
        failed: 0,
      };
    
      constructor(
        private readonly config: Config,
        fetcher: typeof fetch = fetch,
        sleep: (ms: number) => Promise<void> = (ms) => Bun.sleep(ms),
      ) {
        const retry: RetryPolicy = {
          attempts: config.retryAttempts,
          delayMs: config.retryDelaySeconds * 1000,
          sleep,
        };
        this.arr = new Client(
          `${config.url}/api/v3`,
          { "X-Api-Key": config.apiKey },
          fetcher,
          retry,
        );
        const bearer = config.tmdbKey.length > 40;
        this.tmdb = config.tmdbKey
          ? new Client(
              "https://api.themoviedb.org/3",
              bearer ? { Authorization: `Bearer ${config.tmdbKey}` } : {},
              fetcher,
              retry,
            )
          : null;
        this.deadline = Date.now() + config.timeoutSeconds * 1000;
      }
    
      private checkDeadline(): void {
        if (Date.now() > this.deadline) {
          throw new Error(
            `run passed ${this.config.timeoutSeconds}s; the next run continues`,
          );
        }
      }
    
      private async entries(): Promise<{ name: string; path: string }[]> {
        const listing = asRecord(
          await this.arr.request(
            "GET",
            `/filesystem?path=${q(this.config.importPath + "/")}&includeFiles=true`,
          ),
        );
        return [...asArray(listing.directories), ...asArray(listing.files)]
          .map((entry) => asRecord(entry))
          .map((entry) => ({
            name: str(entry.name),
            path: str(entry.path).replace(/\/+$/, ""),
          }))
          .filter((entry) => entry.name && !entry.name.startsWith("."))
          .filter((entry) => entry.name.includes(this.config.only));
      }
    
      /**
       * POSTs a command once and polls it. When the POST or the poll is lost, the
       * app's recent commands are searched for it, and done() says whether its
       * effect already happened, before the command is ever sent again.
       */
      private async runCommand(
        body: Json,
        done: () => Promise<boolean>,
      ): Promise<Json> {
        let command: Json;
        try {
          command = asRecord(
            await this.arr.request("POST", "/command", body, { once: true }),
          );
        } catch (error) {
          if (error instanceof HttpError) throw error;
          log(
            "WARN",
            `POST ${str(body.name)} lost (${errorText(error)}); checking before resending`,
          );
          const existing = findSameCommand(
            await this.arr.request("GET", "/command"),
            body,
          );
          if (existing) {
            command = existing;
          } else if (await done()) {
            return { status: "completed", message: "already done" };
          } else {
            command = asRecord(
              await this.arr.request("POST", "/command", body, { once: true }),
            );
          }
        }
        const id = int(command.id);
        if (!id)
          throw new Error(`no command id in the response to ${str(body.name)}`);
        while (["queued", "started", ""].includes(str(command.status))) {
          this.checkDeadline();
          await Bun.sleep(this.config.pollSeconds * 1000);
          try {
            command = asRecord(await this.arr.request("GET", `/command/${id}`));
          } catch (error) {
            if (await done()) {
              return { status: "completed", message: "done; its poll was lost" };
            }
            throw error;
          }
        }
        if (str(command.status) !== "completed" && (await done())) {
          return {
            status: "completed",
            message: `done; command ended ${str(command.status)}`,
          };
        }
        return command;
      }
    
      /** True when none of the paths exists in the app's view of the downloads share. */
      private async gone(paths: string[]): Promise<boolean> {
        for (const path of paths) {
          const parent = path.replace(/\/[^/]+\/?$/, "");
          const listing = asRecord(
            await this.arr.request(
              "GET",
              `/filesystem?path=${q(parent + "/")}&includeFiles=true`,
            ),
          );
          const present = [
            ...asArray(listing.directories),
            ...asArray(listing.files),
          ]
            .map((entry) => str(asRecord(entry).path).replace(/\/+$/, ""))
            .includes(path.replace(/\/+$/, ""));
          if (present) return false;
        }
        return true;
      }
    
      private async tmdbSignal(
        release: ParsedRelease,
      ): Promise<{ tmdbIds: number[]; tvdbIds: number[] }> {
        const none = { tmdbIds: [], tvdbIds: [] };
        if (!this.tmdb) return none;
        const kind = this.config.app === "sonarr" ? "tv" : "movie";
        const key = `${normalizeTitle(release.title)}|${release.year}`;
        const cached = this.tmdbCache.get(key);
        if (cached) return cached;
        const auth =
          this.config.tmdbKey.length > 40
            ? ""
            : `&api_key=${q(this.config.tmdbKey)}`;
        // A series release year is often the airing year, so only movie searches filter on it.
        const yearParam =
          release.year > 0 && kind === "movie" ? `&year=${release.year}` : "";
        const search = asRecord(
          await this.tmdb.request(
            "GET",
            `/search/${kind}?query=${q(release.title)}${yearParam}${auth}`,
          ),
        );
        const tmdbIds = asArray(search.results)
          .slice(0, 5)
          .map((r) => int(asRecord(r).id))
          .filter(Boolean);
        const tvdbIds: number[] = [];
        if (kind === "tv") {
          for (const id of tmdbIds) {
            const ids = asRecord(
              await this.tmdb.request(
                "GET",
                `/tv/${id}/external_ids?${auth.slice(1)}`,
              ),
            );
            tvdbIds.push(int(ids.tvdb_id));
          }
        }
        const signal = { tmdbIds, tvdbIds };
        this.tmdbCache.set(key, signal);
        return signal;
      }
    
      private async episodesOf(seriesId: number): Promise<Episode[]> {
        const cached = this.episodeCache.get(seriesId);
        if (cached) return cached;
        const episodes = parseEpisodes(
          await this.arr.request("GET", `/episode?seriesId=${seriesId}`),
        );
        this.episodeCache.set(seriesId, episodes);
        return episodes;
      }
    
      private async load(): Promise<void> {
        const sonarr = this.config.app === "sonarr";
        this.library = parseLibrary(
          await this.arr.request("GET", sonarr ? "/series" : "/movie"),
        );
        this.profiles = parseProfiles(
          await this.arr.request("GET", "/qualityprofile"),
        );
        const history = await this.arr.request(
          "GET",
          `/history?eventType=1&pageSize=${this.config.historyRecords}&sortKey=date&sortDirection=descending`,
        );
        this.history = parseHistory(this.config.app, history);
        this.historyRecords = parseHistoryRecords(this.config.app, history);
        if (this.config.removeNonEnglish) {
          const unknownItems = sonarr
            ? "includeUnknownSeriesItems=true"
            : "includeUnknownMovieItems=true";
          this.queue = parseQueue(
            await this.arr.request("GET", `/queue?pageSize=1000&${unknownItems}`),
          );
        }
        log(
          "INFO",
          `library ${this.library.length}, profiles ${this.profiles.size}, grab history titles ${this.history.size}, queue ${this.queue.length}`,
        );
      }
    
      private async automaticPass(
        entries: { name: string; path: string }[],
      ): Promise<void> {
        const command =
          this.config.app === "sonarr"
            ? "DownloadedEpisodesScan"
            : "DownloadedMoviesScan";
        for (const entry of entries) {
          this.checkDeadline();
          const result = await this.runCommand(
            { name: command, path: entry.path, importMode: "Move" },
            () => this.gone([entry.path]),
          );
          if (str(result.status) !== "completed") {
            this.tally.failed++;
            log(
              "ERROR",
              `${command} ${entry.name}: status ${str(result.status)}: ${str(result.message)}`,
            );
          }
        }
      }
    
      /** Custom format score and languages the app gives the name once resolved to the target. */
      private async evaluate(
        fileName: string,
        target: LibraryItem,
      ): Promise<{
        formatScore: number;
        languages: unknown[];
        languageNames: string[];
        formats: string[];
      } | null> {
        const name = canonicalName(this.config.app, fileName, target);
        if (!name) return null;
        const parsed = asRecord(
          await this.arr.request("GET", `/parse?title=${q(name)}`),
        );
        const resolved = asRecord(
          this.config.app === "sonarr" ? parsed.series : parsed.movie,
        );
        if (int(resolved.id) !== target.id) return null;
        const languages = asArray(parsed.languages);
        return {
          formatScore: int(parsed.customFormatScore),
          languages,
          languageNames: languages.map((l) => str(asRecord(l).name)),
          formats: asArray(parsed.customFormats).map((f) => str(asRecord(f).name)),
        };
      }
    
      async plan(entry: { name: string; path: string }): Promise<Plan | null> {
        const app = this.config.app;
        const files = parseManualImport(
          await this.arr.request(
            "GET",
            `/manualimport?folder=${q(entry.path)}&filterExistingFiles=true`,
          ),
        );
        if (files.length === 0) {
          this.tally.empty++;
          log("INFO", `left    ${entry.name}: no video files the app can import`);
          return null;
        }
        const parsedEntry = asRecord(
          await this.arr.request("GET", `/parse?title=${q(entry.name)}`),
        );
        const release = parseRelease(app, parsedEntry);
        if (!release) {
          this.tally.ambiguous++;
          log(
            "INFO",
            `left    ${entry.name}: the app cannot parse the release name`,
          );
          return null;
        }
        const tmdb = await this.tmdbSignal(release);
        const historyIds =
          this.history.get(normalizeTitle(entry.name)) ?? new Set<number>();
        const firstPass = scoreCandidates(release, this.library, {
          ...tmdb,
          historyIds,
          movies: app === "radarr",
        });
        let episodes: Map<number, Episode[]> | undefined;
        if (app === "sonarr") {
          episodes = new Map();
          for (const candidate of firstPass.slice(0, 5)) {
            episodes.set(
              candidate.item.id,
              await this.episodesOf(candidate.item.id),
            );
          }
        }
        const candidates = scoreCandidates(
          release,
          this.library.filter((item) => !episodes || episodes.has(item.id)),
          { ...tmdb, historyIds, episodes, movies: app === "radarr" },
        );
        const decision = decide(
          candidates,
          this.config.minScore,
          this.config.minMargin,
        );
        const summary = candidates
          .slice(0, 3)
          .map(
            (c) =>
              `${c.item.title} (${c.item.year}) ${c.score} [${c.reasons.join(", ")}]`,
          )
          .join(" | ");
        if (decision.kind === "ambiguous") {
          this.tally.ambiguous++;
          log(
            "INFO",
            `left    ${entry.name}: ${decision.why}; ${summary || "no candidates"}`,
          );
          return null;
        }
        const target = decision.best.item;
        const head = `${target.title} (${target.year}) score ${decision.best.score} [${decision.best.reasons.join(", ")}]`;
        if (this.config.removeNonEnglish) {
          const nameInfo = asRecord(
            app === "sonarr"
              ? parsedEntry.parsedEpisodeInfo
              : parsedEntry.parsedMovieInfo,
          );
          const named = asArray(nameInfo.languages).map((l) =>
            str(asRecord(l).name),
          );
          const judged = await this.evaluate(entry.name, target);
          const verdict = judged
            ? languageVerdict(judged.languageNames)
            : "unknown";
          const inferred =
            languageVerdict(named) === "unknown"
              ? " (inferred from the series' original language)"
              : "";
          const evidence = `name languages [${named.join(", ")}], app languages [${judged?.languageNames.join(", ") ?? "not resolved"}]${inferred}, formats [${judged?.formats.join(", ") ?? ""}]`;
          if (verdict === "non-english") {
            return {
              entry,
              head,
              targetTitle: target.title,
              files: files.length,
              importable: [],
              blocked: [],
              removal: {
                evidence,
                downloadIds: files.map((f) => f.downloadId ?? "").filter(Boolean),
              },
            };
          }
          if (verdict === "unknown" && judged?.formats.includes("Not English")) {
            log(
              "INFO",
              `keep    ${entry.name}: language unknown, never removed; ${evidence}`,
            );
          }
        }
        const profile = this.profiles.get(target.qualityProfileId);
        const importable: ImportCandidate[] = [];
        const blocked: string[] = [];
        for (const file of files) {
          const fileName = file.path
            .split("/")
            .pop()!
            .replace(/\.[^.]+$/, "");
          const parsedFile = asRecord(
            await this.arr.request("GET", `/parse?title=${q(fileName)}`),
          );
          const fileRelease = parseRelease(app, parsedFile) ?? release;
          const info = asRecord(
            app === "sonarr"
              ? parsedFile.parsedEpisodeInfo
              : parsedFile.parsedMovieInfo,
          );
          let targets: { id: number; hasFile: boolean; monitored: boolean }[] = [];
          if (app === "sonarr") {
            const all = episodes?.get(target.id) ?? [];
            targets = targetEpisodes(
              {
                ...fileRelease,
                season: fileRelease.season ?? release.season,
                fullSeason: false,
              },
              all,
            );
          } else {
            targets = [
              {
                id: target.id,
                hasFile: target.hasFile,
                monitored: target.monitored,
              },
            ];
          }
          const evaluated = await this.evaluate(fileName, target);
          const languages = asArray(evaluated?.languages ?? info.languages);
          const check: FileCheck = {
            file,
            episodeIds: app === "sonarr" ? targets.map((t) => t.id) : [],
            qualityName: str(asRecord(asRecord(file.quality).quality).name),
            formatScore: evaluated ? evaluated.formatScore : null,
            languages: languages.length > 0 ? languages : file.languages,
          };
          const blocker = fileBlocker(check, targets, profile);
          if (blocker) blocked.push(`${file.name}: ${blocker}`);
          else
            importable.push({
              entry: entry.name,
              check,
              keys: app === "sonarr" ? check.episodeIds : [target.id],
              rank: profile?.qualityRank.get(check.qualityName) ?? -1,
              payload: manualImportFile(app, check, target.id),
            });
        }
        return {
          entry,
          head,
          targetTitle: target.title,
          files: files.length,
          importable,
          blocked,
        };
      }
    
      private async execute(
        plan: Plan,
        selected: Set<ImportCandidate>,
      ): Promise<void> {
        const { entry, head } = plan;
        if (plan.removal) {
          await this.remove(plan, plan.removal);
          return;
        }
        const chosen = plan.importable.filter((c) => selected.has(c));
        const left = [...plan.blocked];
        if (chosen.length === 0) {
          this.tally.blocked++;
          log("INFO", `left    ${entry.name} -> ${head}: ${left.join("; ")}`);
          return;
        }
        const leftNote = left.length ? `; left: ${left.join("; ")}` : "";
        if (this.config.dryRun) {
          this.tally.imported++;
          log(
            "OK",
            `would import ${chosen.length}/${plan.files} files ${entry.name} -> ${head}${leftNote}`,
          );
          return;
        }
        this.checkDeadline();
        const result = await this.runCommand(
          {
            name: "ManualImport",
            importMode: "move",
            files: chosen.map((c) => c.payload),
          },
          () => this.gone(chosen.map((c) => c.check.file.path)),
        );
        if (str(result.status) === "completed") {
          this.tally.imported++;
          log(
            "OK",
            `imported ${chosen.length}/${plan.files} files ${entry.name} -> ${head}${leftNote}`,
          );
        } else {
          this.tally.failed++;
          log(
            "ERROR",
            `ManualImport ${entry.name} -> ${plan.targetTitle}: status ${str(result.status)}: ${str(result.message)}`,
          );
        }
      }
    
      /** Blocklists the release in the app, then deletes its folder from the downloads share. */
      private async remove(
        plan: Plan,
        removal: { evidence: string; downloadIds: string[] },
      ): Promise<void> {
        const { entry } = plan;
        const target = blocklistTarget(
          entry,
          removal.downloadIds,
          this.queue,
          this.historyRecords,
        );
        const how =
          target?.kind === "queue"
            ? `remove queue item ${target.item.id} with blocklist`
            : target?.kind === "history"
              ? `mark grab ${target.record.id} failed (blocklist)`
              : "NOT blocklisted: no queue item or grab history found";
        const verb = this.config.dryRun ? "would remove" : "remove";
        log(
          target ? "INFO" : "WARN",
          `${verb} ${entry.name} -> ${plan.head}: non-English, ${removal.evidence}; ${how}; delete ${entry.path}`,
        );
        if (this.config.dryRun) {
          this.tally.removed++;
          return;
        }
        this.checkDeadline();
        if (target?.kind === "queue") {
          try {
            await this.arr.request(
              "DELETE",
              `/queue/${target.item.id}?removeFromClient=true&blocklist=true`,
            );
          } catch (error) {
            // A retried DELETE whose first attempt succeeded finds nothing left.
            if (!(error instanceof HttpError && error.status === 404)) throw error;
          }
        } else if (target?.kind === "history") {
          await this.arr.request("POST", `/history/failed/${target.record.id}`);
        }
        try {
          safeRemove(this.config.importPath, entry.path);
        } catch (error) {
          if (
            !(error instanceof Error && "code" in error && error.code === "ENOENT")
          ) {
            throw error;
          }
        }
        this.tally.removed++;
        log("OK", `removed ${entry.name}`);
      }
    
      async run(): Promise<number> {
        const mode = this.config.dryRun ? "dry run, no POST" : "importMode Move";
        let entries = await this.entries();
        const before = entries.length;
        log(
          "INFO",
          `${before} entries in ${this.config.importPath} (${this.config.app}, ${mode})`,
        );
        if (!this.tmdb)
          log("INFO", "TMDB_API_KEY is not set: matching without the TMDb signal");
        if (!this.config.dryRun && entries.length > 0) {
          await this.automaticPass(entries);
          entries = await this.entries();
          this.tally.moved = before - entries.length;
          log(
            "INFO",
            `automatic pass moved ${this.tally.moved}; matching the ${entries.length} left`,
          );
        }
        if (entries.length > 0) {
          await this.load();
        }
        const plans: Plan[] = [];
        for (const entry of entries) {
          this.checkDeadline();
          try {
            const plan = await this.plan(entry);
            if (plan) plans.push(plan);
          } catch (error) {
            this.tally.failed++;
            log("ERROR", `${entry.name}: ${errorText(error)}`);
          }
        }
        const { selected, superseded } = pickBest(
          plans.flatMap((p) => p.importable),
        );
        for (const { candidate, by } of superseded) {
          const plan = plans.find((p) => p.entry.name === candidate.entry);
          plan?.blocked.push(
            `${candidate.check.file.name}: superseded by ${by.check.file.name}`,
          );
        }
        const chosen = new Set(selected);
        for (const plan of plans) {
          try {
            await this.execute(plan, chosen);
          } catch (error) {
            this.tally.failed++;
            log("ERROR", `${plan.entry.name}: ${errorText(error)}`);
          }
        }
        const t = this.tally;
        log(
          t.failed ? "ERROR" : "OK",
          `done: ${t.moved} moved by the automatic pass, ${t.imported} ${this.config.dryRun ? "would be imported" : "imported"} by match, ${t.removed} ${this.config.dryRun ? "would be removed" : "removed"} as non-English, ${t.blocked} matched but blocked, ${t.ambiguous} unmatched or ambiguous, ${t.empty} without importable files, ${t.failed} failed`,
        );
        return t.failed > 0 ? 1 : 0;
      }
    }
    
    export async function main(
      argv: string[],
      env: Record<string, string | undefined>,
      fetcher: typeof fetch = fetch,
    ): Promise<number> {
      let config: Config | "help";
      try {
        config = readConfig(argv, env, (path) => readFileSync(path, "utf8"));
      } catch (error) {
        log("ERROR", errorText(error));
        return 1;
      }
      if (config === "help") {
        process.stdout.write(`${HELP}\n`);
        return 0;
      }
      try {
        return await new Sweep(config, fetcher).run();
      } catch (error) {
        log("ERROR", errorText(error));
        return 1;
      }
    }
    
    if (import.meta.main) {
      process.exit(await main(Bun.argv.slice(2), process.env));
    }
    

