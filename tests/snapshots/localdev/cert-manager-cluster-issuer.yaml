---
# Source: cert-manager-cluster-issuer/templates/cluster-issuer.yaml
# Self-signed issuer under the letsencrypt name (CERT_ISSUER=selfsigned):
# every cert-manager.io/cluster-issuer: letsencrypt annotation keeps working
# on a cluster without a public domain, and the certificates are untrusted.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  selfSigned: {}
