---
# Source: gitops/templates/bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: HEAD
    path: charts/bootstrap
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # bootstrap installs the CMP, so it runs before the CMP exists and cannot
      # read configuration/. Terraform injects global.domain into the root
      # (gitops) Application via helm.parameters; level 0 mirrors it with --set.
      # The ArgoCD ingress hostname is derived here and handed to the child.
      valuesObject:
        argocd:
          values:
            server:
              ingress:
                hostname: argocd.homelab.local
                annotations:
                  external-dns.alpha.kubernetes.io/hostname: argocd.homelab.local
                extraTls:
                  - hosts:
                      - argocd.homelab.local
                    secretName: argocd-server-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
