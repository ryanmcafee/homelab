---
# Source: gitops/templates/addons.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/addons
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # The Kind loop installs the root Application at the PR head
      # (scripts/localdev-argocd.ts install --revision); the child's own
      # values-localdev.yaml says main, so the revision is handed down here
      # (ADR-010: derived values reach children via helm.valuesObject).
      valuesObject:
        global:
          targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: argoproj.io
      jqPathExpressions:
      - .metadata.finalizers[]? | select(startswith("post-delete-finalizer.argocd.argoproj.io"))
      kind: Application

