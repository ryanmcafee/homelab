---
# Source: argo-events-config/templates/eventbus.yaml
# Argo Events looks up an EventBus named `default` in its own namespace when an
# EventSource or Sensor names none, so this name is the wiring, not a label.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
spec:
  jetstream:
    version: "2.10.29"
    replicas: 1
    persistence:
      storageClassName: "local-path"
      accessMode: ReadWriteOnce
      volumeSize: 1Gi
    # A YAML string, not a mapping: Argo Events merges it over the
    # controller-config the argo-events chart installs, which is where the
    # replica count is set. Byte counts are plain integers because Argo Events
    # reads them with viper's GetInt64, which yields 0 for a suffixed string.
    streamConfig: |
      maxAge: 72h
      maxBytes: 268435456
      maxMsgs: 1000000

---
# Source: argo-events-config/templates/podmonitor.yaml
# The EventBus StatefulSet runs prometheus-nats-exporter with -jsz=all on port
# `metrics`, but Argo Events creates no monitor for it. The fixed job label is
# what the homelab-argo-events-trigger-bus rules select on, independent of namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-events-trigger-bus
spec:
  selector:
    matchLabels:
      controller: eventbus-controller
      eventbus-name: default
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: argo-events-trigger-bus
