# Source: applications/templates/flaresolverr.yaml
# FlareSolverr Config: deploys static PV+PVC for flaresolverr persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/flaresolverr-config
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      valuesObject:
        iscsi:
          portal: "127.0.0.1:3260"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

---
# Source: applications/templates/flaresolverr.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: flaresolverr
    targetRevision: 16.18.2
    helm:
      releaseName: flaresolverr
      values: |
        workload:
          main:
            podSpec:
              containers:
                main:
                  env:
                    BROWSER_TIMEOUT: 40000
                    CAPTCHA_SOLVER: none
                    HEADLESS: true
                    LOG_HTML: false
                    LOG_LEVEL: info
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 1Gi
                    requests:
                      cpu: 100m
                      memory: 512Mi
              nodeSelector:
                kubernetes.io/arch: null
        persistence:
          config:
            accessModes:
            - ReadWriteOnce
            enabled: true
            size: 1Gi
            storageClass: local-path
        TZ: "America/New_York"
        securityContext:
          container:
            readOnlyRootFilesystem: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

