apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lazylibrarian
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: lazylibrarian
    targetRevision: 21.18.2
    helm:
      releaseName: lazylibrarian
      values: |
        workload:
          main:
            podSpec:
              containers:
                main:
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 256Mi
              nodeSelector:
                kubernetes.io/arch: null
        persistence:
          books:
            enabled: true
            mountPath: /books
            path: /mnt/storage/books
            server: truenas.example.com
            type: emptyDir
          config:
            accessModes:
            - ReadWriteOnce
            enabled: true
            size: 1Gi
            storageClass: local-path
          downloads:
            enabled: true
            mountPath: /downloads
            path: /mnt/storage/downloads
            server: truenas.example.com
            type: emptyDir
        ingress:
          main:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: lazylibrarian.homelab.local
            enabled: true
            hosts:
            - host: lazylibrarian.homelab.local
              paths:
              - path: /
                pathType: Prefix
            ingressClassName: internal
            tls:
            - hosts:
              - lazylibrarian.homelab.local
              secretName: lazylibrarian-tls
        TZ: "America/New_York"
        securityContext:
          container:
            runAsGroup: 100
            runAsUser: 568
          pod:
            fsGroup: 100

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
