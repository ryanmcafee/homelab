# Source: applications/templates/paperclip.yaml
# Operator Application: CRDs (instances, paperclipclusterdefaults,
# paperclipselfconfigs in paperclip.inc) and the controller. The CRDs are
# chart templates gated by crds.install and kept on uninstall (crds.keep). The
# Instance CRD is far past the 256 KiB client-side-apply limit, so
# ServerSideApply=true is mandatory (tests/gitops/huge-crd-charts.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperclip-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/paperclipinc/charts
    chart: paperclip-operator
    targetRevision: "0.19.1"
    helm:
      releaseName: paperclip-operator
      values: |
        crds:
          install: true
          keep: true
        # Chart 0.19.1 turns on --leader-elect but grants no RBAC on
        # coordination.k8s.io leases, so the manager never wins the election,
        # never starts its controllers and still reports Ready (Instances stay
        # without status forever). One replica needs no election.
        leaderElection:
          enabled: false
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: paperclip-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# Source: applications/templates/paperclip.yaml
# Database Application: a CloudNativePG Cluster (the operator is the
# cloudnative-pg addon). CNPG generates Secret paperclip-postgres-app whose `uri`
# key is the DATABASE_URL the Instance reads, so no credential is ever
# written by us. ArgoCD's built-in Cluster health check makes wave 14 wait
# for a ready database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperclip-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/paperclip-database
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # Storage class, size, image pin and sizing are environment facts
      # (configuration/) and reach the child through this parent (ADR-010).
      valuesObject:
        namespace: paperclip
        imageName: ghcr.io/cloudnative-pg/postgresql:17.11
        instances: 1
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        storageClass: local-path
        storageSize: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: paperclip
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # The Cluster CRD comes from the cloudnative-pg addon; if a sync lands before
    # the CRD is served the apply fails with "no matches for kind Cluster" and
    # this retries until the operator is up.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# Source: applications/templates/paperclip.yaml
# Instance Application: the paperclip.inc/v1alpha1 Instance in external
# database mode. Health comes from charts/bootstrap/files/health/
# paperclip.inc_Instance.lua (status.phase Running = Healthy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperclip
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    targetRevision: main
    path: charts/paperclip
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      # Hostname, admin e-mail, image tag, ingress class and storage classes
      # come from configuration/ through this parent (ADR-010); never put them
      # in charts/paperclip/values-homelab.yaml.
      valuesObject:
        namespace: paperclip
        hostname: paperclip.homelab.local
        admin:
          email: admin@homelab.local
          name: Admin
        image:
          repository: ghcr.io/paperclipai/paperclip
          tag: 2026.831.1
        ingress:
          className: internal
        persistence:
          size: 1Gi
          storageClass: local-path
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: paperclip
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # The Instance CRD comes from paperclip-operator (wave 11); retry covers a
    # sync that lands before the CRD is served or the database Secret exists.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

