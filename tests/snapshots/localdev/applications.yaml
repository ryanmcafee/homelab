# Source: applications/templates/flaresolverr.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: flaresolverr
    targetRevision: 16.18.2
    helm:
      releaseName: flaresolverr
      values: |
        workload:
          main:
            podSpec:
              containers:
                main:
                  env:
                    BROWSER_TIMEOUT: 40000
                    CAPTCHA_SOLVER: none
                    HEADLESS: true
                    LOG_HTML: false
                    LOG_LEVEL: info
                  resources:
                    limits:
                      cpu: 1000m
                      memory: 1Gi
                    requests:
                      cpu: 100m
                      memory: 512Mi
        persistence:
          config:
            accessModes:
            - ReadWriteOnce
            enabled: true
            existingClaim: flaresolverr-config
            size: 1Gi
            storageClass: democratic-csi-nfs
        TZ: "America/New_York"
        securityContext:
          container:
            readOnlyRootFilesystem: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

