# Source: applications/templates/tautulli.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tautulli
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: tautulli
    targetRevision: 21.18.2
    helm:
      releaseName: tautulli
      values: |
        workload:
          main:
            podSpec:
              containers:
                main:
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 256Mi
              nodeSelector:
                kubernetes.io/arch: null
        persistence:
          config:
            accessModes:
            - ReadWriteOnce
            enabled: true
            size: 1Gi
            storageClass: local-path
        ingress:
          main:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              external-dns.alpha.kubernetes.io/hostname: tautulli.homelab.local
            enabled: true
            hosts:
            - host: tautulli.homelab.local
              paths:
              - path: /
                pathType: Prefix
            ingressClassName: internal
            tls:
            - hosts:
              - tautulli.homelab.local
              secretName: tautulli-tls
        TZ: "America/New_York"
        securityContext:
          container:
            runAsGroup: 100
            runAsUser: 568
          pod:
            fsGroup: 100

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
