# Source: applications/templates/plex.yaml
# Plex Application: deploys the media server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    homelab.ryanmcafee.com/policy-exempt: "image-latest"
    homelab.ryanmcafee.com/policy-exempt-reason: "Upstream plexinc/pms-docker publishes no numbered release tags; tracking :latest is the documented, intentional deployment model for Plex."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
    chart: plex-media-server
    targetRevision: 1.6.0
    helm:
      releaseName: plex
      values: |
        image:
          pullPolicy: IfNotPresent
          registry: index.docker.io
          repository: plexinc/pms-docker
          tag: latest
        extraEnv:
          ADVERTISE_IP: https://plex.homelab.local:443
          CHANGE_CONFIG_DIR_OWNERSHIP: "false"
          PLEX_GID: "100"
          PLEX_UID: "568"
          TZ: America/New_York
        pms:
          claimSecret:
            key: plex-claim-token
            name: plex
          configExistingClaim: plex-config-iscsi
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          storageClassName: democratic-csi-iscsi
        extraVolumes:
          - name: movies
            nfs:
              path: /tmp/storage/movies
              server: truenas.homelab.local
          - name: tv
            nfs:
              path: /tmp/storage/tv
              server: truenas.homelab.local
          - name: music
            nfs:
              path: /tmp/storage/music
              server: truenas.homelab.local
          - name: pictures
            nfs:
              path: /tmp/storage/pictures
              server: truenas.homelab.local
        extraVolumeMounts:
          - mountPath: /movies
            name: movies
            readOnly: false
          - mountPath: /tv
            name: tv
            readOnly: false
          - mountPath: /music
            name: music
            readOnly: false
          - mountPath: /pictures
            name: pictures
            readOnly: false
        service:
          externalTrafficPolicy: Local
          port: 32400
          type: NodePort
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: plex.homelab.local
            external-dns.alpha.kubernetes.io/target: homelab-dev.duckdns.org
          enabled: true
          hosts:
          - host: plex.homelab.local
            paths:
            - path: /
              pathType: Prefix
          ingressClassName: external
          tls:
          - hosts:
            - plex.homelab.local
            secretName: plex-tls
          url: https://plex.homelab.local
        dnsPolicy: "None"
        dnsConfig:
          nameservers:
          - 8.8.8.8
          - 8.8.4.4
          - 10.96.0.10
          options:
          - name: ndots
            value: "5"
          searches:
          - media.svc.cluster.local
          - svc.cluster.local
          - cluster.local

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

