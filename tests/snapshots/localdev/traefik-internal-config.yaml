---
# Source: traefik-internal-config/templates/dashboard.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-internal-dashboard-tls
  namespace: traefik
  annotations:
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #262: domain hardcoded in values-homelab.yaml; this chart's global.domain is set independently of configuration/environments/*.yaml (the centralized, PII-free level-0 domain), so the rendered hostname is correct in real deployments but never matches the level-0 placeholder domain. Remove this exemption when the chart takes DOMAIN from the config system."
spec:
  secretName: traefik-internal-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - traefik-internal.example.com
---
# Source: traefik-internal-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-internal-dashboard-redirect
  namespace: traefik
  annotations:
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #262: domain hardcoded in values-homelab.yaml; this chart's global.domain is set independently of configuration/environments/*.yaml (the centralized, PII-free level-0 domain), so the rendered hostname is correct in real deployments but never matches the level-0 placeholder domain. Remove this exemption when the chart takes DOMAIN from the config system."
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik-internal.example.com`) && Path(`/dashboard`)
      middlewares:
        - name: internal-dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-internal-dashboard-tls

---
# Source: traefik-internal-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-dashboard-redirect-slash
  namespace: traefik
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
