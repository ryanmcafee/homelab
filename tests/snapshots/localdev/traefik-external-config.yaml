---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: traefik
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - traefik.example.com
---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  endpoints:
    - dnsName: traefik.example.com
      recordType: A
      targets:
        - "10.0.0.200"
---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-redirect
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.example.com`) && Path(`/dashboard`)
      middlewares:
        - name: dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-dashboard-tls
---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect-slash
  namespace: traefik
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
