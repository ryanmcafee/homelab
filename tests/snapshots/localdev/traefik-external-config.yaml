---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: traefik
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - traefik.homelab.local

---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-redirect
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.homelab.local`) && Path(`/dashboard`)
      middlewares:
        - name: dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-dashboard-tls

---
# Source: traefik-external-config/templates/dashboard.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect-slash
  namespace: traefik
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
