---
# Source: applications/templates/namespaces.yaml
# Namespace of one pull request's preview (docs/runbooks/previews.md). The
# preview-pr<N> Application also creates it (CreateNamespace=true) with the
# same labels through managedNamespaceMetadata in
# charts/gitops/templates/previews-applicationset.yaml; keep both at baseline.
# Rendering it here makes the teardown prune it with everything inside.
apiVersion: v1
kind: Namespace
metadata:
  name: preview-123
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    homelab.local/preview-pr: "123"
  annotations:
    argocd.argoproj.io/sync-wave: "10"

---
# Source: applications/templates/namespaces.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview
  namespace: preview-123
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  hard:
    limits.cpu: "12"
    limits.memory: 16Gi
    persistentvolumeclaims: "0"
    pods: "30"
    requests.cpu: "4"
    requests.memory: 8Gi
    requests.storage: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"

---
# Source: applications/templates/namespaces.yaml
apiVersion: v1
kind: LimitRange
metadata:
  name: preview
  namespace: preview-123
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi

---
# Source: applications/templates/flaresolverr.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-flaresolverr
  namespace: preview-123
  labels:
    app.kubernetes.io/name: smoke-flaresolverr
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "12"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-flaresolverr
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.22.0
          env:
            - name: URL
              value: "http://flaresolverr.preview-123.svc.cluster.local:8191/"
          command: ["sh", "-c"]
          args:
            - |
              code=$(curl -sL --max-redirs 5 -o /dev/null -w '%{http_code}' --retry 30 --retry-delay 10 --retry-all-errors --max-time 20 "$URL")
              echo "smoke flaresolverr: $URL -> HTTP $code"
              case "$code" in 200) exit 0;; *) exit 1;; esac
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

