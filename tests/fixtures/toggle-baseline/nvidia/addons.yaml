# Source: addons/templates/traefik-external.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-external
  namespace: argocd
  annotations:
    # Sync wave 6: After traefik-external-dependencies (wave 5) creates secrets
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.7
    helm:
      releaseName: traefik-external
      values: |
        # IngressClass configuration
        ingressClass:
          name: external
          isDefaultClass: false

        deployment:
          replicas: 2

        service:
          type: LoadBalancer
          annotations:
            io.cilium/lb-ipam-ips: 192.168.1.200
            port-forwarding.your-domain.com/enable: "true"
          spec:
            externalTrafficPolicy: Cluster

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
            ingressClass: external
          # Enable cross-namespace references for middlewares
          kubernetesCRD:
            allowCrossNamespace: true
            ingressClass: external

        ports:
          web:
            port: 8000
            exposedPort: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 8443
            exposedPort: 443
            expose:
              default: true
            asDefault: true
            http:
              tls:
                enabled: true
            transport:
              respondingTimeouts:
                idleTimeout: 600s
                readTimeout: 0
                writeTimeout: 0
          traefik:
            port: 9000
            expose:
              default: true
        additionalArguments:
          - --global.checknewversion=false
          - --global.sendanonymoususage=false
        experimental:
          plugins:
            traefikoidc:
              moduleName: github.com/lukaszraczylo/traefikoidc
              version: v0.8.24

        env:
          []
        volumes:
          - mountPath: /etc/traefik/oidc/google
            name: google-oauth-credentials
            type: secret
          - mountPath: /etc/traefik/oidc/session
            name: oidc-session-key
            type: secret

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: false

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.your-domain.com`)
            entryPoints:
              - websecure
            tls:
              secretName: traefik-dashboard-tls

        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 2Gi
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-external
                app.kubernetes.io/name: traefik
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 3
          metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 80
                  type: Utilization
              type: Resource

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
---
