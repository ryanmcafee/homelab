            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: nfs
            mountOptions:
              - nfsvers=4
              - noatime

        controller:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

        node:
          driver:
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            extraEnv:
              - name: TRUENAS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: truenas-api-key
                    key: api_key

