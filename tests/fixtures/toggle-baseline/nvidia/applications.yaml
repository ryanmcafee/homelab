# Source: applications/templates/plex.yaml
# Plex Application: deploys the media server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
    chart: plex-media-server
    targetRevision: 1.5.0
    helm:
      releaseName: plex
      values: |
        image:
          pullPolicy: IfNotPresent
          registry: index.docker.io
          repository: plexinc/pms-docker
          tag: latest
        extraEnv:
          ADVERTISE_IP: https://plex.your-domain.com:443
          CHANGE_CONFIG_DIR_OWNERSHIP: "false"
          PLEX_GID: "100"
          PLEX_UID: "568"
          TZ: America/New_York
        runtimeClassName: nvidia
        nodeSelector:
          feature.node.kubernetes.io/pci-10de.present: "true"
        pms:
          claimSecret:
            key: plex-claim-token
            name: plex
          configExistingClaim: plex-config-iscsi
          gpu:
            nvidia:
              enabled: true
          resources:
            limits:
              cpu: 4000m
              memory: 16Gi
            requests:
              cpu: 4000m
              memory: 16Gi
          storageClassName: democratic-csi-iscsi
        extraVolumes:
          - name: movies
            nfs:
              path: /mnt/storage/movies
              server: truenas.your-domain.com
          - name: tv
            nfs:
              path: /mnt/storage/tv
              server: truenas.your-domain.com
          - name: music
            nfs:
              path: /mnt/storage/music
              server: truenas.your-domain.com
          - name: pictures
            nfs:
              path: /mnt/storage/pictures
              server: truenas.your-domain.com
        extraVolumeMounts:
          - mountPath: /movies
            name: movies
            readOnly: false
          - mountPath: /tv
            name: tv
            readOnly: false
          - mountPath: /music
            name: music
            readOnly: false
          - mountPath: /pictures
            name: pictures
            readOnly: false
        service:
          annotations:
            io.cilium/lb-ipam-ips: 192.168.1.103
            port-forwarding.your-domain.com/enable: "true"
          externalTrafficPolicy: Local
          port: 32400
          type: LoadBalancer
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: plex.your-domain.com
            external-dns.alpha.kubernetes.io/target: your-subdomain.duckdns.org
          enabled: true
          hosts:
          - host: plex.your-domain.com
            paths:
            - path: /
              pathType: Prefix
          ingressClassName: external
          tls:
          - hosts:
            - plex.your-domain.com
            secretName: plex-tls
          url: https://plex.your-domain.com
        dnsPolicy: "None"
        dnsConfig:
          nameservers:
          - 8.8.8.8
          - 8.8.4.4
          - 10.96.0.10
          options:
          - name: ndots
            value: "5"
          searches:
          - media.svc.cluster.local
          - svc.cluster.local
          - cluster.local

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
