# Source: applications/templates/renovate.yaml
# Renovate Application: deploys the dependency update CronJob
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/renovatebot/charts
    chart: renovate
    targetRevision: 46.49.0
    helm:
      releaseName: renovate
      values: |
        cronjob:
          schedule: "0 */4 * * *"

        envFrom:
          - secretRef:
              name: renovate-token

        renovate:
          config: |
            {
              "$schema": "https://docs.renovatebot.com/renovate-schema.json",
              "platform": "github",
              "repositories": ["ryanmcafee/homelab"],
              "gitAuthor": "Renovate Bot <renovate@ryanmcafee.com>",
              "onboarding": false,
              "requireConfig": "optional"
            }
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: renovate

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
