# expect: no-ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: never-served
  namespace: default
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
