# expect: openclaw-dead-credential
# Copying charts/paperclip's variable name verbatim. OpenClaw strips
# CLAUDE_CODE_OAUTH_TOKEN before every managed Claude CLI run, so this Instance
# reads as though it has subscription auth and has none.
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  env:
    - name: CLAUDE_CODE_OAUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: openclaw-api-keys
          key: CLAUDE_CODE_OAUTH_TOKEN
          optional: true
