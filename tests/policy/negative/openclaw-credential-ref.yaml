# expect: openclaw-credential-ref
# A credential as a literal value: committed in plain text, and not rotatable
# through the Secret the rest of the stack reads.
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  env:
    - name: ANTHROPIC_API_KEY
      value: sk-ant-not-a-real-key
