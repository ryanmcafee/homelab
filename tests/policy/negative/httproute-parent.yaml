# expect: httproute-parent
# Attached to the http listener, which only redirects: the route never serves.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - sonarr.example.com
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
