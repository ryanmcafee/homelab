apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: sonarr
    targetRevision: "25.6.3"
    helm:
      releaseName: sonarr
      values: |
        route:
          main:
            enabled: true
            parentRefs:
              - name: envoy-internal
                namespace: envoy-gateway-system
                sectionName: https
            hostnames:
              - sonarr.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
