# What charts/openclaw renders with its committed values, plus the anthropic
# API-key toggle on: exactly one extra variable, wired the same way, and a
# provider allowlist that only names variables the Instance declares.
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-api-keys
          key: ANTHROPIC_API_KEY
          optional: true
    - name: ANTHROPIC_OAUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: openclaw-api-keys
          key: ANTHROPIC_OAUTH_TOKEN
          optional: true
  config:
    mergeMode: merge
    forcePaths:
      - gateway
      - models.providers
    raw:
      models:
        providers:
          anthropic:
            apiKey: ${ANTHROPIC_OAUTH_TOKEN}
      agents:
        defaults:
          model:
            primary: anthropic/claude-opus-5-5
---
# The tailnet-only endpoint charts/openclaw renders with tailnet.enabled: the
# Tailscale operator's IngressClass, openclaw's own ACL tag, and a Service that
# stays ClusterIP. Nothing here may flag: this is the shape the exposure rules
# are steering toward.
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
spec:
  networking:
    service:
      type: ClusterIP
    ingress:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/hostname: openclaw
        tailscale.com/tags: tag:k8s-openclaw
      hosts:
        - host: openclaw.example-tailnet.ts.net
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - openclaw.example-tailnet.ts.net
  security:
    networkPolicy:
      enabled: true
      allowedIngressNamespaces:
        - tailscale
