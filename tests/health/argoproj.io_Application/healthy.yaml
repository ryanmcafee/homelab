# expect: Healthy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app.kubernetes.io/instance: addons
spec:
  project: default
  source:
    repoURL: https://github.com/ryanmcafee/homelab.git
    path: charts/addons
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
status:
  health:
    status: Healthy
  sync:
    status: Synced
