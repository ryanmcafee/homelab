# Secrets consumed by the rendered graph but produced outside it, for
# `homelab verify gitops` (rule gitops/<env>/secret-refs).
#
# The linter resolves a secret reference against rendered Secret,
# OnePasswordItem, Certificate and ExternalSecret objects. Anything created by
# an upstream Helm chart, by an operator at runtime, or by the SOPS/ksops
# bootstrap has to be declared here instead.
#
# Fields: name (required), namespace (required; "*" matches any namespace),
# reason (required — every exception must stay auditable).
---
secrets:
  - name: sops-age-key
    namespace: argocd
    reason: >-
      Decrypted from charts/secrets/onepassword by the ksops/kustomize
      Application (sops-secrets, bootstrap wave -2) rather than templated by a
      Helm chart, so it never appears in a rendered manifest. The ArgoCD
      repo-server mounts it to decrypt SOPS-encrypted sources.
