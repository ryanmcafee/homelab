# Exceptions to the secret wiring rule for `homelab verify gitops`
# (rule gitops/<env>/secret-refs). Every entry needs a reason: each one is a
# hole in the rule and has to justify itself.
#
# The linter resolves a secret reference against rendered Secret,
# OnePasswordItem, Certificate and ExternalSecret objects. Two things cannot be
# settled that way, and both are declared here.
---
# 1. Secrets consumed by the graph but produced outside it: by an upstream Helm
#    chart, by an operator at runtime, or by the SOPS/ksops bootstrap.
#
# Fields: name (required), namespace (required; "*" matches any namespace),
# reason (required).
secrets:
  - name: sops-age-key
    namespace: argocd
    reason: >-
      Decrypted from charts/secrets/onepassword by the ksops/kustomize
      Application (sops-secrets, bootstrap wave -2) rather than templated by a
      Helm chart, so it never appears in a rendered manifest. The ArgoCD
      repo-server mounts it to decrypt SOPS-encrypted sources.
  - name: paperclip-postgres-app
    namespace: paperclip
    reason: >-
      Generated by the CloudNativePG operator from bootstrap.initdb of Cluster
      paperclip-postgres (charts/paperclip-database): username, password, dbname,
      host, port, uri and jdbc-uri for the application owner. The paperclip
      Instance reads the uri key as DATABASE_URL, so no credential is ever
      templated or stored in 1Password.
  - name: argo-workflows-postgres-app
    namespace: argo-workflows
    reason: >-
      Generated by the CloudNativePG operator from bootstrap.initdb of Cluster
      argo-workflows-postgres (charts/argo-workflows-dependencies): username and
      password for owner argo of database argo. The controller reads both keys as
      persistence.postgresql.userNameSecret and passwordSecret, so no credential
      is templated or stored in 1Password.

# 2. Reference keys that name an OUTPUT rather than an input. The linter treats
#    a map key ending in SecretRef, a bare secretName, a *Secret holding a
#    {name: …} map and a *Secrets list as Secrets the object reads; these are
#    Secrets the controller or the child chart writes, so requiring a producer
#    for them would be a guaranteed false positive.
#
# Fields: key (required), path (optional; matches only references whose path
# ends with it, and must itself end in key), reason (required).
outputRefKeys:
  - key: privateKeySecretRef
    reason: >-
      cert-manager stores the ACME account key here the first time it registers
      an account with the ACME server (Issuer/ClusterIssuer
      spec.acme.privateKeySecretRef). Nothing in the repo creates it, and
      nothing should.
  - key: secretName
    path: alertmanager.notifications.secretName
    reason: >-
      The name the prometheus-config child chart gives the OnePasswordItem it
      renders (charts/prometheus-config/templates/alertmanager-notifications.yaml),
      passed down by the prometheus-config Application. It is the producer's own
      name, not a reference, and localdev sets an empty onePasswordItemPath so
      nothing renders and nothing mounts it there.
  - key: secretName
    path: githubPrAlerts.secretName
    reason: >-
      Same shape as alertmanager.notifications.secretName: the name
      charts/prometheus-config/templates/github-pr-alerts.yaml gives the
      OnePasswordItem it renders for the github-pr-exporter token, not a Secret
      the Application reads.
