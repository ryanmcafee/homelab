# CRD providers for `homelab verify gitops` (rule gitops/<env>/crd-order).
#
# Each entry maps a Kubernetes API group to the ArgoCD Application that
# installs that group's CustomResourceDefinitions. The linter then requires
# every rendered custom resource in the group to sync strictly after that
# Application, comparing (parent wave, wave) pairs.
#
# Two forms are accepted:
#   <apiGroup>: <application name>
#   <apiGroup>:
#     app: <default application name>
#     kinds:      { <Kind>: <application name> }   # per-kind override
#     skipKinds:  [ <Kind>, ... ]                  # not ordered at all
---
providers:
  cert-manager.io: cert-manager
  # envoy-gateway-crds (wave 4) installs them; the controller renders with skipCrds.
  gateway.envoyproxy.io: envoy-gateway-crds
  onepassword.com: onepassword-operator
  tailscale.com: tailscale-operator
  cilium.io: cilium
  postgresql.cnpg.io: cloudnative-pg
  barmancloud.cnpg.io: cnpg-barman-cloud
  # paperclip-operator ships its CRDs as chart templates (crds.install); the
  # paperclip Application (wave 14) renders the Instance after it (wave 11).
  paperclip.inc: paperclip-operator
  # altinity-clickhouse-operator ships its CRDs in the chart's crds/ directory
  # (crdHook off); charts/clickhouse (wave 11) renders the installation after it (10).
  clickhouse.altinity.com: clickhouse-operator
  # Istio's CRDs (Telemetry, ...) come from the base chart (wave 2); the
  # waypoint Gateway and every Gateway/HTTPRoute need the standard Gateway API CRDs (wave 1).
  telemetry.istio.io: istio-base
  gateway.networking.k8s.io: gateway-api-crds
  # The CRD-only companion chart in the bootstrap chart (wave -1) installs the
  # monitoring CRDs; kube-prometheus-stack (addons wave 9) runs with
  # crds.enabled=false, so ArgoCD (wave 1) and cert-manager (wave 4) can render
  # their ServiceMonitors.
  monitoring.coreos.com: prometheus-operator-crds
  # external-dns ships crds/dnsendpoint.yaml inside the chart (verified against
  # external-dns 1.21.1, the version pinned in configuration/versions.yaml), so
  # every Application using that chart installs the DNSEndpoint CRD: helm and
  # ArgoCD apply a chart's crds/ directory unless told otherwise, and none of
  # these Applications sets spec.source.helm.skipCrds. The chart has no
  # crd.create value in this version — the crds/ directory is unconditional.
  # external-dns-cloudflare-crd is the DNSEndpoint consumer (sources: [crd]),
  # so it is named here; it and external-dns-cloudflare share wave 4.
  externaldns.k8s.io: external-dns-cloudflare-crd
  # NACK (wave 11) ships the Stream/Consumer CRDs in its chart's crds/ directory;
  # nats-config (wave 12) renders the stream set strictly after it.
  jetstream.nats.io: nack
  deviceplugin.intel.com: intel-device-plugins-operator
  nvidia.com: nvidia-gpu-operator
  snapshot.storage.k8s.io: democratic-csi

  # argoproj.io carries the app-of-apps control plane, Argo Workflows, Argo
  # Rollouts and Argo Events custom resources, so it is the group with more than
  # one provider. Application/AppProject/ApplicationSet CRDs come from the ArgoCD
  # install that is already running when these manifests are applied, so they are
  # exempt; Workflow-family resources are provided by the argo-workflows
  # Application and are ordered normally. The progressive-delivery kinds are named
  # individually against argo-rollouts (wave 2) and the Argo Events kinds against
  # argo-events rather than by moving `app`, because the three Applications are
  # independently enabled: argo-rollouts and argo-events run in Kind and
  # argo-workflows does not.
  argoproj.io:
    app: argo-workflows
    kinds:
      Rollout: argo-rollouts
      AnalysisTemplate: argo-rollouts
      ClusterAnalysisTemplate: argo-rollouts
      AnalysisRun: argo-rollouts
      Experiment: argo-rollouts
      EventBus: argo-events
      EventSource: argo-events
      Sensor: argo-events
    skipKinds:
      - Application
      - AppProject
      - ApplicationSet

# Namespaces the cluster always provides. An Application may target one of
# these without a rendered Namespace or CreateNamespace=true
# (rule gitops/<env>/namespaces).
systemNamespaces:
  - argocd
  - default
  - kube-node-lease
  - kube-public
  - kube-system
