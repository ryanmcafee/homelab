# Applications whose non-major Renovate bumps may automerge although their
# rendered manifests change. The upgrade/automerge-gate (.github/workflows/upgrade.yml)
# still requires a successful render, CRD revalidation and declared helm values,
# and every other Application must render unchanged.
applications:
  - name: plex
    reason: >-
      Stateless media server whose upstream ships frequent minor and patch
      releases; a bad release is rolled back by reverting the versions.yaml bump.
  - name: sonarr
    reason: &media >-
      Media app whose TrueCharts chart moves with every upstream release; config
      lives on its PVC and a bad release is rolled back by reverting the bump.
  - name: radarr
    reason: *media
  - name: prowlarr
    reason: *media
  - name: nzbget
    reason: *media
  - name: tautulli
    reason: *media
  - name: lazylibrarian
    reason: *media
  - name: flaresolverr
    reason: *media
  - name: mosquitto
    reason: >-
      MQTT broker from the same TrueCharts release train; a bad release is
      rolled back by reverting the versions.yaml bump.
  - name: home-assistant
    reason: >-
      TrueCharts app on the same release train; a bad release is rolled back by
      reverting the versions.yaml bump.
