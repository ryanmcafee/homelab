# promtool unit tests for the slow tier of the platform-red-v1 rules
# (docs/runbooks/platform-red-slo.md); the other tiers are in platform-red-slo.test.yaml.
# Each case runs to 3d30m, so they evaluate every 10m instead of every 1m.
rule_files:
  - rules.yaml

evaluation_interval: 10m

# A 10m step is past the 5m lookback, so the alerts must read this step's recordings.
group_eval_order:
  - platform-red-v1-sli-short
  - platform-red-v1-sli-long
  - platform-red-v1-slo

tests:
  # Slow tier over 3d: breached-api errors at 2.0% (a 4x burn) and warns;
  # compliant-api errors at 0.40%, inside its 0.50% budget, and stays silent.
  - interval: 10m
    name: slow tier warns on a 4x burn and not on a compliant service
    input_series:
      - series: 'platform_request_duration_seconds_count{service="breached-api",environment="prod",tenant="local",kind="http",route="POST /api/events",outcome="success",job="breached-api",namespace="platform",pod="breached-api-abc",container="app",endpoint="metrics"}'
        values: '0+588x440'
      - series: 'platform_request_duration_seconds_count{service="breached-api",environment="prod",tenant="local",kind="http",route="POST /api/events",outcome="error",code="unavailable",job="breached-api",namespace="platform",pod="breached-api-abc",container="app",endpoint="metrics"}'
        values: '0+12x440'
      - series: 'platform_request_duration_seconds_count{service="compliant-api",environment="prod",tenant="local",kind="http",route="GET /api/issues/:id",outcome="success",job="compliant-api",namespace="platform",pod="compliant-api-def",container="app",endpoint="metrics"}'
        values: '0+996x440'
      - series: 'platform_request_duration_seconds_count{service="compliant-api",environment="prod",tenant="local",kind="http",route="GET /api/issues/:id",outcome="error",code="internal",job="compliant-api",namespace="platform",pod="compliant-api-def",container="app",endpoint="metrics"}'
        values: '0+4x440'
    promql_expr_test:
      - expr: platform:request_error:ratio_rate3d
        eval_time: 3d30m
        exp_samples:
          - labels: 'platform:request_error:ratio_rate3d{service="breached-api",environment="prod",tenant="local",kind="http"}'
            value: 0.02
          - labels: 'platform:request_error:ratio_rate3d{service="compliant-api",environment="prod",tenant="local",kind="http"}'
            value: 0.004
    alert_rule_test:
      - eval_time: 3d30m
        alertname: PlatformRequestErrorBudgetBurningSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: platform-http-availability
              service: breached-api
              environment: prod
              tenant: local
              kind: http
            exp_annotations:
              summary: 'breached-api is burning its 99.5% availability budget'
              description: 'breached-api (prod/local) is above its 99.5% availability objective over a multi-day window (2% errors). Runbook: docs/runbooks/platform-red-slo.md.'

  # Each slow branch on its own. burst-api served 100 req/min cleanly for 2d,
  # then 10 req/min at 2% errors: 1d/2h burn at 4x while the 3d ratio is
  # diluted to ~0.1%, so only the 3x branch can fire. steady-api errs at 1%
  # throughout: under the 3x threshold, over the 1x one, so only that branch can.
  - interval: 10m
    name: each slow branch fires on its own
    input_series:
      - series: 'platform_request_duration_seconds_count{service="burst-api",environment="prod",tenant="local",kind="http",route="POST /api/events",outcome="success",job="burst-api",namespace="platform",pod="burst-api-abc",container="app",endpoint="metrics"}'
        values: '0+1000x288 288098+98x150'
      - series: 'platform_request_duration_seconds_count{service="burst-api",environment="prod",tenant="local",kind="http",route="POST /api/events",outcome="error",code="unavailable",job="burst-api",namespace="platform",pod="burst-api-abc",container="app",endpoint="metrics"}'
        values: '0x288 2+2x150'
      - series: 'platform_request_duration_seconds_count{service="steady-api",environment="prod",tenant="local",kind="http",route="GET /api/issues/:id",outcome="success",job="steady-api",namespace="platform",pod="steady-api-def",container="app",endpoint="metrics"}'
        values: '0+99x440'
      - series: 'platform_request_duration_seconds_count{service="steady-api",environment="prod",tenant="local",kind="http",route="GET /api/issues/:id",outcome="error",code="internal",job="steady-api",namespace="platform",pod="steady-api-def",container="app",endpoint="metrics"}'
        values: '0+1x440'
    promql_expr_test:
      - expr: platform:request_error:ratio_rate1d > bool (3 * 0.005)
        eval_time: 3d30m
        exp_samples:
          - labels: '{service="burst-api",environment="prod",tenant="local",kind="http"}'
            value: 1
          - labels: '{service="steady-api",environment="prod",tenant="local",kind="http"}'
            value: 0
      - expr: platform:request_error:ratio_rate3d > bool (1 * 0.005)
        eval_time: 3d30m
        exp_samples:
          - labels: '{service="burst-api",environment="prod",tenant="local",kind="http"}'
            value: 0
          - labels: '{service="steady-api",environment="prod",tenant="local",kind="http"}'
            value: 1
    alert_rule_test:
      - eval_time: 3d30m
        alertname: PlatformRequestErrorBudgetBurningSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: platform-http-availability
              service: burst-api
              environment: prod
              tenant: local
              kind: http
            exp_annotations:
              summary: 'burst-api is burning its 99.5% availability budget'
              description: 'burst-api (prod/local) is above its 99.5% availability objective over a multi-day window (2% errors). Runbook: docs/runbooks/platform-red-slo.md.'
          - exp_labels:
              severity: warning
              slo: platform-http-availability
              service: steady-api
              environment: prod
              tenant: local
              kind: http
            exp_annotations:
              summary: 'steady-api is burning its 99.5% availability budget'
              description: 'steady-api (prod/local) is above its 99.5% availability objective over a multi-day window (1% errors). Runbook: docs/runbooks/platform-red-slo.md.'
