# Sources for vendored CRD JSON schemas.
#
# Each source describes where to fetch one or more Kubernetes CustomResourceDefinitions
# from and which `spec.names.kind` values to keep. Chart versions are NEVER hard-coded
# here — `versionKey` looks up `charts.<versionKey>` in configuration/versions.yaml so a
# Renovate bump there is the single source of truth. Regenerate with:
#
#   task schemas:vendor
#
# See tests/schemas/README.md for the full mechanics and how to add a new kind.
sources:
  # Vendor only kinds that are rendered today (plus what issue #260 needs); this keeps
  # tests/schemas/ from carrying multi-megabyte schemas for kinds nothing renders yet.
  # Workflow and WorkflowTemplate are real, legitimately huge upstream CRDs (multi-MB
  # each) — re-add them (to the relevant source's `kinds` list below) the moment a
  # chart actually renders one. ApplicationSet is rendered by charts/gitops in homelab
  # (templates/previews-applicationset.yaml, #261 Section C).
  - name: argo-cd
    versionKey: argocd
    chart:
      repo: https://argoproj.github.io/argo-helm
      name: argo-cd
    kinds: [Application, AppProject, ApplicationSet]

  - name: argo-workflows
    versionKey: argo-workflows
    # The argo-workflows chart does NOT bundle full-schema CRDs by default
    # (values.crds.full=true, the chart default) — it ships "minimal" CRDs with
    # x-kubernetes-preserve-unknown-fields and downloads the real, fully-schema'd
    # CRDs at install time via a pre-install Job from this exact GitHub path, tagged
    # `argo-workflows-<chart version>` in the argoproj/argo-helm repo. Vendoring from
    # the chart itself (as originally drafted) would only produce the weak/minimal
    # schemas, so this source fetches what the cluster actually installs.
    github:
      repo: argoproj/argo-helm
      ref: "argo-workflows-{version}"
      paths:
        - charts/argo-workflows/files/crds/full
    kinds: [CronWorkflow, WorkflowTemplate]

  - name: cert-manager
    versionKey: cert-manager
    chart:
      repo: https://charts.jetstack.io
      name: cert-manager
    # cert-manager's CRDs live under templates/ gated by .Values.crds.enabled, not the
    # special crds/ chart directory, so `helm show crds` returns nothing for this chart
    # and the `helm template --include-crds` fallback is required.
    helmArgs: ["--set", "crds.enabled=true"]
    kinds: [Certificate, ClusterIssuer, Issuer]

  - name: envoy-gateway
    versionKey: envoy-gateway
    # OCI-only chart holding the CRDs the controller chart skips; its templates are
    # gated per group, the standard Gateway API CRDs come from the gateway-api source.
    chart:
      repo: oci://docker.io/envoyproxy
      name: gateway-crds-helm
    helmArgs: ["--set", "crds.envoyGateway.enabled=true", "--set", "crds.gatewayAPI.enabled=false"]
    kinds: [EnvoyProxy, Backend, ClientTrafficPolicy, BackendTrafficPolicy, SecurityPolicy, EnvoyExtensionPolicy]

  - name: altinity-clickhouse-operator
    versionKey: altinity-clickhouse-operator
    chart:
      repo: https://helm.altinity.com
      name: altinity-clickhouse-operator
    kinds: [ClickHouseInstallation]

  - name: istio-base
    versionKey: istio
    chart:
      repo: https://blob.istio.io/istio-release/charts
      name: base
    kinds: [Telemetry]

  - name: gateway-api
    versionKey: gateway-api
    github:
      repo: kubernetes-sigs/gateway-api
      ref: "{version}"
      paths:
        - config/crd/standard
    kinds: [Gateway, GatewayClass, HTTPRoute, ReferenceGrant]

  - name: onepassword-connect
    versionKey: onepassword-connect
    chart:
      repo: https://1password.github.io/connect-helm-charts
      name: connect
    kinds: [OnePasswordItem]

  - name: external-dns
    versionKey: external-dns
    chart:
      repo: https://kubernetes-sigs.github.io/external-dns/
      name: external-dns
    # DNSEndpoint's CRD template is gated by .Values.crd.create.
    helmArgs: ["--set", "crd.create=true"]
    kinds: [DNSEndpoint]

  - name: cilium
    versionKey: cilium
    # Cilium does not publish CRDs through its Helm chart at all; the CRDs live in the
    # main cilium/cilium repo, split across a v2 and a v2alpha1 directory.
    github:
      repo: cilium/cilium
      ref: "v{version}"
      paths:
        - pkg/k8s/apis/cilium.io/client/crds/v2
        - pkg/k8s/apis/cilium.io/client/crds/v2alpha1
    kinds:
      [
        CiliumLoadBalancerIPPool,
        CiliumL2AnnouncementPolicy,
        CiliumBGPClusterConfig,
        CiliumBGPPeerConfig,
        CiliumBGPAdvertisement,
      ]

  - name: tailscale-operator
    versionKey: tailscale-operator
    chart:
      repo: https://pkgs.tailscale.com/helmcharts
      name: tailscale-operator
    # The Connector/ProxyClass CRD templates are gated by .Values.installCRDs.
    helmArgs: ["--set", "installCRDs=true"]
    kinds: [Connector, ProxyClass]

  - name: cloudnative-pg
    versionKey: cloudnative-pg
    chart:
      repo: https://cloudnative-pg.github.io/charts
      name: cloudnative-pg
    kinds: [Cluster, Pooler, ScheduledBackup, Backup]

  - name: kube-prometheus-stack
    versionKey: kube-prometheus-stack
    chart:
      repo: https://prometheus-community.github.io/helm-charts
      name: kube-prometheus-stack
    kinds: [ServiceMonitor, PodMonitor, PrometheusRule]

  - name: plugin-barman-cloud
    versionKey: plugin-barman-cloud
    chart:
      repo: https://cloudnative-pg.github.io/charts
      name: plugin-barman-cloud
    # The ObjectStore CRD is a template gated by .Values.crds.create (default true), so
    # `helm show crds` is empty and the `helm template --include-crds` fallback applies.
    kinds: [ObjectStore]

  - name: paperclip-operator
    versionKey: paperclip-operator
    # paperclip-operator is published ONLY as an OCI artifact (no https index), so
    # `chart.repo` is an oci:// registry path and the script runs
    # `helm pull oci://.../paperclip-operator` instead of `--repo`. Its CRDs are
    # templates under templates/crds/ gated by .Values.crds.install (default true), so
    # `helm show crds` is empty and the `helm template --include-crds` fallback applies.
    # Only Instance is rendered by this repo (PaperclipClusterDefaults and
    # PaperclipSelfConfig are not), so only Instance is vendored.
    chart:
      repo: oci://ghcr.io/paperclipinc/charts
      name: paperclip-operator
    kinds: [Instance]
