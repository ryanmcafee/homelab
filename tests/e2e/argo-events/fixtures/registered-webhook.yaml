---
# The ValidatingWebhookConfiguration argo-events registers at runtime, captured from the
# level-2 job of run 36413556910 at 1954632. The webhook process creates this object itself,
# so it is not in any chart and no render gate can read it; this copy is what the offline
# fixtures in scripts/argo-events-webhook-guard_test.ts mutate.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validator.argo-events.argoproj.io
  # Owned by a chart resource, so pruning the ClusterRole garbage-collects this object.
  ownerReferences:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      name: argo-events-webhook
      controller: true
      blockOwnerDeletion: true
webhooks:
  - name: webhook.argo-events.argoproj.io
    admissionReviewVersions: ["v1"]
    failurePolicy: Ignore
    sideEffects: None
    timeoutSeconds: 10
    clientConfig:
      service:
        name: events-webhook
        namespace: argo-events
        port: 443
        path: /validate
    rules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["eventbus"]
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["eventsources"]
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["sensors"]
