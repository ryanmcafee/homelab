---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argo-events
spec:
  description: >-
    The Argo Events bus is reconciled rather than merely applied: the controller and the
    admission webhook are available, and the EventBus named `default` has been turned into a
    running JetStream StatefulSet whose ready replicas match the configured count. All three
    argoproj.io kinds here preserve unknown fields, so a spec the controller silently ignores
    is indistinguishable from one it honoured until something asserts the workload it produced.
  steps:
    - name: applications-healthy
      description: argo-events and argo-events-config are Synced and Healthy.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: argo-events
                namespace: argocd
              status:
                health:
                  status: Healthy
                sync:
                  status: Synced
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: argo-events-config
                namespace: argocd
              status:
                health:
                  status: Healthy
                sync:
                  status: Synced

    # The admission webhook is the only validation these CRDs have: spec and status are both
    # x-kubernetes-preserve-unknown-fields, so the API server accepts any spec and the
    # vendored kubeconform schemas can confirm the kind and nothing else. It ships disabled
    # upstream and is enabled here, so its availability is part of the contract.
    - name: controller-and-webhook-available
      description: The events controller and the admission webhook are both Available.
      try:
        # The JMESPath filter selects the one condition; a bare `conditions:` list is
        # compared whole and fails with "lengths of slices don't match" against a
        # Deployment that also reports Progressing.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: argo-events-controller-manager
                namespace: argo-events
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: events-webhook
                namespace: argo-events
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            namespace: argo-events
        - podLogs:
            namespace: argo-events
            tail: 100

    # Rendering with webhook.enabled=true produces no ValidatingWebhookConfiguration: the
    # webhook process registers itself at runtime. Its rules and failurePolicy are therefore
    # cluster state ArgoCD cannot diff or prune and no level 0 gate can read -- and argoproj.io
    # is the group ArgoCD's own Application and AppProject live in, so a Fail policy across the
    # whole group would turn a webhook outage into a GitOps outage.
    - name: webhook-scope-and-failure-policy
      description: >-
        Record the admission webhook's registered rules and failurePolicy, and refuse a
        registration that can take ArgoCD's own resources down with the webhook.
      try:
        - script:
            timeout: 3m
            content: |
              set -eu

              i=0
              name=""
              while [ "$i" -lt 36 ]; do
                name=$(kubectl get validatingwebhookconfiguration \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                  | grep -i 'events' | head -1 || true)
                [ -n "$name" ] && break
                i=$((i + 1))
                sleep 5
              done

              if [ -z "$name" ]; then
                echo "FAIL: webhook.enabled is true but no ValidatingWebhookConfiguration was registered"
                kubectl get validatingwebhookconfiguration || true
                kubectl logs -n argo-events deployment/events-webhook --tail=80 || true
                exit 1
              fi
              echo "OK: argo-events registered ValidatingWebhookConfiguration/$name"

              echo "--- $name, verbatim ---"
              kubectl get validatingwebhookconfiguration "$name" -o yaml
              echo "-----------------------"

              policies=$(kubectl get validatingwebhookconfiguration "$name" \
                -o jsonpath='{range .webhooks[*]}{.failurePolicy}{"\n"}{end}')
              # Flattened rather than three nested ranges: kubectl's jsonpath yields nothing
              # for `{range .resources[*]}{.}{end}` over an array of plain strings, which
              # emptied this list and left the wildcard test below unable to fire.
              resources=$(kubectl get validatingwebhookconfiguration "$name" \
                -o jsonpath='{.webhooks[*].rules[*].resources[*]}' | tr ' ' '\n')

              echo "failurePolicy per webhook:"; echo "$policies"
              echo "intercepted resources:"; echo "$resources"

              # Anti-vacuity: an empty list would make the wildcard test below pass on any
              # registration at all, which is how the first version of this step reported a
              # bounded blast radius without having read a single resource name.
              if [ -z "$(echo "$resources" | tr -d '[:space:]')" ]; then
                echo "FAIL: read no intercepted resources from $name, so the blast-radius"
                echo "      check below would pass without asserting anything"
                kubectl get validatingwebhookconfiguration "$name" -o yaml || true
                exit 1
              fi

              # A wildcard resource rule under Fail puts ArgoCD's Application and AppProject
              # behind this webhook's availability -- they are argoproj.io too. Either
              # property alone is containable.
              if echo "$resources" | grep -qx '\*' && echo "$policies" | grep -qx 'Fail'; then
                echo "FAIL: the webhook intercepts '*' with failurePolicy: Fail, so a webhook"
                echo "      outage would also block ArgoCD's own Application and AppProject"
                exit 1
              fi
              echo "OK: blast radius bounded -- no wildcard rule under failurePolicy Fail"
      catch:
        - script:
            timeout: 1m
            content: |
              kubectl get validatingwebhookconfiguration -o yaml || true
              kubectl logs -n argo-events deployment/events-webhook --tail=80 || true

    # ArgoCD has no built-in health for argoproj.io/EventBus, so argo-events-config reports
    # Healthy the instant its one manifest applies. The StatefulSet the controller derives
    # from that EventBus is the first thing that can actually fail, which is why readiness is
    # asserted on the workload rather than on the custom resource's own conditions.
    - name: eventbus-reconciled
      description: >-
        The EventBus named default exists and the controller has produced a JetStream
        StatefulSet whose ready replicas match the configured replica count.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: EventBus
              metadata:
                name: default
                namespace: argo-events
        - script:
            timeout: 5m
            content: |
              set -eu

              want=$(kubectl get eventbus.argoproj.io -n argo-events default \
                -o jsonpath='{.spec.jetstream.replicas}')
              case "$want" in
                1|3|5) : ;;
                *) echo "FAIL: EventBus replicas is '$want'; Argo Events accepts only 1, 3 or 5"
                   exit 1 ;;
              esac

              # Argo Events derives the name from the bus: eventbus-<name>-js.
              sts=eventbus-default-js
              i=0
              ready=""
              while [ "$i" -lt 60 ]; do
                ready=$(kubectl get statefulset -n argo-events "$sts" \
                  -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
                [ "${ready:-0}" = "$want" ] && break
                i=$((i + 1))
                sleep 5
              done

              if [ "${ready:-0}" != "$want" ]; then
                kubectl get statefulset -n argo-events "$sts" -o wide || true
                kubectl get pods -n argo-events -o wide || true
                echo "FAIL: $sts has ${ready:-0} ready replicas, want $want"
                echo "      the EventBus was applied but the controller did not bring it up"
                exit 1
              fi
              echo "OK: $sts has $ready/$want ready replicas -- the bus is reconciled, not just applied"

              # Recorded rather than asserted: EventBus status preserves unknown fields, so the
              # condition types are a property of the deployed controller and not of any schema
              # in this repo. Printing them is what lets a later ArgoCD health script key off
              # the real ones instead of guessed ones.
              echo "--- EventBus default status, verbatim ---"
              kubectl get eventbus.argoproj.io -n argo-events default -o yaml | sed -n '/^status:/,$p'
              echo "-----------------------------------------"
      catch:
        - script:
            timeout: 1m
            content: |
              kubectl get eventbus.argoproj.io -n argo-events -o yaml || true
              kubectl get statefulset,pods -n argo-events -o wide || true
              kubectl logs -n argo-events deployment/argo-events-controller-manager \
                --tail=80 || true

    # A reconciled bus still proves nothing about whether an event can cross it. This is the
    # only step that exercises EventSource -> EventBus -> Sensor -> trigger, and the trace is
    # the Sensor's own log line for the trigger it ran.
    - name: trigger-path-trace
      description: >-
        A calendar tick crosses the Argo Events bus and executes the Sensor's trigger, with
        the Sensor's action log as the trace.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: EventSource
              metadata:
                name: trigger-selftest
                namespace: argo-events
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Sensor
              metadata:
                name: trigger-selftest
                namespace: argo-events
        - script:
            timeout: 6m
            content: |
              set -eu

              # Resolved rather than hard-coded: a selector that matches nothing looks
              # identical to a path that never fired, and this suite has already shipped one
              # wrong selector. Both label keys come from the deployed version's const.go
              # (LabelEventSourceName, LabelSensorName).
              find_pod() {
                key=$1
                value=$2
                pod=$(kubectl get pods -n argo-events -l "$key=$value" \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -z "$pod" ]; then
                  pod=$(kubectl get pods -n argo-events \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                    | grep "^${value}-" | head -1 || true)
                fi
                echo "$pod"
              }

              find_deploy() {
                key=$1
                value=$2
                d=$(kubectl get deploy -n argo-events -l "$key=$value" \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -z "$d" ]; then
                  d=$(kubectl get deploy -n argo-events \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                    | grep "^${value}-" | head -1 || true)
                fi
                echo "$d"
              }

              # Wait on the Deployments, not on a pod name resolved beforehand. The
              # EventSource pod crash-loops until eventbus-default-js-svc resolves, and if
              # the controller rolled it rather than restarting it, a wait on the old name
              # would fail while the path was in fact coming up healthy.
              es_deploy=$(find_deploy eventsource-name trigger-selftest)
              sensor_deploy=$(find_deploy sensor-name trigger-selftest)

              if [ -z "$es_deploy" ] || [ -z "$sensor_deploy" ]; then
                echo "FAIL: the controller did not produce both workloads"
                echo "      eventsource deploy='${es_deploy:-<none>}'" \
                     "sensor deploy='${sensor_deploy:-<none>}'"
                kubectl get deploy,pods -n argo-events --show-labels || true
                kubectl logs -n argo-events deployment/argo-events-controller-manager \
                  --tail=120 || true
                exit 1
              fi
              echo "eventsource deployment: $es_deploy"
              echo "sensor deployment:      $sensor_deploy"

              kubectl wait --for=condition=Available "deploy/$es_deploy" \
                -n argo-events --timeout=300s
              kubectl wait --for=condition=Available "deploy/$sensor_deploy" \
                -n argo-events --timeout=300s

              # Resolved only now, so the name belongs to the pod that actually came up.
              es_pod=$(find_pod eventsource-name trigger-selftest)
              sensor_pod=$(find_pod sensor-name trigger-selftest)

              if [ -z "$es_pod" ] || [ -z "$sensor_pod" ]; then
                echo "FAIL: both Deployments are Available but their pods did not resolve"
                echo "      eventsource pod='${es_pod:-<none>}' sensor pod='${sensor_pod:-<none>}'"
                kubectl get pods -n argo-events --show-labels || true
                exit 1
              fi
              echo "eventsource pod: $es_pod"
              echo "sensor pod:      $sensor_pod"

              # Emitted once per trigger the Sensor actually ran, at Info level, by
              # pkg/sensors/listener.go: Infow("Successfully processed trigger '%s'"). Matched
              # in full, including the trigger name, so no other line can satisfy it -- the
              # neighbouring "trigger resource successfully executed" is Debug and never
              # appears at the default level. Polled because the tick interval sets the wait.
              want="Successfully processed trigger 'log-tick'"
              i=0
              hit=""
              while [ "$i" -lt 60 ]; do
                hit=$(kubectl logs -n argo-events "$sensor_pod" --tail=400 2>/dev/null \
                  | grep -F "$want" | head -1 || true)
                [ -n "$hit" ] && break
                i=$((i + 1))
                sleep 5
              done

              if [ -z "$hit" ]; then
                echo "FAIL: no tick reached the Sensor's trigger within the window"
                echo "--- sensor log ---"
                kubectl logs -n argo-events "$sensor_pod" --tail=200 || true
                echo "--- eventsource log ---"
                kubectl logs -n argo-events "$es_pod" --tail=200 || true
                exit 1
              fi

              echo "--- trigger trace, verbatim ---"
              kubectl logs -n argo-events "$sensor_pod" --tail=400 \
                | grep -F "log-tick" | head -10
              echo "-------------------------------"
              echo "OK: a calendar tick crossed the Argo Events bus and ran trigger log-tick"

              # Recorded, not asserted: the Sensor's own view of the bus it connected to, so a
              # later change that silently repoints it at another bus is visible in the log.
              echo "--- eventsource log, last 40 ---"
              kubectl logs -n argo-events "$es_pod" --tail=40 || true
              echo "--------------------------------"
      catch:
        - script:
            timeout: 1m
            content: |
              kubectl get eventsource.argoproj.io,sensor.argoproj.io -n argo-events -o yaml || true
              kubectl get pods -n argo-events --show-labels || true
              kubectl logs -n argo-events deployment/argo-events-controller-manager \
                --tail=120 || true
        - podLogs:
            namespace: argo-events
            tail: 150
