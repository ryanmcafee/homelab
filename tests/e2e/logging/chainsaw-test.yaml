---
# Log and trace pipeline end to end (docs/logging.md, docs/tracing.md): the
# collectors have written container logs into ClickHouse with the retention
# TTL, a span sent over OTLP/HTTP to the gateway collector lands in
# otel_traces, the read-only grafana user (the datasource's) reads both, and a
# syslog line raises the UniFi telemetry counter.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: logging
spec:
  description: >-
    Container logs reach otel.otel_logs with the table TTL set, an OTLP span reaches otel.otel_traces, and a syslog line is counted in homelab_unifi_telemetry_records_total.
  steps:
    - name: applications-healthy
      description: The ArgoCD Applications behind the log pipeline are Healthy and their last sync Succeeded.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: clickhouse-operator
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: clickhouse
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: otel-collector-agent
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: otel-collector-cluster
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: otel-collector-gateway
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kube-prometheus-stack
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: clickhouse-operator
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: clickhouse
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: otel-collector-agent
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: otel-collector-cluster
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: otel-collector-gateway
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: kube-prometheus-stack
            namespace: argocd
    - name: query-clickhouse
      description: >-
        A curl Job in the observability namespace queries ClickHouse over HTTP as
        the grafana user until otel.otel_logs has rows and a TTL.
      timeouts:
        assert: 15m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-clickhouse-logs
                namespace: observability
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 840
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: CLICKHOUSE_URL
                            value: "http://clickhouse-logs.observability.svc.cluster.local:8123/"
                          - name: CLICKHOUSE_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: clickhouse-grafana
                                key: password
                          - name: OTLP_URL
                            value: "http://otel-collector-gateway.observability.svc.cluster.local:4318/v1/traces"
                          - name: TRACE_ID
                            value: "5b8efff798038103d269b633813fc60c"
                          - name: ATTEMPTS
                            value: "40"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            query() {
                              curl -s --max-time 20 -u "grafana:$CLICKHOUSE_PASSWORD" --data-binary "$1" "$CLICKHOUSE_URL"
                            }
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              rows=$(query "SELECT count() FROM otel.otel_logs")
                              echo "attempt $i/$ATTEMPTS: otel.otel_logs rows: $rows"
                              case "$rows" in
                                ''|*[!0-9]*|0) ;;
                                *)
                                  ttl=$(query "SELECT engine_full FROM system.tables WHERE database = 'otel' AND name = 'otel_logs'")
                                  echo "engine: $ttl"
                                  case "$ttl" in *TTL*) break ;; esac
                                  echo "otel_logs has no TTL"
                                  exit 1
                                  ;;
                              esac
                              i=$((i + 1))
                              sleep 10
                            done
                            [ "$i" -le "$ATTEMPTS" ] || { echo "giving up: no rows in otel.otel_logs"; exit 1; }
                            now=$(date +%s)000000000
                            span='{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"e2e"}}]},"scopeSpans":[{"spans":[{"traceId":"'"$TRACE_ID"'","spanId":"eee19b7ec3c1b174","name":"e2e","kind":1,"startTimeUnixNano":"'"$now"'","endTimeUnixNano":"'"$now"'"}]}]}]}'
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Content-Type: application/json' --data "$span" "$OTLP_URL")
                              spans=$(query "SELECT count() FROM otel.otel_traces WHERE TraceId = '$TRACE_ID'")
                              echo "attempt $i/$ATTEMPTS: OTLP HTTP $code, spans for $TRACE_ID: $spans"
                              case "$spans" in ''|*[!0-9]*|0) ;; *) exit 0 ;; esac
                              i=$((i + 1))
                              sleep 10
                            done
                            echo "giving up: the span never reached otel.otel_traces"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-clickhouse-logs
                namespace: observability
              status:
                succeeded: 1
      catch:
        - events:
            namespace: observability
        - podLogs:
            namespace: observability
            selector: job-name=e2e-clickhouse-logs
            tail: 50
        - podLogs:
            namespace: observability
            selector: app.kubernetes.io/instance=otel-collector-agent
            tail: 50
    - name: unifi-telemetry-count
      description: >-
        A syslog line sent to the gateway collector over TCP shows up in the
        count/unifi counter homelab_unifi_telemetry_records_total{source="syslog"},
        which HomelabUniFiTelemetrySilent reads.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-unifi-telemetry-count
                namespace: observability
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 280
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: GATEWAY
                            value: "otel-collector-gateway.observability.svc.cluster.local"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              printf '<134>Sep 24 10:00:00 e2e CEF:0|Ubiquiti|UniFi|1|1|e2e|3|msg=e2e\n' | curl -s --max-time 3 "telnet://$GATEWAY:514" >/dev/null
                              count=$(curl -s --max-time 10 "http://$GATEWAY:8889/metrics" | grep '^homelab_unifi_telemetry_records_total{source="syslog"}')
                              echo "attempt $i/$ATTEMPTS: $count"
                              [ -n "$count" ] && exit 0
                              i=$((i + 1))
                              sleep 10
                            done
                            echo "giving up: no syslog count on $GATEWAY:8889"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-unifi-telemetry-count
                namespace: observability
              status:
                succeeded: 1
      catch:
        - podLogs:
            namespace: observability
            selector: job-name=e2e-unifi-telemetry-count
            tail: 50
        - podLogs:
            namespace: observability
            selector: app.kubernetes.io/instance=otel-collector-gateway
            tail: 50
