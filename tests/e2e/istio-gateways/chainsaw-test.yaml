---
# Generated shape shared by every HTTP e2e test; see tests/e2e/README.md.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: istio-gateways
spec:
  description: >-
    The Istio comparison Gateways are Programmed and the echo HTTPRoute answers echo.homelab.local through both
    istio-internal and envoy-internal.
  steps:
    - name: applications-healthy
      description: The ArgoCD Applications behind this test are Healthy and their last sync Succeeded.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: istio-gateways
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: envoy-gateway-config
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: istio-gateways
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: envoy-gateway-config
            namespace: argocd
    - name: gateways-programmed
      description: >-
        GatewayClasses istio-internal and istio-external are Accepted and the Gateways of the same names in
        istio-ingress are Programmed.
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GatewayClass
              metadata:
                name: istio-internal
              spec:
                controllerName: istio.io/gateway-controller
              status:
                (conditions[?type == 'Accepted']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: istio-internal
                namespace: istio-ingress
              status:
                (conditions[?type == 'Programmed']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GatewayClass
              metadata:
                name: istio-external
              spec:
                controllerName: istio.io/gateway-controller
              status:
                (conditions[?type == 'Accepted']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: istio-external
                namespace: istio-ingress
              status:
                (conditions[?type == 'Programmed']):
                  - status: "True"
      catch:
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            name: istio-internal
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            name: istio-internal
            namespace: istio-ingress
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            name: istio-external
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            name: istio-external
            namespace: istio-ingress
        - events:
            namespace: istio-ingress
    - name: route-echo
      description: HTTPRoute echo is Accepted, with resolved backend refs, by istio-internal and envoy-internal.
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: echo
                namespace: istio-ingress
              status:
                (parents[?parentRef.name == 'istio-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
      catch:
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: echo
            namespace: istio-ingress
        - podLogs:
            namespace: istio-ingress
            selector: app.kubernetes.io/name=echo
            tail: 50
    - name: curl-istio-internal
      description: >-
        A curl Job must get one of [200]
        from https://echo.homelab.local/healthz via istio-internal.istio-ingress.svc.cluster.local.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-istio-internal
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "echo.homelab.local"
                          - name: GATEWAY
                            value: "istio-internal.istio-ingress.svc.cluster.local"
                          - name: URL_PATH
                            value: "/healthz"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-istio-internal
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-istio-internal
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: echo
            namespace: istio-ingress
        - podLogs:
            namespace: istio-ingress
            selector: app.kubernetes.io/name=echo
            tail: 50
    - name: curl-echo-envoy-internal
      description: >-
        A curl Job must get one of [200]
        from https://echo.homelab.local/healthz via envoy-internal.envoy-gateway-system.svc.cluster.local.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-echo-envoy-internal
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "echo.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/healthz"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-echo-envoy-internal
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-echo-envoy-internal
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: echo
            namespace: istio-ingress
        - podLogs:
            namespace: istio-ingress
            selector: app.kubernetes.io/name=echo
            tail: 50
