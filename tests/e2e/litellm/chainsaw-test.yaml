---
# Generated shape shared by every HTTP e2e test; see tests/e2e/README.md.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: litellm
spec:
  description: >-
    The three LiteLLM HTTPRoutes are Accepted by envoy-internal and one hostname
    reaches all three components: the gateway at /health/readiness, the UI at /
    and at a root-level RSC payload, and the backend management API under the
    catch-all.
  steps:
    - name: applications-healthy
      description: The ArgoCD Applications behind this test are Healthy and their last sync Succeeded.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm-database
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm-config
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm-database
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm-config
            namespace: argocd
    - name: routes-litellm
      description: >-
        All three HTTPRoutes for litellm.homelab.local are Accepted by
        envoy-internal and their backend refs resolve.
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-ui
                namespace: litellm
              spec:
                (contains(hostnames, 'litellm.homelab.local')): true
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-gateway
                namespace: litellm
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-backend
                namespace: litellm
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
      catch:
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            namespace: litellm
    - name: curl-litellm-gateway
      description: >-
        A curl Job must get one of [200]
        from https://litellm.homelab.local/health/readiness via envoy-internal.envoy-gateway-system.svc.cluster.local.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-gateway
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/health/readiness"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-gateway
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-gateway
            tail: 50
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm
            namespace: argocd
    - name: curl-litellm-ui
      description: >-
        A curl Job must get one of [200] from https://litellm.homelab.local/,
        which only the UI route serves; the backend catch-all would answer the
        management API instead.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-ui
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-ui
            namespace: litellm
    - name: curl-litellm-backend
      description: >-
        A curl Job must get one of [401 403] from the management API at
        https://litellm.homelab.local/key/info: the request is rejected for
        want of a key, not 404ed by a route that never reaches the backend.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-backend
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/key/info"
                          - name: EXPECT
                            value: "401 403"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-backend
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-backend
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-backend
            namespace: litellm
    - name: curl-litellm-ui-rsc
      description: >-
        A curl Job must get one of [200] from https://litellm.homelab.local/index.txt,
        the root-level RSC payload the dashboard's client router fetches; only the
        UI route's regular-expression match keeps it off the backend catch-all.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui-rsc
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/index.txt"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui-rsc
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-ui-rsc
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-ui
            namespace: litellm
