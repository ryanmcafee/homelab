---
# HTTP steps follow the shape shared by every HTTP e2e test (tests/e2e/README.md).
# The observability steps drive one request through the gateway and require the
# resulting litellm_* series on the sidecar and in Prometheus, because a Healthy
# Application and an `up` target both stay green on an empty registry.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: litellm
spec:
  description: >-
    The three LiteLLM HTTPRoutes are Accepted by envoy-internal and one hostname
    reaches all three components: the gateway at /health/readiness, the UI at /
    and at a root-level RSC payload, and the backend management API under the
    catch-all. The CloudNativePG Cluster litellm-db is healthy, the gateway
    ServiceMonitor scrapes the unauthenticated metrics Service, and a request
    through the gateway raises litellm_proxy_total_requests_metric_total on the
    sidecar and in Prometheus.
  steps:
    - name: applications-healthy
      description: The ArgoCD Applications behind this test are Healthy and their last sync Succeeded.
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm-database
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: litellm-config
                namespace: argocd
              status:
                health:
                  status: Healthy
                operationState:
                  phase: Succeeded
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm-database
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm
            namespace: argocd
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm-config
            namespace: argocd
    - name: routes-litellm
      description: >-
        All three HTTPRoutes for litellm.homelab.local are Accepted by
        envoy-internal and their backend refs resolve.
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-ui
                namespace: litellm
              spec:
                (contains(hostnames, 'litellm.homelab.local')): true
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-gateway
                namespace: litellm
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: litellm-backend
                namespace: litellm
              status:
                (parents[?parentRef.name == 'envoy-internal']):
                  - (conditions[?type == 'Accepted']):
                      - status: "True"
                    (conditions[?type == 'ResolvedRefs']):
                      - status: "True"
      catch:
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            namespace: litellm
    - name: curl-litellm-gateway
      description: >-
        A curl Job must get one of [200]
        from https://litellm.homelab.local/health/readiness via envoy-internal.envoy-gateway-system.svc.cluster.local.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-gateway
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/health/readiness"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-gateway
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-gateway
            tail: 50
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            name: litellm
            namespace: argocd
    - name: curl-litellm-ui
      description: >-
        A curl Job must get one of [200] from https://litellm.homelab.local/,
        which only the UI route serves; the backend catch-all would answer the
        management API instead.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-ui
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-ui
            namespace: litellm
    - name: curl-litellm-backend
      description: >-
        A curl Job must get one of [401 403] from the management API at
        https://litellm.homelab.local/key/info: the request is rejected for
        want of a key, not 404ed by a route that never reaches the backend.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-backend
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/key/info"
                          - name: EXPECT
                            value: "401 403"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-backend
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-backend
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-backend
            namespace: litellm
    - name: curl-litellm-ui-rsc
      description: >-
        A curl Job must get one of [200] from https://litellm.homelab.local/index.txt,
        the root-level RSC payload the dashboard's client router fetches; only the
        UI route's regular-expression match keeps it off the backend catch-all.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui-rsc
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 300
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: HOST
                            value: "litellm.homelab.local"
                          - name: GATEWAY
                            value: "envoy-internal.envoy-gateway-system.svc.cluster.local"
                          - name: URL_PATH
                            value: "/index.txt"
                          - name: EXPECT
                            value: "200"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -sk -o /dev/null -w '%{http_code}' -L --max-redirs 5 --max-time 20 \
                                --connect-to "$HOST:443:$GATEWAY:443" --connect-to "$HOST:80:$GATEWAY:80" \
                                "https://$HOST$URL_PATH")
                              echo "attempt $i/$ATTEMPTS: HTTP $code for https://$HOST$URL_PATH via $GATEWAY"
                              for ok in $EXPECT; do [ "$code" = "$ok" ] && exit 0; done
                              i=$((i + 1))
                              sleep 6
                            done
                            echo "giving up: last HTTP code $code, expected one of: $EXPECT"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: curl-litellm-ui-rsc
              status:
                succeeded: 1
      catch:
        - events: {}
        - podLogs:
            selector: job-name=curl-litellm-ui-rsc
            tail: 50
        - describe:
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            name: litellm-ui
            namespace: litellm
    - name: database-ready
      description: Cluster litellm-db is "Cluster in healthy state", which LiteLLMDatabaseNotReady watches.
      try:
        - assert:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: litellm-db
                namespace: litellm
              status:
                phase: Cluster in healthy state
                readyInstances: 1
      catch:
        - events:
            namespace: litellm
        - describe:
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            name: litellm-db
            namespace: litellm
    - name: metrics-service-and-servicemonitor
      description: >-
        The gateway ServiceMonitor scrapes port metrics at /metrics/ in the litellm namespace, and
        the metrics Service is ClusterIP with that port. fullnameOverride: litellm is what keeps
        these names litellm-gateway{,-metrics}, which every alert label and the dashboard assume.
      try:
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: litellm-gateway
                namespace: litellm
              spec:
                namespaceSelector:
                  matchNames:
                    - litellm
                (endpoints[?port == 'metrics']):
                  - path: /metrics/
                    scheme: http
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: litellm-gateway-metrics
                namespace: litellm
              spec:
                type: ClusterIP
                (ports[?name == 'metrics']):
                  - port: 4001
                    protocol: TCP
      catch:
        - describe:
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            namespace: litellm
        - describe:
            apiVersion: v1
            kind: Service
            namespace: litellm
    - name: gateway-emits-litellm-series
      description: >-
        One /v1/chat/completions call for a model outside model_list raises both
        litellm_proxy_failed_requests_metric_total and litellm_proxy_total_requests_metric_total on
        the sidecar -- the numerator and denominator LiteLLMGatewayErrorRateHigh divides. The proxy
        rejects it with HTTP 400, so nothing leaves the cluster and nothing spends. A real model
        would not do: the seeded provider key is a placeholder, the provider answers 401, and
        LiteLLM drops every Prometheus metric on a 401 (_is_invalid_api_key_request), so no series
        would ever appear. Without litellm_settings.callbacks: [prometheus] the sidecar answers 200
        with no litellm_ series at all.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-litellm-metrics
                namespace: litellm
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 280
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: GATEWAY
                            value: "litellm-gateway.litellm.svc.cluster.local:4000"
                          - name: METRICS
                            value: "litellm-gateway-metrics.litellm.svc.cluster.local:4001"
                          # Not in model_list, so the proxy rejects it with 400 before any egress.
                          - name: MODEL
                            value: "e2e-model-not-in-model-list"
                          - name: MASTER_KEY
                            valueFrom:
                              secretKeyRef:
                                name: litellm-master-key-secret
                                key: master-key
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                                -H "Authorization: Bearer $MASTER_KEY" \
                                -H 'Content-Type: application/json' \
                                -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"e2e\"}]}" \
                                "http://$GATEWAY/v1/chat/completions")
                              scrape=$(curl -s --max-time 10 "http://$METRICS/metrics/")
                              total=$(echo "$scrape" | grep '^litellm_proxy_total_requests_metric_total{')
                              failed=$(echo "$scrape" | grep '^litellm_proxy_failed_requests_metric_total{')
                              echo "attempt $i/$ATTEMPTS: gateway HTTP $code (400 expected)"
                              echo "  total:  $total"
                              echo "  failed: $failed"
                              if [ -n "$total" ] && [ -n "$failed" ]; then
                                exit 0
                              fi
                              i=$((i + 1))
                              sleep 10
                            done
                            echo "giving up: the sidecar never exported both error-rate SLI series"
                            echo "empty registry -> litellm_settings.callbacks must contain prometheus"
                            echo "gateway HTTP 401 -> LiteLLM drops metrics for an invalid key;"
                            echo "  MODEL must fail with 400, not authentication"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-litellm-metrics
                namespace: litellm
              status:
                succeeded: 1
      catch:
        - events:
            namespace: litellm
        - podLogs:
            namespace: litellm
            selector: job-name=e2e-litellm-metrics
            tail: 50
        - podLogs:
            namespace: litellm
            selector: app.kubernetes.io/component=gateway
            tail: 100
    - name: prometheus-scrapes-gateway
      description: >-
        Prometheus picked the ServiceMonitor up: up{job="litellm-gateway-metrics"} is 1 and the
        litellm_ series reached the TSDB. The job label comes from the Service name because the
        ServiceMonitor sets no jobLabel, and three alert rules plus the dashboard group by it.
      timeouts:
        assert: 5m
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-litellm-scrape
                namespace: monitoring
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 280
                template:
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: curl
                        # pinned from configuration/versions.yaml images.curl
                        image: curlimages/curl:8.22.0
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            cpu: 100m
                            memory: 64Mi
                        env:
                          - name: PROMETHEUS
                            value: "kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
                          - name: ATTEMPTS
                            value: "20"
                        command: ["sh", "-c"]
                        args:
                          - |
                            set -u
                            i=1
                            while [ "$i" -le "$ATTEMPTS" ]; do
                              target=$(curl -s --max-time 10 -G "http://$PROMETHEUS/api/v1/query" \
                                --data-urlencode 'query=up{job="litellm-gateway-metrics"} == 1')
                              series=$(curl -s --max-time 10 -G "http://$PROMETHEUS/api/v1/query" \
                                --data-urlencode 'query=count(litellm_proxy_total_requests_metric_total)')
                              echo "attempt $i/$ATTEMPTS"
                              echo "  up: $target"
                              echo "  series: $series"
                              case "$target" in
                                *'"litellm-gateway-metrics"'*)
                                  case "$series" in
                                    *'"value"'*) exit 0 ;;
                                  esac
                                  ;;
                              esac
                              i=$((i + 1))
                              sleep 10
                            done
                            echo "giving up: no up==1 target or no litellm series in Prometheus"
                            echo "check the ServiceMonitor selector and serviceMonitorSelectorNilUsesHelmValues"
                            exit 1
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-litellm-scrape
                namespace: monitoring
              status:
                succeeded: 1
      catch:
        - podLogs:
            namespace: monitoring
            selector: job-name=e2e-litellm-scrape
            tail: 50
        - describe:
            apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            name: litellm-gateway
            namespace: litellm
