---
# Chainsaw configuration for the localdev (Kind + ArgoCD) e2e suite.
# Run with: task test:e2e  (= chainsaw test --config tests/e2e/.chainsaw.yaml tests/e2e)
# Report format/path are left to CLI flags so `homelab verify all --level 2` can choose them.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: homelab-localdev-e2e
spec:
  timeouts:
    apply: 2m
    assert: 10m
    # e2e CNPG Clusters must set stopDelay below this (scripts/e2e-cnpg-cleanup-budget_test.ts).
    cleanup: 3m
    delete: 3m
    error: 2m
    exec: 5m
  execution:
    failFast: false
    parallel: 4
  cleanup:
    skipDelete: false
