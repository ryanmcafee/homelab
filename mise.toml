# mise configuration file
# Manages all CLI tool dependencies for the homelab project
# See: https://mise.jdx.dev/

[tools]
# Infrastructure as Code
terraform = "1.16.2"
terragrunt = "1.0.8"
packer = "latest"

# Kubernetes Tools
kubectl = "1.36.3"
# Pinned, and pinned to the same version as configuration/versions.yaml
# `tools.helm` and .github/workflows/verify.yml HELM_VERSION. The golden
# snapshots in tests/snapshots are byte-exact, so a different helm renders
# different bytes and every snapshot check fails. versions.yaml is the single
# source of truth (it is the Renovate-tracked one); change it and these two
# together.
helm = "4.3.0"
kind = "0.33.0"          # configuration/versions.yaml tools.kind is the source of truth
talosctl = "1.13.8"
tilt = "0.37.3"
argocd = "3.5.2"        # configuration/versions.yaml tools.argocd is the source of truth
argo = "latest"          # Argo Workflows CLI

# Configuration Management (Python via pipx)
"pipx:ansible-core" = "latest"
"pipx:ansible-lint" = "latest"

# Task Runner
task = "latest"

# Go toolchain (docs/runbooks/verification.md and the CI GO_VERSION agree on
# this minor; the level-0 CLI and its tests are built with it)
go = "1.25"

# Utilities
jq = "latest"
yq = "latest"             # YAML processor for extracting chart values
direnv = "latest"
deno = "latest"
"pipx:yamllint" = "latest"
"pipx:pre-commit" = "latest"  # Git hooks framework
"npm:embedme" = "latest"  # Living documentation - embeds code snippets into markdown

# Kubernetes Validation (level-0 static verification: task verify)
kubeconform = "latest"    # Kubernetes manifest schema validation
conftest = "latest"       # Policy-as-code (Rego) over rendered manifests
pluto = "latest"          # Detect deprecated apiVersions ahead of upgrades
"aqua:kyverno/chainsaw" = "0.2.15"  # Declarative Kind e2e tests (task test:e2e); versions.yaml tools.chainsaw

# Secrets Management
op = "latest"          # 1Password CLI for secrets management
age = "latest"         # Modern encryption tool for SOPS
sops = "latest"        # Secrets OPerationS - encrypted secrets management

stern = "latest"         # Multi-pod log streaming (task localdev:logs)

[env]
# Terraform plugin cache
TF_PLUGIN_CACHE_DIR = "{{config_root}}/.terraform.d/plugin-cache"

# 1Password CLI Authentication. The token file only exists on a workstation;
# fall back to an empty value so `mise` still loads this config (and installs
# tools) on CI runners and fresh machines. read_file() would abort instead.
OP_SERVICE_ACCOUNT_TOKEN = '{{ exec(command="cat $HOME/.op/op_service_account_token 2>/dev/null || true") | trim }}'

# Load remaining env vars from .envrc (non-shell substitution vars only)
_.file = ".envrc"

[tasks.validate]
description = "Validate all tools are installed and working"
run = """
echo "Validating mise-managed tools..."
echo ""
echo "Infrastructure Tools:"
terraform version
terragrunt --version
packer version
echo ""
echo "Kubernetes Tools:"
kubectl version --client
helm version
kind version
talosctl version --client
tilt version
argocd version --client
argo version --short
echo ""
echo "Configuration Management:"
ansible --version
echo ""
echo "Task Runner:"
task --version
echo ""
echo "Utilities:"
jq --version
yq --version
direnv --version
kubeconform -v
pre-commit --version
echo ""
echo "Secrets Management:"
op --version
age --version
sops --version
echo ""
echo "✓ All tools validated successfully!"
"""

[tasks.install]
description = "Install all dependencies via mise"
run = "mise install -y"

[tasks.doctor]
description = "Check mise and tool installation status"
run = "mise doctor"
