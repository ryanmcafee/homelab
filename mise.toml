# mise configuration file
# Manages all CLI tool dependencies for the homelab project
# See: https://mise.jdx.dev/

[tools]
# Infrastructure as Code
terraform = "1.16.2"
terragrunt = "1.0.8"
packer = "latest"

# Every CI workflow installs its tools from this file through jdx/mise-action
# (`install_args` names the subset a job needs), so a pin here is the pin CI
# runs with. Pins marked "versions.yaml" must equal configuration/versions.yaml
# tools.* (the Renovate-tracked copy); change both together.

# Kubernetes Tools
kubectl = "1.37.1"        # the Kind loop's node image minor (versions.yaml images.kind-node)
# The golden snapshots in tests/snapshots are byte-exact, so a different helm
# renders different bytes and every snapshot check fails. versions.yaml tools.helm.
helm = "4.3.0"
kind = "0.33.0"           # versions.yaml tools.kind
talosctl = "1.13.8"
tilt = "0.37.7"
argocd = "3.5.3"          # versions.yaml tools.argocd
argo = "latest"           # Argo Workflows CLI

# Configuration Management (Python via pipx); ansible-lint.yml and the
# pre-commit hook run these exact versions.
"pipx:ansible-core" = "2.21.4"
"pipx:ansible-lint" = "26.9.0"

# Task Runner
task = "3.46.4"

# Go toolchain (docs/runbooks/verification.md agrees on this minor; the
# level-0 CLI and its tests are built with it)
go = "1.27.1"

# Utilities
jq = "latest"
yq = "latest"             # YAML processor for extracting chart values
direnv = "latest"
bun = "1.4.2"             # the formatter and test runner pins live in package.json and bun.lock
"pipx:yamllint" = "1.38.0"   # .pre-commit-config.yaml rev must match
"pipx:pre-commit" = "latest"  # Git hooks framework
"npm:embedme" = "latest"  # Living documentation - embeds code snippets into markdown

# Kubernetes Validation (level-0 static verification: task verify)
kubeconform = "0.7.0"     # Kubernetes manifest schema validation
conftest = "0.70.1"       # Policy-as-code (Rego) over rendered manifests
pluto = "5.24.4"          # Detect deprecated apiVersions ahead of upgrades
"aqua:kyverno/chainsaw" = "0.2.15"  # Declarative Kind e2e tests (task test:e2e); versions.yaml tools.chainsaw
# promtool ships inside the prometheus release archive and is the only thing
# this repo uses from it (task test:alerts, docs/runbooks/pf-work-age-expiry.md).
# Keep it on the Prometheus kube-prometheus-stack deploys - the image tag in the
# chart's values, v3.12.0 for chart 87.1.0, not the chart appVersion, which is
# the operator - so a rule that passes here is a rule that server evaluates the
# same way.
"aqua:prometheus/prometheus" = "3.12.0"

# Security scanning (security-scan.yml)
"pipx:checkov" = "3.3.19"

# Secrets Management
op = "latest"          # 1Password CLI for secrets management
age = "latest"         # Modern encryption tool for SOPS
sops = "latest"        # Secrets OPerationS - encrypted secrets management

stern = "latest"         # Multi-pod log streaming (task localdev:logs)

[env]
# Terraform plugin cache
TF_PLUGIN_CACHE_DIR = "{{config_root}}/.terraform.d/plugin-cache"

# 1Password CLI Authentication. The token file only exists on a workstation;
# fall back to an empty value so `mise` still loads this config (and installs
# tools) on CI runners and fresh machines. read_file() would abort instead.
OP_SERVICE_ACCOUNT_TOKEN = '{{ exec(command="cat $HOME/.op/op_service_account_token 2>/dev/null || true") | trim }}'

# Load remaining env vars from .envrc (non-shell substitution vars only)
_.file = ".envrc"

# No [tasks] here: the Taskfile is the task runner. `mise run validate` used to
# print tool versions while `task validate` runs the prerequisite table, and
# `mise run install` / `mise run doctor` duplicated `task install-tools` /
# `task mise:doctor`; the same name meaning two things was a trap.
