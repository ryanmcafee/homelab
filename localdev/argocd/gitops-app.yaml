---
# Root Application for the Kind localdev loop (applied by
# scripts/localdev-argocd.ts install, task localdev:argocd).
#
# The revision and repository values below are placeholders: `install` parses
# this file, rewrites them and applies the result from stdin.
#
# spec.source.targetRevision AND helm.valuesObject.global.targetRevision take
# the resolved revision (--revision / LOCALDEV_REVISION: the PR head SHA in
# CI, the upstream branch of HEAD locally, main only when the branch is not
# pushed). charts/gitops hands that global.targetRevision down to addons and
# applications through helm.valuesObject, so every Application in Kind tracks
# the PR head, not GitHub main.
#
# spec.source.repoURL AND helm.valuesObject.global.repoUrl take
# GITOPS_REPO_URL from configuration/environments/localdev.yaml and are handed
# down the same way, so a fork's Kind loop reconciles the fork and not the
# upstream repository.
#
# Every Application is still synced from the working tree with
# `scripts/localdev-argocd.ts sync` (`argocd app sync --local`), which refuses
# apps with an automated sync policy. Hence NO `automated` block here (and
# ARGOCD_AUTOMATED_SYNC=false in the localdev values for every child). Synced
# after a local sync means the working tree equals the pushed head; OutOfSync
# means it is ahead of (or differs from) that push.
# `task localdev:report -- --base main` compares the live state with the base
# branch (`argocd app diff --revision <base>`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACEME-user/homelab.git
    targetRevision: main
    path: charts/gitops
    helm:
      valueFiles:
        - values.yaml
        - values-localdev.yaml
      valuesObject:
        global:
          targetRevision: main
          repoUrl: https://github.com/REPLACEME-user/homelab.git
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
