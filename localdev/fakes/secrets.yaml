---
# Localdev fakes: seeded Secrets.
#
# In homelab these Secrets are created by the 1Password operator from
# OnePasswordItem resources. Localdev renders with SECRETS_PROVIDER=none, so
# nothing creates them and the consuming workloads would wait on a missing
# Secret. Every Secret that a localdev-enabled Application references by name
# but nothing renders is seeded here with a throwaway value (never a real
# credential). TLS Secrets are NOT seeded: cert-manager's self-signed
# ClusterIssuer creates those.
#
# Namespaces are pre-created with the same labels as
# charts/applications/templates/namespaces.yaml so that the ArgoCD
# server-side apply later shares ownership of identical label values instead
# of conflicting. Applied by `scripts/localdev-kind.ts fakes`.
#
# Inventory (from tests/snapshots/localdev/applications.yaml + addons.yaml):
#   media/plex  key plex-claim-token  <- Plex pms.claimSecret
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: plex
  namespace: media
type: Opaque
stringData:
  # Plex accepts an empty or invalid claim token and starts unclaimed, which is
  # all the e2e /identity check needs.
  plex-claim-token: claim-localdev
