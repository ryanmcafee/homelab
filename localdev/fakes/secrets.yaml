---
# Localdev fakes: seeded Secrets.
#
# In homelab these Secrets are created by the 1Password operator from
# OnePasswordItem resources. Localdev renders with SECRETS_PROVIDER=none, so
# nothing creates them and the consuming workloads would wait on a missing
# Secret. Every Secret that a localdev-enabled Application references by name
# but nothing renders is seeded here with a throwaway value (never a real
# credential). TLS Secrets are NOT seeded: cert-manager's self-signed
# ClusterIssuer creates those.
#
# Namespaces are pre-created with the same labels as
# charts/applications/templates/namespaces.yaml so that the ArgoCD
# server-side apply later shares ownership of identical label values instead
# of conflicting. Applied by `scripts/localdev-kind.ts fakes`.
#
# Inventory (from tests/snapshots/localdev/applications.yaml + addons.yaml):
#   media/plex  key plex-claim-token  <- Plex pms.claimSecret
#   paperclip/paperclip-auth      keys BETTER_AUTH_SECRET, ADMIN_PASSWORD <- Instance spec.auth
#   paperclip/paperclip-api-keys  key CLAUDE_CODE_OAUTH_TOKEN (charts/paperclip adapters.extraSecretEnv); ANTHROPIC_API_KEY / OPENAI_API_KEY only with adapters.apiKeys.<provider>.enabled
#   paperclip/paperclip-exporter  key PAPERCLIP_API_KEY <- charts/paperclip exporter (board API key)
#   observability/clickhouse-otel, observability/clickhouse-grafana,
#   monitoring/clickhouse-grafana     generated by scripts/localdev-kind.ts (see below)
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: plex
  namespace: media
type: Opaque
stringData:
  # Plex accepts an empty or invalid claim token and starts unclaimed, which is
  # all the e2e /identity check needs.
  plex-claim-token: claim-localdev
---
# Paperclip (issue #260): in homelab charts/paperclip-dependencies renders the
# OnePasswordItems paperclip-auth, paperclip-api-keys and paperclip-exporter;
# Kind seeds the three Secrets instead. Labels mirror charts/applications/templates/paperclip.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: paperclip
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: paperclip-auth
  namespace: paperclip
type: Opaque
stringData:
  # Session signing secret and the one-time admin bootstrap password
  # (login: PAPERCLIP_ADMIN_EMAIL of configuration/environments/localdev.yaml).
  BETTER_AUTH_SECRET: localdev-better-auth-secret-0123456789abcdef0123456789abcdef
  ADMIN_PASSWORD: localdev-admin-password
---
apiVersion: v1
kind: Secret
metadata:
  name: paperclip-api-keys
  namespace: paperclip
type: Opaque
stringData:
  # Every credential kind the production item may carry (docs/apps/paperclip.md).
  # charts/paperclip wires the subscription token; each API key stays unread
  # unless its own adapters.apiKeys.<provider>.enabled is flipped on. No agent
  # runs in Kind, so any value does.
  ANTHROPIC_API_KEY: sk-ant-localdev-placeholder
  OPENAI_API_KEY: sk-localdev-placeholder
  CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-localdev-placeholder
---
apiVersion: v1
kind: Secret
metadata:
  name: paperclip-exporter
  namespace: paperclip
type: Opaque
stringData:
  # No board key exists in Kind: the API answers 403, the exporter reports
  # paperclip_up 0 and stays Ready.
  PAPERCLIP_API_KEY: localdev-board-key-placeholder
---
# Cluster logs (docs/logging.md): in homelab charts/clickhouse-dependencies
# renders OnePasswordItems clickhouse-otel and clickhouse-grafana. Their Kind
# counterparts below are stubs: `scripts/localdev-kind.ts fakes` fills the key
# named by homelab.local/generated-key with a random value once, the same one
# for every stub of a homelab.local/generated-group, so no password literal
# lives in git. Namespace labels mirror charts/addons/templates/logging.yaml
# and kube-prometheus-stack.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-otel
  namespace: observability
  annotations:
    homelab.local/generated-key: password
    homelab.local/generated-group: clickhouse-otel
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-grafana
  namespace: observability
  annotations:
    homelab.local/generated-key: password
    homelab.local/generated-group: clickhouse-grafana
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-grafana
  namespace: monitoring
  annotations:
    homelab.local/generated-key: password
    homelab.local/generated-group: clickhouse-grafana
type: Opaque
