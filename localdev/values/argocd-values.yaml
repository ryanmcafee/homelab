---
# ArgoCD values for the Kind localdev loop (issue #261 Section B).
#
# Installed by scripts/localdev-argocd.ts install (task localdev:argocd):
#   helm upgrade --install argocd argo-cd --repo https://argoproj.github.io/argo-helm \
#     --version <configuration/versions.yaml charts.argocd> -n argocd -f this-file \
#     --set-file 'configs.cm.resource\.customizations\.health\.<group>_<kind>=<lua>' ...
#   where <lua> is charts/bootstrap/files/health/<group>_<kind>.lua.
# The health Lua is NOT listed here on purpose: the script injects every file in
# charts/bootstrap/files/health at install time so localdev and homelab
# (charts/bootstrap/templates/argocd.yaml) share one copy.
#
# Every Application is synced from the working tree with `argocd app sync
# --local`, so there is no file:// repo, no hostPath chart mount and no CI
# variant of this file any more. Key names verified against
# `helm show values argo-cd --version 9.5.17`.

global:
  # Not read by the argo-cd chart itself (it creates no PVCs); kept so any
  # subchart or future persistence lands on the Kind default class.
  storageClass: local-path

configs:
  params:
    # Plain HTTP on the NodePort; `argocd login localhost:8080 --plaintext`.
    server.insecure: true
  cm:
    # Poll the repo often: the loop compares the working tree, not GitHub, so
    # a fresher comparison only makes the OutOfSync marker more accurate.
    timeout.reconciliation: 30s
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    exec.enabled: "true"
  rbac:
    # Single admin user for localdev; the CLI logs in with the initial secret.
    policy.default: role:admin

server:
  service:
    type: NodePort
    # Kind maps containerPort 30080 -> host 8080 (localdev/kind-config.yaml).
    # That host mapping works with Docker Engine on Linux but NOT with Docker
    # Desktop + Cilium: the Desktop host-port proxy forwards packets with bad
    # TCP checksums, kindnet tolerated them, Cilium's BPF delivery drops them
    # (every SYN lost, "gRPC connection not ready"). scripts/localdev-argocd.ts
    # therefore never uses it; it spawns
    #   kubectl --context kind-homelab-localdev port-forward -n argocd svc/argocd-server 18080:80
    # for the CLI, and the UI can be reached the same way:
    #   kubectl --context kind-homelab-localdev port-forward -n argocd svc/argocd-server 8080:80
    #   open http://localhost:8080
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

redis-ha:
  enabled: false
