# Kind Cluster Configuration for Local Development
# Homelab Project - Local Development Environment (Kind + ArgoCD loop)
#
# Created by `scripts/localdev-kind.ts up` (task localdev:kind), which also:
# - passes the node image (`--image kindest/node:<images.kind-node>` from
#   configuration/versions.yaml) - it is deliberately NOT pinned in this file
# - installs Cilium as the CNI (values from charts/addons/values-localdev.yaml)
# - writes containerd hosts.toml files for the registry pull-through caches
# - removes Kind's bundled local-path-provisioner (the addon Application owns it)
# - applies the localdev fakes in localdev/fakes/
#
# Architecture:
# - 1 control-plane node with ingress-ready label
# - 2 worker nodes for application workloads
# - Port mappings for the Envoy Gateway and ArgoCD access
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab-localdev

nodes:
  # Control Plane Node
  # - Runs Kubernetes control plane components
  # - Configured with ingress-ready label for Kind's ingress support
  # - Port mappings allow access to services from host machine
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Gateway HTTP/HTTPS; on macOS use task localdev:gateway instead
      # Access via http://localhost:9080 and https://localhost:9443
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
      # ArgoCD UI (NodePort 30080 -> localhost:8080)
      # Access via http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

  # Worker Node 1
  # - Labeled for application workloads
  # - No special configuration needed
  - role: worker
    labels:
      workload: applications

  # Worker Node 2
  # - Labeled for application workloads
  # - Provides redundancy for testing pod distribution
  - role: worker
    labels:
      workload: applications

# Networking Configuration
# - No default CNI: Cilium is installed by scripts/localdev-kind.ts right after
#   the cluster is created (same chart version and values the `cilium` ArgoCD
#   Application renders, so the Application adopts the release as a no-op)
# - Pod and Service subnets match Kind defaults
networking:
  # Cilium, installed by scripts/localdev-kind.ts (task localdev:kind)
  disableDefaultCNI: true

  # Standard pod network (matches Kind defaults)
  podSubnet: "10.244.0.0/16"

  # Standard service network (matches Kubernetes defaults)
  serviceSubnet: "10.96.0.0/12"

# Containerd Configuration
# - Enables the per-registry hosts.toml directory. The kindest/node image does
#   not set config_path, so it is set here; scripts/localdev-kind.ts then writes
#   /etc/containerd/certs.d/<registry>/hosts.toml into every node, pointing
#   pulls at the kind-registry-<name> pull-through caches with the upstream as
#   the fallback (see `task localdev:registry -- status`).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
