{{/*
The 1Password field label `password` becomes the Secret key that the
ClickHouseInstallation (k8s_secret_password), the collectors
(CLICKHOUSE_PASSWORD) and Grafana (envValueFrom) read.
*/}}
{{- if and .Values.onePassword.enabled .Values.onePassword.otelItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clickhouse-otel
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.otelItemPath | quote }}
{{- end }}
{{- if and .Values.onePassword.enabled .Values.onePassword.grafanaItemPath }}
{{- range $namespace := list .Values.namespace .Values.grafanaNamespace }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clickhouse-grafana
  namespace: {{ $namespace }}
spec:
  itemPath: {{ $.Values.onePassword.grafanaItemPath | quote }}
{{- end }}
{{- end }}
