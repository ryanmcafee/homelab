{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Enabled without a path fails the render instead.
*/}}
{{- if .Values.truenas.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: truenas-api-key
  namespace: {{ .Values.truenas.namespace }}
spec:
  itemPath: {{ required "democratic-csi-config: truenas.onePasswordItemPath is required when truenas.enabled is true. Set DEMOCRATIC_CSI_1P_PATH in configuration/environments/<env>.yaml, or set truenas.enabled to false." (trim (default "" .Values.truenas.onePasswordItemPath)) | quote }}
{{- end }}
