# An OnePasswordItem with an empty itemPath renders but is inert: the operator
# has nothing to fetch, so no Secret ever appears while the manifest still looks
# like a working producer. Require the path as well as the toggle.
{{- if and .Values.truenas.enabled .Values.truenas.onePasswordItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: truenas-api-key
  namespace: {{ .Values.truenas.namespace }}
spec:
  itemPath: {{ .Values.truenas.onePasswordItemPath | quote }}
{{- end }}
