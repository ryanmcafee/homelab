{{- if .Values.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
data:
  settings.json: |
    {{- toPrettyJson .Values.settings | nindent 4 }}
  agent.json: |
    {{- toPrettyJson .Values.agent | nindent 4 }}
  mcp-servers.json: |
    {{- toPrettyJson .Values.mcpServers | nindent 4 }}
---
# Argo Workflows semaphore: how many triage-fix workflows run at once.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
data:
  workflows: {{ .Values.workflow.maxConcurrent | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.workflow.cache.accessMode }}]
  {{- with .Values.workflow.cache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workflow.cache.size }}
{{- end }}
