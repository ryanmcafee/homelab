{{- if and .Values.enabled .Values.memory.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-memory
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.memory.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.memory.persistence.size }}
{{- end }}
