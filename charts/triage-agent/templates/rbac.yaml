{{- if .Values.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
{{- range .Values.clusterRoles }}
---
# Read-only by construction: charts/agent-readonly owns homelab-agent-readonly
# and view never grants Secrets or writes. Nothing here widens either role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Values.name }}-{{ . }}
  labels:
    {{- include "triage-agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.name }}
    namespace: {{ $.Values.namespace }}
{{- end }}
{{- end }}
