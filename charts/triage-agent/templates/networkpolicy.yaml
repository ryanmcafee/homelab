{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# The webhook takes unauthenticated alerts, so only the listed namespaces
# (Alertmanager, Prometheus) may reach the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "triage-agent.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
