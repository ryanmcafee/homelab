{{/*
An OnePasswordItem with an empty itemPath renders but is inert, so the item
needs its path. The field labels become the Secret keys the Deployment reads.
*/}}
{{- if and .Values.enabled .Values.onePassword.itemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onePassword.itemPath | quote }}
{{- end }}
