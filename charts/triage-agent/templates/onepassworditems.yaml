{{/*
An OnePasswordItem with an empty itemPath renders but is inert, so each item
needs its path. The field labels become the Secret keys the pods read.
*/}}
{{- if and .Values.enabled .Values.onePassword.itemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.onePassword.itemPath | quote }}
{{- end }}
{{- if and .Values.enabled .Values.pushover.itemPath }}
---
# The Alertmanager Pushover item, read into this namespace for the notify step.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.pushover.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "triage-agent.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.pushover.itemPath | quote }}
{{- end }}
