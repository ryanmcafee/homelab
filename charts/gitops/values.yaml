# GitOps Umbrella Chart - Default Values
# This chart implements the App of Apps pattern for ArgoCD
#
# It manages three child applications:
# 1. bootstrap (sync-wave: 0) - Prerequisites (CMP plugin, config)
# 2. addons (sync-wave: 2) - Core cluster infrastructure
# 3. applications (sync-wave: 3) - User-facing applications
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier (localdev, homelab)
  environment: homelab

  # Base domain for ingress resources
  domain: example.com

  # Git repository containing chart sources
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target revision (branch/tag/commit)
  targetRevision: HEAD

  # ArgoCD project to use for all applications
  project: default

  # Whether the child Applications sync automatically. Each child's
  # syncPolicy.automated block below is only rendered when this is true, so
  # localdev (values-localdev.yaml) can leave every Application manual for
  # `argocd app sync --local` (ARGOCD_AUTOMATED_SYNC in configuration/).
  automatedSync: true

  # Images shared by the chart family (PostSync smoke Jobs in addons and
  # applications). Placeholder; configuration/versions.yaml images.curl wins.
  images:
    curl: "8.22.0"

# ============================================================================
# Bootstrap Application (Prerequisites)
# ============================================================================

bootstrap:
  # Enable the bootstrap application
  enabled: true

  # Application metadata
  name: bootstrap
  namespace: argocd

  # Sync wave - deploy before everything else
  syncWave: "0"

  # Source configuration
  source:
    # Path to bootstrap chart in repository
    path: charts/bootstrap

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

    # Retry with backoff for initial cluster bootstrap
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Addons Application (Core Infrastructure)
# ============================================================================

addons:
  # Enable the addons application
  enabled: true

  # Application metadata
  name: addons
  namespace: argocd

  # Sync wave - deploy after bootstrap, before applications
  syncWave: "2"

  # Source configuration
  source:
    # Path to addons chart in repository
    path: charts/addons

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Skip dry-run for CRD instances (OnePasswordItem, Certificate, etc.)
      # whose CRDs are installed by child Applications in earlier sync waves
      - SkipDryRunOnMissingResource=true

    # Retry with backoff for initial cluster bootstrap
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Applications (User Workloads)
# ============================================================================

applications:
  # Enable the applications application
  enabled: true

  # Application metadata
  name: applications
  namespace: argocd

  # Sync wave - deploy after addons
  syncWave: "3"

  # Source configuration
  source:
    # Path to applications chart in repository
    path: charts/applications

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ============================================================================
# ArgoCD Application Options
# ============================================================================

# Ignore differences in certain fields (reduces noise)
ignoreDifferences: []

# Health check configuration
healthChecks:
  enabled: true

# ============================================================================
# ArgoCD Notifications (deploy status on the merged PR)
# ============================================================================

notifications:
  # Subscribe the bootstrap, addons and applications Applications to the
  # GitHub notifier: commit status argocd/<app> on the synced revision plus one
  # upserted comment per Application on the PR that produced it. The notifier
  # itself is configured by charts/bootstrap (argocd.notificationsGithub.enabled);
  # both flags stay false until the GitHub App and its 1Password item exist
  # (docs/runbooks/readonly-access.md). Flip the bootstrap flag first.
  github: false
  # Triggers defined in charts/bootstrap argocd.notificationsGithub.notifications.
  triggers:
    - on-deployed
    - on-sync-failed
    - on-health-degraded

# ============================================================================
# Per-PR Preview Environments (issue #261 item 16)
# ============================================================================

previews:
  # Renders the `previews` AppProject and ApplicationSet
  # (templates/previews-*.yaml). Homelab only (values-homelab.yaml): Kind has
  # no GitHub pull-request flow and syncs from the working tree.
  # docs/runbooks/previews.md
  enabled: false
  # After the applications parent (homelab wave 10), whose truecharts-oci
  # repository Secret the preview Applications pull through.
  appProjectSyncWave: "11"
  applicationSetSyncWave: "12"
  github:
    owner: ryanmcafee
    repo: homelab
    # A pull request gets a preview while it carries every label listed here.
    labels:
      - preview
    # Optional Secret in namespace argocd holding a GitHub token. The repo is
    # public, so anonymous requests work (60/hour; polling every 300s uses
    # about 12). Empty name = anonymous.
    tokenSecret:
      name: ""
      key: token
  # Poll interval in seconds: GitHub webhooks cannot reach the internal-only
  # ArgoCD ingress.
  requeueAfterSeconds: 300
