# GitOps Umbrella Chart - Default Values
# This chart implements the App of Apps pattern for ArgoCD
#
# It manages three child applications:
# 1. bootstrap (sync-wave: 0) - Prerequisites (CMP plugin, config)
# 2. addons (sync-wave: 2) - Core cluster infrastructure
# 3. applications (sync-wave: 3) - User-facing applications
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier (localdev, homelab)
  environment: homelab

  # Base domain for ingress resources
  domain: example.com

  # Git repository containing chart sources
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target revision (branch/tag/commit)
  targetRevision: HEAD

  # ArgoCD project to use for all applications
  project: default

# ============================================================================
# Bootstrap Application (Prerequisites)
# ============================================================================

bootstrap:
  # Enable the bootstrap application
  enabled: true

  # Application metadata
  name: bootstrap
  namespace: argocd

  # Sync wave - deploy before everything else
  syncWave: "0"

  # Source configuration
  source:
    # Path to bootstrap chart in repository
    path: charts/bootstrap

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

    # Retry with backoff for initial cluster bootstrap
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Addons Application (Core Infrastructure)
# ============================================================================

addons:
  # Enable the addons application
  enabled: true

  # Application metadata
  name: addons
  namespace: argocd

  # Sync wave - deploy after bootstrap, before applications
  syncWave: "2"

  # Source configuration
  source:
    # Path to addons chart in repository
    path: charts/addons

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Skip dry-run for CRD instances (OnePasswordItem, Certificate, etc.)
      # whose CRDs are installed by child Applications in earlier sync waves
      - SkipDryRunOnMissingResource=true

    # Retry with backoff for initial cluster bootstrap
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Applications (User Workloads)
# ============================================================================

applications:
  # Enable the applications application
  enabled: true

  # Application metadata
  name: applications
  namespace: argocd

  # Sync wave - deploy after addons
  syncWave: "3"

  # Source configuration
  source:
    # Path to applications chart in repository
    path: charts/applications

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ============================================================================
# ArgoCD Application Options
# ============================================================================

# Ignore differences in certain fields (reduces noise)
ignoreDifferences: []

# Health check configuration
healthChecks:
  enabled: true
