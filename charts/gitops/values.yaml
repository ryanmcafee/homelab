# GitOps Umbrella Chart - Default Values
# This chart implements the App of Apps pattern for ArgoCD
#
# It manages two child applications:
# 1. addons (sync-wave: 1) - Core cluster infrastructure
# 2. applications (sync-wave: 2) - User-facing applications
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier (localdev, homelab)
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Git repository containing chart sources
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target revision (branch/tag/commit)
  targetRevision: HEAD

  # ArgoCD project to use for all applications
  project: default

# ============================================================================
# Addons Application (Core Infrastructure)
# ============================================================================

addons:
  # Enable the addons application
  enabled: true

  # Application metadata
  name: addons
  namespace: argocd

  # Sync wave - deploy before applications
  syncWave: "1"

  # Source configuration
  source:
    # Path to addons chart in repository
    path: charts/addons

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Skip dry-run for CRD instances (OnePasswordItem, Certificate, etc.)
      # whose CRDs are installed by child Applications in earlier sync waves
      - SkipDryRunOnMissingResource=true

    # Retry with backoff for initial cluster bootstrap
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Applications (User Workloads)
# ============================================================================

applications:
  # Enable the applications application
  enabled: true

  # Application metadata
  name: applications
  namespace: argocd

  # Sync wave - deploy after addons
  syncWave: "2"

  # Source configuration
  source:
    # Path to applications chart in repository
    path: charts/applications

    # Helm values files to use (relative to chart path)
    # The environment-specific values file is automatically added
    valueFiles:
      - values.yaml

  # Destination configuration
  destination:
    # Deploy to the same cluster ArgoCD is running on
    server: https://kubernetes.default.svc

    # Namespace (chart creates its own namespaces)
    namespace: argocd

  # Sync policy
  syncPolicy:
    # Automatic sync disabled - manual sync only
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false

    # Sync options
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ============================================================================
# ArgoCD Application Options
# ============================================================================

# Ignore differences in certain fields (reduces noise)
ignoreDifferences:
  # RuntimeClass gets modified by nvidia-gpu-operator after creation
  - group: node.k8s.io
    kind: RuntimeClass
    jsonPointers:
      - /metadata/ownerReferences
      - /metadata/labels

# Health check configuration
healthChecks:
  enabled: true
