# GitOps Umbrella Chart - Local Development Overrides
# Phase 0.5: Local Development Environment
#
# This file provides overrides for local development with Kind cluster.
# It points to the localdev-specific values for both addons and applications.

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: localdev

  # Must match configuration/environments/localdev.yaml's DOMAIN (config is
  # the source of truth). The bootstrap template derives the ArgoCD ingress
  # hostname (argocd.<domain>) from it via helm.valuesObject.
  domain: homelab.local

  # Repository URL - can be local path or GitHub URL
  # ArgoCD will pull from this repository
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target branch for local development
  targetRevision: HEAD

# ============================================================================
# Bootstrap Application (Prerequisites)
# ============================================================================

bootstrap:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

# ============================================================================
# Addons Application
# ============================================================================

addons:
  enabled: true

  source:
    # values-localdev.yaml is appended by the template from global.environment,
    # so listing it here too would pass it to helm twice.
    valueFiles:
      - values.yaml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

# ============================================================================
# Applications
# ============================================================================

applications:
  enabled: true

  source:
    # values-localdev.yaml is appended by the template from global.environment,
    # so listing it here too would pass it to helm twice.
    valueFiles:
      - values.yaml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
