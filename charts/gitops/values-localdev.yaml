# GitOps Umbrella Chart - Local Development Overrides
#
# Kind + ArgoCD loop (issue #261, Section B). The root `gitops` Application
# (localdev/argocd/gitops-app.yaml) points at GitHub main, but every
# Application is synced from the working tree with `argocd app sync --local`
# (task localdev:sync). That only works while no Application syncs
# automatically: an automated Application would revert the local sync to Git
# on its next reconciliation. So nothing here carries syncPolicy.automated,
# and the generated charts/{addons,applications}/values-localdev.yaml set
# global.automatedSync: false for the same reason (ARGOCD_AUTOMATED_SYNC).

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: localdev

  # Must match configuration/environments/localdev.yaml's DOMAIN (config is
  # the source of truth). The bootstrap template derives the ArgoCD ingress
  # hostname (argocd.<domain>) from it via helm.valuesObject.
  domain: homelab.local

  # Repository URL - can be local path or GitHub URL
  # ArgoCD will pull from this repository
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Same revision the root Application uses (localdev/argocd/gitops-app.yaml),
  # so a plain `argocd app sync` without --local resolves the same commit.
  targetRevision: main

  # Manual sync only: see the header comment.
  automatedSync: false

# ============================================================================
# Bootstrap Application
# ============================================================================

bootstrap:
  # Kind installs ArgoCD directly (scripts/localdev-argocd.ts) and has no SOPS,
  # 1Password or environment-config item, so the bootstrap chart renders nothing
  # in localdev. ArgoCD treats a `--local` sync with zero manifests as "sync from
  # Git" and would deploy main's 1Password stack, so the Application is not
  # created at all here.
  enabled: false

# ============================================================================
# Addons Application
# ============================================================================

addons:
  enabled: true

  source:
    # values-localdev.yaml is appended by the template from global.environment,
    # so listing it here too would pass it to helm twice.
    valueFiles:
      - values.yaml

# ============================================================================
# Applications
# ============================================================================

applications:
  enabled: true

  source:
    # values-localdev.yaml is appended by the template from global.environment,
    # so listing it here too would pass it to helm twice.
    valueFiles:
      - values.yaml
