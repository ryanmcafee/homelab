# GitOps Umbrella Chart - Development Environment Overrides
# Development Talos cluster on Proxmox
#
# This environment is used for testing infrastructure changes before
# promoting to production. It mirrors production topology but with
# reduced resources and relaxed policies.

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: dev

  # Development subdomain
  domain: dev.ryanmcafee.com

  # Repository URL
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target development branch
  targetRevision: main

# ============================================================================
# Addons Application
# ============================================================================

addons:
  enabled: true

  source:
    # Use dev-specific values
    valueFiles:
      - values.yaml
      - values-dev.yaml

  syncPolicy:
    automated:
      # More aggressive pruning in dev
      prune: true
      selfHeal: true

# ============================================================================
# Applications
# ============================================================================

applications:
  enabled: true

  source:
    # Use dev-specific values
    valueFiles:
      - values.yaml
      - values-dev.yaml

  syncPolicy:
    automated:
      # More aggressive pruning in dev
      prune: true
      selfHeal: true
