{{- if .Values.previews.enabled }}
---
# Per-PR preview environments (issue #261 item 16, docs/runbooks/previews.md).
#
# One Application preview-pr<N> per open pull request carrying every label in
# previews.github.labels. It renders charts/applications at the PR head through
# the CMP with PREVIEW_PR=<N> and PREVIEW_APPS=<the PR's preview:<app> labels,
# comma-joined> (empty: the chart's defaultApps), which switches the chart to
# preview mode (templates/_preview.tpl). Closing the PR or removing the label
# deletes the Application; the finalizer cascades to the preview namespace.
#
# The ArgoCD server ingress is internal-only, so GitHub webhooks cannot reach
# the ApplicationSet controller: it polls every requeueAfterSeconds.
#
# The {{`{{ }}`}} expressions are ApplicationSet Go templates, escaped from Helm
# with backtick strings.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.previews.applicationSetSyncWave | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: {{ .Values.previews.github.owner }}
          repo: {{ .Values.previews.github.repo }}
          {{- if .Values.previews.github.tokenSecret.name }}
          tokenRef:
            secretName: {{ .Values.previews.github.tokenSecret.name }}
            key: {{ .Values.previews.github.tokenSecret.key }}
          {{- end }}
          labels:
            {{- toYaml .Values.previews.github.labels | nindent 12 }}
        requeueAfterSeconds: {{ .Values.previews.requeueAfterSeconds }}
  template:
    metadata:
      name: '{{`preview-pr{{.number}}`}}'
      namespace: argocd
      labels:
        homelab.ryanmcafee.com/preview-pr: '{{`{{.number}}`}}'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: previews
      source:
        repoURL: {{ .Values.global.repoUrl }}
        targetRevision: '{{`{{.head_sha}}`}}'
        path: charts/applications
        plugin:
          name: homelab-config-helm-v1.0
          env:
            - name: ENVIRONMENT
              value: homelab
            - name: FORMAT
              value: helm-apps
            - name: PREVIEW_PR
              value: '{{`{{.number}}`}}'
            # Every "preview:<app>" label, prefix stripped, comma-joined. The
            # CMP rejects anything but [a-z0-9,-]; the chart rejects apps
            # outside global.preview.allowedApps.
            - name: PREVIEW_APPS
              value: '{{`{{- $apps := list }}{{- range .labels }}{{- if hasPrefix "preview:" . }}{{- $apps = append $apps (trimPrefix "preview:" . | lower) }}{{- end }}{{- end }}{{ join "," $apps }}`}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`preview-{{.number}}`}}'
      syncPolicy:
        {{- if .Values.global.automatedSync }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # Same PodSecurity level as the Namespace the chart renders in preview
        # mode (charts/applications/templates/namespaces.yaml). baseline, not
        # restricted: flaresolverr runs as root with CHOWN/SETUID/SETGID/
        # FOWNER/DAC_OVERRIDE, all inside the baseline set.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/audit: baseline
            pod-security.kubernetes.io/warn: baseline
            homelab.ryanmcafee.com/preview-pr: '{{`{{.number}}`}}'
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
{{- end }}
