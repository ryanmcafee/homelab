# GitOps Umbrella Chart - Homelab Environment Values

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Placeholder only. The real base domain never lives in git: Terraform
  # (terragrunt/modules/gitops-bootstrap) injects it into the root gitops
  # Application as a helm parameter (`helm.parameters` global.domain) and the
  # bootstrap template derives the ArgoCD ingress hostname from it. Level 0
  # mirrors this with --set global.domain=<config DOMAIN>.
  domain: example.com

  # Git repository containing chart sources
  repoUrl: https://github.com/ryanmcafee/homelab.git

  # Target revision (branch/tag/commit)
  targetRevision: main

  # ArgoCD project to use for all applications
  project: default

# ============================================================================
# Bootstrap Application (Prerequisites)
# ============================================================================

bootstrap:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

# ============================================================================
# Addons Application (Core Infrastructure)
# ============================================================================

addons:
  enabled: true
  name: addons
  namespace: argocd
  syncWave: "1"

  source:
    path: charts/addons
    plugin:
      name: homelab-config-helm-v1.0
      env:
        - name: ENVIRONMENT
          value: homelab
        - name: FORMAT
          value: helm-addons

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ============================================================================
# Applications (User Workloads)
# ============================================================================

applications:
  enabled: true
  name: applications
  namespace: argocd
  syncWave: "10"

  source:
    path: charts/applications
    plugin:
      name: homelab-config-helm-v1.0
      env:
        - name: ENVIRONMENT
          value: homelab
        - name: FORMAT
          value: helm-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

# ============================================================================
# ArgoCD Application Options
# ============================================================================

# ignoreDifferences: inherited from values.yaml (ArgoCD's post-delete finalizers
# on child Applications are not drift).

healthChecks:
  enabled: true

# ============================================================================
# ArgoCD Notifications
# ============================================================================

notifications:
  # Human step: set true once charts/bootstrap/values-homelab.yaml has
  # argocd.notificationsGithub.enabled: true and the notifier is live
  # (docs/runbooks/readonly-access.md).
  github: false

# ============================================================================
# Per-PR Preview Environments
# ============================================================================

previews:
  # The `previews` ApplicationSet + AppProject (docs/runbooks/previews.md).
  enabled: true
