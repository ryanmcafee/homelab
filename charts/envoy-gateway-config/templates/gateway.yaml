{{- range $tier, $gw := .Values.gateways }}
{{- if $gw.enabled }}
{{- $v := mergeOverwrite (deepCopy $.Values.defaults) $gw }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $v.name }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ $v.name }}
    namespace: {{ $.Values.namespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $v.name }}
  namespace: {{ $.Values.namespace }}
  {{- with $v.dnsTarget }}
  annotations:
    # external-dns publishes this instead of status.addresses, which is empty until the LB IP binds.
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ $v.name }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ $.Values.global.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.certificate.secretName }}
      allowedRoutes:
        namespaces:
          from: All
---
# Plain HTTP only redirects; routes attach to the https listener (sectionName: https).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-https-redirect
  namespace: {{ $.Values.namespace }}
spec:
  parentRefs:
    - name: {{ $v.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
