{{- range $tier, $gw := .Values.gateways }}
{{- if $gw.enabled }}
{{- $v := mergeOverwrite (deepCopy $.Values.defaults) $gw }}
{{- if $v.metrics.podMonitor }}
---
# Envoy serves Prometheus stats on the admin port of every proxy pod.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $v.name }}-proxy
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-name: {{ $v.name }}
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: gateway
          replacement: {{ $v.name }}
{{- end }}
{{- end }}
{{- end }}
