{{- $tracing := false }}
{{- range $tier, $gw := .Values.gateways }}
{{- if and $gw.enabled (dig "tracing" "enabled" $.Values.defaults.tracing.enabled $gw) }}
{{- $tracing = true }}
{{- end }}
{{- end }}
{{- if $tracing }}
{{- $t := .Values.defaults.tracing }}
---
# An FQDN Backend, not a Service backendRef: Envoy Gateway rejects the Gateway while
# a referenced Service is missing, and the collector syncs after the Gateways.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ $t.backend }}
  namespace: {{ .Values.namespace }}
spec:
  appProtocols:
    - gateway.envoyproxy.io/h2c
  endpoints:
    - fqdn:
        hostname: {{ printf "%s.%s.svc.cluster.local" $t.service $t.namespace }}
        port: {{ $t.port }}
{{- end }}
