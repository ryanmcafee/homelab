{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Each item therefore requires its own path as well as
the toggle. The 1Password field labels become the Secret keys LiteLLM reads
(masterKey.secretKey, the LITELLM_SALT_KEY env secret and the provider keys the
proxy config resolves as os.environ/<field>).
*/}}
{{- if and .Values.onePassword.enabled .Values.onePassword.masterKeyItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: litellm-master-key-secret
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.masterKeyItemPath | quote }}
{{- end }}
{{- if and .Values.onePassword.enabled .Values.onePassword.saltKeyItemPath }}
---
# Separate item from the master key on purpose: LITELLM_SALT_KEY encrypts every
# provider credential stored in the database, so rotating it silently
# invalidates all of them. The master key is rotatable; keeping the two apart
# stops one rotation from touching the other.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: litellm-salt-key
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.saltKeyItemPath | quote }}
{{- end }}
{{- if and .Values.onePassword.enabled .Values.onePassword.apiKeysItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: litellm-api-keys
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.apiKeysItemPath | quote }}
{{- end }}
