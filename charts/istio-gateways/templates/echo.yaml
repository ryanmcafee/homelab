{{- if .Values.echo.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: {{ .Values.echo.image }}
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.echo.envoyGateway.name }}
      namespace: {{ .Values.echo.envoyGateway.namespace }}
      sectionName: https
    {{- if .Values.gateways.internal.enabled }}
    - name: istio-internal
      sectionName: https
    {{- end }}
  hostnames:
    - {{ printf "%s.%s" .Values.echo.hostname .Values.global.domain | quote }}
  rules:
    - backendRefs:
        - name: echo
          port: 80
{{- end }}
