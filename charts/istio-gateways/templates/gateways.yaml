{{- range $tier := list "internal" "external" }}
{{- if (index $.Values.gateways $tier).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-{{ $tier }}
spec:
  controllerName: istio.io/gateway-controller
  description: Istio {{ $tier }} gateway, for comparison with Envoy Gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-{{ $tier }}
  namespace: {{ $.Values.namespace }}
  annotations:
    # Deployment and Service keep the Gateway's name instead of <name>-<class>.
    gateway.istio.io/name-override: istio-{{ $tier }}
    networking.istio.io/service-type: {{ $.Values.serviceType }}
spec:
  gatewayClassName: istio-{{ $tier }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ $.Values.global.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.certificate.secretName }}
            namespace: {{ $.Values.certificate.namespace }}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-{{ $tier }}-https-redirect
  namespace: {{ $.Values.namespace }}
spec:
  parentRefs:
    - name: istio-{{ $tier }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: istio-gateways-certificate
  namespace: {{ .Values.certificate.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.namespace }}
  to:
    - group: ""
      kind: Secret
      name: {{ .Values.certificate.secretName }}
