# paperclip values: one paperclip.inc/v1alpha1 Instance (wave 14, after the
# operator at 11, the 1Password items at 12 and the CloudNativePG Cluster at 13).
# Hostname, admin e-mail, image tag, Gateway and storage class arrive
# through the parent Application's helm.valuesObject from configuration/
# (ADR-010); nothing environment-specific lives in this chart.

namespace: paperclip

# Instance name = StatefulSet, Service and ConfigMap name.
name: paperclip

# Public hostname (PAPERCLIP_HOSTNAME); publicURL, allowedHostnames and the
# HTTPRoute hostname are derived from it.
hostname: ""

# The operator refuses an Instance without a tag or digest (no :latest); the
# tag is pinned in configuration/versions.yaml images.paperclip.
image:
  repository: ghcr.io/paperclipai/paperclip
  tag: ""

# authenticated + private: sign-in required, reachable only through the internal
# Gateway (LAN/tailnet), every request must carry an allowed hostname (the
# operator always adds the in-cluster Service names for its own bootstrap Job).
# `public` exposure is not possible with this operator: app 2026.831+ then
# requires auth.baseUrlMode=explicit, and the operator's onboarding quickstart
# (`paperclipai onboard --yes`) forces trusted-local defaults, drops the public
# URL and rejects explicit mode without one, so the init container never
# writes the config file. Revisit when the operator onboards non-interactively.
deployment:
  mode: authenticated
  exposure: private

# external: DATABASE_URL comes from the CloudNativePG-generated Secret of
# charts/paperclip-database (key uri = postgresql://paperclip:<pw>@paperclip-postgres-rw:5432/paperclip).
database:
  secretName: paperclip-postgres-app
  secretKey: uri

# BETTER_AUTH_SECRET lives in the paperclip-auth Secret
# (charts/paperclip-dependencies in homelab, localdev/fakes in Kind).
auth:
  secretName: paperclip-auth
  secretKey: BETTER_AUTH_SECRET
  # TEMPORARILY false: the operator's admin bootstrap Job registers the admin
  # through the e-mail/password sign-up API, which PAPERCLIP_AUTH_DISABLE_SIGN_UP
  # blocks for everyone, first user included (EMAIL_PASSWORD_SIGN_UP_DISABLED;
  # bugs.md 2026-09-15, upstream paperclipinc/paperclip-operator issue). Flip back
  # to true in a follow-up PR as soon as the Instance reports status.bootstrap;
  # the Job short-circuits afterwards and never re-registers.
  disableSignUp: false

# One-time admin bootstrap (spec.auth.adminUser): e-mail from PAPERCLIP_ADMIN_EMAIL
# through the parent, password from the ADMIN_PASSWORD key of the same Secret.
# An empty e-mail renders no adminUser (the first human to log in claims the instance).
admin:
  email: ""
  name: Admin
  passwordKey: ADMIN_PASSWORD

# Agent credentials (docs/apps/paperclip.md). One Secret carries whichever
# credential kind is in use; empty name = no credentials wired at all.
adapters:
  secretName: paperclip-api-keys
  # API billing, one toggle per provider. Each enabled key becomes its own
  # optional secretKeyRef environment variable (spec.env) read from secretName;
  # the others are never declared. The chart deliberately does not use the
  # operator's spec.adapters.apiKeysSecretRef, which injects ANTHROPIC_API_KEY
  # and OPENAI_API_KEY together (operator 0.19.1 internal/resources/statefulset.go)
  # and cannot expose one without the other. Both off by default: with the
  # subscription logins below those variables must not exist in the pod, because
  # Claude Code ranks ANTHROPIC_API_KEY above the subscription token and would
  # bill the API.
  apiKeys:
    anthropic:
      enabled: false   # ANTHROPIC_API_KEY
    openai:
      enabled: false   # OPENAI_API_KEY
  # Further keys of the same Secret exposed the same way, for the CLIs bundled
  # in the image that read something other than an API key:
  #   CLAUDE_CODE_OAUTH_TOKEN  Claude subscription (`claude setup-token`)
  # Codex never reads a key from the host environment: a ChatGPT device login
  # (or `codex login --with-api-key`) lives in ~/.codex/auth.json, and HOME
  # (/paperclip) is the persistent data volume, so that file survives restarts.
  # A key missing from the Secret is simply unset.
  extraSecretEnv:
    - CLAUDE_CODE_OAUTH_TOKEN

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

# Pod scheduling for the server StatefulSet AND the operator's one-shot admin
# bootstrap Job (operator 0.19.1 copies availability.nodeSelector and
# tolerations to that Job, but not affinity). The Job mounts the same
# ReadWriteOnce data volume as the server although it only talks HTTP, so on
# block storage (iSCSI) it must land on the server's node or it stays in
# ContainerCreating with a Multi-Attach error. Homelab selects one labelled node
# (kubectl label node <name> paperclip.homelab/pin=true); Kind sets nothing.
availability:
  nodeSelector: {}

service:
  type: ClusterIP
  port: 3100

# HTTPRoute (spec.networking.httpRoute) on the https listener of the internal
# Gateway, which terminates TLS; the parent passes GATEWAY_INTERNAL/GATEWAY_NAMESPACE.
route:
  enabled: true
  gateway:
    name: envoy-internal
    namespace: envoy-gateway-system

# In an ambient-enrolled namespace (serviceMesh.ambient, set by the parent)
# templates/networkpolicy-ambient.yaml adds HBONE (TCP 15008) in both
# directions, which the operator's policy below does not know.
serviceMesh:
  ambient: false

# The operator's default policy: ingress on the service port from any source,
# egress to DNS, TCP 443 (LLM APIs), OTLP 4317/4318 and, in external database
# mode, TCP 5432. That already covers Envoy -> app and app -> paperclip-postgres-rw.
security:
  networkPolicy:
    enabled: true
    # templates/networkpolicy-ingress-controller.yaml: app -> its own public URL
    # through the Envoy proxy of route.gateway (listener container ports http/https).
    ingressController:
      ports: [10080, 10443]
  # The operator adds a privileged "selinux-relabel" init container (chcon on the
  # data volume) unless told not to. It is rejected by the namespace's PodSecurity
  # baseline admission (no pod is ever created and the Instance stays
  # Provisioning) and is pointless here: Talos does not enforce SELinux on
  # containers and the volume is iSCSI/ext4 in homelab, local-path in Kind.
  seLinuxRelabel: false

# Instance metrics stay off: enabling them makes the operator inject an OTEL
# preload (NODE_OPTIONS --import ./server/dist/instrumentation.js) that crashes
# images without instrumentation, and point at a collector this cluster lacks.
observability:
  metrics:
    enabled: false
  logging:
    level: info

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# Migrations run at startup, so the budget has to cover the largest upgrade, not
# the steady-state boot: 2026.916.0 alone adds 49 of them (0231-0279). 10 minutes.
# A startup probe that gives up restarts the container mid-upgrade, which is the
# one failure mode worth over-provisioning against.
probes:
  startup:
    failureThreshold: 120
    periodSeconds: 5

# Extra environment for the server and the onboarding init container (spec.env;
# both receive it). Do not set PAPERCLIP_AUTH_BASE_URL_MODE=explicit here: the
# onboarding quickstart honours it but drops the public URL, then fails its own
# "auth.baseUrlMode=explicit requires auth.publicBaseUrl" check.
extraEnv: []

# The operator's own Claude Code setup for the agents (templates/dotfiles.yaml,
# files/paperclip-dotfiles.ts): an init container clones any dotfiles repository
# into the data volume, runs its setup command, symlinks its Claude directory into
# ~/.claude, installs the plugins that settings.json enables and registers
# mcpServers. Off by default: without a repository the agents keep the image's
# stock Claude Code configuration.
dotfiles:
  enabled: false
  # https clone URL of the dotfiles repository (any fork).
  repoUrl: ""
  # Branch, tag or commit.
  ref: main
  # Directory in the repository that mirrors ~/.claude.
  claudeDir: claude
  # Exported to setupCommand as DOTFILES_PROFILE; the repository decides what it means.
  profile: ""
  # sh command run in the checkout before linking, e.g. to render settings.json
  # from a profile. It sees HOME, DOTFILES_DIR, DOTFILES_PROFILE and ~/.local/bin on PATH.
  setupCommand: ""
  # Token for a private repository (sent as an HTTP header, never written to disk);
  # empty secretName = public repository.
  gitToken:
    secretName: ""
    secretKey: GIT_TOKEN
  # bun release installed from npm into ~/.local/bin for setupCommand and plugin
  # hooks that need it; an oven/bun image tag works too (the variant suffix is
  # dropped). Empty skips it.
  bunVersion: ""
  # codesearch release (GitHub repository URL + tag publishing
  # codesearch-linux-x86_64.tar.gz) installed into ~/.local/bin; empty version skips it.
  codesearch:
    repo: ""
    version: ""
  # Claude Code MCP servers registered at user scope, name -> server config.
  mcpServers: {}
  # The operator's data volume and its mount path, which is also HOME.
  dataVolume: paperclip-data
  home: /paperclip
  # PATH of the image; ~/.local/bin is prepended for the server and the agents.
  basePath: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Agent health exporter (templates/exporter.yaml, docs/runbooks/paperclip-agents.md):
# files/paperclip-exporter.ts run by the stock Bun image reads the REST API with
# a board API key and serves agent run, phantom-agent and recovery metrics for
# the homelab-paperclip alerts. The key is the PAPERCLIP_API_KEY field of
# Secret paperclip-exporter (charts/paperclip-dependencies, localdev/fakes).
exporter:
  enabled: false
  # oven/bun:<tag>, pinned in configuration/versions.yaml images.bun.
  image: ""
  secretName: paperclip-exporter
  secretKey: PAPERCLIP_API_KEY
  runWindowSeconds: 3600
  scrapeInterval: 60s
  scrapeTimeout: 30s
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

# Per-agent run cap (templates/agent-policy.yaml): a CronJob sets
# runtimeConfig.heartbeat.maxConcurrentRuns on every agent, since Paperclip has
# no instance-wide cap and defaults new agents to 20. Reuses the exporter key.
agentPolicy:
  enabled: false
  # oven/bun:<tag>, pinned in configuration/versions.yaml images.bun.
  image: ""
  secretName: paperclip-exporter
  secretKey: PAPERCLIP_API_KEY
  maxConcurrentRuns: 1
  schedule: "*/5 * * * *"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
