{{- /*
Builds .Values.dbIndexes.indexes on heartbeat_runs after the Instance is healthy,
so Paperclip's own migrations have created the table first. CONCURRENTLY keeps
run writes flowing; an invalid index left by an interrupted build is dropped and
rebuilt, so the Job is safe to re-run. Rollback: DROP INDEX CONCURRENTLY <name>.
*/}}
{{- if .Values.dbIndexes.enabled }}
{{- $name := printf "%s-db-indexes" .Values.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
data:
  {{- range $index, $columns := .Values.dbIndexes.indexes }}
  {{ $index }}: {{ $columns | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # A concurrent build detoasts every context_snapshot; on a large table that takes minutes.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- if .Values.serviceMesh.ambient }}
        istio.io/dataplane-mode: none
        {{- end }}
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: {{ required "dbIndexes.image is required when dbIndexes.enabled" .Values.dbIndexes.image | quote }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: PGOPTIONS
              value: "-c statement_timeout=0 -c lock_timeout=60s"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              q() { psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tAc "$1"; }
              if [ "$(q "select to_regclass('public.heartbeat_runs') is not null")" != t ]; then
                echo "public.heartbeat_runs does not exist: Paperclip has not run its migrations against $(q 'select current_database()')" >&2
                exit 1
              fi
              for file in /indexes/*; do
                index=$(basename "$file")
                valid=$(q "select indisvalid from pg_index where indexrelid = to_regclass('public.$index')")
                if [ "$valid" = t ]; then echo "$index: present"; continue; fi
                if [ "$valid" = f ]; then
                  echo "$index: dropping the invalid index an interrupted build left"
                  q "drop index concurrently public.$index"
                fi
                echo "$index: building"
                q "create index concurrently if not exists $index on public.heartbeat_runs $(cat "$file")"
              done
              q "analyze public.heartbeat_runs"
              q "select indexrelid::regclass || ' ' || pg_size_pretty(pg_relation_size(indexrelid)) from pg_index where indrelid = 'public.heartbeat_runs'::regclass order by 1"
          volumeMounts:
            - name: indexes
              mountPath: /indexes
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: indexes
          configMap:
            name: {{ $name }}
{{- end }}
