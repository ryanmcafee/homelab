---
# Paperclip Instance. paperclip-operator turns it into a StatefulSet, Service
# (port 3100), ConfigMap, PVC, ServiceAccount, NetworkPolicy, HTTPRoute and a
# one-time admin bootstrap Job. Health for ArgoCD comes from
# charts/bootstrap/files/health/paperclip.inc_Instance.lua.
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  image:
    repository: {{ .Values.image.repository }}
    tag: {{ .Values.image.tag | quote }}
  {{- $secretKeys := list }}
  {{- if .Values.adapters.apiKeys.anthropic.enabled }}
  {{- $secretKeys = append $secretKeys "ANTHROPIC_API_KEY" }}
  {{- end }}
  {{- if .Values.adapters.apiKeys.openai.enabled }}
  {{- $secretKeys = append $secretKeys "OPENAI_API_KEY" }}
  {{- end }}
  {{- $secretKeys = concat $secretKeys (.Values.adapters.extraSecretEnv | default list) }}
  {{- $secretEnv := list }}
  {{- if .Values.adapters.secretName }}
  {{- range $secretKeys | uniq }}
  {{- $secretEnv = append $secretEnv (dict "name" . "valueFrom" (dict "secretKeyRef" (dict "name" $.Values.adapters.secretName "key" . "optional" true))) }}
  {{- end }}
  {{- end }}
  {{- $env := concat $secretEnv (.Values.extraEnv | default list) }}
  {{- with $env }}
  # Optional keys of the credentials Secret (the enabled per-provider API keys,
  # then extraSecretEnv) followed by extraEnv; both containers receive spec.env.
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  deployment:
    mode: {{ .Values.deployment.mode }}
    exposure: {{ .Values.deployment.exposure }}
    publicURL: https://{{ .Values.hostname }}
    allowedHostnames:
      - {{ .Values.hostname }}
  database:
    mode: external
    externalURLSecretRef:
      name: {{ .Values.database.secretName }}
      key: {{ .Values.database.secretKey }}
  auth:
    secretRef:
      name: {{ .Values.auth.secretName }}
      key: {{ .Values.auth.secretKey }}
    disableSignUp: {{ .Values.auth.disableSignUp }}
    {{- if .Values.admin.email }}
    adminUser:
      email: {{ .Values.admin.email }}
      name: {{ .Values.admin.name | quote }}
      passwordSecretRef:
        name: {{ .Values.auth.secretName }}
        key: {{ .Values.admin.passwordKey }}
    {{- end }}
  {{- with .Values.availability.nodeSelector }}
  availability:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  storage:
    persistence:
      enabled: {{ .Values.persistence.enabled }}
      size: {{ .Values.persistence.size }}
      {{- with .Values.persistence.storageClass }}
      storageClass: {{ . }}
      {{- end }}
  networking:
    service:
      type: {{ .Values.service.type }}
      port: {{ .Values.service.port }}
    {{- if .Values.route.enabled }}
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: {{ .Values.hostname }}
      parentRefs:
        - name: {{ .Values.route.gateway.name }}
          namespace: {{ .Values.route.gateway.namespace }}
          sectionName: https
      hostnames:
        - {{ .Values.hostname }}
    {{- end }}
  security:
    networkPolicy:
      enabled: {{ .Values.security.networkPolicy.enabled }}
    seLinuxRelabel: {{ .Values.security.seLinuxRelabel }}
  observability:
    metrics:
      enabled: {{ .Values.observability.metrics.enabled }}
    logging:
      level: {{ .Values.observability.logging.level }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  probes:
    startup:
      failureThreshold: {{ .Values.probes.startup.failureThreshold }}
      periodSeconds: {{ .Values.probes.startup.periodSeconds }}
