{{- /* Agent health exporter; metrics and alerts in docs/runbooks/paperclip-agents.md. */}}
{{- if .Values.exporter.enabled }}
{{- $name := printf "%s-exporter" .Values.name }}
{{- $script := .Files.Get "files/paperclip-exporter.ts" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
data:
  paperclip-exporter.ts: |-
    {{- $script | nindent 4 }}
---
# Progressive delivery: a new exporter image reaches half the traffic, the
# canary-http-health ClusterAnalysisTemplate probes {{ $name }}-canary, and a
# failed probe aborts back to the stable ReplicaSet without an operator.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  strategy:
    canary:
      canaryService: {{ $name }}-canary
      stableService: {{ $name }}
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: canary-http-health
                clusterScope: true
            args:
              - name: service
                value: {{ $name }}-canary
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: port
                value: "9464"
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/script: {{ $script | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ required "exporter.image is required" .Values.exporter.image }}
          command: ["bun", "/app/paperclip-exporter.ts"]
          env:
            - name: PAPERCLIP_API_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%v/api" .Values.name .Values.namespace .Values.service.port | quote }}
            - name: PAPERCLIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporter.secretName }}
                  key: {{ .Values.exporter.secretKey }}
                  optional: true
            - name: RUN_WINDOW_SECONDS
              value: {{ .Values.exporter.runWindowSeconds | quote }}
            - name: STALE_WAKE_MINUTES
              value: {{ .Values.exporter.staleWakeMinutes | quote }}
            - name: STALE_WAKE_INTERVAL_SECONDS
              value: {{ .Values.exporter.staleWakeIntervalSeconds | quote }}
            - name: STALE_WAKE_MAX_ISSUES
              value: {{ .Values.exporter.staleWakeMaxIssues | quote }}
            - name: PHANTOM_STALE_SECONDS
              value: {{ .Values.exporter.phantomStaleSeconds | quote }}
            - name: PORT
              value: "9464"
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
          ports:
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
# Canary Service: the Rollout controller pins its selector to the canary
# pod-template-hash. Its app.kubernetes.io/name value is deliberately not the
# one the ServiceMonitor below selects, which would otherwise scrape the canary
# pods as a second source of the same series.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-canary
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-canary
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.exporter.scrapeInterval }}
      scrapeTimeout: {{ .Values.exporter.scrapeTimeout }}
{{- end }}
