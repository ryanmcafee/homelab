{{- /* Agent health exporter; metrics and alerts in docs/runbooks/paperclip-agents.md. */}}
{{- if .Values.exporter.enabled }}
{{- $name := printf "%s-exporter" .Values.name }}
{{- $script := .Files.Get "files/paperclip-exporter.ts" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
data:
  paperclip-exporter.ts: |-
    {{- $script | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/script: {{ $script | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ required "exporter.image is required" .Values.exporter.image }}
          command: ["bun", "/app/paperclip-exporter.ts"]
          env:
            - name: PAPERCLIP_API_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%v/api" .Values.name .Values.namespace .Values.service.port | quote }}
            - name: PAPERCLIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporter.secretName }}
                  key: {{ .Values.exporter.secretKey }}
                  optional: true
            - name: RUN_WINDOW_SECONDS
              value: {{ .Values.exporter.runWindowSeconds | quote }}
            - name: PORT
              value: "9464"
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
          ports:
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.exporter.scrapeInterval }}
      scrapeTimeout: {{ .Values.exporter.scrapeTimeout }}
{{- end }}
