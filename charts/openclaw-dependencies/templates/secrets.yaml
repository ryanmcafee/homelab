{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Each item therefore requires its own path as well as
the toggle. The 1Password field labels become the Secret keys, and charts/openclaw
names those keys one by one in the Instance's spec.env rather than referencing the
Secret as a whole, so a field nobody asked for stays out of the pod.
*/}}
{{- if and .Values.onePassword.enabled .Values.onePassword.apiKeysItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: openclaw-api-keys
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.apiKeysItemPath | quote }}
{{- end }}
{{- if and .Values.onePassword.enabled .Values.onePassword.gatewayItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: openclaw-gateway
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.onePassword.gatewayItemPath | quote }}
{{- end }}
