# traefik-config homelab values
# CRD-dependent resources that deploy AFTER Traefik
#
# Hostnames, the static IP, the allowed OIDC domains and global.domain are not
# set here. The traefik-external-config Application in charts/addons passes
# them through helm.valuesObject from configuration/ (via the CMP), so this
# committed file stays PII-free. Only non-derived settings live here.

namespace: traefik

dashboard:
  enabled: true

oidc:
  enabled: true
  providerURL: https://accounts.google.com
  # IMPORTANT: Use path-only format. The plugin constructs full URL from request host.
  # Each protected service needs its callback registered in Google Cloud Console.
  callbackURL: /oauth2/callback
  logoutURL: /oauth2/logout
  scopes:
    - openid
    - email
    - profile
