# traefik-config homelab values
# CRD-dependent resources that deploy AFTER Traefik

global:
  domain: ryanmcafee.com

namespace: traefik

dashboard:
  enabled: true
  host: traefik.ryanmcafee.com
  staticIP: "172.16.100.200"

oidc:
  enabled: true
  host: auth.ryanmcafee.com
  providerURL: https://accounts.google.com
  # IMPORTANT: Use path-only format. The plugin constructs full URL from request host.
  # Each protected service needs its callback registered in Google Cloud Console.
  callbackURL: /oauth2/callback
  logoutURL: /oauth2/logout
  scopes:
    - openid
    - email
    - profile
  allowedDomains:
    - ryanmcafee.com
