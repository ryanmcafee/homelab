# traefik-config values
# CRD-dependent resources that deploy AFTER Traefik

global:
  domain: example.com

namespace: traefik

# DNSEndpoint records published by this chart: the dashboard hostname, plus the
# OIDC auth hostname when oidc.enabled. They are externaldns.k8s.io resources,
# so their CRDs only exist where external-dns is deployed. Set this to false in
# any environment without it, or the Application cannot sync.
externalDNS:
  enabled: true

# Dashboard configuration
dashboard:
  enabled: true
  host: traefik.example.com
  staticIP: "10.0.0.200"

# OIDC authentication middleware
oidc:
  enabled: false
  host: auth.example.com
  providerURL: https://accounts.google.com
  callbackURL: https://auth.example.com/oauth2/callback
  logoutURL: https://auth.example.com/oauth2/logout
  scopes:
    - openid
    - email
    - profile
  allowedDomains:
    - example.com
