# traefik-config values
# CRD-dependent resources that deploy AFTER Traefik

global:
  domain: example.com

namespace: traefik

# Dashboard configuration
dashboard:
  enabled: true
  host: traefik.example.com
  staticIP: "10.0.0.200"

  # DNSEndpoint publishing the dashboard hostname. It needs the
  # externaldns.k8s.io CRDs, so disable it wherever external-dns is not
  # deployed.
  dnsEndpoint:
    enabled: true

# OIDC authentication middleware
oidc:
  enabled: false
  host: auth.example.com
  providerURL: https://accounts.google.com
  callbackURL: https://auth.example.com/oauth2/callback
  logoutURL: https://auth.example.com/oauth2/logout
  scopes:
    - openid
    - email
    - profile
  allowedDomains:
    - example.com
