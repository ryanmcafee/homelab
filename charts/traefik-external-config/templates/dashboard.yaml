{{- if .Values.dashboard.enabled }}
{{- if .Values.externalDNS.enabled }}
---
# Requires the externaldns.k8s.io CRDs, which only exist where external-dns is
# deployed. Disabled in environments without it (see values-localdev.yaml).
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: traefik-dashboard
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - dnsName: {{ .Values.dashboard.host }}
      recordType: A
      targets:
        - {{ .Values.dashboard.staticIP | quote }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: {{ .Values.namespace }}
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.dashboard.host }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect-slash
  namespace: {{ .Values.namespace }}
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-redirect
  namespace: {{ .Values.namespace }}
  # Both Traefik instances filter the CRD provider by ingress class
  # (--providers.kubernetescrd.ingressClass). Without this annotation neither
  # loads the route: it applies cleanly and then serves the default certificate.
  annotations:
    kubernetes.io/ingress.class: external
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.dashboard.host }}`) && Path(`/dashboard`)
      middlewares:
        - name: dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-dashboard-tls
{{- end }}
