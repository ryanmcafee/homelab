# cert-manager-cluster-issuer — local development overrides
#
# Kind has no public domain (localdev uses homelab.local) and no Cloudflare
# API token, so neither ACME solver can ever issue a certificate there. The
# addons parent hands this chart `selfSigned.enabled: true` through the
# cert-manager-cluster-issuer Application's helm.valuesObject
# (CERT_ISSUER=selfsigned in configuration/environments/localdev.yaml), which
# turns the `letsencrypt` ClusterIssuer into a self-signed issuer under the
# same name: every `cert-manager.io/cluster-issuer: letsencrypt` annotation
# keeps working and cert-manager creates the TLS Secrets the Ingresses expect.
#
# cloudflare stays off as well so the manifest never references the
# cloudflare-api-token Secret nothing creates in Kind; this keeps the chart
# consistent with charts/cert-manager-config/values-localdev.yaml.

cloudflare:
  enabled: false
