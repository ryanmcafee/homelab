{{/*
An OnePasswordItem with an empty itemPath renders but is inert, so each item
needs its path. The field labels become the Secret keys the pods read.
*/}}
{{- if .Values.git.itemPath }}
---
# Field GIT_TOKEN: read access to the private repositories in CODESEARCH_REPOS.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.git.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "codesearch-dependencies.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.git.itemPath | quote }}
{{- end }}
{{- if and .Values.workflows.enabled .Values.workflows.artifacts.itemPath }}
---
# The Argo Workflows log store credentials, read into this namespace for the
# backup and restore artifacts.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.workflows.artifacts.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "codesearch-dependencies.labels" . | nindent 4 }}
spec:
  itemPath: {{ .Values.workflows.artifacts.itemPath | quote }}
{{- end }}
