{{- if .Values.dashboard.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-internal-dashboard-tls
  namespace: {{ .Values.namespace }}
  annotations:
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "This chart's global.domain is set independently of configuration/environments/*.yaml (the centralized, PII-free level-0 domain); the rendered hostname is correct in real deployments but never matches the level-0 placeholder domain."
spec:
  secretName: traefik-internal-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.dashboard.host }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-dashboard-redirect-slash
  namespace: {{ .Values.namespace }}
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-internal-dashboard-redirect
  namespace: {{ .Values.namespace }}
  annotations:
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "This chart's global.domain is set independently of configuration/environments/*.yaml (the centralized, PII-free level-0 domain); the rendered hostname is correct in real deployments but never matches the level-0 placeholder domain."
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.dashboard.host }}`) && Path(`/dashboard`)
      middlewares:
        - name: internal-dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-internal-dashboard-tls
{{- end }}
