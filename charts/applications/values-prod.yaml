# Applications Chart - Production Environment Overrides
# Production Talos cluster on Proxmox
#
# Full resource allocation and production configurations.

# ============================================================================
# Global Configuration
# ============================================================================

global:
  environment: prod
  domain: ryanmcafee.com
  storageClass: democratic-csi-nfs
  ingressClassName: traefik
  timezone: America/New_York

  # Production media storage
  media:
    nfsServer: truenas.ryanmcafee.com
    nfsPath: /mnt/tank/media

# ============================================================================
# Plex
# ============================================================================

plex:
  enabled: true

  # Enable GPU for hardware transcoding
  gpu:
    enabled: true
    vendor: nvidia
    count: 1

  # Full resource allocation
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1

  # Production storage
  persistence:
    config:
      size: 100Gi
    media:
      server: truenas.ryanmcafee.com
      path: /mnt/tank/media

  # Production ingress
  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: plex.ryanmcafee.com
    hosts:
      - host: plex.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: plex-tls
        hosts:
          - plex.ryanmcafee.com

# ============================================================================
# Sonarr
# ============================================================================

sonarr:
  enabled: true

  persistence:
    config:
      size: 10Gi
    media:
      server: truenas.ryanmcafee.com
      path: /mnt/tank/media

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: sonarr.ryanmcafee.com
    hosts:
      - host: sonarr.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: sonarr-tls
        hosts:
          - sonarr.ryanmcafee.com

# ============================================================================
# Radarr
# ============================================================================

radarr:
  enabled: true

  persistence:
    config:
      size: 10Gi
    media:
      server: truenas.ryanmcafee.com
      path: /mnt/tank/media

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: radarr.ryanmcafee.com
    hosts:
      - host: radarr.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: radarr-tls
        hosts:
          - radarr.ryanmcafee.com

# ============================================================================
# Prowlarr
# ============================================================================

prowlarr:
  enabled: true

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prowlarr.ryanmcafee.com
    hosts:
      - host: prowlarr.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: prowlarr-tls
        hosts:
          - prowlarr.ryanmcafee.com

# ============================================================================
# Home Assistant
# ============================================================================

homeassistant:
  enabled: true

  # Enable host network for device discovery
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  persistence:
    config:
      size: 10Gi

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: homeassistant.ryanmcafee.com
    hosts:
      - host: homeassistant.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: homeassistant-tls
        hosts:
          - homeassistant.ryanmcafee.com

# ============================================================================
# Mosquitto
# ============================================================================

mosquitto:
  enabled: true

  # Production authentication
  auth:
    enabled: true
