# ============================================================================
# Home Assistant
# ============================================================================

homeassistant:
  # Disable in dev (requires specific network configuration)
  enabled: false

# ============================================================================
# Mosquitto
# ============================================================================

mosquitto:
  enabled: true

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: mqtt.dev.ryanmcafee.com
