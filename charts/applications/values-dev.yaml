# ============================================================================
# Prowlarr
# ============================================================================

prowlarr:
  enabled: true

  ingress:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prowlarr.dev.ryanmcafee.com
    hosts:
      - host: prowlarr.dev.ryanmcafee.com
        paths:
