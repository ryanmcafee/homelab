# ============================================================================
# Home Assistant - Home Automation Hub
# Sync Wave: 3
# ============================================================================

homeassistant:
  enabled: true
  namespace: home-automation

  # TrueCharts helm chart (OCI registry)
  chart:
    name: home-assistant
    repo: oci://oci.trueforge.org/truecharts/home-assistant
    version: 28.19.14

  workload:
    main:
      podSpec:
        hostNetwork: true
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 2Gi

  podOptions:
    dnsPolicy: ClusterFirstWithHostNet

  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: homeassistant.ryanmcafee.com
      hosts:
        - host: homeassistant.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: homeassistant-tls
          hosts:
            - homeassistant.ryanmcafee.com

  TZ: America/New_York

# ============================================================================
# Mosquitto - MQTT Broker
# Sync Wave: 3
# ============================================================================

mosquitto:
  enabled: true
  namespace: home-automation

  # TrueCharts helm chart (OCI registry)
  chart:
    name: mosquitto
    repo: oci://oci.trueforge.org/truecharts/mosquitto
    version: 17.13.9

  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      mountPath: /mosquitto/config
      accessModes:
        - ReadWriteOnce

    data:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      mountPath: /mosquitto/data
      accessModes:
        - ReadWriteOnce

  service:
    main:
      type: LoadBalancer
      ports:
        main:
          port: 1883
          targetPort: 1883
          protocol: tcp
    websockets:
      enabled: true
      type: LoadBalancer
      ports:
        websockets:
          enabled: true
          port: 9001
          targetPort: 9001
          protocol: tcp

  # Authentication configuration
  mosquitto:
    auth:
      enabled: true

  TZ: America/New_York

# ============================================================================
# DuckDNS - Dynamic DNS Updater
# Sync Wave: 1 (early infrastructure)
# ============================================================================

duckdns:
  enabled: true
  namespace: duckdns

  # DuckDNS subdomain (without .duckdns.org)
  subdomain: ryanmcafee

  # 1Password vault path for DuckDNS token
  # The secret should have a field named "token"
  onePasswordItemPath: vaults/homelab/items/duckdns
