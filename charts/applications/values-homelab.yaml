# Applications Chart - Homelab Environment Values

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Default ingress class
  ingressClassName: traefik

  # Timezone for applications
  timezone: America/New_York

  # Media storage configuration
  media:
    nfsServer: truenas.ryanmcafee.com
    nfsPath: /mnt/storage/media

# ============================================================================
# Plex Media Server
# Sync Wave: 1 (core media service)
# ============================================================================

plex:
  enabled: true
  namespace: media

  # Official Plex helm chart
  chart:
    name: plex-media-server
    repo: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
    version: 1.4.0

  image:
    registry: index.docker.io
    repository: plexinc/pms-docker
    tag: latest
    pullPolicy: IfNotPresent

  # GPU configuration (NVIDIA Quadro P2200)
  runtimeClassName: nvidia  # For GPU transcoding

  # Node selector for GPU-enabled nodes
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1

  # Plex configuration
  pms:
    # Plex claim token from https://plex.tv/claim
    claimToken: ""  # Provided via 1Password
    # Configure timezone
    configExistingClaim: ""
    storageClassName: democratic-csi-nfs

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 100Gi
      accessMode: ReadWriteOnce

    # Transcode directory (ephemeral for performance)
    transcode:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 20Gi
      # Use emptyDir for better performance
      emptyDir:
        enabled: true
        medium: Memory
        sizeLimit: 10Gi

  # Extra volumes for media storage via NFS
  extraVolumes:
    - name: media
      nfs:
        server: truenas.ryanmcafee.com
        path: /mnt/storage/media

  extraVolumeMounts:
    - name: media
      mountPath: /media
      readOnly: false

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/hostname: plex.ryanmcafee.com
    hosts:
      - host: plex.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: plex-tls
        hosts:
          - plex.ryanmcafee.com

  # Environment variables
  extraEnv:
    TZ: America/New_York
    ADVERTISE_IP: https://plex.ryanmcafee.com:443

# ============================================================================
# Sonarr - TV Show Management
# Sync Wave: 2
# ============================================================================

sonarr:
  enabled: true
  namespace: media

  # TrueCharts helm chart (OCI registry)
  chart:
    name: sonarr
    repo: oci://oci.trueforge.org/truecharts/sonarr
    version: 25.2.11

  # TrueCharts uses common library pattern
  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    media:
      enabled: true
      type: nfs
      server: truenas.ryanmcafee.com
      path: /mnt/storage/media
      mountPath: /media

  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: sonarr.ryanmcafee.com
      hosts:
        - host: sonarr.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: sonarr-tls
          hosts:
            - sonarr.ryanmcafee.com

  TZ: America/New_York
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

