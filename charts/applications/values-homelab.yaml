# ============================================================================
# Transmission - BitTorrent Client with VPN
# Sync Wave: 14 (after dependencies)
# ============================================================================

transmission:
  enabled: true
  namespace: media

  # TrueCharts helm chart (OCI registry)
  chart:
    name: transmission
    repo: oci://oci.trueforge.org/truecharts/transmission
    version: 24.14.1

  # 1Password vault path for VPN and RPC credentials
  onePasswordItemPath: vaults/homelab/items/transmission-vpn

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              # RPC auth disabled - protected by OIDC via Traefik ingress
              TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: "false"
              TRANSMISSION_DOWNLOAD_DIR: /downloads
              TRANSMISSION_INCOMPLETE_DIR: /downloads/incomplete
              TRANSMISSION_INCOMPLETE_DIR_ENABLED: "true"
              TRANSMISSION_RATIO_LIMIT: "0.25"
              TRANSMISSION_RATIO_LIMIT_ENABLED: "true"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

  # Gluetun VPN addon - disabled until TrueCharts common-2025 addon structure is figured out
  # TODO: Re-enable with correct env structure for ProtonVPN WireGuard
  addons:
    gluetun:
      enabled: false

  # Service configuration
  service:
    main:
      ports:
        main:
          port: 9091
    torrent:
      enabled: true
      type: LoadBalancer
      ports:
        torrent:
          enabled: true
          port: 51413
          protocol: tcp

  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    # Downloads storage via NFS
    downloads:
      enabled: true
      type: nfs
      server: truenas.ryanmcafee.com
      path: /mnt/storage/downloads
      mountPath: /downloads

  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: transmission.ryanmcafee.com
        # OIDC authentication via Traefik plugin
        traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd
      hosts:
        - host: transmission.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: transmission-tls
          hosts:
            - transmission.ryanmcafee.com

  TZ: America/New_York
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

