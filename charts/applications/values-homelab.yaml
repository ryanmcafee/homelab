# ============================================================================
# ArgoCD - Self-Management
# Sync Wave: 5 (LAST - after all applications for stability)
# ============================================================================

argocd:
  enabled: true
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    # Enable App of Apps health status progression
    configs:
      cm:
        # ArgoCD base URL - required for OAuth redirects and API calls
        url: https://argocd.ryanmcafee.com
        # Enable ksops plugin for SOPS decryption
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
        # Custom health check for Ingress - treat as Healthy even without loadBalancer address
        # This prevents circular dependency during initial sync when Traefik isn't deployed yet
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.loadBalancer ~= nil then
              if obj.status.loadBalancer.ingress ~= nil then
                hs.message = "Load balancer ingress configured"
              else
                hs.message = "Waiting for load balancer (non-blocking)"
              end
            end
          end
          return hs
      # Enable insecure mode - required for Traefik TLS termination
      # Traefik terminates TLS and forwards HTTP to ArgoCD backend
      params:
        server.insecure: "true"

    server:
      # HA configuration - 3 replicas spread across different hosts
      replicas: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server

      # Ingress for web UI
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.ryanmcafee.com
        tls: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: argocd.ryanmcafee.com
          # Tell Traefik to use HTTP when connecting to backend (ArgoCD serves HTTP on 8080)
          traefik.ingress.kubernetes.io/service.serversscheme: http
          # OIDC authentication via Traefik plugin
          traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      # HA configuration - 2 replicas spread across different hosts
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # SOPS/ksops configuration for decrypting secrets
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      # Mount age key and custom tools
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age-key
      volumeMounts:
        - name: custom-tools
          mountPath: /usr/local/bin/ksops
          subPath: ksops
        - name: custom-tools
          mountPath: /usr/local/bin/kustomize
          subPath: kustomize
        - name: sops-age
          mountPath: /.config/sops/age
      # Init container to install ksops
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args:
            - echo "Installing KSOPS...";
              cp /usr/local/bin/ksops /custom-tools/ksops;
              cp /usr/local/bin/kustomize /custom-tools/kustomize;
              echo "Done.";
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

    applicationSet:
      # HA configuration - 2 replicas
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
