{{- /* Never part of a preview (docs/runbooks/previews.md). */ -}}
{{- if and .Values.homeassistant.enabled (not (include "homelab.preview.enabled" .)) }}
---
# Home Assistant Config: deploys static PV+PVC for homeassistant persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/homeassistant-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      valuesObject:
        iscsi:
          portal: {{ .Values.global.iscsi.portal | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.homeassistant.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
  annotations:
    # Sync wave 15: After namespace (wave 14) and mosquitto (wave 14)
    argocd.argoproj.io/sync-wave: "15"
    homelab.local/policy-exempt: "image-latest"
    homelab.local/policy-exempt-reason: "lscr.io/linuxserver/homeassistant is intentionally tracked at :latest for automatic updates in this homelab. (Currently moot: home-assistant.enabled is false by default.)"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.homeassistant.chart.name }}
    targetRevision: {{ .Values.homeassistant.chart.version }}
    helm:
      releaseName: home-assistant
      values: |
        {{- if .Values.homeassistant.image }}
        image:
          {{- toYaml .Values.homeassistant.image | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.workload }}
        workload:
          {{- toYaml .Values.homeassistant.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.podOptions }}
        podOptions:
          {{- toYaml .Values.homeassistant.podOptions | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.persistence }}
        persistence:
          {{- toYaml .Values.homeassistant.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.route }}
        route:
          {{- toYaml .Values.homeassistant.route | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.TZ }}
        TZ: {{ .Values.homeassistant.TZ | quote }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.homeassistant.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- include "homelab.smokeJob" (dict "name" "homeassistant" "namespace" .Values.homeassistant.namespace "smoke" .Values.homeassistant.smoke "wave" "15" "image" .Values.global.images.curl) }}
{{- end }}
