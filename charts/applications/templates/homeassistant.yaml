{{- if .Values.homeassistant.enabled }}
---
# Home Assistant Config: deploys static PV+PVC for homeassistant persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/homeassistant-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.homeassistant.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
  annotations:
    # Sync wave 15: After namespace (wave 14) and mosquitto (wave 14)
    argocd.argoproj.io/sync-wave: "15"
    {{- if eq .Values.global.environment "localdev" }}
    homelab.ryanmcafee.com/policy-exempt: "image-latest,hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "image-latest: lscr.io/linuxserver/homeassistant is intentionally tracked at :latest for automatic updates in this homelab. hostname-domain: GitHub issue #263: localdev renders addons/applications without the CMP domain-substitution stage (CLAUDE.md's CMP Architecture: localdev uses native Helm with values-localdev.yaml, no CMP), so the ingress hostname stays the checked-in values.yaml placeholder here; it is never resolved or used in localdev (services are reached via NodePort). Fix is to generate values-localdev.yaml from config; remove the hostname-domain exemption then. In homelab this hostname is correctly domain-derived by the two-stage config-export flow, so that part of the exemption is scoped to localdev only. (Currently moot: home-assistant.enabled is false by default.)"
    {{- else }}
    homelab.ryanmcafee.com/policy-exempt: "image-latest"
    homelab.ryanmcafee.com/policy-exempt-reason: "lscr.io/linuxserver/homeassistant is intentionally tracked at :latest for automatic updates in this homelab. (Currently moot: home-assistant.enabled is false by default.)"
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.homeassistant.chart.name }}
    targetRevision: {{ .Values.homeassistant.chart.version }}
    helm:
      releaseName: home-assistant
      values: |
        {{- if .Values.homeassistant.image }}
        image:
          {{- toYaml .Values.homeassistant.image | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.workload }}
        workload:
          {{- toYaml .Values.homeassistant.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.podOptions }}
        podOptions:
          {{- toYaml .Values.homeassistant.podOptions | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.persistence }}
        persistence:
          {{- toYaml .Values.homeassistant.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.ingress }}
        ingress:
          {{- toYaml .Values.homeassistant.ingress | nindent 10 }}
        {{- end }}

        {{- if .Values.homeassistant.TZ }}
        TZ: {{ .Values.homeassistant.TZ | quote }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.homeassistant.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
