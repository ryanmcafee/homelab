{{- if .Values.prowlarr.enabled }}
---
# Prowlarr Config: deploys static PV+PVC for prowlarr persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/prowlarr-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.prowlarr.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.prowlarr.chart.name }}
    targetRevision: {{ .Values.prowlarr.chart.version }}
    helm:
      releaseName: prowlarr
      values: |
        {{- if .Values.prowlarr.workload }}
        workload:
          {{- toYaml .Values.prowlarr.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.prowlarr.persistence }}
        persistence:
          {{- toYaml .Values.prowlarr.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.prowlarr.ingress }}
        ingress:
          {{- toYaml .Values.prowlarr.ingress | nindent 10 }}
        {{- end }}

        {{- if .Values.prowlarr.TZ }}
        TZ: {{ .Values.prowlarr.TZ | quote }}
        {{- end }}

        {{- if .Values.prowlarr.securityContext }}
        securityContext:
          {{- toYaml .Values.prowlarr.securityContext | nindent 10 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.prowlarr.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
