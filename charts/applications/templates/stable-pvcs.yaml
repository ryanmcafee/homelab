{{- if .Values.stablePVCs.enabled }}
---
# Namespace: media
# Created at wave 10 so PVCs are ready before app deployments
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
# Namespace: home-automation (privileged for hostNetwork)
apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "10"

{{- range $name, $pvc := .Values.stablePVCs.pvcs }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $pvc.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ $pvc.storageClassName | default $.Values.stablePVCs.defaultStorageClassName }}
  resources:
    requests:
      storage: {{ $pvc.size }}
{{- end }}
{{- end }}
