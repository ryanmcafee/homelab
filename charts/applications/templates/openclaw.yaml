{{- /*
OpenClaw (issue #425, docs/apps/openclaw.md): AI agent instances run by
openclaw-operator, wired to the same credential pattern as charts/paperclip.
Four Applications in one sync order (rule gitops/<env>/waves: -dependencies < main):
  wave 10  Namespaces openclaw-system, openclaw
  wave 11  openclaw-operator      OCI chart ghcr.io/paperclipinc/charts/openclaw-operator (CRDs + controller)
  wave 12  openclaw-dependencies  charts/openclaw-dependencies (OnePasswordItems -> Secrets openclaw-api-keys, openclaw-gateway; secret store only)
  wave 13  openclaw               charts/openclaw (openclaw.rocks OpenClawInstance) + PostSync smoke Job
Every value comes from the `openclaw:` block of configuration/templates/helm-apps.tmpl;
charts/applications/values.yaml only holds placeholders. Derived values reach the
two child charts through helm.valuesObject (ADR-010), so their committed values
files carry no hostname or 1Password path.
Never part of a preview (docs/runbooks/previews.md): an operator, CRDs and
1Password items are cluster-level concerns.
*/}}
{{- $oc := .Values.openclaw }}
{{- if and $oc.enabled (not (include "homelab.preview.enabled" .)) }}
---
# Namespace for the openclaw-operator controller. The chart runs it non-root
# (uid 65532) with every capability dropped, so baseline is enough.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $oc.operator.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    {{- include "homelab.meshLabels" (dict "namespace" $oc.operator.namespace "root" $) }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
# Namespace for the OpenClawInstance. The operator's pod template is non-root
# with a read-only root filesystem; created here so the wave-13 smoke Job has a
# target before CreateNamespace=true would create it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $oc.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    {{- include "homelab.meshLabels" (dict "namespace" $oc.namespace "root" $) }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
# Operator Application: CRDs (openclawinstances, openclawselfconfigs,
# openclawclusterdefaults in openclaw.rocks) and the controller. The CRDs are
# chart templates gated by crds.install and kept on uninstall (crds.keep). The
# OpenClawInstance CRD renders to ~625 KiB, far past the 256 KiB
# client-side-apply limit, so ServerSideApply=true is mandatory
# (tests/gitops/huge-crd-charts.yaml).
# The repository Secret paperclipinc-oci is rendered by templates/paperclip.yaml:
# both operators come from ghcr.io/paperclipinc/charts and ArgoCD keys repository
# Secrets by URL, so a second copy would be a duplicate name for one credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $oc.operator.chart.repo }}
    chart: {{ $oc.operator.chart.name }}
    targetRevision: {{ $oc.operator.chart.version | quote }}
    helm:
      releaseName: openclaw-operator
      values: |
        crds:
          install: true
          keep: true
        # Empty (the chart default) binds Secret get/list/watch/create/update/patch
        # cluster-wide; naming the instance namespace makes that a namespaced Role.
        watchNamespaces:
          - {{ $oc.namespace }}
        rbac:
          aggregateToDefaultRoles: false
        metrics:
          enabled: true
          serviceMonitor:
            enabled: {{ $oc.operator.serviceMonitor.enabled }}
        {{- if $oc.operator.resources }}
        resources:
          {{- toYaml $oc.operator.resources | nindent 10 }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $oc.operator.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# Dependencies Application: the 1Password items the Instance reads
# (openclaw-api-keys: ANTHROPIC_OAUTH_TOKEN, and ANTHROPIC_API_KEY / OPENAI_API_KEY
# only where a toggle asks for them; openclaw-gateway: token). Only where a secret
# store exists (SECRETS_PROVIDER): without one the chart would render nothing, and
# localdev seeds both Secrets in localdev/fakes/secrets.yaml instead.
{{- if $oc.dependencies.onePassword.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/openclaw-dependencies
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # 1Password paths come from configuration/ (secrets.schema.yaml) through
      # this parent, so the child's committed values stay environment-free.
      valuesObject:
        namespace: {{ $oc.namespace }}
        onePassword:
          {{- toYaml $oc.dependencies.onePassword | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $oc.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
---
# Instance Application: the openclaw.rocks/v1alpha1 OpenClawInstance. Health comes
# from charts/bootstrap/files/health/openclaw.rocks_OpenClawInstance.lua
# (status.phase Running with Ready not False = Healthy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/openclaw
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # Hostname, image tag, Gateway and storage class come from configuration/
      # through this parent (ADR-010); never put them in charts/openclaw/values-homelab.yaml.
      valuesObject:
        namespace: {{ $oc.namespace }}
        hostname: {{ $oc.hostname }}
        {{- toYaml $oc.instance | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $oc.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    # The OpenClawInstance CRD comes from openclaw-operator (wave 11); retry covers
    # a sync that lands before the CRD is served or the gateway Secret exists.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- include "homelab.smokeJob" (dict "name" "openclaw" "namespace" $oc.namespace "smoke" $oc.smoke "wave" "13" "image" .Values.global.images.curl) }}
{{- end }}
