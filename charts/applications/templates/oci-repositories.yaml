# OCI Repository configurations for ArgoCD
# These allow ArgoCD to pull helm charts from OCI registries
{{- if .Values.sonarr.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: truecharts-sonarr-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "0"
stringData:
  name: truecharts-sonarr
  type: helm
  url: {{ .Values.sonarr.chart.repo }}
  enableOCI: "true"
{{- end }}
