{{- if .Values.radarr.enabled }}
---
# Radarr Config: deploys static PV+PVC for radarr persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/radarr-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.radarr.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
    {{- if eq .Values.global.environment "localdev" }}
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #263: localdev renders addons/applications without the CMP domain-substitution stage (CLAUDE.md's CMP Architecture: localdev uses native Helm with values-localdev.yaml, no CMP), so this Ingress hostname stays the checked-in values.yaml placeholder here; it is never resolved or used in localdev (services are reached via NodePort). Fix is to generate values-localdev.yaml from config; remove this exemption then. In homelab this hostname is correctly domain-derived by the two-stage config-export flow, so the exemption is scoped to localdev only."
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.radarr.chart.name }}
    targetRevision: {{ .Values.radarr.chart.version }}
    helm:
      releaseName: radarr
      values: |
        {{- if .Values.radarr.workload }}
        workload:
          {{- toYaml .Values.radarr.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.radarr.persistence }}
        persistence:
          {{- toYaml .Values.radarr.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.radarr.ingress }}
        ingress:
          {{- toYaml .Values.radarr.ingress | nindent 10 }}
        {{- end }}

        {{- if .Values.radarr.TZ }}
        TZ: {{ .Values.radarr.TZ | quote }}
        {{- end }}

        {{- if .Values.radarr.securityContext }}
        securityContext:
          {{- toYaml .Values.radarr.securityContext | nindent 10 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.radarr.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
