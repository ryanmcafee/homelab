{{- if .Values.duckdns.enabled }}
---
# Namespace for DuckDNS resources
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.duckdns.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Dependencies Application: deploys OnePasswordItem for DuckDNS token
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckdns-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/duckdns-dependencies
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.duckdns.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
# DuckDNS Application: deploys the updater CronJob
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckdns
  namespace: argocd
  annotations:
    # Wave 2: After duckdns-dependencies (wave 1) creates the secret
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/duckdns
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.duckdns.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
