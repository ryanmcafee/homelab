{{- if include "homelab.preview.appEnabled" (dict "root" . "app" "flaresolverr") }}
{{- if not (include "homelab.preview.enabled" .) }}
---
# FlareSolverr Config: deploys static PV+PVC for flaresolverr persistent storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/flaresolverr-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      valuesObject:
        iscsi:
          portal: {{ .Values.global.iscsi.portal | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.flaresolverr.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "homelab.preview.appName" (dict "root" . "app" "flaresolverr") }}
  namespace: {{ include "homelab.preview.appNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ include "homelab.preview.project" . }}
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.flaresolverr.chart.name }}
    targetRevision: {{ .Values.flaresolverr.chart.version }}
    helm:
      releaseName: flaresolverr
      values: |
        {{- if .Values.flaresolverr.workload }}
        workload:
          {{- toYaml .Values.flaresolverr.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.flaresolverr.persistence }}
        persistence:
          {{- include "homelab.preview.persistence" (dict "root" . "persistence" .Values.flaresolverr.persistence) | nindent 10 }}
        {{- end }}

        {{- if .Values.flaresolverr.ingress }}
        ingress:
          {{- include "homelab.preview.hosts" (dict "root" . "text" (toYaml .Values.flaresolverr.ingress)) | nindent 10 }}
        {{- end }}

        {{- if .Values.flaresolverr.TZ }}
        TZ: {{ .Values.flaresolverr.TZ | quote }}
        {{- end }}

        {{- if .Values.flaresolverr.securityContext }}
        securityContext:
          {{- toYaml .Values.flaresolverr.securityContext | nindent 10 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "homelab.preview.destNamespace" (dict "root" . "namespace" .Values.flaresolverr.namespace) }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- include "homelab.smokeJob" (dict "name" "flaresolverr" "namespace" (include "homelab.preview.destNamespace" (dict "root" . "namespace" .Values.flaresolverr.namespace)) "smoke" (include "homelab.preview.smoke" (dict "root" . "smoke" .Values.flaresolverr.smoke "namespace" .Values.flaresolverr.namespace) | fromYaml) "wave" "12" "image" .Values.global.images.curl) }}
{{- end }}
