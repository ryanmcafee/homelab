{{- if .Values.sonarr.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.sonarr.chart.name }}
    targetRevision: {{ .Values.sonarr.chart.version }}
    helm:
      releaseName: sonarr
      values: |
        {{- if .Values.sonarr.workload }}
        workload:
          {{- toYaml .Values.sonarr.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.sonarr.persistence }}
        persistence:
          {{- toYaml .Values.sonarr.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.sonarr.ingress }}
        ingress:
          {{- toYaml .Values.sonarr.ingress | nindent 10 }}
        {{- end }}

        {{- if .Values.sonarr.TZ }}
        TZ: {{ .Values.sonarr.TZ | quote }}
        {{- end }}

        {{- if .Values.sonarr.securityContext }}
        securityContext:
          {{- toYaml .Values.sonarr.securityContext | nindent 10 }}
        {{- end }}

        {{- if .Values.sonarr.metrics }}
        metrics:
          {{- toYaml .Values.sonarr.metrics | nindent 10 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.sonarr.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
