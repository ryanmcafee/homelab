{{- if .Values.mosquitto.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci.trueforge.org/truecharts
    chart: {{ .Values.mosquitto.chart.name }}
    targetRevision: {{ .Values.mosquitto.chart.version }}
    helm:
      releaseName: mosquitto
      values: |
        {{- if .Values.mosquitto.workload }}
        workload:
          {{- toYaml .Values.mosquitto.workload | nindent 10 }}
        {{- end }}

        {{- if .Values.mosquitto.persistence }}
        persistence:
          {{- toYaml .Values.mosquitto.persistence | nindent 10 }}
        {{- end }}

        {{- if .Values.mosquitto.service }}
        service:
          {{- toYaml .Values.mosquitto.service | nindent 10 }}
        {{- end }}

        {{- if .Values.mosquitto.mosquitto }}
        mosquitto:
          {{- toYaml .Values.mosquitto.mosquitto | nindent 10 }}
        {{- end }}

        {{- if .Values.mosquitto.TZ }}
        TZ: {{ .Values.mosquitto.TZ | quote }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.mosquitto.namespace }}

  # Ignore TrueCharts dynamic fields and Kubernetes defaults
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations | to_entries | map(select(.key | startswith("checksum/"))) | from_entries
      jsonPointers:
        - /spec/template/spec/hostUsers

  syncPolicy:
    # Automatic sync disabled - manual sync only
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
