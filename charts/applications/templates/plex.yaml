{{- if .Values.plex.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.plex.chart.repo }}
    chart: {{ .Values.plex.chart.name }}
    targetRevision: {{ .Values.plex.chart.version }}
    helm:
      releaseName: plex
      values: |
        image:
          repository: {{ .Values.plex.image.repository }}
          tag: {{ .Values.plex.image.tag }}
          pullPolicy: {{ .Values.plex.image.pullPolicy }}

        env:
          {{- range $key, $value := .Values.plex.env }}
          {{ $key }}: {{ $value | quote }}
          {{- end }}

        {{- if .Values.plex.nodeSelector }}
        nodeSelector:
          {{- toYaml .Values.plex.nodeSelector | nindent 10 }}
        {{- end }}

        resources:
          {{- toYaml .Values.plex.resources | nindent 10 }}

        persistence:
          config:
            enabled: {{ .Values.plex.persistence.config.enabled }}
            storageClass: {{ .Values.plex.persistence.config.storageClass }}
            size: {{ .Values.plex.persistence.config.size }}
            accessMode: {{ .Values.plex.persistence.config.accessMode }}

          {{- if .Values.plex.persistence.media.enabled }}
          media:
            enabled: true
            type: {{ .Values.plex.persistence.media.type }}
            server: {{ .Values.plex.persistence.media.server }}
            path: {{ .Values.plex.persistence.media.path }}
            mountPath: {{ .Values.plex.persistence.media.mountPath }}
          {{- end }}

          {{- if .Values.plex.persistence.transcode.enabled }}
          transcode:
            enabled: true
            type: {{ .Values.plex.persistence.transcode.type }}
            {{- if .Values.plex.persistence.transcode.medium }}
            medium: {{ .Values.plex.persistence.transcode.medium }}
            {{- end }}
            {{- if .Values.plex.persistence.transcode.sizeLimit }}
            sizeLimit: {{ .Values.plex.persistence.transcode.sizeLimit }}
            {{- end }}
          {{- end }}

        {{- if .Values.plex.ingress.enabled }}
        ingress:
          enabled: true
          className: {{ .Values.plex.ingress.className }}
          annotations:
            {{- toYaml .Values.plex.ingress.annotations | nindent 12 }}
          hosts:
            {{- toYaml .Values.plex.ingress.hosts | nindent 12 }}
          tls:
            {{- toYaml .Values.plex.ingress.tls | nindent 12 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.plex.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
