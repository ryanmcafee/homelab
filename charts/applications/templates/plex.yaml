{{- if .Values.plex.enabled }}
---
# Dependencies Application: deploys OnePasswordItem for Plex claim token
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/plex-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.plex.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
# Plex Application: deploys the media server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.plex.chart.repo }}
    chart: {{ .Values.plex.chart.name }}
    targetRevision: {{ .Values.plex.chart.version }}
    helm:
      releaseName: plex
      values: |
        {{- if .Values.plex.image }}
        image:
          {{- toYaml .Values.plex.image | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.extraEnv }}
        extraEnv:
          {{- toYaml .Values.plex.extraEnv | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.runtimeClassName }}
        runtimeClassName: {{ .Values.plex.runtimeClassName }}
        {{- end }}

        {{- if .Values.plex.nodeSelector }}
        nodeSelector:
          {{- toYaml .Values.plex.nodeSelector | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.pms }}
        pms:
          {{- toYaml .Values.plex.pms | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.extraVolumes }}
        extraVolumes:
          {{- toYaml .Values.plex.extraVolumes | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.extraVolumeMounts }}
        extraVolumeMounts:
          {{- toYaml .Values.plex.extraVolumeMounts | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.service }}
        service:
          {{- toYaml .Values.plex.service | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.ingress }}
        ingress:
          {{- toYaml .Values.plex.ingress | nindent 10 }}
        {{- end }}

        {{- if .Values.plex.dnsPolicy }}
        dnsPolicy: {{ .Values.plex.dnsPolicy | quote }}
        {{- end }}

        {{- if .Values.plex.dnsConfig }}
        dnsConfig:
          {{- toYaml .Values.plex.dnsConfig | nindent 10 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.plex.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
