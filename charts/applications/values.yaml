# ============================================================================
# Transmission - BitTorrent Client with VPN
# Sync Wave: 14 (after dependencies)
# ============================================================================

transmission:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/transmission
  chart:
    name: transmission
    repo: https://trueforge-org.github.io/truecharts
    version: 24.3.11

  # 1Password vault path for VPN and RPC credentials
  onePasswordItemPath: ""

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: "true"
              TRANSMISSION_DOWNLOAD_DIR: /downloads
              TRANSMISSION_INCOMPLETE_DIR: /downloads/incomplete
              TRANSMISSION_INCOMPLETE_DIR_ENABLED: "true"
              TRANSMISSION_RATIO_LIMIT: "0.25"
              TRANSMISSION_RATIO_LIMIT_ENABLED: "true"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

  # Gluetun VPN addon
  addons:
    vpn:
      enabled: true
      type: gluetun
      gluetun:
        env:
          VPN_SERVICE_PROVIDER: custom
          VPN_TYPE: openvpn
          DNS_KEEP_NAMESERVER: "on"
          FIREWALL: "on"
          # Allow Kubernetes cluster networking
          FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16"
          FIREWALL_INPUT_PORTS: "9091,51413"

  # Service configuration
  service:
    main:
      ports:
        main:
          port: 9091
    torrent:
      enabled: true
      type: LoadBalancer
      ports:
        torrent:
          enabled: true
          port: 51413
          protocol: tcp

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    # Downloads storage via NFS
    downloads:
      enabled: true
      type: nfs
      server: truenas.ryanmcafee.com
      path: /mnt/storage/downloads
      mountPath: /downloads

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: transmission.ryanmcafee.com
      hosts:
        - host: transmission.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: transmission-tls
          hosts:
            - transmission.ryanmcafee.com

  TZ: America/New_York
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

