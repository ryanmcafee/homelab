# ============================================================================
# Home Assistant - Home Automation Hub
# Sync Wave: 3
# ============================================================================

homeassistant:
  enabled: false
  namespace: home-automation

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/home-assistant
  chart:
    name: home-assistant
    repo: https://trueforge-org.github.io/truecharts
    version: 28.19.14

  # Use linuxserver.io image which includes psycopg2 for PostgreSQL
  image:
    repository: lscr.io/linuxserver/homeassistant
    tag: latest
    pullPolicy: IfNotPresent

  workload:
    main:
      podSpec:
        hostNetwork: true
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 2Gi

  podOptions:
    dnsPolicy: ClusterFirstWithHostNet

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: homeassistant.example.com
      hosts:
        - host: homeassistant.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: homeassistant-tls
          hosts:
            - homeassistant.example.com

  TZ: UTC

