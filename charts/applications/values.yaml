# Applications Chart - Default Production Values
# User-facing applications and services
#
# This chart deploys media management and home automation applications:
# - Plex (Media Server with GPU transcoding)
# - Sonarr (TV Show Management)
# - Radarr (Movie Management)
# - Prowlarr (Indexer Manager)
# - Home Assistant (Home Automation Hub)
# - Mosquitto (MQTT Broker)
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Default ingress class
  ingressClassName: traefik

  # Timezone for applications
  timezone: America/New_York

  # Media storage configuration
  media:
    # NFS mount point for media files
    nfsServer: truenas.ryanmcafee.com
    nfsPath: /mnt/storage/media

# ============================================================================
# Plex Media Server
# Sync Wave: 1 (core media service)
# ============================================================================

plex:
  enabled: true
  namespace: media

  # Official Plex helm chart
  # https://github.com/plexinc/pms-docker/tree/master/charts/plex-media-server
  chart:
    name: plex-media-server
    repo: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
    version: 1.4.0

  # Image configuration
  image:
    registry: index.docker.io
    repository: plexinc/pms-docker
    tag: latest
    pullPolicy: IfNotPresent

  # GPU configuration (NVIDIA Quadro P2200)
  runtimeClassName: nvidia  # For GPU transcoding

  # Node selector for GPU-enabled nodes
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"  # NVIDIA GPU

  # Resource requests and limits
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1

  # Plex configuration
  pms:
    # Plex claim token from https://plex.tv/claim
    claimToken: ""  # Provided via 1Password
    configExistingClaim: ""
    storageClassName: democratic-csi-nfs

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 100Gi
      accessMode: ReadWriteOnce

    # Transcode directory (ephemeral for performance)
    transcode:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 20Gi
      emptyDir:
        enabled: true
        medium: Memory
        sizeLimit: 10Gi

  # Extra volumes for media storage via NFS
  extraVolumes:
    - name: media
      nfs:
        server: truenas.ryanmcafee.com
        path: /mnt/storage/media

  extraVolumeMounts:
    - name: media
      mountPath: /media
      readOnly: false

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/hostname: plex.ryanmcafee.com
    hosts:
      - host: plex.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: plex-tls
        hosts:
          - plex.ryanmcafee.com

  # Environment variables
  extraEnv:
    TZ: America/New_York
    ADVERTISE_IP: https://plex.ryanmcafee.com:443

# ============================================================================
# Sonarr - TV Show Management
# Sync Wave: 2
# ============================================================================

sonarr:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/sonarr
  chart:
    name: sonarr
    repo: https://trueforge-org.github.io/truecharts
    version: 25.2.11

  # TrueCharts uses common library pattern
  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    # Media storage via NFS
    media:
      enabled: true
      type: nfs
      server: truenas.ryanmcafee.com
      path: /mnt/storage/media
      mountPath: /media

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: sonarr.ryanmcafee.com
      hosts:
        - host: sonarr.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: sonarr-tls
          hosts:
            - sonarr.ryanmcafee.com

  TZ: America/New_York
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

