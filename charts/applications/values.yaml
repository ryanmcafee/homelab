# Applications Chart - Default Production Values
# User-facing applications and services
#
# This chart deploys media management and home automation applications:
# - Plex (Media Server with GPU transcoding)
# - Sonarr (TV Show Management)
# - Radarr (Movie Management)
# - Prowlarr (Indexer Manager)
# - Home Assistant (Home Automation Hub)
# - Mosquitto (MQTT Broker)
# - DuckDNS Updater (Dynamic DNS)
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: example.com

  # Git repository for local charts
  repoUrl: https://github.com/ryanmcafee/homelab.git
  targetRevision: main

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Default ingress classes
  ingressClassNameExternal: external
  ingressClassNameInternal: internal

  # Timezone for applications
  timezone: UTC

  # Media storage configuration (multiple NFS paths)
  media:
    nfsServer: truenas.example.com
    movies: /mnt/storage/movies
    tv: /mnt/storage/tv
    music: /mnt/storage/music
    pictures: /mnt/storage/pictures
    documents: /mnt/storage/documents
    downloads: /mnt/storage/downloads
    books: /mnt/storage/books

# ============================================================================
# Plex Media Server
# Sync Wave: 1 (core media service)
# ============================================================================

plex:
  enabled: true
  namespace: media

  # Official Plex helm chart
  # https://github.com/plexinc/pms-docker/tree/master/charts/plex-media-server
  chart:
    name: plex-media-server
    repo: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
    version: 1.4.0

  # Image configuration
  image:
    registry: index.docker.io
    repository: plexinc/pms-docker
    tag: latest
    pullPolicy: IfNotPresent

  # GPU configuration for hardware transcoding
  # Active vendor is set by CMP template from GPU_VENDOR config flag
  # In values.yaml, vendor defaults to "none" (safe for localdev/non-GPU clusters)
  gpu:
    # Active vendor: none | nvidia | intel
    vendor: "none"

    # NVIDIA GPU settings (Quadro P2200)
    # NFD's default PCI label format is pci-<class>_<vendor>.present where 0300
    # is the PCI class code for "Display controller" and 10de is NVIDIA's vendor
    # ID. The short pci-10de.present form is NOT emitted by NFD's default
    # source config — using it as a nodeSelector would leave the pod Pending.
    nvidia:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"

    # Intel GPU settings (Arc Pro B50). Uses the Intel GPU device plugin's
    # `intel-gpu-platform-labeling` NodeFeatureRule label, which is set only on
    # nodes where the device plugin successfully identifies an Intel GPU. This
    # is the canonical Intel-side convention (the GpuDevicePlugin CR uses the
    # same label as its own nodeSelector).
    intel:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # gpu.intel.com/xe resource limit intentionally omitted — the device
      # plugin DaemonSet is Running but is not advertising the resource yet
      # on this Talos cluster. Plex gets /dev/dri via the hostPath mount
      # below and uses the GPU directly via the xe driver. Re-add the limit
      # once the plugin advertises the resource.
      devDri:
        hostPath: /dev/dri

  # Plex configuration
  pms:
    configExistingClaim: ""
    storageClassName: democratic-csi-iscsi
    # Plex claim token from 1Password
    claimSecret:
      name: plex
      key: plex-claim-token

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 100Gi
      accessMode: ReadWriteOnce

    # Transcode directory (ephemeral for performance)
    transcode:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 20Gi
      emptyDir:
        enabled: true
        medium: Memory
        sizeLimit: 10Gi

  # Service configuration
  service:
    type: LoadBalancer
    port: 32400
    externalTrafficPolicy: Local

  # Extra volumes for media storage via NFS
  extraVolumes:
    - name: movies
      nfs:
        server: truenas.example.com
        path: /mnt/storage/movies
    - name: tv
      nfs:
        server: truenas.example.com
        path: /mnt/storage/tv
    - name: music
      nfs:
        server: truenas.example.com
        path: /mnt/storage/music
    - name: pictures
      nfs:
        server: truenas.example.com
        path: /mnt/storage/pictures

  extraVolumeMounts:
    - name: movies
      mountPath: /movies
      readOnly: false
    - name: tv
      mountPath: /tv
      readOnly: false
    - name: music
      mountPath: /music
      readOnly: false
    - name: pictures
      mountPath: /pictures
      readOnly: false

  # Ingress configuration
  # Note: Plex chart uses 'url' field instead of 'hosts' array
  ingress:
    enabled: true
    ingressClassName: external
    url: "https://plex.example.com"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/hostname: plex.example.com
    tls:
      - secretName: plex-tls
        hosts:
          - plex.example.com

  # Environment variables
  extraEnv:
    TZ: UTC
    ADVERTISE_IP: https://plex.example.com:443
    PLEX_UID: "568"
    PLEX_GID: "100"
    CHANGE_CONFIG_DIR_OWNERSHIP: "false"

  # DNS configuration - custom resolvers with cluster DNS fallback
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - "8.8.8.8"
      - "8.8.4.4"
      - "10.96.0.10"
    searches:
      - media.svc.cluster.local
      - svc.cluster.local
      - cluster.local
    options:
      - name: ndots
        value: "5"

# ============================================================================
# Sonarr - TV Show Management
# Sync Wave: 2
# ============================================================================

sonarr:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/sonarr
  chart:
    name: sonarr
    repo: https://trueforge-org.github.io/truecharts
    version: 25.2.11

  # TrueCharts uses common library pattern
  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi
          exportarr:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    # TV storage via NFS
    tv:
      enabled: true
      type: nfs
      server: truenas.example.com
      path: /mnt/storage/tv
      mountPath: /tv

    # Downloads storage via NFS
    downloads:
      enabled: true
      type: nfs
      server: truenas.example.com
      path: /mnt/storage/downloads
      mountPath: /downloads

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: sonarr.example.com
      hosts:
        - host: sonarr.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: sonarr-tls
          hosts:
            - sonarr.example.com

  TZ: UTC
  securityContext:
    container:
      runAsUser: 568
      runAsGroup: 100
    pod:
      fsGroup: 100

