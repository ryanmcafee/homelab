# ============================================================================
# Home Assistant - Home Automation Hub
# Sync Wave: 3
# ============================================================================

homeassistant:
  enabled: true
  namespace: home-automation

  # Chart source
  chart:
    name: home-assistant
    repo: https://bjw-s.github.io/helm-charts
    version: 0.2.0

  # Image configuration
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: latest
    pullPolicy: IfNotPresent

  # Host network for device discovery
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Resource requests and limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessMode: ReadWriteOnce

  # Ingress configuration
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/hostname: homeassistant.ryanmcafee.com
    hosts:
      - host: homeassistant.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: homeassistant-tls
        hosts:
          - homeassistant.ryanmcafee.com

  # Environment variables
  env:
    TZ: America/New_York

# ============================================================================
# Mosquitto - MQTT Broker
# Sync Wave: 3
# ============================================================================

mosquitto:
  enabled: true
  namespace: home-automation

  # Chart source
  chart:
    name: mosquitto
    repo: https://bjw-s.github.io/helm-charts
    version: 0.2.0

  # Image configuration
  image:
    repository: eclipse-mosquitto
    tag: latest
    pullPolicy: IfNotPresent

  # Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessMode: ReadWriteOnce

    data:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessMode: ReadWriteOnce

  # Service configuration
  service:
    type: LoadBalancer
    ports:
      mqtt:
        port: 1883
        protocol: TCP
      websocket:
        port: 9001
        protocol: TCP

  # Authentication configuration
  auth:
    enabled: true
    # Username and password from 1Password

  # Environment variables
  env:
    TZ: America/New_York
