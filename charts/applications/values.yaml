# ============================================================================
# NZBGet - Usenet Downloader
# Sync Wave: 13
# ============================================================================

nzbget:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/nzbget
  chart:
    name: nzbget
    repo: https://trueforge-org.github.io/truecharts
    version: 28.3.20

  workload:
    main:
      podSpec:
        containers:
          main:
            # NOTE: nzbget v26 made `MainDir` and `ScriptDir` REQUIRED and
            # renamed the bundled 7-zip from /usr/bin/7za to /usr/bin/7z. The
            # PVC at /config/nzbget.conf has been hand-fixed (lines 11/71/1533)
            # to set MainDir=/downloads, ScriptDir=/config/scripts, and
            # SevenZipCmd=/usr/bin/7z. nzbget v26 rejects the dotted
            # `-o Section.Key=value` CLI override syntax, so we cannot pass
            # these as args from the chart. If the PVC is ever lost, restore
            # the same three values via `kubectl exec sed -i ...` after the
            # pod first crashes.
            resources:
              # Bumped from 256Mi/1Gi after nzbget-584d9c95cc-jwnkg was OOMKilled
              # within 7 seconds of startup on a 1Gi limit. v26 of nzbget appears
              # to use significantly more memory at startup than v25 (probably
              # due to the new par2 + unpack subsystems). 1Gi was sufficient
              # historically; bump to 2Gi to give headroom for active unpacking.
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 5Gi
      accessModes:
        - ReadWriteOnce

    # Downloads storage via NFS
    downloads:
      enabled: true
      type: nfs
      server: truenas.example.com
      path: /mnt/storage/downloads
      mountPath: /downloads

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: nzbget.example.com
      hosts:
        - host: nzbget.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: nzbget-tls
          hosts:
            - nzbget.example.com

  TZ: UTC
  securityContext:
    container:
      runAsUser: 568
      runAsGroup: 100
    pod:
      fsGroup: 100

