# ============================================================================
# Home Assistant - Home Automation Hub
# Sync Wave: 3
# ============================================================================

homeassistant:
  enabled: true
  namespace: home-automation

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/home-assistant
  chart:
    name: home-assistant
    repo: https://trueforge-org.github.io/truecharts
    version: 28.19.14

  # Use linuxserver.io image which includes psycopg2 for PostgreSQL
  image:
    repository: lscr.io/linuxserver/homeassistant
    tag: latest
    pullPolicy: IfNotPresent

  workload:
    main:
      podSpec:
        hostNetwork: true
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 2Gi

  podOptions:
    dnsPolicy: ClusterFirstWithHostNet

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: homeassistant.ryanmcafee.com
      hosts:
        - host: homeassistant.ryanmcafee.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: homeassistant-tls
          hosts:
            - homeassistant.ryanmcafee.com

  TZ: America/New_York

# ============================================================================
# Mosquitto - MQTT Broker
# Sync Wave: 3
# ============================================================================

mosquitto:
  enabled: true
  namespace: home-automation

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/mosquitto
  chart:
    name: mosquitto
    repo: https://trueforge-org.github.io/truecharts
    version: 17.13.9

  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    data:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

  # Service configuration
  service:
    main:
      type: LoadBalancer
      ports:
        main:
          port: 1883
          protocol: tcp
    websocket:
      enabled: true
      type: LoadBalancer
      ports:
        websocket:
          port: 9001
          protocol: tcp

  # Authentication configuration
  mosquitto:
    auth:
      enabled: true
      # Username and password from 1Password

  TZ: America/New_York
