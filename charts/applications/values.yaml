# ============================================================================
# Home Assistant - Home Automation Hub
# Sync Wave: 3
# ============================================================================

homeassistant:
  enabled: false
  namespace: home-automation

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/home-assistant
  chart:
    name: home-assistant
    repo: https://trueforge-org.github.io/truecharts
    version: 28.19.14

  # Use linuxserver.io image which includes psycopg2 for PostgreSQL
  image:
    repository: lscr.io/linuxserver/homeassistant
    tag: latest
    pullPolicy: IfNotPresent

  workload:
    main:
      podSpec:
        hostNetwork: true
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 2Gi

  podOptions:
    dnsPolicy: ClusterFirstWithHostNet

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Ingress configuration
  ingress:
    main:
      enabled: true
      ingressClassName: internal
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: homeassistant.example.com
      hosts:
        - host: homeassistant.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: homeassistant-tls
          hosts:
            - homeassistant.example.com

  TZ: UTC

# ============================================================================
# Mosquitto - MQTT Broker
# Sync Wave: 3
# ============================================================================

mosquitto:
  enabled: true
  namespace: home-automation

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/mosquitto
  chart:
    name: mosquitto
    repo: https://trueforge-org.github.io/truecharts
    version: 17.13.9

  workload:
    main:
      podSpec:
        containers:
          main:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    data:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

  # Service configuration
  service:
    main:
      type: LoadBalancer
      ports:
        main:
          port: 1883
    websockets:
      enabled: true
      type: LoadBalancer
      ports:
        websockets:
          enabled: true
          port: 9001

  # Authentication configuration
  mosquitto:
    auth:
      enabled: true
      # Username and password from 1Password

  TZ: UTC

# ============================================================================
# FlareSolverr - Cloudflare Protection Bypass Proxy
# Sync Wave: 12 (before Prowlarr at wave 13)
# ============================================================================

flaresolverr:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/flaresolverr
  chart:
    name: flaresolverr
    repo: https://trueforge-org.github.io/truecharts
    version: 16.14.17

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              BROWSER_TIMEOUT: 40000
              HEADLESS: true
              LOG_LEVEL: info
              LOG_HTML: false
              CAPTCHA_SOLVER: none
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

  TZ: UTC
  securityContext:
    container:
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0

# ============================================================================
# DuckDNS - Dynamic DNS Updater
# Sync Wave: 1 (early infrastructure)
# ============================================================================

duckdns:
  enabled: false
  namespace: duckdns

  # DuckDNS subdomain (without .duckdns.org)
  subdomain: ""

  # 1Password vault path for DuckDNS token
  # The secret should have a field named "token"
  onePasswordItemPath: ""

# ============================================================================
# Renovate - Automated Dependency Updates
# Sync Wave: 12
# ============================================================================

renovate:
  enabled: true
  namespace: renovate

  # Renovate Helm chart (OCI)
  # https://github.com/renovatebot/helm-charts
  chart:
    name: renovate
    repo: ghcr.io/renovatebot/charts
    version: "46.49.0"

  # CronJob schedule (every 4 hours)
  schedule: "0 */4 * * *"

  # Renovate configuration
  config:
    platform: github
    repositories:
      - ryanmcafee/homelab
    gitAuthor: "Renovate Bot <renovate@ryanmcafee.com>"
    onboarding: false
    requireConfig: "optional"

  # Resource requests and limits
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
