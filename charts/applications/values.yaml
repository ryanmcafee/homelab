      enabled: true
      type: LoadBalancer
      ports:
        websockets:
          enabled: true
          port: 9001

  # Authentication configuration
  mosquitto:
    auth:
      enabled: true
      # Username and password from 1Password

  TZ: UTC

# ============================================================================
# FlareSolverr - Cloudflare Protection Bypass Proxy
# Sync Wave: 12 (before Prowlarr at wave 13)
# ============================================================================

flaresolverr:
  enabled: true
  namespace: media

  # TrueCharts helm chart
  # https://github.com/trueforge-org/truecharts/tree/master/charts/stable/flaresolverr
  chart:
    name: flaresolverr
    repo: https://trueforge-org.github.io/truecharts
    version: 16.14.17

  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              BROWSER_TIMEOUT: 40000
              HEADLESS: true
              LOG_LEVEL: info
              LOG_HTML: false
              CAPTCHA_SOLVER: none
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 1Gi
      accessModes:
        - ReadWriteOnce

  TZ: UTC
  securityContext:
    container:
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0

# ============================================================================
# DuckDNS - Dynamic DNS Updater
# Sync Wave: 1 (early infrastructure)
# ============================================================================

duckdns:
  enabled: false
  namespace: duckdns

  # DuckDNS subdomain (without .duckdns.org)
  subdomain: ""

  # 1Password vault path for DuckDNS token
  # The secret should have a field named "token"
  onePasswordItemPath: ""

# ============================================================================
# ArgoCD - Self-Management
# Sync Wave: 5 (LAST - deploys after all applications to ensure stability)
# ============================================================================

argocd:
  # Disabled by default - enable in environment-specific values
  # This allows ArgoCD to manage itself after initial bootstrap
  enabled: false
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    # Enable App of Apps health status progression
    configs:
      cm:
        # Enable ksops plugin for SOPS decryption
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs

    server:
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # SOPS/ksops configuration for decrypting secrets
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      # Mount age key and custom tools
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age-key
        - name: cmp-tmp
          emptyDir: {}
        - name: homelab-config
          secret:
            secretName: homelab-environment-config
            optional: true
      volumeMounts:
        - name: custom-tools
          mountPath: /usr/local/bin/ksops
          subPath: ksops
        - name: custom-tools
          mountPath: /usr/local/bin/kustomize
          subPath: kustomize
        - name: sops-age
          mountPath: /.config/sops/age
      # Init container to install ksops
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args:
            - echo "Installing KSOPS...";
              cp /usr/local/bin/ksops /custom-tools/ksops;
              cp /usr/local/bin/kustomize /custom-tools/kustomize;
              echo "Done.";
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      # CMP sidecar for homelab config plugin
      extraContainers:
        - name: homelab-cmp
          image: ghcr.io/ryanmcafee/homelab-cmp:951e2aabd318b5bf5edf89478834bd6a76fdb284
          command: [/var/run/argocd/argocd-cmp-server]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "90"
          volumeMounts:
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins
            - mountPath: /tmp
              name: cmp-tmp
            - mountPath: /config/homelab.yaml
              name: homelab-config
              subPath: homelab.yaml
              readOnly: true

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
