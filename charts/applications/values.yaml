# Applications Chart - Default Production Values
# User-facing applications and services
#
# This chart deploys media management and home automation applications:
# - Plex (Media Server with GPU transcoding)
# - Sonarr (TV Show Management)
# - Radarr (Movie Management)
# - Prowlarr (Indexer Manager)
# - Home Assistant (Home Automation Hub)
# - Mosquitto (MQTT Broker)
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-dev.yaml (development Talos cluster)
# - values-prod.yaml (production Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: prod

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Default ingress class
  ingressClassName: traefik

  # Timezone for applications
  timezone: America/New_York

  # Media storage configuration
  media:
    # NFS mount point for media files
    nfsServer: truenas.ryanmcafee.com
    nfsPath: /mnt/tank/media

# ============================================================================
# Plex Media Server
# Sync Wave: 1 (core media service)
# ============================================================================

plex:
  enabled: true
  namespace: media

  # Chart source (using k8s-at-home charts)
  chart:
    name: plex
    repo: https://bjw-s.github.io/helm-charts
    version: 0.2.0

  # Image configuration
  image:
    repository: plexinc.ghcr.io/plex
    tag: latest
    pullPolicy: IfNotPresent

  # GPU configuration (NVIDIA Quadro P2200)
  gpu:
    enabled: true
    vendor: nvidia
    count: 1

  # Node selector for GPU-enabled nodes
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"  # NVIDIA GPU

  # Resource requests and limits
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1

  # Persistence configuration
  persistence:
    config:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 100Gi
      accessMode: ReadWriteOnce

    # Media storage via NFS
    media:
      enabled: true
      type: nfs
      server: truenas.ryanmcafee.com
      path: /mnt/tank/media
      mountPath: /media

    # Transcode directory (ephemeral for performance)
    transcode:
      enabled: true
      type: emptyDir
      medium: Memory
      sizeLimit: 10Gi

  # Ingress configuration
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/hostname: plex.ryanmcafee.com
    hosts:
      - host: plex.ryanmcafee.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: plex-tls
        hosts:
          - plex.ryanmcafee.com

  # Environment variables
  env:
    TZ: America/New_York
    PLEX_CLAIM: ""  # Provided via 1Password
    ADVERTISE_IP: https://plex.ryanmcafee.com:443

