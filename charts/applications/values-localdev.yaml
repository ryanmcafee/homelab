# ============================================================================
# DuckDNS - Dynamic DNS Updater
# Sync Wave: 1 (early infrastructure)
# ============================================================================

duckdns:
  # Publishes the public address to DuckDNS with a token held in 1Password.
  enabled: false
  namespace: duckdns

  # DuckDNS subdomain (without .duckdns.org)
  subdomain: homelab-dev

  # 1Password vault path for DuckDNS token
  # The secret should have a field named "token"
  onePasswordItemPath: vaults/homelab/items/duckdns

# ============================================================================
# Renovate - Automated Dependency Updates
# Sync Wave: 12
# ============================================================================
# Only the platform-dependent values live here; helm merges them over
# charts/applications/values.yaml. The GitHub token is a 1Password item, so
# Renovate only runs where there is a secret store.

renovate:
  enabled: false
  chart:
    version: 46.106.12
  config:
    gitAuthor: "Renovate Bot <renovate@homelab.local>"

# ============================================================================
# Paperclip - AI agent orchestration (paperclip-operator + CloudNativePG)
# Sync Waves: 10 namespaces, 11 paperclip-operator, 12 paperclip-dependencies,
# 13 paperclip-database, 14 paperclip (issue #260, docs/apps/paperclip.md)
# ============================================================================
# Runs wherever CloudNativePG runs (both environments). The two 1Password
# items only render with a secret store; Kind seeds the same Secrets from
# localdev/fakes/secrets.yaml. Derived values reach the three child charts
# through the parent Applications' helm.valuesObject (ADR-010).

paperclip:
  enabled: true
  namespace: paperclip
  hostname: paperclip.homelab.local

  # paperclip-operator: OCI chart (repoURL without oci://), CRDs + controller.
  operator:
    namespace: paperclip-operator
    chart:
      name: paperclip-operator
      repo: ghcr.io/paperclipinc/charts
      version: "0.19.1"
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # charts/paperclip-dependencies: 1Password items -> Secrets paperclip-auth
  # (BETTER_AUTH_SECRET, ADMIN_PASSWORD) and paperclip-api-keys
  # (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY, ...). Field names in 1Password must equal these keys.
  dependencies:
    onePassword:
      enabled: false
      authItemPath: vaults/homelab/items/paperclip-auth
      apiKeysItemPath: vaults/homelab/items/paperclip-api-keys
      exporterItemPath: vaults/homelab/items/paperclip-exporter
      dotfilesItemPath: ""

  # charts/paperclip-database: CloudNativePG Cluster paperclip-postgres. The image is
  # pinned (CNPG guidance) so an operator bump never upgrades Postgres by itself.
  database:
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.11"
    # Block storage: PostgreSQL refuses a data directory whose files are not
    # owned by uid 26, which is what every file on the NFS classes looks like
    # (mapall). STORAGE_CLASS_SSD is NFS on the SSD pool; this is iSCSI on it.
    storageClass: local-path
    # Kind sizing: local-path volume, small footprint
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  # charts/paperclip: the paperclip.inc Instance (external database mode,
  # authenticated, private exposure behind the internal Gateway).
  instance:
    image:
      repository: ghcr.io/paperclipai/paperclip
      tag: "sha-d3e0f0a"
    # Seeded by the operator's admin-seed Job; the password is the ADMIN_PASSWORD
    # field of the paperclip-auth item. Homelab's admin exists since 2026-09-15,
    # so bootstrap is off there (operator 0.19.1 re-runs the Job while adminUser
    # is rendered, bugs.md 2026-09-30); set it true for one sync on a fresh
    # database. Kind starts from an empty database every time and keeps it on.
    admin:
      bootstrap: true
      email: admin@homelab.local
      name: Admin
    route:
      gateway:
        name: envoy-internal
        namespace: envoy-gateway-system
    persistence:
      size: 1Gi
      # Block storage, like the database: the server asserts that its secrets
      # directory (/paperclip/instances/default/secrets) is owned by uid 1000,
      # which no file on the NFS classes is (mapall). bugs.md 2026-09-15.
      storageClass: local-path
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    # Agent health exporter for the homelab-paperclip alerts; its board API key
    # is the paperclip-exporter item (docs/runbooks/paperclip-agents.md).
    exporter:
      enabled: true
      image: "oven/bun:1.4.2-alpine"

  # PostSync smoke hook (charts/applications/templates/_smoke.tpl): the
  # operator's health path on the Instance Service (port 3100).
  smoke:
    enabled: true
    url: http://paperclip.paperclip.svc.cluster.local:3100/api/health
    expect: ["200"]

# ============================================================================
# LiteLLM - OpenAI-compatible LLM gateway (componentized chart + CloudNativePG)
# Sync Waves: 10 namespace, 11 litellm-dependencies, 12 litellm-database
# (issue #424); the proxy itself follows in a later wave.
# ============================================================================
# Runs wherever CloudNativePG runs (both environments). The three 1Password
# items only render with a secret store; Kind seeds the same Secrets from
# localdev/fakes/secrets.yaml. Derived values reach the child charts through
# the parent Applications' helm.valuesObject (ADR-010).

litellm:
  enabled: true
  namespace: litellm
  hostname: litellm.homelab.local

  # charts/litellm-dependencies: 1Password items -> Secrets
  # litellm-master-key-secret (field master-key), litellm-salt-key (field
  # salt-key) and litellm-api-keys (one field per provider credential). Field
  # names in 1Password must equal these keys. The salt key is a separate item
  # because rotating it makes every credential already stored in the database
  # undecryptable, while the master key is safe to rotate.
  dependencies:
    onePassword:
      enabled: false
      masterKeyItemPath: vaults/homelab/items/litellm-master-key
      saltKeyItemPath: vaults/homelab/items/litellm-salt-key
      apiKeysItemPath: vaults/homelab/items/litellm-api-keys

  # charts/litellm-database: CloudNativePG Cluster litellm-db. The image is
  # pinned (CNPG guidance) so an operator bump never upgrades Postgres by itself.
  database:
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.11"
    # Block storage: PostgreSQL refuses a data directory whose files are not
    # owned by uid 26, which is what every file on the NFS classes looks like
    # (mapall). STORAGE_CLASS_SSD is NFS on the SSD pool; this is iSCSI on it.
    storageClass: local-path
    # Kind sizing: local-path volume, small footprint
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

openclaw:
  enabled: true
  namespace: openclaw
  hostname: openclaw.homelab.local

  # openclaw-operator: OCI chart (repoURL without oci://), CRDs + controller.
  operator:
    namespace: openclaw-system
    chart:
      name: openclaw-operator
      repo: ghcr.io/paperclipinc/charts
      version: "0.40.0"
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # charts/openclaw-dependencies: 1Password items -> Secrets openclaw-api-keys
  # (ANTHROPIC_OAUTH_TOKEN, plus ANTHROPIC_API_KEY / OPENAI_API_KEY only where a
  # toggle asks) and openclaw-gateway (token). Field names in 1Password must equal
  # these keys. A separate item from PAPERCLIP_API_KEYS_1P_PATH: same field names,
  # independent rotation and blast radius (docs/apps/openclaw.md).
  dependencies:
    onePassword:
      enabled: false
      apiKeysItemPath: vaults/homelab/items/openclaw-api-keys
      gatewayItemPath: vaults/homelab/items/openclaw-gateway

  # charts/openclaw: the openclaw.rocks OpenClawInstance, reachable in-cluster
  # only. The internal Gateway serves the whole LAN, not just the tailnet, so no
  # route is attached and no gateway is named -- a named Gateway here would keep
  # openclaw in the docs/networking.md route inventory it no longer belongs to.
  # A tailnet-only endpoint is the tracked way back to remote access:
  #   route:
  #     enabled: true
  #     gateway:
  #       name: envoy-internal
  #       namespace: envoy-gateway-system
  instance:
    route:
      enabled: false
    image:
      repository: ghcr.io/openclaw/openclaw
      tag: "2026.9.6"
    persistence:
      size: 1Gi
      storageClass: local-path
    observability:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # PostSync smoke hook: the gateway's unauthenticated liveness path on the
  # Instance Service (gateway port 18789); the Control UI itself needs the token.
  smoke:
    enabled: true
    url: http://openclaw.openclaw.svc.cluster.local:18789/healthz
    expect: ["200"]
