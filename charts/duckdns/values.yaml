# duckdns values

namespace: duckdns

# DuckDNS subdomain (without .duckdns.org)
subdomain: ""

# CronJob schedule (default: every 5 minutes)
schedule: "*/5 * * * *"

# Seconds a finished Job is kept. Without it a failed Job, and the
# KubeJobFailed alert it raises, outlives every later successful run.
ttlSecondsAfterFinished: 3600

# Container image
image:
  repository: curlimages/curl
  tag: "8.19.0"
  pullPolicy: IfNotPresent

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi
