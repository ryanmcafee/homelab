# duckdns values

namespace: duckdns

# DuckDNS subdomain (without .duckdns.org)
subdomain: ""

# CronJob schedule (default: every 5 minutes)
schedule: "*/5 * * * *"

# Container image
image:
  repository: curlimages/curl
  tag: "8.18.0"
  pullPolicy: IfNotPresent

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi
