{{- /*
Logical backups of the paperclip database, and the restore that puts one back
(docs/runbooks/paperclip-db-restore.md). Both are Argo Workflows in this
namespace so they can read the CNPG Secret <name>-app:

  paperclip-db-backup   WorkflowTemplate, run daily by the CronWorkflow of the
                        same name: pg_dump -> /backups/paperclip-<UTC>.dump
  paperclip-db-restore  WorkflowTemplate, run ad hoc: pause Argo CD on the
                        Application, suspend the Instance, dump the current
                        database, pg_restore the chosen dump, resume both
*/}}
{{- with .Values.backup }}
{{- if .enabled }}
{{- $name := $.Values.name }}
{{- $labels := dict "app.kubernetes.io/name" "paperclip-db-backup" "app.kubernetes.io/instance" $name }}
{{- $sa := "paperclip-db-backup" }}
{{- $podSecurity := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
{{- if .artifacts.itemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .artifacts.secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  itemPath: {{ .artifacts.itemPath | quote }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-backups
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    # The dumps are the only copy of the data once the database is gone.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .storageSize }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [paperclip.inc]
    resources: [instances]
    resourceNames: [{{ .instance }}]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [{{ .instance }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}-{{ $.Values.namespace }}
  namespace: {{ .argocd.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [{{ .argocd.application }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}-{{ $.Values.namespace }}
  namespace: {{ .argocd.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}-{{ $.Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Values.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: paperclip-db-backup
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  entrypoint: backup
  serviceAccountName: {{ $sa }}
  activeDeadlineSeconds: 3600
  # A backup and a restore never overlap.
  synchronization:
    mutexes:
      - name: paperclip-db
  podGC:
    strategy: OnPodSuccess
  ttlStrategy:
    secondsAfterSuccess: 604800
    secondsAfterFailure: 1209600
  {{- include "paperclip-database.workflowPod" (dict "root" $ "backup" .) | nindent 2 }}
  templates:
    - name: backup
      {{- include "paperclip-database.pgContainer" (dict "root" $ "backup" . "podSecurity" $podSecurity) | nindent 6 }}
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ $name }}-app
                key: uri
          - name: RETENTION_DAYS
            value: {{ .retentionDays | quote }}
          - name: KEEP
            value: {{ .keep | quote }}
        source: |
          set -eu
          umask 077
          file="/backups/paperclip-$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file="$file.partial"
          pg_restore --list "$file.partial" > /dev/null
          mv "$file.partial" "$file"
          echo "wrote $file ($(du -h "$file" | cut -f1))"
          find /backups -maxdepth 1 -name '*.partial' -mmin +1440 -print -delete
          for prefix in paperclip prerestore-paperclip; do
            ls -1 /backups/"$prefix"-2*.dump 2>/dev/null | sort -r | tail -n +"$((KEEP + 1))" |
              while read -r old; do
                if [ -n "$(find "$old" -mtime +"$RETENTION_DAYS")" ]; then echo "retention: deleting $old"; rm -f "$old"; fi
              done
          done
          echo "backups on the volume:"
          ls -lh /backups
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: paperclip-db-backup
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  schedules:
    - {{ .schedule | quote }}
  timezone: {{ .timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: paperclip-db-backup
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: paperclip-db-restore
  namespace: {{ $.Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  entrypoint: restore
  onExit: resume
  serviceAccountName: {{ $sa }}
  activeDeadlineSeconds: 7200
  synchronization:
    mutexes:
      - name: paperclip-db
  ttlStrategy:
    secondsAfterCompletion: 1209600
  arguments:
    parameters:
      - name: backup
        value: latest
        description: File name under /backups (paperclip-<UTC>.dump), or latest.
      - name: confirm
        value: ""
        description: Must be restore-paperclip; the restore replaces the whole database.
  {{- include "paperclip-database.workflowPod" (dict "root" $ "backup" .) | nindent 2 }}
  templates:
    - name: restore
      steps:
        - - name: preflight
            template: preflight
        - - name: pause-argocd
            template: pause-argocd
        - - name: suspend
            template: suspend
        - - name: wait-stopped
            template: wait-stopped
        - - name: safety-dump
            template: safety-dump
        - - name: pg-restore
            template: pg-restore
            arguments:
              parameters:
                - name: file
                  value: {{ `"{{steps.preflight.outputs.parameters.file}}"` }}

    # Runs after any confirmed restore, failed or not; a refused one leaves the app as it found it.
    - name: resume
      steps:
        - - name: unsuspend
            template: unsuspend
            when: {{ `"'{{workflow.parameters.confirm}}' == 'restore-paperclip'"` }}
        - - name: resume-argocd
            template: resume-argocd
            when: {{ `"'{{workflow.parameters.confirm}}' == 'restore-paperclip'"` }}
        - - name: wait-ready
            template: wait-ready
            when: {{ `"'{{workflow.parameters.confirm}}' == 'restore-paperclip'"` }}

    - name: preflight
      {{- include "paperclip-database.pgContainer" (dict "root" $ "backup" . "podSecurity" $podSecurity) | nindent 6 }}
        env:
          - name: BACKUP
            value: {{ `"{{workflow.parameters.backup}}"` }}
          - name: CONFIRM
            value: {{ `"{{workflow.parameters.confirm}}"` }}
        source: |
          set -eu
          if [ "$CONFIRM" != "restore-paperclip" ]; then
            echo "refusing to restore: pass -p confirm=restore-paperclip (the restore replaces the whole paperclip database)" >&2
            exit 1
          fi
          if [ "$BACKUP" = "latest" ]; then
            file="$(ls -1 /backups/paperclip-2*.dump 2>/dev/null | sort | tail -n 1)"
            [ -n "$file" ] || { echo "no /backups/paperclip-*.dump to restore" >&2; exit 1; }
          else
            file="/backups/$(basename "$BACKUP")"
          fi
          [ -f "$file" ] || { echo "backup $file not found; available:" >&2; ls -1 /backups >&2; exit 1; }
          pg_restore --list "$file" > /dev/null
          echo "restoring $file ($(du -h "$file" | cut -f1))"
          printf '%s' "$file" > /tmp/file
      outputs:
        parameters:
          - name: file
            valueFrom:
              path: /tmp/file

    # skip-reconcile stops sync and self-heal; the parent uses server-side apply, so it keeps the annotation.
    - name: pause-argocd
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ .argocd.application }}
            namespace: {{ .argocd.namespace }}
            annotations:
              argocd.argoproj.io/skip-reconcile: "true"

    - name: resume-argocd
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ .argocd.application }}
            namespace: {{ .argocd.namespace }}
            annotations:
              argocd.argoproj.io/skip-reconcile: null

    - name: suspend
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: paperclip.inc/v1alpha1
          kind: Instance
          metadata:
            name: {{ .instance }}
          spec:
            suspended: true

    - name: unsuspend
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: paperclip.inc/v1alpha1
          kind: Instance
          metadata:
            name: {{ .instance }}
          spec:
            suspended: null

    - name: wait-stopped
      retryStrategy:
        limit: 30
        backoff:
          duration: 10s
      resource:
        action: get
        successCondition: status.replicas == 0
        manifest: |
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: {{ .instance }}

    - name: wait-ready
      retryStrategy:
        limit: 60
        backoff:
          duration: 10s
      resource:
        action: get
        successCondition: status.readyReplicas > 0
        manifest: |
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: {{ .instance }}

    # The database as it was before the restore, so the restore itself can be undone.
    - name: safety-dump
      {{- include "paperclip-database.pgContainer" (dict "root" $ "backup" . "podSecurity" $podSecurity) | nindent 6 }}
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ $name }}-app
                key: uri
        source: |
          set -eu
          umask 077
          file="/backups/prerestore-paperclip-$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --no-owner --no-privileges --dbname="$DATABASE_URL" --file="$file.partial"
          mv "$file.partial" "$file"
          echo "pre-restore state saved to $file"

    - name: pg-restore
      inputs:
        parameters:
          - name: file
      {{- include "paperclip-database.pgContainer" (dict "root" $ "backup" . "podSecurity" $podSecurity) | nindent 6 }}
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ $name }}-app
                key: uri
          - name: FILE
            value: {{ `"{{inputs.parameters.file}}"` }}
        source: |
          set -eu
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND usename = current_user AND pid <> pg_backend_pid()"
          pg_restore --clean --if-exists --no-owner --no-privileges --single-transaction --exit-on-error \
            --dbname="$DATABASE_URL" "$FILE"
          echo "restored $FILE"
{{- end }}
{{- end }}
