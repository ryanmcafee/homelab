{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Require the path as well as the toggle.
*/}}
{{- if and .Values.tailscale.enabled .Values.tailscale.onePasswordItemPath }}
---
# OnePasswordItem -> operator-oauth Secret (data keys: client_id, client_secret)
# Name MUST be exactly "operator-oauth" — the Tailscale operator chart reads this
# Secret when oauth.clientId is left empty in its values (no creds in git).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: operator-oauth
  namespace: {{ .Values.tailscale.namespace }}
spec:
  itemPath: {{ .Values.tailscale.onePasswordItemPath | quote }}
{{- end }}
