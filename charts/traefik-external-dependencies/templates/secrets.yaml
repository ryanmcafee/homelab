# An OnePasswordItem with an empty itemPath renders but is inert: the operator
# has nothing to fetch, so no Secret ever appears while the manifest still looks
# like a working producer. Require the path as well as the toggle.
{{- if and .Values.cloudflare.enabled .Values.cloudflare.onePasswordItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.cloudflare.onePasswordItemPath | quote }}
{{- end }}
{{- if and .Values.oidc.enabled .Values.oidc.googleOAuthPath .Values.oidc.sessionKeyPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: google-oauth-credentials
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.oidc.googleOAuthPath | quote }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-session-key
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.oidc.sessionKeyPath | quote }}
{{- end }}
