{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Each item therefore requires its own path as well as
the feature toggle — the two OIDC items are independent, so one missing path
must not suppress the other.
*/}}
{{- if and .Values.cloudflare.enabled .Values.cloudflare.onePasswordItemPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.cloudflare.onePasswordItemPath | quote }}
{{- end }}
{{- if and .Values.oidc.enabled .Values.oidc.googleOAuthPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: google-oauth-credentials
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.oidc.googleOAuthPath | quote }}
{{- end }}
{{- if and .Values.oidc.enabled .Values.oidc.sessionKeyPath }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-session-key
  namespace: {{ .Values.namespace }}
spec:
  itemPath: {{ .Values.oidc.sessionKeyPath | quote }}
{{- end }}
