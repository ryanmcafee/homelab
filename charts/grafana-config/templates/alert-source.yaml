{{- with .Values.alertSource }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .middlewareName }}
  namespace: {{ $.Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .ingressClassName }}
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/graph\?(?:[^#]*&)?g0\.expr=([^&#]*).*$
    replacement: https://${1}/d/{{ .dashboardUid }}/alert-query?orgId=1&var-expr=${2}
    permanent: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-query-dashboard
  namespace: {{ $.Values.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  alert-query.json: |-
    {{- $.Files.Get "dashboards/alert-query.json" | replace "__DASHBOARD_UID__" .dashboardUid | nindent 4 }}
{{- end }}
