{{- with .Values.alertSource }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ .policyName }}
  namespace: {{ $.Values.namespace }}
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        {{- toYaml .routeLabels | nindent 8 }}
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          local path = request_handle:headers():get(":path") or ""
          if string.sub(path, 1, 7) ~= "/graph?" then
            return
          end
          local expr = string.match(path, "[?&]g0%.expr=([^&#]*)")
          if expr == nil then
            return
          end
          request_handle:respond({
            [":status"] = "302",
            ["location"] = "/d/{{ .dashboardUid }}/alert-query?orgId=1&var-expr=" .. expr,
          }, "")
        end
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-query-dashboard
  namespace: {{ $.Values.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  alert-query.json: |-
    {{- $.Files.Get "dashboards/alert-query.json" | replace "__DASHBOARD_UID__" .dashboardUid | nindent 4 }}
{{- end }}
