namespace: monitoring
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""

# Alert "Source" links (Prometheus generatorURL, /graph?g0.expr=...) on the
# Grafana host redirect to the Alert query dashboard. An EnvoyExtensionPolicy
# runs the redirect on the HTTPRoute that routeLabels select.
alertSource:
  policyName: grafana-alert-source
  dashboardUid: alert-query
  routeLabels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
