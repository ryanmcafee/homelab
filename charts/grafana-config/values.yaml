namespace: monitoring
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""

# Alert "Source" links (Prometheus generatorURL, /graph?g0.expr=...) on the
# Grafana host redirect to the Alert query dashboard. The parent Application
# sets ingressClassName so the CRD provider of that Traefik loads the Middleware.
alertSource:
  ingressClassName: ""
  middlewareName: grafana-alert-source
  dashboardUid: alert-query
