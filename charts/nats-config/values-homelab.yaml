# nats-config — homelab overrides
#
# The parent Application supplies natsUrl, replicas and fileStoreSize through
# helm.valuesObject so a fork does not edit a committed file.
#
# The file still has to exist. The parent Application always appends
# values-homelab.yaml to spec.source.helm.valueFiles, and ArgoCD fails the sync
# when a declared value file is missing.

# Byte ceiling per stream, from the contract's `max_bytes_defaults.homelab`.
# Restated on the surface rather than inherited so each surface names its own
# budget and the drift gate reads a number per surface instead of one default.
# Totals 6 GiB against the 20 GiB file store this surface provisions (ADR-042).
maxBytes:
  PF_EVENTS: 2147483648 # 2 GiB, 33.3% of the budget
  PF_AUDIT: 3221225472 # 3 GiB, 50%
  PF_WORK: 268435456 # 256 MiB, 4.2%
  PF_DLQ: 805306368 # 768 MiB, 12.5%
