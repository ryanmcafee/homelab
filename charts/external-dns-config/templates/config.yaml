{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Enabled without a path fails the render instead.
*/}}
{{- if .Values.cloudflare.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ .Values.cloudflare.namespace }}
spec:
  itemPath: {{ required "external-dns-config: cloudflare.onePasswordItemPath is required when cloudflare.enabled is true. Set EXTERNAL_DNS_1P_PATH in configuration/environments/<env>.yaml, or set cloudflare.enabled to false." (trim (default "" .Values.cloudflare.onePasswordItemPath)) | quote }}
{{- end }}
{{- if .Values.unifi.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: unifi-api-credentials
  namespace: {{ .Values.unifi.namespace }}
spec:
  itemPath: {{ required "external-dns-config: unifi.onePasswordItemPath is required when unifi.enabled is true. Set EXTERNAL_DNS_UNIFI_1P_PATH in configuration/environments/<env>.yaml, or set unifi.enabled to false." (trim (default "" .Values.unifi.onePasswordItemPath)) | quote }}
{{- end }}
