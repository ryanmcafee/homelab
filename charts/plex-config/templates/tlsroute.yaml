{{- if .Values.remoteAccess.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: plex-direct
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: plex
spec:
  parentRefs:
    {{- range .Values.remoteAccess.gatewayNames }}
    - name: {{ . }}
      namespace: {{ $.Values.remoteAccess.gatewayNamespace }}
      sectionName: {{ $.Values.remoteAccess.sectionName }}
    {{- end }}
  hostnames:
    - {{ .Values.remoteAccess.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.remoteAccess.service }}
          port: {{ .Values.remoteAccess.port }}
{{- end }}
