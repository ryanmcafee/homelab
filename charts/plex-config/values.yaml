# plex-config values

namespace: media

# Secret name for the Plex claim token
secretName: plex

# 1Password vault path for Plex credentials
# The secret should have a field named "plex-claim-token"
onePasswordItemPath: ""

# Persistent storage for Plex config (iSCSI block storage for SQLite)
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""
