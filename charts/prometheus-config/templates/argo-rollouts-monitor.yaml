{{/*
The argo-rollouts controller scrape. It lives here, at wave 8, rather than in
the argo-rollouts Application at wave 2, because monitoring.coreos.com only
arrives with prometheus-operator-crds: a wave-2 ServiceMonitor fails the first
sync of a fresh cluster (docs/runbooks/rollouts.md).
*/}}
{{- if .Values.argoRollouts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-rollouts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name | trimSuffix "-config" }}
    app.kubernetes.io/component: argo-rollouts
spec:
  # Both labels and one namespace, so the selector cannot reach a canary Service
  # that happens to carry app.kubernetes.io/name.
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
      app.kubernetes.io/component: rollouts-controller
  namespaceSelector:
    matchNames:
      - {{ .Values.argoRollouts.namespace }}
  # job=argo-rollouts, independent of the Service name a chart bump may change.
  jobLabel: app.kubernetes.io/name
  endpoints:
    # By name: controller.metrics.service.port sets the number, never the name.
    - port: metrics
      path: /metrics
      interval: {{ .Values.argoRollouts.scrapeInterval }}
      # rollout_info carries the watched Rollout's own namespace. Without this
      # the operator overwrites it with argo-rollouts and every series collapses
      # onto the controller's namespace.
      honorLabels: true
{{- end }}
