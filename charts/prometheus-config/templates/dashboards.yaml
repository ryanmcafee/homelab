{{- /* Picked up by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard, any namespace). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-dashboards
  namespace: {{ .Values.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
