namespace: monitoring
volumes:
  - pvcName: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
    pvName: prometheus-db-pv
    volumeHandle: prometheus-db
    storageClassName: democratic-csi-iscsi-hdd
    size: 100Gi
    csi:
      driver: org.democratic-csi.iscsi-hdd
      fsType: ext4
      volumeAttributes:
        node_attach_driver: iscsi
        portal: "172.16.100.150:3260"
        portals: ""
        iqn: "iqn.2005-10.org.freenas.ctl:csi-prometheus-db-homelab"
        lun: "0"
        interface: ""
  - pvcName: alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0
    pvName: alertmanager-db-pv
    volumeHandle: alertmanager-db
    storageClassName: democratic-csi-iscsi-hdd
    size: 10Gi
    csi:
      driver: org.democratic-csi.iscsi-hdd
      fsType: ext4
      volumeAttributes:
        node_attach_driver: iscsi
        portal: "172.16.100.150:3260"
        portals: ""
        iqn: "iqn.2005-10.org.freenas.ctl:csi-alertmanager-db-homelab"
        lun: "0"
        interface: ""
