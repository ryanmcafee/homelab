namespace: monitoring
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""

# Alertmanager notification credentials (templates/alertmanager-notifications.yaml).
# Both values come from the parent Application's helm.valuesObject
# (kube-prometheus-stack.alertmanager.notifications, ALERTMANAGER_1P_PATH via
# the CMP); an empty path renders no OnePasswordItem.
alertmanager:
  notifications:
    secretName: alertmanager-notifications
    onePasswordItemPath: ""
