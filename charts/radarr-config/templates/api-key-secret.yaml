{{- with .Values.importSweep }}
{{- if and (or .enabled $.Values.releasePolicy.enabled) .apiKeySecret.name .apiKeySecret.onePasswordItemPath }}
# The import sweep's and release policy's API key (field api-key, equal to <ApiKey> in the app's config.xml).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .apiKeySecret.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .app }}
    app.kubernetes.io/component: import-sweep
spec:
  itemPath: {{ .apiKeySecret.onePasswordItemPath | quote }}
{{- end }}
{{- end }}
