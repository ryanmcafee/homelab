{{- with .Values.importSweep }}
{{- if .enabled }}
{{- $name := printf "%s-import-sweep" .app }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .app }}
    app.kubernetes.io/component: import-sweep
data:
  import-sweep.sh: |
    {{- $.Files.Get "files/import-sweep.sh" | nindent 4 }}
---
# Imports every release left in the completed downloads folder (files/import-sweep.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .app }}
    app.kubernetes.io/component: import-sweep
spec:
  schedule: {{ .schedule | quote }}
  {{- with .timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: {{ .app }}
            app.kubernetes.io/component: import-sweep
          annotations:
            checksum/script: {{ $.Files.Get "files/import-sweep.sh" | sha256sum }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .securityContext.runAsUser }}
            runAsGroup: {{ .securityContext.runAsGroup }}
            fsGroup: {{ .securityContext.runAsGroup }}
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # The app's config claim is ReadWriteOnce: share the node the app runs on.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- toYaml .appPodLabels | nindent 22 }}
          containers:
            - name: sweep
              image: "{{ .image.repository }}:{{ .image.tag }}"
              imagePullPolicy: {{ .image.pullPolicy }}
              command: ["/bin/sh", "/scripts/import-sweep.sh"]
              env:
                - name: ARR_URL
                  value: {{ .url | quote }}
                - name: COMMAND_NAME
                  value: {{ .command | quote }}
                - name: IMPORT_PATH
                  value: {{ .path | quote }}
                - name: CONFIG_XML
                  value: /app-config/config.xml
                - name: TIMEOUT_SECONDS
                  value: {{ .timeoutSeconds | toString | quote }}
                - name: POLL_SECONDS
                  value: {{ .pollSeconds | toString | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: app-config
                  mountPath: /app-config
                  readOnly: true
                - name: downloads
                  mountPath: {{ .downloads.mountPath | default "/downloads" }}
                  readOnly: true
              resources:
                {{- toYaml .resources | nindent 16 }}
          volumes:
            - name: script
              configMap:
                name: {{ $name }}
            - name: app-config
              persistentVolumeClaim:
                claimName: {{ .configClaim | quote }}
                readOnly: true
            - name: downloads
              {{- if eq (.downloads.type | default "emptyDir") "nfs" }}
              nfs:
                server: {{ required "importSweep.downloads.server is required for type nfs" .downloads.server | quote }}
                path: {{ required "importSweep.downloads.path is required for type nfs" .downloads.path | quote }}
                readOnly: true
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}
{{- end }}
