namespace: media
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""

# Daily scan for movie files that cannot play (files/corruption-scan.sh,
# templates/corruption-scan-cronjob.yaml). A corrupt file is blocklisted,
# deleted through the Radarr API and replaced by Radarr's automatic search.
corruptionScan:
  enabled: true
  # 04:17 every day, in the cluster's time zone (UTC unless timeZone is set).
  schedule: "17 4 * * *"
  timeZone: ""
  # Report only: log the corrupt files and what would be done, change nothing.
  dryRun: false
  # Decode keyframes at sample points as well as the ffprobe header check.
  deepCheck: true
  # Percent of the duration to sample, and seconds decoded at each point.
  samplePoints: "5 50 95"
  sampleSeconds: 10
  # Per-file ffprobe/ffmpeg timeout; a timeout is inconclusive, never a deletion.
  probeTimeoutSeconds: 120
  # Skip files modified within this many minutes (still importing or upgrading).
  minAgeMinutes: 360
  # More corrupt files than this in one run aborts the run without deleting
  # anything: that many at once points at the NAS or the mount, not the files.
  maxDeletions: 5
  # Mark the grabbed release failed so the search does not grab it again.
  blocklistRelease: true
  # Seconds a finished Job is kept (cronjob-ttl policy, tests/policy/workload.rego).
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 21600
  radarrUrl: http://radarr.media.svc.cluster.local:7878
  # API key source. With apiKeySecret.name empty the Job mounts Radarr's config
  # PVC read-only and reads <ApiKey> from config.xml; the claim is ReadWriteOnce,
  # so the pod is scheduled onto the node running Radarr (podAffinity on radarrPodLabels).
  apiKeySecret:
    name: ""
    key: api-key
  configClaim: radarr-config
  radarrPodLabels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: radarr
  # The movies library, mounted read-only at the path Radarr reports
  # (mountPath must match the Radarr container's). The parent Application
  # passes Radarr's own movies persistence; type nfs or emptyDir.
  movies:
    type: emptyDir
    server: ""
    path: ""
    mountPath: /movies
  securityContext:
    runAsUser: 568
    runAsGroup: 100
  image:
    # Docker Hub, not ghcr.io: ghcr.io rate-limits Renovate tag lookups for linuxserver images.
    repository: linuxserver/ffmpeg
    tag: "9.0-cli-ls84"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi

# Every 30 minutes, import what Radarr left in the completed downloads folder
# (files/arr-import-sweep.ts, docs/runbooks/arr-import-sweep.md): a scan per
# entry, then a scored library match (TMDb, grab history, episodes) and a
# ManualImport for what the scan could not identify. The parent Application
# enables it where the downloads export exists (MEDIA_PROVIDER nfs) and passes
# the config claim, UID/GID and the bun image tag.
importSweep:
  enabled: false
  app: radarr
  schedule: "*/30 * * * *"
  timeZone: ""
  url: http://radarr.media.svc.cluster.local:7878
  path: /downloads/completed/movies
  # Report every decision and change nothing.
  dryRun: false
  minScore: 60
  minMargin: 20
  # Blocklist and delete matched releases whose known languages exclude English
  # (never on Unknown); mounts the downloads volume below read-write.
  removeNonEnglish: false
  # Radarr's downloads volume, mounted at the same path; type nfs or emptyDir.
  downloads:
    type: emptyDir
    server: ""
    path: ""
    mountPath: /downloads
  timeoutSeconds: 3000
  pollSeconds: 2
  activeDeadlineSeconds: 3300
  # Short, so a transient failure's KubeJobFailed clears before the next runs.
  ttlSecondsAfterFinished: 3600
  # API key source. With apiKeySecret.name set, ARR_API_KEY comes from that
  # Secret (field key, which must equal <ApiKey> in Radarr's config.xml) and the
  # pod runs on any node; onePasswordItemPath renders it as a OnePasswordItem.
  apiKeySecret:
    name: ""
    key: api-key
    onePasswordItemPath: ""
  # Only without apiKeySecret.name: Radarr's config claim, mounted read-only for
  # <ApiKey> in config.xml; it is ReadWriteOnce, so the pod is scheduled onto
  # the node running Radarr (podAffinity on appPodLabels).
  configClaim: radarr-config
  appPodLabels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: radarr
  # TMDb key Kometa already uses (charts/plex-config, 1Password item plex);
  # optional: without it, matching runs without the TMDb signal.
  tmdbSecret:
    name: plex
    key: tmdb-api-key
  securityContext:
    runAsUser: 568
    runAsGroup: 100
  image:
    repository: oven/bun
    # Overridden by the parent Application from configuration/versions.yaml images.bun.
    tag: "1.4.5-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Hourly, ban remux releases in the app (files/arr-release-policy.ts,
# docs/runbooks/arr-release-policy.md): a custom format matching the release
# title, scored below every quality profile's minimum, and the matching
# qualities disallowed in every profile. Reuses importSweep's app, url, API key
# source, config claim, user and image.
releasePolicy:
  enabled: true
  schedule: "41 * * * *"
  # Report the changes and write nothing.
  dryRun: false
  banned:
    formatName: Remux
    titleRegex: remux
    qualityRegex: remux
    score: -10000
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
