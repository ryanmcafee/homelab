namespace: media
volumes: []

# iSCSI target portal shared by every entry in volumes. The parent Application
# passes ISCSI_TARGET_PORTAL from configuration/ via helm.valuesObject;
# never commit a real portal here.
iscsi:
  portal: ""

# Every 30 minutes, import each release left in the completed downloads folder
# (files/import-sweep.sh, templates/import-sweep-cronjob.yaml). The parent
# Application enables it where the downloads export exists (MEDIA_PROVIDER nfs)
# and passes the downloads volume, config claim, UID/GID and curl tag.
importSweep:
  enabled: false
  app: sonarr
  schedule: "*/30 * * * *"
  timeZone: ""
  url: http://sonarr.media.svc.cluster.local:8989
  command: DownloadedEpisodesScan
  path: /downloads/completed/tv
  timeoutSeconds: 3000
  pollSeconds: 2
  activeDeadlineSeconds: 3300
  # Short, so a transient failure's KubeJobFailed clears before the next runs.
  ttlSecondsAfterFinished: 3600
  # Sonarr's config claim, mounted read-only for <ApiKey> in config.xml; it is
  # ReadWriteOnce, so the pod is scheduled onto the node running Sonarr.
  configClaim: sonarr-config
  appPodLabels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/instance: sonarr
  # Sonarr's downloads volume, mounted read-only at the same path; type nfs or emptyDir.
  downloads:
    type: emptyDir
    server: ""
    path: ""
    mountPath: /downloads
  securityContext:
    runAsUser: 568
    runAsGroup: 100
  image:
    repository: curlimages/curl
    tag: "8.22.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
