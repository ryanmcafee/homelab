# Addons Chart - Default Production Values
# Core cluster infrastructure and addon components
#
# This chart deploys essential cluster services in a specific order:
# 0. 1Password Operator (CRDs must exist before OnePasswordItem resources)
# 1. Cilium LB IPAM (LoadBalancer IPs via Cilium)
# 2. Democratic-CSI (Storage - uses OnePasswordItem for TrueNAS API key)
# 3. Cert-Manager (TLS Certificates)
# 4. External-DNS (DNS Management)
# 5. Kube-Prometheus-Stack (Monitoring)
# 6. Traefik (Ingress Controller)
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Git repository for SOPS secrets
  repoUrl: https://github.com/ryanmcafee/homelab.git
  targetRevision: main

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Enable external DNS management
  externalDNS: true

  # Enable external load balancing
  loadBalancer: true

# ============================================================================
# ArgoCD - Self-Management (Bootstrap + Addon)
# Sync Wave: 0 (first addon, manages itself after bootstrap)
# ============================================================================

argocd:
  # Disabled by default - enable in environment-specific values
  # This allows ArgoCD to manage itself after initial bootstrap
  enabled: false
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    # Enable App of Apps health status progression
    configs:
      cm:
        # Enable ksops plugin for SOPS decryption
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs

    server:
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # SOPS/ksops configuration for decrypting secrets
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      # Mount age key and custom tools
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age-key
      volumeMounts:
        - name: custom-tools
          mountPath: /usr/local/bin/ksops
          subPath: ksops
        - name: custom-tools
          mountPath: /usr/local/bin/kustomize
          subPath: kustomize
        - name: sops-age
          mountPath: /.config/sops/age
      # Init container to install ksops
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args:
            - echo "Installing KSOPS...";
              cp /usr/local/bin/ksops /custom-tools/ksops;
              cp /usr/local/bin/kustomize /custom-tools/kustomize;
              echo "Done.";
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ============================================================================
# Kubelet CSR Approver - Automatic Kubelet Certificate Approval
# Sync Wave: 1 (early infrastructure component)
# ============================================================================

kubelet-csr-approver:
  enabled: true
  namespace: kube-system

  # Chart source
  chart:
    name: kubelet-csr-approver
    repo: https://postfinance.github.io/kubelet-csr-approver
    version: "1.2.2"

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2 (OnePasswordItem at wave 1, needs 1Password CRDs from wave 0)
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  # Chart source
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS configuration
  driver: freenas-nfs

  # Connection details (from GitOps Bridge metadata)
  truenas:
    endpoint: https://truenas.ryanmcafee.com
    allowInsecure: false
    apiKey: ""  # Must be set manually or via 1Password
    # 1Password vault path for TrueNAS API key (creates secret: truenas-api-key)
    onePasswordItemPath: ""

  # NFS dataset configuration
  nfs:
    shareHost: truenas.ryanmcafee.com
    shareAllow: 172.16.100.0/24
    parent: storage/k8s

  # Storage class configuration
  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  # Resource limits
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Local Storage (localdev only)
# Sync Wave: 1 (alternative to democratic-csi for local dev)
# ============================================================================

local-path-provisioner:
  enabled: false  # Only enabled in localdev
  namespace: local-path-storage

  # Chart source
  chart:
    name: local-path-provisioner
    repo: https://charts.containeroo.ch
    version: 0.0.30

  # Storage class configuration
  storageClass:
    name: local-path
    defaultClass: true

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# SOPS Secrets - Encrypted secrets for GitOps
# Sync Wave: -2 (FIRST - deploys 1Password credentials before operator)
# ============================================================================

sops-secrets:
  enabled: true

# ============================================================================
# 1Password Operator - Secret Management
# Sync Wave: -1 (after SOPS secrets, before other OnePasswordItem resources)
# ============================================================================

1password-operator:
  enabled: true
  namespace: onepassword-operator

  # Chart source
  chart:
    name: connect
    repo: https://1password.github.io/connect-helm-charts
    version: 1.15.1

  # 1Password Connect configuration
  connect:
    # Connect server credentials (from manual setup)
    credentialsJson: ""  # Provided via Kubernetes secret
    host: op-connect.ryanmcafee.com

  # Resource limits
  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    connect:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3 (needed before ingress resources)
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  # Chart source
  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  # Install CRDs
  installCRDs: true

  # Let's Encrypt configuration
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory  # Production

  # Cloudflare DNS-01 challenge
  # API token must have: Zone:Read, DNS:Edit permissions
  cloudflare:
    enabled: true
    email: ""  # Cloudflare account email
    apiToken: ""  # Provided via 1Password operator

  # DNS zones for certificate issuance
  dnsZones: []

  # Custom DNS resolvers for ACME DNS-01 challenge verification
  # Uses public DNS instead of cluster DNS to avoid propagation issues
  dns01RecursiveNameservers:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "8.8.4.4:53"

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4 (needed before public ingress)
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  # Chart source
  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  # Provider configuration
  provider: cloudflare

  # Cloudflare configuration
  cloudflare:
    apiToken: ""  # Provided via 1Password operator
    proxied: true  # Enable Cloudflare proxy

  # Domain filter
  domainFilters:
    - ryanmcafee.com

  # Only manage specific annotation
  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  # Default target for all DNS records (optional)
  # Use this to point all records to a DDNS hostname for dynamic IP
  # Example: mylab.duckdns.org
  defaultTarget: ""

  # Resource limits
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5 (monitoring can come up after core services)
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  # Chart source
  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.8.2

  # Prometheus configuration
  prometheus:
    # Retention and storage
    retention: 30d
    retentionSize: 50GB

    # Storage configuration
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service Monitor configuration
    serviceMonitors:
      enabled: true

  # Grafana configuration
  grafana:
    enabled: true

    # Admin credentials (from 1Password)
    adminPassword: ""  # Provided via 1Password operator

    # Persistence
    persistence:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi

    # Ingress
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Alertmanager configuration
  alertmanager:
    enabled: true

    # Storage configuration
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Resource limits
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Node exporter
  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Kube-state-metrics
  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Traefik - Ingress Controller
# Sync Wave: 6 (last addon, requires Cilium LB IPAM and cert-manager)
# ============================================================================

traefik:
  enabled: true
  namespace: traefik

  # Cloudflare integration for ACME DNS challenge (disabled by default)
  # Use cert-manager instead for HA compatibility
  cloudflare:
    enabled: false
    onePasswordItemPath: ""

  # Chart source
  chart:
    name: traefik
    repo: https://traefik.github.io/charts
    version: 39.0.0

  # Service configuration
  service:
    type: LoadBalancer
    # Cilium LB IPAM will assign an IP from the pool

  # Ports configuration
  ports:
    web:
      port: 8000
      exposedPort: 80
      expose:
        default: true
      # Redirect HTTP to HTTPS (v39+ format)
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 8443
      exposedPort: 443
      expose:
        default: true
      asDefault: true
      http:
        tls:
          enabled: true

  # Global arguments moved to additionalArguments in v39+
  additionalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false

  # Environment variables
  env: []

  # Persistence disabled (ACME removed - using cert-manager)
  persistence:
    enabled: false

  # Dashboard
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
      entryPoints: ["websecure"]

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Deployment configuration
  deployment:
    replicas: 2  # High availability

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

# ============================================================================
# UniFi Port Forward Controller - Automatic Port Forwarding
# Sync Wave: 7 (after other services are deployed)
# ============================================================================

unifi-port-forward:
  # Disabled by default - enable in environment-specific values
  enabled: false
  namespace: unifi-port-forward

  # Chart version
  version: "0.1.0"

  # Port forwarding rule prefix
  rulePrefix: "kube-"

  # 1Password vault path for UniFi credentials
  onePasswordItemPath: ""

# ============================================================================
# OAuth2 Proxy - SSO Authentication
# Disabled by default - enable in environment-specific values
# ============================================================================

oauth2-proxy:
  enabled: false
  namespace: oauth2-proxy

# ============================================================================
# NVIDIA GPU Operator - GPU Support for Kubernetes
# Disabled by default - enable in environment-specific values
# ============================================================================

nvidia-gpu-operator:
  enabled: false
  namespace: nvidia-gpu-operator

# ============================================================================
# External DNS UniFi - DNS Management via UniFi Controller
# Disabled by default - enable in environment-specific values
# ============================================================================

external-dns-unifi:
  enabled: false
  namespace: external-dns

# ============================================================================
# CloudNative-PG - PostgreSQL Operator
# Disabled by default - enable in environment-specific values
# ============================================================================

cloudnative-pg:
  enabled: false
  namespace: cloudnative-pg

  chart:
    name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.23.0

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  monitoring:
    podMonitorEnabled: false
    grafanaDashboard:
      create: false

# ============================================================================
# Cilium LB IPAM - LoadBalancer IP Address Management
# Disabled by default - enable in environment-specific values
# ============================================================================

cilium-lb-ipam:
  enabled: false

# ============================================================================
# Cilium CNI - Container Network Interface
# Disabled by default - Cilium is deployed at cluster bootstrap
# ============================================================================

cilium:
  enabled: false

# ============================================================================
# Argo Workflows - Workflow Orchestration
# Sync Wave: 7 (after core infrastructure)
# ============================================================================

argo-workflows:
  enabled: false
  namespace: argo-workflows

  # Chart source
  chart:
    name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: "0.45.2"

  # Server configuration
  server:
    # Authentication mode: server (no auth), client (requires token), sso
    authMode: server

    # Ingress
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - workflows.ryanmcafee.com
      tls:
        - secretName: argo-workflows-tls
          hosts:
            - workflows.ryanmcafee.com

    # Resources
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Controller configuration
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Workflow defaults
    workflowDefaults:
      spec:
        ttlStrategy:
          secondsAfterCompletion: 86400  # 24 hours
          secondsAfterSuccess: 43200     # 12 hours
          secondsAfterFailure: 172800    # 48 hours

  # Ingress verification workflow
  ingressVerification:
    enabled: true
    # Schedule: every 5 minutes
    schedule: "*/5 * * * *"
    # Ingresses to verify (auto-populated from cluster if empty)
    ingresses: []
