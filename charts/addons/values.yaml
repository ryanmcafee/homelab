# Addons Chart - Default Production Values
# Core cluster infrastructure and addon components
#
# This chart deploys essential cluster services in a specific order:
# 1. Cilium LB IPAM (LoadBalancer IPs via Cilium)
# 2. Democratic-CSI (Storage - uses OnePasswordItem for TrueNAS API key)
# 3. Cert-Manager (TLS Certificates)
# 4. External-DNS (DNS Management)
# 5. Kube-Prometheus-Stack (Monitoring)
# 6. Envoy Gateway (internal and external Gateways)
#
# Note: SOPS secrets and 1Password Operator are deployed via the bootstrap chart
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for route hostnames
  domain: example.com

  # Gateways every HTTPRoute attaches to (addons.gatewayParentRefs).
  gateway:
    namespace: envoy-gateway-system
    internal: envoy-internal
    external: envoy-external

  # Git repository for SOPS secrets
  repoUrl: https://github.com/ryanmcafee/homelab.git
  targetRevision: main

  # Whether every Application syncs automatically (prune + selfHeal). The
  # generated localdev values set false so `argocd app sync --local` pushes
  # the working tree without ArgoCD reverting it to Git (ARGOCD_AUTOMATED_SYNC).
  automatedSync: true

  # Images shared by the chart's own templates (PostSync smoke Jobs).
  # Placeholder; configuration/versions.yaml images.curl wins at render time.
  images:
    curl: "8.22.0"

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # iSCSI target portal handed to the *-config child charts (grafana-config,
  # prometheus-config) through the parent Application's helm.valuesObject.
  # Set from ISCSI_TARGET_PORTAL by the CMP in homelab; never commit a real one.
  iscsi:
    portal: ""

# ============================================================================
# Spegel - P2P Container Image Distribution
# Sync Wave: 0 (early infrastructure, helps with slow registry pulls)
# ============================================================================

spegel:
  enabled: true
  namespace: spegel

  # Chart source (OCI registry)
  chart:
    name: spegel
    repo: ghcr.io/spegel-org/helm-charts
    version: "0.6.0"

  # Service configuration
  service:
    registry:
      hostPort: 30020
      nodePort: 30021

  # Spegel configuration
  spegel:
    logLevel: "INFO"
    # Registries to mirror via P2P
    registries:
      - https://cgr.dev
      - https://docker.io
      - https://ghcr.io
      - https://quay.io
      - https://mcr.microsoft.com
      - https://public.ecr.aws
      - https://gcr.io
      - https://registry.k8s.io
      - https://k8s.gcr.io
      - https://lscr.io
    # Talos Linux containerd paths
    containerdRegistryConfigPath: /etc/cri/conf.d/hosts
    containerdContentPath: /var/lib/containerd/io.containerd.content.v1.content
    resolveTags: true
    resolveLatestTag: true
    appendMirrors: false

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: 60s
    scrapeTimeout: 30s

  # Grafana Dashboard
  grafanaDashboard:
    enabled: false

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 48Mi

# ============================================================================
# Kubelet CSR Approver - Automatic Kubelet Certificate Approval
# Sync Wave: 1 (early infrastructure component)
# ============================================================================

kubelet-csr-approver:
  enabled: true
  namespace: kube-system

  # Chart source
  chart:
    name: kubelet-csr-approver
    repo: https://postfinance.github.io/kubelet-csr-approver
    version: "1.2.2"

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# metrics-server - metrics.k8s.io for kubectl top and HorizontalPodAutoscalers
# Sync Wave: 2 (after kubelet-csr-approver approves the kubelet serving certs)
# ============================================================================

metrics-server:
  enabled: true
  namespace: kube-system

  # Chart source
  chart:
    name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: "3.14.0"

  replicas: 1

  # Skip kubelet certificate verification. Only for clusters whose kubelets
  # self-sign their serving certificate (Kind); see KUBELET_SERVING_CERT.
  kubeletInsecureTLS: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2 (OnePasswordItem at wave 1, needs 1Password CRDs from wave 0)
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  # Chart source
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS configuration
  driver: freenas-nfs

  # Connection details (from GitOps Bridge metadata)
  truenas:
    endpoint: https://truenas.example.com
    allowInsecure: false
    # 1Password vault path for TrueNAS API key (creates secret: truenas-api-key)
    onePasswordItemPath: ""

  # NFS dataset configuration
  nfs:
    shareHost: truenas.example.com
    shareAllow: 10.0.0.0/24
    parent: storage/k8s

  # Storage class configuration
  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  # Resource limits
  # The csi-driver containers idle at ~12m but work in short bursts, and a 200m
  # limit is a 20 ms quota per 100 ms period: too small for a burst, so 87 % of
  # the periods they ran in were throttled and CPUThrottlingHigh fired forever
  # (16 alerts, one per pod). The limit only caps a burst, so raising it costs
  # nothing; requests stay at 50m, so scheduling and node capacity are unchanged.
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi

# ============================================================================
# Democratic-CSI SSD - NFS Storage Provisioner (SSD-backed)
# Sync Wave: 2 (same as HDD instance, reuses truenas-api-key secret)
# ============================================================================

democratic-csi-ssd:
  enabled: false
  namespace: democratic-csi

  # Chart source (same chart as HDD instance)
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS configuration
  driver: freenas-nfs

  # Connection details
  truenas:
    endpoint: https://truenas.example.com
    allowInsecure: false

  # NFS dataset configuration (SSD pool)
  nfs:
    shareHost: truenas.example.com
    shareAllow: 10.0.0.0/24
    parent: ssd/k8s

  # Storage class configuration (NOT default)
  storageClasses:
    - name: democratic-csi-ssd
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  # Resource limits
  # The csi-driver containers idle at ~12m but work in short bursts, and a 200m
  # limit is a 20 ms quota per 100 ms period: too small for a burst, so 87 % of
  # the periods they ran in were throttled and CPUThrottlingHigh fired forever
  # (16 alerts, one per pod). The limit only caps a burst, so raising it costs
  # nothing; requests stay at 50m, so scheduling and node capacity are unchanged.
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi

# ============================================================================
# Democratic-CSI iSCSI - Block Storage Provisioner (SSD-backed)
# Sync Wave: 2 (same as NFS instances, reuses truenas-api-key secret)
# ============================================================================

democratic-csi-iscsi:
  enabled: false  # Only enabled in homelab
  namespace: democratic-csi

  # Chart source (same chart as NFS instances)
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS iSCSI driver
  driver: freenas-api-iscsi

  # Connection details
  truenas:
    endpoint: https://truenas.example.com
    allowInsecure: false

  # iSCSI configuration
  iscsi:
    targetPortal: "truenas.example.com:3260"
    datasetParent: ssd/iscsi
    snapshotsParent: ssd/iscsi-snapshots
    portalGroupId: 1
    initiatorGroupId: 1

  # Storage class configuration (NOT default)
  storageClasses:
    - name: democratic-csi-iscsi
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4

  # Resource limits
  # The csi-driver containers idle at ~12m but work in short bursts, and a 200m
  # limit is a 20 ms quota per 100 ms period: too small for a burst, so 87 % of
  # the periods they ran in were throttled and CPUThrottlingHigh fired forever
  # (16 alerts, one per pod). The limit only caps a burst, so raising it costs
  # nothing; requests stay at 50m, so scheduling and node capacity are unchanged.
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi

# ============================================================================
# Democratic-CSI iSCSI HDD - Block Storage Provisioner (HDD-backed)
# Sync Wave: 2 (same as other instances, reuses truenas-api-key secret)
# ============================================================================

democratic-csi-iscsi-hdd:
  enabled: false  # Only enabled in homelab
  namespace: democratic-csi

  # Chart source (same chart as other instances)
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS iSCSI driver
  driver: freenas-api-iscsi

  # Connection details
  truenas:
    endpoint: https://truenas.example.com
    allowInsecure: false

  # iSCSI configuration (HDD pool)
  iscsi:
    targetPortal: "truenas.example.com:3260"
    datasetParent: storage/k8s
    snapshotsParent: storage/k8s-iscsi-snapshots
    portalGroupId: 1
    initiatorGroupId: 1

  # Storage class configuration (NOT default)
  storageClasses:
    - name: democratic-csi-iscsi-hdd
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4

  # Resource limits
  # The csi-driver containers idle at ~12m but work in short bursts, and a 200m
  # limit is a 20 ms quota per 100 ms period: too small for a burst, so 87 % of
  # the periods they ran in were throttled and CPUThrottlingHigh fired forever
  # (16 alerts, one per pod). The limit only caps a burst, so raising it costs
  # nothing; requests stay at 50m, so scheduling and node capacity are unchanged.
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Local Storage (localdev only)
# Sync Wave: 1 (alternative to democratic-csi for local dev)
# ============================================================================

local-path-provisioner:
  enabled: false  # Only enabled in localdev
  namespace: local-path-storage

  # Chart source
  chart:
    name: local-path-provisioner
    repo: https://charts.containeroo.ch
    version: 0.0.30

  # Storage class configuration
  storageClass:
    name: local-path
    defaultClass: true

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3 (needed before the Gateway certificate)
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  # Chart source
  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  # Install CRDs
  installCRDs: true

  # When true the letsencrypt ClusterIssuer (cert-manager-cluster-issuer child
  # chart) is a self-signed issuer under the same name, for clusters without a
  # public domain (CERT_ISSUER=selfsigned in configuration/).
  selfSigned: false

  # Let's Encrypt configuration
  letsencrypt:
    enabled: true
    email: admin@example.com
    server: https://acme-v02.api.letsencrypt.org/directory  # Production

  # Cloudflare DNS-01 challenge
  # API token must have: Zone:Read, DNS:Edit permissions
  cloudflare:
    enabled: true
    email: ""  # Cloudflare account email

  # DNS zones for certificate issuance
  dnsZones: []

  # Custom DNS resolvers for ACME DNS-01 challenge verification
  # Uses public DNS instead of cluster DNS to avoid propagation issues
  dns01RecursiveNameservers:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "8.8.4.4:53"

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4 (needed before public routes)
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  # Chart source
  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  # Provider configuration
  provider: cloudflare

  # Cloudflare configuration
  cloudflare:
    proxied: true  # Enable Cloudflare proxy

  # Domain filter
  domainFilters:
    - example.com

  # Only manage specific annotation
  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  # Default target for all DNS records (optional)
  # Use this to point all records to a DDNS hostname for dynamic IP
  # Example: mylab.duckdns.org
  defaultTarget: ""

  # Resource limits
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5 (monitoring can come up after core services)
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  # Chart source
  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.8.2

  # Prometheus configuration
  prometheus:
    # Retention and storage
    retention: 30d
    retentionSize: 50GB

    # Storage configuration
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service Monitor configuration
    serviceMonitors:
      enabled: true

  # Grafana configuration
  grafana:
    enabled: true

    # Admin credentials (from 1Password)
    adminPassword: ""  # Provided via 1Password operator

    # Run as apps:users (568:100) to match NFS PVC permissions
    securityContext:
      runAsUser: 568
      runAsGroup: 100
      fsGroup: 100

    # Persistence
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: democratic-csi-nfs
      size: 10Gi

    # HTTPRoute on the internal Gateway
    route:
      enabled: true
      hostname: grafana.example.com

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Alertmanager configuration
  alertmanager:
    enabled: true

    # Notification receivers (docs/runbooks/alerting.md). The CMP sets enabled
    # and onePasswordItemPath from SECRETS_PROVIDER / ALERTMANAGER_1P_PATH; with
    # enabled false every route ends in the null receiver and no Secret is
    # mounted. secretName is the Secret the prometheus-config chart creates from
    # the 1Password item (fields pushover_token, pushover_user_key).
    notifications:
      enabled: false
      secretName: alertmanager-notifications
      onePasswordItemPath: ""

    # HTTPRoute on the internal Gateway; its host is also the external URL in notification links
    route:
      enabled: true
      hostname: alertmanager.example.com

    # Storage configuration
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Resource limits
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Node exporter
  nodeExporter:
    enabled: true
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 48Mi

  # Kube-state-metrics
  # The chart's CPUThrottlingHigh divides throttled CFS periods by the periods a
  # container ran in at all, with no floor under the denominator. A container
  # that is 99 % idle runs in ~30 of the 3000 periods in five minutes, so a
  # handful of throttled bursts reads as 30 % and the alert never clears — that
  # is how 16 alerts stood on democratic-csi for three months. The tuned copy in
  # additionalPrometheusRulesMap adds the missing floor.
  defaultRules:
    disabled:
      CPUThrottlingHigh: true

  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        memory: 160Mi
      limits:
        memory: 256Mi

  # etcd scrape: Talos exposes etcd metrics on <control-plane IP>:2381 when
  # cluster.etcd.extraArgs.listen-metrics-urls is set (terragrunt talos-cluster).
  # The addresses become a static scrape config rather than the chart's
  # Endpoints-based kubeEtcd path, which ArgoCD cannot apply (see the template).
  # An empty endpoints list disables the scrape, which is what Kind wants.
  # kube-proxy scrape and KubeProxyDown rule; off where Cilium replaces
  # kube-proxy (configuration/templates/helm-addons.tmpl).
  kubeProxy:
    enabled: true

  kubeEtcd:
    endpoints: []
    port: 2381

  # PostSync smoke hooks (charts/addons/templates/_smoke.tpl): curl the
  # in-cluster Services after sync; expect lists the accepted HTTP codes.
  # Service names follow the chart's <release>-grafana / <release>-prometheus.
  smoke:
    grafana:
      enabled: true
      url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/api/health
      expect: ["200"]
    prometheus:
      enabled: true
      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/ready
      expect: ["200"]

# ============================================================================
# Gateway API CRDs and Envoy Gateway (templates/gateway-api-crds.yaml,
# templates/envoy-gateway.yaml). Placeholder; the CMP template renders the real blocks.
# ============================================================================

gatewayApi:
  enabled: false

envoy-gateway:
  enabled: false
  namespace: envoy-gateway-system

# ============================================================================
# UniFi Port Forward Controller - Automatic Port Forwarding
# Sync Wave: 7 (after other services are deployed)
# ============================================================================

unifi-port-forward:
  # Disabled by default - enable in environment-specific values
  enabled: false
  namespace: unifi-port-forward

  # Chart source
  chart:
    name: port-forwarding
    repo: https://ryanmcafee.github.io/port-forwarding-controller
    version: "1.1.1"

  # Port forwarding rule prefix
  rulePrefix: "kube-"

  # 1Password vault path for UniFi credentials
  onePasswordItemPath: ""

# ============================================================================
# OAuth2 Proxy - SSO Authentication
# Disabled by default - enable in environment-specific values
# ============================================================================

oauth2-proxy:
  enabled: false
  namespace: oauth2-proxy

# ============================================================================
# Tailscale Operator - Tailnet subnet router (homelab advertiser)
# Sync Wave: operator at 2, config (operator-oauth OnePasswordItem) at 1
# ============================================================================

tailscale-operator:
  enabled: true
  namespace: tailscale
  hostname: tailscale-operator-homelab

  chart:
    name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.98.4

  # Connector subnet-router config for native/lint render only. In homelab this is
  # overridden by the CMP value TAILSCALE_ADVERTISE_ROUTES (helm-addons.tmpl), which
  # injects the real LAN /24 (PII). The placeholder below is a non-PII RFC 5737
  # documentation CIDR so `helm lint`/native render resolve the Connector template.
  connector:
    advertiseRoutes:
      - "192.0.2.0/24"
    tags:
      - "tag:k8s"

# ============================================================================
# Agent Read-Only Access - ServiceAccount + ClusterRoles agents use through the
# Tailscale API server proxy (no Secrets, no write verbs). Enabled in every
# environment; tests/e2e/agent-readonly proves the RBAC in Kind.
# Sync Wave: Namespace at 1, Application at 2. docs/runbooks/readonly-access.md
# ============================================================================

agentReadonly:
  enabled: true
  namespace: agent-access

# ============================================================================
# NVIDIA GPU Operator - GPU Support for Kubernetes
# Disabled by default - enable in environment-specific values
# ============================================================================

nvidia-gpu-operator:
  enabled: false
  namespace: nvidia-gpu-operator

# ============================================================================
# Intel GPU Device Plugin - GPU Support for Kubernetes (Intel)
# Disabled by default - enable in environment-specific values
# ============================================================================

intel-gpu-device-plugin:
  enabled: false
  namespace: intel-device-plugins

  chart:
    name: intel-device-plugins-gpu
    repo: https://intel.github.io/helm-charts
    version: "0.35.0"

# ============================================================================
# Intel Device Plugins Operator - installs the GpuDevicePlugin CRD and a
# reconciler that turns GpuDevicePlugin CRs (created by intel-gpu-device-plugin
# at wave 10) into live DaemonSets. Required prerequisite — without it the
# plugin chart fails with "GpuDevicePlugin CRD not installed".
# ============================================================================

intel-device-plugins-operator:
  enabled: false
  namespace: intel-device-plugins

  chart:
    name: intel-device-plugins-operator
    repo: https://intel.github.io/helm-charts
    version: "0.35.0"

# ============================================================================
# NodeFeatureDiscovery - hardware feature labeling
# Required prerequisite for intel-gpu-device-plugin. Also broadly useful for
# any chart with PCI/CPU/kernel-feature-driven nodeSelectors. Runs as a
# DaemonSet with its own cluster RBAC so it is NOT subject to NodeRestriction
# (unlike Talos' worker-side nodeLabels path, which is blocked for vendor
# labels like intel.com/gpu and feature.node.kubernetes.io/pci-*.present).
# Always enabled regardless of GPU_VENDOR.
# ============================================================================

node-feature-discovery:
  enabled: true
  namespace: node-feature-discovery

  chart:
    name: node-feature-discovery
    repo: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    version: "0.18.0"

# ============================================================================
# External DNS UniFi - DNS Management via UniFi Controller
# Disabled by default - enable in environment-specific values
# ============================================================================

external-dns-unifi:
  enabled: false
  namespace: external-dns

# ============================================================================
# CloudNative-PG - PostgreSQL Operator
# Disabled by default - enable in environment-specific values
# ============================================================================

cloudnative-pg:
  enabled: false
  namespace: cloudnative-pg

  chart:
    name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.23.0

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  monitoring:
    podMonitorEnabled: false
    grafanaDashboard:
      create: false

# ============================================================================
# CloudNativePG Barman Cloud Plugin - backup/restore through an ObjectStore
# Disabled by default - rendered only together with cloudnative-pg
# ============================================================================

cnpg-barman-cloud:
  enabled: false
  namespace: cnpg-system

  chart:
    name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: 0.8.0

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ============================================================================
# Cilium LB IPAM - LoadBalancer IP Address Management
# Disabled by default - enable in environment-specific values
# ============================================================================

cilium-lb-ipam:
  enabled: false

# ============================================================================
# Cilium CNI - Container Network Interface
# Disabled by default - Cilium is deployed at cluster bootstrap
# ============================================================================

cilium:
  enabled: false

  # Helm values of the installed release. The Application never installs
  # Cilium (Talos inline manifests in homelab, scripts/localdev-kind.ts in
  # Kind); it adopts the release, so the values must match what installed it
  # or the Application shows a diff. They live only in the environment values
  # rendered from configuration/templates/helm-addons.tmpl (homelab: Talos
  # values; localdev: Kind values). Deliberately empty here: Helm deep-merges
  # maps, so any key in this file would leak into every environment that does
  # not override it (BGP into Kind, for instance).
  values: {}

  # charts/cilium-config values (the cilium-config Application's valuesObject).
  config:
    monitoring:
      enabled: false
    hubbleUI:
      enabled: false

# ============================================================================
# Argo Workflows - Workflow Orchestration
# Sync Wave: 9 (after core infrastructure)
# ============================================================================

argo-workflows:
  enabled: false
  namespace: argo-workflows

  # Chart source
  chart:
    name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: "0.45.2"

  # Server configuration
  server:
    # Authentication mode: server (no auth), client (requires token), sso
    authMode: server

    # HTTPRoute on the internal Gateway
    route:
      enabled: true
      hostname: workflows.example.com

    # Resources
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Controller configuration
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Workflow defaults
    workflowDefaults:
      spec:
        ttlStrategy:
          secondsAfterCompletion: 86400  # 24 hours
          secondsAfterSuccess: 43200     # 12 hours
          secondsAfterFailure: 172800    # 48 hours

