# Addons Chart - Default Production Values
# Core cluster infrastructure and addon components
#
# This chart deploys essential cluster services in a specific order:
# 0. 1Password Operator (CRDs must exist before OnePasswordItem resources)
# 1. MetalLB (LoadBalancer IPs)
# 2. Democratic-CSI (Storage - uses OnePasswordItem for TrueNAS API key)
# 3. Cert-Manager (TLS Certificates)
# 4. External-DNS (DNS Management)
# 5. Kube-Prometheus-Stack (Monitoring)
# 6. Traefik (Ingress Controller)
#
# Environment-specific values should be provided via:
# - values-localdev.yaml (local Kind development)
# - values-homelab.yaml (homelab Talos cluster)

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Enable external DNS management
  externalDNS: true

  # Enable external load balancing
  loadBalancer: true

# ============================================================================
# ArgoCD - Self-Management (Bootstrap + Addon)
# Sync Wave: 0 (first addon, manages itself after bootstrap)
# ============================================================================

argocd:
  # Disabled by default - enable in environment-specific values
  # This allows ArgoCD to manage itself after initial bootstrap
  enabled: false
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    server:
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ============================================================================
# MetalLB - LoadBalancer IP Address Management
# Sync Wave: 1 (must be first for LoadBalancer services)
# ============================================================================

metallb:
  enabled: true
  namespace: metallb-system

  # Chart source
  chart:
    name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.14.9

  # IP address pool configuration
  addresses:
    - 172.16.100.100-172.16.100.200

  # BGP configuration for dynamic routing
  bgp:
    enabled: true
    asn: 64512  # Kubernetes cluster ASN
    peers:
      - address: 172.16.100.1  # UniFi Gateway
        asn: 64513
        routerId: 172.16.100.1

  # Resource limits
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    speaker:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ============================================================================
# Kubelet CSR Approver - Automatic Kubelet Certificate Approval
# Sync Wave: 1 (early infrastructure component)
# ============================================================================

kubelet-csr-approver:
  enabled: true
  namespace: kube-system

  # Chart source
  chart:
    name: kubelet-csr-approver
    repo: https://postfinance.github.io/kubelet-csr-approver
    version: "1.2.2"

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2 (OnePasswordItem at wave 1, needs 1Password CRDs from wave 0)
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  # Chart source
  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  # TrueNAS configuration
  driver: freenas-nfs

  # Connection details (from GitOps Bridge metadata)
  truenas:
    endpoint: https://truenas.ryanmcafee.com
    allowInsecure: false
    apiKey: ""  # Must be set manually or via 1Password
    # 1Password vault path for TrueNAS API key (creates secret: truenas-api-key)
    onePasswordItemPath: ""

  # NFS dataset configuration
  nfs:
    shareHost: truenas.ryanmcafee.com
    shareAllow: 172.16.100.0/24
    parent: storage/k8s

  # Storage class configuration
  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  # Resource limits
  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Local Storage (localdev only)
# Sync Wave: 1 (alternative to democratic-csi for local dev)
# ============================================================================

local-path-provisioner:
  enabled: false  # Only enabled in localdev
  namespace: local-path-storage

  # Chart source
  chart:
    name: local-path-provisioner
    repo: https://charts.containeroo.ch
    version: 0.0.30

  # Storage class configuration
  storageClass:
    name: local-path
    defaultClass: true

  # Resource limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# 1Password Operator - Secret Management
# Sync Wave: 0 (FIRST - CRDs must exist before any OnePasswordItem resources)
# ============================================================================

1password-operator:
  enabled: true
  namespace: onepassword-operator

  # Chart source
  chart:
    name: connect
    repo: https://1password.github.io/connect-helm-charts
    version: 1.15.1

  # 1Password Connect configuration
  connect:
    # Connect server credentials (from manual setup)
    credentialsJson: ""  # Provided via Kubernetes secret
    host: op-connect.ryanmcafee.com

  # Resource limits
  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    connect:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3 (needed before ingress resources)
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  # Chart source
  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  # Install CRDs
  installCRDs: true

  # Let's Encrypt configuration
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory  # Production

  # Cloudflare DNS-01 challenge
  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com
    apiToken: ""  # Provided via 1Password operator

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4 (needed before public ingress)
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  # Chart source
  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  # Provider configuration
  provider: cloudflare

  # Cloudflare configuration
  cloudflare:
    apiToken: ""  # Provided via 1Password operator
    proxied: true  # Enable Cloudflare proxy

  # Domain filter
  domainFilters:
    - ryanmcafee.com

  # Only manage specific annotation
  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  # Resource limits
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5 (monitoring can come up after core services)
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  # Chart source
  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.8.2

  # Prometheus configuration
  prometheus:
    # Retention and storage
    retention: 30d
    retentionSize: 50GB

    # Storage configuration
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service Monitor configuration
    serviceMonitors:
      enabled: true

  # Grafana configuration
  grafana:
    enabled: true

    # Admin credentials (from 1Password)
    adminPassword: ""  # Provided via 1Password operator

    # Persistence
    persistence:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi

    # Ingress
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Alertmanager configuration
  alertmanager:
    enabled: true

    # Storage configuration
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Resource limits
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Node exporter
  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Kube-state-metrics
  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Traefik - Ingress Controller
# Sync Wave: 6 (last addon, requires MetalLB and cert-manager)
# ============================================================================

traefik:
  enabled: true
  namespace: traefik

  # Chart source
  chart:
    name: traefik
    repo: https://traefik.github.io/charts
    version: 33.2.1

  # Service configuration
  service:
    type: LoadBalancer
    # MetalLB will assign an IP from the pool

  # Ports configuration
  ports:
    web:
      port: 80
      expose:
        default: true
      # Redirect HTTP to HTTPS
      redirectTo:
        port: websecure
    websecure:
      port: 443
      expose:
        default: true
      tls:
        enabled: true
        # TLS certificates managed by cert-manager, not Traefik ACME
        # This allows for multiple replicas

  # Global arguments
  globalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false

  # Additional arguments (ACME removed - using cert-manager for HA compatibility)
  additionalArguments: []

  # Environment variables
  env: []

  # Persistence disabled (ACME removed - using cert-manager)
  persistence:
    enabled: false

  # Dashboard
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
      entryPoints: ["websecure"]

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Deployment configuration
  deployment:
    replicas: 2  # High availability

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
