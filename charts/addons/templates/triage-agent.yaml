{{- $ta := index .Values "triage-agent" }}
{{- if and $ta.enabled (index .Values "argo-workflows" "enabled") }}
---
# Baseline, not restricted: the Argo Workflows executor containers the
# controller injects into every step pod carry no container securityContext.
# docs/runbooks/triage-agent.md
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ta.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
# Alert triage agent: the intake turns every Alertmanager alert group into a
# triage-fix Workflow (triage -> plan -> fix -> PR -> CI -> Pushover). Needs
# the 1Password item (Claude and GitHub tokens) and Argo Workflows (wave 9).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: triage-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/triage-agent
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # Derived from configuration/ (ADR-010); the child's values stay environment-free.
      valuesObject:
        namespace: {{ $ta.namespace | quote }}
        image: {{ $ta.image | quote }}
        repoUrl: {{ .Values.global.repoUrl | quote }}
        repoSlug: {{ $ta.repoSlug | quote }}
        alertmanagerUrl: {{ printf "http://kube-prometheus-stack-alertmanager.%s.svc:9093" (index .Values "kube-prometheus-stack" "namespace") | quote }}
        workflowUiUrl: {{ $ta.workflowUiUrl | quote }}
        onePassword:
          itemPath: {{ $ta.onePasswordItemPath | quote }}
        pushover:
          itemPath: {{ $ta.pushoverItemPath | quote }}
        workflow:
          workspace:
            storageClass: {{ $ta.storageClass | quote }}
            accessMode: ReadWriteMany
          cache:
            storageClass: {{ $ta.storageClass | quote }}
            accessMode: ReadWriteMany
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ta.namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
{{- end }}
