{{- if index .Values "sops-secrets" "enabled" }}
---
# Namespace for 1Password operator (must exist before secrets)
apiVersion: v1
kind: Namespace
metadata:
  name: onepassword-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: onepassword-operator
    app.kubernetes.io/managed-by: argocd
---
# SOPS-encrypted secrets deployment
# Deploys before 1Password operator to ensure credentials are available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/secrets/onepassword
  destination:
    server: https://kubernetes.default.svc
    namespace: onepassword-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
