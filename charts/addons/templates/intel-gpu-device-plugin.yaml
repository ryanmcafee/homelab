{{- if index .Values "intel-gpu-device-plugin" "enabled" }}
---
# NOTE: the intel-device-plugins Namespace is owned by
# charts/addons/templates/intel-device-plugins-operator.yaml (sync wave 9).
# Declaring it here too produces a RepeatedResourceWarning on the addons app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-device-plugin
  namespace: argocd
  annotations:
    # Wave 10: Same as NVIDIA GPU operator (mutually exclusive via GPU_VENDOR)
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "intel-gpu-device-plugin" "chart" "repo" }}
    chart: {{ index .Values "intel-gpu-device-plugin" "chart" "name" }}
    targetRevision: {{ index .Values "intel-gpu-device-plugin" "chart" "version" }}
    helm:
      releaseName: intel-gpu-device-plugin
      values: |
        # Intel GPU device plugin configuration for Talos Linux
        # Auto-detects xe kernel driver on B50 GPU
        nodeFeatureRule: true
        sharedDevNum: 1
        enableMonitoring: true

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "intel-gpu-device-plugin" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
{{- end }}
