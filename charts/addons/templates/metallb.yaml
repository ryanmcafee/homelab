{{- if .Values.metallb.enabled }}
---
# Namespace with privileged PodSecurity for MetalLB speaker requirements
# (hostNetwork, NET_ADMIN, NET_RAW, SYS_ADMIN capabilities)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.metallb.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.metallb.chart.repo }}
    chart: {{ .Values.metallb.chart.name }}
    targetRevision: {{ .Values.metallb.chart.version }}
    helm:
      releaseName: metallb
      values: |
        speaker:
          frr:
            enabled: {{ .Values.metallb.bgp.enabled }}
          resources:
            {{- toYaml .Values.metallb.resources.speaker | nindent 12 }}
        controller:
          resources:
            {{- toYaml .Values.metallb.resources.controller | nindent 12 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.metallb.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 0

  # Ignore differences in webhook configurations (managed by controller)
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

---
# MetalLB IPAddressPool - Direct CRD instead of ConfigMap
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: {{ .Values.metallb.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  addresses:
  {{- range .Values.metallb.addresses }}
    - {{ . }}
  {{- end }}
  autoAssign: true

{{- if .Values.metallb.bgp.enabled }}
---
# BGP Peer configuration for UniFi gateway
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: unifi-gateway
  namespace: {{ .Values.metallb.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  myASN: {{ .Values.metallb.bgp.asn }}
  peerASN: {{ (index .Values.metallb.bgp.peers 0).asn }}
  peerAddress: {{ (index .Values.metallb.bgp.peers 0).address }}
  routerID: {{ (index .Values.metallb.bgp.peers 0).routerId }}
---
# BGP Advertisement for IP pool
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: default
  namespace: {{ .Values.metallb.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ipAddressPools:
    - default
{{- end }}
{{- end }}
