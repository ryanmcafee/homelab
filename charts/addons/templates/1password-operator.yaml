{{- if index .Values "1password-operator" "enabled" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "1password-operator" "chart" "repo" }}
    chart: {{ index .Values "1password-operator" "chart" "name" }}
    targetRevision: {{ index .Values "1password-operator" "chart" "version" }}
    helm:
      releaseName: onepassword-connect
      values: |
        operator:
          create: true
          autoRestart: true
          # Use token from the SOPS-encrypted credentials secret
          token:
            name: onepassword-credentials
            key: token
          resources:
            {{- toYaml (index .Values "1password-operator" "resources" "operator") | nindent 12 }}

        connect:
          create: true
          credentialsName: onepassword-credentials
          credentialsKey: 1password-credentials.json
          resources:
            {{- toYaml (index .Values "1password-operator" "resources" "connect") | nindent 12 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "1password-operator" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
