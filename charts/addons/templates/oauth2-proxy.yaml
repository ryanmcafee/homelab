{{- if index .Values "oauth2-proxy" "enabled" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "oauth2-proxy" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
# OnePasswordItem for Google OAuth credentials
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: google-oauth-credentials
  namespace: {{ index .Values "oauth2-proxy" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  itemPath: {{ index .Values "oauth2-proxy" "googleOAuthPath" | quote }}
---
# OnePasswordItem for OAuth2-Proxy cookie secret
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oauth2-proxy-cookie-secret
  namespace: {{ index .Values "oauth2-proxy" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  itemPath: {{ index .Values "oauth2-proxy" "cookieSecretPath" | quote }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: {{ index .Values "oauth2-proxy" "chart" "version" }}
    helm:
      releaseName: oauth2-proxy
      values: |
        replicaCount: 2

        # Disable automatic env vars from proxyVarsAsSecrets to avoid duplicates
        # We set these manually via extraEnv from 1Password secrets
        proxyVarsAsSecrets: false

        config:
          configFile: |-
            provider = "google"
            email_domains = {{ toJson (index .Values "oauth2-proxy" "emailDomains") }}
            upstreams = ["static://200"]
            reverse_proxy = true
            set_xauthrequest = true
            set_authorization_header = true
            pass_access_token = true
            pass_host_header = true
            cookie_secure = true
            cookie_domains = {{ toJson (index .Values "oauth2-proxy" "cookieDomains") }}
            whitelist_domains = {{ toJson (index .Values "oauth2-proxy" "whitelistDomains") }}
            skip_provider_button = true

        extraEnv:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: google-oauth-credentials
                key: client_id
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: google-oauth-credentials
                key: client_secret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-cookie-secret
                key: cookie_secret

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/hostname: auth.{{ .Values.global.domain }}
          hosts:
            - auth.{{ .Values.global.domain }}
          tls:
            - secretName: oauth2-proxy-tls
              hosts:
                - auth.{{ .Values.global.domain }}

        resources:
          {{- toYaml (index .Values "oauth2-proxy" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "oauth2-proxy" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 0
---
# Traefik ForwardAuth Middleware for OAuth2-Proxy
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
  namespace: {{ index .Values "oauth2-proxy" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  forwardAuth:
    address: http://oauth2-proxy.{{ index .Values "oauth2-proxy" "namespace" }}.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Access-Token
      - Authorization
{{- end }}
