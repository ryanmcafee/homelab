{{- if (index .Values "kube-prometheus-stack").enabled }}
---
# Prometheus Config: deploys static PV+PVC for Prometheus and Alertmanager (iSCSI)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/prometheus-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # The iSCSI portal comes from this parent's global values (configuration/
      # via the CMP in homelab) so the child's committed values stay PII-free.
      valuesObject:
        iscsi:
          portal: {{ .Values.global.iscsi.portal | quote }}
        # The Alertmanager notification credentials: the child renders the
        # OnePasswordItem that becomes Secret <secretName>, which the
        # kube-prometheus-stack Application mounts into Alertmanager.
        alertmanager:
          notifications:
            secretName: {{ (index .Values "kube-prometheus-stack" "alertmanager" "notifications" "secretName") | quote }}
            onePasswordItemPath: {{ (index .Values "kube-prometheus-stack" "alertmanager" "notifications" "onePasswordItemPath") | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ (index .Values "kube-prometheus-stack").namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
