{{- if index .Values "kube-prometheus-stack" "enabled" }}
---
# Namespace with privileged PodSecurity labels for node-exporter
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "kube-prometheus-stack" "namespace" }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "kube-prometheus-stack" "chart" "repo" }}
    chart: {{ index .Values "kube-prometheus-stack" "chart" "name" }}
    targetRevision: {{ index .Values "kube-prometheus-stack" "chart" "version" }}
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # The monitoring CRDs come from the bootstrap chart's
        # prometheus-operator-crds Application (wave -1) so ArgoCD and
        # cert-manager can render ServiceMonitors long before this chart syncs;
        # a second owner here would make every CRD a shared resource.
        crds:
          enabled: false

        prometheus:
          prometheusSpec:
            {{- if (index .Values "kube-prometheus-stack" "grafana" "route" "enabled") }}
            # Alert generator URLs land on Grafana; the grafana-config redirect sends them to a query view.
            externalUrl: https://{{ index .Values "kube-prometheus-stack" "grafana" "route" "hostname" }}
            {{- end }}
            retention: {{ index .Values "kube-prometheus-stack" "prometheus" "retention" }}
            retentionSize: {{ index .Values "kube-prometheus-stack" "prometheus" "retentionSize" }}

            resources:
              {{- toYaml (index .Values "kube-prometheus-stack" "prometheus" "resources") | nindent 14 }}

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: {{ index .Values "kube-prometheus-stack" "prometheus" "storageClass" }}
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: {{ index .Values "kube-prometheus-stack" "prometheus" "storageSize" }}

            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

            {{- if (index .Values "kube-prometheus-stack" "prometheus" "affinity") }}
            affinity:
              {{- toYaml (index .Values "kube-prometheus-stack" "prometheus" "affinity") | nindent 14 }}
            {{- end }}

            {{- if (index .Values "kube-prometheus-stack" "kubeEtcd" "endpoints") }}
            # Static etcd targets; see the kubeEtcd comment below for why this is
            # not the chart's Endpoints-based path.
            additionalScrapeConfigs:
              - job_name: kube-etcd
                static_configs:
                  - targets:
                      {{- range (index .Values "kube-prometheus-stack" "kubeEtcd" "endpoints") }}
                      - {{ printf "%s:%v" . (index $.Values "kube-prometheus-stack" "kubeEtcd" "port") | quote }}
                      {{- end }}
            {{- end }}

        grafana:
          enabled: {{ index .Values "kube-prometheus-stack" "grafana" "enabled" }}

          adminPassword: {{ index .Values "kube-prometheus-stack" "grafana" "adminPassword" | quote }}

          persistence:
            enabled: {{ index .Values "kube-prometheus-stack" "grafana" "persistence" "enabled" }}
            {{- if (index .Values "kube-prometheus-stack" "grafana" "persistence" "existingClaim") }}
            existingClaim: {{ index .Values "kube-prometheus-stack" "grafana" "persistence" "existingClaim" }}
            {{- else }}
            storageClassName: {{ index .Values "kube-prometheus-stack" "grafana" "persistence" "storageClass" }}
            {{- end }}
            size: {{ index .Values "kube-prometheus-stack" "grafana" "persistence" "size" }}

          {{- with (index .Values "kube-prometheus-stack" "grafana" "route") }}
          {{- if .enabled }}
          route:
            main:
              enabled: true
              annotations:
                external-dns.alpha.kubernetes.io/hostname: {{ .hostname }}
              parentRefs:
                {{- include "addons.gatewayParentRefs" (dict "root" $ "gateway" "internal") | nindent 16 }}
              hostnames:
                - {{ .hostname }}
          {{- end }}
          {{- end }}

          resources:
            {{- toYaml (index .Values "kube-prometheus-stack" "grafana" "resources") | nindent 12 }}

          {{- with (index .Values "kube-prometheus-stack" "grafana" "sidecarResources") }}
          sidecar:
            resources:
              {{- toYaml . | nindent 14 }}
          {{- end }}

          securityContext:
            {{- toYaml (index .Values "kube-prometheus-stack" "grafana" "securityContext") | nindent 12 }}

          {{- if .Values.logging.enabled }}

          # ClickHouse datasource for cluster logs and traces (docs/logging.md,
          # docs/tracing.md); OpenTelemetry mode links a log's TraceId to its trace. The
          # provisioning file keeps the $-reference; Grafana expands it from
          # the environment, so the password never enters a ConfigMap.
          plugins:
            - grafana-clickhouse-datasource@{{ index .Values "kube-prometheus-stack" "grafana" "clickhousePlugin" | trimPrefix "v" }}
          envValueFrom:
            CLICKHOUSE_PASSWORD:
              secretKeyRef:
                name: {{ .Values.logging.secrets.grafana }}
                key: password
          additionalDataSources:
            - name: ClickHouse
              uid: clickhouse-logs
              type: grafana-clickhouse-datasource
              jsonData:
                host: {{ .Values.logging.clickhouse.host }}
                port: 9000
                protocol: native
                username: grafana
                defaultDatabase: {{ .Values.logging.database }}
                logs:
                  defaultDatabase: {{ .Values.logging.database }}
                  defaultTable: otel_logs
                  otelEnabled: true
                  otelVersion: "1.3.0"
                traces:
                  defaultDatabase: {{ .Values.logging.database }}
                  defaultTable: otel_traces
                  otelEnabled: true
                  otelVersion: "1.3.0"
                  durationUnit: nanoseconds
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
          {{- end }}

          {{- with (index .Values "kube-prometheus-stack" "grafana" "dashboards") }}

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: homelab
                  folder: Homelab
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/homelab
          dashboards:
            homelab:
              {{- range $name, $dashboard := . }}
              {{ $name }}:
                gnetId: {{ $dashboard.gnetId }}
                revision: {{ $dashboard.revision }}
                datasource:
                  - name: DS_PROMETHEUS
                    value: Prometheus
              {{- end }}
          {{- end }}

          # Use Recreate strategy to avoid Multi-Attach errors with RWO PVC
          deploymentStrategy:
            type: Recreate

        alertmanager:
          enabled: {{ index .Values "kube-prometheus-stack" "alertmanager" "enabled" }}

          {{- if (index .Values "kube-prometheus-stack" "alertmanager" "enabled") }}
          {{- $notify := index .Values "kube-prometheus-stack" "alertmanager" "notifications" }}
          {{- $secretDir := printf "/etc/alertmanager/secrets/%s" $notify.secretName }}
          {{- $githubPR := index .Values "github-pr-exporter" }}
          {{- $route := index .Values "kube-prometheus-stack" "alertmanager" "route" }}
          {{- $grafanaRoute := index .Values "kube-prometheus-stack" "grafana" "route" }}
          {{- if $route.enabled }}
          route:
            main:
              enabled: true
              annotations:
                external-dns.alpha.kubernetes.io/hostname: {{ $route.hostname }}
              parentRefs:
                {{- include "addons.gatewayParentRefs" (dict "root" $ "gateway" "internal") | nindent 16 }}
              hostnames:
                - {{ $route.hostname }}
          {{- end }}

          # Notification links: the alert group in Alertmanager, its rule query in Grafana Explore.
          templateFiles:
            homelab.tmpl: |-
              {{`{{ define "homelab.grafanaURL" }}`}}https://{{ $grafanaRoute.hostname }}{{`{{ end }}`}}

              {{`{{ define "homelab.alertmanagerURL" -}}
              {{ $filter := printf "alertname=%q" .CommonLabels.alertname -}}
              {{ if .CommonLabels.namespace }}{{ $filter = printf "%s,namespace=%q" $filter .CommonLabels.namespace }}{{ end -}}
              {{ .ExternalURL }}/#/alerts?receiver={{ .Receiver | urlquery }}&filter={{ printf "{%s}" $filter | urlquery }}
              {{- end }}

              {{ define "homelab.grafanaQueryURL" -}}
              {{ $source := (index .Alerts 0).GeneratorURL -}}
              {{ $panes := "" -}}
              {{ if match "[?&]g0\\.expr=" $source -}}
              {{ $expr := $source | reReplaceAll "^.*[?&]g0\\.expr=([^&]*).*$" "$1" | urlUnescape -}}
              {{ $panes = dict "a" (dict "datasource" "prometheus" "queries" (list (dict "refId" "A" "expr" $expr))) | toJson | urlquery | reReplaceAll "\\+" "%20" -}}
              {{ end -}}
              {{ template "homelab.grafanaURL" }}{{ if and $panes (lt (len $panes) 450) }}/explore?schemaVersion=1&orgId=1&panes={{ $panes | safeUrl }}{{ else }}/alerting/Prometheus/{{ .CommonLabels.alertname | urlquery }}/find{{ end }}
              {{- end }}`}}

          alertmanagerSpec:
            {{- if $route.enabled }}
            externalUrl: https://{{ $route.hostname }}
            {{- end }}
            storage:
              {{- toYaml (index .Values "kube-prometheus-stack" "alertmanager" "storage") | nindent 14 }}

            resources:
              {{- toYaml (index .Values "kube-prometheus-stack" "alertmanager" "resources") | nindent 14 }}
            {{- if $notify.enabled }}

            # The notification credentials Secret (prometheus-config chart, from
            # 1Password) is mounted at {{ $secretDir }}; the receivers read the
            # *_file fields so no webhook or token is ever in this Application.
            secrets:
              - {{ $notify.secretName }}
            {{- end }}

          # Routing (docs/runbooks/alerting.md): critical -> Pushover at high
          # priority, warning -> Pushover at low priority (no sound), everything
          # else (info, the always-firing Watchdog and InfoInhibitor) -> null.
          # A critical alert inhibits the warning of the same name in the same
          # namespace. Alertmanager's own templating is escaped so Helm leaves
          # it untouched.
          config:
            global:
              resolve_timeout: 5m
            templates:
              - /etc/alertmanager/config/*.tmpl
            route:
              receiver: "null"
              group_by: [alertname, namespace, severity]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                {{- if and $notify.enabled $githubPR.enabled }}
                # One notification per pull request, repeated while it still
                # needs review; merging or closing it sends nothing.
                - receiver: pushover-github-pr
                  matchers:
                    - alertname = "GitHubPullRequestNeedsReview"
                  group_by: [alertname, repo, number]
                  repeat_interval: {{ $githubPR.repeatInterval }}
                {{- end }}
                {{- if $notify.enabled }}
                - receiver: pushover-critical
                  matchers:
                    - severity = "critical"
                - receiver: pushover-warning
                  matchers:
                    - severity = "warning"
                {{- end }}
            inhibit_rules:
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity =~ "warning|info"
                equal: [alertname, namespace]
            receivers:
              - name: "null"
              {{- if $notify.enabled }}
              # Pushover priorities: 1 = high (bypasses quiet hours), 0 = normal,
              # -1 = low (no sound). Resolved notifications always go out normal.
              - name: pushover-critical
                pushover_configs:
                  - token_file: {{ $secretDir }}/pushover_token
                    user_key_file: {{ $secretDir }}/pushover_user_key
                    send_resolved: true
                    priority: '{{`{{ if eq .Status "firing" }}`}}1{{`{{ else }}`}}0{{`{{ end }}`}}'
                    title: '[{{`{{ .Status | toUpper }}`}}{{`{{ if eq .Status "firing" }}`}}:{{`{{ .Alerts.Firing | len }}`}}{{`{{ end }}`}}] {{`{{ .CommonLabels.alertname }}`}}'
                    url: '{{`{{ template "homelab.alertmanagerURL" . }}`}}'
                    url_title: View in Alertmanager
                    html: true
                    message: |-
                      <a href="{{`{{ template "homelab.grafanaQueryURL" . }}`}}">Query in Grafana</a>
                      {{`{{ range .Alerts }}`}}{{`{{ .Annotations.summary }}`}}{{`{{ if .Labels.namespace }}`}} ({{`{{ .Labels.namespace }}`}}){{`{{ end }}`}}
                      {{`{{ if .Annotations.description }}`}}{{`{{ .Annotations.description }}`}}{{`{{ end }}`}}
                      {{`{{ end }}`}}
              - name: pushover-warning
                pushover_configs:
                  - token_file: {{ $secretDir }}/pushover_token
                    user_key_file: {{ $secretDir }}/pushover_user_key
                    send_resolved: true
                    priority: "-1"
                    title: '[{{`{{ .Status | toUpper }}`}}{{`{{ if eq .Status "firing" }}`}}:{{`{{ .Alerts.Firing | len }}`}}{{`{{ end }}`}}] {{`{{ .CommonLabels.alertname }}`}}'
                    url: '{{`{{ template "homelab.alertmanagerURL" . }}`}}'
                    url_title: View in Alertmanager
                    html: true
                    message: |-
                      <a href="{{`{{ template "homelab.grafanaQueryURL" . }}`}}">Query in Grafana</a>
                      {{`{{ range .Alerts }}`}}{{`{{ .Annotations.summary }}`}}{{`{{ if .Labels.namespace }}`}} ({{`{{ .Labels.namespace }}`}}){{`{{ end }}`}}
                      {{`{{ end }}`}}
              {{- end }}
              {{- if and $notify.enabled $githubPR.enabled }}
              - name: pushover-github-pr
                pushover_configs:
                  - token_file: {{ $secretDir }}/pushover_token
                    user_key_file: {{ $secretDir }}/pushover_user_key
                    send_resolved: false
                    priority: "0"
                    title: 'PR needs review: {{`{{ .CommonLabels.repo }}`}}#{{`{{ .CommonLabels.number }}`}}'
                    message: '{{`{{ .CommonAnnotations.title }}`}} (by {{`{{ .CommonAnnotations.author }}`}})'
                    url: '{{`{{ .CommonAnnotations.url }}`}}'
                    url_title: 'Open pull request'
              {{- end }}
          {{- end }}

        nodeExporter:
          enabled: {{ index .Values "kube-prometheus-stack" "nodeExporter" "enabled" }}
        {{- if (index .Values "kube-prometheus-stack" "nodeExporter" "enabled") }}

        prometheus-node-exporter:
          resources:
            {{- toYaml (index .Values "kube-prometheus-stack" "nodeExporter" "resources") | nindent 12 }}
        {{- end }}

        kubeStateMetrics:
          enabled: {{ index .Values "kube-prometheus-stack" "kubeStateMetrics" "enabled" }}
        {{- if (index .Values "kube-prometheus-stack" "kubeStateMetrics" "enabled") }}

        kube-state-metrics:
          resources:
            {{- toYaml (index .Values "kube-prometheus-stack" "kubeStateMetrics" "resources") | nindent 12 }}
          {{- if (index .Values "envoy-gateway" "enabled") }}
          # Gateway and HTTPRoute conditions for HomelabGatewayNotProgrammed and HomelabHTTPRouteNotAccepted.
          rbac:
            extraRules:
              - apiGroups: [gateway.networking.k8s.io]
                resources: [gateways, httproutes]
                verbs: [list, watch]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind:
                      group: gateway.networking.k8s.io
                      version: v1
                      kind: Gateway
                    metricNamePrefix: gatewayapi_gateway
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      name: [metadata, name]
                      gatewayclass: [spec, gatewayClassName]
                    metrics:
                      - name: status
                        help: Gateway status conditions, 1 when the condition is True.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, conditions]
                            labelsFromPath:
                              type: [type]
                              reason: [reason]
                            valueFrom: [status]
                  - groupVersionKind:
                      group: gateway.networking.k8s.io
                      version: v1
                      kind: HTTPRoute
                    metricNamePrefix: gatewayapi_httproute
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      name: [metadata, name]
                      parent: [status, parents, "[controllerName=gateway.envoyproxy.io/gatewayclass-controller]", parentRef, name]
                    metrics:
                      - name: status
                        help: HTTPRoute conditions reported by Envoy Gateway, 1 when the condition is True.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, parents, "[controllerName=gateway.envoyproxy.io/gatewayclass-controller]", conditions]
                            labelsFromPath:
                              type: [type]
                              reason: [reason]
                            valueFrom: [status]
          {{- end }}
        {{- end }}
        {{- with (index .Values "kube-prometheus-stack" "operator") }}

        prometheusOperator:
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- with (index $.Values "kube-prometheus-stack" "configReloader") }}
          prometheusConfigReloader:
            resources:
              {{- toYaml .resources | nindent 14 }}
          {{- end }}
        {{- end }}

        # The chart's own CPUThrottlingHigh divides throttled CFS periods by the
        # periods the container ran in at all, with no floor under the
        # denominator, so a container that is 99 % idle reads as badly throttled
        # off a handful of samples. Turned off here; the tuned copy with that
        # floor is in additionalPrometheusRulesMap below.
        defaultRules:
          disabled:
            {{- toYaml (index .Values "kube-prometheus-stack" "defaultRules" "disabled") | nindent 12 }}

        # No kube-proxy where Cilium replaces it: the chart's scrape Service would
        # select nothing and KubeProxyDown would fire forever. Disabling the
        # component also drops that rule.
        kubeProxy:
          enabled: {{ index .Values "kube-prometheus-stack" "kubeProxy" "enabled" }}

        # etcd scrape (Talos exposes etcd metrics on <control-plane IP>:2381 once
        # cluster.etcd.extraArgs.listen-metrics-urls is set). Kind has no reachable
        # etcd metrics endpoint, so the scrape is disabled there instead of leaving
        # a permanently down target behind.
        #
        # The chart's own kubeEtcd path cannot reach an external etcd here. It
        # points a selector-less Service at an Endpoints object built from
        # kubeEtcd.endpoints, and ArgoCD's resource.exclusions drop Endpoints and
        # EndpointSlice cluster-wide, so that object is rendered and then never
        # applied: the Service stays empty and nothing is scraped. Talos also runs
        # etcd as a host service with no Kubernetes pod, so the selector form
        # cannot work either. The addresses therefore go into a static scrape
        # config, which needs no Endpoints object at all.
        #
        # kubeEtcd.enabled stays true because the chart gates its etcd alert rules
        # (etcdHighFsyncDurations, etcdHighNumberOfLeaderChanges, ...) on it; only
        # the unusable Service and ServiceMonitor are turned off. The job name must
        # contain "etcd" because those rules match job=~".*etcd.*".
        kubeEtcd:
          enabled: true
          service:
            enabled: false
          serviceMonitor:
            enabled: false

        # Control-plane alerts. The chart's own defaultRules cover etcd once it is
        # scraped; these three cover the symptom (apiserver 5xx), the cause (slow
        # control-plane disk) and the blind spot (etcd metrics missing again).
        # Prometheus $labels templating is escaped so Helm leaves it untouched.
        additionalPrometheusRulesMap:
          homelab-control-plane:
            groups:
              - name: homelab-control-plane
                rules:
                  - alert: KubeAPIServerErrorsHigh
                    expr: 'sum(rate(apiserver_request_total{code=~"5.."}[5m])) > 0.5'
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'kube-apiserver is returning 5xx (etcd/lease trouble)'
                      description: 'kube-apiserver has been serving more than 0.5 5xx responses per second for 2m. Usually etcd fsync stalls on the control-plane disk; see docs/runbooks/control-plane-storage.md.'
                  - alert: NodeDiskWriteLatencyHigh
                    expr: 'rate(node_disk_write_time_seconds_total{device="sda"}[5m]) / rate(node_disk_writes_completed_total{device="sda"}[5m]) > 0.05'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Average sda write latency on {{`{{ $labels.instance }}`}} is above 50ms'
                      description: 'The system disk of {{`{{ $labels.instance }}`}} has averaged more than 50ms per write for 10m. On the control planes this starves etcd fsync; see docs/runbooks/control-plane-storage.md.'
                  {{- if (index .Values "kube-prometheus-stack" "kubeEtcd" "endpoints") }}
                  - alert: EtcdMetricsAbsent
                    expr: 'absent(up{job="kube-etcd"} == 1)'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'etcd metrics are not being scraped'
                      description: 'No kube-etcd target has been up for 15m, so the etcd fsync and leader-change alerts are blind. Check cluster.etcd.extraArgs.listen-metrics-urls on the control planes; see docs/runbooks/control-plane-storage.md.'
                  {{- end }}
          # Critical infrastructure alerts routed by severity (docs/runbooks/alerting.md).
          # The chart's defaultRules already cover full disks and volumes
          # (NodeFilesystemAlmostOutOfSpace, KubePersistentVolumeFillingUp), pods
          # and targets; these name the homelab failures those miss or only warn
          # about. Metrics: kube-state-metrics, the kube-etcd scrape and the
          # CloudNativePG PodMonitor, all of which Prometheus discovers today.
          homelab-infrastructure:
            groups:
              - name: homelab-infrastructure
                rules:
                  - alert: HomelabNodeNotReady
                    expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Node {{`{{ $labels.node }}`}} is NotReady'
                      description: 'The kubelet on {{`{{ $labels.node }}`}} has reported NotReady for 5m. Workloads on it are being rescheduled; check the VM in Proxmox and `talosctl -n <node> health`.'
                  - alert: HomelabNodeUnderPressure
                    expr: 'kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Node {{`{{ $labels.node }}`}} reports {{`{{ $labels.condition }}`}}'
                      description: '{{`{{ $labels.node }}`}} has been under {{`{{ $labels.condition }}`}} for 10m; the kubelet is evicting pods. Check `kubectl describe node` and the workload limits.'
                  {{- if (index .Values "kube-prometheus-stack" "kubeEtcd" "endpoints") }}
                  - alert: HomelabEtcdQuorumAtRisk
                    expr: 'count(up{job="kube-etcd"} == 1) < 2'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Fewer than two etcd members are reachable'
                      description: 'Only {{`{{ $value }}`}} of the three etcd members answered the metrics scrape for 5m. With one more loss the control plane stops; see docs/runbooks/control-plane-storage.md.'
                  {{- end }}
                  - alert: HomelabPostgresClusterDown
                    expr: 'max by (namespace, cluster) (cnpg_collector_up) == 0'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CloudNativePG cluster {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cluster }}`}} is down'
                      description: 'No instance of {{`{{ $labels.cluster }}`}} has reported PostgreSQL up for 5m. `kubectl -n {{`{{ $labels.namespace }}`}} get cluster {{`{{ $labels.cluster }}`}}` shows the phase; docs/disaster-recovery.md covers the restore path.'
                  # ArgoCD and cert-manager expose these through the ServiceMonitors
                  # their charts render (bootstrap and cert-manager values); the CRDs
                  # they need come from prometheus-operator-crds at bootstrap wave -1.
                  - alert: HomelabArgoCDApplicationDegraded
                    expr: 'argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ArgoCD Application {{`{{ $labels.name }}`}} is {{`{{ $labels.health_status }}`}}'
                      description: '{{`{{ $labels.name }}`}} has been {{`{{ $labels.health_status }}`}} for 15m. `task prod:status` lists the Applications; `task prod:diff -- {{`{{ $labels.name }}`}}` shows what differs from Git.'
                  - alert: HomelabCertificateExpiringSoon
                    expr: 'certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600'
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} expires in under 14 days'
                      description: 'cert-manager has not renewed {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} although it should renew 30 days before expiry. `kubectl -n {{`{{ $labels.namespace }}`}} describe certificate {{`{{ $labels.name }}`}}` shows the last ACME attempt.'
                  # Cluster DNS. CoreDNS forwards to the node resolver, which has a
                  # single upstream (the gateway). On 2026-09-03 that upstream was
                  # unhealthy for 8.5 h: CoreDNS had nowhere to forward, answered
                  # SERVFAIL to one query in four (66k answers), crash-looped
                  # external-dns and failed Renovate — and nothing alerted, because
                  # CoreDNS itself was up, so TargetDown never fired. The ratio held
                  # 25 % through the outage against a 3 % peak in a normal week; the
                  # rate guard keeps an idle cluster from alerting on a thin sample.
                  - alert: HomelabClusterDNSFailing
                    expr: 'sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[10m])) / sum(rate(coredns_dns_responses_total[10m])) > 0.1 and sum(rate(coredns_dns_responses_total[10m])) > 1'
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CoreDNS is answering SERVFAIL for {{`{{ $value | humanizePercentage }}`}} of queries'
                      description: 'More than 10 % of cluster DNS answers have been SERVFAIL for 15m, so name resolution is failing cluster-wide. Usually the upstream resolver: see HomelabClusterDNSUpstreamDown and docs/runbooks/cluster-dns.md.'
                  - alert: HomelabClusterDNSUpstreamDown
                    expr: 'sum(rate(coredns_forward_healthcheck_broken_total[5m])) > 0'
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'CoreDNS has no healthy upstream resolver'
                      description: 'CoreDNS has marked every upstream in the node resolver unhealthy for 10m, so it can only answer from cache and then SERVFAIL. The nodes resolve through one upstream, so this usually means the gateway is not answering DNS; docs/runbooks/cluster-dns.md.'
                  # CPUThrottlingHigh, re-stated with a floor under the denominator
                  # (defaultRules.disabled turns the chart's own copy off). Same
                  # ratio and the same 25 % threshold; the container must also have
                  # run in more than 300 of the 3000 CFS periods in the window, a
                  # 10 % duty cycle. Below that the ratio is a handful of samples
                  # and means nothing: the democratic-csi drivers sit at ~35
                  # periods. Every container that does real work is far above the
                  # floor (Prometheus 2250, Grafana 1934, Spegel ~1180/pod), so
                  # nothing that could actually be CPU-starved stops alerting.
                  - alert: CPUThrottlingHigh
                    expr: 'sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_throttled_periods_total{container!="",job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) / on (cluster, namespace, pod, container, instance) group_left () sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) > (25 / 100) and on (cluster, namespace, pod, container, instance) sum without (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))) > 300'
                    for: 15m
                    labels:
                      severity: info
                    annotations:
                      summary: 'Processes experience elevated CPU throttling.'
                      description: '{{`{{ $value | humanizePercentage }}`}} throttling of CPU in namespace {{`{{ $labels.namespace }}`}} for container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}}, which is busy enough for the figure to mean something. Raise the CPU limit; requests govern scheduling, a limit only caps a burst.'
                      runbook_url: 'https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh'
          {{- $eg := index .Values "envoy-gateway" }}
          {{- if $eg.enabled }}
          {{- $fleets := list }}
          {{- range $tier := list "internal" "external" }}
          {{- $gw := index $eg.gateways $tier }}
          {{- if $gw.enabled }}
          {{- $fleets = append $fleets $gw.config.name }}
          {{- end }}
          {{- end }}
          {{- $routeClusters := `envoy_cluster_name=~"httproute/.*"` }}
          # Ingress (docs/runbooks/alerting.md). Metrics: the envoy-gateway
          # ServiceMonitor (controller, job envoy-gateway), the <gateway>-proxy
          # PodMonitors (label gateway on every proxy series; route clusters are
          # httproute/<namespace>/<route>/rule/<n>) and the kube-state-metrics
          # Gateway API custom resource state above.
          homelab-ingress:
            groups:
              - name: homelab-ingress
                rules:
                  - alert: HomelabEnvoyGatewayControllerDown
                    expr: 'absent(up{job="envoy-gateway", namespace="{{ $eg.namespace }}"} == 1)'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'The Envoy Gateway controller is not running'
                      description: 'No envoy-gateway controller pod has answered the metrics scrape for 10m. The proxies keep serving their last configuration, but route, certificate and Gateway changes wait for it. `kubectl -n {{ $eg.namespace }} get pods -l app.kubernetes.io/name=gateway-helm`.'
                  {{- if $fleets }}
                  - alert: HomelabEnvoyProxyDown
                    expr: 'sum by (gateway) (up{gateway=~"{{ join "|" $fleets }}"}) == 0{{ range $fleets }} or absent(up{gateway="{{ . }}"}){{ end }}'
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Envoy proxy fleet {{`{{ $labels.gateway }}`}} has no reachable instance'
                      description: 'No proxy pod of Gateway {{`{{ $labels.gateway }}`}} has answered the metrics scrape for 5m, so every route attached to it is down. `kubectl -n {{ $eg.namespace }} get pods -l gateway.envoyproxy.io/owning-gateway-name={{`{{ $labels.gateway }}`}}` and the Gateway status.'
                  {{- end }}
                  - alert: HomelabEnvoyGatewayErrors
                    expr: 'sum by (gateway) (rate(envoy_http_downstream_rq_xx{gateway!="", envoy_http_conn_manager_prefix=~"https?-.*", envoy_response_code_class="5"}[5m])) / sum by (gateway) (rate(envoy_http_downstream_rq_total{gateway!="", envoy_http_conn_manager_prefix=~"https?-.*"}[5m])) > 0.05 and sum by (gateway) (rate(envoy_http_downstream_rq_total{gateway!="", envoy_http_conn_manager_prefix=~"https?-.*"}[5m])) > 0.1'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Gateway {{`{{ $labels.gateway }}`}} answers 5xx to {{`{{ $value | humanizePercentage }}`}} of requests'
                      description: 'More than 5 % of all requests on {{`{{ $labels.gateway }}`}} have ended in 5xx for 10m, across routes. HomelabEnvoyUpstreamErrors names the route; if it is silent the proxy answers itself (no route, TLS, 503 without endpoints): see response_flags in the access log (docs/logging.md).'
                  - alert: HomelabEnvoyUpstreamErrors
                    expr: 'sum by (gateway, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{ {{- $routeClusters }}, envoy_response_code_class="5"}[5m])) / sum by (gateway, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{ {{- $routeClusters }}}[5m])) > 0.05 and sum by (gateway, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{ {{- $routeClusters }}}[5m])) > 0.1'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{`{{ $labels.envoy_cluster_name }}`}} answers 5xx to {{`{{ $value | humanizePercentage }}`}} of requests'
                      description: 'More than 5 % of the requests {{`{{ $labels.gateway }}`}} sent to {{`{{ $labels.envoy_cluster_name }}`}} (httproute/<namespace>/<route>/rule/<n>) have failed with 5xx for 10m. The access log (upstream_cluster, response_flags, docs/logging.md) shows the failing paths and upstream times.'
                  - alert: HomelabEnvoyUpstreamSlow
                    expr: 'histogram_quantile(0.95, sum by (gateway, envoy_cluster_name, le) (rate(envoy_cluster_upstream_rq_time_bucket{ {{- $routeClusters }}}[5m]))) / 1000 > 5 and sum by (gateway, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{ {{- $routeClusters }}}[5m])) > 0.05'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'p95 latency of {{`{{ $labels.envoy_cluster_name }}`}} is {{`{{ $value | humanizeDuration }}`}}'
                      description: 'The 95th percentile upstream response time {{`{{ $labels.gateway }}`}} measured for {{`{{ $labels.envoy_cluster_name }}`}} has been above 5 s for 10m. Streaming endpoints hold requests open by design (no request timeout); check the access log before tuning.'
                  - alert: HomelabEnvoyUpstreamUnhealthy
                    expr: 'max by (gateway, envoy_cluster_name) (envoy_cluster_membership_healthy{ {{- $routeClusters }}}) == 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Route backend {{`{{ $labels.envoy_cluster_name }}`}} has no healthy endpoint'
                      description: '{{`{{ $labels.gateway }}`}} has had no ready endpoint for {{`{{ $labels.envoy_cluster_name }}`}} for 10m, so the route answers 503 (response flag UH). The backend Service has no ready pod; `kubectl -n <namespace> get endpointslices` for the route namespace.'
                  - alert: HomelabGatewayNotProgrammed
                    expr: 'gatewayapi_gateway_status{type=~"Accepted|Programmed"} == 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Gateway {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} is not {{`{{ $labels.type }}`}}'
                      description: 'Gateway {{`{{ $labels.name }}`}} (class {{`{{ $labels.gatewayclass }}`}}) has reported {{`{{ $labels.type }}`}}=False ({{`{{ $labels.reason }}`}}) for 15m, so its listeners or its Service address are not in place. `kubectl -n {{`{{ $labels.namespace }}`}} describe gateway {{`{{ $labels.name }}`}}`.'
                  - alert: HomelabHTTPRouteNotAccepted
                    expr: 'gatewayapi_httproute_status{type=~"Accepted|ResolvedRefs"} == 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'HTTPRoute {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} is not {{`{{ $labels.type }}`}} on {{`{{ $labels.parent }}`}}'
                      description: 'Envoy Gateway has reported {{`{{ $labels.type }}`}}=False ({{`{{ $labels.reason }}`}}) for 15m, so the route serves nothing or answers 500. Usually a wrong parentRef/sectionName, a hostname outside the listener or a missing backend Service. `kubectl -n {{`{{ $labels.namespace }}`}} describe httproute {{`{{ $labels.name }}`}}`.'
                  - alert: HomelabEnvoyGatewayXdsRejected
                    expr: 'sum(rate(xds_nack_total{job="envoy-gateway"}[5m])) > 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Envoy proxies reject the configuration Envoy Gateway sends'
                      description: 'A proxy has NACKed xDS updates for 10m and keeps running on its last accepted configuration, so recent route or policy changes are not live. The controller log (level error, "NACK") names the resource.'
                  - alert: HomelabEnvoyGatewayTranslationErrors
                    expr: 'sum by (runner, message) (rate(watchable_subscribe_total{job="envoy-gateway", status="failure"}[5m])) > 0 or sum(rate(watchable_panics_recovered_total{job="envoy-gateway"}[5m])) > 0 or sum(rate(xds_snapshot_update_total{job="envoy-gateway", status="failure"}[5m])) > 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Envoy Gateway fails to translate configuration{{`{{ with $labels.runner }}`}} (runner {{`{{ . }}`}}){{`{{ end }}`}}'
                      description: 'The controller has failed to turn Gateway API resources into xDS, or to publish the snapshot, for 10m; proxies keep the last good configuration. The controller log and the "Envoy Gateway Global" dashboard name the runner and resource.'
                  - alert: HomelabEnvoyGatewayResourceErrors
                    expr: 'sum by (kind) (rate(resource_apply_total{job="envoy-gateway", status="failure"}[5m])) > 0 or sum by (kind) (rate(status_update_total{job="envoy-gateway", status="failure", reason="error"}[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Envoy Gateway cannot apply or update {{`{{ $labels.kind }}`}} objects'
                      description: 'The controller has failed for 15m to apply the proxy {{`{{ $labels.kind }}`}} (Deployment, Service, HPA, ...) or to write route and Gateway status. Usually RBAC or an admission webhook; the controller log names the object.'
                  - alert: HomelabGatewayCertificateExpiring
                    expr: '(certmanager_certificate_expiration_timestamp_seconds{namespace="{{ $eg.namespace }}", name="gateway-wildcard-tls"} - time() < 7 * 24 * 3600) or certmanager_certificate_ready_status{namespace="{{ $eg.namespace }}", name="gateway-wildcard-tls", condition="True"} == 0'
                    for: 1h
                    labels:
                      severity: critical
                    annotations:
                      summary: 'The gateway wildcard certificate is not ready or expires within 7 days'
                      description: 'Every Envoy and Istio gateway serves {{ $eg.namespace }}/gateway-wildcard-tls, so its expiry takes all HTTPS hostnames down at once. `kubectl -n {{ $eg.namespace }} describe certificate gateway-wildcard-tls` shows the last DNS-01 attempt.'
                  {{- if and .Values.istio.enabled .Values.istio.gateways.enabled }}
                  {{- $istioGw := .Values.istio.gateways.config.namespace }}
                  - alert: HomelabIstioGatewayDown
                    expr: 'sum by (gateway) (label_replace(up{namespace="{{ $istioGw }}", pod=~"istio-(internal|external)-.*"}, "gateway", "$1", "pod", "(istio-(?:internal|external))-.*")) == 0{{ range list "istio-internal" "istio-external" }} or label_replace(absent(up{namespace="{{ $istioGw }}", pod=~"{{ . }}-.*"}), "gateway", "{{ . }}", "", ""){{ end }}'
                    for: 15m
                    labels:
                      severity: info
                    annotations:
                      summary: 'Istio comparison gateway {{`{{ $labels.gateway }}`}} is down'
                      description: 'No pod of the Istio comparison gateway in {{ $istioGw }} has answered the scrape for 15m. Only the echo route attaches to it, so no workload is affected. `kubectl -n {{ $istioGw }} get pods,gateway`.'
                  {{- end }}
          {{- end }}
          {{- if .Values.logging.enabled }}
          # Log pipeline, adapted from the opentelemetry-collector chart rules and
          # the Altinity clickhouse-operator alert rules (docs/runbooks/alerting.md).
          homelab-logging:
            groups:
              - name: homelab-logging
                rules:
                  - alert: HomelabLogExportFailing
                    expr: 'sum by (namespace, pod) (rate(otelcol_exporter_send_failed_log_records[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{`{{ $labels.pod }}`}} cannot write logs to ClickHouse'
                      description: '{{`{{ $labels.pod }}`}} has failed to export log records for 15m; they are dropped once the retry window (5m) and the send queue run out. Check the ClickHouse pod and `kubectl -n {{`{{ $labels.namespace }}`}} logs {{`{{ $labels.pod }}`}}`.'
                  - alert: HomelabLogExportQueueFull
                    expr: 'max by (namespace, pod) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{`{{ $labels.pod }}`}} send queue is {{`{{ $value | humanizePercentage }}`}} full'
                      description: 'The ClickHouse exporter queue of {{`{{ $labels.pod }}`}} has been above 80 % for 10m; new batches are refused when it fills. ClickHouse is slow or unreachable.'
                  - alert: HomelabLogsNotArriving
                    expr: 'sum(rate(otelcol_receiver_accepted_log_records{receiver=~"file_?log.*"}[15m])) == 0 or absent(otelcol_receiver_accepted_log_records{receiver=~"file_?log.*"})'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'No container logs are being collected'
                      description: 'The OpenTelemetry agents have read no container log line for 30m. Check the otel-collector-agent DaemonSet in {{ .Values.logging.namespace }} and its hostPath mounts of /var/log/pods.'
                  - alert: HomelabTraceExportFailing
                    expr: 'sum by (namespace, pod) (rate(otelcol_exporter_send_failed_spans[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Collector {{`{{ $labels.pod }}`}} cannot write spans to ClickHouse'
                      description: '{{`{{ $labels.pod }}`}} has failed to export spans for 15m; they are dropped once retries and the send queue run out (docs/tracing.md).'
                  - alert: HomelabTelemetryRefused
                    expr: 'sum by (namespace, pod, receiver) (rate(otelcol_receiver_refused_spans[5m]) or rate(otelcol_receiver_refused_log_records[5m])) > 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Receiver {{`{{ $labels.receiver }}`}} on {{`{{ $labels.pod }}`}} refuses data'
                      description: 'The collector has refused spans or log records on {{`{{ $labels.receiver }}`}} for 10m, usually because memory_limiter is holding it back. Raise the collector memory limit or find the sender flooding it.'
                  {{- if .Values.logging.unifi.enabled }}
                  - alert: HomelabUniFiTelemetrySilent
                    expr: 'sum by (source) (rate(homelab_unifi_telemetry_records_total[30m])) == 0 or absent(homelab_unifi_telemetry_records_total{source="netflow"}) or absent(homelab_unifi_telemetry_records_total{source="syslog"})'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'No UniFi {{`{{ $labels.source }}`}} telemetry for 30m'
                      description: 'The gateway collector has counted no UniFi {{`{{ $labels.source }}`}} records for an hour, or none since it started (count connector count/unifi). Check the UniFi export settings (docs/logging.md, "UniFi gateway") and that otel.<DOMAIN> resolves to OTEL_LB_IP.'
                  {{- end }}
                  - alert: HomelabClickHouseDown
                    expr: 'max by (chi, hostname) (chi_clickhouse_metric_fetch_errors{fetch_type="system.metrics"}) > 0 or absent(chi_clickhouse_metric_Uptime)'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{`{{ $labels.chi }}`}} is not answering the metrics exporter'
                      description: 'The clickhouse-operator metrics exporter has not read system.metrics from ClickHouse for 10m, so the log store is down or unreachable. `kubectl -n {{ .Values.logging.namespace }} get chi` and the ClickHouse pod events.'
                  - alert: HomelabClickHouseRejectedInserts
                    expr: 'sum by (chi, hostname) (increase(chi_clickhouse_event_RejectedInserts[5m])) > 0'
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{`{{ $labels.hostname }}`}} rejects inserts (too many parts)'
                      description: 'ClickHouse refused inserts because a partition has too many active parts; merges are not keeping up with the batch rate. Raise the collector batch size or ClickHouse CPU.'
                  - alert: HomelabClickHouseTooManyParts
                    expr: 'max by (chi, hostname) (chi_clickhouse_metric_MaxPartCountForPartition) > 150'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'ClickHouse {{`{{ $labels.hostname }}`}} has {{`{{ $value }}`}} parts in one partition'
                      description: 'Inserts are throttled from 150 parts per partition and rejected from 300. Merges are behind; see HomelabClickHouseRejectedInserts.'
          {{- end }}
          {{- if .Values.cilium.config.monitoring.enabled }}
          # Cilium and Hubble (docs/hubble.md), from the agent, operator and
          # hubble-metrics ServiceMonitors of charts/cilium-config.
          homelab-network:
            groups:
              - name: homelab-network
                rules:
                  - alert: HomelabCiliumAgentNotReady
                    expr: 'kube_daemonset_status_number_ready{namespace="kube-system",daemonset="cilium"} < kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="cilium"}'
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'A Cilium agent is not ready'
                      description: 'Fewer Cilium agents are ready than nodes for 10m; pods on the affected node lose networking and policy. `kubectl -n kube-system get pods -l k8s-app=cilium -o wide`.'
                  - alert: HomelabCiliumOperatorDown
                    expr: 'absent(up{job="cilium-operator"} == 1)'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'cilium-operator is not running'
                      description: 'No cilium-operator answered the scrape for 15m; LoadBalancer IP allocation and identity garbage collection stop until it is back.'
                  - alert: HomelabCiliumUnreachableNodes
                    expr: 'max by (node) (cilium_unreachable_nodes) > 0'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Cilium on {{`{{ $labels.node }}`}} cannot reach {{`{{ $value }}`}} node(s)'
                      description: 'Node-to-node health probes have failed for 10m; cross-node pod traffic from {{`{{ $labels.node }}`}} is likely broken. `kubectl -n kube-system exec ds/cilium -- cilium-health status`.'
                  - alert: HomelabCiliumEndpointRegenerationFailing
                    expr: 'sum by (node) (rate(cilium_endpoint_regenerations_total{outcome="fail"}[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Cilium fails to program endpoints on {{`{{ $labels.node }}`}}'
                      description: 'Endpoint regeneration has been failing for 15m, so new pods or policy changes on that node are not applied. The agent log names the endpoint.'
                  - alert: HomelabCiliumBPFMapPressure
                    expr: 'max by (node, map_name) (cilium_bpf_map_pressure) > 0.9'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'BPF map {{`{{ $labels.map_name }}`}} on {{`{{ $labels.node }}`}} is {{`{{ $value | humanizePercentage }}`}} full'
                      description: 'A full BPF map drops new connections or policy entries. Raise the map size in the Cilium values (bpf.*Max) and re-render.'
                  - alert: HomelabHubbleDropsHigh
                    expr: 'sum by (reason, source, destination) (rate(hubble_drop_total[5m])) > 1'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Cilium drops {{`{{ $value | humanize }}`}} packets/s ({{`{{ $labels.reason }}`}}) from {{`{{ $labels.source }}`}} to {{`{{ $labels.destination }}`}}'
                      description: 'Sustained drops for 15m. The Hubble flow log in ClickHouse (ServiceName hubble, verdict DROPPED) has every dropped flow with its 5-tuple (docs/hubble.md).'
          {{- end }}
          {{- if (index .Values "blackbox-exporter" "enabled") }}
          # Synthetic probes (docs/runbooks/paperclip-request-path.md); target
          # is the probe name, e.g. paperclip-ingress vs paperclip-direct.
          homelab-probes:
            groups:
              - name: homelab-probes
                rules:
                  - alert: HomelabProbeFailing
                    expr: 'max by (target, instance) (probe_success) == 0'
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Probe {{`{{ $labels.target }}`}} fails ({{`{{ $labels.instance }}`}})'
                      description: '{{`{{ $labels.instance }}`}} has not answered 2xx for 2m. If only the -ingress probe fails the break is in DNS or Envoy Gateway, if -direct fails too it is the pod; docs/runbooks/paperclip-request-path.md.'
                  - alert: HomelabProbeSlow
                    expr: 'max by (target, instance) (probe_duration_seconds) > 2'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Probe {{`{{ $labels.target }}`}} takes {{`{{ $value | humanizeDuration }}`}}'
                      description: '{{`{{ $labels.instance }}`}} has taken more than 2 s for 10m; compare the -ingress and -direct probes to find the slow hop.'
          {{- end }}
          # Paperclip agents (docs/runbooks/paperclip-agents.md). Memory from
          # cAdvisor and kube-state-metrics; the rest from charts/paperclip's exporter.
          homelab-paperclip:
            groups:
              - name: homelab-paperclip
                rules:
                  - alert: PaperclipMemoryNearLimit
                    expr: 'max by (namespace, pod) (container_memory_working_set_bytes{namespace="paperclip", container="paperclip"}) / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="paperclip", container="paperclip", resource="memory"}) > 0.85'
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip {{`{{ $labels.pod }}`}} uses {{`{{ $value | humanizePercentage }}`}} of its memory limit'
                      description: 'Above 85 % for 5m. Agent runs are child processes of the pod, so reaching the limit kills runs or the whole server; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipMemoryNearLimit
                    expr: 'max by (namespace, pod) (container_memory_working_set_bytes{namespace="paperclip", container="paperclip"}) / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="paperclip", container="paperclip", resource="memory"}) > 0.95'
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Paperclip {{`{{ $labels.pod }}`}} is at its memory limit ({{`{{ $value | humanizePercentage }}`}})'
                      description: 'Above 95 % for 2m: the next allocation is OOM-killed. Pause agents now; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipOOMKilled
                    expr: 'increase(kube_pod_container_status_restarts_total{namespace="paperclip", container="paperclip"}[15m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{namespace="paperclip", container="paperclip", reason="OOMKilled"} == 1'
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip {{`{{ $labels.pod }}`}} was OOM-killed and restarted'
                      description: 'Every agent run in flight was lost with the process. docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipMetricsUnavailable
                    expr: 'min by (namespace) (paperclip_up) == 0 or min by (namespace) (up{job="paperclip-exporter"}) == 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'The Paperclip exporter cannot read the Paperclip API'
                      description: 'The agent alerts of this group are blind. The exporter log names the endpoint and HTTP status; 401/403 means the paperclip-exporter 1Password item is missing or its key was revoked.'
                  - alert: PaperclipAgentFailureRateHigh
                    expr: 'sum by (company_id, company) (paperclip_agent_runs_finished{status=~"failed|interrupted|timed_out"}) / sum by (company_id, company) (paperclip_agent_runs_finished) > 0.2 and sum by (company_id, company) (paperclip_agent_runs_finished) >= 5'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{`{{ $value | humanizePercentage }}`}} of agent runs in {{`{{ $labels.company }}`}} failed in the last hour'
                      description: 'More than 20 % of at least 5 runs finished in the last hour failed, were interrupted or timed out. paperclip_agent_runs_errors names the error codes; docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipRecoveryRateBreached
                    expr: 'max by (company_id, company) (paperclip_recovery_rate_percent) and on (company_id, company) max by (company_id, company) (paperclip_recovery_breached) == 1'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Paperclip recovery rate in {{`{{ $labels.company }}`}} is {{`{{ $value }}`}} % this week'
                      description: 'Paperclip reports its recovery-observability threshold (paperclip_recovery_threshold_percent) breached for the current week. docs/runbooks/paperclip-agents.md.'
                  - alert: PaperclipPhantomAgentStuck
                    expr: 'max by (company_id, company) (paperclip_agents_phantom_running) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{`{{ $value }}`}} agents in {{`{{ $labels.company }}`}} report running without a live run'
                      description: 'Agents stuck in status running with no queued or running heartbeat run for 15m. docs/runbooks/paperclip-agents.md.'
                  # Three or more agents stuck at once is the signature of a
                  # batch sandbox drop, and with no live run left there is no
                  # agent able to clear it: every repair lever needs a board
                  # account. That is a stalled board, not one stuck agent.
                  - alert: PaperclipPhantomAgentStuck
                    expr: 'max by (company_id, company) (paperclip_agents_phantom_running) >= 3 and on (company_id, company) max by (company_id, company) (paperclip_agent_runs_live) == 0'
                    for: 30m
                    labels:
                      severity: critical
                    annotations:
                      summary: '{{`{{ $labels.company }}`}} has {{`{{ $value }}`}} phantom agents and no live run: the board is stalled'
                      description: 'No agent has a queued or running run while at least three report running, so no queued wake can dispatch and nothing self-heals. Clear the agent status from the board; docs/runbooks/paperclip-agents.md.'
          # JetStream work queue (docs/runbooks/pf-work-age-expiry.md). PF_WORK
          # age expiry deletes unacked work with no advisory and no per-message
          # signal of any kind, so these rules are the only thing standing
          # between a consumer outage and silent data loss (ADR-038, ADR-030).
          # The SLI is the head of the stream, not its depth: a queue full of
          # work nobody takes and a busy queue have the same depth, and
          # prometheus-nats-exporter exports no message age at all - pinned
          # against 0.18.0 (the nats chart pin) and against its main branch,
          # neither of which has a state.first_ts metric. Every window is
          # therefore derived from nats_stream_first_seq, which only moves when
          # a message leaves the head. No series exists until the NATS
          # Application ships an exporter with -jsz=all, and the rules are
          # silent (not firing, not absent) until then.
          homelab-nats-jetstream:
            groups:
              - name: homelab-nats-jetstream
                rules:
                  - alert: PFWorkOldestUnackedAging
                    expr: 'changes(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[12h]) == 0 and min_over_time(nats_stream_total_messages{stream_name="PF_WORK",is_stream_leader="true"}[5m]) > 0 and min_over_time(nats_stream_total_messages{stream_name="PF_WORK",is_stream_leader="true"}[12h]) > 0 and count_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[12h]) >= 11 * count_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[1h])'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'The oldest unacked PF_WORK message has been queued for more than 12h'
                      description: 'nats_stream_first_seq has not moved for 12h while the stream was never empty, so the head message is at least 12h old and PF_WORK max_age is 24h. Age expiry deletes it with no advisory and no per-message signal. docs/runbooks/pf-work-age-expiry.md.'
                  - alert: PFWorkOldestUnackedAging
                    expr: 'changes(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[18h]) == 0 and min_over_time(nats_stream_total_messages{stream_name="PF_WORK",is_stream_leader="true"}[5m]) > 0 and min_over_time(nats_stream_total_messages{stream_name="PF_WORK",is_stream_leader="true"}[18h]) > 0 and count_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[18h]) >= 16 * count_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[1h])'
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'PF_WORK work is 18h old and max_age deletes it silently in under 6h'
                      description: 'The head of PF_WORK has been unacked for 18h of its 24h max_age. When the budget runs out the messages are deleted with no advisory of any kind. Get a consumer taking work, or copy the queue out now. docs/runbooks/pf-work-age-expiry.md.'
                  - alert: PFWorkMessagesExpiredUnacked
                    expr: '(max by (stream_name) (max_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[15m])) - max by (stream_name) (min_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[15m]))) - (sum by (stream_name) (max_over_time(nats_consumer_ack_floor_stream_seq{stream_name="PF_WORK",is_consumer_leader="true"}[15m]) - min_over_time(nats_consumer_ack_floor_stream_seq{stream_name="PF_WORK",is_consumer_leader="true"}[15m])) or (max by (stream_name) (max_over_time(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}[15m])) * 0)) > 0'
                    labels:
                      severity: critical
                    annotations:
                      summary: '{{`{{ $value }}`}} PF_WORK messages left the stream without being acked'
                      description: 'The stream head advanced further than every consumer ack floor did, so that many durable requests were removed unacked: max_age expiry, a purge or a delete. Nothing else reports this - there is no advisory for age-based deletion. docs/runbooks/pf-work-age-expiry.md.'
                  - alert: PFWorkStreamMetricsAbsent
                    expr: 'absent(nats_stream_first_seq{stream_name="PF_WORK",is_stream_leader="true"}) and on (stream_name) max by (stream_name) (count_over_time(nats_stream_first_seq{stream_name="PF_WORK"}[6h])) > 0'
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'PF_WORK stream metrics stopped arriving, so the silent-loss monitor is blind'
                      description: 'prometheus-nats-exporter reported PF_WORK within the last 6h and no longer does. While this is firing nothing watches the 24h age budget. Check the exporter sidecar and its -jsz=all argument. docs/runbooks/pf-work-age-expiry.md.'
          {{- if (index .Values "github-pr-exporter" "enabled") }}
          # Pull requests that need review (docs/runbooks/alerting.md). Metrics:
          # the github-pr-exporter Application, one series per PR and query.
          homelab-github:
            groups:
              - name: homelab-github
                rules:
                  - alert: GitHubPullRequestNeedsReview
                    expr: 'max by (repo, number, title, url, author) (label_replace(github_search_pull_request{job="github-pr-exporter"}, "repo", "$1", "url", "https://github.com/([^/]+/[^/]+)/pull/[0-9]+"))'
                    for: 5m
                    labels:
                      severity: info
                    annotations:
                      summary: '{{`{{ $labels.repo }}`}}#{{`{{ $labels.number }}`}} needs your review'
                      title: '{{`{{ $labels.title }}`}}'
                      author: '{{`{{ $labels.author }}`}}'
                      url: '{{`{{ $labels.url }}`}}'
                  - alert: GitHubPullRequestExporterFailing
                    expr: 'max by (query) (up{job="github-pr-exporter"}) == 0 or absent(up{job="github-pr-exporter"})'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'The GitHub pull request exporter cannot query GitHub{{`{{ with $labels.query }}`}} ({{`{{ . }}`}}){{`{{ end }}`}}'
                      description: 'Pull request review alerts are blind. The probe body names the HTTP status: 401 means the github-pr-alerts token is missing, expired or revoked, 403 a rate limit. docs/runbooks/alerting.md.'
          {{- end }}
          {{- if .Values.istio.enabled }}
          # Service mesh (docs/service-mesh.md). Metrics: charts/istio-config
          # monitors and kube-state-metrics. ztunnel and istio-cni must run on
          # every node or enrolled pods there lose their traffic.
          homelab-service-mesh:
            groups:
              - name: homelab-service-mesh
                rules:
                  - alert: HomelabIstiodDown
                    expr: 'absent(up{app="istiod"} == 1)'
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'istiod is not running'
                      description: 'No istiod instance has answered the metrics scrape for 10m. Running workloads keep their last configuration, but new pods, certificates and policy changes wait for it. `kubectl -n {{ .Values.istio.namespace }} get pods -l app=istiod`.'
                  - alert: HomelabMeshNodeAgentNotReady
                    expr: 'kube_daemonset_status_number_ready{namespace="{{ .Values.istio.namespace }}",daemonset=~"ztunnel|istio-cni-node"} < kube_daemonset_status_desired_number_scheduled{namespace="{{ .Values.istio.namespace }}",daemonset=~"ztunnel|istio-cni-node"}'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: '{{`{{ $labels.daemonset }}`}} is not ready on every node'
                      description: '{{`{{ $labels.daemonset }}`}} has fewer ready pods than nodes for 15m. Pods of enrolled namespaces on the affected node cannot send or receive traffic. `kubectl -n {{ .Values.istio.namespace }} get pods -o wide`.'
                  - alert: HomelabIstioXdsRejects
                    expr: 'sum(rate(pilot_total_xds_rejects[5m])) > 0'
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Proxies reject the configuration istiod sends'
                      description: 'ztunnel or a waypoint has rejected xDS configuration for 15m, so it keeps running on stale config. `istioctl proxy-status` and the istiod logs name the resource.'
          {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "kube-prometheus-stack" "namespace" }}

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    # Use jqPathExpressions to handle multiple webhooks (more robust than jsonPointers)
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
{{- include "homelab.smokeJob" (dict "name" "grafana" "namespace" (index .Values "kube-prometheus-stack" "namespace") "smoke" (index .Values "kube-prometheus-stack" "smoke" "grafana") "wave" "9" "image" .Values.global.images.curl) }}
{{- include "homelab.smokeJob" (dict "name" "prometheus" "namespace" (index .Values "kube-prometheus-stack" "namespace") "smoke" (index .Values "kube-prometheus-stack" "smoke" "prometheus") "wave" "9" "image" .Values.global.images.curl) }}
{{- end }}
