{{- if index .Values "cert-manager" "enabled" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Sync wave 0: cert-manager must deploy before ClusterIssuer (wave 1) and other resources needing TLS
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "cert-manager" "chart" "repo" }}
    chart: {{ index .Values "cert-manager" "chart" "name" }}
    targetRevision: {{ index .Values "cert-manager" "chart" "version" }}
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: {{ index .Values "cert-manager" "installCRDs" }}
        global:
          leaderElection:
            namespace: {{ index .Values "cert-manager" "namespace" }}
        {{- if index .Values "cert-manager" "dns01RecursiveNameservers" }}
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers={{ join "," (index .Values "cert-manager" "dns01RecursiveNameservers") }}
        {{- end }}
        resources:
          {{- toYaml (index .Values "cert-manager" "resources") | nindent 10 }}
        webhook:
          resources:
            {{- toYaml (index .Values "cert-manager" "webhook" "resources") | nindent 12 }}
        cainjector:
          resources:
            {{- toYaml (index .Values "cert-manager" "cainjector" "resources") | nindent 12 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "cert-manager" "namespace" }}

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
---
# Config Application: deploys the OnePasswordItem for the Cloudflare API token.
# The OnePasswordItem CRD comes from 1password-operator in the bootstrap
# parent, which syncs in an earlier parent wave.
#
# Wave -1 puts this first inside addons. Wave ordering only sequences the
# apply, not the result: the 1Password operator creates the Secret
# asynchronously afterwards, so the ClusterIssuer at wave 1 can still be
# briefly unready. What -1 does guarantee is that the OnePasswordItem is never
# applied after its consumer, and that it does not share a wave with
# cert-manager, which would leave the ordering of the two up to ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/cert-manager-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# ClusterIssuer Application: deploys after cert-manager installs CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-cluster-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/cert-manager-cluster-issuer
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # Derived values (domain, ACME e-mail, DNS zones) come from this parent's
      # cert-manager values (configuration/ via the CMP in homelab) so the
      # child's committed values files stay PII-free. valuesObject overrides
      # valueFiles in ArgoCD.
      valuesObject:
        global:
          domain: {{ .Values.global.domain }}
        # Self-signed issuer under the same name where there is no public
        # domain (CERT_ISSUER=selfsigned).
        selfSigned:
          enabled: {{ index .Values "cert-manager" "selfSigned" | default false }}
        letsencrypt:
          server: {{ index .Values "cert-manager" "letsencrypt" "server" }}
          email: {{ index .Values "cert-manager" "letsencrypt" "email" }}
          {{- with (index .Values "cert-manager" "dnsZones") }}
          dnsZones:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          dnsZones: []
          {{- end }}
        cloudflare:
          email: {{ index .Values "cert-manager" "cloudflare" "email" }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
