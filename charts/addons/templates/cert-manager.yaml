{{- if index .Values "cert-manager" "enabled" }}
{{- if (index .Values "cert-manager" "cloudflare" "enabled") }}
---
# OnePasswordItem syncs the Cloudflare API token from 1Password vault
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ index .Values "cert-manager" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ index .Values "cert-manager" "cloudflare" "onePasswordItemPath" | quote }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "cert-manager" "chart" "repo" }}
    chart: {{ index .Values "cert-manager" "chart" "name" }}
    targetRevision: {{ index .Values "cert-manager" "chart" "version" }}
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: {{ index .Values "cert-manager" "installCRDs" }}
        global:
          leaderElection:
            namespace: {{ index .Values "cert-manager" "namespace" }}
        resources:
          {{- toYaml (index .Values "cert-manager" "resources") | nindent 10 }}
        webhook:
          resources:
            {{- toYaml (index .Values "cert-manager" "webhook" "resources") | nindent 12 }}
        cainjector:
          resources:
            {{- toYaml (index .Values "cert-manager" "cainjector" "resources") | nindent 12 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "cert-manager" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 0

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle

{{- if (index .Values "cert-manager" "letsencrypt" "enabled") }}
---
# Let's Encrypt ClusterIssuer with Cloudflare DNS-01 challenge
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  acme:
    server: {{ index .Values "cert-manager" "letsencrypt" "server" }}
    email: {{ index .Values "cert-manager" "letsencrypt" "email" }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    {{- if (index .Values "cert-manager" "cloudflare" "enabled") }}
    - dns01:
        cloudflare:
          email: {{ index .Values "cert-manager" "cloudflare" "email" }}
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api_token
    {{- else }}
    - http01:
        ingress:
          class: traefik
    {{- end }}
{{- end }}
{{- end }}
