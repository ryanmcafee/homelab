{{- if index .Values "cert-manager" "enabled" }}
# NOTE: OnePasswordItem and ClusterIssuer are now in addons-resources chart
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Sync wave 0: cert-manager must deploy before ClusterIssuer (wave 1) and other resources needing TLS
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "cert-manager" "chart" "repo" }}
    chart: {{ index .Values "cert-manager" "chart" "name" }}
    targetRevision: {{ index .Values "cert-manager" "chart" "version" }}
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: {{ index .Values "cert-manager" "installCRDs" }}
        global:
          leaderElection:
            namespace: {{ index .Values "cert-manager" "namespace" }}
        {{- if index .Values "cert-manager" "dns01RecursiveNameservers" }}
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers={{ join "," (index .Values "cert-manager" "dns01RecursiveNameservers") }}
        {{- end }}
        resources:
          {{- toYaml (index .Values "cert-manager" "resources") | nindent 10 }}
        webhook:
          resources:
            {{- toYaml (index .Values "cert-manager" "webhook" "resources") | nindent 12 }}
        cainjector:
          resources:
            {{- toYaml (index .Values "cert-manager" "cainjector" "resources") | nindent 12 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "cert-manager" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in webhook configurations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
---
# Config Application: deploys OnePasswordItem for Cloudflare API token before cert-manager
# Note: Also contains ClusterIssuer which requires cert-manager CRDs - will retry until available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/cert-manager-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
