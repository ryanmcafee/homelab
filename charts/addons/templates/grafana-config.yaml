{{- if (index .Values "kube-prometheus-stack").enabled }}
---
# Grafana Config: static PV+PVC for Grafana, and the alert source redirect into Grafana
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/grafana-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
      # The iSCSI portal comes from this parent's global values (configuration/
      # via the CMP in homelab) so the child's committed values stay PII-free.
      valuesObject:
        iscsi:
          portal: {{ .Values.global.iscsi.portal | quote }}
        alertSource:
          ingressClassName: {{ (index .Values "kube-prometheus-stack" "grafana" "ingress" "ingressClassName") | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ (index .Values "kube-prometheus-stack").namespace }}
  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
