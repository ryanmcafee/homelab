{{- if index .Values "external-dns-unifi" "enabled" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "external-dns-unifi" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
# NOTE: OnePasswordItem is now in addons-resources chart
---
# Additional RBAC for CRD source (helm chart doesn't generate this correctly)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-unifi-crd-dnsendpoints
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-unifi-crd-dnsendpoints
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-unifi-crd-dnsendpoints
subjects:
  - kind: ServiceAccount
    name: external-dns-unifi-crd
    namespace: {{ index .Values "external-dns-unifi" "namespace" }}
---
# Instance 1: CRD source for DNSEndpoint resources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: {{ index .Values "external-dns-unifi" "chart" "version" }}
    helm:
      releaseName: external-dns-unifi-crd
      values: |
        fullnameOverride: external-dns-unifi-crd

        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/kashalls/external-dns-unifi-webhook
              tag: {{ index .Values "external-dns-unifi" "webhook" "version" }}
            env:
              - name: UNIFI_HOST
                value: {{ index .Values "external-dns-unifi" "unifi" "host" | quote }}
              - name: UNIFI_EXTERNAL_CONTROLLER
                value: "false"
              - name: UNIFI_SKIP_TLS_VERIFY
                value: "true"
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: unifi-api-credentials
                    key: api_key
              - name: LOG_LEVEL
                value: "info"
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5

        sources:
          - crd

        extraArgs:
          - --txt-owner-id=homelab-unifi-crd

        domainFilters:
          {{- range (index .Values "external-dns-unifi" "domainFilters") }}
          - {{ . }}
          {{- end }}

        policy: sync
        registry: txt

        resources:
          {{- toYaml (index .Values "external-dns-unifi" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "external-dns-unifi" "namespace" }}

  syncPolicy:
    # Automatic sync disabled - manual sync only
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 0
---
# Instance 2: Ingress/Service sources with annotation filter
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: {{ index .Values "external-dns-unifi" "chart" "version" }}
    helm:
      releaseName: external-dns-unifi-ingress
      values: |
        fullnameOverride: external-dns-unifi-ingress

        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/kashalls/external-dns-unifi-webhook
              tag: {{ index .Values "external-dns-unifi" "webhook" "version" }}
            env:
              - name: UNIFI_HOST
                value: {{ index .Values "external-dns-unifi" "unifi" "host" | quote }}
              - name: UNIFI_EXTERNAL_CONTROLLER
                value: "false"
              - name: UNIFI_SKIP_TLS_VERIFY
                value: "true"
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: unifi-api-credentials
                    key: api_key
              - name: LOG_LEVEL
                value: "info"
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5

        sources:
          - ingress
          - service

        extraArgs:
          - --annotation-filter=external-dns.alpha.kubernetes.io/hostname
          - --txt-owner-id=homelab-unifi-ingress

        domainFilters:
          {{- range (index .Values "external-dns-unifi" "domainFilters") }}
          - {{ . }}
          {{- end }}

        policy: sync
        registry: txt

        resources:
          {{- toYaml (index .Values "external-dns-unifi" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "external-dns-unifi" "namespace" }}

  syncPolicy:
    # Automatic sync disabled - manual sync only
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 0
{{- end }}
