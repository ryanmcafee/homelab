{{- if index .Values "external-dns-unifi" "enabled" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "external-dns-unifi" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
---
# OnePasswordItem for UniFi API credentials
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: unifi-api-credentials
  namespace: {{ index .Values "external-dns-unifi" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ index .Values "external-dns-unifi" "onePasswordItemPath" | quote }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: {{ index .Values "external-dns-unifi" "chart" "version" }}
    helm:
      releaseName: external-dns-unifi
      values: |
        fullnameOverride: external-dns-unifi

        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/kashalls/external-dns-unifi-webhook
              tag: {{ index .Values "external-dns-unifi" "webhook" "version" }}
            env:
              - name: UNIFI_HOST
                value: {{ index .Values "external-dns-unifi" "unifi" "host" | quote }}
              - name: UNIFI_EXTERNAL_CONTROLLER
                value: "false"
              - name: UNIFI_SKIP_TLS_VERIFY
                value: "true"
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: unifi-api-credentials
                    key: api_key
              - name: LOG_LEVEL
                value: "debug"
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 10
              timeoutSeconds: 5

        extraArgs:
          - --source=ingress
          - --source=service
          - --annotation-filter=external-dns.alpha.kubernetes.io/hostname
          - --txt-owner-id=homelab-unifi-v2

        domainFilters:
          {{- range (index .Values "external-dns-unifi" "domainFilters") }}
          - {{ . }}
          {{- end }}

        policy: sync
        registry: txt

        resources:
          {{- toYaml (index .Values "external-dns-unifi" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "external-dns-unifi" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 0
{{- end }}
