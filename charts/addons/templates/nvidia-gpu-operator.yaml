{{- if index .Values "nvidia-gpu-operator" "enabled" }}
---
# Namespace for GPU operator components
# Requires privileged PodSecurity for GPU device plugin and driver containers
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "nvidia-gpu-operator" "namespace" }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # Wave 10: After kube-prometheus-stack (wave 9)
    argocd.argoproj.io/sync-wave: "10"
---
# Talos GPU Validation Bypass DaemonSet
# Creates validation files that the GPU device plugin waits for
# Required because validator is disabled on Talos (driver/toolkit are pre-installed via system extensions)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-validation-bypass
  namespace: {{ index .Values "nvidia-gpu-operator" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: nvidia-validation-bypass
    app.kubernetes.io/component: validation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-validation-bypass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-validation-bypass
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: validation-bypass
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Continuously maintain validation ready files for Talos GPU nodes
              # The operator validator deletes driver-ready during its validation loop,
              # so we must recreate it continuously rather than just once
              mkdir -p /run/nvidia/validations
              while true; do
                touch /run/nvidia/validations/driver-ready
                touch /run/nvidia/validations/toolkit-ready
                touch /run/nvidia/validations/cuda-ready
                touch /run/nvidia/validations/plugin-ready
                sleep 5
              done
          volumeMounts:
            - name: run-nvidia
              mountPath: /run/nvidia
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      volumes:
        - name: run-nvidia
          hostPath:
            path: /run/nvidia
            type: DirectoryOrCreate
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-gpu-operator
  namespace: argocd
  annotations:
    # Wave 10: After kube-prometheus-stack (wave 9) for DCGM metrics integration
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    targetRevision: {{ index .Values "nvidia-gpu-operator" "chart" "version" }}
    helm:
      releaseName: nvidia-gpu-operator
      values: |
        # Talos Linux configuration
        # Driver and toolkit are provided by Talos system extensions (nonfree-kmod-nvidia, nvidia-container-toolkit)
        # GPU Operator only manages device plugin and monitoring components
        #
        # NOTE: The operator's validator CRD doesn't support an 'enabled' field,
        # so the validator DaemonSet runs regardless of Helm settings. The
        # validation-bypass DaemonSet continuously recreates the driver-ready
        # file that the validator deletes during its failed validation loop.

        driver:
          enabled: false
        toolkit:
          enabled: false

        # Device plugin advertises GPUs to Kubernetes scheduler
        devicePlugin:
          enabled: true

        # DCGM Exporter for GPU metrics (Prometheus/Grafana)
        dcgmExporter:
          enabled: true

        # GPU Feature Discovery - labels nodes with GPU properties
        gfd:
          enabled: true

        # MIG Manager - disabled (not using Multi-Instance GPU)
        migManager:
          enabled: false

        # Node status exporter
        nodeStatusExporter:
          enabled: true

        # Node Feature Discovery - detects GPU hardware
        nfd:
          enabled: true

        # Validator - disabled on Talos (using validation-bypass DaemonSet instead)
        # The validator has mount issues on Talos and is not needed since
        # driver/toolkit are pre-installed via system extensions
        validator:
          enabled: false

        # CDI mode disabled - Talos system extensions install drivers at host root,
        # not /run/nvidia/driver where CDI spec generation expects them.
        # Uses legacy envvar strategy instead.
        cdi:
          enabled: false
          default: false

        # Talos-specific: Tell operator that driver/toolkit are pre-installed
        operator:
          defaultRuntime: containerd

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "nvidia-gpu-operator" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    # ClusterPolicy: the GPU operator controller fills in many defaults
    # (image versions, env vars, sub-component configs) that differ from
    # what the Helm chart renders. Ignore all spec differences to prevent
    # infinite sync loops. The validation-bypass DaemonSet handles the
    # Talos driver validation issue independently.
    - group: nvidia.com
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec
{{- end }}
