{{- if index .Values "unifi-port-forward" "enabled" }}
{{- $namespace := index .Values "unifi-port-forward" "namespace" }}
{{- $rulePrefix := index .Values "unifi-port-forward" "rulePrefix" | default "kube-" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
# NOTE: OnePasswordItem is now in addons-resources chart
---
{{- $portForwardValues := index .Values "unifi-port-forward" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: port-forwarding-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    addons.ryanmcafee.com/config-hash: {{ include "addons.configHash" (dict "values" $portForwardValues) | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ryanmcafee.github.io/port-forwarding-controller
    chart: port-forwarding
    targetRevision: {{ index .Values "unifi-port-forward" "version" }}
    helm:
      releaseName: port-forwarding-controller
      values: |
        router:
          existingSecret: unifi-credentials
          secretKeys:
            url: api_url
            username: username
            password: password
            apiKey: api_key
          rule_prefix: {{ $rulePrefix }}
          skipTlsVerification: true
          deviceType: "udm"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $namespace }}
  syncPolicy:
    # Automatic sync disabled - manual sync only
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - Replace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
