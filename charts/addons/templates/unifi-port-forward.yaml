{{- if index .Values "unifi-port-forward" "enabled" }}
{{- $namespace := index .Values "unifi-port-forward" "namespace" }}
{{- $rulePrefix := index .Values "unifi-port-forward" "rulePrefix" | default "kube-" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
---
{{- $portForwardValues := index .Values "unifi-port-forward" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: port-forwarding-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    addons.ryanmcafee.com/config-hash: {{ include "addons.configHash" (dict "values" $portForwardValues) | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ryanmcafee.github.io/port-forwarding-controller
    chart: port-forwarding
    targetRevision: {{ index .Values "unifi-port-forward" "version" }}
    helm:
      releaseName: port-forwarding-controller
      values: |
        router:
          existingSecret: unifi-credentials
          secretKeys:
            url: api_url
            username: username
            password: password
            apiKey: api_key
          rule_prefix: {{ $rulePrefix }}
          skipTlsVerification: true
          deviceType: "udm"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - Replace=true
---
# Config Application: deploys OnePasswordItem for UniFi credentials before port-forwarding-controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: port-forwarding-controller-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/port-forwarding-controller-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: port-forwarding
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
