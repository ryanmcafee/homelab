{{- if index .Values "unifi-port-forward" "enabled" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "unifi-port-forward" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
---
# OnePasswordItem for UniFi credentials
# Required 1Password item fields: ROUTER_URL, ROUTER_USERNAME, ROUTER_PASSWORD, ROUTER_RULE_PREFIX
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: port-forwarding-controller
  namespace: {{ index .Values "unifi-port-forward" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ index .Values "unifi-port-forward" "onePasswordItemPath" | quote }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: port-forwarding-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ryanmcafee.github.io/port-forwarding-controller
    chart: port-forwarding
    targetRevision: {{ index .Values "unifi-port-forward" "version" }}
    helm:
      releaseName: port-forwarding-controller
      values: |
        router:
          createSecret: false
          rule_prefix: kube-
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "unifi-port-forward" "namespace" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
