{{- if .Values.cilium.enabled }}
---
# Cilium CNI - Adopted, never installed, by ArgoCD
#
# homelab: Talos installs Cilium from inline manifests rendered with the same
# values (task render). Kind: scripts/localdev-kind.ts installs it with
# `helm upgrade --install` from charts/addons/values-localdev.yaml
# cilium.values before ArgoCD exists. In both cases this Application adopts
# the release: the values below are the ones the installer used (identical
# values → no diff), automated.prune is false and the Application carries no
# resources-finalizer (see the app-automated / app-finalizer exemption).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    homelab.ryanmcafee.com/policy-exempt: "app-automated,app-finalizer"
    homelab.ryanmcafee.com/policy-exempt-reason: "Cilium CNI is installed outside ArgoCD (Talos inline manifests in homelab, scripts/localdev-kind.ts in Kind). This Application only adopts it: it must not prune/self-heal resources the installer manages directly (app-automated), and it must NOT carry resources-finalizer.argocd.argoproj.io (app-finalizer) — deleting this Application must never cascade-delete the running CNI."
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: {{ .Values.cilium.chart.version }}
    helm:
      releaseName: cilium
      # Values must match what installed the release for an accurate diff
      # (cilium.values in the environment values file).
      values: |
        {{- toYaml .Values.cilium.values | nindent 8 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: false  # Don't prune - the installer manages some resources
      selfHeal: true
    {{- end }}
    syncOptions:
      - ServerSideApply=true
      - Validate=false
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

  # Ignore all differences since we're just tracking, not managing
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    # Ignore auto-generated TLS secrets managed by Cilium (cilium-ca, hubble-*-certs).
    # No `group: ""` for core kinds: the API server drops the empty string, so
    # the live Application never matched the rendered one and the addons parent
    # stayed OutOfSync (bugs.md 2026-09-14).
    - kind: Secret
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels
{{- end }}
