{{- if .Values.traefik.enabled }}
---
# Namespace for Traefik ingress controller
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- if .Values.traefik.cloudflare.enabled }}
---
# OnePasswordItem syncs the Cloudflare API token from 1Password vault
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ .Values.traefik.cloudflare.onePasswordItemPath | quote }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    # Sync wave 2: After cert-manager (wave 0) and ClusterIssuer (wave 1) are ready
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.traefik.chart.repo }}
    chart: {{ .Values.traefik.chart.name }}
    targetRevision: {{ .Values.traefik.chart.version }}
    helm:
      releaseName: traefik
      values: |
        deployment:
          replicas: {{ .Values.traefik.deployment.replicas }}

        service:
          type: {{ .Values.traefik.service.type }}
          {{- if .Values.traefik.service.annotations }}
          annotations:
            {{- toYaml .Values.traefik.service.annotations | nindent 12 }}
          {{- end }}

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true

        ports:
          web:
            port: {{ .Values.traefik.ports.web.port }}
            expose:
              default: {{ .Values.traefik.ports.web.expose.default }}
            {{- if .Values.traefik.ports.web.redirectTo }}
            redirectTo:
              port: {{ .Values.traefik.ports.web.redirectTo.port }}
            {{- end }}
          websecure:
            port: {{ .Values.traefik.ports.websecure.port }}
            expose:
              default: {{ .Values.traefik.ports.websecure.expose.default }}
            tls:
              enabled: {{ .Values.traefik.ports.websecure.tls.enabled }}
          {{- if .Values.traefik.ports.traefik }}
          traefik:
            port: {{ .Values.traefik.ports.traefik.port }}
            expose:
              default: {{ .Values.traefik.ports.traefik.expose.default }}
          {{- end }}

        globalArguments:
          {{- range .Values.traefik.globalArguments }}
          - {{ . }}
          {{- end }}

        {{- if .Values.traefik.additionalArguments }}
        additionalArguments:
          {{- range .Values.traefik.additionalArguments }}
          - {{ . }}
          {{- end }}
        {{- else }}
        additionalArguments: []
        {{- end }}

        {{- if .Values.traefik.experimental }}
        experimental:
          {{- if .Values.traefik.experimental.plugins }}
          plugins:
            {{- range $name, $plugin := .Values.traefik.experimental.plugins }}
            {{ $name }}:
              moduleName: {{ $plugin.moduleName }}
              version: {{ $plugin.version }}
            {{- end }}
          {{- end }}
        {{- end }}

        env:
          {{- toYaml .Values.traefik.env | nindent 10 }}

        {{- if .Values.traefik.volumes }}
        volumes:
          {{- toYaml .Values.traefik.volumes | nindent 10 }}
        {{- end }}

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: {{ .Values.traefik.persistence.enabled }}
          {{- if .Values.traefik.persistence.enabled }}
          storageClass: {{ .Values.traefik.persistence.storageClass }}
          size: {{ .Values.traefik.persistence.size }}
          {{- end }}

        ingressRoute:
          dashboard:
            enabled: {{ .Values.traefik.ingressRoute.dashboard.enabled }}
            {{- if .Values.traefik.ingressRoute.dashboard.enabled }}
            matchRule: {{ .Values.traefik.ingressRoute.dashboard.matchRule }}
            entryPoints:
              {{- toYaml .Values.traefik.ingressRoute.dashboard.entryPoints | nindent 14 }}
            {{- if .Values.traefik.ingressRoute.dashboard.tls }}
            tls:
              secretName: {{ .Values.traefik.ingressRoute.dashboard.tls.secretName }}
            {{- end }}
            {{- end }}

        resources:
          {{- toYaml .Values.traefik.resources | nindent 10 }}

        {{- if .Values.traefik.autoscaling.enabled }}
        autoscaling:
          enabled: true
          minReplicas: {{ .Values.traefik.autoscaling.minReplicas }}
          maxReplicas: {{ .Values.traefik.autoscaling.maxReplicas }}
          metrics:
            {{- toYaml .Values.traefik.autoscaling.metrics | nindent 12 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.traefik.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 0

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
---
# DNSEndpoint for external-dns to create DNS record for Traefik dashboard
# (Standard Ingress removed - was conflicting with IngressRoute from Traefik helm chart)
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: traefik-dashboard
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  endpoints:
    - dnsName: traefik.{{ .Values.global.domain }}
      recordType: A
      targets:
        - {{ (index (.Values.traefik.service.annotations | default dict) "io.cilium/lb-ipam-ips") | default "172.16.100.200" | quote }}
---
# Middleware to add trailing slash for dashboard
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect-slash
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
---
# IngressRoute to catch /dashboard without trailing slash and redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-redirect
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.{{ .Values.global.domain }}`) && Path(`/dashboard`)
      middlewares:
        - name: dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-dashboard-tls
---
# Certificate for Traefik dashboard TLS (IngressRoute doesn't auto-create)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - traefik.{{ .Values.global.domain }}
{{- if and .Values.traefik.oidc .Values.traefik.oidc.enabled }}
---
# OnePasswordItem for Google OAuth credentials (for OIDC plugin)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: google-oauth-credentials
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  itemPath: {{ .Values.traefik.oidc.googleOAuthPath | quote }}
---
# OnePasswordItem for OIDC session encryption key
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-session-key
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  itemPath: {{ .Values.traefik.oidc.sessionEncryptionKeyPath | quote }}
---
# OIDC Authentication Middleware (replaces oauth2-proxy)
# This middleware handles Google OIDC authentication with automatic redirects
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  plugin:
    traefikoidc:
      ProviderURL: {{ .Values.traefik.oidc.providerURL | quote }}
      ClientID: "urn:k8s:secret:google-oauth-credentials:client_id"
      ClientSecret: "urn:k8s:secret:google-oauth-credentials:client_secret"
      CallbackURL: {{ .Values.traefik.oidc.callbackURL | quote }}
      LogoutURL: {{ .Values.traefik.oidc.logoutURL | quote }}
      SessionEncryptionKey: "urn:k8s:secret:oidc-session-key:oidc-session-key"
      Scopes:
        {{- toYaml .Values.traefik.oidc.scopes | nindent 8 }}
      AllowedUserDomains:
        {{- toYaml .Values.traefik.oidc.allowedDomains | nindent 8 }}
      LogLevel: "info"
      ForceHTTPS: true
---
# Certificate for auth domain (OIDC callback endpoint)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  secretName: auth-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - auth.{{ .Values.global.domain }}
---
# DNSEndpoint for auth domain
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: auth-dns
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  endpoints:
    - dnsName: auth.{{ .Values.global.domain }}
      recordType: A
      targets:
        - {{ (index (.Values.traefik.service.annotations | default dict) "io.cilium/lb-ipam-ips") | default "172.16.100.200" | quote }}
---
# IngressRoute for auth domain - handles OIDC callbacks
# The oidc-auth middleware intercepts /oauth2/* paths for authentication
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-oidc
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.{{ .Values.global.domain }}`)
      kind: Rule
      middlewares:
        - name: oidc-auth
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: auth-tls
{{- end }}
{{- end }}
