{{- if .Values.traefik.enabled }}
---
# Namespace for Traefik ingress controller
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Dependencies Application: deploys secrets and OnePasswordItems before traefik
# Wave 5: After external-dns (wave 4) so OnePasswordItem CRDs are available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/traefik-dependencies
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    # Sync wave 6: After traefik-dependencies (wave 5) creates secrets
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.traefik.chart.repo }}
    chart: {{ .Values.traefik.chart.name }}
    targetRevision: {{ .Values.traefik.chart.version }}
    helm:
      releaseName: traefik
      values: |
        deployment:
          replicas: {{ .Values.traefik.deployment.replicas }}

        service:
          type: {{ .Values.traefik.service.type }}
          {{- if .Values.traefik.service.annotations }}
          annotations:
            {{- toYaml .Values.traefik.service.annotations | nindent 12 }}
          {{- end }}

        # Update Ingress status with LoadBalancer IP so ArgoCD sees them as healthy
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
          # Enable cross-namespace references for middlewares
          kubernetesCRD:
            allowCrossNamespace: true

        ports:
          web:
            port: {{ .Values.traefik.ports.web.port }}
            exposedPort: {{ .Values.traefik.ports.web.exposedPort | default 80 }}
            expose:
              default: {{ .Values.traefik.ports.web.expose.default }}
            {{- if .Values.traefik.ports.web.http }}
            http:
              {{- if .Values.traefik.ports.web.http.redirections }}
              redirections:
                entryPoint:
                  to: {{ .Values.traefik.ports.web.http.redirections.entryPoint.to }}
                  scheme: {{ .Values.traefik.ports.web.http.redirections.entryPoint.scheme }}
                  permanent: {{ .Values.traefik.ports.web.http.redirections.entryPoint.permanent }}
              {{- end }}
            {{- end }}
          websecure:
            port: {{ .Values.traefik.ports.websecure.port }}
            exposedPort: {{ .Values.traefik.ports.websecure.exposedPort | default 443 }}
            expose:
              default: {{ .Values.traefik.ports.websecure.expose.default }}
            {{- if .Values.traefik.ports.websecure.asDefault }}
            asDefault: {{ .Values.traefik.ports.websecure.asDefault }}
            {{- end }}
            {{- if .Values.traefik.ports.websecure.http }}
            http:
              tls:
                enabled: {{ .Values.traefik.ports.websecure.http.tls.enabled }}
            {{- end }}
          {{- if .Values.traefik.ports.traefik }}
          traefik:
            port: {{ .Values.traefik.ports.traefik.port }}
            expose:
              default: {{ .Values.traefik.ports.traefik.expose.default }}
          {{- end }}

        {{- if .Values.traefik.additionalArguments }}
        additionalArguments:
          {{- range .Values.traefik.additionalArguments }}
          - {{ . }}
          {{- end }}
        {{- else }}
        additionalArguments: []
        {{- end }}

        {{- if .Values.traefik.experimental }}
        experimental:
          {{- if .Values.traefik.experimental.plugins }}
          plugins:
            {{- range $name, $plugin := .Values.traefik.experimental.plugins }}
            {{ $name }}:
              moduleName: {{ $plugin.moduleName }}
              version: {{ $plugin.version }}
            {{- end }}
          {{- end }}
        {{- end }}

        env:
          {{- toYaml .Values.traefik.env | nindent 10 }}

        {{- if .Values.traefik.volumes }}
        volumes:
          {{- toYaml .Values.traefik.volumes | nindent 10 }}
        {{- end }}

        # Disable ACME certificate resolvers (using cert-manager instead for HA)
        certificatesResolvers: {}

        persistence:
          enabled: {{ .Values.traefik.persistence.enabled }}
          {{- if .Values.traefik.persistence.enabled }}
          storageClass: {{ .Values.traefik.persistence.storageClass }}
          size: {{ .Values.traefik.persistence.size }}
          {{- end }}

        ingressRoute:
          dashboard:
            enabled: {{ .Values.traefik.ingressRoute.dashboard.enabled }}
            {{- if .Values.traefik.ingressRoute.dashboard.enabled }}
            matchRule: {{ .Values.traefik.ingressRoute.dashboard.matchRule }}
            entryPoints:
              {{- toYaml .Values.traefik.ingressRoute.dashboard.entryPoints | nindent 14 }}
            {{- if .Values.traefik.ingressRoute.dashboard.tls }}
            tls:
              secretName: {{ .Values.traefik.ingressRoute.dashboard.tls.secretName }}
            {{- end }}
            {{- end }}

        resources:
          {{- toYaml .Values.traefik.resources | nindent 10 }}

        {{- if .Values.traefik.autoscaling.enabled }}
        autoscaling:
          enabled: true
          minReplicas: {{ .Values.traefik.autoscaling.minReplicas }}
          maxReplicas: {{ .Values.traefik.autoscaling.maxReplicas }}
          metrics:
            {{- toYaml .Values.traefik.autoscaling.metrics | nindent 12 }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.traefik.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
{{- if and .Values.traefik.oidc .Values.traefik.oidc.enabled }}
---
# Redis for OIDC session storage (required for multi-replica Traefik)
# Wave 7: After traefik (wave 6) but before traefik-config (wave 8)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-redis
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-redis
  template:
    metadata:
      labels:
        app: oidc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-redis
  namespace: {{ .Values.traefik.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  selector:
    app: oidc-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
---
# Config Application: deploys CRD-dependent resources (IngressRoute, Middleware, DNSEndpoint)
# Wave 8: After traefik (wave 6) installs CRDs and oidc-redis (wave 7) is available
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repoUrl }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: charts/traefik-config
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.global.environment }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
