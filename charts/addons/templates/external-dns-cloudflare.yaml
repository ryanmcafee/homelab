{{- if index .Values "external-dns" "enabled" }}
{{- if eq (index .Values "external-dns" "provider") "cloudflare" }}
---
# OnePasswordItem syncs the Cloudflare API token from 1Password vault
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ index .Values "external-dns" "namespace" }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  itemPath: {{ index .Values "external-dns" "cloudflare" "onePasswordItemPath" | quote }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-cloudflare
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "external-dns" "chart" "repo" }}
    chart: {{ index .Values "external-dns" "chart" "name" }}
    targetRevision: {{ index .Values "external-dns" "chart" "version" }}
    helm:
      releaseName: external-dns-cloudflare
      values: |
        fullnameOverride: external-dns-cloudflare

        provider:
          name: {{ index .Values "external-dns" "provider" }}

        {{- if eq (index .Values "external-dns" "provider") "cloudflare" }}
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api_token

        cloudflare:
          proxied: {{ index .Values "external-dns" "cloudflare" "proxied" }}
        {{- end }}

        domainFilters:
          {{- range (index .Values "external-dns" "domainFilters") }}
          - {{ . }}
          {{- end }}

        annotationFilter: {{ index .Values "external-dns" "annotationFilter" }}

        policy: sync
        registry: txt
        txtOwnerId: {{ .Values.global.environment }}-cloudflare

        {{- if index .Values "external-dns" "defaultTarget" }}
        # Use DDNS hostname as the target for all DNS records
        # This ensures Cloudflare points to the dynamic public IP
        extraArgs:
          - --default-targets={{ index .Values "external-dns" "defaultTarget" }}
        {{- end }}

        resources:
          {{- toYaml (index .Values "external-dns" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "external-dns" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
