{{- if .Values.nats.enabled }}
{{- $accounts := include "addons.natsAccountsMerge" . }}
{{- $boxPrincipals := compact (splitList "," (default "" .Values.nats.natsBoxPrincipals)) }}
{{- $nkeys := fromYaml (include "addons.natsPrincipalNkeys" .) }}
{{- $vault := .Values.nats.credentials.onePasswordVaultPath }}
# NATS with JetStream file persistence - the platform event bus
# Sync Wave: 10 (after kube-prometheus-stack at 9, whose PodMonitor the exporter needs)
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.nats.namespace }}
  labels:
    {{- include "addons.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- if and $nkeys $vault }}
{{- $prefix := .Values.nats.credentialSecretPrefix }}
{{- $extra := .Values.nats.credentials.extraNamespaces }}
# The seed side of ADR-043's static backend: one OnePasswordItem per principal whose PUBLIC key
# the server accepts, producing the Secret `nats-principal-<principal>` with the PRIVATE seed
# under key `nats.nk`. The 1Password item field must carry that exact label.
#
# `$SYS` is absent on purpose. No platform component holds the system account (ADR-043 D4), so a
# system Secret in the bus namespace would be a break-glass credential mounted next to every
# ordinary client. Its custody is a restricted 1Password item plus an offline copy that works
# while the cluster identity service is down: docs/runbooks/nats-credentials.md.
#
# Sync Wave: 9, so the seed exists before the server at 10 accepts its first connection.
{{- range $principal, $publicKey := $nkeys }}
{{- $namespaces := prepend (index $extra $principal | default list) $.Values.nats.namespace }}
{{- range $namespace := uniq $namespaces }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $prefix }}{{ $principal }}
  namespace: {{ $namespace }}
  labels:
    {{- include "addons.labels" $ | nindent 4 }}
    app.kubernetes.io/component: nats-principal-credential
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  itemPath: {{ printf "%s/%s%s" (trimSuffix "/" $vault) $prefix $principal | quote }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  labels:
    {{- include "addons.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.nats.chart.repo }}
    chart: {{ .Values.nats.chart.name }}
    targetRevision: {{ .Values.nats.chart.version }}
    helm:
      releaseName: nats
      values: |
        config:
          {{- with $accounts }}
          # ADR-043's static backend. One account per tenant IS the enforcement, and the
          # server refuses an unauthenticated connection the moment this block exists: no
          # `no_auth_user` is set, so a client with no nkey reaches no account at all.
          # Generated from contracts/events/bus-principals.v1.yaml; see _nats-accounts.tpl.
          merge:
            {{- . | nindent 12 }}
          {{- end }}
          cluster:
            enabled: {{ gt (int .Values.nats.replicas) 1 }}
            replicas: {{ .Values.nats.replicas }}
          jetstream:
            enabled: true
            fileStore:
              enabled: true
              pvc:
                enabled: true
                size: {{ .Values.nats.jetstream.storage.size }}
                storageClassName: {{ .Values.nats.jetstream.storage.className }}
        # promExporter and its podMonitor both default to false upstream, and
        # config.jetstream.enabled above is what renders the exporter's -jsz=all
        # flag. Without all three there is no nats_stream_* series and the
        # PF_WORK silent-loss alerts (MCAA-134) run blind.
        promExporter:
          enabled: true
          podMonitor:
            enabled: true
            # The chart's PodMonitor sets no interval, so it would inherit
            # whatever global scrape interval a fork configured. Pin it under the
            # 5m min_over_time window the aging rules read.
            merge:
              spec:
                podMetricsEndpoints:
                  - port: prom-metrics
                    interval: {{ .Values.nats.monitoring.scrapeInterval }}
        container:
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
        {{- if $accounts }}
        # Every `nats` command becomes a named context with a credential
        # (docs/event-backbone.md). The chart's own `default` context carries none, so it is
        # removed rather than left to connect anonymously against an account block that
        # refuses it. With no principal named here the box has no credential at all and is
        # not deployed, which is the honest state -- not a pod that cannot connect.
        natsBox:
          enabled: {{ gt (len $boxPrincipals) 0 }}
          contexts:
            default: null
            {{- range $principal := $boxPrincipals }}
            {{ $principal }}:
              nkey:
                # The PRIVATE seed, delivered by External Secrets. The server holds only the
                # matching public key, which is what makes rotation a Secret update.
                secretName: {{ $.Values.nats.credentialSecretPrefix }}{{ $principal }}
                key: nats.nk
              merge:
                # Pins the client's inbox to the prefix its subscribe grant covers. A client
                # left on the library default `_INBOX` gets no reply it can read.
                inbox_prefix: _INBOX.{{ $principal }}
            {{- end }}
          {{- with first $boxPrincipals }}
          defaultContextName: {{ . }}
          {{- end }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.nats.namespace }}

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
{{- end }}
