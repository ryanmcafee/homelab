{{- if index .Values "external-dns" "enabled" }}
{{- if eq (index .Values "external-dns" "provider") "cloudflare" }}
---
# Additional RBAC for CRD source (helm chart doesn't generate this correctly)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-cloudflare-crd-dnsendpoints
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-cloudflare-crd-dnsendpoints
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-cloudflare-crd-dnsendpoints
subjects:
  - kind: ServiceAccount
    name: external-dns-cloudflare-crd
    namespace: {{ index .Values "external-dns" "namespace" }}
---
# CRD source instance for DNSEndpoint resources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-cloudflare-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "external-dns" "chart" "repo" }}
    chart: {{ index .Values "external-dns" "chart" "name" }}
    targetRevision: {{ index .Values "external-dns" "chart" "version" }}
    helm:
      releaseName: external-dns-cloudflare-crd
      values: |
        fullnameOverride: external-dns-cloudflare-crd

        provider:
          name: cloudflare

        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api_token

        cloudflare:
          proxied: {{ index .Values "external-dns" "cloudflare" "proxied" }}

        sources:
          - crd

        domainFilters:
          {{- range (index .Values "external-dns" "domainFilters") }}
          - {{ . }}
          {{- end }}

        policy: sync
        registry: txt
        txtOwnerId: {{ .Values.global.environment }}-cloudflare-crd

        {{- if index .Values "external-dns" "defaultTarget" }}
        extraArgs:
          - --default-targets={{ index .Values "external-dns" "defaultTarget" }}
        {{- end }}

        resources:
          {{- toYaml (index .Values "external-dns" "resources") | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "external-dns" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
{{- end }}
{{- end }}
