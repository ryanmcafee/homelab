{{- if index .Values "intel-device-plugins-operator" "enabled" }}
---
# Shared namespace for the Intel Device Plugins operator AND the
# intel-gpu-device-plugin. Owned by the operator template (this file) because
# the operator syncs at wave 9, one wave before the plugin at wave 10. The
# plugin template intentionally does NOT declare this Namespace — declaring it
# in both produces a "RepeatedResourceWarning" on the addons app and makes
# ArgoCD's sync engine fight over the labels.
#
# Privileged PodSecurity is required because the GPU device plugin DaemonSet
# mounts /dev/dri (a hostPath device) — baseline rejects it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ index .Values "intel-device-plugins-operator" "namespace" }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "9"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-device-plugins-operator
  namespace: argocd
  annotations:
    # Wave 9: before the intel-gpu-device-plugin chart at wave 10. The operator
    # installs the deviceplugin.intel.com CRDs the plugin chart's CRs reference.
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ index .Values "intel-device-plugins-operator" "chart" "repo" }}
    chart: {{ index .Values "intel-device-plugins-operator" "chart" "name" }}
    targetRevision: {{ index .Values "intel-device-plugins-operator" "chart" "version" }}
    helm:
      releaseName: intel-device-plugins-operator
      values: |
        # Install CRDs for GpuDevicePlugin (and other device plugin CRs)
        manager:
          devices:
            gpu: true
            # Disable plugins we don't use — keeps the operator scope minimal
            dlb: false
            dsa: false
            fpga: false
            iaa: false
            qat: false
            sgx: false

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ index .Values "intel-device-plugins-operator" "namespace" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
{{- end }}
