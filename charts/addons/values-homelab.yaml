# Addons Chart - Homelab Environment Values

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Enable external DNS management
  externalDNS: true

  # Enable external load balancing
  loadBalancer: true

# ============================================================================
# ArgoCD - Self-Management (Bootstrap + Addon)
# Sync Wave: 0 (first addon, manages itself)
# ============================================================================

argocd:
  enabled: true
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    server:
      # Ingress for web UI
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - argocd.ryanmcafee.com
        tls:
          - secretName: argocd-server-tls
            hosts:
              - argocd.ryanmcafee.com
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: argocd.ryanmcafee.com

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ============================================================================
# MetalLB - LoadBalancer IP Address Management
# Sync Wave: 1
# ============================================================================

metallb:
  enabled: true
  namespace: metallb-system

  chart:
    name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.14.9

  # IP address pool configuration
  addresses:
    - 172.16.100.100-172.16.100.200

  # BGP configuration for dynamic routing
  bgp:
    enabled: true
    asn: 64512
    peers:
      - address: 172.16.100.1
        asn: 64513
        routerId: 172.16.100.1

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    speaker:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  driver: freenas-nfs

  truenas:
    endpoint: https://truenas.ryanmcafee.com
    allowInsecure: false
    apiKey: ""  # Provided via 1Password operator

  nfs:
    shareHost: truenas.ryanmcafee.com
    shareAllow: 172.16.100.0/24
    parent: storage/k8s

  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Disabled for homelab (using democratic-csi)
# ============================================================================

local-path-provisioner:
  enabled: false

# ============================================================================
# 1Password Operator - Secret Management
# Sync Wave: 2
# ============================================================================

1password-operator:
  enabled: true
  namespace: onepassword-operator

  chart:
    name: onepassword-connect-operator
    repo: https://1password.github.io/connect-helm-charts
    version: 1.15.1

  connect:
    credentialsJson: ""
    host: op-connect.ryanmcafee.com

  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    connect:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  installCRDs: true

  # Production Let's Encrypt
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory

  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com
    apiToken: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  provider: cloudflare

  cloudflare:
    apiToken: ""
    proxied: true

  domainFilters:
    - ryanmcafee.com

  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 67.6.1

  prometheus:
    retention: 30d
    retentionSize: 50GB
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    serviceMonitors:
      enabled: true

  grafana:
    enabled: true
    adminPassword: ""

    persistence:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  alertmanager:
    enabled: true
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Traefik - Ingress Controller
# Sync Wave: 6
# ============================================================================

traefik:
  enabled: true
  namespace: traefik

  chart:
    name: traefik
    repo: https://traefik.github.io/charts
    version: 33.2.1

  service:
    type: LoadBalancer

  ports:
    web:
      port: 80
      expose:
        default: true
      redirectTo:
        port: websecure
    websecure:
      port: 443
      expose:
        default: true
      tls:
        enabled: true
        certResolver: letsencrypt

  globalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false

  additionalArguments:
    - --certificatesresolvers.letsencrypt.acme.email=admin@ryanmcafee.com
    - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
    - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare

  env:
    - name: CF_API_EMAIL
      value: admin@ryanmcafee.com
    - name: CF_DNS_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: token

  persistence:
    enabled: true
    storageClass: democratic-csi-nfs
    size: 1Gi

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
      entryPoints: ["websecure"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  deployment:
    replicas: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
