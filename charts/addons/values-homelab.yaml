# Addons Chart - Homelab Environment Values

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Enable external DNS management
  externalDNS: true

  # Enable external load balancing
  loadBalancer: true

# ============================================================================
# ArgoCD - Self-Management (Bootstrap + Addon)
# Sync Wave: 0 (first addon, manages itself)
# ============================================================================

argocd:
  enabled: true
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    server:
      # Ingress for web UI
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - argocd.ryanmcafee.com
        tls:
          - secretName: argocd-server-tls
            hosts:
              - argocd.ryanmcafee.com
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: argocd.ryanmcafee.com

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ============================================================================
# Kubelet CSR Approver - Automatic Kubelet Certificate Approval
# Sync Wave: 1 (early infrastructure component)
# ============================================================================

kubelet-csr-approver:
  enabled: true
  namespace: kube-system

  chart:
    name: kubelet-csr-approver
    repo: https://postfinance.github.io/kubelet-csr-approver
    version: "1.2.2"

  # IP prefixes allowed for kubelet serving certificates
  # Must include all node IPs in the cluster
  providerIpPrefixes:
    - "172.16.100.0/24"

  # Regex pattern for valid node names (Talos generates names like talos-xxx-yyy)
  providerRegex: "^talos-[a-z0-9]{3}-[a-z0-9]{3}$"

  # Bypass DNS resolution check for SAN names (Talos node names aren't in DNS)
  bypassDnsResolution: true

  # Maximum certificate validity (365 days)
  maxExpirationSeconds: 31536000

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# MetalLB - LoadBalancer IP Address Management
# Sync Wave: 1
# ============================================================================

metallb:
  enabled: true
  namespace: metallb-system

  chart:
    name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.14.9

  # IP address pool configuration
  addresses:
    - 172.16.100.100-172.16.100.200

  # BGP configuration for dynamic routing
  bgp:
    enabled: true
    asn: 64512
    peers:
      - address: 172.16.100.1
        asn: 64513
        routerId: 172.16.100.1

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    speaker:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  driver: freenas-api-nfs

  truenas:
    # Use IP address instead of hostname since internal DNS is not resolvable from cluster
    endpoint: https://172.16.100.150
    allowInsecure: true  # Required when using IP (no valid TLS cert for IP)
    apiKey: ""  # Populated from 1Password secret
    # 1Password vault path for TrueNAS API key (creates secret: truenas-api-key)
    onePasswordItemPath: vaults/homelab/items/truenas

  nfs:
    shareHost: 172.16.100.150
    shareAllow: 172.16.100.0/24
    parent: storage/k8s

  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Disabled for homelab (using democratic-csi)
# ============================================================================

local-path-provisioner:
  enabled: false

# ============================================================================
# 1Password Operator - Secret Management
# Sync Wave: 2
# ============================================================================

1password-operator:
  enabled: true
  namespace: onepassword-operator

  chart:
    name: connect
    repo: https://1password.github.io/connect-helm-charts
    version: 2.2.1

  connect:
    credentialsJson: ""
    host: op-connect.ryanmcafee.com

  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    connect:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ============================================================================
# CloudNativePG - PostgreSQL Operator
# Sync Wave: 2 (must be before home-assistant which depends on CNPG CRDs)
# ============================================================================

cloudnative-pg:
  enabled: true
  namespace: cnpg-system

  chart:
    name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.27.0

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      create: false

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  installCRDs: true

  # Production Let's Encrypt
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory

  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com
    apiToken: ""
    onePasswordItemPath: vaults/homelab/items/cloudflare

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  provider: cloudflare

  cloudflare:
    apiToken: ""
    proxied: true
    onePasswordItemPath: vaults/homelab/items/cloudflare

  domainFilters:
    - ryanmcafee.com

  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.8.2

  prometheus:
    retention: 30d
    retentionSize: 50GB
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    serviceMonitors:
      enabled: true

  grafana:
    enabled: true
    adminPassword: ""

    persistence:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  alertmanager:
    enabled: true
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Traefik - Ingress Controller
# Sync Wave: 6
# ============================================================================

traefik:
  enabled: true
  namespace: traefik

  chart:
    name: traefik
    repo: https://traefik.github.io/charts
    version: 33.2.1

  service:
    type: LoadBalancer

  ports:
    web:
      port: 80
      expose:
        default: true
      redirectTo:
        port: websecure
    websecure:
      port: 443
      expose:
        default: true
      tls:
        enabled: true
        # TLS certificates managed by cert-manager for HA compatibility

  globalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false

  # ACME removed - using cert-manager for TLS certificates (HA compatible)
  additionalArguments: []

  env: []

  # Persistence disabled - ACME removed
  persistence:
    enabled: false

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
      entryPoints: ["websecure"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  deployment:
    replicas: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

  cloudflare:
    enabled: true
    onePasswordItemPath: vaults/homelab/items/cloudflare
