# Addons Chart - Homelab Environment Values

# ============================================================================
# Global Configuration
# ============================================================================

global:
  # Environment identifier
  environment: homelab

  # Base domain for ingress resources
  domain: ryanmcafee.com

  # Default storage class for persistent volumes
  storageClass: democratic-csi-nfs

  # Enable external DNS management
  externalDNS: true

  # Enable external load balancing
  loadBalancer: true

  # Git repository for SOPS secrets
  repoUrl: https://github.com/ryanmcafee/homelab.git
  targetRevision: main

# ============================================================================
# SOPS Secrets - Encrypted secrets for GitOps
# Sync Wave: -2 (FIRST - deploys 1Password credentials before operator)
# ============================================================================

sops-secrets:
  enabled: true

# ============================================================================
# ArgoCD - Self-Management (Bootstrap + Addon)
# DISABLED - Moved to applications chart with sync-wave 5
# ============================================================================

argocd:
  enabled: false
  namespace: argocd

  # Chart source - must match bootstrap version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.15"

  # ArgoCD server configuration
  values:
    # Enable App of Apps health status progression
    configs:
      cm:
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
        # Custom health check for Ingress - treat as Healthy even without loadBalancer address
        # This prevents circular dependency during initial sync when Traefik isn't deployed yet
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.loadBalancer ~= nil then
              if obj.status.loadBalancer.ingress ~= nil then
                hs.message = "Load balancer ingress configured"
              else
                hs.message = "Waiting for load balancer (non-blocking)"
              end
            end
          end
          return hs

    server:
      # HA configuration - 3 replicas spread across different hosts
      replicas: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server

      # Ingress for web UI
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.ryanmcafee.com
        tls: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: argocd.ryanmcafee.com
          # OIDC authentication via Traefik plugin
          traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      # HA configuration - 2 replicas spread across different hosts
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      # HA configuration - 2 replicas
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# ============================================================================
# Kubelet CSR Approver - Automatic Kubelet Certificate Approval
# Sync Wave: 1 (early infrastructure component)
# ============================================================================

kubelet-csr-approver:
  enabled: true
  namespace: kube-system

  chart:
    name: kubelet-csr-approver
    repo: https://postfinance.github.io/kubelet-csr-approver
    version: "1.2.2"

  # IP prefixes allowed for kubelet serving certificates
  # Must include all node IPs in the cluster
  providerIpPrefixes:
    - "172.16.100.0/24"

  # Regex pattern for valid node names (Talos generates names like talos-xxx-yyy)
  providerRegex: "^talos-[a-z0-9]{3}-[a-z0-9]{3}$"

  # Bypass DNS resolution check for SAN names (Talos node names aren't in DNS)
  bypassDnsResolution: true

  # Maximum certificate validity (365 days)
  maxExpirationSeconds: 31536000

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Cilium - CNI (Visibility Only - actual install via Talos inline)
# Sync Wave: 0
# ============================================================================

cilium:
  enabled: true
  chart:
    version: "1.18.0"  # Must match Taskfile cilium:render version

# ============================================================================
# Cilium LB IPAM - LoadBalancer IP Management + BGP
# Sync Wave: 1
# ============================================================================

cilium-lb-ipam:
  enabled: true

  lbipam:
    addresses:
      - "172.16.100.100-172.16.100.200"

  # Control Plane VIP - Only advertised by control-plane nodes
  # This creates a dedicated IP pool with restricted node selector
  controlPlaneVIP: "172.16.100.10"

  bgp:
    enabled: true
    localASN: 64512
    peers:
      - name: "unifi-gateway"
        address: "172.16.100.1"
        asn: 64513

# ============================================================================
# Democratic-CSI - NFS Storage Provisioner
# Sync Wave: 2
# ============================================================================

democratic-csi:
  enabled: true
  namespace: democratic-csi

  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  driver: freenas-api-nfs

  truenas:
    # Use IP address instead of hostname since internal DNS is not resolvable from cluster
    endpoint: https://172.16.100.150
    allowInsecure: true  # Required when using IP (no valid TLS cert for IP)
    apiKey: ""  # Populated from 1Password secret
    # 1Password vault path for TrueNAS API key (creates secret: truenas-api-key)
    onePasswordItemPath: vaults/homelab/items/truenas

  nfs:
    shareHost: 172.16.100.150
    shareAllow: 172.16.100.0/24
    parent: storage/k8s

  storageClasses:
    - name: democratic-csi-nfs
      defaultClass: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Democratic-CSI SSD - NFS Storage Provisioner (SSD-backed)
# Sync Wave: 2
# ============================================================================

democratic-csi-ssd:
  enabled: true
  namespace: democratic-csi

  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  driver: freenas-api-nfs

  truenas:
    # Use IP address instead of hostname since internal DNS is not resolvable from cluster
    endpoint: https://172.16.100.150
    allowInsecure: true  # Required when using IP (no valid TLS cert for IP)
    apiKey: ""  # Populated from 1Password secret
    onePasswordItemPath: vaults/homelab/items/truenas

  nfs:
    shareHost: 172.16.100.150
    shareAllow: 172.16.100.0/24
    parent: ssd/k8s

  storageClasses:
    - name: democratic-csi-ssd
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: nfs

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Democratic-CSI iSCSI - Block Storage Provisioner (SSD-backed)
# Sync Wave: 2 (same as NFS instances, reuses truenas-api-key secret)
# ============================================================================

democratic-csi-iscsi:
  enabled: true
  namespace: democratic-csi

  chart:
    name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.14.6

  driver: freenas-api-iscsi

  truenas:
    # Use IP address instead of hostname since internal DNS is not resolvable from cluster
    endpoint: https://172.16.100.150
    allowInsecure: true  # Required when using IP (no valid TLS cert for IP)
    apiKey: ""  # Populated from 1Password secret
    onePasswordItemPath: vaults/homelab/items/truenas

  iscsi:
    targetPortal: "172.16.100.150:3260"
    datasetParent: ssd/iscsi
    snapshotsParent: ssd/iscsi-snapshots
    portalGroupId: 1
    initiatorGroupId: 1

  storageClasses:
    - name: democratic-csi-iscsi
      defaultClass: false
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4

  resources:
    controller:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    node:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Local Path Provisioner - Disabled for homelab (using democratic-csi)
# ============================================================================

local-path-provisioner:
  enabled: false

# ============================================================================
# 1Password Operator - Secret Management
# Sync Wave: 2
# ============================================================================

1password-operator:
  enabled: true
  namespace: onepassword-operator

  chart:
    name: connect
    repo: https://1password.github.io/connect-helm-charts
    version: 2.2.1

  connect:
    credentialsJson: ""
    host: op-connect.ryanmcafee.com

  resources:
    operator:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    connect:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ============================================================================
# CloudNativePG - PostgreSQL Operator
# Sync Wave: 2 (must be before home-assistant which depends on CNPG CRDs)
# ============================================================================

cloudnative-pg:
  enabled: true
  namespace: cnpg-system

  chart:
    name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.27.0

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      create: false

# ============================================================================
# Cert-Manager - TLS Certificate Management
# Sync Wave: 3
# ============================================================================

cert-manager:
  enabled: true
  namespace: cert-manager

  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.2

  installCRDs: true

  # Production Let's Encrypt
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory

  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com
    apiToken: ""
    onePasswordItemPath: vaults/homelab/items/cloudflare

  # DNS zones for certificate issuance
  dnsZones:
    - ryanmcafee.com

  # Custom DNS resolvers for ACME DNS-01 challenge verification
  dns01RecursiveNameservers:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "8.8.4.4:53"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# External-DNS - Automatic DNS Record Management
# Sync Wave: 4
# ============================================================================

external-dns:
  enabled: true
  namespace: external-dns

  chart:
    name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.15.0

  provider: cloudflare

  # Sources to watch for DNS records
  # - service: watch Service resources with external-dns annotations
  # - ingress: watch Ingress resources with external-dns annotations
  # - crd: watch DNSEndpoint CRD resources (e.g., from traefik-config)
  sources:
    - service
    - ingress
    - crd

  cloudflare:
    apiToken: ""
    proxied: true
    onePasswordItemPath: vaults/homelab/items/cloudflare

  domainFilters:
    - ryanmcafee.com

  annotationFilter: external-dns.alpha.kubernetes.io/hostname

  # Default target for all DNS records - use DuckDNS for dynamic IP
  # This creates CNAME records pointing to the DDNS hostname
  defaultTarget: ryanmcafee.duckdns.org

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# External-DNS UniFi - Internal DNS Management (Split DNS)
# Sync Wave: 4
# ============================================================================

external-dns-unifi:
  enabled: true
  namespace: external-dns-unifi

  chart:
    version: "1.15.0"

  webhook:
    version: "v0.8.1"

  unifi:
    host: "https://172.16.100.1"

  # Uses existing UniFi credentials (needs api_key field added)
  onePasswordItemPath: vaults/homelab/items/unifi

  domainFilters:
    - ryanmcafee.com

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# Kube-Prometheus-Stack - Monitoring and Alerting
# Sync Wave: 5
# ============================================================================

kube-prometheus-stack:
  enabled: true
  namespace: monitoring

  chart:
    name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 69.8.2

  prometheus:
    retention: 30d
    retentionSize: 50GB
    storageClass: democratic-csi-nfs
    storageSize: 100Gi

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Avoid scheduling on GPU nodes — keep GPU resources for media workloads
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: nvidia.com/gpu.present
                  operator: NotIn
                  values:
                    - "true"

    serviceMonitors:
      enabled: true

  grafana:
    enabled: true
    adminPassword: ""

    # Run as apps:users (568:100) to match NFS PVC permissions
    securityContext:
      runAsUser: 568
      runAsGroup: 100
      fsGroup: 100

    persistence:
      enabled: true
      storageClass: democratic-csi-nfs
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: grafana.ryanmcafee.com
        # OIDC authentication via Traefik plugin
        traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  alertmanager:
    enabled: true
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: democratic-csi-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ============================================================================
# Traefik - Ingress Controller
# Sync Wave: 6
# ============================================================================

traefik:
  enabled: true
  namespace: traefik

  chart:
    name: traefik
    repo: https://traefik.github.io/charts
    version: 39.0.0

  service:
    type: LoadBalancer
    spec:
      externalTrafficPolicy: Local
    # Static IP for predictable port forwarding and DNS
    annotations:
      # Cilium LB IPAM annotation for static IP assignment
      io.cilium/lb-ipam-ips: "172.16.100.200"
      port-forwarding.ryanmcafee.com/enable: "true"

  ports:
    web:
      port: 8000
      exposedPort: 80
      expose:
        default: true
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 8443
      exposedPort: 443
      expose:
        default: true
      asDefault: true
      http:
        tls:
          enabled: true
      transport:
        respondingTimeouts:
          readTimeout: 0
          writeTimeout: 0
          idleTimeout: 600s
    traefik:
      port: 9000
      expose:
        default: true

  # Global arguments moved to additionalArguments in v39+
  additionalArguments:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false

  # OIDC Plugin for authentication (replaces oauth2-proxy)
  experimental:
    plugins:
      traefikoidc:
        moduleName: github.com/lukaszraczylo/traefikoidc
        version: v0.8.21

  # OIDC middleware configuration
  oidc:
    enabled: true
    providerURL: "https://accounts.google.com"
    # Use path format - plugin constructs full URL from request host
    callbackURL: "/oauth2/callback"
    logoutURL: "/oauth2/logout"
    scopes:
      - openid
      - profile
      - email
    allowedDomains:
      - ryanmcafee.com
    sessionEncryptionKeyPath: vaults/homelab/items/oidc-session-key
    googleOAuthPath: vaults/homelab/items/google-oauth

  # Volume mounts for OIDC secrets
  volumes:
    - name: google-oauth-credentials
      mountPath: /etc/traefik/oidc/google
      type: secret
    - name: oidc-session-key
      mountPath: /etc/traefik/oidc/session
      type: secret

  env: []

  # Persistence disabled - ACME removed
  persistence:
    enabled: false

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
      entryPoints: ["websecure"]
      tls:
        secretName: traefik-dashboard-tls

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  deployment:
    replicas: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

  cloudflare:
    enabled: true
    onePasswordItemPath: vaults/homelab/items/cloudflare

# ============================================================================
# UniFi Port Forwarding Controller - Automatic Port Forwards
# Sync Wave: 6-7
# ============================================================================

unifi-port-forward:
  enabled: true
  namespace: port-forwarding
  version: 1.1.x
  onePasswordItemPath: vaults/homelab/items/unifi

# ============================================================================
# OAuth2-Proxy - Zero-Trust Authentication (DISABLED - replaced by Traefik OIDC plugin)
# Sync Wave: 6-8
# ============================================================================

oauth2-proxy:
  enabled: false
  namespace: oauth2-proxy

  chart:
    version: "7.7.30"

  # 1Password paths for secrets
  googleOAuthPath: vaults/homelab/items/google-oauth
  cookieSecretPath: vaults/homelab/items/oauth2-proxy-cookie

  # Allowed email domains for authentication
  emailDomains:
    - "ryanmcafee.com"

  # Cookie and whitelist domains
  cookieDomains:
    - ".ryanmcafee.com"
  whitelistDomains:
    - ".ryanmcafee.com"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ============================================================================
# NVIDIA GPU Operator - GPU Support for Kubernetes
# Sync Wave: 0 (must deploy before Plex which requires RuntimeClass nvidia)
# ============================================================================

nvidia-gpu-operator:
  enabled: true
  namespace: gpu-operator

  chart:
    version: "v25.3.0"

  # Note: Driver and toolkit are provided by Talos system extensions
  # (siderolabs/nonfree-kmod-nvidia and siderolabs/nvidia-container-toolkit)
  # GPU Operator only manages device plugin, monitoring, and feature discovery

# ============================================================================
# Argo Workflows - Workflow Orchestration
# Sync Wave: 7 (after core infrastructure)
# ============================================================================

argo-workflows:
  enabled: true
  namespace: argo-workflows

  chart:
    name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: "0.45.2"

  server:
    authMode: server

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/hostname: workflows.ryanmcafee.com
        # OIDC authentication via Traefik plugin (replaces oauth2-proxy)
        traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd
      hosts:
        - workflows.ryanmcafee.com
      paths:
        - /
      pathType: Prefix
      tls:
        - secretName: argo-workflows-tls
          hosts:
            - workflows.ryanmcafee.com

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    workflowDefaults:
      spec:
        ttlStrategy:
          secondsAfterCompletion: 86400
          secondsAfterSuccess: 43200
          secondsAfterFailure: 172800

  # Ingress verification workflow configuration
  # NOTE: Disabled due to tpl() double-templating issues in upstream chart
  ingressVerification:
    enabled: false
    schedule: "*/5 * * * *"
    # List of ingresses to verify - all require authentication
    ingresses:
      - name: traefik
        url: https://traefik.ryanmcafee.com/dashboard/
        expectAuth: true
      - name: argocd
        url: https://argocd.ryanmcafee.com
        expectAuth: true
      - name: grafana
        url: https://grafana.ryanmcafee.com
        expectAuth: true
      - name: plex
        url: https://plex.ryanmcafee.com
        expectAuth: true
      - name: sonarr
        url: https://sonarr.ryanmcafee.com
        expectAuth: true
      - name: radarr
        url: https://radarr.ryanmcafee.com
        expectAuth: true
      - name: prowlarr
        url: https://prowlarr.ryanmcafee.com
        expectAuth: true
      - name: homeassistant
        url: https://homeassistant.ryanmcafee.com
        expectAuth: true
      - name: auth
        url: https://auth.ryanmcafee.com
        expectAuth: true
