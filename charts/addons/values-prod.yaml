# Addons Chart - Production Environment Overrides
# Production Talos cluster on Proxmox
#
# High availability configuration with proper resource allocation
# and production-grade monitoring and alerting.

# ============================================================================
# Global Configuration
# ============================================================================

global:
  environment: prod
  domain: ryanmcafee.com
  storageClass: democratic-csi-nfs
  externalDNS: true
  loadBalancer: true

# ============================================================================
# MetalLB
# ============================================================================

metallb:
  enabled: true

  # Production IP pool (full range)
  addresses:
    - 172.16.100.100-172.16.100.200

  # BGP peering with UniFi
  bgp:
    enabled: true
    asn: 64512
    peers:
      - address: 172.16.100.1
        asn: 64513
        routerId: 172.16.100.1

# ============================================================================
# Democratic-CSI
# ============================================================================

democratic-csi:
  enabled: true

  # Production TrueNAS endpoint
  truenas:
    endpoint: https://truenas.ryanmcafee.com
    allowInsecure: false

  # Production NFS dataset
  nfs:
    shareHost: truenas.ryanmcafee.com
    shareAllow: 172.16.100.0/24
    parent: tank/k8s

# ============================================================================
# Local Path Provisioner
# ============================================================================

local-path-provisioner:
  enabled: false  # Not used in production

# ============================================================================
# 1Password Operator
# ============================================================================

1password-operator:
  enabled: true

  # Production 1Password Connect instance
  connect:
    host: op-connect.ryanmcafee.com

# ============================================================================
# Cert-Manager
# ============================================================================

cert-manager:
  enabled: true

  # Use Let's Encrypt production
  letsencrypt:
    enabled: true
    email: admin@ryanmcafee.com
    server: https://acme-v02.api.letsencrypt.org/directory  # Production

  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com

# ============================================================================
# External-DNS
# ============================================================================

external-dns:
  enabled: true

  # Production domain filter
  domainFilters:
    - ryanmcafee.com

# ============================================================================
# Kube-Prometheus-Stack
# ============================================================================

kube-prometheus-stack:
  enabled: true

  # Full retention for production
  prometheus:
    retention: 30d
    retentionSize: 50GB
    storageSize: 100Gi

    # Production resource allocation
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Grafana with production domain
  grafana:
    ingress:
      hosts:
        - grafana.ryanmcafee.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ryanmcafee.com

    persistence:
      size: 10Gi

  # Production alertmanager
  alertmanager:
    enabled: true
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi

# ============================================================================
# Traefik
# ============================================================================

traefik:
  enabled: true

  # High availability - 2 replicas minimum
  deployment:
    replicas: 2

  # Enable autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

  # Dashboard with production domain
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.ryanmcafee.com`)
