# bootstrap — local development overrides
#
# Kind + ArgoCD loop (issue #261, Section B). Nothing the bootstrap chart
# deploys in homelab applies to Kind:
#
# - There is no 1Password Connect and no SOPS age key, so the SOPS secrets,
#   the 1Password operator and the homelab-environment-config OnePasswordItem
#   are off. The Secrets and StorageClasses the other charts reference are
#   seeded as fakes instead (localdev/fakes, applied by `task localdev:fakes`),
#   and the OnePasswordItem CRD is installed from there so any item that still
#   renders is at least accepted by the API server.
# - ArgoCD is installed directly by scripts/localdev-argocd.ts, not by the
#   argocd Application (self-management stays off).
# - Automated sync is off everywhere so `argocd app sync --local` can push the
#   working tree without ArgoCD reverting it to Git (ARGOCD_AUTOMATED_SYNC).
#
# The file has to exist regardless. The parent Application always appends
# values-localdev.yaml to spec.source.helm.valueFiles, and ArgoCD fails the
# sync when a declared value file is missing.

global:
  automatedSync: false

sops-secrets:
  enabled: false

1password-operator:
  enabled: false

homelab-environment-config:
  enabled: false
