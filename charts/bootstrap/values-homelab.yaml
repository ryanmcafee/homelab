# Bootstrap Chart - Homelab Environment Values

# Enable ArgoCD self-management in homelab
argocd:
  enabled: true

  values:
    configs:
      cm:
        # Custom health check for Ingress - treat as Healthy even without loadBalancer address
        # This prevents circular dependency during initial sync when Traefik isn't deployed yet
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.loadBalancer ~= nil then
              if obj.status.loadBalancer.ingress ~= nil then
                hs.message = "Load balancer ingress configured"
              else
                hs.message = "Waiting for load balancer (non-blocking)"
              end
            end
          end
          return hs

    server:
      # HA configuration - 3 replicas spread across different hosts
      replicas: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server

      # Ingress for web UI
      # hostname, the external-dns hostname annotation and extraTls are NOT set
      # here: the gitops parent Application derives them from global.domain and
      # passes them via spec.source.helm.valuesObject (see
      # charts/gitops/templates/bootstrap.yaml). Never commit the real domain.
      ingress:
        enabled: true
        ingressClassName: internal
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt

      # Production resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      # Bumped from 512Mi/1Gi after argocd-application-controller-0 was OOMKilled
      # 11 times (exit code 137). Homelab fleet sits ~30 ArgoCD Applications and
      # the controller's working set needs ~1Gi steady-state, spiking higher
      # during sync storms. Upstream base is 2Gi/4Gi; 1Gi/2Gi is a middle ground
      # sized for this cluster's load.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi

    repoServer:
      # HA configuration - 2 replicas spread across different hosts
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      # HA configuration - 2 replicas
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
