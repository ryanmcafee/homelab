# Bootstrap Chart - Homelab Environment Values

# Enable ArgoCD self-management in homelab
argocd:
  enabled: true

  values:
    configs:
      cm:
        # Custom health check for Ingress - treat as Healthy even without loadBalancer address
        # This prevents circular dependency during initial sync when Traefik isn't deployed yet
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.loadBalancer ~= nil then
              if obj.status.loadBalancer.ingress ~= nil then
                hs.message = "Load balancer ingress configured"
              else
                hs.message = "Waiting for load balancer (non-blocking)"
              end
            end
          end
          return hs

    server:
      # HA configuration - 3 replicas spread across different hosts
      replicas: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server

      # Ingress for web UI
      ingress:
        enabled: true
        ingressClassName: internal
        hostname: argocd.ryanmcafee.com
        tls: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          external-dns.alpha.kubernetes.io/hostname: argocd.ryanmcafee.com

      # Production resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    repoServer:
      # HA configuration - 2 replicas spread across different hosts
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    applicationSet:
      # HA configuration - 2 replicas
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
