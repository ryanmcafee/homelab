{{- /*
argocd-notifications-secret from 1Password for the GitHub deploy notifications
(docs/runbooks/readonly-access.md). Rendered only when
argocd.notificationsGithub.enabled is true: a OnePasswordItem for an item that
does not exist yet goes Degraded (files/health/onepassword.com_OnePasswordItem.lua)
and would degrade the whole bootstrap Application. An empty itemPath renders an
inert item, so it is required rather than defaulted.
*/}}
{{- $github := dig "notificationsGithub" (dict) .Values.argocd }}
{{- if and .Values.argocd.enabled (dig "enabled" false $github) }}
---
# Secret keys (1Password field labels): github-appID, github-installationID,
# github-privateKey, referenced as $github-* by service.github. Wave 0, before
# the argocd Application (wave 1) whose notifications controller reads it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: argocd-notifications-secret
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ required "argocd.notificationsGithub.onePasswordItemPath is required when argocd.notificationsGithub.enabled is true" (dig "onePasswordItemPath" "" $github) | quote }}
{{- end }}
