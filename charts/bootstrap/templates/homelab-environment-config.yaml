{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Require the path as well as the toggle.
*/}}
{{- if and (index .Values "homelab-environment-config" "enabled") (index .Values "homelab-environment-config" "itemPath") }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homelab-environment-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: {{ index .Values "homelab-environment-config" "itemPath" | quote }}
{{- end }}
