{{- if .Values.argocd.enabled }}
# ArgoCD Self-Management Application
# This allows ArgoCD to manage itself after initial bootstrap by Terraform
# Sync Wave: 1 (after env-config at wave 0, before addons at wave 2)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    homelab.ryanmcafee.com/policy-exempt: "hostname-domain"
    homelab.ryanmcafee.com/policy-exempt-reason: "GitHub issue #262: domain hardcoded in values-homelab.yaml; this chart's inline spec.source.helm.values (argocd.values) sets the ArgoCD server hostname independently of configuration/environments/*.yaml (the centralized, PII-free level-0 domain), so it is correct in real deployments but never matches the level-0 placeholder domain. Remove this exemption when the chart takes DOMAIN from the config system."
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.chart.repo }}
    chart: {{ .Values.argocd.chart.name }}
    targetRevision: {{ .Values.argocd.chart.version }}
    helm:
      releaseName: argocd
      values: |
        {{- toYaml .Values.argocd.values | nindent 8 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace | default "argocd" }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  # Ignore differences in fields that change frequently
  ignoreDifferences:
    # Initial admin secret is generated and should not be overwritten
    - group: ""
      kind: Secret
      name: argocd-initial-admin-secret
      jsonPointers:
        - /data
    # Webhook secret is generated
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data/webhook.github.secret
        - /data/webhook.gitlab.secret
        - /data/webhook.bitbucket.uuid
    # Server deployment has auto-generated fields
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
{{- end }}
