{{- if .Values.argocd.enabled }}
{{- /*
Resource health Lua lives in files/health/<group>_<kind>.lua so that a single
copy serves homelab (this Application), localdev (scripts/localdev-argocd.ts
passes the same files with --set-file) and `task test:health`. Every file is
injected here as configs.cm."resource.customizations.health.<group>_<kind>".
The copy keeps .Values untouched; keys already present in .Values.argocd.values
(kustomize.buildOptions, ...) survive the merge.
*/}}
{{- $values := deepCopy .Values.argocd.values }}
{{- $configs := merge (dict) (dig "configs" (dict) $values) }}
{{- $cm := merge (dict) (dig "cm" (dict) $configs) }}
{{- range $path, $_ := .Files.Glob "files/health/*.lua" }}
{{- $_ := set $cm (printf "resource.customizations.health.%s" (trimSuffix ".lua" (base $path))) ($.Files.Get $path) }}
{{- end }}
{{- $_ := set $configs "cm" $cm }}
{{- $_ := set $values "configs" $configs }}
{{- /*
GitHub deploy notifications (docs/runbooks/readonly-access.md). The notifier,
templates and triggers in argocd.notificationsGithub.notifications reach the
argo-cd chart's `notifications` values only while
argocd.notificationsGithub.enabled is true, because they need the
argocd-notifications-secret that templates/argocd-notifications-secret.yaml
provisions from 1Password. Off, the Application renders exactly as before.
*/}}
{{- $github := dig "notificationsGithub" (dict) .Values.argocd }}
{{- if dig "enabled" false $github }}
{{- $notifications := merge (dict) (dig "notifications" (dict) $values) }}
{{- $notifications = mergeOverwrite $notifications (deepCopy (dig "notifications" (dict) $github)) }}
{{- $_ := set $values "notifications" $notifications }}
{{- end }}
# ArgoCD Self-Management Application
# This allows ArgoCD to manage itself after initial bootstrap by Terraform
# Sync Wave: 1 (after env-config at wave 0, before addons: sync-wave 2 by
# default, 1 in homelab)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.chart.repo }}
    chart: {{ .Values.argocd.chart.name }}
    targetRevision: {{ .Values.argocd.chart.version }}
    helm:
      releaseName: argocd
      values: |
        {{- toYaml $values | nindent 8 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.namespace | default "argocd" }}

  syncPolicy:
    {{- if .Values.global.automatedSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      # The HTTPRoute CRD arrives with addons wave 1, after this Application.
      - SkipDryRunOnMissingResource=true

  # Ignore differences in fields that change frequently
  ignoreDifferences:
    # Initial admin secret is generated and should not be overwritten. Core
    # kinds carry no `group: ""`: the API server drops it and the bootstrap
    # parent would report this Application OutOfSync forever.
    - kind: Secret
      name: argocd-initial-admin-secret
      jsonPointers:
        - /data
    # Webhook secret is generated
    - kind: Secret
      name: argocd-secret
      jsonPointers:
        - /data/webhook.github.secret
        - /data/webhook.gitlab.secret
        - /data/webhook.bitbucket.uuid
    # Server deployment has auto-generated fields
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
{{- end }}
