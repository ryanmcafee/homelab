# Bootstrap Chart - Default Values
# Deploys prerequisites for the CMP sidecar:
# 1. SOPS-encrypted secrets (1Password credentials)
# 2. 1Password Connect operator
# 3. homelab-environment-config OnePasswordItem

global:
  repoUrl: https://github.com/ryanmcafee/homelab.git
  targetRevision: HEAD

  # Whether every Application syncs automatically (prune + selfHeal).
  # values-localdev.yaml sets false so `argocd app sync --local` pushes the
  # working tree without ArgoCD reverting it (ARGOCD_AUTOMATED_SYNC).
  automatedSync: true

  # Images shared by the chart family (PostSync smoke Jobs). Placeholder;
  # configuration/versions.yaml images.curl wins at render time.
  images:
    curl: "8.22.0"

sops-secrets:
  enabled: true

1password-operator:
  enabled: true
  namespace: onepassword-operator
  chart:
    name: connect
    repo: https://1password.github.io/connect-helm-charts
    version: "1.16.0"
  resources:
    operator:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    connect:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

homelab-environment-config:
  enabled: true
  itemPath: "vaults/homelab/items/homelab-environment-config"

# ============================================================================
# ArgoCD - Self-Management (Bootstrap -> Addon handoff)
# Sync Wave: 1 (after env-config at wave 0, before addons at wave 2)
# ============================================================================

argocd:
  # Disabled by default - enable in environment-specific values
  # This allows ArgoCD to manage itself after initial bootstrap by Terraform
  enabled: false
  namespace: argocd

  # Chart source - must match bootstrap Terraform version
  chart:
    name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "9.4.7"

  # ArgoCD server configuration
  values:
    configs:
      params:
        server.insecure: true
      cm:
        # Enable ksops plugin for SOPS decryption
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
        # Resource health Lua (resource.customizations.health.<group>_<kind>)
        # is NOT declared here: templates/argocd.yaml injects every
        # files/health/<group>_<kind>.lua into configs.cm at render time, and
        # localdev passes the same files to the ArgoCD chart with --set-file.
        # Exercise them with `task test:health` (fixtures in tests/health/).

    server:
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    controller:
      resources:
        requests:
          cpu: 1000m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi

    repoServer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # SOPS/ksops configuration for decrypting secrets
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      # Mount age key and custom tools
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age-key
        - name: cmp-tmp
          emptyDir: {}
        - name: homelab-config
          secret:
            secretName: homelab-environment-config
            optional: true
      volumeMounts:
        - name: custom-tools
          mountPath: /usr/local/bin/ksops
          subPath: ksops
        - name: custom-tools
          mountPath: /usr/local/bin/kustomize
          subPath: kustomize
        - name: sops-age
          mountPath: /.config/sops/age
      # Init container to install ksops (binaries baked into CMP image)
      initContainers:
        - name: install-ksops
          image: ghcr.io/ryanmcafee/homelab-cmp:0.1.20
          command: ["/bin/cp"]
          args: ["/usr/local/bin/ksops", "/usr/local/bin/kustomize", "/custom-tools/"]
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      # CMP sidecar for homelab config plugin
      extraContainers:
        - name: homelab-cmp
          image: ghcr.io/ryanmcafee/homelab-cmp:0.1.20
          command: [/var/run/argocd/argocd-cmp-server]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "90"
          volumeMounts:
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins
            - mountPath: /tmp
              name: cmp-tmp
            - mountPath: /config/homelab.yaml
              name: homelab-config
              subPath: homelab.yaml
              readOnly: true

    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    notifications:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
