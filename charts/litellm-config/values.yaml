# litellm-config values: the HTTPRoutes that publish the LiteLLM proxy, synced
# after the proxy itself (wave 14 > 13).
#
# host and gateway are placeholders: the litellm-config Application in
# charts/applications passes the real hostname and Gateway through
# helm.valuesObject (ADR-010). Everything else describes the upstream chart and
# is the same in every environment.

namespace: litellm

route:
  enabled: true
  host: litellm.example.com
  gateway:
    name: envoy-internal
    namespace: envoy-gateway-system

  # The three Services the upstream chart creates for release litellm with
  # fullnameOverride: litellm. The gateway's metrics Service
  # (litellm-gateway-metrics, port 4001) serves /metrics with no auth of its
  # own and is deliberately absent: Prometheus scrapes it in-cluster through
  # the ServiceMonitor, nothing routable needs it.
  ui:
    service: litellm-ui
    port: 3000
    # The dashboard is a Next.js static export whose client router fetches an
    # RSC payload per route as a root-level <route>.txt. Without this they fall
    # to the backend catch-all and the login flow never settles.
    rscPayloads: true
  backend:
    service: litellm-backend
    port: 4001
  gatewayService:
    service: litellm-gateway
    port: 4000

  # Paths the UI serves. Mirrors $uiPaths in the upstream chart's
  # templates/ingress.yaml (chart 1.102.1); / is Exact so the backend keeps the
  # catch-all underneath it.
  uiExactPaths:
    - /
    - /favicon.ico
  uiPathPrefixes:
    - /litellm-asset-prefix
    - /_next
    - /ui

  # Paths the gateway serves. Mirrors $gatewayPrefixes in the same upstream
  # template, which mirrors the proxy's own gateway/routes/allowlist.py. The
  # versioned entries are listed one by one on purpose: a broad /v1 prefix
  # would steal the management routes (/v1/access_group, /v2/key/info,
  # /v1/mcp/*) that only the backend serves.
  #
  # Two upstream entries are left out because neither belongs on a routable
  # hostname: /metrics (the ServiceMonitor scrapes it in-cluster) and
  # /debug/memory/summary (an upstream e2e memory gate that reports a worker's
  # RSS).
  #
  # task verify:litellm-routes compares every list below with the upstream
  # Ingress on each chart bump and names the paths that moved; the two
  # exemptions live in scripts/litellm-route-drift.ts.
  gatewayExactPaths:
    # /test is the Admin UI's connection test; its children /test/connection
    # and /test/tools/list are backend MCP management routes, so a prefix here
    # would 404 them.
    - /test
  gatewayPathPrefixes:
    - /v1/chat
    - /chat
    - /v1/completions
    - /completions
    - /v1/embeddings
    - /embeddings
    - /v1/moderations
    - /moderations
    - /v1/audio
    - /audio
    - /v1/images
    - /images
    - /v1/files
    - /files
    - /v1/batches
    - /batches
