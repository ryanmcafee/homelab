{{- range .Values.volumes }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .pvName }}
spec:
  capacity:
    storage: {{ .size }}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .storageClassName }}
  volumeMode: Filesystem
  csi:
    driver: {{ .csi.driver }}
    fsType: {{ .csi.fsType | default "ext4" }}
    volumeHandle: {{ .volumeHandle }}
    volumeAttributes:
      {{- /* portal comes from the parent Application (helm.valuesObject, ISCSI_TARGET_PORTAL); a volume may still set its own */}}
      {{- toYaml (merge (deepCopy (default (dict) .csi.volumeAttributes)) (dict "portal" $.Values.iscsi.portal)) | nindent 6 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .pvcName }}
  namespace: {{ $.Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .storageClassName }}
  volumeName: {{ .pvName }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
