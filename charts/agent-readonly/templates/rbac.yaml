{{- if .Values.enabled }}
{{- $groups := .Values.clusterRole.crdGroups | default list }}
{{- if or (has "" $groups) (has "*" $groups) }}
{{- fail "agent-readonly: clusterRole.crdGroups must not contain \"\" or \"*\" (resources: [\"*\"] in the core group would grant Secrets)" }}
{{- end }}
---
# homelab-agent-readonly: what the built-in `view` role leaves out.
# - cluster-scoped objects agents need for diagnosis (nodes, namespaces,
#   persistentvolumes, storageclasses, ingressclasses, CRDs) and events;
# - every custom resource in the groups this repo deploys.
# Verbs are fixed to get/list/watch here and never read from values: this role
# must stay read-only. Secrets are absent from both roles by construction.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.clusterRole.name }}
  labels:
    app.kubernetes.io/name: agent-readonly
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, events]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  {{- if $groups }}
  - apiGroups:
      {{- range $groups }}
      - {{ . | quote }}
      {{- end }}
    resources: ["*"]
    verbs: [get, list, watch]
  {{- end }}
---
# The built-in `view` ClusterRole: read on namespaced workloads, services,
# configmaps, pods/log, ... and explicitly never Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly-view
  labels:
    app.kubernetes.io/name: agent-readonly
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.group | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterRole.name }}
  labels:
    app.kubernetes.io/name: agent-readonly
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.clusterRole.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.group | quote }}
{{- end }}
