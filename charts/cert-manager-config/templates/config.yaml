{{/*
An OnePasswordItem with an empty itemPath renders but is inert: the operator
has nothing to fetch, so no Secret ever appears while the manifest still reads
like a working producer. Enabled without a path fails the render instead.
*/}}
{{- if .Values.cloudflare.enabled }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  itemPath: {{ required "cert-manager-config: cloudflare.onePasswordItemPath is required when cloudflare.enabled is true. Set CERT_MANAGER_1P_PATH in configuration/environments/<env>.yaml, or set cloudflare.enabled to false." (trim (default "" .Values.cloudflare.onePasswordItemPath)) | quote }}
{{- end }}
