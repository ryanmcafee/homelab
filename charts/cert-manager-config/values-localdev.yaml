# cert-manager-config — local development overrides
#
# Kind has no 1Password Connect credentials, so there is no Cloudflare API
# token to fetch. Leaving cloudflare.enabled at its default rendered an
# OnePasswordItem with an empty spec.itemPath — an object the operator can
# never resolve, which nonetheless reads like a working Secret producer to
# anything inspecting the manifests. Disabled outright instead.
#
# The localdev ClusterIssuer uses the HTTP-01 solver to match; see
# charts/cert-manager-cluster-issuer/values-localdev.yaml.

cloudflare:
  enabled: false
