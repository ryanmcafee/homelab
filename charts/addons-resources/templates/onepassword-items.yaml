{{- if .Values.onepassword.truenas.enabled }}
---
# TrueNAS API key for Democratic-CSI
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: truenas-api-key
  namespace: {{ .Values.onepassword.truenas.namespace }}
spec:
  itemPath: {{ .Values.onepassword.truenas.itemPath | quote }}
{{- end }}
{{- if .Values.onepassword.cloudflare.enabled }}
{{- range .Values.onepassword.cloudflare.namespaces }}
---
# Cloudflare API token
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-token
  namespace: {{ . }}
spec:
  itemPath: {{ $.Values.onepassword.cloudflare.itemPath | quote }}
{{- end }}
{{- end }}
{{- if .Values.onepassword.unifi.enabled }}
---
# UniFi API credentials for external-dns
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: unifi-api-credentials
  namespace: {{ .Values.onepassword.unifi.namespace }}
spec:
  itemPath: {{ .Values.onepassword.unifi.itemPath | quote }}
{{- end }}
{{- if .Values.onepassword.portForwarding.enabled }}
---
# UniFi credentials for port forwarding controller
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: unifi-credentials
  namespace: {{ .Values.onepassword.portForwarding.namespace }}
spec:
  itemPath: {{ .Values.onepassword.portForwarding.itemPath | quote }}
{{- end }}
{{- if .Values.onepassword.oidc.enabled }}
---
# Google OAuth credentials for OIDC
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: google-oauth-credentials
  namespace: {{ .Values.onepassword.oidc.namespace }}
spec:
  itemPath: {{ .Values.onepassword.oidc.googleOAuthPath | quote }}
---
# OIDC session encryption key
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-session-key
  namespace: {{ .Values.onepassword.oidc.namespace }}
spec:
  itemPath: {{ .Values.onepassword.oidc.sessionKeyPath | quote }}
{{- end }}
