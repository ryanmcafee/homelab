{{- if and .Values.traefik.enabled .Values.traefik.dashboard.enabled }}
---
# DNSEndpoint for Traefik dashboard
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: traefik-dashboard
  namespace: {{ .Values.traefik.namespace }}
spec:
  endpoints:
    - dnsName: {{ .Values.traefik.dashboard.host }}
      recordType: A
      targets:
        - {{ .Values.traefik.dashboard.staticIP | quote }}
---
# Certificate for Traefik dashboard TLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: {{ .Values.traefik.namespace }}
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.traefik.dashboard.host }}
---
# Middleware to add trailing slash for dashboard
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect-slash
  namespace: {{ .Values.traefik.namespace }}
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: true
---
# IngressRoute to catch /dashboard without trailing slash and redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-redirect
  namespace: {{ .Values.traefik.namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.traefik.dashboard.host }}`) && Path(`/dashboard`)
      middlewares:
        - name: dashboard-redirect-slash
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: traefik-dashboard-tls
{{- end }}
{{- if and .Values.traefik.enabled .Values.traefik.oidc.enabled }}
---
# OIDC Authentication Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
  namespace: {{ .Values.traefik.namespace }}
spec:
  plugin:
    traefikoidc:
      providerURL: {{ .Values.traefik.oidc.providerURL | quote }}
      clientID: "urn:k8s:secret:google-oauth-credentials:client_id"
      clientSecret: "urn:k8s:secret:google-oauth-credentials:client_secret"
      callbackURL: {{ .Values.traefik.oidc.callbackURL | quote }}
      logoutURL: {{ .Values.traefik.oidc.logoutURL | quote }}
      sessionEncryptionKey: "urn:k8s:secret:oidc-session-key:oidc-session-key"
      scopes:
        {{- toYaml .Values.traefik.oidc.scopes | nindent 8 }}
      allowedUserDomains:
        {{- toYaml .Values.traefik.oidc.allowedDomains | nindent 8 }}
      cookieDomain: ".{{ .Values.global.domain }}"
      redis:
        enabled: true
        address: "oidc-redis.{{ .Values.traefik.namespace }}.svc.cluster.local:6379"
        keyPrefix: "traefikoidc:"
        cacheMode: "hybrid"
      logLevel: "debug"
      forceHTTPS: true
---
# Certificate for auth domain (OIDC callback endpoint)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: {{ .Values.traefik.namespace }}
spec:
  secretName: auth-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.traefik.oidc.host }}
---
# DNSEndpoint for auth domain
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: auth-dns
  namespace: {{ .Values.traefik.namespace }}
spec:
  endpoints:
    - dnsName: {{ .Values.traefik.oidc.host }}
      recordType: A
      targets:
        - {{ .Values.traefik.dashboard.staticIP | quote }}
---
# IngressRoute for auth domain - handles OIDC callbacks
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-oidc
  namespace: {{ .Values.traefik.namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.traefik.oidc.host }}`)
      kind: Rule
      middlewares:
        - name: oidc-auth
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    secretName: auth-tls
{{- end }}
