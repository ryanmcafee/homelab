# Homelab-specific values for addons-resources chart
# These values override the base values.yaml for the homelab environment

global:
  domain: ryanmcafee.com
  environment: homelab

# 1Password Items Configuration
onepassword:
  truenas:
    enabled: true
    namespace: democratic-csi
    itemPath: "op://homelab/truenas-api-key/credential"

  cloudflare:
    enabled: true
    itemPath: "op://homelab/cloudflare-api-token/credential"
    namespaces:
      - cert-manager
      - external-dns
      - traefik

  unifi:
    enabled: true
    namespace: external-dns-unifi
    itemPath: "op://homelab/unifi-admin/credential"

  portForwarding:
    enabled: true
    namespace: port-forwarding
    itemPath: "op://homelab/unifi-admin/credential"

  oidc:
    enabled: true
    namespace: traefik
    googleOAuthPath: "op://homelab/google-oauth/credential"
    sessionKeyPath: "op://homelab/oidc-session-key/credential"

  # OAuth2-Proxy secrets (alternative to OIDC middleware)
  oauth2Proxy:
    enabled: false  # Disabled - using Traefik OIDC instead
    namespace: oauth2-proxy
    googleOAuthPath: "op://homelab/google-oauth/credential"
    cookieSecretPath: "op://homelab/oauth2-proxy-cookie-secret/credential"

# Cert-Manager Resources
certManager:
  enabled: true
  namespace: cert-manager
  letsencrypt:
    enabled: true
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@ryanmcafee.com
  cloudflare:
    enabled: true
    email: admin@ryanmcafee.com
  dnsZones:
    - ryanmcafee.com

# Traefik Dashboard Resources
traefik:
  enabled: true
  namespace: traefik
  dashboard:
    enabled: true
    host: traefik.ryanmcafee.com
    staticIP: "172.16.100.200"
  oidc:
    enabled: true
    host: auth.ryanmcafee.com
    providerURL: https://accounts.google.com
    callbackURL: https://auth.ryanmcafee.com/oauth2/callback
    logoutURL: https://auth.ryanmcafee.com/oauth2/logout
    scopes:
      - openid
      - email
      - profile
    allowedDomains:
      - ryanmcafee.com

# OAuth2-Proxy (disabled - using Traefik OIDC instead)
oauth2Proxy:
  enabled: false
  namespace: oauth2-proxy
