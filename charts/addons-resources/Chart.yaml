# Addons Resources Chart
# This chart contains CRD-dependent resources that must be deployed AFTER
# their respective CRDs are installed by child Applications.
#
# Sync Wave Order:
# - Wave -1: 1Password operator (installs OnePasswordItem CRD)
# - Wave 0: cert-manager (installs Certificate/ClusterIssuer CRDs)
# - Wave 2: traefik (installs Middleware/IngressRoute CRDs)
# - Wave 4: external-dns (installs DNSEndpoint CRD)
# - Wave 10: THIS CHART (creates instances of those CRDs)

apiVersion: v2
name: addons-resources
description: CRD-dependent resources for homelab addons
type: application
version: 1.0.0
appVersion: "1.0"
