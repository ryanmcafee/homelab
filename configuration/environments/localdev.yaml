# ConfigSet "localdev" — Kind + Tilt local development.
# Overrides defaults.yaml with safe local values.

DOMAIN: homelab.local
GATEWAY_IP: "127.0.0.1"
TRUENAS_IP: "127.0.0.1"
PROXMOX_IP: "127.0.0.1"
CP_VIP: "127.0.0.1"
CP1_IP: "127.0.0.1"
CP2_IP: "127.0.0.1"
CP3_IP: "127.0.0.1"
WORKER1_IP: "127.0.0.1"
WORKER2_IP: "127.0.0.1"
WORKER3_IP: "127.0.0.1"
LB_POOL_START: "127.0.0.100"
LB_POOL_END: "127.0.0.200"
TRAEFIK_STATIC_IP: "127.0.0.200"
PLEX_LB_IP: "127.0.0.103"
NFS_SHARE_ALLOW: "127.0.0.0/8"
BGP_PEER_IP: "127.0.0.1"
TAILSCALE_ADVERTISE_ROUTES: "127.0.0.0/24"
NFS_BASE_PATH: /tmp/storage
NFS_MAPALL_USER: localdev
ACME_EMAIL: test@homelab.local
TRAEFIK_OIDC_ALLOWED_DOMAINS: homelab.local
DUCKDNS_SUBDOMAIN: homelab-dev
EXTERNAL_DNS_DEFAULT_TARGET: homelab-dev.duckdns.org
PAPERCLIP_ADMIN_EMAIL: admin@homelab.local

# Kind provides almost none of the homelab platform layers (see
# schema/platform.schema.yaml): Cilium is installed by scripts/localdev-kind.ts
# (no BGP, no LoadBalancer addresses), there is no external DNS, storage is
# local-path, there is no secret store, media libraries are emptyDirs and the
# letsencrypt ClusterIssuer is self-signed. Applications are not automated so
# `task localdev:sync` can push the working tree with `argocd app sync --local`
# without ArgoCD reverting it to Git. The helm templates switch on these keys,
# so the generated charts/{addons,applications}/values-localdev.yaml stays
# Kind-safe.
CNI_PROVIDER: cilium
LOAD_BALANCER_ENABLED: "false"
EXTERNAL_DNS_ENABLED: "false"
STORAGE_PROVIDER: local-path
SECRETS_PROVIDER: none
ARGOCD_AUTOMATED_SYNC: "false"
MEDIA_PROVIDER: ephemeral
CERT_ISSUER: selfsigned
STORAGE_CLASS_NFS: local-path
STORAGE_CLASS_ISCSI: local-path
STORAGE_CLASS_SSD: local-path
STORAGE_CLASS_ISCSI_SSD: local-path
