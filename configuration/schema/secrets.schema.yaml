# Secrets references — 1Password vault paths (no actual secrets, just path pointers)
keys:
  DEMOCRATIC_CSI_1P_PATH:
    description: 1Password path for TrueNAS API credentials (democratic-csi)
    required: true
    default: "vaults/homelab/items/truenas"

  TAILSCALE_OPERATOR_1P_PATH:
    description: 1Password path for the Tailscale operator OAuth client (operator-oauth Secret; client_id/client_secret fields)
    required: true
    default: "vaults/homelab/items/tailscale-operator-oauth"

  CERT_MANAGER_1P_PATH:
    description: 1Password path for Cloudflare API token (cert-manager)
    required: true
    default: "vaults/homelab/items/cloudflare"

  EXTERNAL_DNS_1P_PATH:
    description: 1Password path for Cloudflare API token (external-dns)
    required: true
    default: "vaults/homelab/items/cloudflare"

  EXTERNAL_DNS_UNIFI_1P_PATH:
    description: 1Password path for UniFi credentials (external-dns)
    required: true
    default: "vaults/homelab/items/unifi"

  GOOGLE_OAUTH_1P_PATH:
    description: 1Password path for Google OAuth client credentials
    required: true
    default: "vaults/homelab/items/google-oauth"

  UNIFI_PORT_FORWARD_1P_PATH:
    description: 1Password path for UniFi port forward credentials
    required: true
    default: "vaults/homelab/items/unifi"

  DUCKDNS_1P_PATH:
    description: 1Password path for DuckDNS API token
    required: true
    default: "vaults/homelab/items/duckdns"

  PAPERCLIP_AUTH_1P_PATH:
    description: 1Password path for the Paperclip auth item (fields BETTER_AUTH_SECRET, ADMIN_PASSWORD)
    required: true
    default: "vaults/homelab/items/paperclip-auth"

  PAPERCLIP_API_KEYS_1P_PATH:
    description: 1Password path for the Paperclip agent credentials (fields CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY, OPENAI_API_KEY, ...)
    required: true
    default: "vaults/homelab/items/paperclip-api-keys"

  PAPERCLIP_EXPORTER_1P_PATH:
    description: 1Password path for the Paperclip agent health exporter (field PAPERCLIP_API_KEY, a board API key; docs/runbooks/paperclip-agents.md)
    required: true
    default: "vaults/homelab/items/paperclip-exporter"

  ALERTMANAGER_1P_PATH:
    description: 1Password path for the Alertmanager Pushover credentials (fields pushover_token, pushover_user_key; docs/runbooks/alerting.md)
    required: true
    default: "vaults/homelab/items/alertmanager-notifications"

  CLICKHOUSE_OTEL_1P_PATH:
    description: 1Password path for the ClickHouse user the OpenTelemetry collectors write logs with (field password; docs/logging.md)
    required: true
    default: "vaults/homelab/items/clickhouse-otel"

  CLICKHOUSE_GRAFANA_1P_PATH:
    description: 1Password path for the read-only ClickHouse user of the Grafana datasource (field password; docs/logging.md)
    required: true
    default: "vaults/homelab/items/clickhouse-grafana"

  TRIAGE_AGENT_1P_PATH:
    description: 1Password path for the alert triage agent (field CLAUDE_CODE_OAUTH_TOKEN; optional GITHUB_TOKEN, DOTFILES_REPO, PAPERCLIP_API_KEY, PAPERCLIP_COMPANY_ID, SLACK_WEBHOOK_URL; docs/runbooks/triage-agent.md)
    required: true
    default: "vaults/homelab/items/triage-agent"

  GITHUB_PR_ALERTS_1P_PATH:
    description: 1Password path for the read-only GitHub token of the pull request review alerts (field token; docs/runbooks/alerting.md)
    required: true
    default: "vaults/homelab/items/github-pr-alerts"
