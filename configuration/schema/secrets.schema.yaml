# Secrets references — 1Password vault paths (no actual secrets, just path pointers)
keys:
  DEMOCRATIC_CSI_1P_PATH:
    description: 1Password path for TrueNAS API credentials (democratic-csi)
    required: true
    default: "vaults/homelab/items/truenas"

  CERT_MANAGER_1P_PATH:
    description: 1Password path for Cloudflare API token (cert-manager)
    required: true
    default: "vaults/homelab/items/cloudflare"

  EXTERNAL_DNS_1P_PATH:
    description: 1Password path for Cloudflare API token (external-dns)
    required: true
    default: "vaults/homelab/items/cloudflare"

  EXTERNAL_DNS_UNIFI_1P_PATH:
    description: 1Password path for UniFi credentials (external-dns)
    required: true
    default: "vaults/homelab/items/unifi"

  TRAEFIK_OIDC_SESSION_KEY_PATH:
    description: 1Password path for OIDC session encryption key
    required: true
    default: "vaults/homelab/items/oidc-session-key"

  TRAEFIK_GOOGLE_OAUTH_PATH:
    description: 1Password path for Google OAuth client credentials
    required: true
    default: "vaults/homelab/items/google-oauth"

  TRAEFIK_CLOUDFLARE_1P_PATH:
    description: 1Password path for Cloudflare API token (Traefik)
    required: true
    default: "vaults/homelab/items/cloudflare"

  UNIFI_PORT_FORWARD_1P_PATH:
    description: 1Password path for UniFi port forward credentials
    required: true
    default: "vaults/homelab/items/unifi"

  DUCKDNS_1P_PATH:
    description: 1Password path for DuckDNS API token
    required: true
    default: "vaults/homelab/items/duckdns"
