# Network configuration — IPs, CIDRs, BGP, load balancer pool

# Key FAMILIES, declared by key-name pattern rather than by literal name. The map
# key is the pattern; it must be anchored, and it may not be required, const or
# defaulted (internal/config.validateKeyPattern rejects all three at load).
keyPatterns:
  # The control plane, as a list. Listing your control-plane addresses IS the act
  # of stating your topology — there is deliberately no CONTROL_PLANE_COUNT key,
  # because a second key stating the same fact can disagree with the first, and
  # the operator who adds a node and forgets to bump a count gets a guard
  # refusing to proceed on a healthy cluster (ADR-035).
  #
  # This string MUST equal contracts/cluster/topology.v1.yaml
  # controlPlane.countKeyPattern. TestControlPlaneKeyPatternMatchesContract
  # asserts they are identical, so the rule has one statement and not two: a copy
  # here that drifted from the contract would be the duplication ADR-035 removed,
  # reintroduced in the file whose job is to end it.
  #
  # The capture group is the member ordinal, and it is what lets a template name
  # cp-N without re-deriving the key-name rule. Ordinals need not be contiguous:
  # CP1/CP2/CP5 is a three-member control plane, not a five-member one.
  #
  # CP_VIP is the shared virtual IP and is not a member; the anchors are what
  # keep it, WORKER1_IP and a stray OLD_CP1_IP_BACKUP out of the count.
  "^CP([0-9]+)_IP$":
    description: Control plane node IP, one key per member (CP1_IP, CP2_IP, ...)
    role: control-plane-address
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

keys:
  DOMAIN:
    description: Base domain for all services
    required: true

  GATEWAY_IP:
    description: Default gateway / router IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  LAN_CIDR:
    description: CIDR of the LAN the cluster nodes sit on. Terragrunt builds the
      VM network from it. Deliberately its own key rather than a reuse of
      NFS_SHARE_ALLOW or TAILSCALE_ADVERTISE_ROUTES - those are an export ACL and
      a route advertisement, which an operator may narrow below the LAN without
      meaning to move the cluster onto a different subnet.
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  DNS_SERVER_IP:
    description: Upstream DNS resolver the cluster nodes are configured with. Often
      the same address as GATEWAY_IP, but not always, and no default is supplied
      because a wrong resolver fails after the cluster is already built.
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  TRUENAS_IP:
    description: TrueNAS storage server IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  PROXMOX_IP:
    description: Proxmox hypervisor IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  IPMI_IP:
    description: Proxmox BMC/IPMI out-of-band management IP (documentation and
      the PII guard only; no template renders it)
    required: false
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  CP_VIP:
    description: Kubernetes control plane virtual IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  # The first control-plane address, and the only one that is individually
  # required: a control plane with no first address is a typo rather than a
  # topology, and Taskfile.yml:689 bootstraps the cluster from this key by name.
  # Every other member is admitted by the CPn_IP pattern under keyPatterns.
  CP1_IP:
    description: Control plane node 1 IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  WORKER1_IP:
    description: Worker node 1 IP (GPU node)
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  WORKER2_IP:
    description: Worker node 2 IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  WORKER3_IP:
    description: Worker node 3 IP
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  LB_POOL_START:
    description: First IP in Cilium LB IPAM pool
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  LB_POOL_END:
    description: Last IP in Cilium LB IPAM pool
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  GATEWAY_EXTERNAL_STATIC_IP:
    description: Static LoadBalancer IP of the external Envoy Gateway (WAN port forwards target it)
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  GATEWAY_INTERNAL_STATIC_IP:
    description: Static LoadBalancer IP of the internal Envoy Gateway; empty lets Cilium LB IPAM pick one
    required: false
    pattern: "^$|^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  PLEX_LB_IP:
    description: Static LoadBalancer IP for Plex
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  NFS_SHARE_ALLOW:
    description: CIDR allowed to access NFS shares
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  TAILSCALE_ADVERTISE_ROUTES:
    description: Homelab LAN CIDR advertised onto the tailnet by the Tailscale subnet router (Connector)
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  BGP_K8S_ASN:
    description: Cilium BGP autonomous system number
    required: true
    default: "64512"

  BGP_ROUTER_ASN:
    description: Upstream router BGP ASN
    required: true
    default: "64513"

  BGP_PEER_IP:
    description: BGP peer IP (upstream router)
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  # Computed hostnames — derived from DOMAIN
  TRUENAS_HOSTNAME:
    description: TrueNAS FQDN
    const: "truenas.{{.DOMAIN}}"

  ARGOCD_HOSTNAME:
    description: ArgoCD UI hostname
    const: "argocd.{{.DOMAIN}}"

  GRAFANA_HOSTNAME:
    description: Grafana dashboard hostname
    const: "grafana.{{.DOMAIN}}"

  ALERTMANAGER_HOSTNAME:
    description: Alertmanager UI hostname on the internal Gateway
    const: "alertmanager.{{.DOMAIN}}"

  WORKFLOWS_HOSTNAME:
    description: Argo Workflows hostname
    const: "workflows.{{.DOMAIN}}"

  OP_CONNECT_HOSTNAME:
    description: 1Password Connect hostname
    const: "op-connect.{{.DOMAIN}}"

  OTEL_HOSTNAME:
    description: OpenTelemetry gateway collector on its LoadBalancer address (syslog 514, NetFlow 2055, OTLP 4317/4318; docs/logging.md)
    const: "otel.{{.DOMAIN}}"

  OTLP_HOSTNAME:
    description: OTLP/HTTP with TLS through the internal ingress (docs/tracing.md)
    const: "otlp.{{.DOMAIN}}"

  HUBBLE_HOSTNAME:
    description: Hubble UI (Cilium flow visibility) on the internal ingress
    const: "hubble.{{.DOMAIN}}"

  OTEL_LB_IP:
    description: Fixed LoadBalancer address of the OpenTelemetry gateway collector (inside LB_POOL_START..LB_POOL_END); target of the UniFi syslog/NetFlow export
    required: true
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}$"

  OTEL_SOURCE_RANGES:
    description: CIDRs allowed to reach OTEL_LB_IP besides NFS_SHARE_ALLOW, comma-separated; UniFi switches, access points
      and the console send syslog from their own management addresses, not from the cluster network
    required: false
    pattern: "^$|^(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}(,(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2})*$"

  SERVICEMESH_HOSTNAME:
    description: Kiali (Istio service mesh console) hostname on the internal ingress
    const: "servicemesh.{{.DOMAIN}}"

  TRUENAS_LAN_IP:
    description: TrueNAS address on the storage LAN (VLAN 10) with prefix length, used by the Ansible inventory
    required: false
    pattern: "^(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  NETWORK_NAMES:
    description: Subnet names on the "Network flows and security" Grafana dashboard, comma-separated
      name=CIDR pairs; unnamed private addresses show as their /24
    required: false
    pattern: "^$|^[A-Za-z0-9_-]+=[0-9A-Fa-f:.]+/\\d{1,3}(,[A-Za-z0-9_-]+=[0-9A-Fa-f:.]+/\\d{1,3})*$"
