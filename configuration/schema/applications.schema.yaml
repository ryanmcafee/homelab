# Application-specific configuration — media paths, PVCs, UIDs, ports
keys:
  MEDIA_APP_UID:
    description: UID for media application processes
    required: true
    default: "568"

  MEDIA_APP_GID:
    description: GID for media application processes
    required: true
    default: "100"

  MEDIA_MOVIES_PATH:
    description: NFS path for movies library
    required: true
    const: "{{.NFS_BASE_PATH}}/movies"

  MEDIA_TV_PATH:
    description: NFS path for TV shows library
    required: true
    const: "{{.NFS_BASE_PATH}}/tv"

  MEDIA_MUSIC_PATH:
    description: NFS path for music library
    required: true
    const: "{{.NFS_BASE_PATH}}/music"

  MEDIA_PICTURES_PATH:
    description: NFS path for pictures library
    required: true
    const: "{{.NFS_BASE_PATH}}/pictures"

  MEDIA_DOWNLOADS_PATH:
    description: NFS path for downloads
    required: true
    const: "{{.NFS_BASE_PATH}}/downloads"

  MEDIA_BOOKS_PATH:
    description: NFS path for books library
    required: true
    const: "{{.NFS_BASE_PATH}}/books"

  MOSQUITTO_MQTT_PORT:
    description: Mosquitto MQTT listener port
    required: true
    default: "1883"

  MOSQUITTO_WEBSOCKET_PORT:
    description: Mosquitto WebSocket listener port
    required: true
    default: "9001"

  # Computed application hostnames — derived from DOMAIN
  PLEX_HOSTNAME:
    description: Plex Media Server hostname
    const: "plex.{{.DOMAIN}}"

  SONARR_HOSTNAME:
    description: Sonarr hostname
    const: "sonarr.{{.DOMAIN}}"

  RADARR_HOSTNAME:
    description: Radarr hostname
    const: "radarr.{{.DOMAIN}}"

  PROWLARR_HOSTNAME:
    description: Prowlarr hostname
    const: "prowlarr.{{.DOMAIN}}"

  NZBGET_HOSTNAME:
    description: NZBGet hostname
    const: "nzbget.{{.DOMAIN}}"

  TAUTULLI_HOSTNAME:
    description: Tautulli hostname
    const: "tautulli.{{.DOMAIN}}"

  LAZYLIBRARIAN_HOSTNAME:
    description: LazyLibrarian hostname
    const: "lazylibrarian.{{.DOMAIN}}"

  HOMEASSISTANT_HOSTNAME:
    description: Home Assistant hostname
    const: "homeassistant.{{.DOMAIN}}"

  PAPERCLIP_HOSTNAME:
    description: Paperclip hostname
    const: "paperclip.{{.DOMAIN}}"

  OPENCLAW_HOSTNAME:
    description: OpenClaw hostname on the internal Gateway; no route is attached to that Gateway, so nothing serves this name (docs/apps/openclaw.md Exposure)
    const: "openclaw.{{.DOMAIN}}"

  OPENCLAW_TAILNET_EXPOSURE:
    description: Expose the OpenClaw Control UI on a tailnet-only Ingress served by the Tailscale operator; needs OPENCLAW_TAILNET_HOSTNAME, OPENCLAW_TAILNET_TAG and a tailnet policy grant for that tag (docs/runbooks/openclaw-tailnet-access.md)
    required: true
    default: "false"
    enum:
      - "true"
      - "false"

  OPENCLAW_TAILNET_HOSTNAME:
    description: MagicDNS name the Control UI answers on when OPENCLAW_TAILNET_EXPOSURE is true; the tailnet name is PII, so set it per environment and never commit a real one
    required: false
    pattern: "^$|^[a-z0-9-]+(\\.[a-z0-9-]+)*\\.ts\\.net$"

  OPENCLAW_TAILNET_TAG:
    description: Tailnet ACL tag the Control UI's proxy device carries when OPENCLAW_TAILNET_EXPOSURE is true; must be openclaw's own tag, not the subnet router's tag:k8s, so a grant cannot reach both
    required: false
    pattern: "^$|^tag:[a-z0-9-]+$"

  OPENCLAW_STORAGE_SIZE:
    description: Size of the OpenClawInstance data volume (agent workspace, openclaw.json, browser profiles); Kind always uses 1Gi
    required: true
    default: 20Gi

  PAPERCLIP_ADMIN_EMAIL:
    description: Login e-mail of the Paperclip admin the operator bootstraps once (spec.auth.adminUser); PII, set per environment
    required: true

  PAPERCLIP_DOTFILES_REPO_URL:
    description: https clone URL of a dotfiles repository whose Claude Code setup the Paperclip agents use (charts/paperclip dotfiles); empty keeps the image's stock configuration
    required: false
    pattern: "^$|^https://"

  PAPERCLIP_DOTFILES_REF:
    description: Branch, tag or commit of PAPERCLIP_DOTFILES_REPO_URL
    required: true
    default: main

  PAPERCLIP_DOTFILES_CLAUDE_DIR:
    description: Directory in the dotfiles repository that mirrors ~/.claude
    required: true
    default: claude

  PAPERCLIP_DOTFILES_PROFILE:
    description: Profile name exported to PAPERCLIP_DOTFILES_SETUP_COMMAND as DOTFILES_PROFILE
    required: false

  PAPERCLIP_DOTFILES_SETUP_COMMAND:
    description: sh command run in the dotfiles checkout before ~/.claude is linked (e.g. render settings.json from a profile)
    required: false

  PAPERCLIP_MCP_CODESEARCH:
    description: Install codesearch (configuration/versions.yaml tools.codesearch) and register it as a Paperclip agent MCP server
    required: true
    default: "false"
    enum:
      - "true"
      - "false"

  PAPERCLIP_CODESEARCH_REPO:
    description: GitHub repository URL whose releases publish codesearch-linux-x86_64.tar.gz for PAPERCLIP_MCP_CODESEARCH
    required: true
    default: https://github.com/ryanmcafee/codesearch
    pattern: "^https://"

  PAPERCLIP_CODESEARCH_VERSION:
    description: codesearch release tag of PAPERCLIP_CODESEARCH_REPO; empty uses configuration/versions.yaml tools.codesearch (the pin for the default repository)
    required: false

  # PVC names — per-app persistent volume claims
  PLEX_CONFIG_PVC:
    description: PVC name for Plex config
    required: true
    default: "plex-config-iscsi"

  SONARR_CONFIG_PVC:
    description: PVC name for Sonarr config
    required: true
    default: "sonarr-config"

  RADARR_CONFIG_PVC:
    description: PVC name for Radarr config
    required: true
    default: "radarr-config"

  PROWLARR_CONFIG_PVC:
    description: PVC name for Prowlarr config
    required: true
    default: "prowlarr-config"

  NZBGET_CONFIG_PVC:
    description: PVC name for NZBGet config
    required: true
    default: "nzbget-config"

  TAUTULLI_CONFIG_PVC:
    description: PVC name for Tautulli config
    required: true
    default: "tautulli-config"

  LAZYLIBRARIAN_CONFIG_PVC:
    description: PVC name for LazyLibrarian config
    required: true
    default: "lazylibrarian-config"

  HOMEASSISTANT_CONFIG_PVC:
    description: PVC name for Home Assistant config
    required: true
    default: "homeassistant-config"

  MOSQUITTO_CONFIG_PVC:
    description: PVC name for Mosquitto config
    required: true
    default: "mosquitto-config"

  MOSQUITTO_DATA_PVC:
    description: PVC name for Mosquitto data
    required: true
    default: "mosquitto-data"

  MOSQUITTO_CONFIGINC_PVC:
    description: PVC name for Mosquitto config includes
    required: true
    default: "mosquitto-configinc"

  FLARESOLVERR_CONFIG_PVC:
    description: PVC name for FlareSolverr config
    required: true
    default: "flaresolverr-config"

  GRAFANA_CONFIG_PVC:
    description: PVC name for Grafana config
    required: true
    default: "grafana-config"
