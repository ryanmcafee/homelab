# Kubernetes cluster settings — storage classes, ingress, timezone.
# The pod and service CIDRs are not keys here: Talos sets them in the machine
# config (terragrunt talos-cluster) and Kind in localdev/kind-config.yaml.
keys:
  CLUSTER_NAME:
    description: Kubernetes/Talos cluster name. A default is safe here - "homelab"
      is the project's own name, not an operator's - but it is still a key so a
      fork can name its cluster without editing a committed .hcl file.
    required: true
    default: homelab

  STORAGE_CLASS_NFS:
    description: StorageClass name for NFS volumes
    required: true
    default: "democratic-csi-nfs"

  STORAGE_CLASS_ISCSI:
    description: StorageClass name for iSCSI HDD volumes
    required: true
    default: "democratic-csi-iscsi-hdd"

  STORAGE_CLASS_SSD:
    description: StorageClass name for NFS volumes on the SSD pool (files appear owned by the NFS mapall user, so not for databases)
    required: true
    default: "democratic-csi-ssd"

  STORAGE_CLASS_ISCSI_SSD:
    description: StorageClass name for iSCSI (block, ext4) volumes on the SSD pool; ownership-sensitive data such as PostgreSQL and SQLite
    required: true
    default: "democratic-csi-iscsi"

  GATEWAY_NAMESPACE:
    description: Namespace of the Envoy Gateway controller, both Gateways and their Envoy proxies
    required: true
    default: "envoy-gateway-system"

  GATEWAY_EXTERNAL:
    description: Name of the external Gateway (and its GatewayClass); routes published to the internet attach to it
    required: true
    default: "envoy-external"

  GATEWAY_INTERNAL:
    description: Name of the internal Gateway (and its GatewayClass); LAN and tailnet routes attach to it
    required: true
    default: "envoy-internal"

  TIMEZONE:
    description: Default timezone for all workloads
    required: true
    default: "America/New_York"

  SERVICE_MESH_AMBIENT_NAMESPACES:
    description: Comma-separated namespaces of the applications chart enrolled in the Istio ambient mesh (label istio.io/dataplane-mode=ambient); "none" enrolls none (docs/service-mesh.md)
    required: true
    default: "paperclip"

  SERVICE_MESH_WAYPOINT_NAMESPACES:
    description: Comma-separated enrolled namespaces that get a waypoint proxy (Gateway waypoint, L7 metrics and spans for every Service in them, ingress traffic included); "none" deploys none
    required: true
    default: "paperclip"

  NATS_SERVER_REPLICAS:
    description: NATS server pods. 1 runs JetStream non-clustered; 3 or more forms a clustered meta-group. Must be at least NATS_STREAM_REPLICAS.
    required: true
    default: "3"

  NATS_STREAM_REPLICAS:
    description: JetStream replicas per stream. Stream sizing is operator-supplied, not contract (contracts/events/subjects.v1.yaml replicas_defaults); 1 is the homelab default because a non-clustered server refuses more with "replicas > 1 not supported in non-clustered mode (10074)".
    required: true
    default: "1"

  NATS_TENANT:
    description: Tenant token the bus account is named for; the account is TENANT_<token>, upper-cased with "-" mapped to "_" (ADR-043 D12). "local" is the reserved homelab tenant.
    required: true
    default: "local"

  NATS_PRINCIPAL_NKEYS:
    description: PUBLIC user nkeys for the bus principals in contracts/events/bus-principals.v1.yaml, as comma-separated "<principal>=<public key>" pairs. Empty leaves the bus anonymous; one pair renders the accounts block and the server stops accepting an unauthenticated connection, so every principal a workload runs as must appear before it is set. Never a seed - a public key is not a secret, and the private seeds reach workloads as Secrets through External Secrets.
    required: false
    default: ""

  NATS_SYSTEM_ACCOUNT_NKEY:
    description: PUBLIC nkey of the break-glass $SYS user, and a USER key (U...) rather than an account key - charts/addons renders it into accounts.$SYS.users[].nkey, which is a user position. Empty declares $SYS with no user at all, which is what ADR-043 D4 means by system_account_principals being empty - no platform component holds the system account, NACK included.
    required: false
    default: ""

  NATS_CREDENTIALS_1P_PATH:
    description: 1Password vault path the per-principal seed items live under, e.g. vaults/Platform/items. Each item is named nats-principal-<principal> and carries that principal's PRIVATE seed in a field labelled nats.nk; the 1Password operator turns each into the matching Secret. Required once NATS_PRINCIPAL_NKEYS is set on a surface with SECRETS_PROVIDER=onepassword, because the accounts block refuses to render while a public key has no seed source. The $SYS seed is deliberately NOT here - it needs a separate restricted item and an offline copy (docs/runbooks/nats-credentials.md).
    required: false
    default: ""

  NATS_BOX_PRINCIPALS:
    description: Comma-separated principals nats-box gets a named context for, each needing its private seed in the Secret nats-principal-<principal> under key nats.nk. Empty while NATS_PRINCIPAL_NKEYS is set means nats-box has no credential and is not deployed, rather than a pod that cannot connect.
    required: false
    default: ""
