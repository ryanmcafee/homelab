# Kubernetes cluster settings — storage classes, ingress, timezone.
# The pod and service CIDRs are not keys here: Talos sets them in the machine
# config (terragrunt talos-cluster) and Kind in localdev/kind-config.yaml.
keys:
  STORAGE_CLASS_NFS:
    description: StorageClass name for NFS volumes
    required: true
    default: "democratic-csi-nfs"

  STORAGE_CLASS_ISCSI:
    description: StorageClass name for iSCSI HDD volumes
    required: true
    default: "democratic-csi-iscsi-hdd"

  STORAGE_CLASS_SSD:
    description: StorageClass name for NFS volumes on the SSD pool (files appear owned by the NFS mapall user, so not for databases)
    required: true
    default: "democratic-csi-ssd"

  STORAGE_CLASS_ISCSI_SSD:
    description: StorageClass name for iSCSI (block, ext4) volumes on the SSD pool; ownership-sensitive data such as PostgreSQL and SQLite
    required: true
    default: "democratic-csi-iscsi"

  INGRESS_CLASS_EXTERNAL:
    description: IngressClass name for externally-facing services
    required: true
    default: "external"

  INGRESS_CLASS_INTERNAL:
    description: IngressClass name for internal services
    required: true
    default: "internal"

  TIMEZONE:
    description: Default timezone for all workloads
    required: true
    default: "America/New_York"
