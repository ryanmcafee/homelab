---
# TrueNAS Group Variables

# LAN Network Configuration (VLAN 10); the address (truenas_lan_static_ip) is
# in the rendered inventory (TRUENAS_LAN_IP in configuration/)
truenas_lan_network_enabled: true

# API key and admin password come from the environment (op run --env-file=.env.op)
truenas_api_key: "{{ lookup('env', 'TRUENAS_API_KEY') | default('') }}"

# Admin password for Basic Auth (required by LAN config task)
truenas_admin_password: "{{ lookup('env', 'TRUENAS_ADMIN_PASSWORD') | default('') }}"
truenas_verify_ssl: false
