---
# Proxmox-specific variables

# Proxmox Configuration
proxmox_version: "8.x"
proxmox_enterprise: false  # Use community repos

# Post-Install Script Configuration
proxmox_post_install_script_url: "https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/tools/pve/post-pve-install.sh"
proxmox_post_install_script_checksum_url: "https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main/tools/pve/post-pve-install.sh.sha256"

# Required Packages
proxmox_packages:
  - rsync
  - htop
  - iotop
  - vim
  - curl
  - wget
  - git
  - tmux
  - net-tools
  - ipmitool

# StorCLI Configuration
storcli_package_path: "{{ playbook_dir }}/../files/storcli_007.2705.0000.0000_all.deb"
storcli_install_path: /opt/MegaRAID/storcli
storcli_binary: "{{ storcli_install_path }}/storcli64"
# HBA Firmware Configuration (Phase 24)
storcli_firmware_update: true  # Enabled by default - will be no-op if same version already installed
storcli_firmware_package_dir: "{{ playbook_dir }}/../files/firmware/hba_9400-8i/9400_8i_Pkg_P24_SAS_SATA_NVMe_FW_BIOS_UEFI"
storcli_firmware_profile: "Mixed_Profile"  # Supports SAS, SATA, and NVMe drives
storcli_firmware_version: "24.00.00.00"
storcli_bios_version: "09.47.00.00"

# IPMI Fan Configuration
# Noctua fan thresholds for Supermicro motherboards
# Reference: https://calvin.me/quick-how-to-decrease-ipmi-fan-threshold/
ipmi_fan_thresholds:
  - fan: FAN1
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400
  - fan: FAN2
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400
  - fan: FAN3
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400
  - fan: FAN4
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400
  - fan: FANA
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400
  - fan: FANB
    lower_critical: 200
    lower_non_critical: 300
    lower_non_recoverable: 400

# Network Bridge Configuration
proxmox_network_bridge: vmbr0
proxmox_vlan_aware: true
proxmox_mtu: 1500

# Physical uplink interface (bridge member)
proxmox_uplink_interface: nic1

# VLANs to trunk on the physical uplink
# These VLANs will be allowed to pass through to VMs
proxmox_trunk_vlans:
  - 10   # LAN/IoT VLAN (TrueNAS secondary NIC)
  - 100  # Homelab VLAN (Kubernetes, VMs)

# VLAN Package Configuration
# Set to specific version if default conflicts (e.g., "1.9-3.2")
# Leave undefined to try latest available version
# vlan_package_version: "1.9-3.2"
vlan_package_required: false  # Set to true to fail if vlan package can't be installed

# ZFS Configuration
zfs_pool_name: vm-storage
zfs_pool_type: mirror
zfs_pool_devices: "{{ vm_storage_drives }}"
zfs_pool_ashift: 12  # 4K sectors
zfs_pool_compression: lz4
zfs_pool_atime: false
