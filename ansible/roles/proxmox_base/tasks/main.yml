---
# Proxmox base configuration role
# Handles common Proxmox host configuration tasks

- name: Ensure Proxmox is installed
  ansible.builtin.command:
    cmd: pveversion
  register: pve_version
  changed_when: false
  failed_when: pve_version.rc != 0

- name: Display Proxmox version
  ansible.builtin.debug:
    msg: "Proxmox version: {{ pve_version.stdout }}"

- name: Disable enterprise repository (if not licensed)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^deb https://enterprise.proxmox.com'
    line: '#deb https://enterprise.proxmox.com/debian/pve trixie pve-enterprise'
    state: present
    create: true
    mode: '0644'
  when: not proxmox_enterprise | default(false) | bool

- name: Add Proxmox no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription"
    state: present
    filename: pve-no-subscription
  when: not proxmox_enterprise | default(false) | bool

- name: Update apt cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: not proxmox_enterprise | default(false) | bool

- name: Ensure required system directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/systemd/system
    - /opt
    - /var/log/ansible

- name: Configure kernel modules for virtualization
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    state: present
    create: true
    mode: '0644'
  loop:
    - kvm
    - kvm_intel

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - kvm
    - kvm_intel
  failed_when: false

- name: Enable and start pve-cluster service
  ansible.builtin.systemd:
    name: pve-cluster
    state: started
    enabled: true

- name: Enable and start pvedaemon service
  ansible.builtin.systemd:
    name: pvedaemon
    state: started
    enabled: true

- name: Enable and start pveproxy service
  ansible.builtin.systemd:
    name: pveproxy
    state: started
    enabled: true

- name: Configure logrotate for Proxmox logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/proxmox-ansible
    content: |
      /var/log/ansible/*.log {
          daily
          missingok
          rotate 7
          compress
          delaycompress
          notifempty
          create 0644 root root
      }
    mode: '0644'
