# TrueNAS Storage Role - Main Tasks
# Configures TrueNAS storage after VM installation

- name: Wait for TrueNAS API availability
  ansible.builtin.uri:
    url: "{{ truenas_api_url }}/api/v2.0/system/info"
    method: GET
    headers:
      Authorization: "Bearer {{ truenas_api_key }}"
    validate_certs: "{{ truenas_verify_ssl }}"
    status_code: 200
  register: truenas_api_check
  until: truenas_api_check.status == 200
  retries: "{{ (truenas_api_wait_timeout / truenas_api_retry_delay) | int }}"
  delay: "{{ truenas_api_retry_delay }}"
  when: truenas_api_key | length > 0

- name: Display TrueNAS system info
  ansible.builtin.debug:
    msg: "TrueNAS Version: {{ truenas_api_check.json.version }}"
  when: truenas_api_check is defined and truenas_api_check.json is defined

# Full automation tasks (run in order)
- name: Include network configuration
  ansible.builtin.include_tasks: configure_network.yml
  when: truenas_configure_network | default(false)

- name: Include automation user creation
  ansible.builtin.include_tasks: create_automation_user.yml
  when: truenas_automation_user_enabled | default(false)

- name: Include pool creation
  ansible.builtin.include_tasks: create_pools.yml
  when: truenas_create_pools | default(false)

- name: Include ACME certificate configuration
  ansible.builtin.include_tasks: configure_acme_certificate.yml
  when: truenas_acme_enabled | default(false)

# Pool tasks
- name: Include pool creation tasks
  ansible.builtin.include_tasks: create_pool.yml
  when: truenas_create_pool | default(false)

# Dataset tasks
- name: Include Kubernetes dataset creation
  ansible.builtin.include_tasks: create_dataset.yml
  vars:
    dataset_name: "{{ truenas_k8s_dataset }}"
    dataset_quota: "{{ truenas_k8s_quota }}"
    dataset_compression: "{{ truenas_k8s_compression }}"
    dataset_comments: "Kubernetes persistent volumes"

- name: Include Kubernetes snapshots dataset creation
  ansible.builtin.include_tasks: create_dataset.yml
  vars:
    dataset_name: "{{ truenas_k8s_snapshots_dataset }}"
    dataset_quota: "{{ truenas_k8s_snapshots_quota }}"
    dataset_compression: "{{ truenas_k8s_snapshots_compression }}"
    dataset_comments: "Kubernetes snapshots for democratic-csi"

- name: Include media dataset creation
  ansible.builtin.include_tasks: create_dataset.yml
  vars:
    dataset_name: "{{ truenas_media_dataset }}"
    dataset_quota: "{{ truenas_media_quota }}"
    dataset_compression: "{{ truenas_media_compression }}"
    dataset_comments: "Media storage"

- name: Include additional dataset creation
  ansible.builtin.include_tasks: create_dataset.yml
  loop: "{{ truenas_datasets }}"
  loop_control:
    loop_var: dataset
  vars:
    dataset_name: "{{ dataset.name }}"
    dataset_quota: "{{ dataset.quota }}"
    dataset_compression: "{{ dataset.compression }}"
    dataset_comments: "{{ dataset.comments | default('') }}"

# NFS share tasks
- name: Include NFS share creation for Kubernetes
  ansible.builtin.include_tasks: create_nfs_share.yml
  vars:
    nfs_path: "{{ truenas_nfs_share_path }}"
    nfs_comment: "Kubernetes NFS storage"
    nfs_networks: "{{ truenas_nfs_allowed_networks }}"
    nfs_maproot_user: "{{ truenas_nfs_maproot_user }}"
    nfs_maproot_group: "{{ truenas_nfs_maproot_group }}"

# API key for democratic-csi
- name: Include API key creation for democratic-csi
  ansible.builtin.include_tasks: create_api_key.yml
  vars:
    api_key_name: "{{ truenas_csi_api_key_name }}"

# iSCSI tasks (optional)
- name: Include iSCSI configuration
  ansible.builtin.include_tasks: create_iscsi_target.yml
  when: truenas_iscsi_enabled | default(false)

- name: Display configuration summary
  ansible.builtin.debug:
    msg: |
      TrueNAS Configuration Complete:
      - Pool: {{ truenas_pool_name }}
      - Kubernetes Dataset: {{ truenas_k8s_dataset }}
      - Kubernetes Snapshots Dataset: {{ truenas_k8s_snapshots_dataset }}
      - NFS Share: {{ truenas_nfs_share_path }}
      - API Key Created: {{ truenas_csi_api_key_name }}
