---
# Proxmox post-installation playbook
# Executes community post-install script and installs essential packages
# Reference: https://github.com/community-scripts/ProxmoxVE

- name: Proxmox Post-Installation Configuration
  hosts: proxmox
  gather_facts: true
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"

  roles:
    - role: proxmox_base

  # The community post-install script used to run here, gated on the
  # pve-no-subscription repo file. The proxmox_base role creates that file
  # before this section runs, so the script never executed; the role does the
  # repository work, and the script tasks are gone.
  tasks:
    - name: Update all packages (if enabled)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      when: apt_upgrade | default(false) | bool

    - name: Install essential packages
      ansible.builtin.apt:
        name: "{{ proxmox_packages }}"
        state: present
        update_cache: true

    - name: Configure timezone
      community.general.timezone:
        name: "{{ timezone | default('UTC') }}"

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: apt_upgrade | default(false) | bool
